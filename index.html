<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ROOT DONATE • SOCIAL NODE</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    :root {
      --neon: #ffd700;
      --glow: #ffd70088;
      --bg: #0a0a0a;
      --card: rgba(20,20,15,0.95);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Courier New', monospace;
      background: var(--bg);
      color: var(--neon);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    canvas#matrix { position: fixed; inset: 0; z-index: -1; opacity: 0.15; }

    .header {
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255,215,0,0.3);
      background: rgba(10,10,10,0.98);
    }
    .header h1 { font-size: 1.5rem; letter-spacing: 3px; text-shadow: 0 0 15px var(--neon); }

    .learn-btn {
      padding: 8px 16px;
      background: transparent;
      border: 1px solid var(--neon);
      color: var(--neon);
      border-radius: 50px;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .user-info { display: flex; align-items: center; gap: 12px; cursor: pointer; }
    .avatar {
      width: 38px; height: 38px;
      background: #222;
      border: 2px solid var(--neon);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
    }

    .nav {
      padding: 12px 20px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      border-bottom: 1px solid rgba(255,215,0,0.2);
      background: rgba(10,10,10,0.98);
    }
    .nav button {
      background: transparent;
      border: 1px solid var(--neon);
      color: var(--neon);
      padding: 10px 20px;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s;
    }
    .nav button.active, .nav button:hover {
      background: var(--neon);
      color: #000;
      box-shadow: 0 0 25px var(--glow);
    }

    .search-bar {
      margin: 16px 20px;
      padding: 14px 24px;
      width: calc(100% - 40px);
      background: #111;
      border: 1px solid var(--neon);
      border-radius: 50px;
      color: var(--neon);
    }

    .nodes-grid {
      flex: 1;
      padding: 16px 20px;
      overflow-y: auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }

    .node-card {
      background: var(--card);
      border: 1px solid rgba(255,215,0,0.35);
      border-radius: 16px;
      padding: 18px;
      cursor: pointer;
      transition: all 0.4s;
    }
    .node-card:hover {
      transform: translateY(-4px);
      border-color: var(--neon);
      box-shadow: 0 0 25px var(--glow);
    }

    .log {
      height: 140px;
      background: #0a0a0a;
      padding: 12px 20px;
      overflow-y: auto;
      font-size: 0.85rem;
      border-top: 1px solid rgba(255,215,0,0.3);
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.96);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 10px;
    }
    .modal-content {
      background: rgba(20,20,15,0.98);
      border: 2px solid var(--neon);
      border-radius: 16px;
      width: 100%;
      max-width: 520px;
      padding: 28px;
      position: relative;
    }

    .auth-tabs {
      display: flex;
      margin-bottom: 20px;
      border-bottom: 1px solid #333;
    }
    .auth-tabs button {
      flex: 1;
      padding: 12px;
      background: transparent;
      color: var(--neon);
      border: none;
      border-bottom: 3px solid transparent;
      cursor: pointer;
    }
    .auth-tabs button.active {
      border-bottom: 3px solid var(--neon);
      font-weight: bold;
    }

    .decentralised-badge {
      position: fixed;
      bottom: 16px;
      right: 16px;
      background: rgba(0,0,0,0.85);
      border: 1px solid var(--neon);
      color: var(--neon);
      padding: 8px 14px;
      border-radius: 30px;
      font-size: 0.78rem;
      z-index: 200;
    }
  </style>
</head>
<body>

  <canvas id="matrix"></canvas>

  <div class="header">
    <h1>🌐 ROOT DONATE <span style="font-size:0.75rem;opacity:0.7;"></span></h1>
    <div style="display:flex; align-items:center; gap:12px;">
      <button class="learn-btn" onclick="toggleLearnMode()">📖 LEARN MODE</button>
      <div id="userSection" style="display:none;">
        <div class="user-info" onclick="showProfile()">
          <div id="avatar" class="avatar">👤</div>
          <div>
            <div id="usernameDisplay" style="font-size:1rem;"></div>
            <div style="font-size:0.75rem; opacity:0.7;">Mesh Node</div>
          </div>
        </div>
      </div>
      <button onclick="showAuthModal()" id="authBtn"
              style="padding:8px 20px; border:1px solid var(--neon); background:transparent; color:var(--neon); border-radius:50px;">
        <i class="fas fa-user"></i> LOGIN
      </button>
    </div>
  </div>

  <div class="nav">
    <button class="active" onclick="setTab(0)">🌐 LIVE FEED</button>
    <button onclick="setTab(1)">🔎 DEEP NUMIS</button>
    <button onclick="showReportModal()">📢 REPORT FIND</button>
    <button onclick="resetScan()">RESET MESH</button>
  </div>

  <input type="text" id="searchInput" class="search-bar" 
         placeholder="Search coins, notes, mints, eras..." onkeyup="filterNodes()">

  <div class="nodes-grid" id="grid"></div>
  <div class="log" id="log"></div>

  <!-- AUTH MODAL -->
  <div class="modal" id="authModal">
    <div class="modal-content">
      <span onclick="closeAuthModal()" style="position:absolute;top:12px;right:20px;font-size:2.5rem;cursor:pointer;color:var(--neon);">×</span>
      <div class="auth-tabs">
        <button onclick="switchAuthTab(0)" id="tabLogin" class="active">LOGIN</button>
        <button onclick="switchAuthTab(1)" id="tabSignup">SIGN UP</button>
      </div>
      <div id="loginForm">
        <input id="loginUser" placeholder="Username or Handle" style="width:100%;padding:14px;margin:10px 0;background:#111;border:1px solid var(--neon);color:var(--neon);">
        <input id="loginPass" type="password" placeholder="Passphrase" style="width:100%;padding:14px;margin:10px 0;background:#111;border:1px solid var(--neon);color:var(--neon);">
        <button onclick="login()" style="width:100%;padding:16px;margin-top:15px;border:2px solid var(--neon);background:transparent;color:var(--neon);border-radius:50px;">
          ENTER THE MESH
        </button>
      </div>
      <div id="signupForm" style="display:none;">
        <input id="signupUser" placeholder="Choose handle (e.g. @cybermidas)" style="width:100%;padding:14px;margin:10px 0;background:#111;border:1px solid var(--neon);color:var(--neon);">
        <input id="signupPass" type="password" placeholder="Create passphrase" style="width:100%;padding:14px;margin:10px 0;background:#111;border:1px solid var(--neon);color:var(--neon);">
        <button onclick="signup()" style="width:100%;padding:16px;margin-top:15px;border:2px solid var(--neon);background:transparent;color:var(--neon);border-radius:50px;">
          JOIN THE DECENTRALISED MESH
        </button>
      </div>
    </div>
  </div>

  <!-- ITEM DETAIL MODAL -->
  <div class="modal" id="itemModal">
    <div class="modal-content">
      <span onclick="closeItemModal()" style="position:absolute;top:12px;right:20px;font-size:2.5rem;cursor:pointer;color:var(--neon);">×</span>
      <div id="modalIcon" style="font-size:2.8rem;margin-bottom:12px;">🪙</div>
      <h2 id="modalName" style="color:#ffd700;margin-bottom:12px;"></h2>
      <p id="modalLoc" style="margin:8px 0;"></p>
      <p id="modalTime"></p>
      <div style="margin:20px 0;padding:14px;background:#111;border:1px solid var(--neon);font-size:0.9rem;">
        <strong>EST. VALUE:</strong> <span id="modalValue" style="color:#0f0;"></span><br>
        <strong>MINT / ORIGIN:</strong> <span id="modalMint"></span>
      </div>
      <div id="shareUrl" style="background:#111;padding:14px;margin:20px 0;border:1px solid var(--neon);word-break:break-all;font-size:0.9rem;"></div>
      <button onclick="copyShareLink()" style="width:100%;padding:14px;border:2px solid var(--neon);background:transparent;color:var(--neon);border-radius:50px;">
        📋 COPY DECENTRALISED LINK
      </button>
    </div>
  </div>

  <!-- REPORT MODAL -->
  <div class="modal" id="reportModal">
    <div class="modal-content">
      <span onclick="closeReportModal()" style="position:absolute;top:12px;right:20px;font-size:2.5rem;cursor:pointer;color:var(--neon);">×</span>
      <h2 style="text-align:center;color:#ffd700;margin-bottom:20px;">📜 BROADCAST NEW FIND</h2>
      <input id="rName" placeholder="Coin / Note name" style="width:100%;padding:14px;margin:10px 0;background:#111;border:1px solid var(--neon);color:var(--neon);">
      <input id="rLoc" placeholder="Mint / Location / Era / Seizure" style="width:100%;padding:14px;margin:10px 0;background:#111;border:1px solid var(--neon);color:var(--neon);">
      <input id="rValue" placeholder="Est. market value (USD)" style="width:100%;padding:14px;margin:10px 0;background:#111;border:1px solid var(--neon);color:var(--neon);">
      <textarea id="rDesc" rows="3" placeholder="Description / Condition / Notes..." style="width:100%;padding:14px;margin:10px 0;background:#111;border:1px solid var(--neon);color:var(--neon);"></textarea>
      <button onclick="submitReport()" style="width:100%;padding:16px;margin-top:15px;border:2px solid var(--neon);background:transparent;color:var(--neon);border-radius:50px;">
        BROADCAST TO THE MESH
      </button>
    </div>
  </div>

  <div class="decentralised-badge">
    <i class="fas fa-globe"></i> OPEN SOURCE • CLIENT-SIDE • LEARNING LAB
  </div>

  <script>
    /* ================================================================
       SOCIAL NODE LEARNING LAB
       ================================================================
       This project teaches you how to build a basic decentralized 
       social network node using only HTML, CSS, and JavaScript.

       Key Concepts You Will Learn:
       • User Identity System (Sign Up / Login)
       • Content Creation & Broadcasting
       • Local Persistence (localStorage)
       • Simulated P2P Mesh (Auto Scan)
       • Shareable Decentralized Links
       • Client-side Architecture
    ================================================================ */

    // === MATRIX BACKGROUND ===
    const canvas = document.getElementById('matrix');
    const ctx = canvas.getContext('2d');
    let drops = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      drops = Array(Math.floor(canvas.width / 14)).fill(1);
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function drawMatrix() {
      ctx.fillStyle = 'rgba(10,10,10,0.15)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#ffd700';
      ctx.font = '14px monospace';
      const chars = '0123456789$€£¥₿🪙⚖️📜🔓💰';
      for (let i = 0; i < drops.length; i++) {
        ctx.fillText(chars[Math.floor(Math.random()*chars.length)], i*14, drops[i]*14);
        if (drops[i]*14 > canvas.height && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
      }
    }
    setInterval(drawMatrix, 40);

    // === APP STATE ===
    let allNodes = [];
    let currentUser = null;
    let currentItem = null;
    let learnMode = false;

    const logEl = document.getElementById('log');
    function log(msg) {
      const time = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', second:'2-digit'});
      logEl.innerHTML += `<span style="opacity:0.5">[${time}]</span> ${msg}<br>`;
      logEl.scrollTop = logEl.scrollHeight;
    }

    function toggleLearnMode() {
      learnMode = !learnMode;
      alert(learnMode ? 
        "📖 LEARN MODE ENABLED\n\n    /* ================================================================
       SOCIAL NODE LEARNING LAB
       ================================================================
       This project teaches you how to build a basic decentralized 
       social network node using only HTML, CSS, and JavaScript.

       Key Concepts You Will Learn:
       • User Identity System (Sign Up / Login)
       • Content Creation & Broadcasting
       • Local Persistence (localStorage)
       • Simulated P2P Mesh (Auto Scan)
       • Shareable Decentralized Links
       • Client-side Architecture
    ================================================================ */" : 
        "📖 Learn Mode Disabled");
    }

    // === SHAREABLE LINKS ===
    function toBase64Url(obj) {
      const str = btoa(unescape(encodeURIComponent(JSON.stringify(obj))));
      return str.replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
    }
    function fromBase64Url(str) {
      str = str.replace(/-/g,'+').replace(/_/g,'/');
      while (str.length % 4) str += '=';
      try { return JSON.parse(decodeURIComponent(escape(atob(str)))); }
      catch(e) { return null; }
    }

    function generateShareUrl(node) {
      const minimal = {id:node.id, name:node.name, loc:node.loc, value:node.value, time:node.time, icon:node.icon};
      return `${location.origin}${location.pathname}#${toBase64Url(minimal)}`;
    }

    // === RENDER SOCIAL FEED ===
    function renderNodes(filtered = allNodes) {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = 'node-card';
        card.innerHTML = `
          <div style="font-size:0.8rem;opacity:0.7;">#${item.id} • ${item.source}</div>
          <div style="font-size:2.5rem;margin:12px 0;">${item.icon}</div>
          <h3 style="margin:8px 0;">${item.name}</h3>
          <p>📍 ${item.loc}</p>
          <p style="margin-top:8px;color:#0f0;">${item.value}</p>
          <p style="font-size:0.85rem;">${item.time} • ${item.status}</p>
        `;
        card.onclick = () => showItemDetail(item);
        grid.appendChild(card);
      });
    }

    function showItemDetail(item) {
      currentItem = item;
      document.getElementById('modalIcon').textContent = item.icon;
      document.getElementById('modalName').textContent = item.name;
      document.getElementById('modalLoc').innerHTML = `📍 ${item.loc}`;
      document.getElementById('modalTime').textContent = item.time;
      document.getElementById('modalValue').textContent = item.value;
      document.getElementById('modalMint').textContent = item.mint || 'Unknown';

      const url = generateShareUrl(item);
      document.getElementById('shareUrl').innerHTML = `<strong>DECENTRALISED LINK:</strong><br><a href="${url}" target="_blank" style="color:var(--neon);">${url}</a>`;
      document.getElementById('itemModal').style.display = 'flex';
    }

    function copyShareLink() {
      if (!currentItem) return;
      navigator.clipboard.writeText(generateShareUrl(currentItem));
      alert("✅ Decentralised link copied to clipboard!");
    }

    function closeItemModal() { document.getElementById('itemModal').style.display = 'none'; }

    // === USER IDENTITY (Social Login) ===
    function showAuthModal() {
      document.getElementById('authModal').style.display = 'flex';
      switchAuthTab(0);
    }
    function closeAuthModal() { document.getElementById('authModal').style.display = 'none'; }

    function switchAuthTab(n) {
      document.getElementById('loginForm').style.display = n === 0 ? 'block' : 'none';
      document.getElementById('signupForm').style.display = n === 1 ? 'block' : 'none';
      document.getElementById('tabLogin').classList.toggle('active', n===0);
      document.getElementById('tabSignup').classList.toggle('active', n===1);
    }

    function signup() {
      const handle = document.getElementById('signupUser').value.trim();
      if (!handle) return alert("Handle is required");
      currentUser = {
        handle: handle.startsWith('@') ? handle : '@' + handle,
        avatar: '🪙',
        joined: new Date().toLocaleDateString()
      };
      localStorage.setItem('rootDonateUser', JSON.stringify(currentUser));
      updateUIAfterLogin();
      closeAuthModal();
      log(`✅ ${currentUser.handle} joined the mesh`);
    }

    function login() {
      const handle = document.getElementById('loginUser').value.trim();
      if (!handle) return alert("Enter your handle");
      currentUser = {
        handle: handle.startsWith('@') ? handle : '@' + handle,
        avatar: '🪙',
        joined: "2025"
      };
      localStorage.setItem('rootDonateUser', JSON.stringify(currentUser));
      updateUIAfterLogin();
      closeAuthModal();
      log(`🔓 ${currentUser.handle} connected to mesh`);
    }

    function updateUIAfterLogin() {
      document.getElementById('authBtn').style.display = 'none';
      document.getElementById('userSection').style.display = 'block';
      document.getElementById('usernameDisplay').textContent = currentUser.handle;
      document.getElementById('avatar').textContent = currentUser.avatar;
    }

    function showProfile() {
      if (currentUser) alert(`🪙 ${currentUser.handle}\nJoined: ${currentUser.joined}\n\nMesh Reputation: LEGEND`);
    }

    // === BROADCAST CONTENT ===
    function showReportModal() { document.getElementById('reportModal').style.display = 'flex'; }
    function closeReportModal() { document.getElementById('reportModal').style.display = 'none'; }

    function submitReport() {
      if (!currentUser) {
        alert("You must login to broadcast finds");
        showAuthModal();
        return;
      }
      const name = document.getElementById('rName').value.trim();
      const loc = document.getElementById('rLoc').value.trim();
      if (!name || !loc) return alert("Name and location required");

      const newItem = {
        id: `NR-${1000 + Math.floor(Math.random()*9000)}`,
        icon: "🪙",
        name, loc,
        value: document.getElementById('rValue').value.trim() || "Pending Valuation",
        time: "Just now",
        status: "BROADCAST",
        source: currentUser.handle,
        mint: "Community"
      };
      allNodes.unshift(newItem);
      renderNodes();
      closeReportModal();
      log(`🚨 ${currentUser.handle} broadcasted a new find`);
    }

    function filterNodes() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      const filtered = allNodes.filter(n => 
        n.name.toLowerCase().includes(q) || n.loc.toLowerCase().includes(q)
      );
      renderNodes(filtered);
    }

    function setTab(n) {
      document.querySelectorAll('.nav button').forEach((b,i) => b.classList.toggle('active', i===n));
    }

    function resetScan() {
      if (confirm("Reset the entire mesh?")) {
        allNodes = [];
        document.getElementById('grid').innerHTML = '';
        log("🔄 MESH RESET — RECONNECTING...");
        startGlobalScan();
      }
    }

    // === SIMULATED P2P AUTO SCAN ===
    const sampleData = [
      { name: "1909-S VDB Lincoln Cent", loc: "San Francisco Mint", value: "$1,250", icon: "🪙", mint: "USA" },
      { name: "1921 Morgan Silver Dollar", loc: "Peace Treaty Era", value: "$850", icon: "🌕", mint: "USA" },
      { name: "1943 Steel Penny", loc: "WWII Emergency Issue", value: "$95", icon: "🪙", mint: "USA" },
      { name: "Ancient Roman Denarius", loc: "Hadrian Era, 125 AD", value: "$420", icon: "🏛️", mint: "Rome" }
    ];

    async function startGlobalScan() {
      log("🌐 INITIALIZING DECENTRALISED SOCIAL MESH...");
      for (let i = 0; i < 12; i++) {
        await new Promise(r => setTimeout(r, 90));
        const base = sampleData[Math.floor(Math.random() * sampleData.length)];
        const newNode = {
          id: `NR-${1000 + Math.floor(Math.random()*8999)}`,
          ...base,
          time: new Date(Date.now() - Math.random()*86400000*10).toLocaleString(),
          source: "P2P MESH",
          status: "LIVE"
        };
        allNodes.unshift(newNode);
        renderNodes();
        log(`🪙 NEW NODE DETECTED → ${newNode.name}`);
      }
      log("✅ MESH SYNCHRONISED • FULLY DECENTRALISED");
    }

    // === INITIALIZATION ===
    window.onload = () => {
      const saved = localStorage.getItem('rootDonateUser');
      if (saved) {
        currentUser = JSON.parse(saved);
        updateUIAfterLogin();
      }

      startGlobalScan();

      setTimeout(() => {
        const hash = location.hash.slice(1);
        if (hash) {
          const node = fromBase64Url(hash);
          if (node) showItemDetail(node);
        }
      }, 800);

      log("🔓 ROOT DONATE SOCIAL NODE LEARNING LAB STARTED");
    };
  </script>
</body>
</html>
