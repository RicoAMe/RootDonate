<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Root Donate • MONETARY MESH</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    :root { 
      --neon:#ffd700; 
      --glow:#ffd70088; 
      --bg:#0a0a0a; 
      --card:rgba(20,20,15,0.95); 
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family:'Courier New',monospace; 
      background:var(--bg); 
      color:var(--neon);
      height:100vh; 
      overflow:hidden; 
      touch-action:manipulation;
    }
    canvas#matrix { position:fixed; inset:0; z-index:-1; opacity:0.15; }

    .header { 
      padding:16px 20px; 
      display:flex; 
      justify-content:space-between; 
      align-items:center;
      border-bottom:1px solid rgba(255,215,0,0.3); 
      background:rgba(10,10,10,0.98); 
    }
    .header h1 { 
      font-size:1.6rem; 
      letter-spacing:3px; 
      text-shadow:0 0 15px var(--neon); 
    }

    .nav { 
      padding:12px 20px; 
      display:flex; 
      gap:8px; 
      flex-wrap:wrap; 
      border-bottom:1px solid rgba(255,215,0,0.2);
      background:rgba(10,10,10,0.98); 
    }
    .nav button { 
      background:transparent; 
      border:1px solid var(--neon); 
      color:var(--neon);
      padding:10px 20px; 
      border-radius:50px; 
      cursor:pointer; 
      transition:all 0.3s; 
      font-size:0.95rem; 
    }
    .nav button.active, .nav button:hover { 
      background:var(--neon); 
      color:#000; 
      box-shadow:0 0 25px var(--glow); 
    }

    .search-bar { 
      margin:16px 20px; 
      padding:14px 24px; 
      width:calc(100% - 40px); 
      background:#111;
      border:1px solid var(--neon); 
      border-radius:50px; 
      color:var(--neon); 
      font-size:1rem; 
    }

    .nodes-grid { 
      flex:1; 
      padding:16px 20px; 
      overflow-y:auto; 
      display:grid; 
      grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); 
      gap:16px; 
    }

    .node-card { 
      background:var(--card); 
      border:1px solid rgba(255,215,0,0.35); 
      border-radius:16px;
      padding:18px; 
      cursor:pointer; 
      transition:all 0.4s; 
    }
    .node-card:active { 
      transform:translateY(-6px); 
      border-color:var(--neon); 
      box-shadow:0 0 30px var(--glow); 
    }

    .log { 
      height:140px; 
      background:#0a0a0a; 
      padding:12px 20px; 
      overflow-y:auto; 
      font-size:0.85rem;
      border-top:1px solid rgba(255,215,0,0.3); 
    }

    .modal { 
      display:none; 
      position:fixed; 
      inset:0; 
      background:rgba(0,0,0,0.96); 
      z-index:100;
      align-items:center; 
      justify-content:center; 
      padding:10px; 
    }
    .modal-content { 
      background:rgba(20,20,15,0.98); 
      border:2px solid var(--neon);
      border-radius:16px; 
      width:100%; 
      max-width:520px; 
      padding:28px; 
      position:relative; 
    }

    .coin-icon { font-size:2.8rem; margin-bottom:12px; }

    @media (max-width: 480px) {
      .nodes-grid { grid-template-columns:1fr; }
      .header h1 { font-size:1.4rem; }
    }
  </style>
</head>
<body>

  <canvas id="matrix"></canvas>

  <div style="display:flex; flex-direction:column; height:100vh;">
    <div class="header">
      <h1>💰 Root Donate</h1>
      <div id="stats">GLOBAL MONETARY SCAN • <span id="nodeCount">0</span> ARTIFACTS LIVE</div>
    </div>

    <div class="nav">
      <button class="active" onclick="setTab(0)">🌐 LIVE FEED</button>
      <button onclick="setTab(1)">🔎 DEEP NUMIS</button>
      <button onclick="showReportModal()">📢 REPORT FIND</button>
      <button onclick="resetScan()">RESET VAULT</button>
    </div>

    <input type="text" id="searchInput" class="search-bar" placeholder="Search coins, notes, mints..." onkeyup="filterNodes()">

    <div class="nodes-grid" id="grid"></div>
    <div class="log" id="log"></div>
  </div>

  <!-- Detail Modal -->
  <div class="modal" id="itemModal">
    <div class="modal-content">
      <span onclick="closeItemModal()" style="position:absolute;top:12px;right:20px;font-size:2.5rem;cursor:pointer;color:var(--neon);">×</span>
      <div id="modalIcon" class="coin-icon">🪙</div>
      <h2 id="modalName" style="color:#ffd700;margin-bottom:12px;"></h2>
      <p id="modalLoc" style="margin:8px 0;"></p>
      <p id="modalTime"></p>
      <div style="margin:20px 0;padding:14px;background:#111;border:1px solid var(--neon);font-size:0.9rem;">
        <strong>EST. VALUE:</strong> <span id="modalValue" style="color:#0f0;"></span><br>
        <strong>MINT / ORIGIN:</strong> <span id="modalMint"></span>
      </div>
      <div id="shareUrl" style="background:#111;padding:14px;margin:20px 0;border:1px solid var(--neon);word-break:break-all;font-size:0.9rem;"></div>
      <button onclick="copyShareLink()" style="width:100%;padding:14px;border:2px solid var(--neon);background:transparent;color:var(--neon);border-radius:50px;">
        📋 COPY LINK
      </button>
    </div>
  </div>

  <!-- Report Modal -->
  <div class="modal" id="reportModal">
    <div class="modal-content">
      <span onclick="closeReportModal()" style="position:absolute;top:12px;right:20px;font-size:2.5rem;cursor:pointer;color:var(--neon);">×</span>
      <h2 style="text-align:center;color:#ffd700;margin-bottom:20px;">📜 BROADCAST NEW FIND</h2>
      <input id="rName" placeholder="Coin / Note name (e.g. 1933 Double Eagle)" style="width:100%;padding:14px;margin:10px 0;background:#111;border:1px solid var(--neon);color:var(--neon);">
      <input id="rLoc" placeholder="Mint / Location / Era" style="width:100%;padding:14px;margin:10px 0;background:#111;border:1px solid var(--neon);color:var(--neon);">
      <input id="rValue" placeholder="Est. market value (USD)" style="width:100%;padding:14px;margin:10px 0;background:#111;border:1px solid var(--neon);color:var(--neon);">
      <textarea id="rDesc" rows="3" placeholder="Description / Condition / History..." style="width:100%;padding:14px;margin:10px 0;background:#111;border:1px solid var(--neon);color:var(--neon);"></textarea>
      <button onclick="submitReport()" style="width:100%;padding:16px;margin-top:15px;border:2px solid var(--neon);background:transparent;color:var(--neon);border-radius:50px;">
        SEND TO GLOBAL VAULT
      </button>
    </div>
  </div>

  <script>
    // Matrix Rain
    const canvas = document.getElementById('matrix');
    const ctx = canvas.getContext('2d');
    let drops = [];
    function resize() { 
      canvas.width = innerWidth; 
      canvas.height = innerHeight; 
      drops = Array(Math.floor(canvas.width/14)).fill(1); 
    }
    window.addEventListener('resize', resize); 
    resize();

    function rain() {
      ctx.fillStyle = 'rgba(10,10,10,0.15)';
      ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle = '#ffd700';
      ctx.font = '14px monospace';
      const chars = '0123456789$€£¥₿🪙⚖️📜';
      for (let i = 0; i < drops.length; i++) {
        ctx.fillText(chars[Math.random()*chars.length|0], i*14, drops[i]*14);
        if (drops[i]*14 > canvas.height && Math.random()>0.975) drops[i]=0;
        drops[i]++;
      }
    }
    setInterval(rain, 40);

    let allNodes = [];
    let currentItem = null;

    function log(msg) {
      const el = document.getElementById('log');
      const time = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', second:'2-digit'});
      el.innerHTML += `<span style="opacity:0.5">[${time}]</span> ${msg}<br>`;
      el.scrollTop = el.scrollHeight;
    }

    function toBase64Url(obj) {
      const json = JSON.stringify(obj);
      let base64 = btoa(unescape(encodeURIComponent(json)));
      return base64.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }

    function fromBase64Url(str) {
      str = str.replace(/-/g, '+').replace(/_/g, '/');
      while (str.length % 4) str += '=';
      try {
        return JSON.parse(decodeURIComponent(escape(atob(str))));
      } catch(e) { return null; }
    }

    function generateShareUrl(node) {
      const minimal = {
        id: node.id,
        name: node.name,
        loc: node.loc,
        value: node.value,
        time: node.time
      };
      const b64 = toBase64Url(minimal);
      return `${location.origin}${location.pathname}#${b64}`;
    }

    function renderNodes(filtered = allNodes) {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      document.getElementById('nodeCount').textContent = filtered.length;

      filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = 'node-card';
        card.innerHTML = `
          <div style="font-size:0.8rem;opacity:0.7;">#${item.id} • ${item.source}</div>
          <div style="font-size:2.5rem;margin:12px 0;">${item.icon}</div>
          <h3 style="margin:8px 0;">${item.name}</h3>
          <p>📍 ${item.loc}</p>
          <p style="margin-top:8px;color:#0f0;">${item.value}</p>
          <p style="font-size:0.85rem;">${item.time} • ${item.status}</p>
        `;
        card.onclick = () => showItemDetail(item);
        grid.appendChild(card);
      });
    }

    function showItemDetail(item) {
      currentItem = item;
      document.getElementById('modalIcon').textContent = item.icon;
      document.getElementById('modalName').textContent = item.name;
      document.getElementById('modalLoc').innerHTML = `📍 ${item.loc} • ${item.era || ''}`;
      document.getElementById('modalTime').textContent = item.time;
      document.getElementById('modalValue').textContent = item.value;
      document.getElementById('modalMint').textContent = item.mint || 'Unknown';

      const url = generateShareUrl(item);
      document.getElementById('shareUrl').innerHTML = `
        <strong>LINK:</strong><br>
        <a href="${url}" target="_blank" style="color:var(--neon);word-break:break-all;">${url}</a>
      `;
      document.getElementById('itemModal').style.display = 'flex';
    }

    function copyShareLink() {
      if (!currentItem) return;
      navigator.clipboard.writeText(generateShareUrl(currentItem));
      alert("✅ link copied!");
    }

    function closeItemModal() { 
      document.getElementById('itemModal').style.display = 'none'; 
    }

    function handleBase64Link() {
      const hash = location.hash.slice(1);
      if (!hash) return;
      const node = fromBase64Url(hash);
      if (node) {
        showItemDetail(node);
        if (!allNodes.some(n => n.id === node.id)) {
          allNodes.unshift(node);
          renderNodes();
        }
      }
    }

    async function startGlobalScan() {
      log("💰 INITIALIZING GLOBAL MONETARY MESH...");
      const samples = [
        {icon:"🪙", name:"1907 Saint-Gaudens Double Eagle", loc:"U.S. Mint, Philadelphia", value:"~$3.2M", era:"Pre-1933", mint:"Philadelphia", status:"CERTIFIED MS-65"},
        {icon:"💵", name:"1934 $100,000 Gold Certificate", loc:"Federal Reserve Vault", value:"Priceless (Specimen)", era:"Great Depression", mint:"Bureau of Engraving", status:"ACTIVE"},
        {icon:"₿", name:"Bitcoin Genesis Block Artifact", loc:"Satoshi Nakamoto Wallet", value:"~$110,000 (1 BTC)", era:"2009", mint:"Digital", status:"LEGENDARY"},
        {icon:"🪙", name:"Ancient Athenian Tetradrachm", loc:"Athens, 450 BC", value:"~$18,500", era:"Classical Greece", mint:"Athens", status:"XF"},
        {icon:"£", name:"Bank of England £1,000 Note (1940s)", loc:"Threadneedle Street", value:"~$45,000", era:"WWII", mint:"Bank of England", status:"RARE"},
        {icon:"¥", name:"Meiji Era 10 Yen Gold Coin", loc:"Japan Imperial Mint", value:"~$28,000", era:"1871", mint:"Osaka", status:"UNC"},
      ];

      for (let i = 0; i < 16; i++) {
        await new Promise(r => setTimeout(r, 140));
        const base = samples[Math.floor(Math.random()*samples.length)];
        const newNode = {
          id: `NR-${1000 + Math.floor(Math.random()*8999)}`,
          ...base,
          time: new Date(Date.now() - Math.random()*86400000*7).toLocaleString(),
          source: Math.random() > 0.6 ? "AUCTION HOUSE" : "PRIVATE VAULT"
        };
        allNodes.unshift(newNode);
        renderNodes();
        log(`🪙 NEW ARTIFACT → ${newNode.name}`);
      }
      log("✅ MONETARY MESH SYNCHRONIZED");
    }

    function showReportModal() { 
      document.getElementById('reportModal').style.display = 'flex'; 
    }
    function closeReportModal() { 
      document.getElementById('reportModal').style.display = 'none'; 
    }

    function submitReport() {
      const name = document.getElementById('rName').value.trim();
      const loc = document.getElementById('rLoc').value.trim();
      const value = document.getElementById('rValue').value.trim() || "Market Pending";
      if (!name || !loc) return alert("Name and location required");
      
      const newItem = { 
        id:`NR-${1000+Math.floor(Math.random()*9000)}`, 
        icon: "🪙",
        name, 
        loc, 
        value,
        time:"Just now", 
        status:"USER SUBMITTED", 
        source:"NUMIROOT CONTRIBUTOR",
        mint: "Unknown"
      };
      allNodes.unshift(newItem);
      renderNodes();
      closeReportModal();
      log("🚨 NEW FIND BROADCAST TO MESH");
    }

    function filterNodes() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      renderNodes(allNodes.filter(n => 
        n.name.toLowerCase().includes(q) || 
        n.loc.toLowerCase().includes(q) ||
        (n.value && n.value.toLowerCase().includes(q))
      ));
    }

    function setTab(n) {
      document.querySelectorAll('.nav button').forEach((b,i) => b.classList.toggle('active', i===n));
    }

    function resetScan() {
      if (confirm("Clear monetary vault?")) {
        allNodes = [];
        document.getElementById('grid').innerHTML = '';
        document.getElementById('nodeCount').textContent = '0';
        document.getElementById('log').innerHTML = '';
        log("🔄 VAULT RESET — NEW SCAN STARTING");
        startGlobalScan();
      }
    }

    window.onload = () => {
      startGlobalScan();
      setTimeout(handleBase64Link, 800);
    };
  </script>
</body>
</html>
