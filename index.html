<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ROOTDONATE - Decentralized Lost & Found Node Network">
  <meta name="theme-color" content="#00ff41">
  <title>ROOTDONATE • LOST & FOUND NODES</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    :root {
      --neon: #00ff41;
      --neon-glow: #00ff4188;
      --bg: #050505;
      --card: #0a0a0a;
      --accent: #00ff9d;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Courier New', monospace;
      background: var(--bg);
      color: var(--neon);
      overflow: hidden;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    canvas#matrix-bg {
      position: fixed;
      inset: 0;
      z-index: -1;
      opacity: 0.15;
      pointer-events: none;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: linear-gradient(transparent 50%, rgba(0,255,65,0.03) 50%),
                  radial-gradient(circle at center, transparent 60%, rgba(0,0,0,0.65) 100%);
      pointer-events: none;
      z-index: 1;
      animation: scanline-move 8s linear infinite;
    }

    @keyframes scanline-move {
      0% { background-position: 0 0; }
      100% { background-position: 0 200px; }
    }

    /* AUTH */
    .auth-container {
      background: rgba(10,10,10,0.95);
      border: 2px solid var(--neon);
      border-radius: 16px;
      width: 420px;
      padding: 40px 30px;
      box-shadow: 0 0 40px var(--neon-glow);
      z-index: 10;
      text-align: center;
    }

    .auth-header h1 {
      font-size: 2.8rem;
      margin-bottom: 8px;
      text-shadow: 0 0 20px var(--neon);
      animation: glitch 2s infinite;
    }

    .auth-header p {
      opacity: 0.7;
      letter-spacing: 4px;
      font-size: 0.9rem;
    }

    .tab-switch {
      display: flex;
      margin: 25px 0;
      border: 1px solid var(--neon);
      border-radius: 50px;
      overflow: hidden;
    }

    .tab {
      flex: 1;
      padding: 12px;
      cursor: pointer;
      transition: all 0.3s;
    }

    .tab.active {
      background: var(--neon);
      color: #000;
      font-weight: bold;
    }

    .form-container {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .form-container input,
    .form-container textarea {
      background: #000;
      border: 1px solid rgba(0,255,65,0.4);
      color: var(--neon);
      padding: 14px;
      border-radius: 8px;
      font-family: inherit;
    }

    .btn {
      background: transparent;
      border: 2px solid var(--neon);
      color: var(--neon);
      padding: 14px;
      border-radius: 50px;
      cursor: pointer;
      font-size: 1rem;
      transition: all 0.3s;
      margin-top: 10px;
    }

    .btn:hover {
      background: var(--neon);
      color: #000;
      box-shadow: 0 0 25px var(--neon-glow);
    }

    /* MAIN APP */
    #mainApp {
      display: none;
      width: 100%;
      max-width: 1400px;
      height: 100vh;
      flex-direction: column;
    }

    .header {
      padding: 20px 30px;
      border-bottom: 1px solid rgba(0,255,65,0.3);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header h1 {
      font-size: 2.2rem;
      text-shadow: 0 0 15px var(--neon);
    }

    .nav {
      padding: 15px 30px;
      display: flex;
      gap: 12px;
      border-bottom: 1px solid rgba(0,255,65,0.2);
    }

    .nav button {
      background: transparent;
      border: 1px solid var(--neon);
      color: var(--neon);
      padding: 10px 20px;
      border-radius: 50px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.3s;
    }

    .nav button.active,
    .nav button:hover {
      background: var(--neon);
      color: #000;
    }

    .search-bar {
      margin: 20px 30px;
      width: calc(100% - 60px);
      padding: 16px 24px;
      background: #000;
      border: 1px solid var(--neon);
      border-radius: 50px;
      color: var(--neon);
      font-size: 1.1rem;
    }

    .nodes-grid {
      flex: 1;
      padding: 0 30px 20px;
      overflow-y: auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .node-card {
      background: rgba(0, 20, 10, 0.85);
      border: 1px solid rgba(0, 255, 65, 0.3);
      border-radius: 16px;
      padding: 20px;
      transition: all 0.3s;
      cursor: pointer;
    }

    .node-card:hover {
      transform: translateY(-8px);
      border-color: var(--neon);
      box-shadow: 0 0 30px var(--neon-glow);
    }

    .log {
      height: 180px;
      background: #000;
      border-top: 1px solid rgba(0,255,65,0.3);
      padding: 15px 30px;
      overflow-y: auto;
      font-size: 0.9rem;
      opacity: 0.85;
    }

    /* MODALS */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.9);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }

    .modal-content {
      background: #0a0a0a;
      border: 2px solid var(--neon);
      border-radius: 16px;
      width: 90%;
      max-width: 520px;
      padding: 30px;
      position: relative;
    }

    .close-btn {
      position: absolute;
      top: 15px;
      right: 25px;
      font-size: 2rem;
      cursor: pointer;
      color: var(--neon);
    }

    .share-url {
      background: #000;
      padding: 14px 18px;
      border-radius: 50px;
      font-size: 0.95rem;
      word-break: break-all;
      margin: 20px 0;
      border: 1px solid rgba(0,255,65,0.4);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .copy-btn {
      background: transparent;
      border: 2px solid var(--neon);
      color: var(--neon);
      padding: 8px 18px;
      border-radius: 50px;
      cursor: pointer;
      font-size: 0.9rem;
      white-space: nowrap;
    }

    @keyframes glitch {
      0%, 100% { text-shadow: 3px 0 #00ff41, -3px 0 #ff00ff; }
      20% { text-shadow: -3px 0 #00ff41, 3px 0 #ff00ff; }
    }
  </style>
</head>
<body>

  <canvas id="matrix-bg"></canvas>
  <div class="overlay"></div>

  <!-- AUTH SECTION -->
  <div class="auth-container" id="authContainer">
    <div class="auth-header">
      <h1>ROOTDONATE</h1>
      <p>LOST &amp; FOUND NODE NETWORK • EST 2026</p>
    </div>

    <div class="tab-switch">
      <div class="tab active" id="loginTab" onclick="switchTab(0)">LOGIN NODE</div>
      <div class="tab" id="signupTab" onclick="switchTab(1)">DEPLOY NODE</div>
    </div>

    <!-- LOGIN FORM -->
    <div class="form-container" id="loginForm">
      <input type="text" id="loginNodeId" placeholder="NODE ID (e.g. RD-7842)" value="RD-7842">
      <input type="password" id="loginPass" placeholder="PASSPHRASE" value="demo123">
      <button class="btn" onclick="performLogin()">CONNECT TO MESH</button>
    </div>

    <!-- SIGNUP FORM -->
    <div class="form-container hidden" id="signupForm">
      <input type="text" id="signupName" placeholder="NODE OPERATOR NAME">
      <input type="text" id="signupLoc" placeholder="YOUR CITY / REGION">
      <textarea id="signupBio" placeholder="Short description of your node..."></textarea>
      <button class="btn" onclick="deployNode()">DEPLOY NEW NODE</button>
    </div>
  </div>

  <!-- MAIN APP -->
  <div id="mainApp">
    <div class="header">
      <h1>🔗 ROOTDONATE</h1>
      <p style="opacity:0.7; letter-spacing:3px;">LIVE NODE NETWORK • 2026</p>
    </div>

    <div class="nav">
      <button onclick="setTab(0)" class="active"><i class="fas fa-network-wired"></i> ALL NODES</button>
      <button onclick="setTab(1)"><i class="fas fa-search"></i> DEEP SCAN</button>
      <button onclick="showReportForm()"><i class="fas fa-plus-circle"></i> REPORT LOST</button>
      <button onclick="logout()"><i class="fas fa-power-off"></i> DISCONNECT</button>
    </div>

    <input type="text" id="searchInput" class="search-bar" 
           placeholder="SEARCH LOST ITEMS • iphone, passport, wallet..." 
           onkeyup="liveSearch()">

    <div class="nodes-grid" id="nodesGrid"></div>

    <h2 style="margin: 20px 30px 10px; font-size:1.4rem;">NETWORK LOG</h2>
    <div id="log" class="log"></div>
  </div>

  <!-- ITEM DETAIL MODAL -->
  <div class="modal" id="itemModal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal()">×</span>
      <div style="text-align:center; margin-bottom:25px;">
        <h2 id="modalItemName" style="color:var(--accent); font-size:2.2rem;"></h2>
        <p id="modalItemId" style="opacity:0.7;"></p>
      </div>

      <div class="share-url">
        <span id="modalUrl"></span>
        <button class="copy-btn" onclick="copyShareLink()">COPY LINK</button>
      </div>

      <p><strong>Location:</strong> <span id="modalLoc"></span></p>
      <p><strong>Found:</strong> <span id="modalTime"></span></p>
      <p><strong>Status:</strong> <span id="modalStatus" style="color:#0f0;"></span></p>

      <button class="btn" onclick="claimItem()" style="margin-top:25px; width:100%;">
        <i class="fas fa-hand-holding-heart"></i> CLAIM THIS ITEM
      </button>
    </div>
  </div>

  <!-- REPORT MODAL -->
  <div class="modal" id="reportModal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeReportModal()">×</span>
      <h2 style="text-align:center; margin-bottom:25px; color:var(--accent);">REPORT NEW LOST ITEM</h2>

      <input type="text" id="reportItem" placeholder="Item Name (e.g. Black iPhone 16)">
      <input type="text" id="reportLoc" placeholder="Last Known Location">
      <textarea id="reportNotes" rows="4" placeholder="Additional description, serial number, etc..."></textarea>

      <button class="btn" onclick="submitReport()" style="width:100%;">
        <i class="fas fa-paper-plane"></i> SUBMIT TO MESH
      </button>
    </div>
  </div>

  <script>
    // Matrix Background
    const canvas = document.getElementById('matrix-bg');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const chars = "01アイウエオカキクケコ0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ$@#%&";
    const fontSize = 15;
    let drops = [];

    function initDrops() {
      drops = Array(Math.floor(canvas.width / fontSize)).fill(1);
    }

    function drawMatrix() {
      ctx.fillStyle = 'rgba(5,5,5,0.1)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#00ff41';
      ctx.font = `${fontSize}px monospace`;
      for (let i = 0; i < drops.length; i++) {
        const text = chars[Math.floor(Math.random() * chars.length)];
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);
        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
      }
    }
    setInterval(drawMatrix, 35);
    initDrops();

    // Sample Data
    let sampleNodes = [
      { id: "RD-7842", item: "Black iPhone 16 Pro", loc: "Shibuya Crossing, Tokyo", time: "12m ago", status: "RECOVERED" },
      { id: "RD-3921", item: "Brown Leather Passport", loc: "Heathrow Airport, London", time: "47m ago", status: "ACTIVE" },
      { id: "RD-6719", item: "Gold Rolex Submariner", loc: "Downtown Dubai", time: "2h ago", status: "ACTIVE" },
      { id: "RD-1245", item: "Red Air Jordan 1", loc: "Times Square, NYC", time: "5h ago", status: "RECOVERED" },
      { id: "RD-8834", item: "MacBook Air M3", loc: "Kuala Lumpur Sentral", time: "11h ago", status: "ACTIVE" },
      { id: "RD-5567", item: "Gucci Wallet", loc: "Paris Gare du Nord", time: "Yesterday", status: "ACTIVE" }
    ];

    // Generate Shareable URL (now works with deep linking)
    function generateShareUrl(node) {
      const data = JSON.stringify({
        id: node.id,
        item: node.item,
        loc: node.loc,
        time: node.time,
        status: node.status
      });
      const base64 = btoa(data);
      return `https://rootdonate.co.uk/item/${base64}`;
    }

    function loadNodes(filteredNodes) {
      const grid = document.getElementById('nodesGrid');
      grid.innerHTML = '';
      filteredNodes.forEach(node => {
        node.url = generateShareUrl(node);
        const card = document.createElement('div');
        card.className = 'node-card';
        card.innerHTML = `
          <h3>#${node.id}</h3>
          <p><strong>${node.item}</strong></p>
          <p style="opacity:0.8;">📍 ${node.loc}</p>
          <p style="margin-top:12px; opacity:0.7;">${node.time} • <span style="color:${node.status==='RECOVERED'?'#0f0':'#ff0'}">${node.status}</span></p>
        `;
        card.onclick = () => showItemDetail(node);
        grid.appendChild(card);
      });
    }

    function liveSearch() {
      const query = document.getElementById('searchInput').value.toLowerCase().trim();
      if (!query) {
        loadNodes(sampleNodes);
        return;
      }
      const filtered = sampleNodes.filter(node => 
        node.item.toLowerCase().includes(query) || 
        node.loc.toLowerCase().includes(query)
      );
      loadNodes(filtered);
    }

    let currentItem = null;

    function showItemDetail(node) {
      currentItem = node;
      document.getElementById('modalItemName').textContent = node.item;
      document.getElementById('modalItemId').textContent = `#${node.id}`;
      document.getElementById('modalUrl').textContent = node.url;
      document.getElementById('modalLoc').textContent = node.loc;
      document.getElementById('modalTime').textContent = node.time;
      document.getElementById('modalStatus').textContent = node.status;
      document.getElementById('itemModal').style.display = 'flex';
      log(`📡 VIEWING ITEM ${node.id}`);
    }

    function copyShareLink() {
      if (!currentItem) return;
      navigator.clipboard.writeText(currentItem.url).then(() => {
        const btn = document.querySelector('#itemModal .copy-btn');
        const orig = btn.textContent;
        btn.textContent = '✓ COPIED';
        setTimeout(() => btn.textContent = orig, 2000);
      });
    }

    function closeModal() {
      document.getElementById('itemModal').style.display = 'none';
    }

    function claimItem() {
      if (!currentItem) return;
      alert(`✅ Claim request sent for ${currentItem.item}!\nA node operator will contact you shortly.`);
      closeModal();
      log(`🛡️ CLAIM REQUEST SENT FOR #${currentItem.id}`);
    }

    // Report Modal
    function showReportForm() {
      document.getElementById('reportModal').style.display = 'flex';
    }

    function closeReportModal() {
      document.getElementById('reportModal').style.display = 'none';
    }

    function submitReport() {
      const item = document.getElementById('reportItem').value.trim() || "Unnamed Item";
      const loc = document.getElementById('reportLoc').value.trim() || "Unknown";
      closeReportModal();
      
      const newNode = {
        id: "RD-" + Math.floor(1000 + Math.random() * 9000),
        item: item,
        loc: loc,
        time: "Just now",
        status: "ACTIVE"
      };
      sampleNodes.unshift(newNode);
      loadNodes(sampleNodes);
      log(`🚨 NEW LOST ITEM REPORTED: ${item}`);
    }

    // Auth
    function switchTab(n) {
      document.querySelectorAll('.tab').forEach((t, i) => t.classList.toggle('active', i === n));
      document.getElementById('loginForm').classList.toggle('hidden', n !== 0);
      document.getElementById('signupForm').classList.toggle('hidden', n !== 1);
    }

    function performLogin() {
      document.getElementById('authContainer').style.display = 'none';
      document.getElementById('mainApp').style.display = 'flex';
      log("🔓 NODE CONNECTED SUCCESSFULLY");
      log("🌐 MESH SYNC COMPLETE");
    }

    function deployNode() {
      alert("🛰️ New node deployed! Welcome to the ROOTDONATE network.");
      performLogin();
    }

    function logout() {
      if (confirm("Disconnect from mesh?")) {
        document.getElementById('mainApp').style.display = 'none';
        document.getElementById('authContainer').style.display = 'block';
        log("🔌 NODE DISCONNECTED");
      }
    }

    function setTab(n) {
      document.querySelectorAll('.nav button').forEach((b, i) => b.classList.toggle('active', i === n));
      if (n === 0) loadNodes(sampleNodes);
    }

    function log(message) {
      const logEl = document.getElementById('log');
      const time = new Date().toLocaleTimeString('en-GB', { hour12: false }).slice(0, 8);
      logEl.innerHTML += `<span style="opacity:0.6">[${time}]</span> ${message}<br>`;
      logEl.scrollTop = logEl.scrollHeight;
    }

    // ==================== DEEP LINK SUPPORT (SHARE URL WORKS) ====================
    function handleDeepLink() {
      const path = window.location.pathname;
      const match = path.match(/\/item\/([A-Za-z0-9+/=]+)/);
      if (match) {
        try {
          const decoded = JSON.parse(atob(match[1]));
          // Find or create matching node
          let node = sampleNodes.find(n => n.id === decoded.id);
          if (!node) {
            node = decoded;
            sampleNodes.unshift(node);
          }
          performLogin(); // auto-login for demo
          setTimeout(() => showItemDetail(node), 800);
        } catch (e) {
          console.error("Invalid share link");
        }
      }
    }

    // Initialize
    window.onload = () => {
      log("SYSTEM BOOT SEQUENCE COMPLETE");
      log("CONNECTING TO ROOTDONATE MESH...");
      loadNodes(sampleNodes);
      handleDeepLink();
    };
  </script>
</body>
</html>
