<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Chat</title>
  <script src="https://js.puter.com/v2/"></script>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 1rem; }
    #chat { border: 1px solid #ccc; height: 400px; overflow-y: auto; padding: 1rem; margin-bottom: 1rem; border-radius: 8px; }
    .msg { margin: 0.5rem 0; padding: 0.5rem 0.8rem; border-radius: 8px; }
    .user { background: #e3f2fd; text-align: right; }
    .bot { background: #f5f5f5; }
    input { width: 70%; padding: 0.6rem; }
    button { padding: 0.6rem 1rem; }
  </style>
</head>
<body>
  <h2>AI Chat</h2>
  <div id="chat"></div>
  <input id="input" placeholder="Message…">
  <button onclick="send()">Send</button>

  <script>
    const chat = document.getElementById("chat");
    const input = document.getElementById("input");
    let messages = [];

    function add(text, role) {
      const div = document.createElement("div");
      div.className = "msg " + role;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    async function send() {
      const text = input.value.trim();
      if (!text) return;
      add(text, "user");
      messages.push({ role: "user", content: text });
      input.value = "";

      const botDiv = document.createElement("div");
      botDiv.className = "msg bot";
      botDiv.textContent = "…";
      chat.appendChild(botDiv);

      try {
        const response = await puter.ai.chat(messages, {
          model: "x-ai/grok-4.7",
          stream: true
        });
        let full = "";
        for await (const chunk of response) {
          if (chunk.type === "text" && chunk.text) {
            full += chunk.text;
            botDiv.textContent = full;
          }
        }
        messages.push({ role: "assistant", content: full });
      } catch (err) {
        botDiv.textContent = "Error: " + err.message;
      }
    }

    input.addEventListener("keydown", e => {
      if (e.key === "Enter") send();
    });
  </script>
</body>
</html>
