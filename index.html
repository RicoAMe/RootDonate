<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ROOTDONATE - Decentralized Lost & Found">
  <meta name="theme-color" content="#00ff41">
  <title>ROOTDONATE • LOST & FOUND</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    :root{--neon:#00ff41;--neon-glow:#00ff4188;--accent:#00ff9d;--bg:#050505}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Courier New',monospace;background:var(--bg);color:var(--neon);overflow:hidden;height:100vh;display:flex;align-items:center;justify-content:center;position:relative}
    canvas#matrix-bg{position:fixed;inset:0;z-index:-1;opacity:0.18;pointer-events:none}
    /* ... (keep all your existing CSS unchanged) ... */
  </style>
</head>
<body>

  <canvas id="matrix-bg"></canvas>
  <div class="overlay"></div>

  <!-- AUTH + MAIN APP (unchanged) ... -->

  <script>
    const DEMO_BASE = window.location.href.split('#')[0];

    // Matrix Rain (unchanged)
    const canvas = document.getElementById('matrix-bg');
    const ctx = canvas.getContext('2d');
    let drops = [];
    const chars = "01アイウエオカキクケコ0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ$@#%&";
    const fontSize = 16;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      drops = Array(Math.floor(canvas.width / fontSize)).fill(1);
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function drawMatrix() {
      ctx.fillStyle = 'rgba(5,5,5,0.12)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#00ff41';
      ctx.font = `${fontSize}px monospace`;
      for (let i = 0; i < drops.length; i++) {
        ctx.fillText(chars[Math.floor(Math.random() * chars.length)], i * fontSize, drops[i] * fontSize);
        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
      }
    }
    setInterval(drawMatrix, 35);

    let sampleNodes = [
      {i:"RD-7842", n:"Black iPhone 16 Pro", l:"Shibuya Crossing, Tokyo", t:"12m ago", s:"RECOVERED"},
      {i:"RD-3921", n:"Brown Leather Passport", l:"Heathrow Airport, London", t:"47m ago", s:"ACTIVE"},
      // ... add others similarly
    ];

    // === SHORTEST SHARE URL ===
    function generateShareUrl(node) {
      const data = btoa(JSON.stringify(node))
        .replace(/\+/g, '-')
        .replace(/\//g, '_')
        .replace(/=+$/, '');
      return `${DEMO_BASE}#i=${data}`;
    }

    function decodeShareData(hash) {
      const match = hash.match(/#i=([A-Za-z0-9_-]+)/);
      if (!match) return null;
      let b64 = match[1].replace(/-/g, '+').replace(/_/g, '/');
      while (b64.length % 4) b64 += '=';
      try {
        return JSON.parse(atob(b64));
      } catch(e) { return null; }
    }

    function loadNodes(filtered = sampleNodes) {
      const grid = document.getElementById('nodesGrid');
      grid.innerHTML = '';
      filtered.forEach(node => {
        node.url = generateShareUrl(node);
        const card = document.createElement('div');
        card.className = 'node-card';
        card.innerHTML = `
          <h3>#${node.i}</h3>
          <p style="font-size:1.15rem;font-weight:bold;">${node.n}</p>
          <p style="opacity:0.8;margin:8px 0;">📍 ${node.l}</p>
          <p style="margin-top:12px;opacity:0.75;">
            ${node.t} • <span style="color:${node.s==='RECOVERED'?'#0f0':'#ff0'}">${node.s}</span>
          </p>
        `;
        card.onclick = () => showItemDetail(node);
        grid.appendChild(card);
      });
    }

    let currentItem = null;

    function showItemDetail(node) {
      currentItem = node;
      document.getElementById('modalItemName').textContent = node.n;
      document.getElementById('modalItemId').textContent = `#${node.i}`;
      const urlEl = document.getElementById('modalUrlLink');
      urlEl.textContent = node.url.length > 65 ? node.url.substring(0,62)+'...' : node.url;
      urlEl.href = node.url;
      document.getElementById('modalLoc').textContent = node.l;
      document.getElementById('modalTime').textContent = node.t;
      document.getElementById('modalStatus').textContent = node.s;
      document.getElementById('itemModal').style.display = 'flex';
    }

    function copyShareLink() {
      if (!currentItem) return;
      navigator.clipboard.writeText(currentItem.url).then(() => {
        const btn = document.querySelector('#itemModal .copy-btn');
        const orig = btn.textContent;
        btn.textContent = '✓ COPIED!';
        setTimeout(() => btn.textContent = orig, 1500);
      });
    }

    // Deep link handler
    function handleDeepLink() {
      const data = decodeShareData(window.location.hash);
      if (data) {
        if (!sampleNodes.find(n => n.i === data.i)) sampleNodes.unshift(data);
        performLogin();
        setTimeout(() => showItemDetail(data), 600);
      }
    }

    window.addEventListener('hashchange', handleDeepLink);

    // Rest of your functions (performLogin, submitReport, etc.) remain the same
    window.onload = () => {
      loadNodes();
      handleDeepLink();
    };
  </script>
</body>
</html>
