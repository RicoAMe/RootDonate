<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Root Donate</title>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>

  <!-- Stripe.js -->
  <script src="https://js.stripe.com/v3/"></script>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #00ff9d;
      --accent: #ff00aa;
      --bg: #0a0a0f;
      --card: #111118;
      --border: #222226;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: #e0e0e0;
      min-height: 100dvh;
      padding: 20px 12px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .container {
      max-width: 420px;
      width: 100%;
      background: var(--card);
      border-radius: 28px;
      border: 1px solid var(--border);
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0, 255, 157, 0.1);
      margin-top: 20px;
    }

    .header {
      background: linear-gradient(135deg, #00ff9d 0%, #ff00aa 100%);
      color: #000;
      padding: 28px 24px 24px;
      text-align: center;
    }

    .header h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.9rem;
      font-weight: 700;
      letter-spacing: -1px;
    }

    .profile-name {
      font-size: 1.3rem;
      font-weight: 700;
      margin-top: 10px;
    }

    .content { padding: 24px; }

    .debit-card {
      width: 100%;
      height: 210px;
      background: linear-gradient(145deg, #1c1c1c, #0d0d0d);
      border-radius: 16px;
      position: relative;
      color: white;
      margin-bottom: 24px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.5);
      overflow: hidden;
    }

    .debit-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(105deg, transparent 40%, rgba(255,255,255,0.04) 50%, transparent 60%);
    }

    .chip {
      position: absolute;
      top: 24px;
      left: 24px;
      width: 44px;
      height: 34px;
      background: linear-gradient(135deg, #c9a227, #e8d48b);
      border-radius: 5px;
    }

    .card-logo {
      position: absolute;
      top: 22px;
      right: 24px;
      font-size: 20px;
      font-weight: 700;
    }

    .card-number {
      position: absolute;
      top: 95px;
      left: 24px;
      font-size: 19px;
      letter-spacing: 3px;
    }

    .card-handle {
      position: absolute;
      bottom: 52px;
      left: 24px;
      font-size: 15px;
      font-weight: 600;
    }

    .card-bottom {
      position: absolute;
      bottom: 20px;
      left: 24px;
      right: 24px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      font-size: 12px;
      opacity: 0.85;
    }

    .visa {
      font-size: 24px;
      font-weight: 800;
      font-style: italic;
    }

    .amount-btns {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin: 16px 0 24px;
    }

    .amount-btns button {
      background: #1f1f26;
      border: 1px solid #333;
      color: white;
      border-radius: 12px;
      padding: 14px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
    }

    .amount-btns button.active {
      background: var(--primary);
      color: #000;
    }

    .btn {
      width: 100%;
      padding: 17px;
      border: none;
      border-radius: 14px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
      transition: transform 0.2s;
    }

    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.6; cursor: not-allowed; }

    .donate-btn {
      background: var(--primary);
      color: #000;
    }

    .share-btn {
      background: #1f1f26;
      color: white;
      border: 1px solid #333;
      margin-top: 16px;
    }

    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: #111;
      color: var(--primary);
      padding: 14px 28px;
      border-radius: 999px;
      font-weight: 700;
      display: none;
      z-index: 999;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }

    .total {
      text-align: center;
      margin-bottom: 16px;
      font-size: 1.1rem;
      color: #aaa;
    }

    .total span {
      color: var(--primary);
      font-weight: 700;
      font-size: 1.4rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Root Donate</h1>
      <div class="profile-name" id="profileName">Loading...</div>
    </div>

    <div class="content">
      <!-- Visual card only – decoration -->
      <div class="debit-card">
        <div class="chip"></div>
        <div class="card-logo">𝕏 Money</div>
        <div class="card-number" id="cardNumber">•••• •••• •••• ----</div>
        <div class="card-handle" id="cardHandle">@handle</div>
        <div class="card-bottom">
          <div>
            <div style="font-size:10px; opacity:0.7;">VALID THRU</div>
            <div>09/29</div>
          </div>
          <div class="visa">VISA</div>
        </div>
      </div>

      <div class="total">
        Total Raised: <span id="totalRaised">$0</span>
      </div>

      <div class="amount-btns" id="amountGrid">
        <button onclick="setAmount(5)" class="active">$5</button>
        <button onclick="setAmount(10)">$10</button>
        <button onclick="setAmount(25)">$25</button>
      </div>

      <button class="btn donate-btn" id="donateBtn" onclick="startDonation()">
        Donate $<span id="amountDisplay">5</span>
      </button>

      <button class="btn share-btn" onclick="shareProfile()">
        🔗 Share My Profile Link
      </button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // ========== REPLACE WITH YOUR FIREBASE CONFIG ==========
    const firebaseConfig = {
      apiKey: "AIzaSyBvcCBsPiMxS7G2evPjM7sANp-zSy_RkKM",
      authDomain: "rootdonate-61e61.firebaseapp.com",
      databaseURL: "https://rootdonate-61e61-default-rtdb.firebaseio.com",
      projectId: "rootdonate-61e61",
      storageBucket: "rootdonate-61e61.firebasestorage.app",
      messagingSenderId: "754240963907",
      appId: "1:754240963907:web:5417c2763d8f02108bdbf6",
      measurementId: "G-0SC5R5ELT1"
    };
    // =======================================================

    // ========== REPLACE WITH YOUR STRIPE PUBLISHABLE KEY ==========
    const stripe = mk_1TeUTNAYd3hJ6fUD0o6WiiZM; // or pk_test_... for testing
    // ==============================================================

    // ========== REPLACE WITH YOUR CLOUD FUNCTION URL ==========
    const CREATE_CHECKOUT_URL = "https://storage.googleapis.com";
    // ==========================================================

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let currentAmount = 5;
    let currentUser = null;
    let userDocRef = null;
    let profile = {};

    function showToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.style.display = "block";
      setTimeout(() => t.style.display = "none", 3500);
    }

    function setAmount(amount) {
      currentAmount = amount;
      document.getElementById("amountDisplay").textContent = amount;
      document.querySelectorAll("#amountGrid button").forEach(btn => btn.classList.remove("active"));
      event.currentTarget.classList.add("active");
    }

    function updateCardUI() {
      document.getElementById("profileName").textContent = profile.name || profile.handle || "User";
      document.getElementById("cardHandle").textContent = profile.handle || "@user";
      document.getElementById("cardNumber").textContent = `•••• •••• •••• ${profile.last4 || "0000"}`;
      document.getElementById("totalRaised").textContent = "$" + (profile.totalRaised || 0);
    }

    async function initUser() {
      auth.onAuthStateChanged(async (user) => {
        if (user) {
          currentUser = user;
          userDocRef = db.collection("users").doc(user.uid);

          const doc = await userDocRef.get();
          if (doc.exists) {
            profile = doc.data();
          } else {
            const last4 = Math.floor(1000 + Math.random() * 9000).toString();
            profile = {
              name: "User" + user.uid.slice(0, 5),
              handle: "@user" + user.uid.slice(0, 5),
              last4: last4,
              totalRaised: 0,
              createdAt: firebase.firestore.FieldValue.serverTimestamp()
            };
            await userDocRef.set(profile);
          }
          updateCardUI();

          // Check if returning from successful payment
          const params = new URLSearchParams(window.location.search);
          if (params.get("success") === "true") {
            showToast("✅ Payment successful! Thank you for your donation.");
            // Refresh total from Firestore (webhook already updated it)
            const fresh = await userDocRef.get();
            if (fresh.exists) {
              profile = fresh.data();
              updateCardUI();
            }
            // Clean URL
            window.history.replaceState({}, document.title, window.location.pathname);
          }
        } else {
          await auth.signInAnonymously();
        }
      });
    }

    async function startDonation() {
      if (!currentUser || !userDocRef) {
        return showToast("Please wait a moment...");
      }

      const btn = document.getElementById("donateBtn");
      btn.disabled = true;
      btn.textContent = "Redirecting to secure payment...";

      try {
        const response = await fetch(CREATE_CHECKOUT_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            amount: currentAmount * 100, // cents
            userId: currentUser.uid,
            handle: profile.handle || "donor"
          })
        });

        const data = await response.json();

        if (data.url) {
          window.location.href = data.url; // Go to Stripe Checkout
        } else {
          throw new Error(data.error || "Failed to create checkout");
        }
      } catch (err) {
        console.error(err);
        showToast("Something went wrong. Please try again.");
        btn.disabled = false;
        btn.innerHTML = `Donate $<span id="amountDisplay">${currentAmount}</span>`;
      }
    }

    function shareProfile() {
      const data = {
        name: profile.name,
        handle: profile.handle,
        last4: profile.last4
      };
      const encoded = btoa(JSON.stringify(data));
      const shareLink = `${window.location.origin}${window.location.pathname}?p=${encoded}`;

      navigator.clipboard.writeText(shareLink).then(() => {
        showToast("✅ Profile link copied!");
      }).catch(() => {
        prompt("Copy this link:", shareLink);
      });
    }

    // Load shared profile from URL (view only)
    function loadFromURL() {
      const params = new URLSearchParams(window.location.search);
      const encoded = params.get("p");
      if (encoded) {
        try {
          const decoded = JSON.parse(atob(encoded));
          document.getElementById("profileName").textContent = decoded.name || decoded.handle;
          document.getElementById("cardHandle").textContent = decoded.handle || "@user";
          document.getElementById("cardNumber").textContent = `•••• •••• •••• ${decoded.last4 || "0000"}`;
        } catch (e) {}
      }
    }

    initUser();
    loadFromURL();
  </script>
</body>
</html>
