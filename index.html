<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ClevBot · Guest Login</title>
  <script src="https://www.google.com/recaptcha/api.js" async defer></script>
  <style>
    :root {
      --bg: #0b0f14;
      --panel: #151c25;
      --line: #2a3542;
      --text: #e8eef6;
      --muted: #8a9bb0;
      --accent: #6eb5e8;
      --accent-soft: rgba(110, 181, 232, 0.15);
      --you: #1e2a3a;
      --bot: #141c26;
      --shadow: 0 4px 20px rgba(0,0,0,0.35);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: radial-gradient(ellipse at top, #121820 0%, var(--bg) 60%);
      color: var(--text);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
      background: rgba(11,15,20,0.85);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    header h1 {
      font-size: 18px;
      margin: 0;
      font-weight: 650;
      letter-spacing: -0.3px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    header h1::before {
      content: "";
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 12px var(--accent);
    }
    #status {
      color: var(--muted);
      font-size: 12.5px;
      font-weight: 500;
    }
    #log {
      flex: 1;
      overflow-y: auto;
      padding: 20px 20px 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      scroll-behavior: smooth;
    }
    .msg {
      max-width: min(680px, 88%);
      padding: 12px 16px;
      border-radius: 16px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-wrap: break-word;
      animation: rise 0.25s ease-out;
      box-shadow: var(--shadow);
      position: relative;
    }
    .you {
      align-self: flex-end;
      background: var(--you);
      border-bottom-right-radius: 4px;
    }
    .cb {
      align-self: flex-start;
      background: var(--bot);
      border: 1px solid var(--line);
      border-bottom-left-radius: 4px;
    }
    .time {
      display: block;
      font-size: 11px;
      color: var(--muted);
      margin-top: 6px;
      opacity: 0.7;
    }
    form {
      display: flex;
      gap: 10px;
      padding: 14px 20px 20px;
      border-top: 1px solid var(--line);
      background: rgba(11,15,20,0.9);
      backdrop-filter: blur(8px);
      flex-shrink: 0;
    }
    input[type="text"] {
      flex: 1;
      background: var(--panel);
      color: var(--text);
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 15.5px;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input[type="text"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }
    button {
      background: var(--accent);
      color: #081018;
      border: 0;
      border-radius: 12px;
      padding: 12px 20px;
      font-weight: 650;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.15s;
    }
    button:hover:not(:disabled) { opacity: 0.92; transform: translateY(-1px); }
    button:active:not(:disabled) { transform: translateY(0); }
    button:disabled { opacity: 0.45; cursor: wait; }
    .typing {
      align-self: flex-start;
      display: flex;
      gap: 5px;
      padding: 14px 18px;
      background: var(--bot);
      border: 1px solid var(--line);
      border-radius: 16px;
      border-bottom-left-radius: 4px;
    }
    .typing span {
      width: 7px;
      height: 7px;
      background: var(--muted);
      border-radius: 50%;
      animation: bounce 1.2s infinite ease-in-out;
    }
    .typing span:nth-child(2) { animation-delay: 0.15s; }
    .typing span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes rise {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-5px); opacity: 1; }
    }
    @media (max-width: 520px) {
      header, form, #log { padding-left: 14px; padding-right: 14px; }
      .msg { max-width: 94%; }
      header h1 { font-size: 16px; }
    }

    /* Guest login overlay */
    #login-overlay {
      position: fixed;
      inset: 0;
      background: rgba(11,15,20,0.96);
      backdrop-filter: blur(8px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }
    #login-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 32px 28px;
      max-width: 380px;
      width: 100%;
      text-align: center;
      box-shadow: var(--shadow);
    }
    #login-card h2 {
      margin: 0 0 8px;
      font-size: 22px;
      font-weight: 650;
    }
    #login-card p {
      color: var(--muted);
      margin: 0 0 24px;

      line-height: 1.5;
    }
    #guest-btn {
      background: var(--accent);
      color: #081018;
      border: 0;
      border-radius: 12px;
      padding: 14px 28px;
      font-size: 15.5px;
      font-weight: 650;
      cursor: pointer;
      width: 100%;
      transition: transform 0.1s, opacity 0.15s;
    }
    #guest-btn:hover { opacity: 0.92; transform: translateY(-1px); }
    #guest-btn:active { transform: translateY(0); }
    #guest-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
    }
    #gdpr-row {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      text-align: left;
      margin: 0 0 18px;
      font-size: 13px;
      color: var(--muted);
      line-height: 1.45;
    }
    #gdpr-row input { margin-top: 3px; flex-shrink: 0; }
    #gdpr-row a { color: var(--accent); text-decoration: none; }
    #gdpr-row a:hover { text-decoration: underline; }
    #recaptcha-wrap {
      display: flex;
      justify-content: center;
      margin: 0 0 18px;
      min-height: 78px;
    }
    #login-note {
      font-size: 12px;
      color: var(--muted);
      margin-top: 14px;
      line-height: 1.4;
    }
    body.chat-mode #login-overlay { display: none; }
  </style>

<body>

  <div id="login-overlay">
    <div id="login-card">
      <h2>ClevBot</h2>
      <p>Continue as a guest.<br>A unique ID is added to the URL so you can return later.</p>

      <div id="gdpr-row">
        <input type="checkbox" id="gdpr-consent">
        <label for="gdpr-consent">
          I agree to the processing of my chat data and guest ID stored locally in this browser for the purpose of providing this service, in line with GDPR. 
          <a href="#" id="privacy-link">Privacy notice</a>
        </label>
      </div>

      <div id="recaptcha-wrap">
        <div class="g-recaptcha" data-sitekey="6Lez9P8tAAAAAOZ3CyOswTKxjCHyFceQ6yla28IM" data-callback="onRecaptchaSuccess" data-expired-callback="onRecaptchaExpired"></div>
      </div>

      <button id="guest-btn" type="button" disabled>Continue as Guest</button>

    </div>
  </div>

  <header>
    <h1>ClevBot</h1>
    <span id="status">Wikipedia lookup on · guest</span>
  </header>
  <div id="log"></div>
  <form id="form">
    <input id="box" type="text" autocomplete="off" autofocus placeholder="Talk naturally — I remember and I look things up">
    <button id="go" type="submit">Send</button>
  </form>
  <script>
  function onClick(e) {
    e.preventDefault();
    grecaptcha.enterprise.ready(async () => {
      const token = await grecaptcha.enterprise.execute('6Lez9P8tAAAAAOZ3CyOswTKxjCHyFceQ6yla28IM', {action: 'LOGIN'});
    });
  }
const SNIPPET_LIMIT = 420;
const MAX_LOOKUPS = 50;
let MEM_KEY = "cb_memory_v2"; // will be set to include guest ID

const ACK = [
  "Understood.", "That makes sense.", "Got it.", "Noted.", "Thanks for sharing that.",
  "I'll remember that.", "Appreciated.", "Makes sense."
];
const PROMPTS = [
  "What would you like to talk about?",
  "Go on — I'm listening.",
  "Interesting. Tell me a bit more.",
  "Fair enough. What else is on your mind?",
  "I'm here. What's next?"
];
const GREETS = ["Hello.", "Hi there.", "Good to see you.", "Hey."];
const HOWAMI = [
  "I'm well, thank you. How are you?",
  "Doing fine. How about you?",
  "All good on my side. What's new with you?",
  "Pretty good. Yourself?"
];
const QREPLIES = [
  "I'm not sure I have a perfect answer. What do you think?",
  "That's a fair question. How would you approach it?",
  "I don't know enough to be definite. What's your take?",
  "Interesting question. I'd like to hear your view."
];
const SMALL = new Set([
  "hello","hi","hey","yo","hiya","howdy","bye","goodbye","quit","exit",
  "how are you","how are you?","how's it going","how's it going?",
  "how are you doing","how are you doing?","what's up","whats up","sup",
  "who are you","what is your name","what's your name",
  "who am i","what do you know about me","what do you remember",
  "thank you","thanks","thanks a lot","cheers",
  "good morning","good afternoon","good evening","good night",
  "help","commands","?", "what time is it", "what's the time", "what is the time",
  "what's the date", "what is the date", "what day is it"
]);
const AUTOCORRECT = {
  onlie:"online", onlin:"online", onlne:"online", onine:"online",
  memmory:"memory", memroy:"memory", remeber:"remember", rember:"remember",
  foget:"forget", helpp:"help", helo:"hello", hallo:"hello",
  whats:"what's", wats:"what's", wat:"what", teh:"the",
  defin:"define", explane:"explain", plz:"please", pls:"please"
};
const PATTERNS = [
  [/\b(?:my name is|call me|i(?:'m| am) called|i(?:'m| am))\s+([a-z][\w .'-]{0,40})/i, "name"],
  [/\bi live in\s+([a-z][\w ,.'-]{0,50})/i, "location"],
  [/\bi(?:'m| am) from\s+([a-z][\w ,.'-]{0,50})/i, "from"],
  [/\bi work (?:as|at|for)\s+([a-z][\w ,.'-]{0,50})/i, "work"],
  [/\bmy job is\s+([a-z][\w ,.'-]{0,50})/i, "job"],
  [/\bi (?:like|love|enjoy|adore)\s+(.{1,60})$/i, "likes"],
  [/\bi (?:hate|dislike|can't stand|dont like)\s+(.{1,60})$/i, "dislikes"],
  [/\bi(?:'m| am) (\d{1,3})(?: years old)?/i, "age"],
  [/\bmy (?:hobby|hobbies) (?:is|are)\s+(.{1,60})/i, "hobbies"]
];

function coerceOnline(v) {
  if (typeof v === "boolean") return v;
  if (typeof v === "string") {
    const s = v.toLowerCase().trim();
    if (["off", "false", "0", "no", "disabled"].includes(s)) return false;
    if (["on", "true", "1", "yes", "enabled"].includes(s)) return true;
  }
  if (v === 0 || v === 1) return !!v;
  return true;
}

function inferKindAndValue(rawText) {
  const text = String(rawText || "").replace(/\s+/g, " ").trim();
  const m = text.match(/^([a-z][a-z0-9_-]{0,24})\s*:\s*(.+)$/i);
  if (m) return { kind: m[1].toLowerCase(), value: m[2].trim(), text: m[1].toLowerCase() + ": " + m[2].trim() };
  return { kind: "note", value: text, text: "note: " + text };
}

function normalizeNode(item, index) {
  if (item == null) return null;
  if (typeof item === "string" || typeof item === "number") {
    const parsed = inferKindAndValue(String(item));
    if (!parsed.value) return null;
    return { id: index + 1, kind: parsed.kind, value: parsed.value, text: parsed.text, saved: stamp() };
  }
  if (typeof item !== "object") return null;

  const kindRaw = item.kind || item.type || item.k || "";
  const valueRaw = item.value != null ? item.value
    : item.val != null ? item.val
    : item.fact != null ? item.fact
    : item.content != null ? item.content
    : item.body != null ? item.body
    : item.snippet != null ? item.snippet
    : item.note != null ? item.note
    : "";
  const textRaw = item.text || item.label || "";

  let kind = String(kindRaw || "").toLowerCase().trim();
  let value = String(valueRaw || "").replace(/\s+/g, " ").trim();
  let text = String(textRaw || "").replace(/\s+/g, " ").trim();

  if (!value && text) {
    const parsed = inferKindAndValue(text);
    if (!kind) kind = parsed.kind;
    value = parsed.value;
    text = parsed.text;
  }
  if (!kind) kind = "note";
  if (!value) return null;
  if (!text) text = kind + ": " + value;

  const node = {
    id: Number.isFinite(item.id) ? item.id : index + 1,
    kind,
    value,
    text,
    saved: item.saved || item.updated || item.ts || stamp()
  };
  if (kind === "lookup") {
    node.key = item.key || lookupKey(item.query || value);
    if (item.query) node.query = String(item.query);
  }
  return node;
}

function collectRawNodes(data) {
  if (Array.isArray(data)) return data;
  if (!data || typeof data !== "object") return [];
  if (Array.isArray(data.nodes)) return data.nodes;
  if (Array.isArray(data.memory)) return data.memory;
  if (Array.isArray(data.memories)) return data.memories;
  if (Array.isArray(data.facts)) return data.facts;
  if (Array.isArray(data.items)) return data.items;
  return [];
}

function normalizeStore(data) {
  const rawNodes = collectRawNodes(data);
  const nodes = [];
  for (let i = 0; i < rawNodes.length; i++) {
    const n = normalizeNode(rawNodes[i], nodes.length);
    if (n) nodes.push(n);
  }
  nodes.forEach((n, i) => { n.id = i + 1; });
  const online = data && typeof data === "object" && !Array.isArray(data)
    ? coerceOnline(data.online)
    : true;
  return { online, nodes };
}

function loadStore() {
  try {
    const raw = localStorage.getItem(MEM_KEY);
    if (!raw) return { online: true, nodes: [] };
    const data = JSON.parse(raw);
    const store = normalizeStore(data);
    saveStore(store);
    return store;
  } catch {
    return { online: true, nodes: [] };
  }
}
function saveStore(store) {
  try {
    const clean = normalizeStore(store);
    localStorage.setItem(MEM_KEY, JSON.stringify(clean));
  } catch (e) {
    console.warn("Could not save memory", e);
  }
}
function pick(arr) { return arr[Math.floor(Math.random() * arr.length)]; }
function stamp() { return new Date().toISOString().slice(0, 19).replace("T", " "); }
function niceTime() {
  const d = new Date();
  return d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
}
function timeOfDay() {
  const h = new Date().getHours();
  if (h < 5) return "night";
  if (h < 12) return "morning";
  if (h < 17) return "afternoon";
  if (h < 21) return "evening";
  return "night";
}

function autocorrect(text) {
  return text.split(/\s+/).map(part => {
    let raw = part, punct = "";
    while (raw && "?!,.;:".includes(raw.slice(-1))) {
      punct = raw.slice(-1) + punct;
      raw = raw.slice(0, -1);
    }
    const key = raw.toLowerCase();
    if (AUTOCORRECT[key]) {
      let r = AUTOCORRECT[key];
      if (raw[0] && raw[0] === raw[0].toUpperCase()) r = r[0].toUpperCase() + r.slice(1);
      return r + punct;
    }
    return part;
  }).join(" ");
}

function nodeByKind(store, kind) {
  return store.nodes.find(n => n.kind === kind) || null;
}
function valueOf(store, kind) {
  const n = nodeByKind(store, kind);
  return n ? n.value : null;
}
function upsert(store, kind, value) {
  value = String(value || "").replace(/\s+/g, " ").replace(/[ .!?,;:]+$/g, "").trim();
  if (!value) return false;
  const text = kind + ": " + value;
  const existing = nodeByKind(store, kind);
  if (existing) {
    if (existing.text.toLowerCase() === text.toLowerCase()) return false;
    existing.text = text;
    existing.value = value;
    existing.saved = stamp();
  } else {
    store.nodes.push({ id: store.nodes.length + 1, kind, value, text, saved: stamp() });
  }
  saveStore(store);
  return true;
}

function forgetNodes(store, query) {
  const q = query.trim().toLowerCase();
  if (!q) return "Please tell me which fact to forget.";
  const keep = [];
  let dropped = 0;
  for (const node of store.nodes) {
    const blob = [node.kind, node.value, node.text].join(" ").toLowerCase();
    if (blob.includes(q)) dropped += 1;
    else keep.push(node);
  }
  store.nodes = keep.map((n, i) => ({ ...n, id: i + 1 }));
  saveStore(store);
  return dropped ? ("Forgotten " + dropped + " saved fact" + (dropped === 1 ? "." : "s.")) : "Nothing matched that description.";
}

function listNodes(store) {
  if (!store.nodes.length) return "Nothing stored yet. Just talk naturally and I'll remember the useful bits.";
  return "Memory (" + store.nodes.length + "):\n" + store.nodes.map(n => "  " + n.text).join("\n");
}

function clearAll(store) {
  store.nodes = [];
  saveStore(store);
  return "All saved facts have been cleared.";
}

function autoLearn(store, text) {
  if (!text || text.endsWith("?")) return false;
  let learned = false;
  for (const [re, kind] of PATTERNS) {
    const m = text.match(re);
    if (m) learned = upsert(store, kind, m[1]) || learned;
  }
  return learned;
}

function looksFactual(q) {
  if (SMALL.has(q) || q.includes("my name") || q.startsWith("who am i")) return false;
  if (/^(what is|what's|whats|who is|who's|when is|where is|why is|how does|how do|how many|how much|define |explain |what are|who was)/.test(q)) return true;
  return q.endsWith("?") && /^(what |who |when |where |why |which |how )/.test(q);
}

function clip(text) {
  text = String(text || "").replace(/\s+/g, " ").trim();
  if (text.length <= SNIPPET_LIMIT) return text;
  return text.slice(0, SNIPPET_LIMIT).replace(/\s+\S*$/, "") + "…";
}

function lookupKey(query) {
  return query.toLowerCase()
    .replace(/[^a-z0-9\s]/g, " ")
    .replace(/\b(what|whats|who|when|where|why|how|is|are|was|were|the|a|an|define|explain|please|tell|me|about)\b/g, " ")
    .replace(/\s+/g, " ").trim();
}

function findSaved(store, query) {
  const key = lookupKey(query);
  if (!key) return null;
  for (let i = store.nodes.length - 1; i >= 0; i--) {
    const n = store.nodes[i];
    if (n.kind !== "lookup") continue;
    const sk = n.key || lookupKey(n.value || "");
    if (key === sk || key.includes(sk) || sk.includes(key)) return n.value;
  }
  return null;
}

function keepLookup(store, query, snippet) {
  const key = lookupKey(query) || query.toLowerCase();
  if (!key || !snippet) return;
  let existing = store.nodes.find(n => n.kind === "lookup" && n.key === key);
  const text = "lookup: " + snippet;
  if (existing) {
    existing.value = snippet;
    existing.text = text;
    existing.query = query;
    existing.saved = stamp();
  } else {
    store.nodes.push({ id: store.nodes.length + 1, kind: "lookup", key, query, value: snippet, text, saved: stamp() });
    const lookups = store.nodes.filter(n => n.kind === "lookup");
    if (lookups.length > MAX_LOOKUPS) {
      const drop = new Set(lookups.slice(0, lookups.length - MAX_LOOKUPS).map(n => n.id));
      store.nodes = store.nodes.filter(n => !drop.has(n.id));
    }
    store.nodes.forEach((n, i) => n.id = i + 1);
  }
  saveStore(store);
}

function phraseOnline(query, snippet, fromMemory) {
  snippet = clip(snippet);
  if (!snippet) return snippet;
  if (snippet[0] === snippet[0].toLowerCase()) snippet = snippet[0].toUpperCase() + snippet.slice(1);
  if (!".!?…".includes(snippet.slice(-1))) snippet += ".";
  const q = query.toLowerCase().replace(/[?!.,]+$/g, "");
  let openers;
  if (fromMemory) openers = ["From what we saved earlier: ", "I still have this on file: ", "As noted previously: "];
  else if (/^(what is|what's|whats|define)/.test(q)) openers = ["In short, ", "The usual answer is this: ", "Here’s a concise picture: "];
  else if (/^(who is|who's|who was)/.test(q)) openers = ["They are generally described this way: ", "The standard profile is: ", "In brief: "];
  else openers = ["A clear way to put it: ", "The available summary is: ", "In brief: "];
  const closer = pick([" Happy to go a little deeper if useful.", " Say if you want that narrowed or expanded.", ""]);
  return pick(openers) + snippet + closer;
}

async function wikiSnippet(query) {
  let cleaned = query.replace(/^(what(?:'s|s| is)|who(?:'s| is| was)|where(?:'s| is)|when(?:'s| is)|define|explain|tell me about)\s+/i, "");
  cleaned = cleaned.replace(/[ ?!.]+$/g, "") || query;
  const searchUrl = "https://en.wikipedia.org/w/api.php?action=opensearch&search=" +
    encodeURIComponent(cleaned) + "&limit=1&namespace=0&format=json&origin=*";
  const sRes = await fetch(searchUrl);
  if (!sRes.ok) return null;
  const payload = await sRes.json();
  if (!payload || !payload[1] || !payload[1][0]) return null;
  const title = payload[1][0];
  const sumUrl = "https://en.wikipedia.org/api/rest_v1/page/summary/" + encodeURIComponent(title);
  const r = await fetch(sumUrl, { headers: { Accept: "application/json" } });
  if (!r.ok) return null;
  const data = await r.json();
  return data && data.extract ? clip(data.extract) : null;
}

function whoUser(store) {
  const labels = { 
    name: "name", location: "lives in", from: "from", work: "works", 
    job: "job", likes: "likes", dislikes: "dislikes", age: "age", hobbies: "hobbies" 
  };
  const bits = [];
  for (const [kind, label] of Object.entries(labels)) {
    const v = valueOf(store, kind);
    if (v) bits.push(label + " " + v);
  }
  if (!bits.length) return "I don't know much about you yet. Feel free to tell me.";
  return "Here's what I have: " + bits.join("; ") + ".";
}

function helpText() {
  return "Just type as you would in a normal chat.\n\nCommands:\n  nodes / memory     — list what I remember\n  forget <text>      — remove matching facts\n  remember <text>    — save a note\n  clear              — wipe all memory\n  online on|off      — toggle Wikipedia lookups\n  export             — download your memory as JSON\n  help               — this message\n\nOnline answers come from the live English Wikipedia API. Memory is saved under your guest ID — return to the same URL to resume.";
}

function canned(store, q) {
  const tod = timeOfDay();
  const name = valueOf(store, "name");

  if (["bye","goodbye","quit","exit"].includes(q)) {
    return "Goodbye" + (name ? ", " + name : "") + ". Take care. You can keep this tab open or close it.";
  }
  if (["hello","hi","hey","yo","hiya","howdy"].includes(q)) {
    const base = pick(GREETS);
    const todGreet = tod === "morning" ? "Good morning" : tod === "afternoon" ? "Good afternoon" : tod === "evening" ? "Good evening" : "Hello";
    const greeting = Math.random() > 0.4 ? todGreet : base.replace(/\.$/, "");
    return name ? greeting + " " + name + " — good to have you back." : greeting + ".";
  }
  if (["good morning","good afternoon","good evening"].includes(q)) return q[0].toUpperCase() + q.slice(1) + ". How are you?";
  if (q === "good night") return "Good night. Sleep well.";
  if (q.includes("how are you") || q.includes("how's it going") || q.includes("how are you doing")) return pick(HOWAMI);
  if (["what's up","whats up","sup"].includes(q)) return "Not much. How are you getting on?";
  if (q.includes("your name") || q === "who are you") return "You can call me ClevBot. I'm here to chat, remember useful things about you, and look up facts when needed.";
  if (["who am i","what do you know about me","what do you remember"].includes(q)) return whoUser(store);
  if (q.includes("thank")) return "You're welcome.";
  if (["help","commands","?"].includes(q)) return helpText();
  if (["what time is it","what's the time","what is the time"].includes(q)) {
    return "It's " + niceTime() + " right now.";
  }
  if (["what's the date","what is the date","what day is it"].includes(q)) {
    const d = new Date();
    return "Today is " + d.toLocaleDateString(undefined, { weekday: "long", year: "numeric", month: "long", day: "numeric" }) + ".";
  }
  if (!q) return "Whenever you're ready.";
  if (q.endsWith("?")) return pick(QREPLIES);
  return pick(PROMPTS);
}

async function reply(store, text) {
  const raw = autocorrect((text || "").trim());
  const q = raw.toLowerCase();

  if (["nodes","memory","memories","list nodes"].includes(q)) return listNodes(store);
  if (q.startsWith("forget ")) return forgetNodes(store, raw.slice(7));
  if (q.startsWith("remember ")) {
    upsert(store, "note", raw.slice(9));
    return "I'll keep that in mind.";
  }
  if (["clear","clear all","reset","forget all"].includes(q)) return clearAll(store);
  if (["online on","online enable","online enabled"].includes(q)) {
    store.online = true; saveStore(store); setStatus(store); return "Wikipedia lookup is on.";
  }
  if (["online off","online disable","online disabled"].includes(q)) {
    store.online = false; saveStore(store); setStatus(store); return "Wikipedia lookup is off.";
  }
  if (q === "online") return "Wikipedia lookup is " + (store.online ? "on." : "off.");
  if (q === "export") {
    try {
      const blob = new Blob([JSON.stringify(store, null, 2)], { type: "application/json" });
      const a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "clevbot-memory.json";
      a.click();
      URL.revokeObjectURL(a.href);
      return "Memory exported as clevbot-memory.json.";
    } catch {
      return "Could not export memory.";
    }
  }
  if (["help","commands"].includes(q)) return helpText();

  const learned = autoLearn(store, raw);
  if (["who am i","what do you know about me","what do you remember"].includes(q)) return whoUser(store);

  if (looksFactual(q)) {
    const saved = findSaved(store, raw);
    if (saved) return phraseOnline(raw, saved, true);
    if (store.online) {
      try {
        const snippet = await wikiSnippet(raw);
        if (snippet) {
          keepLookup(store, raw, snippet);
          return phraseOnline(raw, snippet, false);
        }
      } catch (err) { /* network */ }
      return "I checked online and could not find a reliable short answer. If you rephrase it, I will try again.";
    }
    return "Wikipedia lookup is off, and I do not have a saved note on that. Type 'online on' if you would like me to look it up.";
  }

  if (learned) {
    const name = valueOf(store, "name");
    if (name && q.includes("name")) return "Nice to meet you, " + name + ".";
    const location = valueOf(store, "location");
    if (location && (q.includes("live") || q.includes("from"))) return "Thanks — I'll remember that you live in " + location + ".";
    return pick(ACK);
  }
  return canned(store, q);
}

const logEl = document.getElementById("log");
const box = document.getElementById("box");
const form = document.getElementById("form");
const go = document.getElementById("go");
const loginOverlay = document.getElementById("login-overlay");
const guestBtn = document.getElementById("guest-btn");
const guestIdDisplay = document.getElementById("guest-id-display");
const gdprConsent = document.getElementById("gdpr-consent");
const privacyLink = document.getElementById("privacy-link");

let store = null;
let guestId = null;
let recaptchaToken = null;

window.onRecaptchaSuccess = function(token) {
  recaptchaToken = token;
  updateGuestButton();
};
window.onRecaptchaExpired = function() {
  recaptchaToken = null;
  updateGuestButton();
};
function updateGuestButton() {
  const ok = gdprConsent.checked && !!recaptchaToken;
  guestBtn.disabled = !ok;
}

gdprConsent.addEventListener("change", updateGuestButton);

privacyLink.addEventListener("click", (e) => {
  e.preventDefault();
  alert(
    "Privacy notice (GDPR)\n\n" +
    "• Guest ID and chat memory are stored only in your browser (localStorage + URL parameter).\n" +
    "• No account is created and no data is sent to a server except live Wikipedia lookups when you ask factual questions.\n" +
    "• You can clear memory anytime with the 'clear' command or by clearing site data.\n" +
    "• reCAPTCHA is used only to confirm you are human before starting a guest session.\n" +
    "• Wikipedia lookups use the public English Wikipedia API and are not stored on any server we control."
  );
});

function generateGuestId() {
  const chars = "abcdefghijklmnopqrstuvwxyz0123456789";
  let id = "Guest-";
  for (let i = 0; i < 6; i++) id += chars[Math.floor(Math.random() * chars.length)];
  return id;
}

function getGuestFromUrl() {
  const params = new URLSearchParams(window.location.search);
  return params.get("guest") || params.get("g") || null;
}

function setGuestInUrl(id) {
  const url = new URL(window.location);
  url.searchParams.set("guest", id);
  window.history.replaceState({}, "", url);
}

function startGuestSession(existingId) {
  if (existingId) {
    guestId = existingId;
  } else {
    guestId = generateGuestId();
  }
  MEM_KEY = "cb_memory_" + guestId;
  setGuestInUrl(guestId);
  sessionStorage.setItem("cb_guest_id", guestId);
  store = loadStore();
  document.body.classList.add("chat-mode");
  setStatus(store);
  const welcome = "Welcome, " + guestId + ". Return anytime with this URL to resume the same guest session. Factual lookups use the live English Wikipedia.";
  addMsg("cb", welcome);
  const name = valueOf(store, "name");
  if (name) {
    const tod = timeOfDay();
    const back = tod === "morning" ? "Good morning" : tod === "afternoon" ? "Good afternoon" : "Welcome back";
    addMsg("cb", back + ", " + name + ".");
  } else {
    addMsg("cb", "Type naturally, or type help. Your memory is saved to this guest ID.");
  }
  box.focus();
}

guestBtn.addEventListener("click", () => {
  if (!gdprConsent.checked || !recaptchaToken) {
    alert("Please accept the GDPR notice and complete the reCAPTCHA.");
    return;
  }
  startGuestSession(null);
});

// On load: if URL already has a guest ID, resume that session automatically
const urlGuest = getGuestFromUrl();
if (urlGuest) {
  startGuestSession(urlGuest);
} else if (sessionStorage.getItem("cb_guest_id")) {
  // same tab refresh without param yet
  startGuestSession(sessionStorage.getItem("cb_guest_id"));
}

function setStatus(s) {
  const gid = guestId || "guest";
  document.getElementById("status").textContent =
    "Wikipedia lookup " + (s.online ? "on" : "off") + " · " + gid;
}
function addMsg(role, text) {
  const div = document.createElement("div");
  div.className = "msg " + (role === "you" ? "you" : "cb");
  div.textContent = text;
  const time = document.createElement("span");
  time.className = "time";
  time.textContent = niceTime();
  div.appendChild(time);
  logEl.appendChild(div);
  logEl.scrollTop = logEl.scrollHeight;
}

function showTyping() {
  const el = document.createElement("div");
  el.className = "typing";
  el.id = "typing";
  el.innerHTML = "<span></span><span></span><span></span>";
  logEl.appendChild(el);
  logEl.scrollTop = logEl.scrollHeight;
}
function hideTyping() {
  const el = document.getElementById("typing");
  if (el) el.remove();
}


form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const line = box.value;
  if (!line.trim()) return;
  box.value = "";
  addMsg("you", line);
  go.disabled = true;
  showTyping();
  try {
    // Small natural delay
    await new Promise(r => setTimeout(r, 280 + Math.random() * 420));
    const answer = await reply(store, line);
    hideTyping();
    addMsg("cb", answer || q);
  } catch (err) {
    hideTyping();
    addMsg("cb", "Something went wrong. Please try again.");
    console.error(err);
  }
  go.disabled = false;
  box.focus();
});
</script>
