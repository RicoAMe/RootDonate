<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Root Donate</title>

  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #00ff9d;
      --accent: #ff00aa;
      --bg: #0a0a0f;
      --card: #111118;
      --border: #222226;
      --text: #e8e8e8;
      --muted: #999;
      --danger: #ff5c7a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      padding: 12px;
      padding-bottom: max(20px, env(safe-area-inset-bottom));
      display: flex;
      justify-content: center;
      line-height: 1.5;
    }

    .container {
      max-width: 440px;
      width: 100%;
      background: var(--card);
      border-radius: 28px;
      border: 1px solid var(--border);
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0, 255, 157, 0.07);
      margin-top: 8px;
    }

    .header {
      background: linear-gradient(135deg, #00ff9d 0%, #ff00aa 100%);
      color: #000;
      padding: 26px 20px 22px;
      text-align: center;
      position: relative;
    }

    .header h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.7rem;
      font-weight: 700;
      letter-spacing: -0.7px;
    }

    .profile-name {
      font-size: 1.1rem;
      font-weight: 700;
      margin-top: 4px;
      word-break: break-word;
    }

    .header-actions {
      position: absolute;
      top: 12px;
      right: 12px;
      display: flex;
      gap: 6px;
    }

    .header-btn {
      background: rgba(0, 0, 0, 0.18);
      border: none;
      color: #000;
      font-size: 12px;
      font-weight: 600;
      padding: 7px 12px;
      border-radius: 999px;
      cursor: pointer;
      min-height: 32px;
    }

    .content { padding: 20px 16px 28px; }

    .auth-form { display: none; flex-direction: column; gap: 12px; }
    .auth-form.active { display: flex; }

    input, textarea {
      width: 100%;
      padding: 15px 16px;
      border-radius: 14px;
      border: 1px solid #333;
      background: #1a1a22;
      color: white;
      font-size: 16px;
      outline: none;
      font-family: inherit;
    }

    input:focus, textarea:focus { border-color: var(--primary); }
    textarea { resize: vertical; min-height: 80px; }

    .auth-toggle { text-align: center; margin-top: 6px; font-size: 0.9rem; color: var(--muted); }
    .auth-toggle span { color: var(--primary); cursor: pointer; font-weight: 600; }

    .btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 14px;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      min-height: 52px;
    }

    .btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .primary-btn { background: var(--primary); color: #000; }
    .secondary-btn { background: #1f1f26; color: white; border: 1px solid #333; margin-top: 10px; }

    .danger-btn {
      background: transparent;
      color: var(--danger);
      border: 1px solid var(--danger);
      padding: 9px 16px;
      font-size: 0.85rem;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      min-height: 38px;
    }

    .section-title { font-size: 1.05rem; font-weight: 600; margin: 4px 0 14px; color: #ccc; }

    .item-card, .user-card, .chat-card {
      background: #1a1a22;
      border: 1px solid #2a2a32;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
    }

    .item-title, .user-name { font-weight: 700; font-size: 1.05rem; margin-bottom: 4px; word-break: break-word; }
    .item-price { font-size: 1rem; font-weight: 700; color: var(--primary); margin-bottom: 6px; }
    .item-desc, .user-handle { font-size: 0.9rem; color: var(--muted); margin-bottom: 14px; }

    .item-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

    .offers-list { margin-top: 14px; padding-top: 14px; border-top: 1px solid #2a2a32; font-size: 0.85rem; }

    .offer-item {
      background: #15151c;
      padding: 12px 14px;
      border-radius: 12px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .offer-email { color: var(--primary); font-weight: 600; word-break: break-all; flex: 1; }

    .empty-state { text-align: center; padding: 40px 16px; color: #666; font-size: 0.95rem; }

    .add-item-form {
      display: none;
      flex-direction: column; gap: 12px;
      margin-bottom: 20px;
      padding: 16px;
      background: #1a1a22;
      border-radius: 16px;
      border: 1px solid #2a2a32;
    }
    .add-item-form.active { display: flex; }

    .own-badge {
      display: none;
      text-align: center;
      font-size: 0.85rem;
      color: var(--primary);
      margin-bottom: 18px;
      font-weight: 600;
    }

    .chat-panel {
      display: none;
      flex-direction: column;
      height: 420px;
      background: #15151c;
      border-radius: 16px;
      border: 1px solid #2a2a32;
      margin-top: 16px;
      overflow: hidden;
    }
    .chat-panel.active { display: flex; }

    .chat-header {
      padding: 12px 16px;
      background: #1a1a22;
      border-bottom: 1px solid #2a2a32;
      font-weight: 600;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .msg {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 0.9rem;
      word-break: break-word;
    }
    .msg.me { align-self: flex-end; background: var(--primary); color: #000; border-bottom-right-radius: 4px; }
    .msg.them { align-self: flex-start; background: #2a2a35; border-bottom-left-radius: 4px; }

    .chat-input-area {
      display: flex;
      gap: 8px;
      padding: 12px;
      border-top: 1px solid #2a2a32;
      background: #1a1a22;
    }
    .chat-input-area input { flex: 1; padding: 12px 14px; border-radius: 12px; }
    .chat-send {
      background: var(--primary);
      color: #000;
      border: none;
      width: 46px;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .toast {
      position: fixed;
      bottom: max(28px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      background: #111;
      color: var(--primary);
      padding: 14px 26px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.95rem;
      display: none;
      z-index: 9999;
      max-width: 90%;
      text-align: center;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
    }
    .modal-overlay.active { display: flex; }

    .modal {
      background: #15151c;
      border: 1px solid #2a2a32;
      border-radius: 20px;
      padding: 24px 20px;
      width: 100%;
      max-width: 360px;
    }

    .modal h3 { font-family: 'Space Grotesk', sans-serif; margin-bottom: 16px; }
    .modal-actions { display: flex; gap: 10px; margin-top: 18px; }
    .modal-actions .btn { flex: 1; margin: 0; }

    .main-ui { display: none; }
    .main-ui.active { display: block; }

    .loading-text { text-align: center; padding: 60px 20px; color: #888; }

    .chat-btn {
      background: transparent;
      border: 1px solid var(--primary);
      color: var(--primary);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }

    .nav-tabs { display: none; gap: 8px; margin-bottom: 16px; flex-wrap: wrap; }
    .nav-tabs.visible { display: flex; }

    .nav-btn {
      flex: 1;
      min-width: 90px;
      padding: 10px 8px;
      border-radius: 12px;
      border: 1px solid #333;
      background: #1a1a22;
      color: #ccc;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
    }
    .nav-btn.active { background: var(--primary); color: #000; border-color: var(--primary); }

    .search-wrap { display: none; margin-bottom: 16px; }
    .search-wrap.visible { display: block; }

    .view-section { display: none; }
    .view-section.active { display: block; }

    .chat-meta { font-size: 0.85rem; color: var(--muted); margin-top: 4px; }
    .chat-actions { margin-top: 12px; display: flex; gap: 8px; flex-wrap: wrap; }

    .safety-notice {
      background: #1a1a22;
      border: 1px solid #ff5c7a44;
      color: #ff9aab;
      font-size: 0.8rem;
      padding: 12px 14px;
      border-radius: 12px;
      margin-bottom: 16px;
    }

    .footer-warning {
      text-align: center;
      font-size: 0.78rem;
      color: #ff9aab;
      padding: 18px 12px 6px;
      margin-top: 24px;
      border-top: 1px solid #2a2a32;
      line-height: 1.45;
    }

    .block-profile-btn {
      display: none;
      width: 100%;
      margin-bottom: 16px;
    }

    .user-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 4px;
    }
    .user-actions .btn,
    .user-actions .danger-btn {
      width: auto;
      flex: 1;
      min-width: 100px;
      padding: 11px 14px;
      font-size: 0.9rem;
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Root Donate</h1>
      <div class="profile-name" id="profileName">Loading...</div>
      <div class="header-actions">
        <button class="header-btn" id="myProfileBtn" style="display:none;">My Profile</button>
        <button class="header-btn" id="logoutBtn" style="display:none;">Logout</button>
        <button class="header-btn" id="loginHeaderBtn" style="display:none;">Login</button>
      </div>
    </div>

    <div class="content">
      <div class="auth-form" id="loginForm">
        <input type="email" id="loginEmail" placeholder="Email" autocomplete="email">
        <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password">
        <button class="btn primary-btn" id="loginBtn">Log In</button>
        <div class="auth-toggle">Don't have an account? <span id="showSignup">Sign Up</span></div>
      </div>

      <div class="auth-form" id="signupForm">
        <input type="text" id="signupName" placeholder="Display Name" autocomplete="name">
        <input type="text" id="signupHandle" placeholder="Handle (e.g. john)" autocomplete="username">
        <input type="email" id="signupEmail" placeholder="Email" autocomplete="email">
        <input type="password" id="signupPassword" placeholder="Password (min 6 characters)" autocomplete="new-password">
        <button class="btn primary-btn" id="signupBtn">Create Account</button>
        <div class="auth-toggle">Already have an account? <span id="showLogin">Log In</span></div>
      </div>

      <div class="main-ui" id="mainUI">
        <div class="own-badge" id="ownBadge">This is your profile – add items you want to sell</div>

        <button class="btn danger-btn block-profile-btn" id="blockProfileBtn">
          🚫 Block This User
        </button>

        <div class="safety-notice">
          ⚠ Safety first: Never send money or share personal details before meeting in a public place. Report anything suspicious.
        </div>

        <div class="nav-tabs" id="navTabs">
          <button class="nav-btn active" data-view="items">Items</button>
          <button class="nav-btn" data-view="users">Find People</button>
          <button class="nav-btn" data-view="chats">My Chats</button>
        </div>

        <div class="search-wrap" id="searchWrap">
          <input type="text" id="searchInput" placeholder="Search..." autocomplete="off">
        </div>

        <div class="view-section active" id="itemsView">
          <div class="section-title" id="itemsSectionTitle">Items for Sale</div>

          <div class="add-item-form" id="addItemForm">
            <input type="text" id="itemTitle" placeholder="Item name (e.g. iPhone 13)">
            <input type="text" id="itemPrice" placeholder="Price (e.g. $250 or Make Offer)">
            <textarea id="itemDesc" rows="2" placeholder="Description"></textarea>
            <button class="btn primary-btn" id="saveItemBtn">Add Item</button>
            <button class="btn secondary-btn" id="cancelItemBtn">Cancel​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​
