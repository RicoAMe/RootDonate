<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ROOTDONATE - Decentralized Lost & Found Node Network">
  <meta name="theme-color" content="#00ff41">
  <title>ROOTDONATE • LOST & FOUND NODES</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    :root {
      --neon: #00ff41;
      --neon-glow: #00ff4188;
      --accent: #00ff9d;
      --bg: #050505;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Courier New', monospace;
      background: var(--bg);
      color: var(--neon);
      overflow: hidden;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    canvas#matrix-bg { position: fixed; inset: 0; z-index: -1; opacity: 0.18; pointer-events: none; }

    .overlay {
      position: fixed; inset: 0;
      background: linear-gradient(transparent 50%, rgba(0,255,65,0.04) 50%),
                  radial-gradient(circle at center, transparent 55%, rgba(0,0,0,0.75) 100%);
      z-index: 1;
      animation: scanline 10s linear infinite;
      pointer-events: none;
    }

    @keyframes scanline { 0% { background-position: 0 0; } 100% { background-position: 0 400px; } }

    .auth-container, .modal-content {
      background: rgba(10,10,10,0.96);
      border: 2px solid var(--neon);
      border-radius: 16px;
      box-shadow: 0 0 60px var(--neon-glow), inset 0 0 40px rgba(0,255,65,0.1);
    }

    .auth-container { width: 100%; max-width: 420px; padding: 40px 32px; text-align: center; }

    .auth-header h1 {
      font-size: 3rem;
      letter-spacing: 4px;
      text-shadow: 0 0 25px var(--neon), 0 0 40px var(--neon);
      animation: glitch 1.5s infinite alternate;
    }

    .tab-switch {
      display: flex; margin: 25px 0 30px;
      border: 1px solid var(--neon); border-radius: 50px; overflow: hidden; background: #000;
    }

    .tab {
      flex: 1; padding: 14px; cursor: pointer; font-weight: bold;
      transition: all 0.3s ease;
    }

    .tab.active {
      background: var(--neon); color: #000; box-shadow: 0 0 20px var(--neon);
    }

    .form-container { display: flex; flex-direction: column; gap: 16px; }

    .form-container input, .form-container textarea {
      background: #000; border: 1px solid rgba(0,255,65,0.5); color: var(--neon);
      padding: 15px 18px; border-radius: 8px; transition: all 0.3s;
    }

    .form-container input:focus, .form-container textarea:focus {
      border-color: var(--neon); box-shadow: 0 0 15px var(--neon-glow); outline: none;
    }

    .btn {
      background: transparent; border: 2px solid var(--neon); color: var(--neon);
      padding: 15px; border-radius: 50px; cursor: pointer;
      font-size: 1.05rem; font-weight: bold; text-transform: uppercase; letter-spacing: 2px;
      transition: all 0.3s ease;
    }

    .btn:hover {
      background: var(--neon); color: #000;
      box-shadow: 0 0 30px var(--neon-glow); transform: translateY(-2px);
    }

    #mainApp { display: none; width: 100%; max-width: 1480px; height: 100vh; flex-direction: column; }

    .header {
      padding: 18px 40px; border-bottom: 1px solid rgba(0,255,65,0.25);
      display: flex; justify-content: space-between; align-items: center;
      background: rgba(5,5,5,0.85); backdrop-filter: blur(8px);
    }

    .nav {
      padding: 12px 40px; display: flex; gap: 12px;
      border-bottom: 1px solid rgba(0,255,65,0.2);
      background: rgba(5,5,5,0.85); flex-wrap: wrap;
    }

    .nav button {
      background: transparent; border: 1px solid var(--neon); color: var(--neon);
      padding: 10px 22px; border-radius: 50px; cursor: pointer;
      display: flex; align-items: center; gap: 8px; transition: all 0.3s;
    }

    .nav button.active, .nav button:hover {
      background: var(--neon); color: #000; box-shadow: 0 0 20px var(--neon-glow);
    }

    .search-bar {
      margin: 25px 40px 20px; width: calc(100% - 80px);
      padding: 18px 28px; background: #000; border: 1px solid var(--neon);
      border-radius: 50px; color: var(--neon); font-size: 1.1rem;
    }

    .search-bar:focus { box-shadow: 0 0 25px var(--neon-glow); outline: none; }

    .nodes-grid {
      flex: 1; padding: 0 40px 30px; overflow-y: auto;
      display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 24px;
    }

    .node-card {
      background: rgba(10, 25, 15, 0.9); border: 1px solid rgba(0, 255, 65, 0.3);
      border-radius: 16px; padding: 22px; cursor: pointer;
      transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
      position: relative; overflow: hidden;
    }

    .node-card:hover {
      transform: translateY(-12px) scale(1.02);
      border-color: var(--neon); box-shadow: 0 0 40px var(--neon-glow);
    }

    .log {
      height: 160px; background: #000; border-top: 1px solid rgba(0,255,65,0.3);
      padding: 16px 40px; overflow-y: auto; font-size: 0.9rem; opacity: 0.9;
    }

    .modal {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.92);
      z-index: 100; align-items: center; justify-content: center; backdrop-filter: blur(6px);
    }

    .modal-content { width: 90%; max-width: 520px; padding: 35px; position: relative; }

    .close-btn {
      position: absolute; top: 18px; right: 28px; font-size: 2.2rem;
      cursor: pointer; color: var(--neon);
    }

    .close-btn:hover { color: white; transform: rotate(90deg); }

    .share-url {
      background: #000; padding: 16px 20px; border-radius: 50px;
      font-size: 0.95rem; word-break: break-all; margin: 25px 0;
      border: 1px solid rgba(0,255,65,0.4); display: flex; align-items: center; gap: 14px;
    }

    .copy-btn {
      background: transparent; border: 2px solid var(--neon); color: var(--neon);
      padding: 8px 22px; border-radius: 50px; cursor: pointer; white-space: nowrap;
    }

    .copy-btn:hover { background: var(--neon); color: #000; }

    @keyframes glitch {
      0% { text-shadow: 2px 0 #00ff41, -2px 0 #ff00ff; }
      20% { text-shadow: -3px 0 #00ff41, 3px 0 #ff00ff; }
      40% { text-shadow: 2px 0 #00ff41, -2px 0 #00ffff; }
      100% { text-shadow: 2px 0 #00ff41, -2px 0 #ff00ff; }
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <canvas id="matrix-bg"></canvas>
  <div class="overlay"></div>

  <!-- AUTH -->
  <div class="auth-container" id="authContainer">
    <div class="auth-header">
      <h1>ROOTDONATE</h1>
      <p>LOST &amp; FOUND NODE NETWORK • EST 2026</p>
    </div>

    <div class="tab-switch">
      <div class="tab active" onclick="switchTab(0)">LOGIN NODE</div>
      <div class="tab" onclick="switchTab(1)">DEPLOY NODE</div>
    </div>

    <div class="form-container" id="loginForm">
      <input type="text" id="loginNodeId" placeholder="NODE ID" value="RD-7842">
      <input type="password" id="loginPass" placeholder="PASSPHRASE" value="demo123">
      <button class="btn" onclick="performLogin()">CONNECT TO MESH</button>
    </div>

    <div class="form-container hidden" id="signupForm">
      <input type="text" id="signupName" placeholder="NODE OPERATOR NAME">
      <input type="text" id="signupLoc" placeholder="YOUR CITY / REGION">
      <textarea id="signupBio" rows="3" placeholder="Short description of your node..."></textarea>
      <button class="btn" onclick="deployNode()">DEPLOY NEW NODE</button>
    </div>
  </div>

  <!-- MAIN APP -->
  <div id="mainApp">
    <div class="header">
      <h1>🔗 ROOTDONATE</h1>
      <p style="opacity:0.7; letter-spacing:4px;">LIVE DECENTRALIZED MESH • 2026</p>
    </div>

    <div class="nav">
      <button onclick="setTab(0)" class="active"><i class="fas fa-network-wired"></i> ALL NODES</button>
      <button onclick="setTab(1)"><i class="fas fa-search"></i> DEEP SCAN</button>
      <button onclick="showReportForm()"><i class="fas fa-plus-circle"></i> REPORT LOST</button>
      <button onclick="logout()"><i class="fas fa-power-off"></i> DISCONNECT</button>
    </div>

    <input type="text" id="searchInput" class="search-bar" placeholder="SEARCH LOST ITEMS • iphone, passport, wallet..." onkeyup="liveSearch()">

    <div class="nodes-grid" id="nodesGrid"></div>

    <h2 style="margin:15px 40px 10px; font-size:1.35rem; opacity:0.9;">NETWORK LOG</h2>
    <div id="log" class="log"></div>
  </div>

  <!-- ITEM MODAL -->
  <div class="modal" id="itemModal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal()">×</span>
      <div style="text-align:center; margin-bottom:25px;">
        <h2 id="modalItemName" style="color:var(--accent); font-size:2.3rem;"></h2>
        <p id="modalItemId" style="opacity:0.7;"></p>
      </div>

      <div class="share-url">
        <a id="modalUrlLink" href="#" target="_blank" style="flex:1; color:var(--neon); text-decoration:none;"></a>
        <button class="copy-btn" onclick="copyShareLink()">COPY LINK</button>
      </div>

      <p><strong>Location:</strong> <span id="modalLoc"></span></p>
      <p><strong>Found:</strong> <span id="modalTime"></span></p>
      <p><strong>Status:</strong> <span id="modalStatus" style="color:#0f0; font-weight:bold;"></span></p>

      <button class="btn" onclick="claimItem()" style="margin-top:30px; width:100%;">
        <i class="fas fa-hand-holding-heart"></i> CLAIM THIS ITEM
      </button>
    </div>
  </div>

  <!-- REPORT MODAL -->
  <div class="modal" id="reportModal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeReportModal()">×</span>
      <h2 style="text-align:center; margin-bottom:25px; color:var(--accent);">REPORT NEW LOST ITEM</h2>
      <input type="text" id="reportItem" placeholder="Item Name (e.g. Black iPhone 16)">
      <input type="text" id="reportLoc" placeholder="Last Known Location">
      <textarea id="reportNotes" rows="4" placeholder="Additional description..."></textarea>
      <button class="btn" onclick="submitReport()" style="width:100%;">SUBMIT TO MESH</button>
    </div>
  </div>

  <script>
    const DEMO_BASE = window.location.href.split('#')[0];

    // Matrix Rain
    const canvas = document.getElementById('matrix-bg');
    const ctx = canvas.getContext('2d');
    let drops = [];
    const chars = "01アイウエオカキクケコ0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ$@#%&";
    const fontSize = 16;

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      drops = Array(Math.floor(canvas.width / fontSize)).fill(1);
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function drawMatrix() {
      ctx.fillStyle = 'rgba(5,5,5,0.12)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#00ff41';
      ctx.font = `${fontSize}px monospace`;
      for (let i = 0; i < drops.length; i++) {
        ctx.fillText(chars[Math.floor(Math.random() * chars.length)], i * fontSize, drops[i] * fontSize);
        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
      }
    }
    setInterval(drawMatrix, 35);

    let sampleNodes = [
      { id: "RD-7842", item: "Black iPhone 16 Pro", loc: "Shibuya Crossing, Tokyo", time: "12m ago", status: "RECOVERED" },
      { id: "RD-3921", item: "Brown Leather Passport", loc: "Heathrow Airport, London", time: "47m ago", status: "ACTIVE" },
      { id: "RD-6719", item: "Gold Rolex Submariner", loc: "Downtown Dubai", time: "2h ago", status: "ACTIVE" },
      { id: "RD-1245", item: "Red Air Jordan 1", loc: "Times Square, NYC", time: "5h ago", status: "RECOVERED" },
      { id: "RD-8834", item: "MacBook Air M3", loc: "Kuala Lumpur Sentral", time: "11h ago", status: "ACTIVE" },
      { id: "RD-5567", item: "Gucci Wallet", loc: "Paris Gare du Nord", time: "Yesterday", status: "ACTIVE" }
    ];

    function generateShareUrl(node) {
      const data = btoa(JSON.stringify(node));
      return `${DEMO_BASE}#item=${data}`;
    }

    function loadNodes(filtered = sampleNodes) {
      const grid = document.getElementById('nodesGrid');
      grid.innerHTML = '';
      filtered.forEach(node => {
        node.url = generateShareUrl(node);
        const card = document.createElement('div');
        card.className = 'node-card';
        card.innerHTML = `
          <h3 style="margin-bottom:8px;">#${node.id}</h3>
          <p style="font-size:1.15rem; font-weight:bold;">${node.item}</p>
          <p style="opacity:0.8; margin:8px 0;">📍 ${node.loc}</p>
          <p style="margin-top:12px; opacity:0.75;">
            ${node.time} • <span style="color:${node.status==='RECOVERED'?'#0f0':'#ff0'}">${node.status}</span>
          </p>
        `;
        card.onclick = () => showItemDetail(node);
        grid.appendChild(card);
      });
    }

    function liveSearch() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      if (!q) return loadNodes();
      loadNodes(sampleNodes.filter(n => n.item.toLowerCase().includes(q) || n.loc.toLowerCase().includes(q)));
    }

    let currentItem = null;

    function showItemDetail(node) {
      currentItem = node;
      document.getElementById('modalItemName').textContent = node.item;
      document.getElementById('modalItemId').textContent = `#${node.id}`;
      const urlEl = document.getElementById('modalUrlLink');
      urlEl.textContent = node.url;
      urlEl.href = node.url;
      document.getElementById('modalLoc').textContent = node.loc;
      document.getElementById('modalTime').textContent = node.time;
      document.getElementById('modalStatus').textContent = node.status;
      document.getElementById('itemModal').style.display = 'flex';
      log(`📡 VIEWING ITEM ${node.id}`);
    }

    function copyShareLink() {
      if (!currentItem) return;
      navigator.clipboard.writeText(currentItem.url).then(() => {
        const btn = document.querySelector('#itemModal .copy-btn');
        const orig = btn.textContent;
        btn.textContent = '✓ COPIED!';
        setTimeout(() => btn.textContent = orig, 1800);
      });
    }

    function closeModal() { document.getElementById('itemModal').style.display = 'none'; }

    function claimItem() {
      if (!currentItem) return;
      alert(`✅ Claim request sent for ${currentItem.item}`);
      closeModal();
      log(`🛡️ CLAIM REQUEST SENT FOR #${currentItem.id}`);
    }

    function showReportForm() { document.getElementById('reportModal').style.display = 'flex'; }
    function closeReportModal() { document.getElementById('reportModal').style.display = 'none'; }

    function submitReport() {
      const item = document.getElementById('reportItem').value.trim() || "Unnamed Item";
      const loc = document.getElementById('reportLoc').value.trim() || "Unknown";
      closeReportModal();
      const newNode = { id: `RD-${1000 + Math.floor(Math.random()*9000)}`, item, loc, time: "Just now", status: "ACTIVE" };
      sampleNodes.unshift(newNode);
      loadNodes();
      log(`🚨 NEW REPORT: ${item}`);
    }

    function switchTab(n) {
      document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', i===n));
      document.getElementById('loginForm').classList.toggle('hidden', n!==0);
      document.getElementById('signupForm').classList.toggle('hidden', n!==1);
    }

    function performLogin() {
      document.getElementById('authContainer').style.display = 'none';
      document.getElementById('mainApp').style.display = 'flex';
      log("🔓 NODE CONNECTED SUCCESSFULLY");
      log("🌐 MESH SYNC COMPLETE • 142 NODES ONLINE");
    }

    function deployNode() {
      alert("🛰️ New node deployed successfully!");
      performLogin();
    }

    function logout() {
      if (confirm("Disconnect from mesh?")) {
        document.getElementById('mainApp').style.display = 'none';
        document.getElementById('authContainer').style.display = 'flex';
        log("🔌 NODE DISCONNECTED");
      }
    }

    function setTab(n) {
      document.querySelectorAll('.nav button').forEach((b,i) => b.classList.toggle('active', i===n));
      if (n === 0) loadNodes();
    }

    function log(message) {
      const el = document.getElementById('log');
      const time = new Date().toLocaleTimeString('en-GB',{hour12:false}).slice(0,8);
      el.innerHTML += `<span style="opacity:0.55">[${time}]</span> ${message}<br>`;
      el.scrollTop = el.scrollHeight;
    }

    function handleDeepLink() {
      const hash = window.location.hash;
      const match = hash.match(/#item=([A-Za-z0-9+/=]+)/);
      if (match) {
        try {
          const node = JSON.parse(atob(match[1]));
          if (!sampleNodes.find(n => n.id === node.id)) sampleNodes.unshift(node);
          performLogin();
          setTimeout(() => showItemDetail(node), 500);
        } catch(e) { console.error("Invalid link"); }
      }
    }

    window.addEventListener('hashchange', handleDeepLink);

    window.onload = () => {
      log("SYSTEM BOOT SEQUENCE COMPLETE");
      log("CONNECTING TO ROOTDONATE MESH...");
      loadNodes();
      handleDeepLink();
    };
  </script>
</body>
</html>
