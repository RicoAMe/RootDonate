<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1419">
  <meta name="description" content="Chat with RootDonate's private, browser-based AI. Prompts are processed entirely on your device.">
  <title>RootDonate — Browser AI</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f1419;
      --panel: #161e2b;
      --accent: #3b82f6;
      --text: #e2e8f0;
      --dim: #94a3b8;
      --border: #334155;
      --user: #1e3a5f;
      --bot: #1e293b;
      --danger: #ef4444;
      --success: #86efac;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button { font: inherit; cursor: pointer; }
    button:focus-visible,
    input:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
    }
    header, footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      padding: 0.85rem 1rem;
      background: var(--panel);
    }
    header {
      padding-top: calc(0.85rem + env(safe-area-inset-top));
      border-bottom: 1px solid var(--border);
    }
    header h1 { margin: 0; font-size: 1.2rem; font-weight: 650; }
    .subtitle { color: var(--dim); font-size: 0.75rem; }
    #chat {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      overflow-y: auto;
      padding: 1rem;
      scroll-behavior: smooth;
    }
    .msg {
      max-width: 85%;
      padding: 0.75rem 0.95rem;
      border-radius: 1rem;
      line-height: 1.45;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }
    .msg.user {
      align-self: flex-end;
      border-bottom-right-radius: 0.35rem;
      background: var(--user);
    }
    .msg.bot {
      align-self: flex-start;
      border-bottom-left-radius: 0.35rem;
      background: var(--bot);
    }
    .sender {
      margin-bottom: 0.2rem;
      font-size: 0.65rem;
      font-weight: 650;
      opacity: 0.7;
      text-transform: uppercase;
      letter-spacing: 0.03em;
    }
    .status {
      padding: 0.4rem 0.75rem;
      color: var(--dim);
      font-size: 0.75rem;
      text-align: center;
    }
    .status.online { color: var(--success); }
    .status.error { color: #fca5a5; }
    footer {
      padding-bottom: calc(0.75rem + env(safe-area-inset-bottom));
      border-top: 1px solid var(--border);
    }
    input {
      flex: 1;
      min-width: 0;
      padding: 0.8rem 0.9rem;
      border: 1px solid var(--border);
      border-radius: 0.8rem;
      background: #0f172a;
      color: var(--text);
      font-size: 16px;
    }
    footer button {
      min-width: 48px;
      height: 46px;
      padding: 0 1.1rem;
      border: 0;
      border-radius: 0.8rem;
      background: var(--accent);
      color: white;
      font-weight: 600;
    }
    footer button:disabled {
      cursor: not-allowed;
      opacity: 0.6;
    }
    .notice {
      margin: 0;
      padding: 0.6rem 1rem;
      background: #111827;
      color: var(--dim);
      font-size: 0.75rem;
      text-align: center;
      border-bottom: 1px solid var(--border);
    }
    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    @media (max-width: 480px) {
      .msg { max-width: 92%; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>RootDonate</h1>
      <div class="subtitle">Private AI running in your browser</div>
    </div>
  </header>

  <p class="notice">
    The AI model downloads from Hugging Face the first time. After that, all prompts are processed on this device — nothing is sent to an external AI API.
  </p>

  <main id="chat" aria-label="Conversation" aria-live="polite" aria-relevant="additions"></main>

  <div class="status" id="status" role="status" aria-live="polite">Browser AI is ready to load.</div>

  <footer>
    <label class="visually-hidden" for="input">Message</label>
    <input
      id="input"
      type="text"
      maxlength="2000"
      placeholder="Ask a question…"
      autocomplete="off"
      autofocus
    >
    <button id="send" type="button">Send</button>
  </footer>

  <script type="module">
    import { pipeline } from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1";

    const STATE_KEY = "rootdonate_browser_ai_state";
    const MODEL_ID = "onnx-community/SmolLM2-360M-Instruct";
    const MAX_HISTORY = 30;
    const CONTEXT_MESSAGES = 8;

    const chatEl = document.getElementById("chat");
    const inputEl = document.getElementById("input");
    const statusEl = document.getElementById("status");
    const sendBtn = document.getElementById("send");

    let generatorPromise = null;
    let busy = false;

    function setStatus(text, kind = "") {
      statusEl.textContent = text;
      statusEl.className = `status ${kind}`.trim();
    }

    function addMessage(text, who) {
      const message = document.createElement("div");
      message.className = `msg ${who}`;
      const sender = document.createElement("div");
      sender.className = "sender";
      sender.textContent = who === "user" ? "You" : "RootDonate AI";
      const body = document.createElement("div");
      body.textContent = String(text);
      message.append(sender, body);
      chatEl.append(message);
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    function loadHistory() {
      try {
        const raw = localStorage.getItem(STATE_KEY);
        const history = raw ? JSON.parse(raw) : [];
        return Array.isArray(history)
          ? history
              .filter(item => item && ["user", "assistant"].includes(item.role) && typeof item.text === "string")
              .slice(-MAX_HISTORY)
          : [];
      } catch {
        return [];
      }
    }

    const history = loadHistory();

    function saveHistory() {
      try {
        localStorage.setItem(STATE_KEY, JSON.stringify(history));
      } catch (err) {
        console.warn("Could not save chat history:", err);
      }
    }

    function showHistory() {
      if (history.length) {
        for (const item of history) {
          addMessage(item.text, item.role === "user" ? "user" : "bot");
        }
      } else {
        addMessage(
          "Hello, I’m RootDonate. I run a small AI model directly on your device. The first message downloads the model; after that everything stays local.",
          "bot"
        );
      }
    }

    async function getGenerator() {
      if (!generatorPromise) {
        generatorPromise = pipeline("text-generation", MODEL_ID, { dtype: "q4" })
          .catch(err => {
            generatorPromise = null;
            throw err;
          });
      }
      return generatorPromise;
    }

    function extractReply(result) {
      const generated = result?.[0]?.generated_text;
      if (typeof generated === "string") return generated.trim();
      if (Array.isArray(generated)) {
        const last = generated[generated.length - 1];
        if (typeof last?.content === "string") return last.content.trim();
        if (typeof last === "string") return last.trim();
      }
      return "";
    }

    async function sendMessage() {
      const text = inputEl.value.trim();
      if (!text || busy) return;

      busy = true;
      sendBtn.disabled = true;
      inputEl.value = "";

      addMessage(text, "user");
      history.push({ role: "user", text });
      if (history.length > MAX_HISTORY) history.splice(0, history.length - MAX_HISTORY);
      saveHistory();

      setStatus("Loading the on-device AI model… (first download can take a few minutes)");

      try {
        const model = await getGenerator();
        setStatus("Generating response on your device…");

        const messages = [
          {
            role: "system",
            content: "You are RootDonate, a helpful and concise assistant. You run locally in the user's browser and do not have access to real-time information."
          },
          ...history.slice(-CONTEXT_MESSAGES).map(item => ({
            role: item.role,
            content: item.text
          }))
        ];

        const result = await model(messages, {
          max_new_tokens: 160,
          do_sample: true,
          temperature: 0.7
        });

        const reply = extractReply(result);
        if (!reply) throw new Error("The local model returned an empty response.");

        addMessage(reply, "bot");
        history.push({ role: "assistant", text: reply });
        if (history.length > MAX_HISTORY) history.splice(0, history.length - MAX_HISTORY);
        saveHistory();

        setStatus("Browser AI is ready. All prompts are processed locally.", "online");
      } catch (error) {
        console.error("Browser AI failed:", error);
        const detail = "Could not load or run the browser AI. Check your connection for the initial model download, then try a modern browser with WebAssembly support.";
        addMessage(detail, "bot");
        setStatus(detail, "error");
      } finally {
        busy = false;
        sendBtn.disabled = false;
        inputEl.focus();
      }
    }

    sendBtn.addEventListener("click", () => void sendMessage());
    inputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        void sendMessage();
      }
    });

    showHistory();
    inputEl.focus();
  </script>
</body>
</html>
