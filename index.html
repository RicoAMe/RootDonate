<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a1f2f">
  <title>EarthMesh • Global Discovery</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

  <style>
    :root {
      --primary: #00b894;
      --accent: #00d2a0;
      --dark: #0a1f2f;
      --card: #13293d;
      --text: #e0f2f1;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--dark);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    .header {
      padding: 16px 20px;
      background: rgba(10, 31, 47, 0.98);
      border-bottom: 1px solid #1e3a5f;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header h1 {
      font-size: 1.65rem;
      font-weight: 600;
      letter-spacing: 1px;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .search-container {
      position: relative;
      margin: 16px 20px;
    }

    .search-bar {
      width: 100%;
      padding: 16px 20px 16px 52px;
      background: #1e3a5f;
      border: 1px solid #00b894;
      border-radius: 50px;
      color: white;
      font-size: 1.05rem;
      outline: none;
    }

    .suggestions {
      position: absolute;
      top: 100%;
      left: 0; right: 0;
      background: #13293d;
      border: 1px solid #00b894;
      border-radius: 16px;
      margin-top: 8px;
      max-height: 420px;
      overflow-y: auto;
      z-index: 200;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      display: none;
    }

    .suggestion-item {
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
      border-bottom: 1px solid #1e3a5f;
    }
    .suggestion-item:hover { background: #1e3a5f; }

    .nodes-grid {
      padding: 0 20px 20px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px;
    }

    .place-card {
      background: var(--card);
      border: 1px solid #1e3a5f;
      border-radius: 16px;
      padding: 20px;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .place-card:hover {
      transform: translateY(-6px);
      border-color: var(--primary);
      box-shadow: 0 10px 25px rgba(0,184,148,0.2);
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(10,31,47,0.97);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-content {
      background: #13293d;
      border-radius: 20px;
      width: 100%;
      max-width: 560px;
      max-height: 92vh;
      overflow-y: auto;
      padding: 24px;
      border: 1px solid #00b894;
    }

    .history-item {
      background: #1e3a5f;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 10px;
    }

    button.primary {
      background: var(--primary);
      color: #000;
      border: none;
      padding: 14px;
      border-radius: 50px;
      font-weight: 600;
      width: 100%;
      margin: 12px 0;
    }

    .apple-pay-btn {
      background: #000;
      color: white;
      border: 1px solid white;
      padding: 14px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 1.1rem;
      width: 100%;
    }

    .log {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 130px;
      background: #0a1f2f;
      padding: 12px 20px;
      font-size: 0.9rem;
      overflow-y: auto;
      border-top: 1px solid #1e3a5f;
    }

    @media (max-width: 480px) {
      .nodes-grid { grid-template-columns: 1fr; padding: 0 12px 20px; }
    }
  </style>
</head>
<body>

  <div class="header">
    <h1><i class="fas fa-globe"></i> EarthMesh</h1>
    <div class="user-info" onclick="showProfile()">
      <div style="text-align:right;">
        <div id="usernameDisplay" style="font-weight:600;">@explorer</div>
        <div id="balanceDisplay" style="font-size:0.9rem;color:#00d2a0;">12450 ROOT</div>
      </div>
      <i class="fas fa-user-circle" style="font-size:2rem;color:#00b894;"></i>
    </div>
  </div>

  <div class="search-container">
    <input type="text" id="searchInput" class="search-bar" 
           placeholder="Search any place on Earth..." 
           onkeyup="handleSearch()" autocomplete="off">
    <div id="suggestions" class="suggestions"></div>
  </div>

  <div class="nodes-grid" id="grid"></div>
  <div class="log" id="log"></div>

  <!-- PLACE DETAIL MODAL -->
  <div id="placeModal" class="modal">
    <div class="modal-content">
      <div style="font-size:4rem;text-align:center;margin:10px 0;" id="modalIcon"></div>
      <h2 id="modalName"></h2>
      <p id="modalLoc" style="opacity:0.8;margin-bottom:20px;"></p>

      <button onclick="copyShareLink()" style="background:transparent;border:1px solid #00b894;color:#00b894;width:100%;margin-bottom:10px;">
        🔗 Share Link (with History)
      </button>
      <button onclick="showDonateModal()" class="primary">💰 Donate ROOT Tokens</button>
      <button onclick="applePayDonate()" class="apple-pay-btn">
        <i class="fab fa-apple-pay"></i> Apple Pay
      </button>

      <h3 style="margin:25px 0 12px 0;">Donation History</h3>
      <div id="donationHistory" style="max-height:240px;overflow-y:auto;"></div>

      <button onclick="closePlaceModal()" style="background:transparent;border:1px solid #555;color:#aaa;width:100%;margin-top:20px;">
        Close
      </button>
    </div>
  </div>

  <!-- DONATE MODAL -->
  <div id="donateModal" class="modal">
    <div class="modal-content">
      <h2>Support <span id="donateTo"></span></h2>
      <p>Balance: <strong id="donorBalance"></strong> ROOT</p>
      <input type="number" id="donateAmount" value="150" style="width:100%;padding:14px;font-size:1.2rem;text-align:center;margin:15px 0;">
      <button onclick="confirmDonation()" class="primary">Confirm Donation</button>
      <button onclick="closeDonateModal()" style="background:transparent;border:1px solid #00b894;color:#00b894;width:100%;">Cancel</button>
    </div>
  </div>

  <!-- PROFILE MODAL -->
  <div id="profileModal" class="modal">
    <div class="modal-content">
      <h2>Account</h2>
      <p id="profileHandle" style="font-size:1.3rem;"></p>
      <p>Balance: <strong id="profileBalance"></strong> ROOT</p>
      
      <input type="number" id="topupAmount" placeholder="Top-up amount" style="width:100%;padding:12px;margin:15px 0;">
      <button onclick="topUpBalance()" class="primary">Top Up Balance</button>
      
      <button onclick="closeProfileModal()" style="background:transparent;border:1px solid #555;color:#aaa;width:100%;margin-top:10px;">Close</button>
    </div>
  </div>

  <script>
    let places = [];
    let currentUser = { handle: "@explorer", balance: 12450 };
    let currentPlace = null;

    const logEl = document.getElementById('log');
    function log(msg) {
      const time = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
      logEl.innerHTML += `<span style="opacity:0.6">[${time}]</span> ${msg}<br>`;
      logEl.scrollTop = logEl.scrollHeight;
    }

    // Real Search
    async function nominatimSearch(query) {
      if (query.length < 3) return [];
      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=8`, {
          headers: { 'User-Agent': 'EarthMesh' }
        });
        const data = await res.json();
        return data.map(item => ({
          name: item.name || item.display_name.split(',')[0],
          full: item.display_name,
          icon: "📍"
        }));
      } catch(e) { return []; }
    }

    async function handleSearch() {
      const q = document.getElementById('searchInput').value.trim();
      const container = document.getElementById('suggestions');
      if (q.length < 3) { container.style.display = 'none'; return; }

      container.innerHTML = `<div style="padding:16px;color:#88a5b8;">Searching...</div>`;
      container.style.display = 'block';

      const results = await nominatimSearch(q);
      container.innerHTML = '';

      results.forEach(place => {
        const div = document.createElement('div');
        div.className = 'suggestion-item';
        div.innerHTML = `<span style="font-size:1.6rem;">${place.icon}</span><div><strong>${place.name}</strong><br><small>${place.full}</small></div>`;
        div.onclick = () => {
          document.getElementById('searchInput').value = place.full;
          container.style.display = 'none';

          const newPlace = { id: `EM-${Date.now().toString().slice(-6)}`, name: place.name, loc: place.full, icon: place.icon, donations: [] };
          places.unshift(newPlace);
          renderPlaces();
          log(`📍 Added: ${place.name}`);
        };
        container.appendChild(div);
      });
    }

    function renderPlaces() {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      places.forEach(place => {
        const card = document.createElement('div');
        card.className = 'place-card';
        card.innerHTML = `
          <div style="font-size:3.5rem;text-align:center;margin:12px 0;">${place.icon}</div>
          <h3>${place.name}</h3>
          <p style="opacity:0.8;">${place.loc}</p>
        `;
        card.onclick = () => showPlaceDetail(place);
        grid.appendChild(card);
      });
    }

    function showPlaceDetail(place) {
      currentPlace = place;
      if (!place.donations) place.donations = [];

      document.getElementById('modalIcon').textContent = place.icon;
      document.getElementById('modalName').textContent = place.name;
      document.getElementById('modalLoc').textContent = place.loc;

      const histContainer = document.getElementById('donationHistory');
      if (place.donations.length === 0) {
        histContainer.innerHTML = `<p style="opacity:0.6;text-align:center;padding:20px;">No donations yet — be the first!</p>`;
      } else {
        histContainer.innerHTML = place.donations.map(d => `
          <div class="history-item">
            <strong>💰 ${d.amount} ROOT</strong> from ${d.from}<br>
            <small>${d.time}</small>
          </div>
        `).join('');
      }

      document.getElementById('placeModal').style.display = 'flex';
    }

    function closePlaceModal() { document.getElementById('placeModal').style.display = 'none'; }

    // Share Link with Full Donation History (Base64)
    function copyShareLink() {
      if (!currentPlace) return;
      const data = {
        id: currentPlace.id,
        name: currentPlace.name,
        loc: currentPlace.loc,
        icon: currentPlace.icon,
        donations: currentPlace.donations || []
      };
      const encoded = btoa(JSON.stringify(data));
      const shareUrl = `${window.location.origin}${window.location.pathname}#${encoded}`;
      navigator.clipboard.writeText(shareUrl);
      alert("✅ Share link with donation history copied!");
    }

    // Load from URL hash (persisted data)
    function loadFromHash() {
      const hash = window.location.hash.substring(1);
      if (!hash) return;

      try {
        const data = JSON.parse(atob(hash));
        const existing = places.find(p => p.id === data.id);
        
        if (existing) {
          existing.donations = data.donations || [];
          showPlaceDetail(existing);
        } else {
          const newPlace = {
            id: data.id,
            name: data.name,
            loc: data.loc || "Imported Location",
            icon: data.icon || "📍",
            donations: data.donations || []
          };
          places.unshift(newPlace);
          renderPlaces();
          showPlaceDetail(newPlace);
        }
        log("📥 Loaded shared place with donation history");
      } catch(e) {
        console.error("Invalid share link");
      }
    }

    function showDonateModal() {
      if (!currentUser) return alert("Please login");
      document.getElementById('donateTo').textContent = currentPlace.name;
      document.getElementById('donorBalance').textContent = currentUser.balance;
      document.getElementById('donateAmount').value = "150";
      document.getElementById('donateModal').style.display = 'flex';
    }

    function confirmDonation() {
      const amount = parseInt(document.getElementById('donateAmount').value);
      if (!amount || amount > currentUser.balance) return alert("Invalid amount");

      currentUser.balance -= amount;
      currentPlace.donations.unshift({
        from: currentUser.handle,
        amount: amount,
        time: new Date().toLocaleString()
      });

      document.getElementById('balanceDisplay').textContent = currentUser.balance + " ROOT";
      log(`💰 ${amount} ROOT donated to ${currentPlace.name}`);
      closeDonateModal();
      showPlaceDetail(currentPlace); // Refresh
    }

    function applePayDonate() {
      if (!currentUser) return alert("Login required");
      const amount = prompt("Enter amount for Apple Pay:", "200");
      if (amount) confirmDonation();
    }

    function closeDonateModal() { document.getElementById('donateModal').style.display = 'none'; }

    function showProfile() {
      document.getElementById('profileHandle').textContent = currentUser.handle;
      document.getElementById('profileBalance').textContent = currentUser.balance;
      document.getElementById('profileModal').style.display = 'flex';
    }

    function topUpBalance() {
      const amount = parseInt(document.getElementById('topupAmount').value);
      if (amount > 0) {
        currentUser.balance += amount;
        document.getElementById('balanceDisplay').textContent = currentUser.balance + " ROOT";
        document.getElementById('profileBalance').textContent = currentUser.balance;
        log(`💵 Topped up ${amount} ROOT`);
        alert("✅ Balance updated");
      }
    }

    function closeProfileModal() { document.getElementById('profileModal').style.display = 'none'; }

    // Initialize
    window.onload = () => {
      places = [
        { id: "EM-1001", name: "Machu Picchu", loc: "Cusco Region, Peru", icon: "🏔️", donations: [] },
        { id: "EM-1002", name: "Great Pyramid of Giza", loc: "Giza, Egypt", icon: "🪦", donations: [] }
      ];
      renderPlaces();
      document.getElementById('usernameDisplay').textContent = currentUser.handle;
      document.getElementById('balanceDisplay').textContent = currentUser.balance + " ROOT";
      log("🌍 EarthMesh Loaded");

      loadFromHash(); // Check for shared link
    };
  </script>
</body>
</html>
