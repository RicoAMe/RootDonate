### 1. Firestore Security Rules (copy-paste ready)

Go to Firebase Console → Firestore → Rules and replace everything with this:

```javascript
rules_version = '2';
service cloud.firestore {
 match /databases/{database}/documents {

 function isLoggedIn() {
 return request.auth != null;
 }
 function isOwner(uid) {
 return isLoggedIn() && request.auth.uid == uid;
 }
 function isParticipant(chatId) {
 return isLoggedIn() && 
 request.auth.uid in get(/databases/`\((database)/documents/chats/\)`(chatId)).data.participants;
 }
 function isNotBlocked(targetUid) {
 return !exists(/databases/`\((database)/documents/users/\)`(request.auth.uid)/blocked/$(targetUid));
 }

 // Users
 match /users/{userId} {
 allow read: if true;
 allow create: if isOwner(userId);
 allow update, delete: if isOwner(userId);

 match /items/{itemId} {
 allow read: if true;
 allow create, update, delete: if isOwner(userId);

 match /offers/{offerId} {
 allow read: if isOwner(userId) || 
 (isLoggedIn() && resource.data.buyerUid == request.auth.uid);
 allow create: if isLoggedIn() && 
 request.resource.data.buyerUid == request.auth.uid &&
 isNotBlocked(userId);
 allow update, delete: if false;
 }
 }

 // Blocked users list
 match /blocked/{blockedId} {
 allow read, write: if isOwner(userId);
 }
 }

 // Chats
 match /chats/{chatId} {
 allow read: if isParticipant(chatId);
 allow create: if isLoggedIn() && 
 request.auth.uid in request.resource.data.participants &&
 isNotBlocked(request.resource.data.participants[0]) &&
 isNotBlocked(request.resource.data.participants[1]);
 allow update, delete: if isParticipant(chatId);

 match /messages/{messageId} {
 allow read: if isParticipant(chatId);
 allow create: if isParticipant(chatId) &&
 request.resource.data.senderId == request.auth.uid &&
 request.resource.data.text is string &&
 request.resource.data.text.size() > 0 &&
 request.resource.data.text.size() <= 500;
 allow update, delete: if false;
 }
 }

 // Reports (anyone logged in can create, only the reporter can read their own)
 match /reports/{reportId} {
 allow create: if isLoggedIn() && 
 request.resource.data.reporterId == request.auth.uid;
 allow read: if isLoggedIn() && resource.data.reporterId == request.auth.uid;
 allow update, delete: if false;
 }
 }
