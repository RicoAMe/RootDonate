<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a0a0a">
  <title>ROOT DONATE • SOCIAL NODE</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

  <link rel="manifest" href="data:application/manifest+json,{
    &quot;name&quot;:&quot;ROOT DONATE&quot;,
    &quot;short_name&quot;:&quot;ROOT&quot;,
    &quot;start_url&quot;:&quot;.&quot;,
    &quot;display&quot;:&quot;standalone&quot;,
    &quot;background_color&quot;:&quot;#0a0a0a&quot;,
    &quot;theme_color&quot;:&quot;#ffd700&quot;
  }">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <style>
    :root { --neon: #ffd700; --glow: #ffd70088; --bg: #0a0a0a; --card: rgba(20,20,15,0.95); }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Courier New', monospace;
      background: var(--bg);
      color: var(--neon);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    canvas#matrix { position: fixed; inset: 0; z-index: -1; opacity: 0.15; }

    .header { padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,215,0,0.3); background: rgba(10,10,10,0.98); }
    .header h1 { font-size: 1.55rem; letter-spacing: 3px; text-shadow: 0 0 15px var(--neon); }

    .nav { padding: 12px 20px; display: flex; gap: 8px; flex-wrap: wrap; border-bottom: 1px solid rgba(255,215,0,0.2); background: rgba(10,10,10,0.98); }
    .nav button { background: transparent; border: 1px solid var(--neon); color: var(--neon); padding: 10px 20px; border-radius: 50px; cursor: pointer; transition: all 0.3s; }
    .nav button.active, .nav button:hover { background: var(--neon); color: #000; box-shadow: 0 0 25px var(--glow); }

    .search-bar { margin: 16px 20px; padding: 14px 24px; width: calc(100% - 40px); background: #111; border: 1px solid var(--neon); border-radius: 50px; color: var(--neon); }

    .nodes-grid {
      flex: 1; padding: 16px 20px; overflow-y: auto;
      display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px;
    }

    .place-card {
      background: var(--card); border: 1px solid rgba(255,215,0,0.35);
      border-radius: 16px; padding: 18px; cursor: pointer; transition: all 0.4s;
    }
    .place-card:hover { transform: translateY(-4px); border-color: var(--neon); box-shadow: 0 0 25px var(--glow); }

    .place-card .scan-bar {
      height: 4px; background: linear-gradient(90deg, #0f0, #ffd700);
      margin: 12px 0; border-radius: 2px; animation: scanPulse 2s infinite;
    }
    @keyframes scanPulse { 0%,100% { opacity: 0.6; } 50% { opacity: 1; } }

    .log { height: 160px; background: #0a0a0a; padding: 12px 20px; overflow-y: auto; font-size: 0.85rem; border-top: 1px solid rgba(255,215,0,0.3); }
    .scan-status { text-align: center; padding: 10px; background: #111; border: 1px solid #0f0; margin: 10px 20px; border-radius: 8px; }

    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.96); z-index: 100; align-items: center; justify-content: center; padding: 10px; }
    .modal-content {
      background: rgba(20,20,15,0.98); border: 2px solid var(--neon); border-radius: 16px;
      width: 100%; max-width: 520px; padding: 28px; max-height: 92vh; overflow-y: auto;
    }
    .history-item { padding: 12px; background: #111; margin-bottom: 8px; border-left: 4px solid #0f0; }
  </style>
</head>
<body>

  <canvas id="matrix"></canvas>

  <div class="header">
    <h1>🌐 ROOT DONATE</h1>
    <div style="display:flex; align-items:center; gap:12px;">
      <button onclick="toggleLearnMode()" style="padding:8px 16px; background:transparent; border:1px solid var(--neon); color:var(--neon); border-radius:50px;">📖 LEARN MODE</button>
      <div id="userSection" style="display:none;">
        <div class="user-info" onclick="showProfile()">
          <div id="avatar" class="avatar">👤</div>
          <div>
            <div id="usernameDisplay" style="font-weight:bold;"></div>
            <div id="balanceDisplay" style="font-size:0.8rem;color:#0f0;">0 ROOT</div>
          </div>
        </div>
      </div>
      <button onclick="showAuthModal()" id="authBtn" style="padding:8px 20px; border:1px solid var(--neon); background:transparent; color:var(--neon); border-radius:50px;">
        <i class="fas fa-user"></i> LOGIN
      </button>
    </div>
  </div>

  <div class="nav">
    <button class="active" onclick="setTab(0)">🌐 LIVE PLACES</button>
    <button onclick="setTab(1)">🔎 DEEP NUMIS</button>
    <button onclick="startAutoSearch()">📍 AUTO SEARCH (BY ADDRESS)</button>
    <button onclick="showReportModal()">📢 REPORT FIND</button>
    <button onclick="resetScan()">RESET</button>
  </div>

  <div id="scanStatus" class="scan-status" style="display:none;">
    <i class="fas fa-satellite-dish"></i> <span id="scanText">AUTO DETECTING YOUR ADDRESS & SEARCHING...</span>
  </div>

  <input type="text" id="searchInput" class="search-bar" placeholder="Search places..." onkeyup="filterContent()">

  <div class="nodes-grid" id="grid"></div>
  <div class="log" id="log"></div>

  <!-- PLACE DETAIL MODAL -->
  <div class="modal" id="placeModal">
    <div class="modal-content">
      <span onclick="closePlaceModal()" style="position:absolute;top:12px;right:20px;font-size:2.5rem;cursor:pointer;color:var(--neon);">×</span>
      <div id="modalIcon" style="font-size:3.5rem;margin-bottom:10px;text-align:center;"></div>
      <h2 id="modalName" style="color:#ffd700;text-align:center;"></h2>
      <p id="modalLoc" style="text-align:center;"></p>
      <div style="margin:20px 0;padding:15px;background:#111;border:1px solid var(--neon);border-radius:8px;">
        <strong>PROBABILITY:</strong> <span id="modalProb" style="color:#0f0;"></span><br>
        <strong>EXPECTED:</strong> <span id="modalExpected"></span>
      </div>

      <button onclick="copyShareLink()" style="width:100%;padding:12px;margin:8px 0;border:2px solid var(--neon);background:transparent;color:var(--neon);border-radius:50px;">📋 COPY BASE64 SHARE LINK</button>
      <button onclick="showDonateModal()" style="width:100%;padding:16px;border:2px solid #0f0;background:transparent;color:#0f0;border-radius:50px;">💰 DONATE WITH APPLE PAY</button>

      <h3 style="margin:25px 0 10px;color:#0f0;">💰 DONATION HISTORY</h3>
      <div id="placeDonationHistory" style="max-height:250px;overflow-y:auto;"></div>
    </div>
  </div>

  <!-- DONATE MODAL -->
  <div class="modal" id="donateModal">
    <div class="modal-content">
      <span onclick="closeDonateModal()" style="position:absolute;top:12px;right:20px;font-size:2.5rem;cursor:pointer;color:var(--neon);">×</span>
      <h2 style="color:#0f0;">💸 APPLE PAY DONATION</h2>
      <p id="donateTo" style="margin:15px 0;font-weight:bold;"></p>
      <div><strong>Balance:</strong> <span id="donorBalance" style="color:#0f0;"></span> ROOT</div>
      <input id="donateAmount" type="number" value="50" style="width:100%;padding:14px;margin:15px 0;background:#111;border:1px solid #0f0;color:var(--neon);font-size:1.4rem;text-align:center;">
      <button onclick="confirmDonation()" style="width:100%;padding:18px;margin-top:15px;border:2px solid #0f0;background:transparent;color:#0f0;border-radius:50px;font-weight:bold;">
        <i class="fab fa-apple"></i> CONFIRM APPLE PAY
      </button>
    </div>
  </div>

  <script>
    // Matrix Rain
    const canvas = document.getElementById('matrix');
    const ctx = canvas.getContext('2d');
    let drops = [];
    function resizeCanvas() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; drops = Array(Math.floor(canvas.width / 14)).fill(1); }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    function drawMatrix() {
      ctx.fillStyle = 'rgba(10,10,10,0.15)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#ffd700'; ctx.font = '14px monospace';
      const chars = '0123456789$€£¥₿🪙⚡';
      for (let i = 0; i < drops.length; i++) {
        ctx.fillText(chars[Math.floor(Math.random()*chars.length)], i*14, drops[i]*14);
        if (drops[i]*14 > canvas.height && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
      }
    }
    setInterval(drawMatrix, 40);

    // Utilities
    function toBase64Url(obj) {
      const str = btoa(unescape(encodeURIComponent(JSON.stringify(obj))));
      return str.replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
    }
    function generateShareUrl(place) {
      const minimal = { id: place.id, name: place.name, loc: place.loc, icon: place.icon };
      return `${location.origin}${location.pathname}#${toBase64Url(minimal)}`;
    }

    // State
    let places = [];
    let currentUser = null;
    let currentPlace = null;

    const logEl = document.getElementById('log');
    function log(msg) {
      const time = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
      logEl.innerHTML += `<span style="opacity:0.5">[${time}]</span> ${msg}<br>`;
      logEl.scrollTop = logEl.scrollHeight;
    }

    const realPlacePool = [
      { name: "Old Gold Mine Tailings", loc: "California Mother Lode", prob: "HIGH", exp: "Gold coins & nuggets", icon: "⛏️", dist: "8 km" },
      { name: "Civil War Campsite", loc: "Gettysburg Area, PA", prob: "VERY HIGH", exp: "Buttons, coins, relics", icon: "⚔️", dist: "35 km" },
      { name: "Abandoned 1920s Boardwalk", loc: "Atlantic City, NJ", prob: "MED", exp: "Silver dollars, tokens", icon: "🎡", dist: "22 km" },
      { name: "Ghost Town Saloon", loc: "Bodie, California", prob: "HIGH", exp: "Gold Rush era coins", icon: "🏚️", dist: "91 km" },
      { name: "Old Farmstead (1800s)", loc: "Upstate New York", prob: "MED", exp: "Large cents & half dollars", icon: "🌾", dist: "14 km" },
      { name: "Spanish Colonial Site", loc: "St. Augustine, FL", prob: "HIGH", exp: "Spanish reales", icon: "🏴‍☠️", dist: "67 km" }
    ];

    function startAutoSearch() {
      document.getElementById('scanStatus').style.display = 'block';
      document.getElementById('scanText').textContent = '🔍 DETECTING YOUR ADDRESS & SEARCHING...';
      log("📡 AUTO ADDRESS-BASED SEARCH STARTED...");

      setTimeout(() => {
        places = [];
        const shuffled = [...realPlacePool].sort(() => 0.5 - Math.random());
        const count = Math.floor(Math.random() * 3) + 4;

        for (let i = 0; i < count; i++) {
          const base = shuffled[i % shuffled.length];
          places.push({
            id: `SP-${1000 + Math.floor(Math.random()*9000)}`,
            name: base.name,
            loc: base.loc,
            probability: base.prob,
            expected: base.exp,
            icon: base.icon,
            distance: base.dist,
            donations: []
          });
        }

        renderPlaces();
        document.getElementById('scanStatus').style.display = 'none';
        log(`🌍 FOUND ${places.length} REAL PLACES NEAR YOUR ADDRESS`);
      }, 1600);
    }

    function renderPlaces(filtered = places) {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      filtered.forEach(place => {
        const card = document.createElement('div');
        card.className = 'place-card';
        card.innerHTML = `
          <div style="display:flex;justify-content:space-between;font-size:0.8rem;opacity:0.7;">
            <span>${place.id}</span><span style="color:#0f0;">${place.distance}</span>
          </div>
          <div style="font-size:3rem;margin:12px 0;text-align:center;">${place.icon}</div>
          <h3>${place.name}</h3>
          <p>📍 ${place.loc}</p>
          <div class="scan-bar"></div>
          <p><strong>PROB:</strong> <span style="color:#0f0;">${place.probability}</span></p>
        `;
        card.onclick = () => showPlaceDetail(place);
        grid.appendChild(card);
      });
    }

    function showPlaceDetail(place) {
      currentPlace = place;
      if (!place.donations) place.donations = [];

      document.getElementById('modalIcon').textContent = place.icon;
      document.getElementById('modalName').textContent = place.name;
      document.getElementById('modalLoc').textContent = `📍 ${place.loc}`;
      document.getElementById('modalProb').textContent = place.probability;
      document.getElementById('modalExpected').textContent = place.expected;

      let hist = '';
      place.donations.forEach(d => {
        hist += `<div class="history-item"><strong>💰 ${d.amount} ROOT</strong> from ${d.from}<br><small>${d.time}</small></div>`;
      });
      document.getElementById('placeDonationHistory').innerHTML = hist || '<p style="opacity:0.6;padding:10px;">No donations yet. Be the first!</p>';

      document.getElementById('placeModal').style.display = 'flex';
    }

    function closePlaceModal() { document.getElementById('placeModal').style.display = 'none'; }

    function copyShareLink() {
      if (!currentPlace) return;
      navigator.clipboard.writeText(generateShareUrl(currentPlace));
      alert("✅ Base64 Share Link Copied!");
    }

    function showDonateModal() {
      if (!currentUser) return alert("Please login first");
      document.getElementById('donateTo').textContent = `To: ${currentPlace.name}`;
      document.getElementById('donorBalance').textContent = currentUser.balance;
      document.getElementById('donateModal').style.display = 'flex';
    }

    function closeDonateModal() { document.getElementById('donateModal').style.display = 'none'; }

    function confirmDonation() {
      const amount = parseInt(document.getElementById('donateAmount').value);
      if (!amount || amount > currentUser.balance) return alert("Insufficient balance");

      currentUser.balance -= amount;
      currentPlace.donations.unshift({ from: currentUser.handle, amount, time: new Date().toLocaleString() });

      log(`💸 ${currentUser.handle} donated ${amount} ROOT to ${currentPlace.name}`);
      alert("✅ Apple Pay Donation Successful!");
      closeDonateModal();
      closePlaceModal();
      showPlaceDetail(currentPlace);
    }

    function filterContent() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      const filtered = q ? places.filter(p => p.name.toLowerCase().includes(q) || p.loc.toLowerCase().includes(q)) : places;
      renderPlaces(filtered);
    }

    function setTab(n) {
      document.querySelectorAll('.nav button').forEach((b,i) => b.classList.toggle('active', i===n));
      if (n === 0) renderPlaces();
    }

    function resetScan() {
      if (confirm("Reset mesh?")) startAutoSearch();
    }

    // Simple Auth
    function showAuthModal() { alert("Demo Login\n\nUsername: any value"); login(); }
    function login() {
      currentUser = { handle: "@you", balance: 1250 };
      document.getElementById('authBtn').style.display = 'none';
      document.getElementById('userSection').style.display = 'block';
      document.getElementById('usernameDisplay').textContent = currentUser.handle;
      document.getElementById('balanceDisplay').textContent = currentUser.balance + " ROOT";
      log("🔓 Logged in successfully");
    }

    function toggleLearnMode() { alert("ROOT DONATE v1.8 — Clean & Fixed"); }
    function showReportModal() { alert("Report a new find coming soon..."); }
    function showProfile() { alert(`Profile\n${currentUser ? currentUser.handle : 'Guest'}\nBalance: ${currentUser ? currentUser.balance : 0} ROOT`); }

    window.onload = () => {
      startAutoSearch();
      log("🔓 ROOT DONATE v1.8 — Fully Cleaned & Working");
    };
  </script>
</body>
</html>
