<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Internet AI</title>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-2: #334155;
      --accent: #3b82f6;
      --text: #f8fafc;
      --muted: #94a3b8;
      --user: #1d4ed8;
      --bot: #1e293b;
      --border: #334155;
      --radius: 20px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;
    }
    body {
      display: flex;
      flex-direction: column;
      min-height: 100dvh;
      padding-top: env(safe-area-inset-top);
    }
    header {
      background: rgba(30, 41, 59, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 0.75rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .logo {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      border-radius: 8px;
      display: grid; place-items: center;
      font-weight: 700;
    }
    h1 { font-size: 1.1rem; font-weight: 600; }
    button, select, input[type="text"], input[type="password"] {
      background: var(--surface-2);
      border: none;
      color: var(--text);
      border-radius: 10px;
      padding: 0.45rem 0.75rem;
      font-size: 0.85rem;
    }
    button.primary { background: var(--accent); color: white; }
    button:disabled { opacity: 0.4; }
    #status {
      font-size: 0.75rem;
      color: var(--muted);
      text-align: center;
      padding: 0.3rem;
      background: var(--surface);
    }
    #settings {
      background: var(--surface);
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--border);
      display: none;
      flex-direction: column;
      gap: 0.5rem;
    }
    #settings input { width: 100%; padding: 0.6rem; }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      -webkit-overflow-scrolling: touch;
    }
    .msg {
      max-width: 85%;
      padding: 0.7rem 0.9rem;
      border-radius: var(--radius);
      line-height: 1.45;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .user {
      align-self: flex-end;
      background: var(--user);
      color: white;
      border-bottom-right-radius: 6px;
    }
    .bot {
      align-self: flex-start;
      background: var(--bot);
      border: 1px solid var(--border);
      border-bottom-left-radius: 6px;
    }
    .empty {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: var(--muted);
      padding: 2rem;
    }
    .empty h2 { color: var(--text); font-size: 1.4rem; margin-bottom: 0.4rem; }
    .input-bar {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 0.7rem 1rem;
      padding-bottom: calc(0.7rem + env(safe-area-inset-bottom));
      display: flex;
      gap: 0.5rem;
      align-items: flex-end;
    }
    #input {
      flex: 1;
      resize: none;
      min-height: 48px;
      max-height: 120px;
      padding: 0.7rem 0.9rem;
      font-family: inherit;
      font-size: 1rem;
      background: var(--surface-2);
      border: 1px solid transparent;
      color: var(--text);
      border-radius: var(--radius);
    }
    #input:focus { outline: none; border-color: var(--accent); }
    #send {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--accent);
      color: white;
      font-size: 1.3rem;
      display: grid;
      place-items: center;
    }
  </style>
</head>
<body>
  <header>
    <div style="display:flex;align-items:center;gap:0.6rem">
      <div class="logo">AI</div>
      <h1>Internet AI</h1>
    </div>
    <button id="settingsBtn">Settings</button>
  </header>

  <div id="settings">
    <input id="baseUrl" type="text" placeholder="Base URL (e.g. https://api.openai.com/v1)">
    <input id="apiKey" type="password" placeholder="API Key">
    <input id="model" type="text" placeholder="Model (e.g. gpt-4o-mini)">
    <button id="saveSettings" class="primary">Save</button>
  </div>

  <div id="status">Set Base URL + API Key in Settings</div>

  <div id="chat">
    <div class="empty" id="empty">
      <div>
        <h2>Internet AI</h2>
        <p>OpenAI-compatible API<br>No Puter · Configure in Settings</p>
      </div>
    </div>
  </div>

  <div class="input-bar">
    <textarea id="input" placeholder="Message" rows="1"></textarea>
    <button id="send">↑</button>
  </div>

  <script>
    const chat = document.getElementById("chat");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const settingsBtn = document.getElementById("settingsBtn");
    const settingsPanel = document.getElementById("settings");
    const baseUrlInput = document.getElementById("baseUrl");
    const apiKeyInput = document.getElementById("apiKey");
    const modelInput = document.getElementById("model");
    const statusEl = document.getElementById("status");
    let empty = document.getElementById("empty");

    let messages = [];
    let isGenerating = false;

    function setStatus(t) { statusEl.textContent = t; }

    function loadSettings() {
      baseUrlInput.value = localStorage.getItem("ai_base") || "";
      apiKeyInput.value = localStorage.getItem("ai_key") || "";
      modelInput.value = localStorage.getItem("ai_model") || "gpt-4o-mini";
    }

    function saveSettings() {
      localStorage.setItem("ai_base", baseUrlInput.value.trim());
      localStorage.setItem("ai_key", apiKeyInput.value.trim());
      localStorage.setItem("ai_model", modelInput.value.trim());
      settingsPanel.style.display = "none";
      setStatus("Settings saved");
    }

    settingsBtn.addEventListener("click", () => {
      settingsPanel.style.display = settingsPanel.style.display === "flex" ? "none" : "flex";
    });
    document.getElementById("saveSettings").addEventListener("click", saveSettings);
    loadSettings();

    function addMessage(text, role) {
      if (empty) { empty.remove(); empty = null; }
      const div = document.createElement("div");
      div.className = "msg " + role;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    function updateBubble(div, text) {
      div.textContent = text;
      chat.scrollTop = chat.scrollHeight;
    }

    async function send() {
      if (isGenerating) return;
      const base = localStorage.getItem("ai_base") || "";
      const key = localStorage.getItem("ai_key") || "";
      const model = localStorage.getItem("ai_model") || "gpt-4o-mini";

      if (!base || !key) {
        setStatus("Set Base URL and API Key in Settings");
        return;
      }

      const text = input.value.trim();
      if (!text) return;

      isGenerating = true;
      sendBtn.disabled = true;

      addMessage(text, "user");
      messages.push({ role: "user", content: text });
      input.value = "";
      input.style.height = "auto";

      const botDiv = addMessage("…", "bot");
      let full = "";

      try {
        const res = await fetch(base.replace(/\/$/, "") + "/chat/completions", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + key
          },
          body: JSON.stringify({
            model,
            messages,
            stream: true,
            temperature: 0.7
          })
        });

        if (!res.ok) throw new Error(await res.text());

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split("\n");
          buffer = lines.pop();
          for (const line of lines) {
            if (line.startsWith("data: ")) {
              const data = line.slice(6);
              if (data === "[DONE]") continue;
              try {
                const json = JSON.parse(data);
                const delta = json.choices?.[0]?.delta?.content || "";
                if (delta) {
                  full += delta;
                  updateBubble(botDiv, full);
                }
              } catch {}
            }
          }
        }

        if (!full) full = "(no response)";
        messages.push({ role: "assistant", content: full });
        updateBubble(botDiv, full);
        setStatus("Ready");
      } catch (err) {
        updateBubble(botDiv, "Error: " + (err.message || err));
        setStatus("Error (check CORS / key)");
      } finally {
        isGenerating = false;
        sendBtn.disabled = false;
        input.focus();
      }
    }

    sendBtn.addEventListener("click", send);
    input.addEventListener("keydown", e => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    });
    input.addEventListener("input", () => {
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 120) + "px";
    });
  </script>
</body>
</html>
