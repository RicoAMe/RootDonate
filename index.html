<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ROOTDONATE • LOST & FOUND NODES</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    :root {
      --neon: #00ff41;
      --neon-dark: #00cc33;
      --neon-glow: #00ff4188;
      --bg: #050505;
      --card: #0a0a0a;
      --accent: #00ff9d;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Courier New', monospace;
      background: var(--bg);
      color: var(--neon);
      overflow: hidden;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    canvas#matrix-bg {
      position: fixed;
      inset: 0;
      z-index: -1;
      opacity: 0.15;
      pointer-events: none;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: linear-gradient(transparent 50%, rgba(0,255,65,0.03) 50%),
                  radial-gradient(circle at center, transparent 60%, rgba(0,0,0,0.6) 100%);
      pointer-events: none;
      z-index: 1;
      animation: scanline-move 8s linear infinite;
    }

    @keyframes scanline-move { 0% { background-position: 0 0; } 100% { background-position: 0 200px; } }

    /* AUTH & MAIN APP styles (same as before, shortened for brevity) */
    .auth-container, #mainApp { /* ... same as your previous code ... */ }
    /* (All previous styles kept - only new ones added below) */

    .node-card {
      background: rgba(0, 20, 10, 0.8);
      border: 1px solid rgba(0, 255, 65, 0.3);
      border-radius: 16px;
      padding: 20px;
      transition: all 0.3s;
      cursor: pointer;
    }
    .node-card:hover {
      transform: translateY(-8px);
      border-color: var(--neon);
      box-shadow: 0 0 30px var(--neon-glow);
    }

    /* ITEM DETAIL MODAL */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.95);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }
    .modal-content {
      width: 100%;
      max-width: 620px;
      background: var(--card);
      border: 3px solid var(--neon);
      border-radius: 20px;
      box-shadow: 0 0 80px var(--neon-glow);
      padding: 30px;
      position: relative;
    }
    .close-btn {
      position: absolute;
      top: 15px;
      right: 20px;
      font-size: 1.8rem;
      cursor: pointer;
      color: var(--neon);
    }

    .item-header {
      text-align: center;
      margin-bottom: 25px;
    }
    .item-header h2 {
      font-size: 2.2rem;
      color: var(--accent);
    }
    .share-url {
      background: #000;
      padding: 12px 18px;
      border-radius: 50px;
      font-size: 0.95rem;
      word-break: break-all;
      margin: 20px 0;
      border: 1px solid rgba(0,255,65,0.4);
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .copy-btn {
      background: transparent;
      border: 2px solid var(--neon);
      color: var(--neon);
      padding: 8px 16px;
      border-radius: 50px;
      cursor: pointer;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <canvas id="matrix-bg"></canvas>
  <div class="overlay"></div>

  <!-- AUTH SECTION (unchanged from your last version) -->
  <div class="auth-container" id="authContainer"> ... [same as your previous code] ... </div>

  <!-- MAIN APP -->
  <div id="mainApp">
    <div class="header">
      <h1>🔗 ROOTDONATE</h1>
      <p style="opacity:0.7; letter-spacing:3px;">LIVE NODE NETWORK • 2026</p>
    </div>

    <div class="nav"> ... [same buttons] ... </div>

    <input type="text" id="searchInput" class="search-bar" placeholder="SEARCH LOST ITEMS..." onkeyup="debouncedSearch()">

    <div class="nodes-grid" id="nodesGrid"></div>

    <h2 style="margin: 20px 30px 10px; font-size:1.4rem;">NETWORK LOG</h2>
    <div id="log" class="log"></div>
  </div>

  <!-- ITEM DETAIL MODAL -->
  <div class="modal" id="itemModal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal()">×</span>
      
      <div class="item-header">
        <h2 id="modalItemName"></h2>
        <p id="modalItemId" style="opacity:0.7;"></p>
      </div>

      <div class="share-url">
        <span id="modalUrl"></span>
        <button class="copy-btn" onclick="copyShareLink()">COPY LINK</button>
      </div>

      <p><strong>Location:</strong> <span id="modalLoc"></span></p>
      <p><strong>Found:</strong> <span id="modalTime"></span></p>
      <p><strong>Status:</strong> <span id="modalStatus" style="color:#0f0;"></span></p>

      <p style="margin-top:25px; opacity:0.8;" id="modalDesc">
        This item was scanned and registered on the ROOTDONATE mesh network.
      </p>

      <button class="btn" style="margin-top:30px;" onclick="claimItem()">
        <i class="fas fa-hand-holding-heart"></i> CLAIM THIS ITEM
      </button>
    </div>
  </div>

  <script>
    // Matrix background (same as before)
    const canvas = document.getElementById('matrix-bg');
    const ctx = canvas.getContext('2d');
    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
    window.addEventListener('resize', resize);
    resize();

    const chars = "01アイウエオカキクケコ0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ$@#%&";
    const fontSize = 15;
    let drops = [];
    function initDrops() { drops = Array(Math.floor(canvas.width / fontSize)).fill(1); }
    function draw() {
      ctx.fillStyle = 'rgba(5,5,5,0.1)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#00ff41';
      ctx.font = `${fontSize}px monospace`;
      for (let i = 0; i < drops.length; i++) {
        ctx.fillText(chars[Math.floor(Math.random()*chars.length)], i*fontSize, drops[i]*fontSize);
        if (drops[i]*fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
      }
    }
    setInterval(draw, 35);
    initDrops();

    // Sample data with URLs
    const sampleNodes = [
      { id: "N-7842", item: "iPhone 16 Pro", loc: "Shibuya Crossing", time: "2m ago", status: "RECOVERED", url: "https://rootdonate.network/item/N-7842" },
      { id: "N-7841", item: "Leather Passport", loc: "Haneda Airport", time: "17m ago", status: "ACTIVE", url: "https://rootdonate.network/item/N-7841" },
      { id: "N-7839", item: "Gucci Wallet", loc: "Shinjuku Station", time: "41m ago", status: "ACTIVE", url: "https://rootdonate.network/item/N-7839" },
      { id: "N-7838", item: "MacBook Air M3", loc: "Roppongi", time: "2h ago", status: "RECOVERED", url: "https://rootdonate.network/item/N-7838" },
      { id: "N-7837", item: "Rolex Submariner", loc: "Ginza", time: "5h ago", status: "ACTIVE", url: "https://rootdonate.network/item/N-7837" }
    ];

    function loadSampleNodes() {
      const grid = document.getElementById('nodesGrid');
      grid.innerHTML = '';
      sampleNodes.forEach(node => {
        const card = document.createElement('div');
        card.className = 'node-card';
        card.innerHTML = `
          <h3>#${node.id}</h3>
          <p><strong>${node.item}</strong></p>
          <p style="opacity:0.8; font-size:0.9rem;">📍 ${node.loc}</p>
          <p style="margin-top:12px; opacity:0.7;">${node.time} • <span style="color:${node.status==='RECOVERED'?'#0f0':'#ff0'}">${node.status}</span></p>
        `;
        card.onclick = () => showItemDetail(node);
        grid.appendChild(card);
      });
    }

    let currentItem = null;
    function showItemDetail(node) {
      currentItem = node;
      document.getElementById('modalItemName').textContent = node.item;
      document.getElementById('modalItemId').textContent = `#${node.id}`;
      document.getElementById('modalUrl').textContent = node.url;
      document.getElementById('modalLoc').textContent = node.loc;
      document.getElementById('modalTime').textContent = node.time;
      document.getElementById('modalStatus').textContent = node.status;
      document.getElementById('itemModal').style.display = 'flex';
      log(`📡 VIEWING ITEM ${node.id}`);
    }

    function closeModal() {
      document.getElementById('itemModal').style.display = 'none';
    }

    function copyShareLink() {
      if (!currentItem) return;
      navigator.clipboard.writeText(currentItem.url).then(() => {
        const btn = document.querySelector('.copy-btn');
        const orig = btn.textContent;
        btn.textContent = 'COPIED ✓';
        setTimeout(() => btn.textContent = orig, 2000);
        log(`🔗 SHARE LINK COPIED: ${currentItem.url}`);
      });
    }

    function claimItem() {
      if (confirm("Initiate claim process for this item?")) {
        log(`🛡️ CLAIM REQUEST SENT FOR ${currentItem.id}`);
        alert("Claim request submitted to the mesh network.");
        closeModal();
      }
    }

    // Rest of your existing functions (log, login, etc.) remain the same
    function log(msg) {
      const logEl = document.getElementById('log');
      const time = new Date().toLocaleTimeString('en-GB');
      logEl.innerHTML += `<span style="color:#00ff8866">[${time}]</span> ${msg}<br>`;
      logEl.scrollTop = logEl.scrollHeight;
    }

    // ... (keep all your previous login, quickLogin, enterMainApp, etc.)

    window.onload = () => {
      // Call loadSampleNodes after login as before
    };
  </script>
</body>
</html>
