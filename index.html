<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cleverbot-style AI (No Model)</title>
<style>
:root { --bg:#0f172a; --surface:#1e293b; --accent:#10b981; --text:#f1f5f9; }
* { box-sizing:border-box; margin:0; padding:0; }
body { background:var(--bg); color:var(--text); font-family:system-ui,sans-serif; height:100dvh; display:flex; flex-direction:column; }
header { background:var(--surface); padding:0.8rem 1rem; display:flex; justify-content:space-between; align-items:center; }
#chat { flex:1; overflow-y:auto; padding:1rem; display:flex; flex-direction:column; gap:0.6rem; }
.msg { max-width:80%; padding:0.7rem 1rem; border-radius:16px; line-height:1.4; }
.user { align-self:flex-end; background:var(--accent); color:black; border-bottom-right-radius:4px; }
.bot { align-self:flex-start; background:var(--surface); border-bottom-left-radius:4px; }
.input-bar { display:flex; gap:0.5rem; padding:0.6rem; background:var(--surface); }
#input { flex:1; padding:0.7rem; border:none; border-radius:20px; background:#334155; color:white; font-size:1rem; }
button { padding:0.6rem 1rem; border:none; border-radius:20px; background:var(--accent); color:black; font-weight:600; cursor:pointer; }
</style>
</head>
<body>
<header>
  <strong>Cleverbot-style (No Model)</strong>
  <div>
    <button id="clear">Clear Memory</button>
    <button id="export">Export</button>
  </div>
</header>
<div id="chat"></div>
<div class="input-bar">
  <input id="input" placeholder="Talk to me... I learn from you" autofocus>
  <button id="send">Send</button>
</div>

<script>
let memory = JSON.parse(localStorage.getItem("cleverbot_memory") || "[]");
// memory = array of {input: string, response: string}

function similarity(a, b) {
  a = a.toLowerCase().trim();
  b = b.toLowerCase().trim();
  if (a === b) return 1;
  if (!a || !b) return 0;
  // Simple token overlap + length penalty (good enough for Cleverbot-style)
  const setA = new Set(a.split(/\s+/));
  const setB = new Set(b.split(/\s+/));
  let intersect = 0;
  for (const w of setA) if (setB.has(w)) intersect++;
  const union = setA.size + setB.size - intersect;
  const jaccard = union ? intersect / union : 0;
  const lenDiff = Math.abs(a.length - b.length) / Math.max(a.length, b.length);
  return jaccard * 0.7 + (1 - lenDiff) * 0.3;
}

function findBestResponse(input) {
  if (memory.length === 0) return null;
  let best = null;
  let bestScore = 0.25; // minimum threshold
  for (const pair of memory) {
    const score = similarity(input, pair.input);
    if (score > bestScore) {
      bestScore = score;
      best = pair.response;
    }
  }
  return best;
}

function addToMemory(input, response) {
  memory.push({ input: input.trim(), response: response.trim() });
  // Keep last 2000 pairs to avoid bloat
  if (memory.length > 2000) memory = memory.slice(-2000);
  localStorage.setItem("cleverbot_memory", JSON.stringify(memory));
}

function addMessage(text, isUser) {
  const div = document.createElement("div");
  div.className = "msg " + (isUser ? "user" : "bot");
  div.textContent = text;
  document.getElementById("chat").appendChild(div);
  document.getElementById("chat").scrollTop = 99999;
}

function reply(userText) {
  let response = findBestResponse(userText);

  if (!response) {
    // Default responses when nothing matches (classic Cleverbot style)
    const defaults = [
      "I don't know what to say yet. Tell me more.",
      "Interesting. What do you think?",
      "I need to learn more from you.",
      "Can you explain that differently?",
      "I'm still learning. Keep talking.",
      "Why do you say that?",
      "That's new to me."
    ];
    response = defaults[Math.floor(Math.random() * defaults.length)];
  }

  addMessage(response, false);
  addToMemory(userText, response);
}

document.getElementById("send").onclick = () => {
  const text = document.getElementById("input").value.trim();
  if (!text) return;
  addMessage(text, true);
  document.getElementById("input").value = "";
  setTimeout(() => reply(text), 400 + Math.random() * 600); // slight delay like real Cleverbot
};

document.getElementById("input").onkeydown = e => {
  if (e.key === "Enter") document.getElementById("send").click();
};

document.getElementById("clear").onclick = () => {
  if (confirm("Clear all learned memory?")) {
    memory = [];
    localStorage.removeItem("cleverbot_memory");
    document.getElementById("chat").innerHTML = "";
    addMessage("Memory cleared. I'm starting fresh.", false);
  }
};

document.getElementById("export").onclick = () => {
  const blob = new Blob([JSON.stringify(memory, null, 2)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "cleverbot-memory.json";
  a.click();
};

// Welcome
addMessage("Hi! I'm a pure Cleverbot-style bot. I have no AI model — I only learn from what people say to me. Start talking!", false);
</script>
</body>
</html>
