<!DOCTYPE html>
<html lang="en" class="govuk-template">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>RootDonate Scanner</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/govuk-frontend@5.11.2/dist/govuk/govuk-frontend.min.css">
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
  <style>
    :root {
      --dwp-blue: #1d70b8;
      --dwp-blue-dark: #003078;
      --dwp-black: #0b0c0c;
      --dwp-light: #f3f2f1;
      --dwp-white: #ffffff;
      --dwp-red: #d4351c;
      --dwp-green: #00703c;
    }

    body {
      background: linear-gradient(135deg, #f8f8f8 0%, #e8eef5 50%, #f3f2f1 100%);
      min-height: 100vh;
      position: relative;
      overflow-x: hidden;
    }

    body::before,
    body::after {
      content: "";
      position: fixed;
      border-radius: 50%;
      z-index: -1;
      opacity: 0.12;
      pointer-events: none;
    }
    body::before {
      width: 520px;
      height: 520px;
      background: radial-gradient(circle, var(--dwp-blue) 0%, transparent 70%);
      top: -180px;
      right: -140px;
    }
    body::after {
      width: 380px;
      height: 380px;
      background: radial-gradient(circle, var(--dwp-blue-dark) 0%, transparent 70%);
      bottom: -120px;
      left: -100px;
    }

    #app, #authScreen {
      max-width: 960px;
      margin: 0 auto;
      padding: 20px 16px 40px;
      position: relative;
      z-index: 1;
    }

    #authScreen {
      background: rgba(255,255,255,0.94);
      backdrop-filter: blur(8px);
      border-radius: 12px;
      padding: 32px 24px;
      box-shadow: 0 8px 32px rgba(11,12,12,0.08);
      margin-top: 40px;
    }

    header.govuk-header {
      background: var(--dwp-black);
      border-bottom: 4px solid var(--dwp-blue);
      margin-bottom: 24px;
      border-radius: 0 0 8px 8px;
    }

    #log {
      min-height: 280px;
      max-height: 48vh;
      overflow-y: auto;
      border: 1px solid #b1b4b6;
      border-radius: 10px;
      padding: 16px;
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(4px);
      margin: 16px 0 20px;
      box-shadow: 0 4px 16px rgba(11,12,12,0.06);
    }

    .entry {
      margin-bottom: 12px;
      padding: 12px 14px;
      background: #fff;
      border-left: 4px solid var(--dwp-blue);
      border-radius: 6px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.05);
      transition: transform 0.15s ease;
    }
    .entry:hover { transform: translateX(2px); }
    .entry.user { border-left-color: var(--dwp-green); background: #e8f5e9; }
    .entry.ai { border-left-color: var(--dwp-blue); }
    .entry.priority { border-left-color: var(--dwp-red); background: #fef7f7; }
    .entry.scanner { font-family: ui-monospace, Menlo, monospace; font-size: 0.92em; }

    .status-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin: 12px 0;
      font-size: 15px;
      align-items: center;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 12px 0;
      align-items: flex-end;
    }
    .controls .govuk-button { margin-bottom: 0; }

    .skip-link {
      position: absolute;
      top: -40px;
      left: 0;
      background: var(--dwp-black);
      color: #fff;
      padding: 8px;
      z-index: 100;
    }
    .skip-link:focus { top: 0; }

    .govuk-button, .govuk-input, .govuk-textarea {
      border-radius: 4px;
    }

    .auth-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }
    .auth-tabs button { flex: 1; }
    .auth-form { display: none; }
    .auth-form.active { display: block; }

    .support-link {
      text-align: center;
      margin-top: 24px;
    }

    @media (max-width: 640px) {
      #log { max-height: 42vh; }
      .controls { flex-direction: column; align-items: stretch; }
    }
  </style>
</head>
<body class="govuk-template__body">
  <a href="#log" class="skip-link govuk-skip-link">Skip to log</a>

  <div id="authScreen">
    <h1 class="govuk-heading-l">RootDonate Scanner</h1>
    <p class="govuk-body">Sign in or create an account to access the scanner</p>

    <div class="auth-tabs">
      <button type="button" id="showSignIn" class="govuk-button govuk-button--secondary">Sign In</button>
      <button type="button" id="showSignUp" class="govuk-button govuk-button--secondary">Sign Up</button>
    </div>

    <div id="authError" class="govuk-error-message" role="alert" aria-live="assertive"></div>

    <form id="signInForm" class="auth-form active">
      <div class="govuk-form-group">
        <label class="govuk-label" for="signInEmail">Email</label>
        <input class="govuk-input" id="signInEmail" type="email" required autocomplete="email">
      </div>
      <div class="govuk-form-group">
        <label class="govuk-label" for="signInPassword">Password</label>
        <input class="govuk-input" id="signInPassword" type="password" required autocomplete="current-password">
      </div>
      <button class="govuk-button" type="submit">Sign in</button>
      <button type="button" id="resetBtn" class="govuk-button govuk-button--secondary" style="margin-left:8px;">Forgot password?</button>
    </form>

    <form id="signUpForm" class="auth-form">
      <div class="govuk-form-group">
        <label class="govuk-label" for="signUpEmail">Email</label>
        <input class="govuk-input" id="signUpEmail" type="email" required autocomplete="email">
      </div>
      <div class="govuk-form-group">
        <label class="govuk-label" for="signUpPassword">Password</label>
        <input class="govuk-input" id="signUpPassword" type="password" required minlength="6" autocomplete="new-password">
      </div>
      <button class="govuk-button" type="submit">Create account</button>
    </form>

    <hr class="govuk-section-break govuk-section-break--l govuk-section-break--visible">

    <button id="googleBtn" class="govuk-button govuk-button--secondary" type="button" style="width:100%;">Continue with Google</button>

    <div class="support-link">
      <a href="https://monzo.me/iandreme" target="_blank" rel="noopener" class="govuk-link">Support via Monzo</a>
    </div>
  </div>

  <div id="app" style="display:none;">
    <header class="govuk-header" role="banner">
      <div class="govuk-header__container govuk-width-container">
        <div class="govuk-header__logo">
          <span class="govuk-header__logotype-text">RootDonate</span>
        </div>
        <div class="govuk-header__content">
          <span id="userInfo" class="govuk-header__link"></span>
          <button id="signOutBtn" class="govuk-button govuk-button--secondary" type="button" style="margin-left:15px;">Sign out</button>
        </div>
      </div>
    </header>

    <div class="govuk-width-container">
      <main id="log" role="log" aria-live="polite" aria-relevant="additions" aria-label="Scanner log" class="govuk-body"></main>

      <div class="status-bar" aria-live="polite" aria-atomic="true">
        <span>Wanted: <strong id="wanted" class="govuk-tag govuk-tag--red">0</strong></span>
        <span id="units">Units: 12</span>
        <span class="govuk-tag">Local Scanner</span>
      </div>

      <div class="controls">
        <button id="scanBtn" class="govuk-button" type="button">Scan</button>
        <button id="priorityBtn" class="govuk-button govuk-button--warning" type="button">Priority</button>
        <div class="govuk-form-group" style="margin-bottom:0; flex:1; min-width:200px;">
          <label class="govuk-label" for="plate">Plate lookup</label>
          <input class="govuk-input" id="plate" type="text" placeholder="Plate lookup…" maxlength="8" autocomplete="off" autocapitalize="characters">
        </div>
        <button id="lookupBtn" class="govuk-button govuk-button--secondary" type="button">Lookup</button>
        <button id="clearBtn" class="govuk-button govuk-button--warning" type="button">Clear Log</button>
        <a href="https://monzo.me/iandreme" target="_blank" rel="noopener" class="govuk-button govuk-button--secondary" style="text-decoration:none;">Donate</a>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBvcCBsPiMxS7G2evPjM7sANp-zSy_RkKM",
      authDomain: "rootdonate-61e61.firebaseapp.com",
      databaseURL: "https://rootdonate-61e61-default-rtdb.firebaseio.com",
      projectId: "rootdonate-61e61",
      storageBucket: "rootdonate-61e61.firebasestorage.app",
      messagingSenderId: "754240963907",
      appId: "1:754240963907:web:5417c2763d8f02108bdbf6",
      measurementId: "G-0SC5R5ELT1"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();
    auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);

    const authScreen = document.getElementById("authScreen");
    const app = document.getElementById("app");
    const authError = document.getElementById("authError");
    const googleBtn = document.getElementById("googleBtn");
    const signOutBtn = document.getElementById("signOutBtn");
    const userInfo = document.getElementById("userInfo");
    const log = document.getElementById("log");
    const wantedEl = document.getElementById("wanted");
    const unitsEl = document.getElementById("units");
    const plateInput = document.getElementById("plate");
    const clearBtn = document.getElementById("clearBtn");

    const signInForm = document.getElementById("signInForm");
    const signUpForm = document.getElementById("signUpForm");
    const showSignIn = document.getElementById("showSignIn");
    const showSignUp = document.getElementById("showSignUp");
    const resetBtn = document.getElementById("resetBtn");

    let wanted = 0;
    let currentUser = null;
    let logEntries = [];

    const routineMessages = [
      "Unit 12, traffic stop on Portola Drive. Blue Comet, plates check clean.",
      "BOLO: Silver Dominator last seen heading north on Ocean Drive. Possible stolen.",
      "Dispatch, 10-20 at the marina. Crowd gathering, no further assistance required.",
      "Unit 7 requesting backup near Ambrosia. Routine disturbance, subjects compliant.",
      "All units, be advised of roadworks on Vice City Beach. Expect delays.",
      "Unit 4, vehicle check on black Gauntlet. Owner on scene, no flags.",
      "10-45 at the strip club. Noise complaint only, units can clear.",
      "Patrol 9, suspicious vehicle parked outside the bank. Checking now."
    ];

    const priorityMessages = [
      "Priority! Shots fired at the docks. Multiple units respond. Suspects armed.",
      "Officer down near the industrial district. All available units code 3.",
      "Armed robbery in progress at the jewellery store on Ocean Drive. Hostage situation.",
      "Pursuit in progress. Black Dominator, high speed through downtown. Spike strips authorised.",
      "10-99 officer needs immediate assistance. Ambush reported near the airport.",
      "Explosion reported at the construction site. Possible IED. Evacuate the area."
    ];

    const plates = {
      "VC1234": "Stolen — Black Dominator, linked to recent heist",
      "LEON01": "Registered to local resident — no flags",
      "GTA666": "Wanted — multiple felonies, approach with caution",
      "VCPD1": "Police vehicle — do not stop",
      "AMBRO": "Rental — last seen near Ambrosia resort"
    };

    function showError(msg) {
      authError.textContent = msg || "";
    }

    function showForm(form) {
      signInForm.classList.remove("active");
      signUpForm.classList.remove("active");
      form.classList.add("active");
      showError("");
    }

    showSignIn.onclick = () => showForm(signInForm);
    showSignUp.onclick = () => showForm(signUpForm);

    signInForm.onsubmit = async (e) => {
      e.preventDefault();
      showError("");
      const email = document.getElementById("signInEmail").value.trim();
      const password = document.getElementById("signInPassword").value;
      try {
        await auth.signInWithEmailAndPassword(email, password);
      } catch (err) {
        showError(err.message || "Sign in failed");
      }
    };

    signUpForm.onsubmit = async (e) => {
      e.preventDefault();
      showError("");
      const email = document.getElementById("signUpEmail").value.trim();
      const password = document.getElementById("signUpPassword").value;
      try {
        await auth.createUserWithEmailAndPassword(email, password);
      } catch (err) {
        showError(err.message || "Sign up failed");
      }
    };

    resetBtn.onclick = async () => {
      const email = document.getElementById("signInEmail").value.trim();
      if (!email) {
        showError("Enter your email first");
        return;
      }
      try {
        await auth.sendPasswordResetEmail(email);
        showError("Password reset email sent (check spam)");
      } catch (err) {
        showError(err.message || "Could not send reset email");
      }
    };

    googleBtn.onclick = async () => {
      showError("");
      const provider = new firebase.auth.GoogleAuthProvider();
      try {
        await auth.signInWithPopup(provider);
      } catch (err) {
        showError(err.message || "Google sign-in failed");
      }
    };

    signOutBtn.onclick = () => auth.signOut();

    async function loadFromCloud(uid) {
      try {
        const snap = await db.ref(`users/${uid}/data`).once("value");
        const data = snap.val();
        if (data) {
          wanted = data.wanted || 0;
          wantedEl.textContent = wanted;
          if (Array.isArray(data.log)) {
            logEntries = data.log;
            log.innerHTML = "";
            data.log.forEach(e => addEntry(e.text, e.type, false));
          }
        }
      } catch (e) {
        console.warn("Cloud load failed", e);
      }
    }

    async function saveToCloud() {
      if (!currentUser) return;
      try {
        await db.ref(`users/${currentUser.uid}/data`).set({
          wanted,
          log: logEntries.slice(-100),
          updated: Date.now()
        });
      } catch (e) {
        console.warn("Cloud save failed", e);
      }
    }

    auth.onAuthStateChanged(async user => {
      if (user) {
        currentUser = user;
        authScreen.style.display = "none";
        app.style.display = "block";
        userInfo.textContent = `👤 ${user.displayName || user.email || "User"}`;
        await loadFromCloud(user.uid);
        if (log.children.length === 0) {
          addEntry("RootDonate Scanner online. Local traffic active.", "scanner");
        }
      } else {
        currentUser = null;
        authScreen.style.display = "block";
        app.style.display = "none";
        userInfo.textContent = "";
        log.innerHTML = "";
        logEntries = [];
        wanted = 0;
        wantedEl.textContent = "0";
        showError("");
      }
    });

    function addEntry(text, type = "scanner", shouldSave = true) {
      const div = document.createElement("div");
      div.className = `entry ${type}`;
      div.textContent = text;
      if (type === "priority") div.setAttribute("role", "alert");
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
      logEntries.push({ text, type, ts: Date.now() });
      if (logEntries.length > 120) logEntries.shift();
      if (shouldSave) saveToCloud();
    }

    function randomFrom(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    document.getElementById("scanBtn").onclick = () => {
      if (!currentUser) return;
      addEntry(randomFrom(routineMessages), "scanner");
    };

    document.getElementById("priorityBtn").onclick = () => {
      if (!currentUser) return;
      addEntry(randomFrom(priorityMessages), "priority");
      wanted = Math.min(5, wanted + 1);
      wantedEl.textContent = wanted;
      saveToCloud();
    };

    document.getElementById("lookupBtn").onclick = () => {
      if (!currentUser) return;
      const p = plateInput.value.trim().toUpperCase();
      if (!p) return;
      const result = plates[p] || "No records found";
      addEntry(`Plate ${p}: ${result}`, "scanner");
      plateInput.value = "";
    };

    clearBtn.onclick = async () => {
      if (!currentUser || !confirm("Clear the entire log and cloud data? This cannot be undone.")) return;
      log.innerHTML = "";
      logEntries = [];
      wanted = 0;
      wantedEl.textContent = "0";
      try {
        await db.ref(`users/${currentUser.uid}/data`).remove();
      } catch (e) {
        console.warn("Cloud clear failed", e);
      }
      addEntry("Log and cloud data cleared.", "scanner", false);
    };

    setInterval(() => {
      if (currentUser) {
        unitsEl.textContent = `Units: ${8 + Math.floor(Math.random() * 10)}`;
      }
    }, 5000);
  </script>

  <script type="module">
    import { initAll } from 'https://cdn.jsdelivr.net/npm/govuk-frontend@5.11.2/dist/govuk/govuk-frontend.min.js';
    initAll();
  </script>
</body>
</html>
