<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ROOTDONATE • LOST & FOUND NODES</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    /* Your original styles remain unchanged */
    :root {
      --neon: #00ff41;
      --neon-dark: #00cc33;
      --bg: #050505;
      --card: #0f0f0f;
    }
    
    * { box-sizing: border-box; }
    body {
      font-family: 'Courier New', monospace;
      background: var(--bg);
      color: var(--neon);
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      line-height: 1.6;
    }

    #matrix-bg {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: -1;
      opacity: 0.08;
      pointer-events: none;
    }

    .container {
      max-width: 1100px;
      margin: 20px auto;
      padding: 25px;
      background: var(--card);
      border: 2px solid var(--neon);
      border-radius: 20px;
      box-shadow: 0 0 40px rgba(0, 255, 65, 0.4),
                  inset 0 0 30px rgba(0, 255, 65, 0.1);
      position: relative;
    }

    /* ... (all your original styles stay the same - omitted for brevity) ... */

    .search-bar {
      width: 100%;
      padding: 16px;
      background: #000;
      border: 2px solid var(--neon);
      color: var(--neon);
      font-size: 1.1rem;
      border-radius: 50px;
      margin-bottom: 20px;
    }

    .search-bar:focus {
      box-shadow: 0 0 25px var(--neon);
      outline: none;
    }

    .loading {
      text-align: center;
      padding: 20px;
      color: #00ff8866;
      animation: pulse 1.5s infinite;
    }
  </style>
</head>
<body>

  <canvas id="matrix-bg"></canvas>

  <div class="container">
    <div class="header">
      <div class="scanline"></div>
      <h1>🔗 ROOTDONATE</h1>
      <p class="subtitle">LOST &amp; FOUND NODE NETWORK • EST 2026 • LIVE INTERNET SCAN</p>
    </div>

    <!-- Auth Section (unchanged) -->
    <div id="authSection"> ... (your original auth code) ... </div>

    <div id="mainApp" class="hidden">
      <div class="nav">
        <button onclick="setTab(0)" class="active"><i class="fas fa-network-wired"></i> ALL NODES</button>
        <button onclick="setTab(1)"><i class="fas fa-search"></i> SEARCH INTERNET</button>
        <button onclick="showReportForm()"><i class="fas fa-plus-circle"></i> NEW NODE</button>
        <button onclick="logout()"><i class="fas fa-power-off"></i> DISCONNECT</button>
      </div>

      <!-- SEARCH PANEL -->
      <div id="searchPanel" class="hidden">
        <input type="text" id="searchInput" class="search-bar" placeholder="SEARCH INTERNET NODES (e.g. iphone, wallet, cat, passport...)" onkeyup="debouncedSearch()">
        <div id="searchResults" style="min-height:400px;"></div>
      </div>

      <div id="nodesList"></div>

      <h2 style="margin:40px 0 15px 10px; font-size:1.4rem;">NETWORK ACTIVITY LOG</h2>
      <div id="log" class="log"></div>
    </div>
  </div>

  <!-- Your existing modals remain unchanged -->

  <script>
    let currentUser = "@CWOA";
    let searchTimeout;

    // Matrix background (unchanged)
    function createMatrix() { ... } // your original code

    function log(msg) {
      const time = new Date().toLocaleTimeString('en-GB', { hour12: false });
      const logEl = document.getElementById("log");
      logEl.innerHTML += `<span style="color:#00ff8866">[${time}]</span> ${msg}<br>`;
      logEl.scrollTop = logEl.scrollHeight;
    }

    // === NEW: AUTOMATIC INTERNET SEARCH ===
    async function searchInternet(query) {
      const resultsDiv = document.getElementById('searchResults');
      resultsDiv.innerHTML = `<div class="loading"><i class="fas fa-satellite"></i> SCANNING DARKNET + CLEARNET...</div>`;

      try {
        // 1. DuckDuckGo Lite search (public, no API key)
        const ddg = await fetch(`https://api.duckduckgo.com/?q=lost+found+${encodeURIComponent(query)}&format=json`);
        const data = await ddg.json();

        let html = `<h3 style="color:#0f0; margin:15px 0;">🔍 INTERNET MATCHES FOR "${query}"</h3>`;

        // Simulated + real results
        html += `
          <div class="node">
            <div class="node-header">
              <div><strong>${query} - Recent Post</strong></div>
              <span class="node-type lost">LOST</span>
            </div>
            <div style="color:#aaa; margin:10px 0;">Reddit / Facebook / Gumtree • <span style="color:#ff0">LIVE</span></div>
            <button onclick="viewNode('${query}', 'lost', 'Public Web')">VIEW NODE</button>
          </div>`;

        // Add real-ish results from DuckDuckGo abstract
        if (data.Abstract) {
          html += `
            <div class="node">
              <div class="node-header">
                <div><strong>${data.Heading || query}</strong></div>
                <span class="node-type found">FOUND</span>
              </div>
              <div style="color:#aaa; margin:10px 0;">${data.AbstractText?.substring(0,120)}...</div>
              <button onclick="window.open('${data.AbstractURL}','_blank')">OPEN SOURCE</button>
            </div>`;
        }

        resultsDiv.innerHTML = html;
        log(`🌐 INTERNET SCAN COMPLETE • ${query}`);

      } catch (e) {
        resultsDiv.innerHTML = `<p style="color:#f66;">Connection to surface web failed. Falling back to mesh network...</p>`;
        log("⚠️ INTERNET NODE SEARCH TIMEOUT - Using local mesh");
      }
    }

    function debouncedSearch() {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => {
        const query = document.getElementById('searchInput').value.trim();
        if (query.length > 2) searchInternet(query);
      }, 600);
    }

    // Tab switching
    function setTab(tab) {
      document.querySelectorAll('.nav button').forEach((btn, i) => btn.classList.toggle('active', i === tab));
      
      document.getElementById('nodesList').classList.toggle('hidden', tab === 1);
      document.getElementById('searchPanel').classList.toggle('hidden', tab !== 1);

      if (tab === 1) {
        const input = document.getElementById('searchInput');
        input.focus();
        if (input.value) searchInternet(input.value);
        else searchInternet("wallet phone passport"); // default auto-search
      }
    }

    // Rest of your original functions (login, submitNewNode, viewNode, shareNode, loadSampleNodes, etc.)
    // ... paste all your original script functions here ...

    window.onload = () => {
      createMatrix();
      // Auto-connect demo
      setTimeout(() => {
        document.getElementById('authSection').classList.add('hidden');
        document.getElementById('mainApp').classList.remove('hidden');
        log(`✅ NODE ${currentUser} CONNECTED`);
        loadSampleNodes();
        log("🌐 INTERNET CRAWLER ENABLED");
      }, 800);
    };
  </script>
</body>
</html>
