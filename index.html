<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a0a0a">
  <title>ROOT DONATE • SOCIAL NODE</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

  <!-- PWA Meta -->
  <link rel="manifest" href="data:application/manifest+json,{
    &quot;name&quot;:&quot;ROOT DONATE&quot;,
    &quot;short_name&quot;:&quot;ROOT&quot;,
    &quot;start_url&quot;:&quot;.&quot;,
    &quot;display&quot;:&quot;standalone&quot;,
    &quot;background_color&quot;:&quot;#0a0a0a&quot;,
    &quot;theme_color&quot;:&quot;#ffd700&quot;
  }">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <style>
    :root {
      --neon: #ffd700;
      --glow: #ffd70088;
      --bg: #0a0a0a;
      --card: rgba(20,20,15,0.95);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Courier New', monospace;
      background: var(--bg);
      color: var(--neon);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    canvas#matrix { position: fixed; inset: 0; z-index: -1; opacity: 0.15; }

    .header {
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255,215,0,0.3);
      background: rgba(10,10,10,0.98);
    }
    .header h1 { font-size: 1.55rem; letter-spacing: 3px; text-shadow: 0 0 15px var(--neon); }

    .user-info { display: flex; align-items: center; gap: 12px; cursor: pointer; }
    .avatar {
      width: 38px; height: 38px;
      background: #222;
      border: 2px solid var(--neon);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
    }

    .nav { 
      padding: 12px 20px; 
      display: flex; 
      gap: 8px; 
      flex-wrap: wrap; 
      border-bottom: 1px solid rgba(255,215,0,0.2); 
      background: rgba(10,10,10,0.98); 
    }
    .nav button { 
      background: transparent; 
      border: 1px solid var(--neon); 
      color: var(--neon); 
      padding: 10px 20px; 
      border-radius: 50px; 
      cursor: pointer; 
      transition: all 0.3s;
    }
    .nav button.active, .nav button:hover { 
      background: var(--neon); 
      color: #000; 
      box-shadow: 0 0 25px var(--glow); 
    }

    .search-bar { 
      margin: 16px 20px; 
      padding: 14px 24px; 
      width: calc(100% - 40px); 
      background: #111; 
      border: 1px solid var(--neon); 
      border-radius: 50px; 
      color: var(--neon); 
      font-family: inherit;
    }

    .nodes-grid {
      flex: 1;
      padding: 16px 20px;
      overflow-y: auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }
    .node-card {
      background: var(--card);
      border: 1px solid rgba(255,215,0,0.35);
      border-radius: 16px;
      padding: 18px;
      cursor: pointer;
      transition: all 0.4s;
    }
    .node-card:hover {
      transform: translateY(-4px);
      border-color: var(--neon);
      box-shadow: 0 0 25px var(--glow);
    }

    .log { 
      height: 160px; 
      background: #0a0a0a; 
      padding: 12px 20px; 
      overflow-y: auto; 
      font-size: 0.85rem; 
      border-top: 1px solid rgba(255,215,0,0.3); 
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.96);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 10px;
    }
    .modal-content {
      background: rgba(20,20,15,0.98);
      border: 2px solid var(--neon);
      border-radius: 16px;
      width: 100%;
      max-width: 520px;
      padding: 28px;
      position: relative;
      max-height: 92vh;
      overflow-y: auto;
    }

    .history-list { 
      max-height: 300px; 
      overflow-y: auto; 
      margin-top: 15px; 
    }
    .history-item {
      padding: 12px;
      background: #111;
      margin-bottom: 8px;
      border-left: 4px solid #0f0;
      font-size: 0.9rem;
    }

    .apple-pay-btn {
      background: #000;
      color: white;
      border: 1px solid #000;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.3s;
    }
    .apple-pay-btn:hover {
      background: #222;
      transform: scale(1.02);
    }
  </style>
</head>
<body>

  <canvas id="matrix"></canvas>

  <div class="header">
    <h1>🌐 ROOT DONATE</h1>
    <div style="display:flex; align-items:center; gap:12px;">
      <button onclick="toggleLearnMode()" style="padding:8px 16px; background:transparent; border:1px solid var(--neon); color:var(--neon); border-radius:50px; cursor:pointer;">
        📖 LEARN MODE
      </button>
      
      <div id="userSection" style="display:none;">
        <div class="user-info" onclick="showProfile()">
          <div id="avatar" class="avatar">👤</div>
          <div>
            <div id="usernameDisplay" style="font-weight:bold;"></div>
            <div id="balanceDisplay" style="font-size:0.8rem;color:#0f0;">0 ROOT</div>
          </div>
        </div>
      </div>
      
      <button onclick="showAuthModal()" id="authBtn" style="padding:8px 20px; border:1px solid var(--neon); background:transparent; color:var(--neon); border-radius:50px;">
        <i class="fas fa-user"></i> LOGIN
      </button>
    </div>
  </div>

  <div class="nav">
    <button class="active" onclick="setTab(0)">🌐 LIVE FEED</button>
    <button onclick="setTab(1)">🔎 DEEP NUMIS</button>
    <button onclick="showReportModal()">📢 REPORT FIND</button>
    <button onclick="resetScan()">RESET MESH</button>
  </div>

  <input type="text" id="searchInput" class="search-bar" placeholder="Search coins, nodes..." onkeyup="filterNodes()">

  <div class="nodes-grid" id="grid"></div>
  <div class="log" id="log"></div>

  <!-- AUTH, ITEM, DONATE, TOP-UP MODALS (unchanged) -->
  <!-- AUTH MODAL -->
  <div class="modal" id="authModal">
    <div class="modal-content">
      <span onclick="closeAuthModal()" style="position:absolute;top:12px;right:20px;font-size:2.5rem;cursor:pointer;color:var(--neon);">×</span>
      <div style="display:flex;margin-bottom:20px;border-bottom:1px solid #333;">
        <button onclick="switchAuthTab(0)" id="tabLogin" class="active" style="flex:1;padding:12px;background:transparent;color:var(--neon);border:none;border-bottom:3px solid var(--neon);">LOGIN</button>
        <button onclick="switchAuthTab(1)" id="tabSignup" style="flex:1;padding:12px;background:transparent;color:var(--neon);border:none;">SIGN UP</button>
      </div>
      <div id="loginForm">
        <input id="loginUser" placeholder="Username or Handle" style="width:100%;padding:14px;margin:10px 0;background:#111;border:1px solid var(--neon);color:var(--neon);">
        <input id="loginPass" type="password" placeholder="Passphrase" style="width:100%;padding:14px;margin:10px 0;background:#111;border:1px solid var(--neon);color:var(--neon);">
        <button onclick="login()" style="width:100%;padding:16px;margin-top:15px;border:2px solid var(--neon);background:transparent;color:var(--neon);border-radius:50px;">ENTER THE MESH</button>
      </div>
      <div id="signupForm" style="display:none;">
        <input id="signupUser" placeholder="Choose handle" style="width:100%;padding:14px;margin:10px 0;background:#111;border:1px solid var(--neon);color:var(--neon);">
        <input id="signupPass" type="password" placeholder="Create passphrase" style="width:100%;padding:14px;margin:10px 0;background:#111;border:1px solid var(--neon);color:var(--neon);">
        <button onclick="signup()" style="width:100%;padding:16px;margin-top:15px;border:2px solid var(--neon);background:transparent;color:var(--neon);border-radius:50px;">JOIN THE MESH</button>
      </div>
    </div>
  </div>

  <!-- ITEM DETAIL MODAL - NOW WITH DONATION HISTORY -->
  <div class="modal" id="itemModal">
    <div class="modal-content">
      <span onclick="closeItemModal()" style="position:absolute;top:12px;right:20px;font-size:2.5rem;cursor:pointer;color:var(--neon);">×</span>
      <div id="modalIcon" style="font-size:2.8rem;margin-bottom:12px;">🪙</div>
      <h2 id="modalName" style="color:#ffd700;margin-bottom:12px;"></h2>
      <p id="modalLoc"></p>
      <p id="modalTime"></p>
      <div style="margin:20px 0;padding:14px;background:#111;border:1px solid var(--neon);">
        <strong>EST. VALUE:</strong> <span id="modalValue" style="color:#0f0;"></span><br>
        <strong>MINT:</strong> <span id="modalMint"></span>
      </div>
      <div id="shareUrl" style="background:#111;padding:14px;margin:20px 0;border:1px solid var(--neon);word-break:break-all;font-size:0.9rem;"></div>
      
      <button onclick="copyShareLink()" style="width:100%;padding:12px;margin-bottom:10px;border:2px solid var(--neon);background:transparent;color:var(--neon);border-radius:50px;">📋 COPY LINK</button>
      <button onclick="showDonateModal()" style="width:100%;padding:16px;border:2px solid #0f0;background:transparent;color:#0f0;border-radius:50px;">💰 DONATE ROOT TOKENS</button>

      <!-- New: Donation History for this find -->
      <h3 style="margin:25px 0 10px;color:#0f0;">💰 DONATIONS RECEIVED</h3>
      <div id="itemDonationHistory" class="history-list"></div>
    </div>
  </div>

  <!-- DONATE, TOP-UP, REPORT, PROFILE MODALS (same as before) -->
  <!-- DONATE MODAL -->
  <div class="modal" id="donateModal">
    <div class="modal-content">
      <span onclick="closeDonateModal()" style="position:absolute;top:12px;right:20px;font-size:2.5rem;cursor:pointer;color:var(--neon);">×</span>
      <h2 style="color:#0f0;">💸 SEND DONATION</h2>
      <p id="donateTo" style="margin:15px 0;"></p>
      <div><strong>Balance:</strong> <span id="donorBalance" style="color:#0f0;"></span> ROOT</div>
      
      <input id="donateAmount" type="number" value="50" style="width:100%;padding:14px;margin:15px 0;background:#111;border:1px solid #0f0;color:var(--neon);font-size:1.3rem;">
      
      <div style="display:flex;gap:10px;margin:15px 0;">
        <button onclick="quickAmount(25)" style="flex:1;padding:10px;border:1px solid var(--neon);background:transparent;color:var(--neon);">25</button>
        <button onclick="quickAmount(50)" style="flex:1;padding:10px;border:1px solid var(--neon);background:transparent;color:var(--neon);">50</button>
        <button onclick="quickAmount(100)" style="flex:1;padding:10px;border:1px solid var(--neon);background:transparent;color:var(--neon);">100</button>
        <button onclick="quickAmount(250)" style="flex:1;padding:10px;border:1px solid var(--neon);background:transparent;color:var(--neon);">250</button>
      </div>

      <button onclick="confirmDonation()" style="width:100%;padding:14px;margin:10px 0;border:2px solid #0f0;background:transparent;color:#0f0;border-radius:50px;">SEND FROM WALLET</button>
      <button onclick="startApplePay()" class="apple-pay-btn" style="width:100%;padding:16px;">
        <i class="fab fa-apple"></i> PAY WITH APPLE PAY
      </button>
    </div>
  </div>

  <!-- TOP-UP MODAL -->
  <div class="modal" id="topUpModal">
    <div class="modal-content">
      <span onclick="closeTopUpModal()" style="position:absolute;top:12px;right:20px;font-size:2.5rem;cursor:pointer;color:var(--neon);">×</span>
      <h2 style="text-align:center;color:#0f0;margin-bottom:20px;"> TOP UP BALANCE</h2>
      <p style="text-align:center;margin-bottom:20px;">Add ROOT tokens instantly via Apple Pay</p>
      
      <input id="topUpAmount" type="number" value="100" style="width:100%;padding:14px;margin:15px 0;background:#111;border:1px solid #0f0;color:var(--neon);font-size:1.8rem;text-align:center;">
      
      <div style="display:flex;gap:10px;margin:15px 0;justify-content:center;flex-wrap:wrap;">
        <button onclick="quickTopUp(50)" style="padding:10px 20px;border:1px solid var(--neon);background:transparent;color:var(--neon);">50</button>
        <button onclick="quickTopUp(100)" style="padding:10px 20px;border:1px solid var(--neon);background:transparent;color:var(--neon);">100</button>
        <button onclick="quickTopUp(250)" style="padding:10px 20px;border:1px solid var(--neon);background:transparent;color:var(--neon);">250</button>
        <button onclick="quickTopUp(500)" style="padding:10px 20px;border:1px solid var(--neon);background:transparent;color:var(--neon);">500</button>
      </div>

      <button onclick="confirmApplePayTopUp()" class="apple-pay-btn" style="width:100%;padding:18px;font-size:1.1rem;margin-top:10px;">
        <i class="fab fa-apple"></i> CONFIRM WITH APPLE PAY
      </button>
      <p style="text-align:center;font-size:0.8rem;opacity:0.6;margin-top:15px;">Secure • Instant • No fees</p>
    </div>
  </div>

  <!-- REPORT MODAL -->
  <div class="modal" id="reportModal">
    <div class="modal-content">
      <span onclick="closeReportModal()" style="position:absolute;top:12px;right:20px;font-size:2.5rem;cursor:pointer;color:var(--neon);">×</span>
      <h2 style="text-align:center;color:#ffd700;margin-bottom:20px;">📜 BROADCAST NEW FIND</h2>
      <input id="rName" placeholder="Coin / Note Name" style="width:100%;padding:14px;margin:10px 0;background:#111;border:1px solid var(--neon);color:var(--neon);">
      <input id="rLoc" placeholder="Mint / Location / Era" style="width:100%;padding:14px;margin:10px 0;background:#111;border:1px solid var(--neon);color:var(--neon);">
      <input id="rValue" placeholder="Est. Value (USD)" style="width:100%;padding:14px;margin:10px 0;background:#111;border:1px solid var(--neon);color:var(--neon);">
      <textarea id="rDesc" rows="3" placeholder="Description / Condition..." style="width:100%;padding:14px;margin:10px 0;background:#111;border:1px solid var(--neon);color:var(--neon);"></textarea>
      <button onclick="submitReport()" style="width:100%;padding:16px;margin-top:15px;border:2px solid var(--neon);background:transparent;color:var(--neon);border-radius:50px;">BROADCAST TO THE MESH</button>
    </div>
  </div>

  <!-- PROFILE MODAL -->
  <div class="modal" id="profileModal">
    <div class="modal-content">
      <span onclick="closeProfileModal()" style="position:absolute;top:12px;right:20px;font-size:2.5rem;cursor:pointer;color:var(--neon);">×</span>
      <h2 style="text-align:center;color:#ffd700;margin-bottom:20px;">🪙 YOUR PROFILE</h2>
      <div id="profileInfo" style="text-align:center;margin-bottom:25px;"></div>
      
      <button onclick="showTopUpModal()" style="width:100%;padding:14px;margin:10px 0;border:2px solid #0f0;background:transparent;color:#0f0;border-radius:50px;">
         TOP UP BALANCE WITH APPLE PAY
      </button>
      
      <h3 style="margin:20px 0 10px;">📜 YOUR DONATION HISTORY</h3>
      <div id="historyList" class="history-list"></div>
    </div>
  </div>

  <script>
    // Matrix Rain (unchanged)
    const canvas = document.getElementById('matrix');
    const ctx = canvas.getContext('2d');
    let drops = [];
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      drops = Array(Math.floor(canvas.width / 14)).fill(1);
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    function drawMatrix() {
      ctx.fillStyle = 'rgba(10,10,10,0.15)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#ffd700';
      ctx.font = '14px monospace';
      const chars = '0123456789$€£¥₿🪙⚡';
      for (let i = 0; i < drops.length; i++) {
        ctx.fillText(chars[Math.floor(Math.random()*chars.length)], i*14, drops[i]*14);
        if (drops[i]*14 > canvas.height && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
      }
    }
    setInterval(drawMatrix, 40);

    // Utilities (unchanged)
    function toBase64Url(obj) {
      const str = btoa(unescape(encodeURIComponent(JSON.stringify(obj))));
      return str.replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
    }
    function fromBase64Url(str) {
      str = str.replace(/-/g,'+').replace(/_/g,'/');
      while (str.length % 4) str += '=';
      try { return JSON.parse(decodeURIComponent(escape(atob(str)))); }
      catch(e) { return null; }
    }
    function generateShareUrl(item) {
      const minimal = { id: item.id, name: item.name, loc: item.loc, value: item.value, icon: item.icon, mint: item.mint };
      return `${location.origin}${location.pathname}#${toBase64Url(minimal)}`;
    }

    // App State
    let allNodes = [];
    let currentUser = null;
    let currentItem = null;
    let donationHistory = []; // Global user history

    const logEl = document.getElementById('log');
    function log(msg) {
      const time = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
      logEl.innerHTML += `<span style="opacity:0.5">[${time}]</span> ${msg}<br>`;
      logEl.scrollTop = logEl.scrollHeight;
    }

    function saveData() {
      if (currentUser) localStorage.setItem('rootDonateUser', JSON.stringify(currentUser));
      localStorage.setItem('rootDonateHistory', JSON.stringify(donationHistory));
    }

    function loadData() {
      const savedUser = localStorage.getItem('rootDonateUser');
      if (savedUser) currentUser = JSON.parse(savedUser);
      const savedHist = localStorage.getItem('rootDonateHistory');
      if (savedHist) donationHistory = JSON.parse(savedHist);
    }

    function addToHistory(type, amount, target, itemName) {
      donationHistory.unshift({ type, amount, target, item: itemName, time: new Date().toLocaleString() });
      if (donationHistory.length > 30) donationHistory.pop();
      saveData();
    }

    function updateBalanceDisplay() {
      if (currentUser) document.getElementById('balanceDisplay').textContent = `${currentUser.balance} ROOT`;
    }

    // Auth, Profile, Top-up, Donate functions (unchanged - only key parts shown)
    function showAuthModal() { document.getElementById('authModal').style.display = 'flex'; switchAuthTab(0); }
    function closeAuthModal() { document.getElementById('authModal').style.display = 'none'; }
    function switchAuthTab(n) {
      document.getElementById('loginForm').style.display = n === 0 ? 'block' : 'none';
      document.getElementById('signupForm').style.display = n === 1 ? 'block' : 'none';
      document.getElementById('tabLogin').classList.toggle('active', n===0);
      document.getElementById('tabSignup').classList.toggle('active', n===1);
    }

    function signup() {
      const handle = document.getElementById('signupUser').value.trim();
      if (!handle) return alert("Handle required");
      currentUser = { handle: handle.startsWith('@') ? handle : '@' + handle, avatar: '🪙', joined: new Date().toLocaleDateString(), balance: 1250 };
      saveData();
      updateUIAfterLogin();
      closeAuthModal();
      log(`✅ ${currentUser.handle} joined the mesh`);
    }

    function login() {
      const handle = document.getElementById('loginUser').value.trim();
      if (!handle) return alert("Enter handle");
      currentUser = { handle: handle.startsWith('@') ? handle : '@' + handle, avatar: '🪙', joined: "2025", balance: 980 };
      saveData();
      updateUIAfterLogin();
      closeAuthModal();
      log(`🔓 ${currentUser.handle} connected`);
    }

    function updateUIAfterLogin() {
      document.getElementById('authBtn').style.display = 'none';
      document.getElementById('userSection').style.display = 'block';
      document.getElementById('usernameDisplay').textContent = currentUser.handle;
      updateBalanceDisplay();
    }

    function showProfile() {
      if (!currentUser) return;
      document.getElementById('profileInfo').innerHTML = `
        <div class="avatar" style="margin:0 auto 15px;width:90px;height:90px;font-size:3rem;">${currentUser.avatar}</div>
        <h2>${currentUser.handle}</h2>
        <p>Joined ${currentUser.joined} • <strong style="color:#0f0;">${currentUser.balance} ROOT</strong></p>
      `;
      let html = '';
      donationHistory.forEach(h => {
        html += `<div class="history-item">
          <strong>${h.type === 'sent' ? '→ SENT' : '← RECEIVED'} ${h.amount} ROOT</strong><br>
          ${h.type === 'sent' ? 'to' : 'from'} <strong>${h.target}</strong><br>
          <small>${h.item} • ${h.time}</small>
        </div>`;
      });
      document.getElementById('historyList').innerHTML = html || '<p style="opacity:0.6;text-align:center;padding:20px;">No donations yet.</p>';
      document.getElementById('profileModal').style.display = 'flex';
    }

    function closeProfileModal() { document.getElementById('profileModal').style.display = 'none'; }

    function showTopUpModal() { document.getElementById('topUpModal').style.display = 'flex'; }
    function closeTopUpModal() { document.getElementById('topUpModal').style.display = 'none'; }
    function quickTopUp(amt) { document.getElementById('topUpAmount').value = amt; }
    function confirmApplePayTopUp() {
      const amount = parseInt(document.getElementById('topUpAmount').value);
      if (!amount || amount <= 0) return alert("Enter a valid amount");
      if (confirm(` Apple Pay\n\nAdding: ${amount} ROOT\nConfirm?`)) {
        currentUser.balance += amount;
        updateBalanceDisplay();
        saveData();
        log(` Apple Pay Top-up: +${amount} ROOT`);
        alert(`✅ ${amount} ROOT added!`);
        closeTopUpModal();
        showProfile();
      }
    }

    function showDonateModal() {
      if (!currentUser) return alert("Please login first");
      document.getElementById('donateTo').innerHTML = `To: <strong>${currentItem.name}</strong>`;
      document.getElementById('donorBalance').textContent = currentUser.balance;
      document.getElementById('donateModal').style.display = 'flex';
    }
    function closeDonateModal() { document.getElementById('donateModal').style.display = 'none'; }
    function quickAmount(amt) { document.getElementById('donateAmount').value = amt; }

    function confirmDonation() {
      const amount = parseInt(document.getElementById('donateAmount').value);
      if (!amount || amount > currentUser.balance) return alert("Insufficient balance");
      
      currentUser.balance -= amount;
      updateBalanceDisplay();
      
      // Add to global history
      addToHistory("sent", amount, currentItem.source || "Node Owner", currentItem.name);
      
      // Add to item's own donation history
      if (currentItem.donations) {
        currentItem.donations.unshift({
          from: currentUser.handle,
          amount: amount,
          time: new Date().toLocaleString()
        });
      }
      
      log(`💸 ${currentUser.handle} sent ${amount} ROOT to ${currentItem.name}`);
      closeDonateModal();
      closeItemModal();
      alert(`✅ ${amount} ROOT sent successfully!`);
      
      // Refresh item modal if open
      if (document.getElementById('itemModal').style.display === 'flex') {
        showItemDetail(currentItem);
      }
    }

    function startApplePay() {
      const amount = parseInt(document.getElementById('donateAmount').value);
      if (!amount || amount > currentUser.balance) return alert("Insufficient balance");
      if (confirm(` Apple Pay\n\nSending: ${amount} ROOT\nConfirm?`)) {
        currentUser.balance -= amount;
        updateBalanceDisplay();
        
        addToHistory("sent", amount, currentItem.source || "Node Owner", currentItem.name);
        
        if (currentItem.donations) {
          currentItem.donations.unshift({
            from: currentUser.handle,
            amount: amount,
            time: new Date().toLocaleString()
          });
        }
        
        log(` Apple Pay: ${amount} ROOT sent to ${currentItem.name}`);
        closeDonateModal();
        closeItemModal();
        alert("✅ Apple Pay Payment Successful!");
        
        if (document.getElementById('itemModal').style.display === 'flex') {
          showItemDetail(currentItem);
        }
      }
    }

    function showItemDetail(item) {
      currentItem = item;
      if (!currentItem.donations) currentItem.donations = [];
      
      document.getElementById('modalIcon').textContent = item.icon;
      document.getElementById('modalName').textContent = item.name;
      document.getElementById('modalLoc').innerHTML = `📍 ${item.loc}`;
      document.getElementById('modalTime').textContent = item.time;
      document.getElementById('modalValue').textContent = item.value;
      document.getElementById('modalMint').textContent = item.mint || 'Unknown';
      document.getElementById('shareUrl').innerHTML = `<strong>LINK:</strong><br><a href="${generateShareUrl(item)}" target="_blank" style="color:var(--neon);word-break:break-all;">${generateShareUrl(item)}</a>`;
      
      // Render item-specific donation history
      let histHTML = '';
      currentItem.donations.forEach(d => {
        histHTML += `<div class="history-item">
          <strong>→ ${d.amount} ROOT</strong> from <strong>${d.from}</strong><br>
          <small>${d.time}</small>
        </div>`;
      });
      document.getElementById('itemDonationHistory').innerHTML = histHTML || '<p style="opacity:0.6;padding:10px;">No donations yet. Be the first!</p>';
      
      document.getElementById('itemModal').style.display = 'flex';
    }

    function closeItemModal() { 
      document.getElementById('itemModal').style.display = 'none'; 
    }

    function copyShareLink() {
      if (!currentItem) return;
      navigator.clipboard.writeText(generateShareUrl(currentItem));
      alert("✅ Link copied!");
    }

    function showReportModal() {
      if (!currentUser) return alert("Login to broadcast");
      document.getElementById('reportModal').style.display = 'flex';
    }
    function closeReportModal() { 
      document.getElementById('reportModal').style.display = 'none'; 
    }

    function submitReport() {
      const name = document.getElementById('rName').value.trim();
      const loc = document.getElementById('rLoc').value.trim();
      if (!name || !loc) return alert("Name and location required");

      const newItem = {
        id: `NR-${1000 + Math.floor(Math.random()*9000)}`,
        name, 
        loc,
        value: document.getElementById('rValue').value.trim() || "Pending",
        icon: "🪙",
        mint: "Community",
        source: currentUser.handle,
        time: "Just now",
        donations: []   // ← New: Each report starts with its own donation history
      };
      allNodes.unshift(newItem);
      renderNodes();
      closeReportModal();
      log(`📢 ${currentUser.handle} broadcasted new find`);
      alert("✅ Find broadcasted to the mesh! It now has its own donation history.");
    }

    // Rendering
    function renderNodes(filtered = allNodes) {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = 'node-card';
        card.innerHTML = `
          <div style="font-size:0.8rem;opacity:0.7;">${item.id} • ${item.source}</div>
          <div style="font-size:2.8rem;margin:12px 0;">${item.icon}</div>
          <h3>${item.name}</h3>
          <p>📍 ${item.loc}</p>
          <p style="color:#0f0;margin-top:8px;">${item.value}</p>
          ${item.donations && item.donations.length ? `<small style="color:#0f0;">${item.donations.length} donations</small>` : ''}
        `;
        card.onclick = () => showItemDetail(item);
        grid.appendChild(card);
      });
    }

    function filterNodes() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      const filtered = allNodes.filter(n => 
        n.name.toLowerCase().includes(q) || n.loc.toLowerCase().includes(q)
      );
      renderNodes(filtered);
    }

    const sampleData = [
      { 
        id: "NR-7842", name: "1909-S VDB Lincoln Cent", loc: "San Francisco Mint", value: "$1,250", icon: "🪙", 
        mint: "USA", source: "@oldhoard", time: "2h ago", donations: [
          {from: "@coinlover", amount: 75, time: "1h ago"}
        ]
      },
      { 
        id: "NR-3191", name: "1921 Morgan Silver Dollar", loc: "Peace Treaty Era", value: "$850", icon: "🌕", 
        mint: "USA", source: "@silverstacker", time: "Yesterday", donations: []
      }
    ];

    function startGlobalScan() {
      log("🌐 INITIALIZING DECENTRALISED MESH...");
      allNodes = [...sampleData];
      renderNodes();
      log("✅ MESH SYNCHRONISED");
    }

    function toggleLearnMode() { alert("ROOT DONATE v1.3 — Reports now have donation history!"); }
    function setTab(n) { document.querySelectorAll('.nav button').forEach((b,i) => b.classList.toggle('active', i===n)); }
    function resetScan() {
      if (confirm("Reset mesh?")) {
        allNodes = [];
        renderNodes();
        startGlobalScan();
      }
    }

    window.onload = () => {
      loadData();
      if (currentUser) updateUIAfterLogin();
      startGlobalScan();

      const hash = location.hash.slice(1);
      if (hash) {
        const decoded = fromBase64Url(hash);
        if (decoded) setTimeout(() => showItemDetail(decoded), 800);
      }

      log("🔓 ROOT DONATE v1.3 — Report Donation History Enabled");
    };
  </script>
</body>
</html>
