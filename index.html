<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Internet AI · Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0b0c10;
    --surface: #14161c;
    --surface-2: #1c1f27;
    --border: rgba(255,255,255,0.08);
    --text: #f0f2f5;
    --muted: #8b929e;
    --accent: #5b8cff;
    --accent-2: #7c5cff;
    --user-bg: linear-gradient(135deg, #5b8cff, #7c5cff);
    --ai-bg: #1e212a;
    --radius: 18px;
    --shadow: 0 8px 32px rgba(0,0,0,0.4);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--bg); color: var(--text); font-family: Inter, system-ui, -apple-system, sans-serif; -webkit-font-smoothing: antialiased; }

  .app {
    display: flex;
    flex-direction: column;
    height: 100dvh;
    max-width: 820px;
    margin: 0 auto;
    background: var(--bg);
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    border-bottom: 1px solid var(--border);
    background: rgba(11,12,16,0.85);
    backdrop-filter: blur(12px);
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    font-weight: 600;
    font-size: 1.05rem;
    letter-spacing: -0.02em;
  }

  .logo {
    width: 32px;
    height: 32px;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    display: grid;
    place-items: center;
    font-size: 16px;
    box-shadow: 0 0 20px rgba(91,140,255,0.35);
  }

  .status {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.75rem;
    color: var(--muted);
  }
  .status-dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #22c55e;
    box-shadow: 0 0 0 3px rgba(34,197,94,0.2);
  }

  .chat {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px 10px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    scroll-behavior: smooth;
  }

  .msg {
    display: flex;
    max-width: 85%;
    animation: fadeUp 0.25s ease;
  }
  .msg.user { align-self: flex-end; }
  .msg.ai { align-self: flex-start; }

  .bubble {
    padding: 12px 16px;
    border-radius: var(--radius);
    line-height: 1.45;
    font-size: 0.95rem;
    word-wrap: break-word;
    box-shadow: var(--shadow);
  }
  .msg.user .bubble {
    background: var(--user-bg);
    color: white;
    border-bottom-right-radius: 6px;
  }
  .msg.ai .bubble {
    background: var(--ai-bg);
    border: 1px solid var(--border);
    border-bottom-left-radius: 6px;
  }

  .time {
    font-size: 0.65rem;
    color: var(--muted);
    margin-top: 4px;
    opacity: 0.7;
  }
  .msg.user .time { text-align: right; }

  .typing {
    display: flex;
    gap: 4px;
    padding: 14px 18px;
  }
  .typing span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--muted);
    animation: bounce 1.2s infinite;
  }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }

  .composer {
    padding: 12px 16px 16px;
    padding-bottom: calc(16px + env(safe-area-inset-bottom));
    background: linear-gradient(to top, var(--bg) 70%, transparent);
  }

  .input-wrap {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 6px 6px 6px 18px;
    box-shadow: var(--shadow);
  }

  textarea {
    flex: 1;
    background: transparent;
    border: none;
    color: var(--text);
    font-family: inherit;
    font-size: 0.95rem;
    resize: none;
    max-height: 120px;
    outline: none;
    padding: 8px 0;
    line-height: 1.4;
  }
  textarea::placeholder { color: var(--muted); }

  button.send {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    border: none;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: white;
    display: grid;
    place-items: center;
    cursor: pointer;
    flex-shrink: 0;
    transition: transform 0.15s, opacity 0.15s;
  }
  button.send:disabled { opacity: 0.4; cursor: not-allowed; }
  button.send:not(:disabled):active { transform: scale(0.94); }

  .welcome {
    text-align: center;
    padding: 40px 20px;
    color: var(--muted);
  }
  .welcome h2 {
    color: var(--text);
    font-size: 1.4rem;
    margin-bottom: 8px;
    font-weight: 600;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); }
    30% { transform: translateY(-6px); }
  }

  /* Mobile refinements */
  @media (max-width: 640px) {
    .app { max-width: 100%; }
    header { padding: 12px 16px; }
    .chat { padding: 16px 12px 8px; }
    .msg { max-width: 90%; }
    .bubble { font-size: 0.92rem; padding: 11px 14px; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <div class="logo">AI</div>
     RootDonate Internet AI
    </div>
    <div class="status">
      <div class="status-dot"></div>
      <span id="live-time">Pro · Online</span>
    </div>
  </header>

  <div class="chat" id="chat">
    <div class="welcome" id="welcome">
      <h2>RootDonate Internet AI</h2>
      <p>Modern conversational assistant. Ask anything.</p>
    </div>
  </div>

  <div class="composer">
    <form class="input-wrap" id="form">
      <textarea id="input" rows="1" placeholder="Message Internet AI…" autofocus></textarea>
      <button type="submit" class="send" id="send" disabled>
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
        </svg>
      </button>
    </form>
  </div>
</div>

<script>
const chat = document.getElementById('chat');
const input = document.getElementById('input');
const form = document.getElementById('form');
const sendBtn = document.getElementById('send');
const welcome = document.getElementById('welcome');

const replies = [
  "That's an interesting point. Can you tell me more?",
  "I see what you mean. From my perspective…",
  "Interesting. Let me think about that for a second.",
  "Good question. Here's how I see it:",
  "Understood. Here's a clear take:",
  "That makes sense. Want me to expand on any part?",
  "Noted. Anything specific you'd like me to focus on?",
  "Great. I can help with that."
];

function now() {
  // Force unlocked Date.now()
  const ts = Date.now();
  return new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
}

function updateLiveTime() {
  const el = document.getElementById('live-time');
  if (el) {
    const ts = Date.now();
    const time = new Date(ts).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
    el.textContent = `Pro · ${time}`;
  }
}

function addMessage(text, who) {
  if (welcome) welcome.remove();
  const div = document.createElement('div');
  div.className = `msg ${who}`;
  div.innerHTML = `
    <div>
      <div class="bubble">${text}</div>
      <div class="time">${now()}</div>
    </div>`;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

function showTyping() {
  const el = document.createElement('div');
  el.className = 'msg ai typing-msg';
  el.innerHTML = `<div class="bubble typing"><span></span><span></span><span></span></div>`;
  chat.appendChild(el);
  chat.scrollTop = chat.scrollHeight;
  return el;
}

input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  sendBtn.disabled = !input.value.trim();
});

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;

  addMessage(text, 'user');
  input.value = '';
  input.style.height = 'auto';
  sendBtn.disabled = true;

  const typing = showTyping();
  await new Promise(r => setTimeout(r, 800 + Math.random() * 700));
  typing.remove();

  const reply = replies[Math.floor(Math.random() * replies.length)];
  addMessage(reply, 'ai');
});

input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    form.requestSubmit();
  }
});

// Force live Date.now() clock
updateLiveTime();
setInterval(updateLiveTime, Date.now(ts));
</script>
</body>
</html>
