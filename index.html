<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a0a0a">
  <title>ROOT DONATE • SOCIAL NODE</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  
  <!-- PWA / Production Meta -->
  <link rel="manifest" href="data:application/manifest+json,{
    &quot;name&quot;:&quot;ROOT DONATE&quot;,
    &quot;short_name&quot;:&quot;ROOT&quot;,
    &quot;start_url&quot;:&quot;.&quot;,
    &quot;display&quot;:&quot;standalone&quot;,
    &quot;background_color&quot;:&quot;#0a0a0a&quot;,
    &quot;theme_color&quot;:&quot;#ffd700&quot;
  }">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <style>
    :root {
      --neon: #ffd700;
      --glow: #ffd70088;
      --bg: #0a0a0a;
      --card: rgba(20,20,15,0.95);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Courier New', monospace;
      background: var(--bg);
      color: var(--neon);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    canvas#matrix { position: fixed; inset: 0; z-index: -1; opacity: 0.15; }

    .header {
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255,215,0,0.3);
      background: rgba(10,10,10,0.98);
    }
    .header h1 { font-size: 1.55rem; letter-spacing: 3px; text-shadow: 0 0 15px var(--neon); }

    .user-info { display: flex; align-items: center; gap: 12px; cursor: pointer; }
    .avatar {
      width: 38px; height: 38px;
      background: #222;
      border: 2px solid var(--neon);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
    }

    .nav { padding: 12px 20px; display: flex; gap: 8px; flex-wrap: wrap; border-bottom: 1px solid rgba(255,215,0,0.2); background: rgba(10,10,10,0.98); }
    .nav button { background: transparent; border: 1px solid var(--neon); color: var(--neon); padding: 10px 20px; border-radius: 50px; cursor: pointer; }
    .nav button.active, .nav button:hover { background: var(--neon); color: #000; box-shadow: 0 0 25px var(--glow); }

    .search-bar { margin: 16px 20px; padding: 14px 24px; width: calc(100% - 40px); background: #111; border: 1px solid var(--neon); border-radius: 50px; color: var(--neon); }

    .nodes-grid {
      flex: 1;
      padding: 16px 20px;
      overflow-y: auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }
    .node-card {
      background: var(--card);
      border: 1px solid rgba(255,215,0,0.35);
      border-radius: 16px;
      padding: 18px;
      cursor: pointer;
      transition: all 0.4s;
    }
    .node-card:hover {
      transform: translateY(-4px);
      border-color: var(--neon);
      box-shadow: 0 0 25px var(--glow);
    }

    .log { height: 160px; background: #0a0a0a; padding: 12px 20px; overflow-y: auto; font-size: 0.85rem; border-top: 1px solid rgba(255,215,0,0.3); }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.96);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 10px;
    }
    .modal-content {
      background: rgba(20,20,15,0.98);
      border: 2px solid var(--neon);
      border-radius: 16px;
      width: 100%;
      max-width: 520px;
      padding: 28px;
      position: relative;
    }

    .history-list { max-height: 420px; overflow-y: auto; margin-top: 15px; }
    .history-item {
      padding: 12px;
      background: #111;
      margin-bottom: 8px;
      border-left: 4px solid #0f0;
      font-size: 0.9rem;
    }

    .apple-pay-btn {
      background: #000;
      color: white;
      border: 1px solid #000;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <canvas id="matrix"></canvas>

  <div class="header">
    <h1>🌐 ROOT DONATE</h1>
    <div style="display:flex; align-items:center; gap:12px;">
      <button class="learn-btn" onclick="toggleLearnMode()">📖 LEARN MODE</button>
      
      <div id="userSection" style="display:none;">
        <div class="user-info" onclick="showProfile()">
          <div id="avatar" class="avatar">👤</div>
          <div>
            <div id="usernameDisplay"></div>
            <div id="balanceDisplay" style="font-size:0.8rem;color:#0f0;">0 ROOT</div>
          </div>
        </div>
      </div>
      
      <button onclick="showAuthModal()" id="authBtn" style="padding:8px 20px; border:1px solid var(--neon); background:transparent; color:var(--neon); border-radius:50px;">
        <i class="fas fa-user"></i> LOGIN
      </button>
    </div>
  </div>

  <div class="nav">
    <button class="active" onclick="setTab(0)">🌐 LIVE FEED</button>
    <button onclick="setTab(1)">🔎 DEEP NUMIS</button>
    <button onclick="showReportModal()">📢 REPORT FIND</button>
    <button onclick="resetScan()">RESET MESH</button>
  </div>

  <input type="text" id="searchInput" class="search-bar" placeholder="Search coins, nodes..." onkeyup="filterNodes()">

  <div class="nodes-grid" id="grid"></div>
  <div class="log" id="log"></div>

  <!-- Modals (same as before) -->
  <!-- AUTH, ITEM, DONATE, PROFILE modals unchanged - copy from your last version -->

  <script>
    // Matrix Rain (unchanged)
    const canvas = document.getElementById('matrix');
    const ctx = canvas.getContext('2d');
    let drops = [];
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      drops = Array(Math.floor(canvas.width / 14)).fill(1);
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    function drawMatrix() {
      ctx.fillStyle = 'rgba(10,10,10,0.15)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#ffd700';
      ctx.font = '14px monospace';
      const chars = '0123456789$€£¥₿🪙⚡';
      for (let i = 0; i < drops.length; i++) {
        ctx.fillText(chars[Math.floor(Math.random()*chars.length)], i*14, drops[i]*14);
        if (drops[i]*14 > canvas.height && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
      }
    }
    setInterval(drawMatrix, 40);

    // === BASE64 SHARE LINKS ===
    function toBase64Url(obj) {
      const str = btoa(unescape(encodeURIComponent(JSON.stringify(obj))));
      return str.replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
    }
    function fromBase64Url(str) {
      str = str.replace(/-/g,'+').replace(/_/g,'/');
      while (str.length % 4) str += '=';
      try { return JSON.parse(decodeURIComponent(escape(atob(str)))); }
      catch(e) { return null; }
    }

    function generateShareUrl(item) {
      const minimal = { id: item.id, name: item.name, loc: item.loc, value: item.value, icon: item.icon, mint: item.mint };
      return `${location.origin}${location.pathname}#${toBase64Url(minimal)}`;
    }

    // App State
    let allNodes = [];
    let currentUser = null;
    let currentItem = null;
    let donationHistory = [];

    const logEl = document.getElementById('log');
    function log(msg) {
      const time = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
      logEl.innerHTML += `<span style="opacity:0.5">[${time}]</span> ${msg}<br>`;
      logEl.scrollTop = logEl.scrollHeight;
    }

    function saveData() {
      if (currentUser) localStorage.setItem('rootDonateUser', JSON.stringify(currentUser));
      localStorage.setItem('rootDonateHistory', JSON.stringify(donationHistory));
    }

    function loadData() {
      const savedUser = localStorage.getItem('rootDonateUser');
      if (savedUser) currentUser = JSON.parse(savedUser);
      const savedHist = localStorage.getItem('rootDonateHistory');
      if (savedHist) donationHistory = JSON.parse(savedHist);
    }

    function addToHistory(type, amount, target, itemName) {
      donationHistory.unshift({ type, amount, target, item: itemName, time: new Date().toLocaleString() });
      if (donationHistory.length > 30) donationHistory.pop();
      saveData();
    }

    function updateBalanceDisplay() {
      if (currentUser) document.getElementById('balanceDisplay').textContent = `${currentUser.balance} ROOT`;
    }

    // Auth, Profile, Donate functions (same as your last version - kept clean)

    // Item Detail with Base64 Link
    function showItemDetail(item) {
      currentItem = item;
      document.getElementById('modalIcon').textContent = item.icon;
      document.getElementById('modalName').textContent = item.name;
      document.getElementById('modalLoc').innerHTML = `📍 ${item.loc}`;
      document.getElementById('modalTime').textContent = item.time;
      document.getElementById('modalValue').textContent = item.value;
      document.getElementById('modalMint').textContent = item.mint || 'Unknown';

      const shareUrl = generateShareUrl(item);
      document.getElementById('shareUrl').innerHTML = `<strong>DECENTRALISED LINK:</strong><br><a href="${shareUrl}" target="_blank" style="color:var(--neon);word-break:break-all;">${shareUrl}</a>`;
      document.getElementById('itemModal').style.display = 'flex';
    }

    function copyShareLink() {
      if (!currentItem) return;
      const url = generateShareUrl(currentItem);
      navigator.clipboard.writeText(url).then(() => alert("✅ Base64 share link copied!"));
    }

    // Apple Pay - Production-like Simulation
    function startApplePay() {
      const amount = parseInt(document.getElementById('donateAmount').value);
      if (!amount || amount > currentUser.balance) return alert("Insufficient balance");

      // Realistic Apple Pay sheet simulation
      const sheet = confirm(` Apple Pay\n\nMerchant: ROOT DONATE SOCIAL NODE\nAmount: ${amount} ROOT\n\nProceed with payment?`);
      if (sheet) {
        currentUser.balance -= amount;
        updateBalanceDisplay();
        addToHistory("sent", amount, currentItem.source || "Node Owner", currentItem.name);
        
        log(` Apple Pay Authorized • ${amount} ROOT sent`);
        closeDonateModal();
        closeItemModal();
        alert("✅ Payment Successful!\nThank you for using Apple Pay.");
      }
    }

    // Sample Data + Rendering (unchanged)
    const sampleData = [ /* your existing samples */ ];

    function startGlobalScan() {
      log("🌐 INITIALIZING DECENTRALISED MESH...");
      allNodes = [...sampleData];
      renderNodes();
      log("✅ MESH SYNCHRONISED");
    }

    // Init with deep link support
    window.onload = () => {
      loadData();
      if (currentUser) updateUIAfterLogin();
      startGlobalScan();

      // Handle base64 deep link
      const hash = location.hash.slice(1);
      if (hash) {
        const decoded = fromBase64Url(hash);
        if (decoded) {
          setTimeout(() => showItemDetail(decoded), 600);
        }
      }

      log("🔓 ROOT DONATE v1.0 PRODUCTION READY");
    };
  </script>
</body>
</html>
