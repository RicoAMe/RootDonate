<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1419">
  <meta name="description" content="Chat with RootDonate's private, browser-based AI. Prompts are processed on your device.">
  <title>RootDonate — Browser AI</title>
  <style>
    :root{color-scheme:dark;--bg:#0f1419;--panel:#161e2b;--accent:#3b82f6;--text:#e2e8f0;--dim:#94a3b8;--border:#334155;--user:#1e3a5f;--bot:#1e293b;--danger:#ef4444}
    *{box-sizing:border-box}html,body{height:100%;margin:0}body{display:flex;flex-direction:column;min-height:100vh;background:var(--bg);color:var(--text);font:16px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button{font:inherit;cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
    header,footer{display:flex;align-items:center;justify-content:space-between;gap:.7rem;padding:.8rem 1rem;background:var(--panel)}header{padding-top:calc(.8rem + env(safe-area-inset-top));border-bottom:1px solid var(--border)}header h1{margin:0;font-size:1.15rem}.subtitle{color:var(--dim);font-size:.75rem}
    #chat{display:flex;flex:1;flex-direction:column;gap:.7rem;overflow:auto;padding:1rem;scroll-behavior:smooth}.msg{max-width:85%;padding:.7rem .9rem;border-radius:1rem;line-height:1.45;overflow-wrap:anywhere;white-space:pre-wrap}.msg.user{align-self:flex-end;border-bottom-right-radius:.3rem;background:var(--user)}.msg.bot{align-self:flex-start;border-bottom-left-radius:.3rem;background:var(--bot)}.sender{margin-bottom:.15rem;font-size:.65rem;font-weight:650;opacity:.7;text-transform:uppercase}.status{padding:.35rem .7rem;color:var(--dim);font-size:.75rem;text-align:center}.status.online{color:#86efac}.status.error{color:#fca5a5}
    footer{justify-content:flex-start;padding-bottom:calc(.7rem + env(safe-area-inset-bottom));border-top:1px solid var(--border)}input{flex:1;min-width:0;padding:.75rem;border:1px solid var(--border);border-radius:.8rem;background:#0f172a;color:var(--text);font-size:16px}footer button{min-width:48px;height:46px;padding:0 1rem;border:0;border-radius:.8rem;background:var(--accent);color:white}footer button:disabled{cursor:wait;opacity:.65}.notice{margin:0;padding:.55rem 1rem;background:#111827;color:var(--dim);font-size:.75rem;text-align:center}.visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
    @media(max-width:480px){.msg{max-width:92%}}
  </style>
</head>
<body>
  <header><div><h1>RootDonate</h1><div class="subtitle">Private AI running in your browser</div></div></header>
  <p class="notice">The AI model downloads from Hugging Face the first time. After loading, prompts are processed on this device—not sent to an AI API or Firebase.</p>
  <main id="chat" aria-label="Conversation" aria-live="polite" aria-relevant="additions"></main>
  <div class="status" id="status" role="status" aria-live="polite">Browser AI is ready to load.</div>
  <footer><label class="visually-hidden" for="input">Message</label><input id="input" type="text" maxlength="2000" placeholder="Ask a question…" autocomplete="off"><button id="send" type="button">Send</button></footer>
  <script type="module">
    import { pipeline } from "https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1";

    const STATE_KEY = "rootdonate_browser_ai_state";
    const MODEL_ID = "onnx-community/SmolLM2-360M-Instruct";
    const chatEl = document.getElementById("chat");
    const inputEl = document.getElementById("input");
    const statusEl = document.getElementById("status");
    const sendBtn = document.getElementById("send");
    let generatorPromise = null;
    let busy = false;

    function setStatus(text, kind = "") {
      statusEl.textContent = text;
      statusEl.className = `status ${kind}`.trim();
    }

    function addMessage(text, who) {
      const message = document.createElement("div");
      message.className = `msg ${who}`;
      const sender = document.createElement("div");
      sender.className = "sender";
      sender.textContent = who === "user" ? "You" : "RootDonate AI";
      const body = document.createElement("div");
      body.textContent = String(text);
      message.append(sender, body);
      chatEl.append(message);
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    function loadHistory() {
      try {
        const history = JSON.parse(localStorage.getItem(STATE_KEY) || "[]");
        return Array.isArray(history)
          ? history.filter(item => item && ["user", "assistant"].includes(item.role) && typeof item.text === "string").slice(-30)
          : [];
      } catch {
        return [];
      }
    }

    const history = loadHistory();
    function saveHistory() {
      try { localStorage.setItem(STATE_KEY, JSON.stringify(history)); }
      catch (error) { console.warn("Could not save local chat history", error); }
    }

    function showHistory() {
      if (history.length) {
        for (const item of history) addMessage(item.text, item.role === "user" ? "user" : "bot");
      } else {
        addMessage("Hello, I’m RootDonate. I run a small AI model on your device. The first message downloads the model; after that, prompts are processed locally.", "bot");
      }
    }

    async function getGenerator() {
      if (!generatorPromise) {
        generatorPromise = pipeline("text-generation", MODEL_ID, { dtype: "q4" })
          .catch(error => { generatorPromise = null; throw error; });
      }
      return generatorPromise;
    }

    function extractReply(result) {
      const generated = result?.[0]?.generated_text;
      if (typeof generated === "string") return generated.trim();
      if (Array.isArray(generated)) {
        const last = generated[generated.length - 1];
        if (typeof last?.content === "string") return last.content.trim();
        if (typeof last === "string") return last.trim();
      }
      return "";
    }

    async function sendMessage() {
      const text = inputEl.value.trim();
      if (!text || busy) return;
      busy = true;
      sendBtn.disabled = true;
      inputEl.value = "";
      addMessage(text, "user");
      history.push({ role: "user", text });
      history.splice(0, Math.max(0, history.length - 30));
      saveHistory();
      setStatus("Loading the on-device AI model. The first download may take a few minutes…");

      try {
        const model = await getGenerator();
        setStatus("Generating on your device…");
        const messages = [
          { role: "system", content: "You are RootDonate, a helpful and concise assistant. You run locally in the user's browser and may not have current information." },
          ...history.slice(-8).map(item => ({ role: item.role, content: item.text })),
        ];
        const result = await model(messages, { max_new_tokens: 160, do_sample: true, temperature: 0.7 });
        const reply = extractReply(result);
        if (!reply) throw new Error("The local model returned an empty response.");
        addMessage(reply, "bot");
        history.push({ role: "assistant", text: reply });
        history.splice(0, Math.max(0, history.length - 30));
        saveHistory();
        setStatus("Browser AI is ready. Prompts are processed locally.", "online");
      } catch (error) {
        console.error("Browser AI failed", error);
        const detail = "Could not load or run the browser AI. Check your connection for the initial model download, then try a modern browser with WebAssembly support.";
        addMessage(detail, "bot");
        setStatus(detail, "error");
      } finally {
        busy = false;
        sendBtn.disabled = false;
        inputEl.focus();
      }
    }

    sendBtn.addEventListener("click", () => void sendMessage());
    inputEl.addEventListener("keydown", event => { if (event.key === "Enter") void sendMessage(); });
    showHistory();
  </script>
</body>
</html>
