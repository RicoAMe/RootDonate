<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Internet AI Chat</title>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-2: #334155;
      --accent: #3b82f6;
      --text: #f8fafc;
      --muted: #94a3b8;
      --user: #1d4ed8;
      --bot: #1e293b;
      --border: #334155;
      --radius: 20px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;
    }
    body {
      display: flex;
      flex-direction: column;
      min-height: 100dvh;
      padding-top: env(safe-area-inset-top);
    }
    header {
      background: rgba(30, 41, 59, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 0.75rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .logo {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      border-radius: 8px;
      display: grid; place-items: center;
      font-weight: 700;
    }
    h1 { font-size: 1.1rem; font-weight: 600; }
    button {
      background: var(--surface-2);
      border: none;
      color: var(--text);
      border-radius: 10px;
      padding: 0.45rem 0.75rem;
      font-size: 0.85rem;
      cursor: pointer;
    }
    button.primary { background: var(--accent); color: white; }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    #status {
      font-size: 0.75rem;
      color: var(--muted);
      text-align: center;
      padding: 0.35rem;
      background: var(--surface);
    }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      -webkit-overflow-scrolling: touch;
    }
    .msg {
      max-width: 85%;
      padding: 0.7rem 0.9rem;
      border-radius: var(--radius);
      line-height: 1.45;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .user {
      align-self: flex-end;
      background: var(--user);
      color: white;
      border-bottom-right-radius: 6px;
    }
    .bot {
      align-self: flex-start;
      background: var(--bot);
      border: 1px solid var(--border);
      border-bottom-left-radius: 6px;
    }
    .empty {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: var(--muted);
      padding: 2rem;
    }
    .empty h2 { color: var(--text); font-size: 1.4rem; margin-bottom: 0.4rem; }
    .input-bar {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 0.7rem 1rem;
      padding-bottom: calc(0.7rem + env(safe-area-inset-bottom));
      display: flex;
      gap: 0.5rem;
      align-items: flex-end;
    }
    #input {
      flex: 1;
      resize: none;
      min-height: 48px;
      max-height: 140px;
      padding: 0.75rem 0.9rem;
      font-family: inherit;
      font-size: 1rem;
      background: var(--surface-2);
      border: 1px solid transparent;
      color: var(--text);
      border-radius: var(--radius);
    }
    #input:focus { outline: none; border-color: var(--accent); }
    #send {
      width: 48px; height: 48px;
      border-radius: 50%;
      background: var(--accent);
      color: white;
      font-size: 1.3rem;
      display: grid; place-items: center;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <header>
    <div style="display:flex;align-items:center;gap:0.6rem">
      <div class="logo">AI</div>
      <h1>Internet AI Chat</h1>
    </div>
    <div style="display:flex;gap:0.5rem">
      <button id="clearBtn">Clear</button>
      <button id="authBtn">Sign in</button>
    </div>
  </header>

  <div id="status">Loading…</div>

  <div id="chat">
    <div class="empty" id="empty">
      <div>
        <h2>Internet AI Chat</h2>
        <p>Powered by Puter.js<br>Web search + history saved to your account</p>
      </div>
    </div>
  </div>

  <div class="input-bar">
    <textarea id="input" placeholder="Ask anything (including current events)…" rows="1"></textarea>
    <button id="send" title="Send">↑</button>
  </div>

  <script src="https://js.puter.com/v2/"></script>
  <script>
    const MODEL = "openai/gpt-5.2-chat"; // supports web_search
    const HISTORY_KEY = "chat_history";

    const chat = document.getElementById("chat");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const authBtn = document.getElementById("authBtn");
    const clearBtn = document.getElementById("clearBtn");
    const statusEl = document.getElementById("status");
    let empty = document.getElementById("empty");

    let messages = [];
    let signedIn = false;

    const setStatus = (text) => { statusEl.textContent = text; };

    function addMessage(text, role) {
      if (empty) { empty.remove(); empty = null; }
      const div = document.createElement("div");
      div.className = `msg ${role}`;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    function renderMessages() {
      chat.innerHTML = "";
      empty = null;
      if (!messages.length) {
        const d = document.createElement("div");
        d.className = "empty";
        d.id = "empty";
        d.innerHTML = `<div><h2>Internet AI Chat</h2><p>Powered by Puter.js<br>Web search + history saved to your account</p></div>`;
        chat.appendChild(d);
        empty = d;
        return;
      }
      messages.forEach(m => addMessage(m.content, m.role === "user" ? "user" : "bot"));
    }

    async function loadHistory() {
      try {
        const data = await puter.kv.get(HISTORY_KEY);
        messages = Array.isArray(data) ? data : [];
        renderMessages();
      } catch (e) {
        console.error(e);
        messages = [];
        renderMessages();
      }
    }

    async function saveHistory() {
      try {
        await puter.kv.set(HISTORY_KEY, messages);
      } catch (e) {
        console.error("Save failed", e);
      }
    }

    async function updateAuthUI() {
      signedIn = puter.auth.isSignedIn();
      if (signedIn) {
        try {
          const user = await puter.auth.getUser();
          authBtn.textContent = user.username || "Signed in";
        } catch {
          authBtn.textContent = "Signed in";
        }
        setStatus("Ready");
        await loadHistory();
      } else {
        authBtn.textContent = "Sign in";
        setStatus("Sign in with Puter to chat & save history");
        messages = [];
        renderMessages();
      }
    }

    authBtn.addEventListener("click", async () => {
      if (!signedIn) {
        try {
          setStatus("Signing in…");
          await puter.auth.signIn();
          await updateAuthUI();
        } catch (err) {
          setStatus("Auth cancelled or failed");
        }
      }
    });

    clearBtn.addEventListener("click", async () => {
      if (!signedIn) return;
      if (confirm("Clear all messages?")) {
        messages = [];
        await saveHistory();
        renderMessages();
        setStatus("Cleared");
      }
    });

    async function send() {
      if (!signedIn) {
        setStatus("Please sign in first");
        return;
      }
      const text = input.value.trim();
      if (!text) return;

      sendBtn.disabled = true;
      input.value = "";
      input.style.height = "auto";
      setStatus("Searching the web…");

      // Add user message
      messages.push({ role: "user", content: text });
      addMessage(text, "user");
      await saveHistory();

      const botDiv = addMessage("", "bot");
      botDiv.textContent = "…";

      try {
        const response = await puter.ai.chat(messages, {
          model: MODEL,
          tools: [{ type: "web_search" }],
          normalize: true,
          stream: true
        });

        let full = "";
        for await (const part of response) {
          if (part?.text) {
            full += part.text;
            botDiv.textContent = full;
            chat.scrollTop = chat.scrollHeight;
          }
        }

        if (!full) full = "(no response)";
        botDiv.textContent = full;

        messages.push({ role: "assistant", content: full });
        await saveHistory();
        setStatus("Ready");
      } catch (err) {
        console.error(err);
        const msg = err.message || String(err);
        botDiv.textContent = "Error: " + msg;
        setStatus("Error: " + msg);
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    }

    sendBtn.addEventListener("click", send);

    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    });

    input.addEventListener("input", () => {
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 140) + "px";
    });

    // Init
    updateAuthUI();
  </script>
</body>
</html>
