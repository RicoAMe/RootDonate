<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROOT DONATE • RPG • Apple Pay</title>
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
    
    <!-- Leaflet Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #00ff9d;
            --accent: #ff00aa;
            --bg: #0a0a0f;
            --card: #111118;
        }
        
        * { box-sizing: border-box; }
        
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg);
            color: #e0e0e0;
            margin: 0;
            padding: 16px;
        }
        
        .container {
            max-width: 520px;
            margin: 20px auto;
            background: var(--card);
            border-radius: 24px;
            box-shadow: 0 25px 80px rgba(0, 255, 157, 0.12);
            overflow: hidden;
            border: 1px solid #222;
        }
        
        .header {
            background: linear-gradient(135deg, #00ff9d, #ff00aa);
            color: #000;
            padding: 40px 20px;
            text-align: center;
            position: relative;
        }
        
        .header h1 {
            margin: 0;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2.8rem;
            font-weight: 900;
            letter-spacing: -2px;
        }
        
        .rpg-card {
            background: #1a1a22;
            border-radius: 18px;
            padding: 18px;
            margin: 14px;
            border: 1px solid #333;
        }
        
        .apple-pay-btn {
            background: black;
            color: white;
            border: none;
            border-radius: 12px;
            padding: 14px 20px;
            font-size: 1.05rem;
            font-weight: 600;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin: 8px 0;
            cursor: pointer;
        }
        
        .apple-pay-btn:hover {
            background: #111;
        }
        
        .stat-bar { height: 10px; background: #222; border-radius: 999px; overflow: hidden; margin-top: 8px; }
        .stat-fill { height: 100%; background: linear-gradient(to right, var(--primary), #00cc7a); transition: width 0.5s ease; }
        
        .donate-tier { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
        .tier-btn {
            flex: 1;
            min-width: 100px;
            padding: 14px 10px;
            border-radius: 14px;
            font-weight: 700;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            border: 2px solid #333;
        }
        
        .tier-btn:hover { transform: translateY(-2px); box-shadow: 0 0 15px currentColor; }
        .tier-btn.common { background: #1f2a1f; border-color: #00ff9d; }
        .tier-btn.rare   { background: #1f1f2a; border-color: #00aaff; }
        .tier-btn.epic   { background: #2a1f2a; border-color: #ff00aa; }
        
        #map { height: 320px; border-radius: 16px; margin: 12px 0; }
        
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: #111;
            color: var(--primary);
            padding: 14px 24px;
            border-radius: 999px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            z-index: 9999;
            display: none;
            font-weight: 600;
            max-width: 90%;
        }
        
        /* Mobile optimizations */
        @media (max-width: 600px) {
            body { padding: 12px; }
            .container { margin: 10px auto; border-radius: 20px; }
            .header h1 { font-size: 2.4rem; }
            #map { height: 280px; }
        }
    </style>
</head>
<body>

    <!-- AUTH SCREEN (unchanged) -->
    <div class="container" id="authScreen">
        <div class="header">
            <h1>ROOT</h1>
            <p style="margin:8px 0 0; font-size:1.1rem; opacity:0.9;">Donation RPG • Apple Pay</p>
        </div>
        <div style="padding:24px;">
            <h2 id="formTitle" style="text-align:center; margin-bottom:20px;">Create Account</h2>
            <input type="email" id="email" placeholder="Email" style="width:100%; padding:16px; margin:8px 0; background:#1c1c24; border:none; border-radius:14px; color:white;">
            <input type="password" id="password" placeholder="Password" style="width:100%; padding:16px; margin:8px 0; background:#1c1c24; border:none; border-radius:14px; color:white;">
            <div id="errorMsg" style="color:#ff6666; text-align:center; margin:10px 0; min-height:20px;"></div>
            <button onclick="handleAuth()" style="width:100%; padding:18px; background:var(--primary); color:#000; border:none; border-radius:14px; font-weight:700; font-size:1.1rem;">Continue</button>
            <button onclick="toggleForm()" style="width:100%; padding:16px; background:#222; color:white; border:none; border-radius:14px; margin-top:10px;">Switch to Login</button>
        </div>
    </div>

    <!-- DASHBOARD -->
    <div class="container" id="dashboardScreen" style="display:none;">
        <div class="header">
            <h1>ROOT</h1>
            <div class="level-badge" id="levelBadge">LVL 1 • 0 XP</div>
            <div id="userGreeting" style="margin-top:12px; font-size:1.25rem; font-weight:700;">Guardian</div>
        </div>

        <div style="padding:8px 0;">
            <!-- STATS, QUESTS, ALLIES, MAP, ACHIEVEMENTS, HISTORY (same as before) -->
            <!-- ... (omitted for brevity - same as your previous version) ... -->

            <!-- DONATION TIERS with Apple Pay -->
            <div class="rpg-card">
                <div style="font-weight:700; margin-bottom:10px;">DONATE WITH APPLE PAY</div>
                <button onclick="quickDonateAll(5,'common')" class="apple-pay-btn">Apple Pay • $5</button>
                <button onclick="quickDonateAll(10,'rare')" class="apple-pay-btn">Apple Pay • $10</button>
                <button onclick="quickDonateAll(25,'epic')" class="apple-pay-btn">Apple Pay • $25</button>
                
                <div style="margin-top:14px; display:flex; gap:10px;">
                    <input type="number" id="customAmount" placeholder="Custom amount" style="flex:1; padding:14px; background:#1c1c24; border:none; border-radius:12px;">
                    <button onclick="quickDonateCustom()" class="apple-pay-btn" style="width:auto; padding:0 24px;">Apple Pay</button>
                </div>
            </div>

            <!-- Ally cards also use Apple Pay buttons -->
            <!-- (See renderAllies() in script) -->
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
    
    <script>
        // ==================== FIREBASE & CORE (same as before) ====================
        const firebaseConfig = { /* your config */ };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        let currentUser = null;
        let allies = [];
        let donationHistory = [];
        // quests, achievements, xp, level, streak, totalDonated, mapInstance... (same variables)

        // ==================== APPLE PAY DONATION ====================
        function triggerApplePay(amount, tier = 'common', username = 'ally') {
            // Realistic simulation
            showToast(`💳 Apple Pay • $${amount} to @${username}...`);
            
            setTimeout(() => {
                showToast(`✅ Apple Pay Successful! $${amount} sent.`);
                confettiBurst();
                
                recordDonation(username, amount, tier, 'applepay');
            }, 800);
        }

        function quickDonateAll(amount, tier) {
            if (allies.length === 0) return showToast("Add an ally first!");
            const ally = allies[0];
            triggerApplePay(amount, tier, ally.username);
        }

        function quickDonateCustom() {
            const amt = parseInt(document.getElementById('customAmount').value);
            if (!amt || amt <= 0) return showToast("Enter a valid amount");
            if (allies.length === 0) return showToast("Add an ally first!");
            const ally = allies[0];
            triggerApplePay(amt, 'custom', ally.username);
            document.getElementById('customAmount').value = '';
        }

        function quickDonateSpecific(index, amount) {
            const ally = allies[index];
            triggerApplePay(amount, amount >= 25 ? 'epic' : amount >= 10 ? 'rare' : 'common', ally.username);
        }

        function quickDonateFromMap(index, amount) {
            const ally = allies[index];
            triggerApplePay(amount, amount >= 25 ? 'epic' : amount >= 10 ? 'rare' : 'common', ally.username);
            if (mapInstance) mapInstance.closePopup();
        }

        // Update renderAllies to show Apple Pay buttons
        function renderAllies(filtered = allies) {
            // ... same as before ...
            // Replace donation buttons with:
            // <button onclick="quickDonateSpecific(${index},5)" class="apple-pay-btn" style="padding:10px;">Apple Pay $5</button>
            // (You can keep tier buttons too or replace them)
        }

        // recordDonation, updateStats, quests, etc. remain the same

        // ... (rest of your script: auth, map, allies, history, etc.)

        // Demo ally uses Apple Pay by default
        if (allies.length === 0) {
            allies.push({ name: "Demo Creator", username: "demo", platform: "applepay", lat: 51.5074, lon: -0.1278 });
        }
    </script>
</body>
</html>
