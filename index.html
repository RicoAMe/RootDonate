<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RootDonate.co.uk - Honest Giving Platform</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        :root {
            --green: #00ff9d;
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a0f;
            color: #e0e0e0;
            line-height: 1.6;
        }
        header {
            background: #111118;
            padding: 1.5rem 0;
            text-align: center;
            border-bottom: 4px solid var(--green);
        }
        .logo {
            font-size: 2.6rem;
            font-weight: 800;
            color: var(--green);
        }
        .hero {
            padding: 140px 20px 100px;
            text-align: center;
            background: linear-gradient(rgba(10,10,15,0.9), rgba(10,10,15,0.9)), url('https://picsum.photos/id/1015/2000/900') center/cover no-repeat;
        }
        .hero h1 {
            font-size: 3.8rem;
            margin-bottom: 16px;
        }
        .card {
            max-width: 920px;
            margin: -80px auto 80px;
            background: #111118;
            border-radius: 28px;
            padding: 70px 50px;
            box-shadow: 0 25px 70px rgba(0,0,0,0.6);
            text-align: center;
        }
        .amounts {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 18px;
            margin: 50px 0;
        }
        .amount-btn {
            padding: 28px 20px;
            background: #1c1c24;
            border: 4px solid var(--green);
            color: white;
            font-size: 1.5rem;
            font-weight: 700;
            border-radius: 18px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .amount-btn:hover {
            background: var(--green);
            color: #000;
            transform: scale(1.05);
        }
        #custom {
            width: 100%;
            padding: 24px;
            font-size: 1.7rem;
            text-align: center;
            background: #1c1c24;
            border: 4px solid #555;
            border-radius: 18px;
            color: white;
            margin: 30px 0;
        }
        .donate-btn {
            width: 100%;
            padding: 30px;
            font-size: 1.9rem;
            font-weight: 700;
            background: var(--green);
            color: #000;
            border: none;
            border-radius: 18px;
            cursor: pointer;
        }
        .disclaimer {
            margin-top: 70px;
            padding: 30px;
            background: #1c1c24;
            border-radius: 16px;
            font-size: 1rem;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">ROOTDONATE</div>
    </header>

    <div class="hero">
        <h1>RootDonate.co.uk</h1>
        <p style="font-size: 1.6rem; max-width: 700px; margin: 0 auto;">
            Transparent donations for causes that matter
        </p>
    </div>

    <div class="card">
        <h2 style="font-size: 2.6rem; margin-bottom: 20px;">Make a Donation</h2>

        <div class="amounts">
            <button class="amount-btn" onclick="setAmount(10)">£10</button>
            <button class="amount-btn" onclick="setAmount(25)">£25</button>
            <button class="amount-btn" onclick="setAmount(50)">£50</button>
            <button class="amount-btn" onclick="setAmount(100)">£100</button>
            <button class="amount-btn" onclick="setAmount(250)">£250</button>
        </div>

        <input type="text" id="custom" placeholder="Custom amount (£)" />

        <button class="donate-btn" onclick="donate()">
            DONATE NOW
        </button>

        <div class="disclaimer">
            <strong>DEMO ONLY</strong><br><br>
            This is a frontend demonstration for rootdonate.co.uk.<br>
            No real payments are processed. Add Stripe, PayPal or similar for live donations.
        </div>
    </div>

    <script>
        function setAmount(val) {
            document.getElementById('custom').value = val;
        }

        function donate() {
            const amount = document.getElementById('custom').value || "25";
            alert(`Thank you!\n\nSimulated donation of £${amount} received.\n\n(This is a demo page only.)`);
        }
    </script>
</body>
</html>
