<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>RootDonate</title>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-2: #334155;
      --accent: #22c55e;
      --accent-hover: #16a34a;
      --text: #f8fafc;
      --muted: #94a3b8;
      --user-bubble: #22c55e;
      --bot-bubble: #1e293b;
      --radius: 18px;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; height: 100%; background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 16px; line-height: 1.45;
    }
    body {
      display: flex; flex-direction: column; height: 100dvh;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    header {
      background: var(--surface); padding: 12px 16px; display: flex;
      justify-content: space-between; align-items: center;
      border-bottom: 1px solid #334155; flex-shrink: 0;
    }
    header strong { font-size: 1.1rem; }
    #status { color: var(--muted); font-size: 0.8rem; }
    .header-actions { display: flex; gap: 8px; }
    button {
      background: var(--accent); color: #000; border: none; padding: 8px 14px;
      border-radius: 12px; font-weight: 600; cursor: pointer; min-height: 40px;
    }
    #clearBtn, #newChatBtn { background: #475569; color: #fff; }
    button:active { opacity: 0.85; }
    #chat {
      flex: 1; overflow-y: auto; padding: 16px; display: flex;
      flex-direction: column; gap: 10px; scroll-behavior: smooth;
    }
    .msg-wrap { max-width: 85%; display: flex; }
    .user { align-self: flex-end; }
    .bot { align-self: flex-start; }
    .msg {
      padding: 12px 16px; border-radius: var(--radius); white-space: pre-wrap;
      word-break: break-word; line-height: 1.4;
    }
    .user .msg { background: var(--user-bubble); color: #000; border-bottom-right-radius: 6px; }
    .bot .msg { background: var(--bot-bubble); border-bottom-left-radius: 6px; }
    .input-bar {
      display: flex; gap: 8px; padding: 12px; background: var(--surface);
      border-top: 1px solid #334155; flex-shrink: 0;
    }
    #input {
      flex: 1; padding: 12px 16px; border: none; border-radius: 22px;
      background: var(--surface-2); color: var(--text); font: inherit;
      resize: none; min-height: 48px; max-height: 120px; outline: none;
    }
    #input:disabled { opacity: 0.6; }
    #send {
      background: var(--accent); color: #000; border: none; width: 48px; height: 48px;
      border-radius: 50%; font-size: 1.2rem; font-weight: 600; cursor: pointer;
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    #send:disabled { opacity: 0.5; cursor: not-allowed; }
    @media (min-width: 600px) { .msg-wrap { max-width: 70%; } }
  </style>
</head>
<body>
  <header>
    <div>
      <strong>RootDonate</strong><br>
      <small id="status">Not signed in</small>
    </div>
    <div class="header-actions">
      <button id="newChatBtn">New Chat</button>
      <button id="clearBtn">Clear Local</button>
      <button id="signBtn">Sign in</button>
    </div>
  </header>

  <div id="chat"></div>

  <div class="input-bar">
    <textarea id="input" placeholder="Ask anything…" rows="1" disabled></textarea>
    <button id="send" disabled>↑</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, signInAnonymously, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, getDocs, limit, where, doc, setDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBvcCBsPiMxS7G2evPjM7sANp-zSy_RkKM",
      authDomain: "rootdonate-61e61.firebaseapp.com",
      projectId: "rootdonate-61e61",
      storageBucket: "rootdonate-61e61.firebasestorage.app",
      messagingSenderId: "754240963907",
      appId: "1:754240963907:web:5417c2763d8f02108bdbf6"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null;
    let memory = [];
    let unsubShared = null;
    let isReplying = false;
    let awaitingTeach = false;
    let pendingInput = null;
    let chatId = null;

    const CHAT_KEY = "rootdonate_chat_history";
    const BASE42 = "0123456789abcdefghijklmnopqrstuvwxyzABCDEF"; // 42 chars

    function toBase42(num) {
      if (num === 0) return BASE42[0];
      let str = "";
      while (num > 0) {
        str = BASE42[num % 42] + str;
        num = Math.floor(num / 42);
      }
      return str;
    }

    function getChatIdFromUrl() {
      const params = new URLSearchParams(window.location.search);
      return params.get("chat");
    }

    function setChatIdInUrl(id) {
      const url = new URL(window.location);
      url.searchParams.set("chat", id);
      history.replaceState(null, "", url);
    }

    function generateChatId() {
      const rand = Math.floor(Math.random() * 1e15);
      const time = Date.now();
      return toBase42(rand).slice(0, 8) + toBase42(time).slice(-5);
    }

    function normalize(text) {
      return (text || "").trim().toLowerCase();
    }

    function findExactResponse(input) {
      const clean = normalize(input);
      for (const pair of memory) {
        if (normalize(pair.input) === clean) return pair.response;
      }
      return null;
    }

    function saveLocalChat() {
      const chat = document.getElementById("chat");
      const messages = Array.from(chat.querySelectorAll(".msg-wrap")).map(wrap => ({
        text: wrap.querySelector(".msg").textContent,
        isUser: wrap.classList.contains("user")
      }));
      localStorage.setItem(CHAT_KEY + "_" + (chatId || "local"), JSON.stringify(messages));
    }

    function loadLocalChat() {
      const key = CHAT_KEY + "_" + (chatId || "local");
      const saved = localStorage.getItem(key);
      if (saved) {
        try {
          const messages = JSON.parse(saved);
          document.getElementById("chat").innerHTML = "";
          messages.forEach(m => addMessage(m.text, m.isUser, false));
        } catch (e) {
          console.warn("Local load failed", e);
        }
      }
    }

    function clearLocalView() {
      document.getElementById("chat").innerHTML = "";
      localStorage.removeItem(CHAT_KEY + "_" + (chatId || "local"));
      awaitingTeach = false;
      pendingInput = null;
    }

    async function saveMessageToCloud(text, isUser) {
      if (!currentUser || !chatId) return;
      try {
        await addDoc(collection(db, "chats", chatId, "messages"), {
          text,
          isUser,
          uid: currentUser.uid,
          createdAt: serverTimestamp()
        });
      } catch (e) {
        console.warn("Cloud save failed", e);
      }
    }

    async function loadChatFromCloud() {
      if (!chatId) return;
      const q = query(collection(db, "chats", chatId, "messages"), orderBy("createdAt", "asc"), limit(500));
      const snap = await getDocs(q);
      document.getElementById("chat").innerHTML = "";
      snap.forEach(doc => {
        const d = doc.data();
        addMessage(d.text, d.isUser, false);
      });
    }

    function listenSharedMemory() {
      if (unsubShared) unsubShared();
      const q = query(collection(db, "shared_memory"), orderBy("createdAt", "desc"), limit(1000));
      unsubShared = onSnapshot(q, snap => {
        memory = snap.docs.map(d => d.data()).reverse();
      });
    }

    async function saveSharedPair(input, response) {
      if (!currentUser) return;
      const q = query(collection(db, "shared_memory"), where("input", "==", input.trim()), limit(1));
      const snap = await getDocs(q);
      if (!snap.empty) return;

      await addDoc(collection(db, "shared_memory"), {
        input: input.trim(),
        response: response.trim(),
        uid: currentUser.uid,
        createdAt: Date.now()
      });
    }

    function addMessage(text, isUser, save = true) {
      const wrap = document.createElement("div");
      wrap.className = "msg-wrap " + (isUser ? "user" : "bot");
      const div = document.createElement("div");
      div.className = "msg";
      div.textContent = text;
      wrap.appendChild(div);
      const chat = document.getElementById("chat");
      chat.appendChild(wrap);
      chat.scrollTop = chat.scrollHeight;
      if (save) {
        saveLocalChat();
        saveMessageToCloud(text, isUser);
      }
    }

    async function reply(userText) {
      if (isReplying) return;
      isReplying = true;

      const response = findExactResponse(userText);

      if (response) {
        addMessage(response, false);
      } else {
        const unknown = "I don't know this yet. Teach me the answer next, and I'll remember it for everyone.";
        addMessage(unknown, false);
        awaitingTeach = true;
        pendingInput = userText;
      }

      isReplying = false;
    }

    function setupUI() {
      const input = document.getElementById("input");
      const sendBtn = document.getElementById("send");
      const signBtn = document.getElementById("signBtn");
      const clearBtn = document.getElementById("clearBtn");
      const newChatBtn = document.getElementById("newChatBtn");
      const status = document.getElementById("status");

      chatId = getChatIdFromUrl();
      if (!chatId) {
        chatId = generateChatId();
        setChatIdInUrl(chatId);
      }

      // Immediately resume from local for this URL
      loadLocalChat();

      onAuthStateChanged(auth, async user => {
        if (user) {
          currentUser = user;
          status.textContent = "Signed in · Shared memory active";
          input.disabled = false;
          sendBtn.disabled = false;
          signBtn.textContent = "Sign out";
          listenSharedMemory();
          await loadChatFromCloud();   // cloud overrides local
        } else {
          currentUser = null;
          status.textContent = "Not signed in";
          input.disabled = true;
          sendBtn.disabled = true;
          signBtn.textContent = "Sign in";
          if (unsubShared) unsubShared();
          memory = [];
        }
      });

      signBtn.onclick = () => {
        if (currentUser) signOut(auth);
        else signInAnonymously(auth);
      };

      clearBtn.onclick = () => {
        if (confirm("Clear local view only? The chat URL will still resume from the cloud.")) {
          clearLocalView();
        }
      };

      newChatBtn.onclick = () => {
        if (confirm("Start a new chat? This creates a new URL.")) {
          chatId = generateChatId();
          setChatIdInUrl(chatId);
          clearLocalView();
        }
      };

      sendBtn.onclick = async () => {
        const text = input.value.trim();
        if (!text || !currentUser) return;
        input.value = "";
        input.style.height = "auto";

        if (awaitingTeach && pendingInput) {
          addMessage(text, true);
          await saveSharedPair(pendingInput, text);
          addMessage("Got it! I'll remember that for everyone.", false);
          awaitingTeach = false;
          pendingInput = null;
          return;
        }

        addMessage(text, true);
        await reply(text);
      };

      input.onkeydown = e => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          sendBtn.click();
        }
      };

      input.oninput = () => {
        input.style.height = "auto";
        input.style.height = Math.min(input.scrollHeight, 120) + "px";
      };
    }

    setupUI();
  </script>
</body>
</html>
