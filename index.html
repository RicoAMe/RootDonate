<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Root Donate • Quick Support</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #00ff9d;
            --bg: #0a0a0f;
            --card: #111118;
        }
        
        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 480px;
            margin: 40px auto;
            background: var(--card);
            border-radius: 24px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #00ff9d, #00cc7a);
            color: #000;
            padding: 40px 20px;
            text-align: center;
        }
        
        h1 { 
            margin: 0; 
            font-size: 2.4rem; 
            font-weight: 700; 
        }
        
        .subtitle {
            margin: 8px 0 0;
            opacity: 0.9;
            font-weight: 500;
        }

        .content { padding: 30px; }

        input, select {
            width: 100%;
            padding: 16px;
            margin: 12px 0;
            background: #1c1c24;
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 1.05rem;
        }

        button {
            width: 100%;
            padding: 16px;
            margin: 12px 0;
            border: none;
            border-radius: 12px;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
        }
        
        .btn-primary { 
            background: var(--primary); 
            color: #000; 
        }
        
        .btn-secondary { 
            background: #333; 
            color: white; 
        }

        .donation-node {
            background: #1c1c24;
            border-radius: 16px;
            padding: 20px;
            margin: 15px 0;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .donation-node:hover {
            background: #27272f;
            transform: translateY(-2px);
        }

        .avatar {
            width: 56px;
            height: 56px;
            background: #00ff9d;
            color: #000;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: 700;
        }

        .node-info {
            flex: 1;
        }

        .node-name {
            font-weight: 600;
            font-size: 1.1rem;
        }

        .node-username {
            color: #00ff9d;
            font-family: monospace;
        }

        .amount-btns {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 12px;
        }

        .amount-btn {
            background: #27272f;
            padding: 10px 16px;
            border-radius: 9999px;
            font-size: 0.95rem;
            cursor: pointer;
        }

        .amount-btn:hover {
            background: var(--primary);
            color: #000;
        }

        .monzo-link {
            background: #1c1c24;
            padding: 14px;
            border-radius: 12px;
            word-break: break-all;
            font-family: monospace;
            font-size: 0.95rem;
            margin: 10px 0;
        }

        .success {
            color: #00ff9d;
            text-align: center;
            margin: 15px 0;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">
            <h1>Root Donate</h1>
            <p class="subtitle">Send support instantly via Monzo.me</p>
        </div>
        
        <div class="content">
            <!-- Add New Donation Node -->
            <h3 style="margin: 10px 0 15px;">Create Donation Node</h3>
            
            <input type="text" id="creatorName" placeholder="Creator / Cause name (e.g. Alex Rivers)">
            <input type="text" id="monzoUsername" placeholder="Monzo.me username (e.g. alexrivers)">
            
            <button class="btn-primary" onclick="addDonationNode()">Add Donation Node</button>

            <!-- Existing Nodes -->
            <div id="nodesContainer"></div>

            <!-- Example Nodes -->
            <h3 style="margin: 30px 0 15px;">Example Nodes</h3>
            
            <div class="donation-node" onclick="openMonzo('example1')">
                <div class="avatar">🌱</div>
                <div class="node-info">
                    <div class="node-name">Climate Action Fund</div>
                    <div class="node-username">@climatefund</div>
                </div>
                <button class="btn-primary" style="width:auto; padding:10px 20px; font-size:0.95rem;">Donate</button>
            </div>

            <div class="donation-node" onclick="openMonzo('example2')">
                <div class="avatar">🎨</div>
                <div class="node-info">
                    <div class="node-name">Indie Artist Collective</div>
                    <div class="node-username">@indieart</div>
                </div>
                <button class="btn-primary" style="width:auto; padding:10px 20px; font-size:0.95rem;">Donate</button>
            </div>
        </div>
    </div>

    <script>
        let donationNodes = [];

        function addDonationNode() {
            const name = document.getElementById('creatorName').value.trim();
            const username = document.getElementById('monzoUsername').value.trim().toLowerCase();

            if (!name || !username) {
                alert("Please enter both name and Monzo username");
                return;
            }

            donationNodes.push({ name, username });

            renderNodes();
            
            // Clear inputs
            document.getElementById('creatorName').value = '';
            document.getElementById('monzoUsername').value = '';
        }

        function renderNodes() {
            const container = document.getElementById('nodesContainer');
            container.innerHTML = '<h3 style="margin: 25px 0 15px;">Your Donation Nodes</h3>';

            donationNodes.forEach((node, index) => {
                const monzoUrl = `https://monzo.me/${node.username}`;
                
                const nodeHTML = `
                    <div class="donation-node">
                        <div class="avatar">${node.name[0]}</div>
                        <div class="node-info">
                            <div class="node-name">${node.name}</div>
                            <div class="node-username">@${node.username}</div>
                            <div class="monzo-link">${monzoUrl}</div>
                            
                            <div class="amount-btns">
                                <div class="amount-btn" onclick="sendMonzoDonation('${node.username}', 5)">£5</div>
                                <div class="amount-btn" onclick="sendMonzoDonation('${node.username}', 10)">£10</div>
                                <div class="amount-btn" onclick="sendMonzoDonation('${node.username}', 20)">£20</div>
                                <div class="amount-btn" onclick="sendMonzoDonation('${node.username}', 50)">£50</div>
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += nodeHTML;
            });
        }

        function sendMonzoDonation(username, amount) {
            const url = `https://monzo.me/${username}?amount=${amount}`;
            window.open(url, '_blank');
        }

        function openMonzo(example) {
            let username = example === 'example1' ? 'climatefund' : 'indieart';
            window.open(`https://monzo.me/${username}`, '_blank');
        }

        // Allow pressing Enter in inputs
        document.getElementById('monzoUsername').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') addDonationNode();
        });
    </script>
</body>
</html>
