<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RootDonate • Support Creators</title>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root { --primary: #00ff9d; --bg: #0a0a0f; --card: #111118; }
        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 460px;
            margin: 40px auto;
            background: var(--card);
            border-radius: 24px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.6);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #00ff9d, #00cc7a);
            color: #000;
            padding: 40px 20px;
            text-align: center;
        }
        h1 { margin: 0; font-size: 2.4rem; }
        .content { padding: 30px; }
        input, button {
            width: 100%;
            padding: 16px;
            margin: 12px 0;
            border: none;
            border-radius: 12px;
            font-size: 1.05rem;
        }
        input { background: #1c1c24; color: white; }
        .btn-primary { background: var(--primary); color: #000; font-weight: 600; }
        .btn-secondary { background: #333; color: white; }
        .error { color: #ff6666; text-align: center; }
        .share-link {
            background: #1c1c24;
            padding: 14px;
            border-radius: 12px;
            font-size: 0.95rem;
            word-break: break-all;
            margin: 15px 0;
        }
        .amount-btn {
            background: #1c1c24;
            padding: 14px;
            margin: 8px 4px;
            border-radius: 12px;
            display: inline-block;
            width: calc(33% - 8px);
            text-align: center;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <!-- Auth Screen -->
    <div class="container" id="authScreen">
        <div class="header"><h1>RootDonate</h1></div>
        <div class="content">
            <h2 id="formTitle" style="text-align:center;">Sign Up</h2>
            <input type="email" id="email" placeholder="Email">
            <input type="password" id="password" placeholder="Password">
            <div id="errorMsg" class="error"></div>
            <button class="btn-primary" onclick="handleAuth()">Continue</button>
            <button class="btn-secondary" onclick="toggleForm()">Switch to Login</button>
        </div>
    </div>

    <!-- Creator Profile Screen (Shareable) -->
    <div class="container" id="profileScreen" style="display:none;">
        <div class="header">
            <h1 id="creatorName">Creator Name</h1>
            <p id="creatorId">@username</p>
        </div>
        <div class="content">
            <p style="text-align:center; font-size:1.1rem;">Total raised: <strong id="totalRaised">£475</strong></p>
            
            <h3 style="margin:25px 0 10px;">Quick Donate</h3>
            <div onclick="quickDonate(10)" class="amount-btn">£10</div>
            <div onclick="quickDonate(25)" class="amount-btn">£25</div>
            <div onclick="quickDonate(50)" class="amount-btn">£50</div>
            <div onclick="quickDonate(100)" class="amount-btn">£100</div>
            
            <button class="btn-primary" onclick="customDonate()">Custom Amount</button>
            
            <div style="margin-top:30px;">
                <strong>Share this profile</strong>
                <div class="share-link" id="shareLink">Generating link...</div>
                <button class="btn-secondary" onclick="copyShareLink()">Copy Link</button>
            </div>
            
            <button class="btn-secondary" onclick="logout()" style="margin-top:20px;">Logout</button>
        </div>
    </div>

    <script>
        // Firebase Config (move to backend in production!)
        const firebaseConfig = { /* your config */ };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        let currentProfile = null;

        function toggleForm() {
            const title = document.getElementById('formTitle');
            title.textContent = title.textContent === 'Sign Up' ? 'Login' : 'Sign Up';
        }

        function handleAuth() {
            // ... (same as before)
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            // For demo, we'll skip real auth and go to profile
            showCreatorProfile({
                name: "Alex Rivers",
                id: "alexrivers",
                total: "475"
            });
        }

        function showCreatorProfile(profile) {
            currentProfile = profile;
            document.getElementById('authScreen').style.display = 'none';
            document.getElementById('profileScreen').style.display = 'block';
            
            document.getElementById('creatorName').textContent = profile.name;
            document.getElementById('creatorId').textContent = `@${profile.id}`;
            document.getElementById('totalRaised').textContent = `£${profile.total}`;
            
            generateShareLink(profile);
        }

        function generateShareLink(profile) {
            const data = btoa(JSON.stringify(profile)); // Base64 encode
            const url = `${window.location.origin}${window.location.pathname}#data=${data}`;
            document.getElementById('shareLink').textContent = url;
        }

        function copyShareLink() {
            const link = document.getElementById('shareLink').textContent;
            navigator.clipboard.writeText(link).then(() => {
                alert("✅ Share link copied!");
            });
        }

        function quickDonate(amount) {
            alert(`Thank you! £${amount} sent to ${currentProfile.name} 🎉`);
        }

        function customDonate() {
            const amount = prompt("Enter amount (£):", "25");
            if (amount) alert(`Thank you! £${parseFloat(amount).toFixed(2)} sent!`);
        }

        function logout() {
            document.getElementById('profileScreen').style.display = 'none';
            document.getElementById('authScreen').style.display = 'block';
        }

        // Handle shared link on page load
        window.onload = function() {
            const hash = window.location.hash;
            if (hash.startsWith('#data=')) {
                try {
                    const base64 = hash.substring(6);
                    const profile = JSON.parse(atob(base64));
                    showCreatorProfile(profile);
                } catch(e) {
                    console.error("Invalid share link");
                }
            }
        };
    </script>
</body>
</html>
