<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a0a0a">
  <title>ROOT DONATE • GLOBAL MESH</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

  <style>
    :root {
      --neon: #00ff9d;
      --glow: #00ff9d88;
      --accent: #ffd700;
      --bg: #0a0a0a;
      --card: rgba(15,20,18,0.97);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Courier New', monospace;
      background: var(--bg);
      color: var(--neon);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    canvas#matrix { position: fixed; inset: 0; z-index: -1; opacity: 0.12; }

    .header { 
      padding: 14px 20px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      border-bottom: 1px solid rgba(0,255,157,0.3); 
      background: rgba(10,10,10,0.98); 
    }
    .header h1 { 
      font-size: 1.65rem; 
      letter-spacing: 4px; 
      text-shadow: 0 0 20px var(--neon); 
    }

    .nav { 
      padding: 10px 20px; 
      display: flex; 
      gap: 8px; 
      flex-wrap: wrap; 
      border-bottom: 1px solid rgba(0,255,157,0.2); 
      background: rgba(10,10,10,0.98); 
    }
    .nav button { 
      background: transparent; 
      border: 1px solid var(--neon); 
      color: var(--neon); 
      padding: 9px 18px; 
      border-radius: 50px; 
      cursor: pointer; 
      transition: all 0.3s; 
      font-size: 0.93rem; 
    }
    .nav button.active, .nav button:hover { 
      background: var(--neon); 
      color: #000; 
      box-shadow: 0 0 20px var(--glow); 
    }

    .search-container { position: relative; margin: 14px 20px; }
    .search-bar { 
      padding: 14px 24px; 
      width: 100%; 
      background: #111; 
      border: 1px solid var(--neon); 
      border-radius: 50px; 
      color: var(--neon); 
      font-family: inherit; 
      font-size: 1rem;
    }
    .suggestions {
      position: absolute; top: 100%; left: 0; right: 0; 
      background: #111; border: 1px solid var(--neon);
      border-radius: 12px; margin-top: 4px; max-height: 420px; 
      overflow-y: auto; z-index: 30; display: none;
      box-shadow: 0 0 20px var(--glow);
    }
    .suggestion-item {
      padding: 12px 20px; cursor: pointer; border-bottom: 1px solid #222; 
      display: flex; align-items: center; gap: 12px;
    }
    .suggestion-item:hover { background: #1a1a1a; color: #fff; }

    .nodes-grid {
      flex: 1; padding: 16px 20px; overflow-y: auto;
      display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px;
    }

    .place-card {
      background: var(--card); 
      border: 1px solid rgba(0,255,157,0.35);
      border-radius: 16px; 
      padding: 18px; 
      cursor: pointer; 
      transition: all 0.4s;
    }
    .place-card:hover { 
      transform: translateY(-5px); 
      border-color: var(--neon); 
      box-shadow: 0 0 25px var(--glow); 
    }

    .scan-bar { 
      height: 3px; 
      background: linear-gradient(90deg, #00ff9d, var(--accent)); 
      margin: 12px 0; 
      border-radius: 2px; 
      animation: scanPulse 1.8s infinite; 
    }
    @keyframes scanPulse { 0%,100% { opacity: 0.7; } 50% { opacity: 1; } }

    .log { 
      height: 148px; 
      background: #0a0a0a; 
      padding: 12px 20px; 
      overflow-y: auto; 
      font-size: 0.84rem; 
      border-top: 1px solid rgba(0,255,157,0.3); 
    }
    .scan-status { 
      text-align: center; 
      padding: 10px; 
      background: #111; 
      border: 1px solid #0f0; 
      margin: 10px 20px; 
      border-radius: 8px; 
    }

    .modal { 
      display: none; 
      position: fixed; 
      inset: 0; 
      background: rgba(0,0,0,0.97); 
      z-index: 100; 
      align-items: center; 
      justify-content: center; 
      padding: 10px; 
    }
    .modal-content {
      background: rgba(15,20,18,0.98); 
      border: 2px solid var(--neon); 
      border-radius: 16px;
      width: 100%; 
      max-width: 540px; 
      padding: 26px; 
      max-height: 92vh; 
      overflow-y: auto;
    }

    .history-item { 
      padding: 12px; 
      background: #111; 
      margin-bottom: 8px; 
      border-left: 4px solid var(--neon); 
    }

    input, textarea, select { 
      background:#111; 
      border:1px solid var(--neon); 
      color:var(--neon); 
      padding:11px; 
      border-radius:8px; 
      width:100%; 
      margin:8px 0; 
      font-family:inherit; 
    }
    button.primary { 
      background:var(--accent); 
      color:#000; 
      border:none; 
      padding:13px 26px; 
      border-radius:50px; 
      font-weight:bold; 
      cursor:pointer; 
      width:100%; 
      margin-top:8px;
    }
    .apple-pay-btn {
      background: #000;
      color: white;
      border: 1px solid #fff;
      padding: 12px;
      border-radius: 8px;
      font-size: 1.1rem;
      margin-top: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
  </style>
</head>
<body>

  <canvas id="matrix"></canvas>

  <div class="header">
    <h1>🌍 ROOT DONATE</h1>
    <div style="display:flex; align-items:center; gap:12px;">
      <button onclick="toggleLearnMode()" style="padding:8px 16px; background:transparent; border:1px solid var(--neon); color:var(--neon); border-radius:50px;">📖 LEARN</button>
      <div id="userSection" style="display:none;" onclick="showProfile()">
        <div style="display:flex; align-items:center; gap:8px; cursor:pointer;">
          <div style="font-size:1.8rem;">👤</div>
          <div>
            <div id="usernameDisplay" style="font-weight:bold;"></div>
            <div id="balanceDisplay" style="font-size:0.8rem;color:#0f0;">0 ROOT</div>
          </div>
        </div>
      </div>
      <button onclick="showAuthModal()" id="authBtn" style="padding:8px 20px; border:1px solid var(--neon); background:transparent; color:var(--neon); border-radius:50px;">
        <i class="fas fa-user"></i> LOGIN
      </button>
    </div>
  </div>

  <div class="nav">
    <button class="active" onclick="setTab(0)">🌐 LIVE PLACES</button>
    <button onclick="setTab(1)">🔎 DEEP NUMIS</button>
    <button onclick="startAutoAddressSearch()">📍 AUTO LOCATE</button>
    <button onclick="showReportModal()">📢 NEW REPORT</button>
    <button onclick="resetScan()">RESET GRID</button>
  </div>

  <div id="scanStatus" class="scan-status" style="display:none;">
    <i class="fas fa-satellite-dish"></i> <span id="scanText">SCANNING GLOBAL GRID...</span>
  </div>

  <div class="search-container">
    <input type="text" id="searchInput" class="search-bar" placeholder="Search any place on Earth..." onkeyup="autoCompleteSearch()" autocomplete="off">
    <div id="suggestions" class="suggestions"></div>
  </div>

  <div class="nodes-grid" id="grid"></div>
  <div class="log" id="log"></div>

  <!-- NEW REPORT MODAL - CLEANED & IMPROVED -->
  <div id="reportModal" class="modal">
    <div class="modal-content">
      <h2>📢 NEW REPORT</h2>
      <input type="text" id="reportTitle" placeholder="Find Title (e.g. 1795 Flowing Hair Dollar)" autocomplete="off">
      <input type="text" id="reportLocation" placeholder="Exact Location / Coordinates" autocomplete="off">
      <textarea id="reportDesc" rows="4" placeholder="Depth, soil type, associated items, notes..."></textarea>
      
      <select id="reportType">
        <option value="Coin">Coin</option>
        <option value="Relic">Relic</option>
        <option value="Jewelry">Jewelry</option>
        <option value="Artifact">Artifact</option>
        <option value="Other">Other</option>
      </select>
      
      <button onclick="simulatePhotoUpload()" style="margin:12px 0;">📸 Attach Photo (simulated)</button>
      <div id="photoPreview" style="margin:8px 0; color:#0f0; font-size:0.9rem;"></div>

      <div style="display:flex; gap:10px; margin-top:15px;">
        <button onclick="submitReport()" class="primary">SUBMIT TO GLOBAL MESH</button>
        <button onclick="closeReportModal()" style="background:transparent;border:1px solid var(--neon);color:var(--neon);padding:13px;">CANCEL</button>
      </div>
    </div>
  </div>

  <!-- PLACE DETAIL MODAL -->
  <div id="placeModal" class="modal">
    <div class="modal-content">
      <div id="modalIcon" style="text-align:center;font-size:4.8rem;margin:12px 0;"></div>
      <h2 id="modalName"></h2>
      <p id="modalLoc" style="opacity:0.8;"></p>
      <p><strong>Probability:</strong> <span id="modalProb" style="color:#0f0;"></span></p>
      <p><strong>Expected:</strong> <span id="modalExpected"></span></p>

      <button onclick="copyShareLink()" style="margin:12px 0;width:100%;">🔗 Copy Share Link</button>
      
      <button onclick="showDonateModal()" class="primary">💰 DONATE ROOT</button>
      <button onclick="applePayDonate()" class="apple-pay-btn">
        <i class="fab fa-apple-pay"></i> Pay with Apple Pay
      </button>

      <h3 style="margin:22px 0 10px 0;">Donation History</h3>
      <div id="placeDonationHistory"></div>

      <button onclick="closePlaceModal()" style="margin-top:15px;background:transparent;border:1px solid var(--neon);color:var(--neon);width:100%;">CLOSE</button>
    </div>
  </div>

  <!-- DONATE MODAL -->
  <div id="donateModal" class="modal">
    <div class="modal-content">
      <h2>Support <span id="donateTo"></span></h2>
      <p>Balance: <strong id="donorBalance"></strong> ROOT</p>
      <input type="number" id="donateAmount" placeholder="Amount" style="font-size:1.4rem;text-align:center;">
      <button onclick="confirmDonation()" class="primary">CONFIRM DONATION</button>
      <button onclick="closeDonateModal()" style="margin-top:8px;background:transparent;border:1px solid var(--neon);color:var(--neon);width:100%;">CANCEL</button>
    </div>
  </div>

  <!-- AUTH MODAL -->
  <div id="authModal" class="modal">
    <div class="modal-content">
      <h2>ROOT ACCOUNT</h2>
      <button onclick="login()" style="width:100%;margin:10px 0;">Login as @hunter</button>
      <button onclick="signup()" style="width:100%;margin:10px 0;">Create New Account</button>
      <button onclick="closeAuthModal()" style="background:transparent;border:1px solid var(--neon);color:var(--neon);width:100%;">Close</button>
    </div>
  </div>

  <script>
    // Matrix Rain
    const canvas = document.getElementById('matrix');
    const ctx = canvas.getContext('2d');
    let drops = [];
    function resizeCanvas() { 
      canvas.width = window.innerWidth; 
      canvas.height = window.innerHeight; 
      drops = Array(Math.floor(canvas.width / 14)).fill(1); 
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function drawMatrix() {
      ctx.fillStyle = 'rgba(10,10,10,0.12)'; 
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#00ff9d'; 
      ctx.font = '14px monospace';
      const chars = '0123456789$€£¥₿🪙🌍⚡';
      for (let i = 0; i < drops.length; i++) {
        ctx.fillText(chars[Math.floor(Math.random()*chars.length)], i*14, drops[i]*14);
        if (drops[i]*14 > canvas.height && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
      }
    }
    setInterval(drawMatrix, 35);

    let places = [];
    let currentUser = null;
    let currentPlace = null;

    const logEl = document.getElementById('log');
    function log(msg) {
      const time = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
      logEl.innerHTML += `<span style="opacity:0.6">[${time}]</span> ${msg}<br>`;
      logEl.scrollTop = logEl.scrollHeight;
    }

    const realPlacePool = [
      { name: "California Mother Lode", loc: "California, USA", prob: "HIGH", exp: "Gold coins & nuggets", icon: "⛏️", dist: "8 km" },
      { name: "Gettysburg Battlefield", loc: "Pennsylvania, USA", prob: "VERY HIGH", exp: "Civil War relics", icon: "⚔️", dist: "35 km" },
      { name: "Bodie Ghost Town", loc: "California, USA", prob: "HIGH", exp: "Gold Rush coins", icon: "🏚️", dist: "91 km" },
      { name: "Roman Forum", loc: "Rome, Italy", prob: "HIGH", exp: "Ancient Roman coins", icon: "🏛️", dist: "15 km" },
      { name: "Machu Picchu", loc: "Cusco, Peru", prob: "HIGH", exp: "Inca artifacts", icon: "🏔️", dist: "650 km" },
      { name: "Angkor Wat", loc: "Siem Reap, Cambodia", prob: "MED", exp: "Khmer relics", icon: "🛕", dist: "890 km" },
      { name: "Gallipoli Trenches", loc: "Turkey", prob: "HIGH", exp: "WW1 relics", icon: "⚔️", dist: "140 km" },
      { name: "Stonehenge", loc: "Wiltshire, UK", prob: "MED", exp: "Bronze Age items", icon: "🪨", dist: "67 km" },
      { name: "Oak Island", loc: "Nova Scotia, Canada", prob: "VERY HIGH", exp: "Treasure chests", icon: "🪙", dist: "210 km" },
      { name: "Temple of Karnak", loc: "Luxor, Egypt", prob: "HIGH", exp: "Pharaonic relics", icon: "🪔", dist: "420 km" }
    ];

    const addressDatabase = [
      { full: "California Mother Lode, CA, USA", city: "California", country: "USA" },
      { full: "Gettysburg, PA, USA", city: "Gettysburg", country: "USA" },
      { full: "Bodie, California, USA", city: "Bodie", country: "USA" },
      { full: "Rome, Italy", city: "Rome", country: "Italy" },
      { full: "Machu Picchu, Peru", city: "Cusco", country: "Peru" },
      { full: "Angkor Wat, Cambodia", city: "Siem Reap", country: "Cambodia" },
      { full: "Stonehenge, UK", city: "Wiltshire", country: "UK" }
    ];

    function toBase64Url(obj) {
      const str = btoa(unescape(encodeURIComponent(JSON.stringify(obj))));
      return str.replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
    }

    function generateShareUrl(place) {
      const minimal = { id: place.id, name: place.name, loc: place.loc, icon: place.icon };
      return `${location.origin}${location.pathname}#${toBase64Url(minimal)}`;
    }

    function startAutoAddressSearch() {
      document.getElementById('scanStatus').style.display = 'block';
      document.getElementById('scanText').textContent = 'SCANNING GLOBAL GRID...';
      log("🌍 GLOBAL SCAN INITIATED");

      setTimeout(() => {
        places = [];
        const pool = [...realPlacePool];
        for (let i = 0; i < 128; i++) {
          const base = pool[i % pool.length];
          places.push({ 
            ...base, 
            id: `RD-${10000 + Math.floor(Math.random()*90000)}`, 
            donations: [],
            dist: `${Math.floor(Math.random()*280) + 2} km`
          });
        }
        renderPlaces();
        document.getElementById('scanStatus').style.display = 'none';
        log(`✅ ${places.length} GLOBAL LOCATIONS LOADED`);
      }, 1100);
    }

    function renderPlaces(filtered = places) {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      filtered.forEach(place => {
        const card = document.createElement('div');
        card.className = 'place-card';
        card.innerHTML = `
          <div style="display:flex;justify-content:space-between;font-size:0.8rem;opacity:0.7;">
            <span>${place.id}</span><span style="color:#0f0;">${place.dist}</span>
          </div>
          <div style="font-size:3.2rem;margin:14px 0;text-align:center;">${place.icon}</div>
          <h3>${place.name}</h3>
          <p>📍 ${place.loc}</p>
          <div class="scan-bar"></div>
          <p><strong>PROB:</strong> <span style="color:#0f0;">${place.prob}</span></p>
        `;
        card.onclick = () => showPlaceDetail(place);
        grid.appendChild(card);
      });
    }

    function autoCompleteSearch() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      const container = document.getElementById('suggestions');

      if (q.length < 2) {
        container.style.display = 'none';
        renderPlaces();
        return;
      }

      container.innerHTML = '';
      let hasResults = false;

      addressDatabase.filter(addr => addr.full.toLowerCase().includes(q) || addr.city.toLowerCase().includes(q)).forEach(addr => {
        const div = document.createElement('div');
        div.className = 'suggestion-item';
        div.innerHTML = `<i class="fas fa-map-marker-alt"></i><div><strong>${addr.full}</strong></div>`;
        div.onclick = () => {
          document.getElementById('searchInput').value = addr.full;
          container.style.display = 'none';
          startAutoAddressSearch();
        };
        container.appendChild(div);
        hasResults = true;
      });

      container.style.display = hasResults ? 'block' : 'none';
    }

    function showPlaceDetail(place) {
      currentPlace = place;
      if (!place.donations) place.donations = [];

      document.getElementById('modalIcon').textContent = place.icon;
      document.getElementById('modalName').textContent = place.name;
      document.getElementById('modalLoc').textContent = `📍 ${place.loc}`;
      document.getElementById('modalProb').textContent = place.prob;
      document.getElementById('modalExpected').textContent = place.exp;

      let hist = place.donations.map(d => 
        `<div class="history-item"><strong>💰 ${d.amount} ROOT</strong> from ${d.from}<br><small>${d.time}</small></div>`
      ).join('');
      
      document.getElementById('placeDonationHistory').innerHTML = hist || '<p style="opacity:0.6;">No donations yet — be the first!</p>';

      document.getElementById('placeModal').style.display = 'flex';
    }

    function copyShareLink() {
      if (!currentPlace) return;
      navigator.clipboard.writeText(generateShareUrl(currentPlace));
      alert("✅ Share link copied!");
    }

    function showDonateModal() {
      if (!currentUser) return alert("Login required");
      document.getElementById('donateTo').textContent = currentPlace.name;
      document.getElementById('donorBalance').textContent = currentUser.balance + " ROOT";
      document.getElementById('donateAmount').value = "50";
      document.getElementById('donateModal').style.display = 'flex';
    }

    function confirmDonation() {
      const amount = parseInt(document.getElementById('donateAmount').value);
      if (!amount || amount > currentUser.balance) return alert("Invalid amount");
      
      currentUser.balance -= amount;
      currentPlace.donations.unshift({ from: currentUser.handle, amount, time: new Date().toLocaleString() });

      document.getElementById('balanceDisplay').textContent = currentUser.balance + " ROOT";
      log(`💸 Donated ${amount} ROOT to ${currentPlace.name}`);
      alert("✅ Donation recorded. Thank you!");
      closeDonateModal();
      closePlaceModal();
      showPlaceDetail(currentPlace);
    }

    // Apple Pay Simulation
    function applePayDonate() {
      if (!currentUser) return alert("Login required");
      const amount = prompt("Enter amount for Apple Pay (ROOT):", "100");
      if (amount && !isNaN(amount)) {
        const num = parseInt(amount);
        if (num > currentUser.balance) return alert("Insufficient balance");
        
        currentUser.balance -= num;
        currentPlace.donations.unshift({ 
          from: currentUser.handle + " (Apple Pay)", 
          amount: num, 
          time: new Date().toLocaleString() 
        });

        document.getElementById('balanceDisplay').textContent = currentUser.balance + " ROOT";
        log(`🍎 Apple Pay: ${num} ROOT donated to ${currentPlace.name}`);
        alert("✅ Apple Pay donation successful!");
        closePlaceModal();
        showPlaceDetail(currentPlace);
      }
    }

    function login() {
      currentUser = { handle: "@hunter", balance: 12450 };
      document.getElementById('authBtn').style.display = 'none';
      document.getElementById('userSection').style.display = 'block';
      document.getElementById('usernameDisplay').textContent = currentUser.handle;
      document.getElementById('balanceDisplay').textContent = currentUser.balance + " ROOT";
      closeAuthModal();
      log(`🔓 Logged in as ${currentUser.handle}`);
    }

    function signup() {
      currentUser = { handle: "@globalexplorer", balance: 5200 };
      document.getElementById('authBtn').style.display = 'none';
      document.getElementById('userSection').style.display = 'block';
      document.getElementById('usernameDisplay').textContent = currentUser.handle;
      document.getElementById('balanceDisplay').textContent = currentUser.balance + " ROOT";
      closeAuthModal();
      log("✅ New account created");
    }

    function simulatePhotoUpload() {
      document.getElementById('photoPreview').innerHTML = '✅ Photo attached successfully';
    }

    function submitReport() {
      const title = document.getElementById('reportTitle').value.trim();
      if (!title) return alert("Please enter a title");
      alert("✅ Report successfully submitted to the Global Mesh!");
      closeReportModal();
      log(`📢 New report: ${title}`);
    }

    function closePlaceModal() { document.getElementById('placeModal').style.display = 'none'; }
    function closeDonateModal() { document.getElementById('donateModal').style.display = 'none'; }
    function showAuthModal() { document.getElementById('authModal').style.display = 'flex'; }
    function closeAuthModal() { document.getElementById('authModal').style.display = 'none'; }
    function showReportModal() { document.getElementById('reportModal').style.display = 'flex'; }
    function closeReportModal() { document.getElementById('reportModal').style.display = 'none'; }
    function setTab(n) { document.querySelectorAll('.nav button').forEach((b,i) => b.classList.toggle('active', i===n)); }
    function resetScan() { if(confirm("Reset global grid?")) startAutoAddressSearch(); }
    function toggleLearnMode() { alert("ROOT DONATE GLOBAL v2.7 — Cleaned + Apple Pay Ready"); }

    window.onload = () => {
      startAutoAddressSearch();
      log("🌍 ROOT DONATE v2.7 — Masterpiece Edition Loaded");
    };
  </script>
</body>
</html>
