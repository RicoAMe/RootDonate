<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Donate • Debit Card</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #00ff9d;
      --accent: #ff00aa;
      --bg: #0a0a0f;
      --card: #111118;
      --border: #222226;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: #e0e0e0;
      min-height: 100dvh;
      padding: 20px 12px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .container {
      max-width: 420px;
      width: 100%;
      background: var(--card);
      border-radius: 28px;
      border: 1px solid var(--border);
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0, 255, 157, 0.1);
      margin-top: 20px;
    }

    .header {
      background: linear-gradient(135deg, #00ff9d 0%, #ff00aa 100%);
      color: #000;
      padding: 28px 24px 24px;
      text-align: center;
    }

    .header h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.9rem;
      font-weight: 700;
      letter-spacing: -1px;
    }

    .profile-name {
      font-size: 1.3rem;
      font-weight: 700;
      margin-top: 10px;
    }

    .content {
      padding: 24px;
    }

    /* Debit Card */
    .debit-card {
      width: 100%;
      height: 210px;
      background: linear-gradient(145deg, #1c1c1c, #0d0d0d);
      border-radius: 16px;
      position: relative;
      color: white;
      margin-bottom: 24px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.5);
      overflow: hidden;
    }

    .debit-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(105deg, transparent 40%, rgba(255,255,255,0.04) 50%, transparent 60%);
    }

    .chip {
      position: absolute;
      top: 24px;
      left: 24px;
      width: 44px;
      height: 34px;
      background: linear-gradient(135deg, #c9a227, #e8d48b);
      border-radius: 5px;
    }

    .card-logo {
      position: absolute;
      top: 22px;
      right: 24px;
      font-size: 20px;
      font-weight: 700;
    }

    .card-number {
      position: absolute;
      top: 95px;
      left: 24px;
      font-size: 19px;
      letter-spacing: 3px;
    }

    .card-handle {
      position: absolute;
      bottom: 52px;
      left: 24px;
      font-size: 15px;
      font-weight: 600;
    }

    .card-bottom {
      position: absolute;
      bottom: 20px;
      left: 24px;
      right: 24px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      font-size: 12px;
      opacity: 0.85;
    }

    .visa {
      font-size: 24px;
      font-weight: 800;
      font-style: italic;
    }

    /* Form */
    .form-group { margin-bottom: 14px; }

    label {
      display: block;
      font-size: 0.88rem;
      color: #aaa;
      margin-bottom: 5px;
    }

    input {
      width: 100%;
      padding: 15px 16px;
      background: #1c1c24;
      border: 1px solid #333;
      border-radius: 14px;
      color: white;
      font-size: 1rem;
    }

    input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(0, 255, 157, 0.15);
    }

    .row {
      display: flex;
      gap: 12px;
    }

    .row .form-group { flex: 1; }

    .btn {
      width: 100%;
      padding: 17px;
      border: none;
      border-radius: 14px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
      transition: transform 0.2s;
    }

    .btn:active { transform: scale(0.98); }

    .pay-btn {
      background: var(--primary);
      color: #000;
    }

    .share-btn {
      background: #1f1f26;
      color: white;
      border: 1px solid #333;
      margin-top: 16px;
    }

    .amount-btns {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin: 16px 0;
    }

    .amount-btns button {
      background: #1f1f26;
      border: 1px solid #333;
      color: white;
      border-radius: 12px;
      padding: 14px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
    }

    .amount-btns button.active {
      background: var(--primary);
      color: #000;
    }

    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: #111;
      color: var(--primary);
      padding: 14px 28px;
      border-radius: 999px;
      font-weight: 700;
      display: none;
      z-index: 999;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Donate</h1>
      <div class="profile-name" id="profileName">@YourHandle</div>
    </div>

    <div class="content">
      <!-- Debit Card Visual -->
      <div class="debit-card">
        <div class="chip"></div>
        <div class="card-logo">𝕏 Money</div>
        <div class="card-number">•••• •••• •••• 8842</div>
        <div class="card-handle" id="cardHandle">@YourHandle</div>
        <div class="card-bottom">
          <div>
            <div style="font-size:10px; opacity:0.7;">VALID THRU</div>
            <div>09/29</div>
          </div>
          <div class="visa">VISA</div>
        </div>
      </div>

      <!-- Quick Amounts -->
      <div class="amount-btns" id="amountGrid">
        <button onclick="setAmount(5)" class="active">$5</button>
        <button onclick="setAmount(10)">$10</button>
        <button onclick="setAmount(25)">$25</button>
      </div>

      <!-- Card Form -->
      <div class="form-group">
        <label>Card Number</label>
        <input type="text" id="cardNumber" placeholder="ACCT-000035" maxlength="19">
      </div>

      <div class="form-group">
        <label>Name on Card</label>
        <input type="text" id="cardName" placeholder="Full Name">
      </div>

      <div class="row">
        <div class="form-group">
          <label>Expiry</label>
          <input type="text" id="expiry" placeholder="MM/YY" maxlength="5">
        </div>
        <div class="form-group">
          <label>CVV</label>
          <input type="text" id="cvv" placeholder="123" maxlength="4">
        </div>
      </div>

      <button class="btn pay-btn" onclick="donate()">Donate with Debit Card</button>
      <button class="btn share-btn" onclick="shareProfile()">🔗 Share My Profile Link</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    let currentAmount = 5;
    let profile = {
      name: "YourHandle",
      handle: "@YourHandle"
    };

    // Load profile from base64 URL parameter
    function loadProfileFromURL() {
      const params = new URLSearchParams(window.location.search);
      const encoded = params.get("p");
      if (encoded) {
        try {
          const decoded = JSON.parse(atob(encoded));
          profile = decoded;
          document.getElementById("profileName").textContent = profile.name || profile.handle;
          document.getElementById("cardHandle").textContent = profile.handle || "@" + profile.name;
        } catch (e) {
          console.log("Invalid profile link");
        }
      }
    }

    function setAmount(amount) {
      currentAmount = amount;
      document.querySelectorAll("#amountGrid button").forEach(btn => btn.classList.remove("active"));
      event.currentTarget.classList.add("active");
    }

    function showToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.style.display = "block";
      setTimeout(() => t.style.display = "none", 2500);
    }

    function donate() {
      // This is a demo only – no real payment is processed
      showToast(`✅ $${currentAmount} donation simulated!`);
    }

    function shareProfile() {
      const data = {
        name: profile.name,
        handle: profile.handle
      };
      const encoded = btoa(JSON.stringify(data));
      const shareLink = `${window.location.origin}${window.location.pathname}?p=${encoded}`;
      
      navigator.clipboard.writeText(shareLink).then(() => {
        showToast("✅ Profile link copied!");
      }).catch(() => {
        prompt("Copy this link:", shareLink);
      });
    }

    // Auto format card number
    document.getElementById("cardNumber").addEventListener("input", function(e) {
      let value = e.target.value.replace(/\D/g, "").substring(0, 16);
      value = value.replace(/(.{4})/g, "$1 ").trim();
      e.target.value = value;
    });

    // Auto format expiry
    document.getElementById("expiry").addEventListener("input", function(e) {
      let value = e.target.value.replace(/\D/g, "").substring(0, 4);
      if (value.length >= 3) {
        value = value.substring(0, 2) + "/" + value.substring(2);
      }
      e.target.value = value;
    });

    // Load profile when page opens
    loadProfileFromURL();
  </script>
</body>
</html>
