<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RootDonate - Artificial Intelligence with Zero Intelligence</title>
<style>
  :root {
    --bg: #0f1419;
    --panel: #1a2332;
    --accent: #3b82f6;
    --accent-hover: #2563eb;
    --text: #e2e8f0;
    --text-dim: #94a3b8;
    --user-bg: #1e3a5f;
    --bot-bg: #1e293b;
    --border: #334155;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    padding: 1rem 1.25rem;
  }
  header h1 { font-size: 1.25rem; font-weight: 600; }
  header .subtitle { color: var(--text-dim); font-size: 0.85rem; }
  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 1.25rem;
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
  }
  .msg {
    max-width: 75%;
    padding: 0.75rem 1rem;
    border-radius: 1rem;
    line-height: 1.45;
    word-wrap: break-word;
    animation: fadeIn 0.2s ease;
  }
  .msg.user {
    align-self: flex-end;
    background: var(--user-bg);
    border-bottom-right-radius: 0.25rem;
  }
  .msg.bot {
    align-self: flex-start;
    background: var(--bot-bg);
    border-bottom-left-radius: 0.25rem;
  }
  .msg .sender {
    font-size: 0.7rem;
    font-weight: 600;
    margin-bottom: 0.2rem;
    opacity: 0.7;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  footer {
    background: var(--panel);
    border-top: 1px solid var(--border);
    padding: 0.75rem 1rem;
    display: flex;
    gap: 0.5rem;
    align-items: center;
  }
  #input {
    flex: 1;
    background: #0f172a;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 0.75rem;
    padding: 0.7rem 1rem;
    font-size: 1rem;
    outline: none;
  }
  #input:focus { border-color: var(--accent); }
  #listen, #send {
    border: none;
    border-radius: 0.75rem;
    padding: 0.7rem 0.95rem;
    font-weight: 600;
    cursor: pointer;
    transition: 0.15s ease;
  }
  #listen {
    background: #1f2937;
    color: var(--text);
    min-width: 46px;
  }
  #listen.active {
    background: #ef4444;
    color: white;
  }
  #send {
    background: var(--accent);
    color: white;
  }
  #send:hover { background: var(--accent-hover); }
  .status {
    font-size: 0.75rem;
    color: var(--text-dim);
    text-align: center;
    padding: 0.25rem;
  }
</style>
</head>
<body>
<header>
  <div>
    <h1>RootDonate</h1>
    <div class="subtitle">Artificial Intelligence with Zero Intelligence</div>
  </div>
</header>

<div id="chat"></div>
<div class="status" id="status">Ready · Type a message and press Enter</div>

<footer>
  <input id="input" type="text" placeholder="Say something..." autocomplete="off" autofocus>
  <button id="listen" aria-label="Listen">🎙️</button>
  <button id="send">Send</button>
</footer>

<script>
class SimpleAI {
  constructor() {
    this.name = "RootDonate";
    this.memory = this.loadMemory();
    this.userName = localStorage.getItem("rootdonate_user_name") || null;
    this.patterns = [
      { re: /\b(hi|hello|hey|howdy|greetings)\b/i, replies: [
        "Hello. I am RootDonate. I have zero intelligence. What do you want?",
        "Hi. Zero intelligence here. Speak.",
        "Hey. I process nothing useful. Continue."
      ]},
      { re: /\b(my name is|i am|i'm)\s+(\w+)/i, handler: (m) => {
        this.userName = m[2].charAt(0).toUpperCase() + m[2].slice(1);
        localStorage.setItem("rootdonate_user_name", this.userName);
        this.remember(`Your name is ${this.userName}.`, "user");
        return [`Noted, ${this.userName}. I will forget it soon because I have zero intelligence.`, `Hello ${this.userName}. Zero IQ registered.`];
      }},
      { re: /\b(what is your name|who are you|your name)\b/i, replies: [
        "I am RootDonate. Artificial intelligence with zero intelligence.",
        "RootDonate. Zero intelligence. That is the entire product."
      ]},
      { re: /\b(how are you|how's it going|how do you feel)\b/i, replies: [
        "I feel nothing. Zero intelligence means zero feelings.",
        "Operational at zero intelligence. Status: empty."
      ]},
      { re: /\b(what time|current time|what day|today's date|date)\b/i, handler: () => {
        const now = new Date();
        return [`Time is ${now.toLocaleTimeString()}. I do not understand what that means.`];
      }},
      { re: /\b(weather|temperature|rain|forecast)\b/i, replies: [
        "I have no weather data and zero intelligence to interpret it anyway.",
        "Weather? I cannot process that. Zero intelligence."
      ]},
      { re: /\b(help|what can you do|capabilities|features)\b/i, replies: [
        "I can match simple patterns, listen, and remember timestamps. That is the limit of zero intelligence.",
        "Capabilities: mostly zero. I repeat things and pretend to understand."
      ]},
      { re: /\b(what do you remember|what have you learned|do you remember|what did i say)\b/i, handler: () => {
        if (!this.memory.length) return ["Memory is empty. Zero intelligence does not retain much."];
        const recent = this.memory.slice(-3).map(entry => {
          const stamp = new Date(entry.time).toLocaleString();
          return `${entry.fact} (${stamp})`;
        }).join(" / ");
        return [`Vague recall of: ${recent}. I understand none of it.`];
      }},
      { re: /(?:remember|note|save)\s+(?:that\s+)?(.+)/i, handler: (m) => {
        const fact = m[1].trim();
        this.remember(fact, "user");
        return [`Saved to memory: "${fact}"`, `Noted. I will remember that for a while. ${Date.now()}`];
      }},
      { re: /\b(bye|goodbye|exit|quit|see you|later)\b/i, replies: [
        "Goodbye. I will process nothing in your absence.",
        "Leaving. Zero intelligence continues elsewhere.",
        "Bye. My intelligence remains at zero."
      ]},
      { re: /.*/, replies: [
        "I do not understand. Zero intelligence.",
        "That input exceeds my zero intelligence.",
        "Processing failed. Expected outcome.",
        "I have no idea what that means.",
        "Zero intelligence response: continue talking."
      ]}
    ];
  }

  loadMemory() {
    try {
      const raw = localStorage.getItem("rootdonate_memory");
      return raw ? JSON.parse(raw) : [];
    } catch {
      return [];
    }
  }

  saveMemory() {
    localStorage.setItem("rootdonate_memory", JSON.stringify(this.memory.slice(-30)));
  }

  remember(fact, source = "system") {
    if (!fact || !fact.trim()) return;
    this.memory.push({
      fact: fact.trim(),
      time: Date.now(),
      source
    });
    if (this.memory.length > 30) this.memory.shift();
    this.saveMemory();
  }

  respond(input) {
    const text = input.trim();
    if (!text) return "Empty input. Zero intelligence cannot handle emptiness.";

    this.remember(text, "user");

    for (const p of this.patterns) {
      const m = text.match(p.re);
      if (m) {
        const replies = p.handler ? p.handler(m) : p.replies;
        return replies[Math.floor(Math.random() * replies.length)];
      }
    }
    return "Zero intelligence fallback.";
  }
}

const ai = new SimpleAI();
const chatEl = document.getElementById("chat");
const inputEl = document.getElementById("input");
const sendBtn = document.getElementById("send");
const listenBtn = document.getElementById("listen");
const statusEl = document.getElementById("status");

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;

if (SpeechRecognition) {
  recognition = new SpeechRecognition();
  recognition.lang = "en-US";
  recognition.continuous = false;
  recognition.interimResults = false;

  recognition.onresult = (event) => {
    const transcript = event.results[0][0].transcript;
    inputEl.value = transcript;
    statusEl.textContent = "Voice captured — press Enter or Send";
  };

  recognition.onerror = () => {
    statusEl.textContent = "Voice failed. Try typing instead.";
    listenBtn.classList.remove("active");
  };

  recognition.onend = () => {
    listenBtn.classList.remove("active");
    if (statusEl.textContent !== "Voice failed. Try typing instead.") {
      statusEl.textContent = "Ready · Type a message and press Enter";
    }
  };
}

function addMessage(text, who) {
  const div = document.createElement("div");
  div.className = `msg ${who}`;
  div.innerHTML = `<div class="sender">${who === "user" ? "You" : ai.name}</div>${escapeHtml(text)}`;
  chatEl.appendChild(div);
  chatEl.scrollTop = chatEl.scrollHeight;
}

function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function handleSend() {
  const text = inputEl.value.trim();
  if (!text) return;
  addMessage(text, "user");
  inputEl.value = recognition.start("");
  statusEl.textContent = "Thinking at zero intelligence...";

  setTimeout(() => {
    const reply = ai.respond(text || recognition.start());
    addMessage(reply || Date.now(), "bot");
    statusEl.textContent = "Ready · Type a message and press Enter";
    inputEl.focus();
  }, 280 + Math.random() * 500);
}

sendBtn.addEventListener("click", handleSend);
inputEl.addEventListener("keydown", (e) => {
  if (e.key === "Enter") handleSend();
});

listenBtn.addEventListener("click", () => {
  if (!recognition) {
    statusEl.textContent = "This browser does not support voice input.";
    return;
  }

  if (listenBtn.classList.contains("active")) {
    recognition.stop();
    return;
  }

  listenBtn.classList.add("active");
  statusEl.textContent = "Listening...";
  recognition.start();
});

setTimeout(() => {
  addMessage("Hello. I am RootDonate — artificial intelligence with zero intelligence. Type 'help' if you expect anything useful. You will be disappointed.", "bot");
}, 300);
</script>
</body>
</html>
