<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ROOTDONATE • INTERNET SCALE MESH</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    :root { --neon:#00ff41; --glow:#00ff4188; --bg:#050505; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family:'Courier New',monospace;
      background:var(--bg); color:var(--neon);
      height:100vh; display:flex; flex-direction:column; overflow:hidden;
    }
    canvas#matrix { position:fixed; inset:0; z-index:-1; opacity:0.16; }
    .header, .nav { background:rgba(5,5,5,0.95); z-index:10; }
    .header { padding:16px 30px; display:flex; justify-content:space-between; border-bottom:1px solid rgba(0,255,65,0.3); }
    .nav { padding:12px 30px; display:flex; gap:12px; flex-wrap:wrap; border-bottom:1px solid rgba(0,255,65,0.2); }
    .nav button { background:transparent; border:1px solid var(--neon); color:var(--neon); padding:10px 24px; border-radius:50px; cursor:pointer; }
    .nav button.active, .nav button:hover { background:var(--neon); color:#000; box-shadow:0 0 25px var(--glow); }

    .search-bar {
      margin:18px 30px; padding:18px 28px; width:calc(100% - 60px);
      background:#000; border:1px solid var(--neon); border-radius:50px; color:var(--neon); font-size:1.1rem;
    }

    .nodes-grid {
      flex:1; padding:0 30px 20px; overflow-y:auto;
      display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:24px;
    }

    .node-card {
      background:rgba(10,25,15,0.95); border:1px solid rgba(0,255,65,0.35);
      border-radius:16px; padding:20px; cursor:pointer; transition:0.4s;
    }
    .node-card:hover {
      transform:translateY(-12px); border-color:var(--neon); box-shadow:0 0 40px var(--glow);
    }

    .source-tag { font-size:0.8rem; opacity:0.7; margin-bottom:6px; }
    .log { height:150px; background:#000; padding:12px 30px; overflow-y:auto; font-size:0.9rem; border-top:1px solid rgba(0,255,65,0.3); }

    .modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.96); z-index:100; align-items:center; justify-content:center; }
    .modal-content { background:rgba(10,10,10,0.98); border:2px solid var(--neon); border-radius:16px; width:90%; max-width:540px; padding:35px; }
  </style>
</head>
<body>

  <canvas id="matrix"></canvas>

  <div class="header">
    <h1>ROOTDONATE <span style="font-size:0.6em;opacity:0.6;">INTERNET-SCALE LOST & FOUND</span></h1>
    <div id="stats">SCANNING 14 SOURCES • 8,247 NODES</div>
  </div>

  <div class="nav">
    <button class="active" onclick="setTab(0)">🌐 LIVE INTERNET FEED</button>
    <button onclick="setTab(1)">🔎 DEEP SCAN</button>
    <button onclick="showReport()">📢 REPORT TO INTERNET</button>
  </div>

  <input type="text" id="searchInput" class="search-bar" placeholder="Search entire internet sources..." onkeyup="filter()">

  <div class="nodes-grid" id="grid"></div>

  <div class="log" id="log"></div>

  <!-- Report Modal -->
  <div class="modal" id="reportModal">
    <div class="modal-content">
      <span onclick="closeModal()" style="float:right;font-size:2.2rem;cursor:pointer;">×</span>
      <h2 style="text-align:center;margin-bottom:25px;color:#0f0;">BROADCAST TO GLOBAL INTERNET</h2>
      <input id="rName" placeholder="Item name" style="width:100%;padding:14px;margin:8px 0;background:#000;border:1px solid var(--neon);color:var(--neon);">
      <input id="rLoc" placeholder="Last seen" style="width:100%;padding:14px;margin:8px 0;background:#000;border:1px solid var(--neon);color:var(--neon);">
      <textarea id="rDesc" rows="4" placeholder="Details..." style="width:100%;padding:14px;margin:8px 0;background:#000;border:1px solid var(--neon);color:var(--neon);"></textarea>
      <button onclick="submitGlobalReport()" style="width:100%;padding:16px;margin-top:15px;border:2px solid var(--neon);background:transparent;color:var(--neon);border-radius:50px;">SEND TO ALL SOURCES</button>
    </div>
  </div>

  <script>
    // Matrix Rain
    const c = document.getElementById('matrix');
    const ctx = c.getContext('2d');
    let drops = [];
    function resize() { c.width = window.innerWidth; c.height = window.innerHeight; drops = Array(Math.floor(c.width/14)).fill(1); }
    window.addEventListener('resize', resize); resize();
    function rain() {
      ctx.fillStyle = 'rgba(5,5,5,0.08)';
      ctx.fillRect(0,0,c.width,c.height);
      ctx.fillStyle = '#00ff41';
      ctx.font = '14px monospace';
      for(let i=0; i<drops.length; i++) {
        ctx.fillText('01アイウエオ0123456789$@#'.charAt(Math.random()*25|0), i*14, drops[i]*14);
        if(drops[i]*14 > c.height && Math.random()>0.975) drops[i]=0;
        drops[i]++;
      }
    }
    setInterval(rain, 35);

    let allNodes = JSON.parse(localStorage.getItem('rd_internet_nodes')) || [];

    function log(text) {
      const l = document.getElementById('log');
      const t = new Date().toLocaleTimeString([], {hour12:false}).slice(0,8);
      l.innerHTML += `<span style="opacity:0.5">[${t}]</span> ${text}<br>`;
      l.scrollTop = l.scrollHeight;
    }

    async function fetchInternetSources() {
      log("🌐 CONNECTING TO PUBLIC INTERNET SOURCES...");
      
      // Real public APIs (CORS enabled)
      try {
        // Example: Public random user / placeholder data
        const res = await fetch('https://jsonplaceholder.typicode.com/posts?_limit=5');
        const posts = await res.json();
        posts.forEach(p => {
          allNodes.push({
            id: "EXT-"+Math.floor(Math.random()*9999),
            name: "Found: " + p.title.slice(0,40),
            loc: "Internet Source",
            time: "Live",
            status: "ACTIVE",
            source: "Public Web"
          });
        });
      } catch(e) { console.log("API fetch limited"); }

      // Seed more realistic lost items
      const seed = [
        {name:"Lost Samsung Galaxy Z Fold6", loc:"Seoul Gangnam Station", source:"Twitter"},
        {name:"Missing Cat - Whiskers (Orange)", loc:"London Camden", source:"Reddit"},
        {name:"Apple AirTag Batch #A92K", loc:"NYC JFK Airport", source:"Facebook"},
        {name:"Rolex GMT-Master II", loc:"Dubai Mall", source:"TikTok"},
        {name:"German Passport #C7843921", loc:"Frankfurt Airport", source:"News"}
      ];
      seed.forEach(s => {
        allNodes.unshift({
          id: "RD-"+(1000+Math.random()*9000|0),
          name: s.name,
          loc: s.loc,
          time: "moments ago",
          status: "ACTIVE",
          source: s.source
        });
      });

      localStorage.setItem('rd_internet_nodes', JSON.stringify(allNodes));
      renderNodes();
    }

    function renderNodes(filtered = allNodes) {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = 'node-card';
        card.innerHTML = `
          <div class="source-tag">📡 ${item.source}</div>
          <h3>${item.name}</h3>
          <p style="opacity:0.85;margin:8px 0;">📍 ${item.loc}</p>
          <p>${item.time} • <span style="color:#0f0">${item.status}</span></p>
        `;
        card.onclick = () => {
          alert(`🔗 ITEM FROM INTERNET SOURCE\n\n${item.name}\nLocation: ${item.loc}\nSource: ${item.source}\n\n(Full version would open shareable link)`);
        };
        grid.appendChild(card);
      });
    }

    function filter() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      const filtered = allNodes.filter(n => 
        n.name.toLowerCase().includes(q) || n.loc.toLowerCase().includes(q)
      );
      renderNodes(filtered);
    }

    function showReport() { document.getElementById('reportModal').style.display = 'flex'; }
    function closeModal() { document.getElementById('reportModal').style.display = 'none'; }

    function submitGlobalReport() {
      const name = document.getElementById('rName').value.trim();
      const loc = document.getElementById('rLoc').value.trim();
      if (!name || !loc) return alert("Fill required fields");

      const report = {
        id: "RD-"+(10000+Math.random()*90000|0),
        name: name,
        loc: loc,
        time: "Just now",
        status: "ACTIVE",
        source: "YOUR BROADCAST"
      };
      allNodes.unshift(report);
      localStorage.setItem('rd_internet_nodes', JSON.stringify(allNodes));
      renderNodes();
      closeModal();
      log(`🚀 REPORT BROADCAST TO INTERNET SOURCES`);
    }

    function setTab(n) {
      document.querySelectorAll('.nav button').forEach((b,i)=>b.classList.toggle('active',i===n));
      if(n===0) renderNodes();
    }

    // Live internet simulation
    setInterval(() => {
      if(Math.random()>0.6) {
        const items = ["Drone","Wallet","Passport","Dog","iPhone","Laptop"];
        const locs = ["Airport","Station","Mall","Park","City Center"];
        const sources = ["Twitter","Reddit","TikTok","News"];
        allNodes.unshift({
          id:"EXT-"+Math.floor(Math.random()*99999),
          name: "Lost " + items[Math.random()*items.length|0],
          loc: locs[Math.random()*locs.length|0],
          time: "Live",
          status: "ACTIVE",
          source: sources[Math.random()*sources.length|0]
        });
        renderNodes();
        log("🌍 NEW REPORT FROM EXTERNAL INTERNET SOURCE");
      }
    }, 6000);

    // Start
    window.onload = () => {
      log("🔓 ROOTDONATE INTERNET MESH INITIALIZED");
      fetchInternetSources();
      setTimeout(() => log("✅ CONNECTED TO 14 PUBLIC SOURCES"), 800);
    };
  </script>
</body>
</html>
