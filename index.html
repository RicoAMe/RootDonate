<!DOCTYPE html>
<html lang="en" class="govuk-template">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>RootDonate Scanner</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/govuk-frontend@5.11.2/dist/govuk/govuk-frontend.min.css">
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
  <script src="https://js.puter.com/v2/"></script>
  <style>
    #app, #authScreen { max-width: 960px; margin: 0 auto; padding: 20px; }
    #log { min-height: 300px; max-height: 50vh; overflow-y: auto; border: 1px solid #b1b4b6; padding: 15px; background: #f3f2f1; margin: 20px 0; }
    .entry { margin-bottom: 15px; padding: 10px; background: #fff; border-left: 5px solid #1d70b8; }
    .entry.user { border-left-color: #00703c; background: #e8f5e9; }
    .entry.ai { border-left-color: #1d70b8; }
    .entry.priority { border-left-color: #d4351c; background: #fef7f7; }
    .entry.scanner { font-family: ui-monospace, Menlo, monospace; font-size: 0.9em; }
    .status-bar { display: flex; gap: 20px; margin: 15px 0; font-size: 16px; }
    .controls { display: flex; flex-wrap: wrap; gap: 10px; margin: 15px 0; align-items: flex-end; }
    .controls .govuk-button { margin-bottom: 0; }
    .input-bar { display: flex; gap: 10px; align-items: flex-end; margin-top: 15px; }
    #input { flex: 1; }
    .skip-link { position: absolute; top: -40px; left: 0; background: #0b0c0c; color: #fff; padding: 8px; z-index: 100; }
    .skip-link:focus { top: 0; }
  </style>
</head>
<body class="govuk-template__body">
  <a href="#log" class="skip-link govuk-skip-link">Skip to log</a>

  <div id="authScreen">
    <h1 class="govuk-heading-l">RootDonate Scanner</h1>
    <p class="govuk-body">Sign in to access the scanner</p>
    <div id="authError" class="govuk-error-message" role="alert" aria-live="assertive"></div>
    <button id="googleBtn" class="govuk-button" type="button" data-module="govuk-button">Continue with Google</button>
  </div>

  <div id="app" style="display:none;">
    <header class="govuk-header" role="banner">
      <div class="govuk-header__container govuk-width-container">
        <div class="govuk-header__logo">
          <span class="govuk-header__logotype-text">RootDonate</span>
        </div>
        <div class="govuk-header__content">
          <span id="userInfo" class="govuk-header__link"></span>
          <button id="signOutBtn" class="govuk-button govuk-button--secondary" type="button" style="margin-left:15px;">Sign out</button>
        </div>
      </div>
    </header>

    <div class="govuk-width-container">
      <main id="log" role="log" aria-live="polite" aria-relevant="additions" aria-label="Scanner log" class="govuk-body"></main>

      <div class="status-bar" aria-live="polite" aria-atomic="true">
        <span>Wanted: <strong id="wanted" class="govuk-tag govuk-tag--red">0</strong></span>
        <span id="units">Units: 12</span>
        <span id="aiStatus" class="govuk-tag">AI Ready</span>
      </div>

      <div class="controls">
        <button id="scanBtn" class="govuk-button" type="button" data-module="govuk-button">Scan</button>
        <button id="priorityBtn" class="govuk-button govuk-button--warning" type="button" data-module="govuk-button">Priority</button>
        <div class="govuk-form-group" style="margin-bottom:0; flex:1; min-width:200px;">
          <label class="govuk-label" for="plate">Plate lookup</label>
          <input class="govuk-input" id="plate" type="text" placeholder="Plate lookup…" maxlength="8" autocomplete="off" autocapitalize="characters">
        </div>
        <button id="lookupBtn" class="govuk-button govuk-button--secondary" type="button" data-module="govuk-button">Lookup</button>
        <button id="clearBtn" class="govuk-button govuk-button--warning" type="button" data-module="govuk-button">Clear Log</button>
      </div>

      <div class="input-bar">
        <div class="govuk-form-group" style="margin-bottom:0; flex:1;">
          <label class="govuk-label" for="input">Ask the AI anything</label>
          <textarea class="govuk-textarea" id="input" rows="2" placeholder="Ask the AI anything..."></textarea>
        </div>
        <button id="send" class="govuk-button" type="button" data-module="govuk-button" aria-label="Send message">Send</button>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBvcCBsPiMxS7G2evPjM7sANp-zSy_RkKM",
      authDomain: "rootdonate-61e61.firebaseapp.com",
      databaseURL: "https://rootdonate-61e61-default-rtdb.firebaseio.com",
      projectId: "rootdonate-61e61",
      storageBucket: "rootdonate-61e61.firebasestorage.app",
      messagingSenderId: "754240963907",
      appId: "1:754240963907:web:5417c2763d8f02108bdbf6",
      measurementId: "G-0SC5R5ELT1"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();
    auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);

    const authScreen = document.getElementById("authScreen");
    const app = document.getElementById("app");
    const authError = document.getElementById("authError");
    const googleBtn = document.getElementById("googleBtn");
    const signOutBtn = document.getElementById("signOutBtn");
    const userInfo = document.getElementById("userInfo");
    const log = document.getElementById("log");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const statusEl = document.getElementById("status");
    const aiStatus = document.getElementById("aiStatus");
    const wantedEl = document.getElementById("wanted");
    const unitsEl = document.getElementById("units");
    const plateInput = document.getElementById("plate");
    const clearBtn = document.getElementById("clearBtn");

    let wanted = 0;
    let isAI = false;
    let currentUser = null;
    let logEntries = [];
    let chatHistory = [];

    function showError(msg) {
      authError.textContent = msg || "";
    }

    googleBtn.onclick = async () => {
      showError("");
      const provider = new firebase.auth.GoogleAuthProvider();
      try {
        await auth.signInWithPopup(provider);
      } catch (err) {
        showError(err.message || "Google sign-in failed");
      }
    };

    signOutBtn.onclick = () => auth.signOut();

    async function loadFromCloud(uid) {
      try {
        const snap = await db.ref(`users/${uid}/data`).once("value");
        const data = snap.val();
        if (data) {
          wanted = data.wanted || 0;
          wantedEl.textContent = wanted;
          if (Array.isArray(data.log)) {
            logEntries = data.log;
            log.innerHTML = "";
            data.log.forEach(e => addEntry(e.text, e.type, false));
          }
          if (Array.isArray(data.chatHistory)) {
            chatHistory = data.chatHistory.slice(-8);
          }
        }
      } catch (e) {
        console.warn("Cloud load failed", e);
      }
    }

    async function saveToCloud() {
      if (!currentUser) return;
      try {
        await db.ref(`users/${currentUser.uid}/data`).set({
          wanted,
          log: logEntries.slice(-100),
          chatHistory: chatHistory.slice(-10),
          updated: Date.now()
        });
      } catch (e) {
        console.warn("Cloud save failed", e);
      }
    }

    auth.onAuthStateChanged(async user => {
      if (user) {
        currentUser = user;
        authScreen.style.display = "none";
        app.style.display = "block";
        userInfo.textContent = `👤 ${user.displayName || user.email || "User"}`;
        await loadFromCloud(user.uid);
        if (log.children.length === 0) {
          addEntry("RootDonate Scanner online. Cloud storage active.", "scanner");
          addEntry("Signed in. Gemini AI ready — generate scanner traffic or ask anything about Leonida.", "ai");
        }
      } else {
        currentUser = null;
        authScreen.style.display = "block";
        app.style.display = "none";
        userInfo.textContent = "";
        log.innerHTML = "";
        logEntries = [];
        chatHistory = [];
        wanted = 0;
        wantedEl.textContent = "0";
        showError("");
      }
    });

    const plates = {
      "VC1234": "Stolen — Black Dominator, linked to recent heist",
      "LEON01": "Registered to local resident — no flags",
      "GTA666": "Wanted — multiple felonies, approach with caution",
      "VCPD1": "Police vehicle — do not stop",
      "AMBRO": "Rental — last seen near Ambrosia resort"
    };

    function addEntry(text, type = "scanner", shouldSave = true) {
      const div = document.createElement("div");
      div.className = `entry ${type}`;
      div.textContent = text;
      if (type === "priority") {
        div.setAttribute("role", "alert");
      }
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
      logEntries.push({ text, type, ts: Date.now() });
      if (logEntries.length > 120) logEntries.shift();
      if (shouldSave) saveToCloud();
    }

    async function generateScanner(type = "scanner") {
      if (isAI || !currentUser) return;
      isAI = true;
      aiStatus.textContent = "Generating…";
      statusEl.textContent = type === "priority" ? "Priority traffic…" : "Scanning…";

      const prompt = type === "priority"
        ? "Generate one short realistic VCPD priority radio dispatch message (1-2 sentences max) for Leonida/Vice City. Make it urgent (shots fired, officer down, robbery in progress, etc). Cynical tone. No extra commentary."
        : "Generate one short realistic VCPD radio scanner message (1-2 sentences max) for Leonida/Vice City. Routine traffic, BOLO, pursuit, traffic stop, etc. Cynical dispatcher style. No extra commentary.";

      const system = `You are a sharp, slightly cynical VCPD dispatcher AI. Know GTA VI / Leonida / Vice City lore. Stay in character. Output ONLY the radio message, nothing else.`;

      let attempt = 0;
      const maxAttempts = 3;
      let success = false;

      while (attempt < maxAttempts && !success) {
        attempt++;
        try {
          const response = await puter.ai.chat(`${system}\n\n${prompt}`, {
            model: "gemini-3.8-flash"
          });

          let text = (response?.message?.content || response?.text || String(response || "")).trim();
          if (!text || text.length < 2) throw new Error("Empty response");

          text = text.replace(/^["']|["']$/g, "").replace(/^Assistant:\s*/i, "").replace(/^AI:\s*/i, "").trim();

          addEntry(text, type);
          if (type === "priority") {
            wanted = Math.min(5, wanted + 1);
            wantedEl.textContent = wanted;
          }
          success = true;
          aiStatus.textContent = "AI Ready";
        } catch (e) {
          console.warn(`AI attempt ${attempt} failed:`, e);
          if (attempt === maxAttempts) {
            addEntry("Radio traffic unavailable. Try again.", type);
            aiStatus.textContent = "AI Offline";
          } else {
            aiStatus.textContent = `Retry ${attempt}…`;
            await new Promise(r => setTimeout(r, 1000 * attempt));
          }
        }
      }

      isAI = false;
      statusEl.textContent = "Channel 1 • Leonida Metro • Cloud Sync";
      saveToCloud();
    }

    async function askAI(question) {
      if (isAI || !currentUser) return;
      isAI = true;
      sendBtn.disabled = true;
      aiStatus.textContent = "AI thinking…";
      addEntry(question, "user");

      const system = `You are a sharp, slightly cynical VCPD dispatcher AI integrated into the RootDonate scanner.
You know GTA VI / Leonida / Vice City lore, radio codes, vehicle models, and street life.
Be concise, useful, and stay in character when it fits. Never give real-world illegal advice.
Current time: ${new Date().toLocaleString()}`;

      let attempt = 0;
      const maxAttempts = 3;
      let success = false;

      while (attempt < maxAttempts && !success) {
        attempt++;
        try {
          const response = await puter.ai.chat(`${system}\n\nUser: ${question}`, {
            model: "gemini-3.8-flash"
          });

          let text = (response?.message?.content || response?.text || String(response || "")).trim();
          if (!text || text.length < 2) throw new Error("Empty response");

          text = text.replace(/^Assistant:\s*/i, "").replace(/^AI:\s*/i, "").trim();

          addEntry(text, "ai");
          chatHistory.push({ role: "user", content: question }, { role: "assistant", content: text });
          if (chatHistory.length > 12) chatHistory = chatHistory.slice(-12);
          aiStatus.textContent = "AI Ready";
          success = true;
        } catch (e) {
          console.warn(`AI attempt ${attempt} failed:`, e);
          if (attempt === maxAttempts) {
            addEntry("AI radio is down right now. Try again in a minute.", "ai");
            aiStatus.textContent = "AI Offline";
          } else {
            aiStatus.textContent = `AI retry ${attempt}…`;
            await new Promise(r => setTimeout(r, 1200 * attempt));
          }
        }
      }

      isAI = false;
      sendBtn.disabled = false;
      input.focus();
      saveToCloud();
    }

    function send() {
      const text = input.value.trim();
      if (!text || isAI || !currentUser) return;
      input.value = "";
      input.style.height = "auto";
      askAI(text);
    }

    sendBtn.onclick = send;
    input.onkeydown = e => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    };
    input.oninput = () => {
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 120) + "px";
    };

    document.getElementById("scanBtn").onclick = () => generateScanner("scanner");
    document.getElementById("priorityBtn").onclick = () => generateScanner("priority");

    document.getElementById("lookupBtn").onclick = () => {
      if (!currentUser) return;
      const p = plateInput.value.trim().toUpperCase();
      if (!p) return;
      const result = plates[p] || "No records found";
      addEntry(`Plate ${p}: ${result}`, "scanner");
      plateInput.value = "";
    };

    clearBtn.onclick = async () => {
      if (!currentUser || !confirm("Clear the entire log and cloud data? This cannot be undone.")) return;

      log.innerHTML = "";
      logEntries = [];
      chatHistory = [];
      wanted = 0;
      wantedEl.textContent = "0";

      try {
        await db.ref(`users/${currentUser.uid}/data`).remove();
      } catch (e) {
        console.warn("Cloud clear failed", e);
      }

      addEntry("Log and cloud data cleared.", "ai", false);
    };

    setInterval(() => {
      if (currentUser) {
        unitsEl.textContent = `Units: ${8 + Math.floor(Math.random() * 10)}`;
      }
    }, 5000);
  </script>

  <script type="module">
    import { initAll } from 'https://cdn.jsdelivr.net/npm/govuk-frontend@5.11.2/dist/govuk/govuk-frontend.min.js';
    initAll();
  </script>
</body>
</html>
