<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Root Donate</title>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #00ff9d;
      --accent: #ff00aa;
      --bg: #0a0a0f;
      --card: #111118;
      --border: #222226;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: #e0e0e0;
      min-height: 100dvh;
      padding: 20px 12px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .container {
      max-width: 420px;
      width: 100%;
      background: var(--card);
      border-radius: 28px;
      border: 1px solid var(--border);
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0, 255, 157, 0.1);
      margin-top: 20px;
    }

    .header {
      background: linear-gradient(135deg, #00ff9d 0%, #ff00aa 100%);
      color: #000;
      padding: 28px 24px 24px;
      text-align: center;
      position: relative;
    }

    .header h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.9rem;
      font-weight: 700;
      letter-spacing: -1px;
    }

    .profile-name {
      font-size: 1.25rem;
      font-weight: 700;
      margin-top: 8px;
    }

    .header-actions {
      position: absolute;
      top: 14px;
      right: 14px;
      display: flex;
      gap: 8px;
    }

    .header-btn {
      background: rgba(0,0,0,0.18);
      border: none;
      color: #000;
      font-size: 12px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 999px;
      cursor: pointer;
    }

    .content { padding: 24px; }

    /* Auth */
    .auth-form {
      display: none;
      flex-direction: column;
      gap: 12px;
    }
    .auth-form.active { display: flex; }

    .auth-form input {
      width: 100%;
      padding: 14px 16px;
      border-radius: 12px;
      border: 1px solid #333;
      background: #1a1a22;
      color: white;
      font-size: 1rem;
      outline: none;
    }
    .auth-form input:focus { border-color: var(--primary); }

    .auth-toggle {
      text-align: center;
      margin-top: 6px;
      font-size: 0.9rem;
      color: #aaa;
    }
    .auth-toggle span {
      color: var(--primary);
      cursor: pointer;
      font-weight: 600;
    }

    /* Card */
    .debit-card {
      width: 100%;
      height: 210px;
      background: linear-gradient(145deg, #1c1c1c, #0d0d0d);
      border-radius: 16px;
      position: relative;
      color: white;
      margin-bottom: 24px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.5);
      overflow: hidden;
    }
    .debit-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(105deg, transparent 40%, rgba(255,255,255,0.04) 50%, transparent 60%);
    }
    .chip {
      position: absolute;
      top: 24px; left: 24px;
      width: 44px; height: 34px;
      background: linear-gradient(135deg, #c9a227, #e8d48b);
      border-radius: 5px;
    }
    .card-logo {
      position: absolute;
      top: 22px; right: 24px;
      font-size: 20px; font-weight: 700;
    }
    .card-number {
      position: absolute;
      top: 95px; left: 24px;
      font-size: 19px; letter-spacing: 3px;
    }
    .card-handle {
      position: absolute;
      bottom: 52px; left: 24px;
      font-size: 15px; font-weight: 600;
    }
    .card-bottom {
      position: absolute;
      bottom: 20px; left: 24px; right: 24px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      font-size: 12px; opacity: 0.85;
    }
    .visa {
      font-size: 24px; font-weight: 800; font-style: italic;
    }

    .total {
      text-align: center;
      margin-bottom: 16px;
      font-size: 1.1rem;
      color: #aaa;
    }
    .total span {
      color: var(--primary);
      font-weight: 700;
      font-size: 1.4rem;
    }

    .amount-btns {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin: 16px 0 24px;
    }
    .amount-btns button {
      background: #1f1f26;
      border: 1px solid #333;
      color: white;
      border-radius: 12px;
      padding: 14px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: 0.2s;
    }
    .amount-btns button.active {
      background: var(--primary);
      color: #000;
    }

    .btn {
      width: 100%;
      padding: 17px;
      border: none;
      border-radius: 14px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
      transition: 0.2s;
    }
    .btn:active { transform: scale(0.98); }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }

    .donate-btn { background: var(--primary); color: #000; }
    .share-btn {
      background: #1f1f26;
      color: white;
      border: 1px solid #333;
      margin-top: 14px;
    }

    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: #111;
      color: var(--primary);
      padding: 14px 28px;
      border-radius: 999px;
      font-weight: 700;
      display: none;
      z-index: 999;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      max-width: 90%;
      text-align: center;
    }

    .main-ui { display: none; }
    .main-ui.active { display: block; }

    .loading-text {
      text-align: center;
      padding: 50px 20px;
      color: #888;
    }

    .own-badge {
      display: none;
      text-align: center;
      font-size: 0.85rem;
      color: var(--primary);
      margin-bottom: 12px;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Root Donate</h1>
      <div class="profile-name" id="profileName">Loading...</div>
      <div class="header-actions">
        <button class="header-btn" id="myProfileBtn" style="display:none;">My Profile</button>
        <button class="header-btn" id="logoutBtn" style="display:none;">Logout</button>
        <button class="header-btn" id="loginHeaderBtn" style="display:none;">Login</button>
      </div>
    </div>

    <div class="content">
      <!-- AUTH -->
      <div class="auth-form" id="loginForm">
        <input type="email" id="loginEmail" placeholder="Email" autocomplete="email">
        <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password">
        <button class="btn donate-btn" id="loginBtn">Log In</button>
        <div class="auth-toggle">
          Don't have an account? <span id="showSignup">Sign Up</span>
        </div>
      </div>

      <div class="auth-form" id="signupForm">
        <input type="text" id="signupName" placeholder="Display Name">
        <input type="text" id="signupHandle" placeholder="Handle (e.g. john)">
        <input type="email" id="signupEmail" placeholder="Email" autocomplete="email">
        <input type="password" id="signupPassword" placeholder="Password (min 6 chars)" autocomplete="new-password">
        <button class="btn donate-btn" id="signupBtn">Create Account</button>
        <div class="auth-toggle">
          Already have an account? <span id="showLogin">Log In</span>
        </div>
      </div>

      <!-- MAIN PROFILE + DONATE UI -->
      <div class="main-ui" id="mainUI">
        <div class="own-badge" id="ownBadge">This is your profile</div>

        <div class="debit-card">
          <div class="chip"></div>
          <div class="card-logo">𝕏 Money</div>
          <div class="card-number" id="cardNumber">•••• •••• •••• ----</div>
          <div class="card-handle" id="cardHandle">@handle</div>
          <div class="card-bottom">
            <div>
              <div style="font-size:10px; opacity:0.7;">VALID THRU</div>
              <div>09/29</div>
            </div>
            <div class="visa">VISA</div>
          </div>
        </div>

        <div class="total">
          Total Raised: <span id="totalRaised">$0</span>
        </div>

        <div class="amount-btns" id="amountGrid">
          <button type="button" data-amount="5" class="active">$5</button>
          <button type="button" data-amount="10">$10</button>
          <button type="button" data-amount="25">$25</button>
        </div>

        <button class="btn donate-btn" id="donateBtn" type="button">
          Donate $<span id="amountDisplay">5</span>
        </button>

        <button class="btn share-btn" id="shareBtn" type="button" style="display:none;">
          🔗 Share My Profile Link
        </button>
      </div>

      <div class="loading-text" id="loadingText">Loading...</div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // ========== FIREBASE CONFIG ==========
    const firebaseConfig = {
      apiKey: "AIzaSyBvcCBsPiMxS7G2evPjM7sANp-zSy_RkKM",
      authDomain: "rootdonate-61e61.firebaseapp.com",
      databaseURL: "https://rootdonate-61e61-default-rtdb.firebaseio.com",
      projectId: "rootdonate-61e61",
      storageBucket: "rootdonate-61e61.firebasestorage.app",
      messagingSenderId: "754240963907",
      appId: "1:754240963907:web:5417c2763d8f02108bdbf6",
      measurementId: "G-0SC5R5ELT1"
    };

    // ========== STRIPE CLOUD FUNCTION ==========
    // Must return { url: "https://checkout.stripe.com/..." }
    const CREATE_CHECKOUT_URL = "https://YOUR_CLOUD_FUNCTION_URL_HERE";

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // State
    let currentAmount = 5;
    let currentUser = null;          // logged-in user
    let viewingUserId = null;        // whose profile we are looking at
    let profile = {};                // the profile currently shown
    let isOwnProfile = false;

    // ========== HELPERS ==========
    function showToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.style.display = "block";
      setTimeout(() => t.style.display = "none", 4000);
    }

    function showAuth(mode = "login") {
      document.getElementById("loadingText").style.display = "none";
      document.getElementById("mainUI").classList.remove("active");
      document.getElementById("loginForm").classList.toggle("active", mode === "login");
      document.getElementById("signupForm").classList.toggle("active", mode === "signup");
      document.getElementById("profileName").textContent = mode === "login" ? "Welcome back" : "Create Account";
      updateHeaderButtons(false);
    }

    function showMainUI() {
      document.getElementById("loadingText").style.display = "none";
      document.getElementById("loginForm").classList.remove("active");
      document.getElementById("signupForm").classList.remove("active");
      document.getElementById("mainUI").classList.add("active");
    }

    function updateHeaderButtons(loggedIn) {
      document.getElementById("logoutBtn").style.display = loggedIn ? "block" : "none";
      document.getElementById("loginHeaderBtn").style.display = loggedIn ? "none" : "block";
      document.getElementById("myProfileBtn").style.display = loggedIn && !isOwnProfile ? "block" : "none";
    }

    function updateCardUI() {
      document.getElementById("profileName").textContent = profile.name || profile.handle || "User";
      document.getElementById("cardHandle").textContent = profile.handle || "@user";
      document.getElementById("cardNumber").textContent = `•••• •••• •••• ${profile.last4 || "0000"}`;
      document.getElementById("totalRaised").textContent = "$" + (profile.totalRaised || 0);

      document.getElementById("ownBadge").style.display = isOwnProfile ? "block" : "none";
      document.getElementById("shareBtn").style.display = isOwnProfile ? "block" : "none";
    }

    function setAmount(amount, btn) {
      currentAmount = amount;
      document.getElementById("amountDisplay").textContent = amount;
      document.querySelectorAll("#amountGrid button").forEach(b => b.classList.remove("active"));
      if (btn) btn.classList.add("active");
    }

    // ========== LOAD ANY PROFILE BY UID ==========
    async function loadProfile(uid) {
      if (!uid) return;

      viewingUserId = uid;
      document.getElementById("loadingText").style.display = "block";
      document.getElementById("loadingText").textContent = "Loading profile...";
      document.getElementById("mainUI").classList.remove("active");

      try {
        const doc = await db.collection("users").doc(uid).get();

        if (!doc.exists) {
          showToast("Profile not found");
          document.getElementById("loadingText").textContent = "Profile not found";
          return;
        }

        profile = doc.data();
        isOwnProfile = currentUser && currentUser.uid === uid;

        updateCardUI();
        showMainUI();
        updateHeaderButtons(!!currentUser);

        // Handle Stripe success return
        const params = new URLSearchParams(window.location.search);
        if (params.get("success") === "true") {
          showToast("✅ Donation successful! Thank you!");
          // refresh total
          const fresh = await db.collection("users").doc(uid).get();
          if (fresh.exists) {
            profile = fresh.data();
            updateCardUI();
          }
          // clean URL but keep the u= param
          const clean = new URL(window.location);
          clean.searchParams.delete("success");
          window.history.replaceState({}, "", clean);
        }
      } catch (err) {
        console.error(err);
        showToast("Failed to load profile");
        document.getElementById("loadingText").textContent = "Error loading profile";
      }
    }

    // ========== AUTH ==========
    async function handleLogin() {
      const email = document.getElementById("loginEmail").value.trim();
      const password = document.getElementById("loginPassword").value;
      if (!email || !password) return showToast("Enter email and password");

      const btn = document.getElementById("loginBtn");
      btn.disabled = true;
      btn.textContent = "Logging in...";

      try {
        await auth.signInWithEmailAndPassword(email, password);
        showToast("✅ Logged in!");
      } catch (err) {
        showToast(err.message || "Login failed");
        btn.disabled = false;
        btn.textContent = "Log In";
      }
    }

    async function handleSignup() {
      const name = document.getElementById("signupName").value.trim();
      let handle = document.getElementById("signupHandle").value.trim();
      const email = document.getElementById("signupEmail").value.trim();
      const password = document.getElementById("signupPassword").value;

      if (!name || !handle || !email || !password) return showToast("Fill all fields");
      if (password.length < 6) return showToast("Password must be at least 6 characters");

      if (!handle.startsWith("@")) handle = "@" + handle;
      handle = handle.toLowerCase().replace(/[^a-z0-9@_]/g, "");

      const btn = document.getElementById("signupBtn");
      btn.disabled = true;
      btn.textContent = "Creating...";

      try {
        const cred = await auth.createUserWithEmailAndPassword(email, password);
        const last4 = Math.floor(1000 + Math.random() * 9000).toString();

        await db.collection("users").doc(cred.user.uid).set({
          name,
          handle,
          last4,
          totalRaised: 0,
          email,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        showToast("✅ Account created!");
      } catch (err) {
        showToast(err.message || "Sign up failed");
        btn.disabled = false;
        btn.textContent = "Create Account";
      }
    }

    async function handleLogout() {
      await auth.signOut();
      showToast("Logged out");
    }

    // ========== DONATE TO THE CURRENTLY VIEWED PROFILE ==========
    async function startDonation() {
      if (!viewingUserId || !profile.handle) {
        return showToast("Profile not loaded yet");
      }

      if (CREATE_CHECKOUT_URL.includes("YOUR_CLOUD_FUNCTION")) {
        return showToast("⚠️ Backend not set. Replace CREATE_CHECKOUT_URL first.");
      }

      const btn = document.getElementById("donateBtn");
      btn.disabled = true;
      btn.textContent = "Redirecting to secure payment...";

      try {
        const response = await fetch(CREATE_CHECKOUT_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            amount: currentAmount * 100,          // cents
            recipientUserId: viewingUserId,       // who receives the money
            recipientHandle: profile.handle,
            donorUserId: currentUser ? currentUser.uid : null
          })
        });

        if (!response.ok) throw new Error(`Server error ${response.status}`);

        const data = await response.json();
        if (data.url) {
          window.location.href = data.url;
        } else {
          throw new Error(data.error || "No checkout URL");
        }
      } catch (err) {
        console.error(err);
        showToast("Payment failed: " + (err.message || "Unknown error"));
        btn.disabled = false;
        btn.innerHTML = `Donate $<span id="amountDisplay">${currentAmount}</span>`;
      }
    }

    // ========== SHARE ==========
    function shareProfile() {
      if (!currentUser) return showToast("You must be logged in");

      const shareLink = `${window.location.origin}${window.location.pathname}?u=${currentUser.uid}`;

      if (navigator.clipboard?.writeText) {
        navigator.clipboard.writeText(shareLink)
          .then(() => showToast("✅ Profile link copied!"))
          .catch(() => prompt("Copy this link:", shareLink));
      } else {
        prompt("Copy this link:", shareLink);
      }
    }

    // ========== ROUTING ==========
    function getUserIdFromURL() {
      const params = new URLSearchParams(window.location.search);
      return params.get("u");
    }

    // ========== EVENTS ==========
    document.getElementById("loginBtn").addEventListener("click", handleLogin);
    document.getElementById("signupBtn").addEventListener("click", handleSignup);
    document.getElementById("logoutBtn").addEventListener("click", handleLogout);
    document.getElementById("loginHeaderBtn").addEventListener("click", () => showAuth("login"));
    document.getElementById("myProfileBtn").addEventListener("click", () => {
      if (currentUser) {
        window.history.replaceState({}, "", `?u=${currentUser.uid}`);
        loadProfile(currentUser.uid);
      }
    });

    document.getElementById("showSignup").addEventListener("click", () => showAuth("signup"));
    document.getElementById("showLogin").addEventListener("click", () => showAuth("login"));

    document.getElementById("amountGrid").addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-amount]");
      if (btn) setAmount(Number(btn.dataset.amount), btn);
    });

    document.getElementById("donateBtn").addEventListener("click", startDonation);
    document.getElementById("shareBtn").addEventListener("click", shareProfile);

    document.getElementById("loginPassword").addEventListener("keypress", e => {
      if (e.key === "Enter") handleLogin();
    });
    document.getElementById("signupPassword").addEventListener("keypress", e => {
      if (e.key === "Enter") handleSignup();
    });

    // ========== AUTH STATE + INITIAL LOAD ==========
    auth.onAuthStateChanged(async (user) => {
      currentUser = user;

      const urlUserId = getUserIdFromURL();

      if (urlUserId) {
        // Someone opened a shared profile link → show that profile
        await loadProfile(urlUserId);
      } else if (user) {
        // Logged in + no ?u= → show own profile
        window.history.replaceState({}, "", `?u=${user.uid}`);
        await loadProfile(user.uid);
      } else {
        // Not logged in + no profile in URL → show login
        showAuth("login");
      }
    });
  </script>
</body>
</html>
