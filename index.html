<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <title>RootDonate</title>
  <script type="text/javascript" src="https://appleid.cdn-apple.com/appleauth/static/jsapi/appleid/1/en_US/appleid.auth.js"></script>
  <style>
    :root {
      --bg: #0b1220;
      --surface: rgba(21, 30, 46, 0.72);
      --surface-2: #1e293b;
      --accent: #22c55e;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --bot: rgba(30, 41, 59, 0.85);
      --border: rgba(51, 65, 85, 0.6);
      --radius: 20px;
      --red: #ef4444;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; height: 100%; background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      display: flex; flex-direction: column; height: 100dvh;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }
    header {
      background: var(--surface); padding: 14px 18px; display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid var(--border); backdrop-filter: blur(16px); flex-shrink: 0;
    }
    header strong { font-size: 1.15rem; color: var(--accent); }
    .header-actions { display: flex; gap: 8px; align-items: center; }
    #appleid-signin { width: 140px; height: 40px; }
    button {
      background: rgba(71,85,105,0.7); color: #fff; border: none; padding: 8px 14px;
      border-radius: 12px; font-weight: 600; cursor: pointer; min-height: 40px;
    }
    #log { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .entry { padding: 12px 16px; border-radius: var(--radius); background: var(--bot); border: 1px solid var(--border); white-space: pre-wrap; }
    .entry.scanner { border-left: 4px solid var(--accent); font-family: ui-monospace, Menlo, monospace; }
    .entry.user { align-self: flex-end; background: linear-gradient(135deg, var(--accent), #16a34a); color: #000; max-width: 80%; }
    .entry.ai { border-left: 4px solid #627eea; }
    .entry.priority { border-left: 4px solid var(--red); }
    .controls, .input-bar, .status-bar {
      padding: 10px 14px; background: var(--surface); border-top: 1px solid var(--border); flex-shrink: 0;
    }
    .controls { display: flex; gap: 8px; flex-wrap: wrap; }
    .controls button { flex: 1; min-width: 90px; }
    #plate { flex: 2; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); }
    .input-bar { display: flex; gap: 10px; align-items: flex-end; }
    #input {
      flex: 1; padding: 12px 16px; border-radius: 24px; background: var(--surface-2);
      color: var(--text); border: 1px solid transparent; resize: none; min-height: 48px; max-height: 120px;
    }
    #send { background: var(--accent); color: #000; width: 48px; height: 48px; border-radius: 50%; font-size: 1.3rem; }
    .status-bar { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--muted); }
    .wanted { color: var(--red); font-weight: bold; }
    #userInfo { font-size: 0.85rem; color: var(--accent); }
  </style>
</head>
<body>
  <header>
    <div>
      <strong>RootDonate<span style="font-size:0.65rem; background:#627eea; padding:2px 7px; border-radius:999px;">v3.1.9</span></strong>
      <small id="status">Channel 1 • Leonida Metro • AI Online</small>
    </div>
    <div class="header-actions">
      <span id="userInfo"></span>
      <div id="appleid-signin" data-color="black" data-border="true" data-type="sign in" data-border-radius="12"></div>
    </div>
  </header>

  <div id="log"></div>

  <div class="status-bar">
    <span>Wanted: <span id="wanted" class="wanted">0</span></span>
    <span id="units">Units: 12</span>
    <span id="aiStatus">AI Ready</span>
  </div>

  <div class="controls">
    <button id="scanBtn">Scan</button>
    <button id="priorityBtn">Priority</button>
    <input type="text" id="plate" placeholder="Plate lookup…" maxlength="8" autocomplete="off" autocapitalize="characters">
    <button id="lookupBtn">Lookup</button>
  </div>

  <div class="input-bar">
    <textarea id="input" placeholder="Ask the AI anything..." rows="1"></textarea>
    <button id="send">↑</button>
  </div>

  <script>
    const log = document.getElementById("log");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const statusEl = document.getElementById("status");
    const aiStatus = document.getElementById("aiStatus");
    const wantedEl = document.getElementById("wanted");
    const unitsEl = document.getElementById("units");
    const plateInput = document.getElementById("plate");
    const userInfo = document.getElementById("userInfo");

    let muted = false;
    let wanted = 0;
    let isAI = false;
    let currentUser = null;

    // ====== Apple Sign In Setup (popup mode) ======
    AppleID.auth.init({
      clientId: "uk.co.donateroot.www",
      scope: "name email",
      redirectURI: "https://www.rootdonate.co.uk",
      state: "vcpd-state",
      usePopup: true
    });

    document.addEventListener("AppleIDSignInOnSuccess", (event) => {
      const data = event.detail.data || event.detail;
      currentUser = {
        name: data.user?.name?.firstName || "Apple User",
        email: data.user?.email || "private relay"
      };
      updateUserUI();
      addEntry(`Signed in with Apple as ${currentUser.name}`, "scanner");
    });

    document.addEventListener("AppleIDSignInOnFailure", (event) => {
      const err = event.detail?.error || event.detail || "Unknown error";
      addEntry(`Apple Sign-In failed: ${err}`, "priority");
      console.error("Apple Sign-In error:", event.
