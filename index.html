<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pure Shared Memory AI</title>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, getDocs, limit, where, writeBatch } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBvcCBsPiMxS7G2evPjM7sANp-zSy_RkKM",
  authDomain: "rootdonate-61e61.firebaseapp.com",
  projectId: "rootdonate-61e61",
  storageBucket: "rootdonate-61e61.firebasestorage.app",
  messagingSenderId: "754240963907",
  appId: "1:754240963907:web:5417c2763d8f02108bdbf6"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;
let memory = [];
let unsubShared = null;
let isReplying = false;

function normalize(t) { return (t || "").trim().toLowerCase(); }

function findExactResponse(input) {
  const clean = normalize(input);
  for (const pair of memory) {
    if (normalize(pair.input) === clean) return pair.response;
  }
  return null;
}

function listenSharedMemory() {
  if (unsubShared) unsubShared();
  const q = query(collection(db, "shared_memory"), orderBy("createdAt", "desc"), limit(1000));
  unsubShared = onSnapshot(q, snap => {
    memory = snap.docs.map(d => d.data()).reverse();
  });
}

async function saveSharedPair(input, response) {
  if (!currentUser) return;
  const q = query(collection(db, "shared_memory"), where("input", "==", input.trim()), limit(1));
  const snap = await getDocs(q);
  if (!snap.empty) return;

  await addDoc(collection(db, "shared_memory"), {
    input: input.trim(),
    response: response.trim(),
    uid: currentUser.uid,
    createdAt: Date.now()
  });
}

function addMessage(text, isUser) {
  const wrap = document.createElement("div");
  wrap.className = "msg-wrap " + (isUser ? "user" : "bot");
  const div = document.createElement("div");
  div.className = "msg";
  div.textContent = text;
  wrap.appendChild(div);
  document.getElementById("chat").appendChild(wrap);
  document.getElementById("chat").scrollTop = 999999;
}

async function reply(userText) {
  if (isReplying) return;
  isReplying = true;

  const response = findExactResponse(userText);

  if (response) {
    addMessage(response, false);
  } else {
    const unknown = "I don't know this yet. Teach me by answering, then I'll remember it for everyone.";
    addMessage(unknown, false);
    // You can manually teach it later, or remove this line if you want zero auto-save
  }

  isReplying = false;
}

onAuthStateChanged(auth, user => {
  if (user) {
    currentUser = user;
    document.getElementById("status").textContent = "Signed in · Shared memory only";
    document.getElementById("input").disabled = false;
    document.getElementById("send").disabled = false;
    listenSharedMemory();
  } else {
    currentUser = null;
    document.getElementById("status").textContent = "Not signed in";
    document.getElementById("input").disabled = true;
    document.getElementById("send").disabled = true;
  }
});

document.getElementById("signBtn").onclick = () => {
  if (currentUser) signOut(auth);
  else signInAnonymously(auth);
};

document.getElementById("send").onclick = () => {
  const input = document.getElementById("input");
  const text = input.value.trim();
  if (!text || !currentUser) return;
  input.value = "";
  addMessage(text, true);
  reply(text);
};

document.getElementById("input").onkeydown = e => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    document.getElementById("send").click();
  }
};
</script>
<style>
body { margin:0; background:#0b1120; color:#f1f5f9; font-family:system-ui; height:100dvh; display:flex; flex-direction:column; }
header { background:#1e293b; padding:12px 16px; display:flex; justify-content:space-between; align-items:center; }
#chat { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:12px; }
.msg-wrap { max-width:80%; }
.user { align-self:flex-end; }
.bot { align-self:flex-start; }
.msg { padding:12px 16px; border-radius:16px; white-space:pre-wrap; }
.user .msg { background:#22c55e; color:#000; }
.bot .msg { background:#1e293b; }
.input-bar { display:flex; gap:8px; padding:12px; background:#1e293b; }
#input { flex:1; padding:12px; border:none; border-radius:22px; background:#334155; color:white; }
#send, #signBtn { border:none; background:#22c55e; color:#000; padding:0 16px; border-radius:10px; font-weight:600; cursor:pointer; }
</style>
</head>
<body>
<header>
  <div>
    <strong>Pure Shared Memory AI</strong><br>
    <small id="status">Not signed in</small>
  </div>
  <button id="signBtn">Sign in</button>
</header>
<div id="chat"></div>
<div class="input-bar">
  <textarea id="input" placeholder="Ask something already in shared memory…" rows="1" disabled></textarea>
  <button id="send" disabled>↑</button>
</div>
</body>
</html>
