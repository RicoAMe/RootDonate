<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>City Builder · AI NPCs Prototype</title>
<style>
  :root {
    --bg: #0b0f14;
    --panel: #151c25;
    --line: #2a3542;
    --text: #e8eef6;
    --muted: #8a9bb0;
    --accent: #6eb5e8;
    --you: #1e2a3a;
    --bot: #141c26;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, sans-serif;
    background: #0b0f14;
    color: var(--text);
    display: grid;
    grid-template-columns: 280px 1fr 320px;
    height: 100vh;
  }
  header {
    grid-column: 1 / -1;
    padding: 12px 16px;
    border-bottom: 1px solid var(--line);
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #0f141b;
  }
  .panel {
    border-right: 1px solid var(--line);
    padding: 16px;
    overflow-y: auto;
  }
  .panel:last-child { border-right: none; border-left: 1px solid var(--line); }
  h2 { margin: 0 0 12px; font-size: 15px; color: var(--accent); }
  .stat { display: flex; justify-content: space-between; margin: 6px 0; font-size: 14px; }
  .npc {
    padding: 10px 12px;
    margin: 6px 0;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 10px;
    cursor: pointer;
  }
  .npc.active { border-color: var(--accent); background: #1a2838; }
  .npc .role { color: var(--muted); font-size: 12px; }
  #log {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .msg {
    max-width: 85%;
    padding: 10px 14px;
    border-radius: 14px;
    line-height: 1.45;
    white-space: pre-wrap;
  }
  .you { align-self: flex-end; background: var(--you); }
  .npc-msg { align-self: flex-start; background: var(--bot); border: 1px solid var(--line); }
  form { display: flex; gap: 8px; padding: 12px; border-top: 1px solid var(--line); }
  input, button, select {
    background: var(--panel);
    color: var(--text);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 12px;
  }
  input { flex: 1; }
  button { background: var(--accent); color: #081018; font-weight: 600; cursor: pointer; }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .stage { font-weight: 650; color: var(--accent); }
  @media (max-width: 900px) {
    body { grid-template-columns: 1fr; }
    .panel { border: none; border-bottom: 1px solid var(--line); }
  }
</style>
</head>
<body>
<header>
  <div>
    <strong>City Builder Prototype</strong>
    <span id="stage" class="stage">Stage: Outpost</span>
  </div>
  <div>
    <button id="voice-toggle">Voice: Off</button>
    <button id="reset">Reset City</button>
  </div>
</header>

<div class="panel" id="left">
  <h2>City Stats</h2>
  <div class="stat">Money: <span id="money">1000</span></div>
  <div class="stat">Population: <span id="pop">12</span></div>
  <div class="stat">Happiness: <span id="happy">62</span></div>
  <div class="stat">Influence: <span id="influence">5</span></div>

  <h2 style="margin-top:20px">Hierarchy</h2>
  <div id="npcs"></div>
</div>

<div style="display:flex;flex-direction:column;overflow:hidden">
  <div id="log"></div>
  <form id="form">
    <input id="box" type="text" placeholder="Talk to the selected NPC…" autocomplete="off">
    <button type="submit">Send</button>
  </form>
</div>

<div class="panel" id="right">
  <h2>Actions</h2>
  <div class="actions">
    <button data-action="tax">Raise Taxes</button>
    <button data-action="build">Build Housing</button>
    <button data-action="festival">Hold Festival</button>
    <button data-action="promote">Promote Citizen</button>
  </div>
  <h2 style="margin-top:20px">Stage Progress</h2>
  <div id="progress"></div>
  <p style="color:var(--muted);font-size:13px;margin-top:16px">
    Experiment: select an NPC on the left, then talk. Voice input uses the browser’s speech recognition.
  </p>
</div>

<script>
const state = {
  money: 1000,
  pop: 12,
  happy: 62,
  influence: 5,
  stage: 0,
  stages: ["Outpost", "Settlement", "Town", "City", "Metropolis"],
  selected: 0,
  npcs: [
    { name: "Aria", role: "Advisor", loyalty: 70, personality: "pragmatic" },
    { name: "Borin", role: "Merchant", loyalty: 55, personality: "greedy" },
    { name: "Cora", role: "Citizen Leader", loyalty: 80, personality: "idealistic" },
    { name: "Dax", role: "Worker", loyalty: 45, personality: "blunt" }
  ]
};

const logEl = document.getElementById("log");
const box = document.getElementById("box");
const form = document.getElementById("form");
const npcsEl = document.getElementById("npcs");
const voiceToggle = document.getElementById("voice-toggle");
let voiceOn = false;
let recognition = null;

if ("webkitSpeechRecognition" in window || "SpeechRecognition" in window) {
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SR();
  recognition.continuous = false;
  recognition.interimResults = false;
  recognition.onresult = (e) => {
    const text = e.results[0][0].transcript;
    box.value = text;
    form.requestSubmit();
  };
}

function save() { localStorage.setItem("city-proto", JSON.stringify(state)); }
function load() {
  const s = localStorage.getItem("city-proto");
  if (s) Object.assign(state, JSON.parse(s));
}
load();

function render() {
  document.getElementById("money").textContent = state.money;
  document.getElementById("pop").textContent = state.pop;
  document.getElementById("happy").textContent = state.happy;
  document.getElementById("influence").textContent = state.influence;
  document.getElementById("stage").textContent = "Stage: " + state.stages[state.stage];

  npcsEl.innerHTML = "";
  state.npcs.forEach((n, i) => {
    const div = document.createElement("div");
    div.className = "npc" + (i === state.selected ? " active" : "");
    div.innerHTML = `<strong>${n.name}</strong><div class="role">${n.role} · Loyalty ${n.loyalty}</div>`;
    div.onclick = () => { state.selected = i; render(); addMsg("system", `Now talking to ${n.name}.`); };
    npcsEl.appendChild(div);
  });

  const prog = document.getElementById("progress");
  prog.innerHTML = state.stages.map((s, i) => 
    `<div style="opacity:${i <= state.stage ? 1 : 0.4}">${i === state.stage ? "▶ " : "○ "}${s}</div>`
  ).join("");
}

function addMsg(who, text) {
  const div = document.createElement("div");
  div.className = "msg " + (who === "you" ? "you" : "npc-msg");
  div.textContent = text;
  logEl.appendChild(div);
  logEl.scrollTop = logEl.scrollHeight;
  if (voiceOn && who !== "you" && "speechSynthesis" in window) {
    const u = new SpeechSynthesisUtterance(text);
    speechSynthesis.speak(u);
  }
}

function npcReply(npc, userText) {
  const q = userText.toLowerCase();
  const replies = {
    pragmatic: [
      "We need more money in the treasury before expanding.",
      "Taxes are a tool. Use them carefully or loyalty drops.",
      "Hierarchy works better when people see clear benefits."
    ],
    greedy: [
      "I can move more goods if the taxes stay low.",
      "Money makes the city grow. Don’t scare the traders.",
      "Promote people who actually produce value."
    ],
    idealistic: [
      "The people want to be heard, not just managed.",
      "A festival would raise happiness more than another tax.",
      "True strength comes from loyal citizens, not just coin."
    ],
    blunt: [
      "Just build more housing. People need places to live.",
      "Stop talking and raise the money somehow.",
      "I’m just a worker. Decisions are above me."
    ]
  };
  const pool = replies[npc.personality] || replies.pragmatic;
  let base = pool[Math.floor(Math.random() * pool.length)];

  if (q.includes("tax") || q.includes("money")) base = `${npc.name}: ` + base;
  else if (q.includes("hello") || q.includes("hi")) base = `Hello. I’m ${npc.name}, ${npc.role}.`;
  else if (q.includes("loyalty") || q.includes("happy")) base = `My loyalty is ${npc.loyalty}. Happiness in the city is ${state.happy}.`;
  else base = `${npc.name}: ` + base;

  return base;
}

function doAction(action) {
  if (action === "tax") {
    state.money += 150;
    state.happy = Math.max(20, state.happy - 8);
    state.npcs.forEach(n => n.loyalty = Math.max(10, n.loyalty - 4));
    addMsg("system", "Taxes raised. Money +150, happiness and loyalty drop.");
  } else if (action === "build") {
    if (state.money >= 200) {
      state.money -= 200;
      state.pop += 5;
      state.happy = Math.min(100, state.happy + 5);
      addMsg("system", "Housing built. Population +5.");
    } else addMsg("system", "Not enough money.");
  } else if (action === "festival") {
    if (state.money >= 120) {
      state.money -= 120;
      state.happy = Math.min(100, state.happy + 15);
      state.npcs.forEach(n => n.loyalty = Math.min(100, n.loyalty + 6));
      addMsg("system", "Festival held. Happiness and loyalty rise.");
    } else addMsg("system", "Not enough money.");
  } else if (action === "promote") {
    const n = state.npcs[state.selected];
    n.loyalty = Math.min(100, n.loyalty + 12);
    n.role = n.role.includes("Senior") ? n.role : "Senior " + n.role;
    state.influence += 2;
    addMsg("system", `${n.name} promoted. Loyalty and influence increase.`);
  }
  checkStage();
  save();
  render();
}

function checkStage() {
  if (state.pop >= 40 && state.stage < 1) state.stage = 1;
  else if (state.pop >= 80 && state.money >= 2000 && state.stage < 2) state.stage = 2;
  else if (state.pop >= 150 && state.influence >= 20 && state.stage < 3) state.stage = 3;
  else if (state.pop >= 300 && state.stage < 4) state.stage = 4;
}

form.addEventListener("submit", (e) => {
  e.preventDefault();
  const text = box.value.trim();
  if (!text) return;
  box.value = "";
  addMsg("you", text);
  const npc = state.npcs[state.selected];
  const reply = npcReply(npc, text);
  setTimeout(() => addMsg("npc", reply), 400);
});

document.querySelectorAll("[data-action]").forEach(btn => {
  btn.addEventListener("click", () => doAction(btn.dataset.action));
});

voiceToggle.addEventListener("click", () => {
  voiceOn = !voiceOn;
  voiceToggle.textContent = "Voice: " + (voiceOn ? "On" : "Off");
  if (voiceOn && recognition) {
    recognition.start();
    voiceToggle.textContent = "Voice: Listening…";
    recognition.onend = () => {
      if (voiceOn) recognition.start();
      voiceToggle.textContent = "Voice: On";
    };
  } else if (recognition) {
    recognition.stop();
  }
});

document.getElementById("reset").addEventListener("click", () => {
  if (confirm("Reset the city?")) {
    localStorage.removeItem("city-proto");
    location.reload();
  }
});

render();
addMsg("system", "Prototype ready. Select an NPC and talk. Try the actions on the right.");
</script>
</body>
</html>
