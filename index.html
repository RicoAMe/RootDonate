<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>RootDonate</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0a0b0f;
    --surface: #12141a;
    --surface-2: #1a1d26;
    --border: rgba(255,255,255,0.08);
    --text: #f4f5f7;
    --muted: #8e96a3;
    --accent: #5b8cff;
    --green: #22c55e;
    --red: #ef4444;
    --yellow: #eab308;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: Inter, system-ui, sans-serif;
    height: 100vh;
    overflow: hidden;
  }
  .app {
    display: grid;
    grid-template-columns: 1fr 380px;
    grid-template-rows: auto 1fr;
    height: 100vh;
  }
  header {
    grid-column: 1 / -1;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 12px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .resources {
    display: flex;
    gap: 20px;
    font-size: 0.92rem;
  }
  .res { display: flex; align-items: center; gap: 6px; }
  .res span { font-weight: 600; }
  .map-area {
    padding: 16px;
    overflow: auto;
    display: flex;
    flex-direction: column;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    gap: 4px;
    max-width: 700px;
    margin: 0 auto;
  }
  .cell {
    aspect-ratio: 1;
    background: #1c1f28;
    border-radius: 6px;
    border: 1px solid var(--border);
    display: grid;
    place-items: center;
    font-size: 1.4rem;
    cursor: pointer;
    transition: 0.15s;
  }
  .cell:hover { background: #252936; }
  .cell.house { background: #3b2f5e; }
  .cell.farm { background: #1e3a2f; }
  .cell.factory { background: #3a2a1e; }
  .cell.park { background: #1e3a3a; }
  .sidebar {
    background: var(--surface);
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .build-menu {
    padding: 12px;
    border-bottom: 1px solid var(--border);
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .build-btn {
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 12px;
    border-radius: 10px;
    cursor: pointer;
    font-size: 0.85rem;
  }
  .build-btn.active { background: var(--accent); border-color: var(--accent); }
  .citizen-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
  }
  .citizen {
    padding: 10px 12px;
    border-radius: 10px;
    cursor: pointer;
    margin-bottom: 4px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .citizen:hover { background: var(--surface-2); }
  .citizen.selected { background: #1e293b; }
  .chat-panel {
    height: 320px;
    border-top: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    background: #0e1016;
  }
  .chat-header {
    padding: 10px 14px;
    font-weight: 600;
    border-bottom: 1px solid var(--border);
    font-size: 0.9rem;
  }
  .messages {
    flex: 1;
    overflow-y: auto;
    padding: 10px 14px;
    font-size: 0.88rem;
  }
  .msg { margin-bottom: 8px; line-height: 1.4; }
  .msg.me { color: #93c5fd; text-align: right; }
  .msg.them { color: #d1d5db; }
  .chat-input {
    display: flex;
    padding: 8px;
    gap: 6px;
  }
  .chat-input input {
    flex: 1;
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 10px;
    padding: 8px 12px;
    outline: none;
  }
  .chat-input button {
    background: var(--accent);
    border: none;
    color: white;
    border-radius: 10px;
    padding: 0 14px;
    cursor: pointer;
  }
  .search {
    width: 100%;
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 12px;
    border-radius: 10px;
    margin-bottom: 8px;
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div style="font-weight:700;font-size:1.1rem;">Chatty City</div>
    <div class="resources">
      <div class="res">Pop: <span id="pop">12</span></div>
      <div class="res">Food: <span id="food">80</span></div>
      <div class="res">Money: <span id="money">200</span></div>
      <div class="res">Happiness: <span id="happy">72%</span></div>
    </div>
  </header>

  <div class="map-area">
    <div class="grid" id="grid"></div>
  </div>

  <div class="sidebar">
    <div class="build-menu">
      <button class="build-btn" data-type="house">🏠 House (40$)</button>
      <button class="build-btn" data-type="farm">🌾 Farm (60$)</button>
      <button class="build-btn" data-type="factory">🏭 Factory (100$)</button>
      <button class="build-btn" data-type="park">🌳 Park (50$)</button>
      <button class="build-btn" data-type="none">❌ Cancel</button>
    </div>

    <div style="padding:12px 12px 0;">
      <input class="search" id="search" placeholder="Search citizen by name..." />
    </div>
    <div class="citizen-list" id="citizen-list"></div>

    <div class="chat-panel" id="chat-panel" style="display:none;">
      <div class="chat-header" id="chat-header">Chat with Citizen</div>
      <div class="messages" id="messages"></div>
      <div class="chat-input">
        <input id="chat-input" placeholder="Type a message..." />
        <button id="send-chat">Send</button>
      </div>
    </div>
  </div>
</div>

<script>
const firstNames = ["Emma","Liam","Olivia","Noah","Ava","Ethan","Sophia","Mason","Isabella","William","Mia","James","Charlotte","Benjamin","Amelia","Lucas","Harper","Henry","Evelyn","Alexander","Abigail","Michael","Emily","Daniel","Elizabeth","Matthew","Sofia","Jackson","Avery","David","Ella","Joseph","Scarlett","Samuel","Grace","Carter","Chloe","Wyatt","Victoria","John","Riley","Jack","Aria","Luke","Lily","Owen","Aurora","Gabriel","Zoey","Anthony"];
const lastNames = ["Smith","Johnson","Williams","Brown","Jones","Garcia","Miller","Davis","Rodriguez","Martinez","Hernandez","Lopez","Gonzalez","Wilson","Anderson","Thomas","Taylor","Moore","Jackson","Martin","Lee","Perez","Thompson","White","Harris","Sanchez","Clark","Ramirez","Lewis","Robinson","Walker","Young","Allen","King","Wright","Scott","Torres","Nguyen","Hill","Flores","Green","Adams","Nelson","Baker","Hall","Rivera","Campbell","Mitchell","Carter","Roberts"];

let citizens = [];
let money = 200;
let food = 80;
let happiness = 72;
let selectedBuild = null;
let selectedCitizen = null;
let grid = Array(100).fill(null); // 10x10

function randomName() {
  return firstNames[Math.floor(Math.random()*firstNames.length)] + " " + lastNames[Math.floor(Math.random()*lastNames.length)];
}

function createCitizen() {
  return {
    id: Date.now() + Math.random(),
    name: randomName(),
    happiness: 60 + Math.floor(Math.random()*30),
    messages: []
  };
}

function initCitizens() {
  for (let i = 0; i < 12; i++) citizens.push(createCitizen());
}

function renderGrid() {
  const gridEl = document.getElementById("grid");
  gridEl.innerHTML = "";
  for (let i = 0; i < 100; i++) {
    const cell = document.createElement("div");
    cell.className = "cell" + (grid[i] ? " " + grid[i] : "");
    cell.textContent = grid[i] === "house" ? "🏠" : grid[i] === "farm" ? "🌾" : grid[i] === "factory" ? "🏭" : grid[i] === "park" ? "🌳" : "";
    cell.onclick = () => placeBuilding(i);
    gridEl.appendChild(cell);
  }
}

function placeBuilding(index) {
  if (!selectedBuild || selectedBuild === "none") return;
  if (grid[index]) return;

  const costs = { house: 40, farm: 60, factory: 100, park: 50 };
  if (money < costs[selectedBuild]) {
    alert("Not enough money!");
    return;
  }

  money -= costs[selectedBuild];
  grid[index] = selectedBuild;
  if (selectedBuild === "house") {
    citizens.push(createCitizen());
  }
  updateUI();
  renderGrid();
  renderCitizens();
}

function renderCitizens(filter = "") {
  const list = document.getElementById("citizen-list");
  list.innerHTML = "";
  citizens
    .filter(c => c.name.toLowerCase().includes(filter.toLowerCase()))
    .forEach(c => {
      const div = document.createElement("div");
      div.className = "citizen" + (selectedCitizen?.id === c.id ? " selected" : "");
      div.innerHTML = `<div>${c.name}</div><div style="font-size:0.75rem;color:#8e96a3">${c.happiness}%</div>`;
      div.onclick = () => openChat(c);
      list.appendChild(div);
    });
}

function openChat(citizen) {
  selectedCitizen = citizen;
  document.getElementById("chat-panel").style.display = "flex";
  document.getElementById("chat-header").textContent = `Chat with ${citizen.name}`;
  renderMessages();
  renderCitizens(document.getElementById("search").value);
}

function renderMessages() {
  const box = document.getElementById("messages");
  box.innerHTML = "";
  if (!selectedCitizen) return;
  selectedCitizen.messages.forEach(m => {
    const div = document.createElement("div");
    div.className = "msg " + (m.from === "me" ? "me" : "them");
    div.textContent = m.text;
    box.appendChild(div);
  });
  box.scrollTop = box.scrollHeight;
}

function getCitizenReply(citizen) {
  if (food < 40) return "Mayor, we're running low on food! Please build more farms.";
  if (happiness < 50) return "People are unhappy. We need more parks and better living conditions.";
  if (money < 50) return "The city is low on funds. Maybe build some factories?";
  const replies = [
    "Thanks for checking in, Mayor!",
    "Everything's fine on my end.",
    "I appreciate you asking.",
    "The city is looking better every day.",
    "Keep up the good work!"
  ];
  return replies[Math.floor(Math.random() * replies.length)];
}

function sendMessage() {
  const input = document.getElementById("chat-input");
  const text = input.value.trim();
  if (!text || !selectedCitizen) return;

  selectedCitizen.messages.push({ from: "me", text });
  const reply = getCitizenReply(selectedCitizen);
  selectedCitizen.messages.push({ from: "them", text: reply });

  input.value = "";
  renderMessages();
}

function updateUI() {
  document.getElementById("pop").textContent = citizens.length;
  document.getElementById("food").textContent = Math.floor(food);
  document.getElementById("money").textContent = Math.floor(money);
  document.getElementById("happy").textContent = Math.floor(happiness) + "%";
}

function gameTick() {
  // Production & consumption
  const farms = grid.filter(x => x === "farm").length;
  const factories = grid.filter(x => x === "factory").length;
  const parks = grid.filter(x => x === "park").length;

  food += farms * 8;
  money += factories * 12;
  food -= citizens.length * 1.2;
  happiness = Math.min(100, Math.max(10, happiness + parks * 0.8 - (food < 30 ? 3 : 0)));

  // Growth
  if (happiness > 70 && food > 50 && Math.random() < 0.15) {
    citizens.push(createCitizen());
  }

  // Cap resources
  food = Math.max(0, food);
  money = Math.max(0, money);

  updateUI();
  renderCitizens(document.getElementById("search").value);
}

// Event listeners
document.querySelectorAll(".build-btn").forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll(".build-btn").forEach(b => b.classList.remove("active"));
    if (btn.dataset.type !== "none") btn.classList.add("active");
    selectedBuild = btn.dataset.type;
  };
});

document.getElementById("search").oninput = e => renderCitizens(e.target.value);
document.getElementById("send-chat").onclick = sendMessage;
document.getElementById("chat-input").onkeydown = e => {
  if (e.key === "Enter") sendMessage();
};

// Init
initCitizens();
renderGrid();
renderCitizens();
updateUI();
setInterval(gameTick, 2000);
</script>
</body>
</html>
