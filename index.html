<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#070b14">
  <title>RootDonate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <style>
    :root {
      --bg: #070b14;
      --bg-accent: radial-gradient(circle at 20% 80%, rgba(34, 197, 94, 0.08), transparent 40%),
                   radial-gradient(circle at 80% 20%, rgba(98, 126, 234, 0.12), transparent 40%);
      --surface: rgba(15, 23, 42, 0.65);
      --surface-2: rgba(30, 41, 59, 0.5);
      --accent: #22c55e;
      --accent-soft: rgba(34, 197, 94, 0.15);
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: rgba(148, 163, 184, 0.12);
      --radius: 18px;
      --red: #ef4444;
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: "Inter", system-ui, -apple-system, sans-serif;
    }
    body {
      display: flex; flex-direction: column; height: 100dvh;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      background-image: var(--bg-accent);
      background-attachment: fixed;
    }

    header {
      background: var(--surface);
      backdrop-filter: blur(20px);
      padding: 14px 18px;
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    header strong { font-size: 1.15rem; font-weight: 600; letter-spacing: -0.02em; }
    .badge {
      font-size: 0.65rem; background: linear-gradient(135deg, #627eea, #4f46e5);
      padding: 2px 8px; border-radius: 999px; margin-left: 8px; font-weight: 600;
    }
    .header-actions { display: flex; gap: 10px; align-items: center; }
    #userInfo { font-size: 0.85rem; color: var(--accent); font-weight: 500; }

    button {
      background: rgba(71, 85, 105, 0.4);
      color: #fff; border: 1px solid var(--border);
      padding: 8px 14px; border-radius: 12px;
      font-weight: 500; font-size: 0.9rem;
      cursor: pointer; min-height: 40px;
      transition: all 0.2s ease;
    }
    button:hover { background: rgba(71, 85, 105, 0.6); transform: translateY(-1px); }
    button:active { transform: translateY(0); }

    #log {
      flex: 1; overflow-y: auto; padding: 18px;
      display: flex; flex-direction: column; gap: 10px;
      scroll-behavior: smooth;
    }
    .entry {
      padding: 14px 16px; border-radius: var(--radius);
      background: var(--surface); border: 1px solid var(--border);
      white-space: pre-wrap; font-size: 0.92rem; line-height: 1.5;
      backdrop-filter: blur(12px); box-shadow: var(--shadow);
    }
    .entry.scanner { border-left: 3px solid var(--accent); font-family: ui-monospace, Menlo, monospace; font-size: 0.88rem; }
    .entry.user {
      align-self: flex-end; background: linear-gradient(135deg, var(--accent), #16a34a);
      color: #020617; max-width: 82%; font-weight: 500; border: none;
    }
    .entry.ai { border-left: 3px solid #627eea; }
    .entry.priority { border-left: 3px solid var(--red); background: rgba(239, 68, 68, 0.08); }

    .controls, .input-bar, .status-bar {
      padding: 12px 16px; background: var(--surface);
      backdrop-filter: blur(20px); border-top: 1px solid var(--border); flex-shrink: 0;
    }
    .controls { display: flex; gap: 8px; flex-wrap: wrap; }
    .controls button { flex: 1; min-width: 88px; }
    #plate {
      flex: 2; padding: 10px 14px; border-radius: 12px;
      border: 1px solid var(--border); background: var(--surface-2);
      color: var(--text); font-size: 0.9rem;
    }
    .input-bar { display: flex; gap: 10px; align-items: flex-end; }
    #input {
      flex: 1; padding: 12px 16px; border-radius: 24px;
      background: var(--surface-2); color: var(--text);
      border: 1px solid transparent; resize: none;
      min-height: 48px; max-height: 120px; font-family: inherit; font-size: 0.95rem;
      transition: border-color 0.2s;
    }
    #input:focus { outline: none; border-color: var(--accent); }
    #send {
      background: var(--accent); color: #020617; width: 48px; height: 48px;
      border-radius: 50%; font-size: 1.3rem; font-weight: 600; border: none;
    }
    .status-bar { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--muted); }
    .wanted { color: var(--red); font-weight: 600; }

    #app { display: none; flex-direction: column; height: 100%; }
    #authScreen {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      height: 100%; gap: 18px; padding: 24px; text-align: center;
    }
    #authScreen h2 { font-size: 1.8rem; margin: 0; font-weight: 700; letter-spacing: -0.03em; }
    #authScreen button { min-width: 240px; background: var(--surface-2); }
    #authError { color: var(--red); min-height: 1.2em; font-size: 0.9rem; }
    .auth-form { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 340px; }
    .auth-form input {
      padding: 12px 14px; border-radius: 12px; border: 1px solid var(--border);
      background: var(--surface-2); color: var(--text); font-size: 0.95rem;
    }
    .consent { display: flex; align-items: flex-start; gap: 8px; font-size: 0.8rem; text-align: left; color: var(--muted); }
    .consent input { margin-top: 3px; }
    .auth-toggle { font-size: 0.85rem; margin-top: 4px; }
    .auth-toggle a { color: var(--accent); cursor: pointer; text-decoration: none; font-weight: 500; }
    .auth-toggle a:hover { text-decoration: underline; }

    .modal {
      position: fixed; inset: 0; background: rgba(0,0,0,0.65);
      display: none; align-items: center; justify-content: center;
      z-index: 1000; padding: 20px; backdrop-filter: blur(8px);
    }
    .modal-content {
      background: var(--surface); backdrop-filter: blur(20px);
      border: 1px solid var(--border); border-radius: 16px;
      padding: 22px; max-width: 520px; max-height: 80vh; overflow-y: auto;
      text-align: left; font-size: 0.9rem; line-height: 1.6; box-shadow: var(--shadow);
    }
    .modal-content h3 { margin-top: 0; color: var(--accent); }
    .close-modal {
      float: right; background: none; border: none; color: var(--text);
      font-size: 1.5rem; cursor: pointer; padding: 0; line-height: 1;
    }
  </style>
</head>
<body>
  <div id="authScreen">
    <h2>RootDonate</h2>
    <p id="authTitle">Sign in to access the scanner</p>
    <div id="authError"></div>
    <button id="googleBtn">Continue with Google</button>
    <div class="auth-form">
      <input type="email" id="email" placeholder="Email" autocomplete="email">
      <input type="password" id="password" placeholder="Password" autocomplete="current-password">
      <input type="password" id="confirmPassword" placeholder="Confirm password" autocomplete="new-password" style="display:none;">
      <label class="consent" id="consentLabel" style="display:none;">
        <input type="checkbox" id="consentCheck">
        I agree to the <a href="#" id="privacyLink">Privacy Policy</a> and <a href="#" id="termsLink">Terms of Service</a>
      </label>
      <button id="emailBtn">Sign in with Email</button>
    </div>
    <div class="auth-toggle">
      <span id="toggleText">Don't have an account?</span> <a id="toggleMode">Sign up</a>
    </div>
  </div>

  <div class="modal" id="legalModal">
    <div class="modal-content">
      <button class="close-modal" id="closeModal">×</button>
      <div id="legalContent"></div>
    </div>
  </div>

  <div id="app">
    <header>
      <div>
        <strong>RootDonate<span class="badge">v3.1.9</span></strong>
        <small id="status" style="display:block; color:var(--muted); font-size:0.75rem; margin-top:2px;">Channel 1 • Leonida Metro • AI Online</small>
      </div>
      <div class="header-actions">
        <span id="userInfo"></span>
        <button id="signOutBtn">Sign out</button>
      </div>
    </header>

    <div id="log"></div>

    <div class="status-bar">
      <span>Wanted: <span id="wanted" class="wanted">0</span></span>
      <span id="units">Units: 12</span>
      <span id="aiStatus">AI Ready</span>
    </div>

    <div class="controls">
      <button id="scanBtn">Scan</button>
      <button id="priorityBtn">Priority</button>
      <input type="text" id="plate" placeholder="Plate lookup…" maxlength="8" autocomplete="off" autocapitalize="characters">
      <button id="lookupBtn">Lookup</button>
    </div>

    <div class="input-bar">
      <textarea id="input" placeholder="Ask the AI anything..." rows="1"></textarea>
      <button id="send">↑</button>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBvcCBsPiMxS7G2evPjM7sANp-zSy_RkKM",
      authDomain: "rootdonate-61e61.firebaseapp.com",
      databaseURL: "https://rootdonate-61e61-default-rtdb.firebaseio.com",
      projectId: "rootdonate-61e61",
      storageBucket: "rootdonate-61e61.firebasestorage.app",
      messagingSenderId: "754240963907",
      appId: "1:754240963907:web:5417c2763d8f02108bdbf6",
      measurementId: "G-0SC5R5ELT1"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    const authScreen = document.getElementById("authScreen");
    const app = document.getElementById("app");
    const authError = document.getElementById("authError");
    const authTitle = document.getElementById("authTitle");
    const googleBtn = document.getElementById("googleBtn");
    const emailBtn = document.getElementById("emailBtn");
    const emailInput = document.getElementById("email");
    const passwordInput = document.getElementById("password");
    const confirmPasswordInput = document.getElementById("confirmPassword");
    const consentLabel = document.getElementById("consentLabel");
    const consentCheck = document.getElementById("consentCheck");
    const toggleMode = document.getElementById("toggleMode");
    const toggleText = document.getElementById("toggleText");

    const signOutBtn = document.getElementById("signOutBtn");
    const userInfo = document.getElementById("userInfo");
    const log = document.getElementById("log");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const statusEl = document.getElementById("status");
    const aiStatus = document.getElementById("aiStatus");
    const wantedEl = document.getElementById("wanted");
    const unitsEl = document.getElementById("units");
    const plateInput = document.getElementById("plate");

    const legalModal = document.getElementById("legalModal");
    const legalContent = document.getElementById("legalContent");
    const closeModal = document.getElementById("closeModal");

    let isSignUp = false;
    let muted = false;
    let wanted = 0;
    let isAI = false;
    let isSignedIn = false;

    const privacyPolicy = `
      <h3>Privacy Policy</h3>
      <p><strong>Data Controller:</strong> RootDonate</p>
      <p>We collect the following personal data solely for authentication and providing the service:</p>
      <ul>
        <li>Email address</li>
        <li>Display name (if provided via Google)</li>
        <li>Authentication tokens (handled by Firebase Authentication)</li>
      </ul>
      <p>Data is processed by Google Firebase (Google Cloud) under their data processing terms. We do not sell your data. You can request deletion of your account at any time by contacting us or using account deletion features (coming soon).</p>
      <p>By creating an account you consent to this processing under GDPR Article 6(1)(b) (contract) and Article 6(1)(a) (consent).</p>
    `;

    const termsOfService = `
      <h3>Terms of Service</h3>
      <p>This is a demo application themed around fictional GTA VI content. No real-world law enforcement functionality is provided.</p>
      <p>You must be 16+ to use this service. By using the app you agree not to misuse it and accept that we may terminate access for violations.</p>
    `;

    function showError(msg) {
      authError.textContent = msg || "";
    }

    function setMode(signUp) {
      isSignUp = signUp;
      if (signUp) {
        authTitle.textContent = "Create an account";
        emailBtn.textContent = "Create Account";
        confirmPasswordInput.style.display = "block";
        consentLabel.style.display = "flex";
        toggleText.textContent = "Already have an account?";
        toggleMode.textContent = "Sign in";
        passwordInput.autocomplete = "new-password";
      } else {
        authTitle.textContent = "Sign in to access the scanner";
        emailBtn.textContent = "Sign in with Email";
        confirmPasswordInput.style.display = "none";
        consentLabel.style.display = "none";
        toggleText.textContent = "Don't have an account?";
        toggleMode.textContent = "Sign up";
        passwordInput.autocomplete = "current-password";
      }
      showError("");
      consentCheck.checked = false;
    }

    toggleMode.onclick = () => setMode(!isSignUp);

    document.getElementById("privacyLink").onclick = (e) => {
      e.preventDefault();
      legalContent.innerHTML = privacyPolicy;
      legalModal.style.display = "flex";
    };
    document.getElementById("termsLink").onclick = (e) => {
      e.preventDefault();
      legalContent.innerHTML = termsOfService;
      legalModal.style.display = "flex";
    };
    closeModal.onclick = () => legalModal.style.display = "none";
    legalModal.onclick = (e) => { if (e.target === legalModal) legalModal.style.display = "none"; };

    googleBtn.onclick = async () => {
      showError("");
      const provider = new firebase.auth.GoogleAuthProvider();
      try {
        await auth.signInWithPopup(provider);
      } catch (err) {
        showError(err.message || "Google sign-in failed");
      }
    };

    emailBtn.onclick = async () => {
      showError("");
      const email = emailInput.value.trim();
      const password = passwordInput.value;
      if (!email || !password) return showError("Email and password required");

      if (isSignUp) {
        if (password !== confirmPasswordInput.value) return showError("Passwords do not match");
        if (!consentCheck.checked) return showError("You must agree to the Privacy Policy and Terms");
        try {
          await auth.createUserWithEmailAndPassword(email, password);
          localStorage.setItem("gdprConsent", Date.now().toString());
        } catch (err) {
          showError(err.message || "Could not create account");
        }
      } else {
        try {
          await auth.signInWithEmailAndPassword(email, password);
        } catch (err) {
          showError(err.message || "Sign-in failed");
        }
      }
    };

    signOutBtn.onclick = () => auth.signOut();

    auth.onAuthStateChanged(user => {
      if (user) {
        isSignedIn = true;
        authScreen.style.display = "none";
        app.style.display = "flex";
        const name = user.displayName || user.email || "User";
        userInfo.textContent = `👤 ${name}`;
        if (log.children.length === 0) {
          addEntry("RootDonate Scanner + Internet AI online.", "scanner");
          addEntry("Signed in successfully.", "ai");
        }
      } else {
        isSignedIn = false;
        authScreen.style.display = "flex";
        app.style.display = "none";
        userInfo.textContent = "";
        log.innerHTML = "";
        setMode(false);
      }
    });

    const chatter = [
      { type: "scanner", text: "Dispatch: Unit 4-Adam-12, respond to disturbance at Ocean Drive, Vice City Beach." },
      { type: "scanner", text: "Air Support: Suspicious black Blista Compact heading north on Port Gellhorn Highway." },
      { type: "priority", text: "Code 3: Shots fired near Ambrosia. Multiple suspects fleeing. All units respond." },
      { type: "scanner", text: "Traffic: Speed enforcement active on the bridge into Leonida City." },
      { type: "scanner", text: "BOLO: Stolen yellow Sanchez last seen near the docks. Occupant armed." },
      { type: "priority", text: "Officer down! 10-99 at Grass Rivers. Backup needed immediately!" },
      { type: "scanner", text: "Unit 7-Boy-3: Suspect in custody, requesting transport." },
      { type: "scanner", text: "High-speed pursuit on the freeway. Black Dominator, plates unknown." },
      { type: "priority", text: "Armed robbery in progress at the 24/7 on Main Street. Units en route." }
    ];

    const plates = {
      "VC1234": "Stolen — Black Dominator, linked to recent heist",
      "LEON01": "Registered to local resident — no flags",
      "GTA666": "Wanted — multiple felonies, approach with caution",
      "VCPD1": "Police vehicle — do not stop",
      "AMBRO": "Rental — last seen near Ambrosia resort"
    };

    function addEntry(text, type = "scanner") {
      const div = document.createElement("div");
      div.className = `entry ${type}`;
      div.textContent = text;
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
    }

    function randomChatter() {
      if (muted || !isSignedIn) return;
      const entry = chatter[Math.floor(Math.random() * chatter.length)];
      addEntry(entry.text, entry.type === "priority" ? "priority" : "scanner");
      if (entry.type === "priority") {
        wanted = Math.min(5, wanted + 1);
        wantedEl.textContent = wanted;
      }
    }

    async function askAI(question) {
      if (isAI || !isSignedIn) return;
      isAI = true;
      sendBtn.disabled = true;
      aiStatus.textContent = "AI thinking…";
      addEntry(question, "user");

      const now = Date.now();
      const system = `You are a helpful AI assistant integrated into a GTA VI Vice City Police Department (VCPD) scanner system.
The user is signed in. You can answer questions about GTA VI lore, Leonida/Vice City locations, police procedures, vehicle info, or any general topic.
Keep answers clear, useful, and in character when relevant.
Current timestamp (ms): ${now}
Never give real-world illegal advice.`;

      const url = `https://text.pollinations.ai/${encodeURIComponent(system + "\n\nUser: " + question)}?temperature=0.7&seed=${now}`;

      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error("HTTP " + res.status);
        let text = (await res.text()).trim();
        if (!text || text.length < 3) throw new Error("Empty response");
        addEntry(text, "ai");
        aiStatus.textContent = "AI Ready";
      } catch (e) {
        addEntry("AI is currently unavailable. Try again in a moment.", "ai");
        aiStatus.textContent = "AI Offline";
      }

      isAI = false;
      sendBtn.disabled = false;
      input.focus();
    }

    function send() {
      const text = input.value.trim();
      if (!text || isAI || !isSignedIn) return;
      input.value = "";
      input.style.height = "auto";
      askAI(text);
    }

    sendBtn.onclick = send;
    input.onkeydown = e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } };
    input.oninput = () => { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 120) + "px"; };

    document.getElementById("scanBtn").onclick = () => {
      if (!isSignedIn) return;
      statusEl.textContent = "Scanning…";
      setTimeout(() => {
        statusEl.textContent = "Channel 1 • Leonida Metro • AI Online";
        randomChatter();
      }, 600);
    };

    document.getElementById("priorityBtn").onclick = () => {
      if (!isSignedIn) return;
      const pri = chatter.filter(c => c.type === "priority");
      const entry = pri[Math.floor(Math.random() * pri.length)];
      addEntry(entry.text, "priority");
      wanted = Math.min(5, wanted + 1);
      wantedEl.textContent = wanted;
    };

    document.getElementById("lookupBtn").onclick = () => {
      if (!isSignedIn) return;
      const p = plateInput.value.trim().toUpperCase();
      if (!p) return;
      const result = plates[p] || "No records found";
      addEntry(`Plate ${p}: ${result}`, "scanner");
      plateInput.value = "";
    };

    setInterval(() => {
      if (!muted && isSignedIn && Math.random() > 0.7) randomChatter();
      if (isSignedIn) unitsEl.textContent = `Units: ${8 + Math.floor(Math.random() * 10)}`;
    }, 5000);
  </script>
</body>
</html>
