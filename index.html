<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ROOTDONATE • LOST & FOUND NODES</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    :root {
      --neon: #00ff41;
      --neon-dark: #00cc33;
      --bg: #050505;
      --card: #0f0f0f;
    }
    
    * { box-sizing: border-box; }
    
    body {
      font-family: 'Courier New', monospace;
      background: var(--bg);
      color: var(--neon);
      margin: 0;
      padding: 0;
      overflow-x: hidden;
      line-height: 1.6;
    }

    #matrix-bg {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: -1;
      opacity: 0.08;
      pointer-events: none;
    }

    .container {
      max-width: 1100px;
      margin: 20px auto;
      padding: 25px;
      background: var(--card);
      border: 2px solid var(--neon);
      border-radius: 20px;
      box-shadow: 0 0 40px rgba(0, 255, 65, 0.4),
                  inset 0 0 30px rgba(0, 255, 65, 0.1);
      position: relative;
    }

    .header {
      text-align: center;
      margin-bottom: 30px;
      position: relative;
    }

    h1 {
      font-size: 3.2rem;
      margin: 0;
      letter-spacing: 6px;
      text-transform: uppercase;
      background: linear-gradient(90deg, #00ff41, #00cc33);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      text-shadow: 0 0 30px var(--neon);
    }

    .subtitle {
      color: #00ff8866;
      font-size: 1.1rem;
      letter-spacing: 3px;
      margin: 8px 0 0;
    }

    .scanline {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(transparent, var(--neon), transparent);
      animation: scan 4s linear infinite;
      opacity: 0.3;
    }

    @keyframes scan {
      0% { transform: translateY(-100px); }
      100% { transform: translateY(800px); }
    }

    .nav {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 30px;
      justify-content: center;
    }

    .nav button {
      background: transparent;
      color: var(--neon);
      border: 1px solid var(--neon);
      padding: 10px 22px;
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s;
      font-weight: bold;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nav button:hover,
    .nav button.active {
      background: var(--neon);
      color: #000;
      box-shadow: 0 0 20px var(--neon);
    }

    #nodesList {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 18px;
    }

    .node {
      background: #0a0a0a;
      border: 1px solid var(--neon);
      border-radius: 16px;
      padding: 20px;
      transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
      position: relative;
      overflow: hidden;
    }

    .node:hover {
      transform: translateY(-8px) scale(1.03);
      box-shadow: 0 0 35px rgba(0, 255, 65, 0.5);
    }

    .node::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 40%;
      height: 200%;
      background: linear-gradient(135deg, transparent, rgba(255,255,255,0.15), transparent);
      transform: rotate(30deg);
      transition: all 0.6s;
      opacity: 0;
    }

    .node:hover::before {
      left: 120%;
      opacity: 1;
    }

    .node-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 15px;
    }

    .node-type {
      font-size: 0.9rem;
      padding: 4px 14px;
      border-radius: 30px;
      font-weight: bold;
    }

    .lost { background: #440000; color: #ff6666; }
    .found { background: #003300; color: #00ff88; }

    .node-actions {
      display: flex;
      gap: 10px;
    }

    button {
      background: var(--neon);
      color: #000;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    button:hover {
      transform: scale(1.05);
      box-shadow: 0 0 25px var(--neon);
    }

    .log {
      background: #000;
      border: 1px solid var(--neon);
      border-radius: 12px;
      height: 260px;
      overflow-y: auto;
      padding: 18px;
      font-size: 0.95rem;
      line-height: 1.5;
      margin-top: 30px;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
    }

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(5,5,5,0.97);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      backdrop-filter: blur(8px);
    }

    .modal-content {
      background: #111;
      border: 3px solid var(--neon);
      border-radius: 20px;
      width: 100%;
      max-width: 580px;
      padding: 35px;
      box-shadow: 0 0 60px rgba(0, 255, 65, 0.6);
      position: relative;
    }

    .modal-content h2 {
      margin-top: 0;
      text-align: center;
      font-size: 1.8rem;
    }

    input, select, textarea {
      width: 100%;
      background: #000;
      border: 1px solid var(--neon);
      color: var(--neon);
      padding: 16px;
      margin: 12px 0;
      border-radius: 10px;
      font-size: 1rem;
      transition: border 0.3s;
    }

    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: #fff;
      box-shadow: 0 0 15px var(--neon);
    }

    .status-bar {
      position: fixed;
      bottom: 15px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.85);
      border: 1px solid var(--neon);
      padding: 8px 24px;
      border-radius: 30px;
      font-size: 0.9rem;
      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 999;
    }

    .pulse {
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
  </style>
</head>
<body>

  <canvas id="matrix-bg"></canvas>

  <div class="container">
    <div class="header">
      <div class="scanline"></div>
      <h1>🔗 ROOTDONATE</h1>
      <p class="subtitle">LOST &amp; FOUND NODE NETWORK • EST 2026</p>
    </div>

    <div id="authSection">
      <div style="max-width:420px; margin:40px auto; text-align:center;">
        <h2 style="margin-bottom:25px;">NODE ACCESS TERMINAL</h2>
        <div id="loginForm">
          <input type="text" id="username" placeholder="NODE ID (@CWOA)">
          <input type="password" id="password" placeholder="ACCESS CODE">
          <button onclick="login()" style="width:100%; margin-top:15px;">
            <i class="fas fa-plug"></i> CONNECT NODE
          </button>
          <div onclick="toggleAuth()" style="margin-top:20px; color:#00ff88; cursor:pointer; text-decoration:underline;">
            CREATE NEW NODE →
          </div>
        </div>
        
        <div id="signupForm" class="hidden">
          <input type="text" id="newUser" placeholder="NEW NODE HANDLE">
          <input type="email" id="email" placeholder="SIGNAL ADDRESS">
          <input type="password" id="newPass" placeholder="ENCRYPTED PASSPHRASE">
          <button onclick="signup()" style="width:100%; margin-top:15px;">
            <i class="fas fa-satellite"></i> DEPLOY NODE
          </button>
          <div onclick="toggleAuth()" style="margin-top:20px; color:#00ff88; cursor:pointer; text-decoration:underline;">
            ← BACK TO TERMINAL
          </div>
        </div>
      </div>
    </div>

    <div id="mainApp" class="hidden">
      <div class="nav">
        <button onclick="setTab(0)" class="active"><i class="fas fa-network-wired"></i> ALL NODES</button>
        <button onclick="setTab(1)"><i class="fas fa-search"></i> SEARCH</button>
        <button onclick="showReportForm()"><i class="fas fa-plus-circle"></i> NEW NODE</button>
        <button onclick="logout()"><i class="fas fa-power-off"></i> DISCONNECT</button>
      </div>

      <div id="nodesList"></div>

      <h2 style="margin:40px 0 15px 10px; font-size:1.4rem;">NETWORK ACTIVITY LOG</h2>
      <div id="log" class="log"></div>
    </div>
  </div>

  <!-- Report Modal -->
  <div id="reportModal" class="modal">
    <div class="modal-content">
      <h2><i class="fas fa-broadcast-tower"></i> DEPLOY NEW NODE</h2>
      <select id="itemType">
        <option value="lost">🚨 LOST ITEM</option>
        <option value="found">✅ FOUND ITEM</option>
      </select>
      <input type="text" id="itemName" placeholder="ITEM DESIGNATION">
      <input type="text" id="location" placeholder="LAST KNOWN COORDINATES">
      <textarea id="desc" rows="4" placeholder="DESCRIPTION + UNIQUE MARKERS..."></textarea>
      <button onclick="submitNewNode()" style="width:100%; margin:10px 0 8px;">TRANSMIT NODE</button>
      <button onclick="closeModal()" style="width:100%; background:#222;">CANCEL TRANSMISSION</button>
    </div>
  </div>

  <!-- Node Detail Modal -->
  <div id="nodeViewModal" class="modal">
    <div class="modal-content">
      <h2 id="viewTitle"></h2>
      <div id="viewStatus" style="font-size:2rem; text-align:center; margin:20px 0;"></div>
      <p id="viewDesc"></p>
      
      <div style="margin:25px 0; padding:15px; background:#000; border-radius:10px; font-size:0.9rem;">
        <strong>NETWORK STATUS:</strong> <span style="color:#0f0;">CONNECTED • 17 NODES TRACKING</span><br>
        <strong>MATCH PROBABILITY:</strong> <span id="matchProb">89%</span>
      </div>
      
      <button onclick="closeNodeView()" style="width:100%;">CLOSE CHANNEL</button>
    </div>
  </div>

  <!-- Status Bar -->
  <div class="status-bar">
    <span class="pulse">●</span>
    <span id="statusText">NETWORK LIVE • 142 ACTIVE NODES</span>
  </div>

  <script>
    let currentUser = "@CWOA";

    // Matrix Rain Background
    function createMatrix() {
      const canvas = document.getElementById('matrix-bg');
      const ctx = canvas.getContext('2d');
      
      function resize() {
        canvas.height = window.innerHeight;
        canvas.width = window.innerWidth;
      }
      resize();
      window.addEventListener('resize', resize);

      const chars = "01アイウエオカキクケコ0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ";
      const fontSize = 14;
      let columns = canvas.width / fontSize;
      let drops = Array(Math.floor(columns)).fill(1);

      function draw() {
        ctx.fillStyle = 'rgba(5, 5, 5, 0.1)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#00ff41';
        ctx.font = `${fontSize}px monospace`;

        for (let i = 0; i < drops.length; i++) {
          const text = chars[Math.floor(Math.random() * chars.length)];
          ctx.fillText(text, i * fontSize, drops[i] * fontSize);
          
          if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
            drops[i] = 0;
          }
          drops[i]++;
        }
      }
      setInterval(draw, 35);
    }

    function log(msg) {
      const time = new Date().toLocaleTimeString('en-GB', { hour12: false });
      const logEl = document.getElementById("log");
      logEl.innerHTML += `<span style="color:#00ff8866">[${time}]</span> ${msg}<br>`;
      logEl.scrollTop = logEl.scrollHeight;
    }

    function toggleAuth() {
      document.getElementById('loginForm').classList.toggle('hidden');
      document.getElementById('signupForm').classList.toggle('hidden');
    }

    function login() {
      currentUser = document.getElementById('username').value.trim() || "@CWOA";
      enterApp();
    }

    function signup() {
      currentUser = document.getElementById('newUser').value.trim() || "@NewNode";
      enterApp();
    }

    function enterApp() {
      document.getElementById('authSection').classList.add('hidden');
      document.getElementById('mainApp').classList.remove('hidden');
      log(`✅ NODE ${currentUser} CONNECTED TO ROOTDONATE GRID`);
      loadSampleNodes();
      setTimeout(() => log("📡 3 new matches found in your radius"), 1800);
    }

    function setTab(tab) {
      document.querySelectorAll('.nav button').forEach((btn, i) => {
        btn.classList.toggle('active', i === tab);
      });
    }

    function showReportForm() {
      document.getElementById('reportModal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('reportModal').style.display = 'none';
    }

    function submitNewNode() {
      const name = document.getElementById('itemName').value.trim() || "Unknown Signal";
      const type = document.getElementById('itemType').value;
      const loc = document.getElementById('location').value.trim() || "Unknown Grid";
      
      const nodeHTML = `
        <div class="node">
          <div class="node-header">
            <div><strong>${name}</strong></div>
            <span class="node-type ${type}">${type.toUpperCase()}</span>
          </div>
          <div style="margin:10px 0; color:#aaa;">${loc}</div>
          <div class="node-actions">
            <button onclick="viewNode('${name}', '${type}', '${loc}')"><i class="fas fa-eye"></i> VIEW</button>
            <button onclick="shareNode('${name}')"><i class="fas fa-share-alt"></i> BROADCAST</button>
          </div>
        </div>`;
      
      document.getElementById('nodesList').innerHTML = nodeHTML + document.getElementById('nodesList').innerHTML;
      closeModal();
      log(`📍 NEW ${type.toUpperCase()} NODE DEPLOYED: <strong>${name}</strong>`);
    }

    function viewNode(name, type, loc) {
      document.getElementById('viewTitle').innerHTML = `<i class="fas fa-satellite-dish"></i> ${name}`;
      document.getElementById('viewStatus').innerHTML = 
        `<span style="color:${type==='lost'?'#ff6666':'#00ff88'}">${type.toUpperCase()} • ${loc}</span>`;
      document.getElementById('viewDesc').innerHTML = 
        `Node is broadcasting on the RootDonate mesh.<br><br>Signal strength: EXCELLENT<br>Recovery probability: 94%`;
      document.getElementById('nodeViewModal').style.display = 'flex';
    }

    function closeNodeView() {
      document.getElementById('nodeViewModal').style.display = 'none';
    }

    function shareNode(name) {
      const html = `<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>${name} — ROOTDONATE</title><style>body{background:#000;color:#0f0;font-family:Courier New;text-align:center;padding:40px;} .box{border:3px solid #0f0;padding:40px;max-width:500px;margin:40px auto;border-radius:20px;box-shadow:0 0 40px #0f0;}</style></head><body><div class="box"><h1>${name}</h1><h2 style="color:#0f0">LIVE ON THE GRID</h2><p>This node is part of the global lost &amp; found network.</p></div></body></html>`;
      
      const dataURL = 'data:text/html;base64,' + btoa(unescape(encodeURIComponent(html)));
      
      navigator.clipboard.writeText(dataURL).then(() => {
        log(`🔗 BROADCAST LINK GENERATED FOR ${name}`);
        if (confirm("Broadcast link copied to clipboard.\n\nOpen preview now?")) {
          window.open(dataURL, '_blank');
        }
      });
    }

    function loadSampleNodes() {
      document.getElementById('nodesList').innerHTML = `
        <div class="node">
          <div class="node-header">
            <div><strong>@BlackLeatherWallet</strong></div>
            <span class="node-type lost">LOST</span>
          </div>
          <div style="margin:10px 0; color:#aaa;">Manchester Piccadilly • 2h ago</div>
          <div class="node-actions">
            <button onclick="viewNode('@BlackLeatherWallet', 'lost', 'Manchester Piccadilly')"><i class="fas fa-eye"></i> VIEW</button>
            <button onclick="shareNode('@BlackLeatherWallet')"><i class="fas fa-share-alt"></i> BROADCAST</button>
          </div>
        </div>
        
        <div class="node">
          <div class="node-header">
            <div><strong>@SilverKeychain</strong></div>
            <span class="node-type found">FOUND</span>
          </div>
          <div style="margin:10px 0; color:#aaa;">London Euston • 47m ago</div>
          <div class="node-actions">
            <button onclick="viewNode('@SilverKeychain', 'found', 'London Euston')"><i class="fas fa-eye"></i> VIEW</button>
            <button onclick="shareNode('@SilverKeychain')"><i class="fas fa-share-alt"></i> BROADCAST</button>
          </div>
        </div>
        
        <div class="node">
          <div class="node-header">
            <div><strong>@iPhone16Pro</strong></div>
            <span class="node-type lost">LOST</span>
          </div>
          <div style="margin:10px 0; color:#aaa;">Glasgow Central • 5h ago</div>
          <div class="node-actions">
            <button onclick="viewNode('@iPhone16Pro', 'lost', 'Glasgow Central')"><i class="fas fa-eye"></i> VIEW</button>
            <button onclick="shareNode('@iPhone16Pro')"><i class="fas fa-share-alt"></i> BROADCAST</button>
          </div>
        </div>`;
    }

    function logout() {
      if (confirm("Disconnect from RootDonate network?")) {
        location.reload();
      }
    }

    // Initialize
    window.onload = () => {
      createMatrix();
      
      // Fake live activity
      setInterval(() => {
        if (Math.random() > 0.65 && !document.getElementById('mainApp').classList.contains('hidden')) {
          log("🔄 MATCH ALERT: Potential recovery in progress");
        }
      }, 6500);
    };
  </script>
</body>
</html>
