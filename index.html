<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="#0f172a">
  <title>Firebase + Time-Aware Internet AI</title>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-2: #334155;
      --accent: #3b82f6;
      --text: #f8fafc;
      --muted: #94a3b8;
      --user: #1d4ed8;
      --bot: #1e293b;
      --border: #334155;
      --radius: 16px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; }
    body { display: flex; flex-direction: column; min-height: 100dvh; }
    header {
      background: rgba(30,41,59,.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: .6rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .5rem;
      flex-wrap: wrap;
    }
    .logo { width: 32px; height: 32px; background: linear-gradient(135deg,#3b82f6,#8b5cf6); border-radius: 8px; display: grid; place-items: center; font-weight: 700; }
    select, button {
      background: var(--surface-2); border: none; color: var(--text); border-radius: 8px;
      padding: .4rem .7rem; font-size: .8rem; cursor: pointer;
    }
    button.primary { background: var(--accent); }
    #status { font-size: .75rem; color: var(--muted); text-align: center; padding: .3rem; background: var(--surface); }
    #chat { flex: 1; overflow-y: auto; padding: 1rem .9rem; display: flex; flex-direction: column; gap: .6rem; }
    .msg { max-width: 84%; padding: .7rem .9rem; border-radius: var(--radius); line-height: 1.45; white-space: pre-wrap; word-break: break-word; position: relative; }
    .user { align-self: flex-end; background: var(--user); color: white; border-bottom-right-radius: 4px; }
    .bot { align-self: flex-start; background: var(--bot); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
    .time { font-size: .65rem; color: var(--muted); margin-top: .25rem; opacity: .8; }
    .msg-actions { position: absolute; top: 4px; right: 4px; display: none; gap: 4px; }
    .msg:hover .msg-actions { display: flex; }
    .msg-actions button { background: rgba(0,0,0,.4); color: white; padding: 2px 6px; font-size: .7rem; border-radius: 6px; }
    .input-bar {
      background: var(--surface); border-top: 1px solid var(--border);
      padding: .6rem .9rem; padding-bottom: calc(.6rem + env(safe-area-inset-bottom));
      display: flex; gap: .5rem; align-items: flex-end;
    }
    #input { flex: 1; resize: none; min-height: 48px; max-height: 140px; padding: .7rem; background: var(--surface-2); border: none; color: var(--text); border-radius: var(--radius); font-family: inherit; }
    #send, #stop { width: 48px; height: 48px; border-radius: 50%; background: var(--accent); color: white; border: none; font-size: 1.3rem; }
    #stop { display: none; background: #ef4444; }
  </style>
</head>
<body>
  <header>
    <div style="display:flex;align-items:center;gap:.5rem">
      <div class="logo">AI</div>
      <strong>Firebase + Time AI</strong>
    </div>
    <div style="display:flex;gap:.4rem;flex-wrap:wrap">
      <select id="model">
        <option value="nvidia/nemotron-3-ultra-550b-a55b:free">Nemotron 3 Ultra (free)</option>
        <option value="google/gemma-4-31b-it:free">Gemma 4 31B (free)</option>
        <option value="nvidia/nemotron-3.5-lightning:free">Nemotron Lightning (free)</option>
        <option value="openrouter/free">OpenRouter Free Router</option>
      </select>
      <button id="authBtn">Sign in</button>
      <button id="clearBtn">Clear</button>
    </div>
  </header>

  <div id="status">Ready · Firebase + time-aware internet AI</div>
  <div id="chat"></div>

  <div class="input-bar">
    <textarea id="input" placeholder="Ask anything… (I know the current time)" rows="1"></textarea>
    <button id="send">↑</button>
    <button id="stop">■</button>
  </div>

  <script type="module">
    // ========== CONFIG ==========
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT.firebaseapp.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    const API_URL = "https://openrouter.ai/api/v1/chat/completions";
    const API_KEY = "";
    // ============================

    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithPopup, GoogleAuthProvider, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-auth.js";
    import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-firestore.js";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const chatEl = document.getElementById("chat");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const stopBtn = document.getElementById("stop");
    const clearBtn = document.getElementById("clearBtn");
    const authBtn = document.getElementById("authBtn");
    const modelSelect = document.getElementById("model");
    const statusEl = document.getElementById("status");

    let messages = [];
    let currentUser = null;
    let controller = null;
    let unsubscribe = null;

    function getTimeString() {
      return new Date().toLocaleString(undefined, {
        weekday: "long", year: "numeric", month: "long", day: "numeric",
        hour: "2-digit", minute: "2-digit", second: "2-digit", timeZoneName: "short"
      });
    }

    function setStatus(text) { statusEl.textContent = text; }

    function addMessage(content, role, time = new Date()) {
      const div = document.createElement("div");
      div.className = `msg ${role}`;
      div.innerHTML = `<div>${content}</div><div class="time">${time.toLocaleTimeString()}</div>`;

      const actions = document.createElement("div");
      actions.className = "msg-actions";
      const copy = document.createElement("button");
      copy.textContent = "Copy";
      copy.onclick = () => navigator.clipboard.writeText(content);
      actions.appendChild(copy);
      if (role === "bot") {
        const regen = document.createElement("button");
        regen.textContent = "Regen";
        regen.onclick = regenerate;
        actions.appendChild(regen);
      }
      div.appendChild(actions);

      chatEl.appendChild(div);
      chatEl.scrollTop = chatEl.scrollHeight;
      return div;
    }

    function render() {
      chatEl.innerHTML = "";
      messages.forEach(m => addMessage(m.content, m.role === "user" ? "user" : "bot", m.time ? new Date(m.time) : new Date()));
    }

    async function saveMessage(role, content) {
      const msg = { role, content, time: Date.now() };
      messages.push(msg);
      localStorage.setItem("fb_time_chat", JSON.stringify(messages.slice(-40)));

      if (currentUser) {
        try {
          await addDoc(collection(db, "chats", currentUser.uid, "messages"), {
            role,
            content,
            time: Date.now(),
            createdAt: serverTimestamp()
          });
        } catch (e) { console.warn("Firebase save failed", e); }
      }
    }

    async function streamResponse(history) {
      controller = new AbortController();
      sendBtn.style.display = "none";
      stopBtn.style.display = "grid";
      setStatus("Thinking…");

      const botDiv = addMessage("", "bot");
      const contentEl = botDiv.querySelector("div");
      let full = "";

      const system = {
        role: "system",
        content: `You are a helpful AI assistant. Current date and time is: ${getTimeString()}. Always be aware of the current time when answering questions about dates, schedules, news, or "today".`
      };

      try {
        const res = await fetch(API_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${API_KEY}`,
            "HTTP-Referer": window.location.origin,
            "X-Title": "Firebase Time-Aware AI"
          },
          body: JSON.stringify({
            model: modelSelect.value,
            messages: [system, ...history],
            stream: true,
            temperature: 0.7
          }),
          signal: controller.signal
        });

        if (!res.ok) throw new Error(await res.text());

        const reader = res.body.getReader();
        const decoder = new TextDecoder();

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          const chunk = decoder.decode(value);
          const lines = chunk.split("\n").filter(l => l.startsWith("data: "));
          for (const line of lines) {
            if (line === "data: [DONE]") continue;
            try {
              const json = JSON.parse(line.slice(6));
              const token = json.choices?.[0]?.delta?.content || "";
              if (token) {
                full += token;
                contentEl.textContent = full;
                chatEl.scrollTop = chatEl.scrollHeight;
              }
            } catch {}
          }
        }

        if (full) await saveMessage("assistant", full);
        setStatus("Ready");
      } catch (err) {
        if (err.name !== "AbortError") {
          contentEl.textContent = "Error: " + err.message;
          setStatus("Error");
        }
      } finally {
        controller = null;
        sendBtn.style.display = "grid";
        stopBtn.style.display = "none";
        render();
      }
    }

    async function send() {
      const text = input.value.trim();
      if (!text || controller) return;

      await saveMessage("user", text);
      addMessage(text, "user");
      input.value = "";
      input.style.height = "auto";

      await streamResponse(messages.slice(-12).map(m => ({ role: m.role, content: m.content })));
    }

    function regenerate() {
      if (messages.length < 2 || controller) return;
      if (messages.at(-1).role === "assistant") {
        messages.pop();
        localStorage.setItem("fb_time_chat", JSON.stringify(messages));
        render();
        streamResponse(messages.slice(-12).map(m => ({ role: m.role, content: m.content })));
      }
    }

    onAuthStateChanged(auth, async (user) => {
      currentUser = user;
      if (user) {
        authBtn.textContent = user.isAnonymous ? "Guest" : (user.displayName || "Signed in");
        if (unsubscribe) unsubscribe();
        const q = query(collection(db, "chats", user.uid, "messages"), orderBy("createdAt"));
        unsubscribe = onSnapshot(q, (snap) => {
          messages = snap.docs.map(d => ({
            role: d.data().role,
            content: d.data().content,
            time: d.data().time || Date.now()
          }));
          render();
        });
      } else {
        authBtn.textContent = "Sign in";
        messages = JSON.parse(localStorage.getItem("fb_time_chat") || "[]");
        render();
      }
    });

    authBtn.onclick = async () => {
      if (currentUser) {
        if (confirm("Sign out?")) await signOut(auth);
      } else {
        try {
          await signInAnonymously(auth);
          // Or use Google: await signInWithPopup(auth, new GoogleAuthProvider());
        } catch (e) {
          alert("Auth error: " + e.message);
        }
      }
    };

    sendBtn.onclick = send;
    stopBtn.onclick = () => controller?.abort();
    clearBtn.onclick = () => {
      if (confirm("Clear chat?")) {
        messages = [];
        localStorage.removeItem("fb_time_chat");
        render();
      }
    };

    input.onkeydown = (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    };
    input.oninput = () => {
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 140) + "px";
    };

    messages = JSON.parse(localStorage.getItem("fb_time_chat") || "[]");
    render();
    setStatus(`Ready · Current time: ${getTimeString()}`);
  </script>
</body>
</html>
