<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROOT DONATE • RPG</title>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #00ff9d;
            --accent: #ff00aa;
            --bg: #0a0a0f;
            --card: #111118;
        }
        * { box-sizing: border-box; }
        body { 
            font-family: 'Inter', system_ui, sans-serif; 
            background: var(--bg); 
            color: #e0e0e0; 
            margin:0; 
            padding:20px; 
            min-height:100vh;
        }
        .container { 
            max-width:520px; 
            margin:30px auto; 
            background:var(--card); 
            border-radius:28px; 
            box-shadow:0 30px 90px rgba(0,255,157,0.15); 
            overflow:hidden; 
            border:1px solid #222; 
        }
        .header { 
            background: linear-gradient(135deg, #00ff9d, #ff00aa); 
            color:#000; 
            padding:50px 25px; 
            text-align:center; 
            position:relative; 
        }
        .header h1 { 
            margin:0; 
            font-family:'Space Grotesk', sans-serif; 
            font-size:3rem; 
            font-weight:900; 
            letter-spacing:-3px; 
        }
        .rpg-card { 
            background:#1a1a22; 
            border-radius:20px; 
            padding:20px; 
            margin:18px 0; 
            border:1px solid #333; 
        }
        .stat-bar { 
            height:12px; 
            background:#222; 
            border-radius:999px; 
            overflow:hidden; 
            margin-top:8px; 
        }
        .stat-fill { 
            height:100%; 
            background:linear-gradient(to right, var(--primary), #00cc7a); 
            transition:width 0.6s cubic-bezier(0.23,1,0.32,1); 
        }
        .donate-tier { 
            display:flex; 
            gap:10px; 
            flex-wrap:wrap; 
            margin-top:12px; 
        }
        .tier-btn { 
            flex:1; 
            padding:14px; 
            border-radius:16px; 
            font-weight:700; 
            text-align:center; 
            cursor:pointer; 
            transition:all .2s; 
            border:2px solid #333; 
        }
        .tier-btn:hover { transform:scale(1.05); box-shadow:0 0 20px currentColor; }
        .tier-btn.common { background:#1f2a1f; border-color:#00ff9d; }
        .tier-btn.rare   { background:#1f1f2a; border-color:#00aaff; }
        .tier-btn.epic   { background:#2a1f2a; border-color:#ff00aa; }

        .quest { 
            background:#1a1a22; 
            padding:16px; 
            border-radius:16px; 
            margin:10px 0; 
            display:flex; 
            justify-content:space-between; 
            align-items:center; 
        }
        .quest.completed { opacity:0.6; text-decoration:line-through; }

        .achievement { 
            display:flex; 
            align-items:center; 
            gap:12px; 
            background:#1a1a22; 
            padding:14px; 
            border-radius:16px; 
            margin:8px 0; 
        }
        .achievement.locked { opacity:0.5; filter:grayscale(0.8); }

        #map { height:300px; border-radius:20px; margin:15px 0; }
        .toast { 
            position:fixed; 
            bottom:30px; 
            left:50%; 
            transform:translateX(-50%); 
            background:#111; 
            color:var(--primary); 
            padding:16px 28px; 
            border-radius:999px; 
            box-shadow:0 10px 40px rgba(0,0,0,0.7); 
            z-index:9999; 
            display:none; 
            font-weight:600; 
        }
        .level-badge { 
            position:absolute; 
            top:25px; 
            right:25px; 
            background:#000; 
            color:var(--primary); 
            padding:8px 18px; 
            border-radius:999px; 
            font-weight:900; 
            font-size:0.95rem; 
        }
        .autocomplete-list { 
            position:absolute; 
            width:calc(100% - 50px); 
            background:#1c1c24; 
            border-radius:12px; 
            max-height:280px; 
            overflow-y:auto; 
            z-index:1000; 
            box-shadow:0 10px 30px rgba(0,0,0,0.6); 
            margin-top:4px; 
        }
        .autocomplete-item { 
            padding:14px 16px; 
            cursor:pointer; 
            border-bottom:1px solid #27272f; 
        }
        .autocomplete-item:hover { background:#27272f; }
        .autocomplete-item .type { font-size:0.8rem; color:#888; }
    </style>
</head>
<body>

<!-- AUTH -->
<div class="container" id="authScreen">
    <div class="header">
        <h1>ROOT</h1>
        <p style="margin:10px 0 0; font-size:1.1rem; opacity:0.9;">Donation RPG</p>
    </div>
    <div style="padding:30px;">
        <h2 id="formTitle" style="text-align:center;margin-bottom:25px;">Create Account</h2>
        <input type="email" id="email" placeholder="Email" style="width:100%;padding:16px;margin:10px 0;background:#1c1c24;border:none;border-radius:16px;color:white;">
        <input type="password" id="password" placeholder="Password" style="width:100%;padding:16px;margin:10px 0;background:#1c1c24;border:none;border-radius:16px;color:white;">
        <div id="errorMsg" style="color:#ff6666;text-align:center;margin:10px 0;"></div>
        <button onclick="handleAuth()" style="width:100%;padding:18px;background:var(--primary);color:#000;border:none;border-radius:16px;font-weight:700;font-size:1.1rem;">Continue</button>
        <button onclick="toggleForm()" style="width:100%;padding:16px;background:#222;color:white;border:none;border-radius:16px;margin-top:10px;">Switch to Login</button>
    </div>
</div>

<!-- DASHBOARD -->
<div class="container" id="dashboardScreen" style="display:none;">
    <div class="header">
        <h1>ROOT</h1>
        <div class="level-badge" id="levelBadge">LVL 1 • 0 XP</div>
        <div id="userGreeting" style="margin-top:15px;font-size:1.3rem;font-weight:700;">Guardian</div>
    </div>

    <div style="padding:25px;">
        <!-- Stats, Quests, Allies, Tiers, Scout, Achievements, Log – same clean structure as before -->
        <!-- (Full sections kept from your version – only cleaned) -->

        <!-- CHARACTER STATS -->
        <div class="rpg-card">
            <div style="display:flex;justify-content:space-between;align-items:center;">
                <div>
                    <div style="font-size:1.1rem;font-weight:700;">Guardian Stats</div>
                    <div id="totalDonated" style="color:#888;font-size:0.95rem;">Total Donated: £0</div>
                </div>
                <div style="text-align:right;">
                    <div id="streak" style="font-size:2rem;font-weight:900;line-height:1;">🔥 0</div>
                    <div style="font-size:0.8rem;color:#888;">DAY STREAK</div>
                </div>
            </div>
            <div style="margin-top:15px;">
                <div style="display:flex;justify-content:space-between;font-size:0.9rem;margin-bottom:4px;">
                    <span>XP Progress</span>
                    <span id="xpText">0 / 1000</span>
                </div>
                <div class="stat-bar"><div id="xpBar" class="stat-fill" style="width:0%"></div></div>
            </div>
        </div>

        <!-- QUESTS -->
        <div class="rpg-card">
            <div style="font-weight:700;margin-bottom:12px;">📜 ACTIVE QUESTS</div>
            <div id="questsContainer"></div>
        </div>

        <!-- ALLIES -->
        <div class="rpg-card">
            <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
                <div style="font-weight:700;">YOUR ALLIES</div>
                <button onclick="showAddAllyModal()" style="padding:6px 14px;font-size:0.85rem;background:#222;border:none;border-radius:999px;color:white;">+ Add Ally</button>
            </div>
            <input type="text" id="searchInput" placeholder="Search allies..." onkeyup="filterAllies()" style="width:100%;padding:12px;background:#1c1c24;border:none;border-radius:12px;margin-bottom:12px;">
            <div id="alliesContainer"></div>
        </div>

        <!-- DONATION TIERS -->
        <div class="rpg-card">
            <div style="font-weight:700;margin-bottom:12px;">DONATION TIERS</div>
            <div class="donate-tier">
                <div onclick="quickDonateAll(5,'common')" class="tier-btn common">£5<br><small>Common +50 XP</small></div>
                <div onclick="quickDonateAll(10,'rare')" class="tier-btn rare">£10<br><small>Rare +120 XP</small></div>
                <div onclick="quickDonateAll(25,'epic')" class="tier-btn epic">£25<br><small>Epic +300 XP</small></div>
            </div>
            <div style="margin-top:15px;display:flex;gap:10px;">
                <input type="number" id="customAmount" placeholder="Custom £" style="flex:1;padding:14px;background:#1c1c24;border:none;border-radius:12px;">
                <button onclick="quickDonateCustom()" style="padding:0 25px;background:var(--primary);color:#000;border:none;border-radius:12px;font-weight:700;">Donate</button>
            </div>
        </div>

        <!-- SCOUT TOOL WITH AUTOCOMPLETE -->
        <div class="rpg-card" style="position:relative;">
            <div style="font-weight:700;margin-bottom:12px;">🗺️ SCOUT TOOL</div>
            <input type="text" id="unifiedInput" placeholder="Search place, domain, or @username..." 
                   onkeyup="handleUnifiedInput()" style="width:100%;padding:14px;background:#1c1c24;border:none;border-radius:12px;">
            <div id="unifiedAutocompleteList" class="autocomplete-list" style="display:none;"></div>
            
            <button onclick="performUnifiedLookup()" style="margin-top:10px;width:100%;padding:14px;background:#222;color:white;border:none;border-radius:12px;">Scout / Resolve</button>
            <div id="unifiedResult" style="margin-top:12px;"></div>
            <div id="map"></div>
        </div>

        <!-- ACHIEVEMENTS & LOG -->
        <div class="rpg-card">
            <div style="font-weight:700;margin-bottom:12px;">🏆 ACHIEVEMENTS</div>
            <div id="achievementsContainer"></div>
        </div>
        <div class="rpg-card">
            <div style="font-weight:700;margin-bottom:12px;">📖 LEGEND LOG</div>
            <div id="historyContainer" style="max-height:220px;overflow-y:auto;"></div>
        </div>

        <button onclick="logout()" style="width:100%;padding:16px;background:#222;color:white;border:none;border-radius:16px;margin-top:20px;">Logout</button>
    </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
<script>
// ==================== CONFIG & STATE ====================
const firebaseConfig = { /* your config */ };
firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();

let currentUser = null;
let allies = [], donationHistory = [], quests = [/* your quests */], achievements = [/* your achievements */];
let xp = 0, level = 1, streak = 0, totalDonated = 0;
let mapInstance = null, lastDonationDate = null, selectedResult = null;

// ==================== UTILITIES (unchanged + improved) ====================
function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.style.display = 'block';
    setTimeout(() => t.style.display = 'none', 2800);
}
function confettiBurst() { confetti({particleCount:120,spread:80,origin:{y:0.6}}); }

// Save / Load, updateStats, gainXP, checkQuests, etc. – kept from your version (cleaned)

// ==================== SCOUT TOOL – FULL AUTOCOMPLETE ====================
let debounceTimer;
async function handleUnifiedInput() {
    clearTimeout(debounceTimer);
    const input = document.getElementById('unifiedInput');
    const list = document.getElementById('unifiedAutocompleteList');
    list.style.display = 'none';
    list.innerHTML = '';

    const q = input.value.trim();
    if (q.length < 2) return;

    debounceTimer = setTimeout(async () => {
        try {
            // Places
            const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&limit=6`);
            const places = await res.json();

            places.forEach(p => {
                const div = document.createElement('div');
                div.className = 'autocomplete-item';
                div.innerHTML = `${p.display_name}<div class="type">📍 ${p.type || 'Place'}</div>`;
                div.onclick = () => {
                    input.value = p.display_name;
                    selectedResult = {type:'place', data:p};
                    list.style.display = 'none';
                };
                list.appendChild(div);
            });

            // Domain hint
            if (/^[a-zA-Z0-9-]+\.[a-zA-Z]{2,}/.test(q)) {
                const div = document.createElement('div');
                div.className = 'autocomplete-item';
                div.innerHTML = `${q}<div class="type">🌐 Domain / IP</div>`;
                div.onclick = () => {
                    input.value = q;
                    selectedResult = {type:'domain', data:q};
                    list.style.display = 'none';
                };
                list.appendChild(div);
            }

            if (places.length || list.children.length) list.style.display = 'block';
        } catch(e) {}
    }, 300);
}

async function performUnifiedLookup() {
    const val = document.getElementById('unifiedInput').value.trim();
    const resultDiv = document.getElementById('unifiedResult');
    if (!val) return;

    resultDiv.innerHTML = 'Searching...';
    selectedResult = selectedResult || {};

    try {
        if (selectedResult.type === 'place') {
            const p = selectedResult.data;
            const lat = parseFloat(p.lat), lon = parseFloat(p.lon);
            resultDiv.innerHTML = `<strong>${val}</strong><br>${p.display_name}<br><span style="color:var(--primary)">📍 Found</span>`;
            updateMap(lat, lon, val);
            return;
        }

        // Domain / IP
        const dns = await fetch(`https://dns.google/resolve?name=${encodeURIComponent(val)}&type=A`);
        const dnsData = await dns.json();
        const ip = dnsData.Answer?.find(a => a.type === 1)?.data;

        if (ip) {
            const geo = await (await fetch(`https://ipapi.co/${ip}/json/`)).json();
            const lat = parseFloat(geo.latitude), lon = parseFloat(geo.longitude);
            resultDiv.innerHTML = `<strong>${val}</strong><br>IP: ${ip}<br>${geo.city || ''}, ${geo.country_name || ''}`;
            updateMap(lat, lon, val);
        } else {
            // Fallback place search
            const places = await (await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(val)}&limit=1`)).json();
            if (places[0]) {
                const p = places[0];
                updateMap(parseFloat(p.lat), parseFloat(p.lon), val);
                resultDiv.innerHTML = `<strong>${val}</strong><br>${p.display_name}<br><span style="color:var(--primary)">📍 Place found</span>`;
            } else throw new Error();
        }
    } catch(e) {
        resultDiv.innerHTML = `<span style="color:#ff6666;">Could not resolve.</span>`;
    }
}

function updateMap(lat, lon, title = '') {
    if (!mapInstance) {
        mapInstance = L.map('map').setView([lat, lon], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(mapInstance);
    } else mapInstance.setView([lat, lon], 13);
    mapInstance.eachLayer(l => { if (l instanceof L.Marker) mapInstance.removeLayer(l); });
    L.marker([lat, lon]).bindPopup(title).addTo(mapInstance);
}

// ==================== REST OF YOUR RPG LOGIC (cleaned) ====================
// ... (All your existing functions: renderAllies, quickDonate*, recordDonation, etc.)

// Init
auth.onAuthStateChanged(user => { if (user) { currentUser = user; showDashboard(); }});
</script>
</body>
</html>
