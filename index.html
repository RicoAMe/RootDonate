<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ROOTDONATE • LOST & FOUND NODES</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    :root {
      --neon: #00ff41;
      --neon-dark: #00cc33;
      --neon-glow: #00ff4188;
      --bg: #050505;
      --card: #0a0a0a;
      --accent: #00ff41;
    }

    * { box-sizing: border-box; }
    body {
      font-family: 'Courier New', monospace;
      background: var(--bg);
      color: var(--neon);
      margin: 0;
      padding: 0;
      overflow: hidden;
      line-height: 1.6;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    canvas#matrix-bg {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: -1;
      opacity: 0.12;
      pointer-events: none;
    }

    .auth-container {
      width: 100%;
      max-width: 460px;
      background: var(--card);
      border: 3px solid var(--neon);
      border-radius: 20px;
      box-shadow: 
        0 0 60px var(--neon-glow),
        inset 0 0 40px rgba(0, 255, 65, 0.08);
      overflow: hidden;
      position: relative;
    }

    .auth-header {
      padding: 30px 40px 20px;
      text-align: center;
      border-bottom: 1px solid rgba(0, 255, 65, 0.2);
      position: relative;
    }

    .auth-header::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 3px;
      background: linear-gradient(90deg, transparent, var(--neon), transparent);
      animation: scanline 4s linear infinite;
    }

    .auth-header h1 {
      font-size: 2.4rem;
      margin: 0;
      text-shadow: 0 0 20px var(--neon);
      letter-spacing: 4px;
    }

    .auth-header p {
      margin: 8px 0 0;
      opacity: 0.7;
      font-size: 0.95rem;
      letter-spacing: 2px;
    }

    .tab-switch {
      display: flex;
      background: #000;
      border-bottom: 2px solid var(--neon);
    }

    .tab {
      flex: 1;
      padding: 18px;
      text-align: center;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
      border-bottom: 3px solid transparent;
    }

    .tab.active {
      background: rgba(0, 255, 65, 0.1);
      color: #fff;
      border-bottom: 3px solid var(--neon);
      text-shadow: 0 0 15px var(--neon);
    }

    .form-container {
      padding: 40px;
    }

    .input-group {
      margin-bottom: 24px;
      position: relative;
    }

    .input-group label {
      display: block;
      margin-bottom: 8px;
      font-size: 0.9rem;
      opacity: 0.8;
    }

    .input-wrapper {
      position: relative;
    }

    .input-wrapper i {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      opacity: 0.6;
    }

    input {
      width: 100%;
      background: #000;
      border: 2px solid rgba(0, 255, 65, 0.4);
      color: var(--neon);
      padding: 16px 20px 16px 52px;
      font-size: 1.05rem;
      border-radius: 50px;
      transition: all 0.3s;
    }

    input:focus {
      outline: none;
      border-color: var(--neon);
      box-shadow: 0 0 25px var(--neon-glow);
    }

    .password-toggle {
      position: absolute;
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      opacity: 0.7;
    }

    .btn {
      width: 100%;
      padding: 18px;
      background: transparent;
      color: var(--neon);
      border: 3px solid var(--neon);
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      margin-top: 10px;
      transition: all 0.4s;
      text-transform: uppercase;
      letter-spacing: 2px;
      box-shadow: 0 0 20px rgba(0, 255, 65, 0.3);
    }

    .btn:hover {
      background: var(--neon);
      color: #000;
      box-shadow: 0 0 40px var(--neon);
      transform: translateY(-3px);
    }

    .btn:active {
      transform: scale(0.98);
    }

    .divider {
      text-align: center;
      margin: 30px 0;
      position: relative;
      color: #666;
    }

    .divider::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 1px;
      background: rgba(0, 255, 65, 0.2);
    }

    .divider span {
      background: var(--card);
      padding: 0 20px;
    }

    .glitch {
      animation: glitch 1.2s infinite;
    }

    @keyframes glitch {
      0% { text-shadow: 2px 0 #00ff41, -2px 0 #ff00ff; }
      20% { text-shadow: -2px 0 #00ff41, 2px 0 #ff00ff; }
      40% { text-shadow: 2px 0 #00ff41, -2px 0 #ff00ff; }
      100% { text-shadow: 2px 0 #00ff41, -2px 0 #ff00ff; }
    }

    .status {
      text-align: center;
      margin-top: 20px;
      font-size: 0.9rem;
      opacity: 0.8;
    }

    .footer-links {
      text-align: center;
      padding: 20px;
      font-size: 0.85rem;
      opacity: 0.6;
    }

    .footer-links a {
      color: var(--neon);
      text-decoration: none;
    }

    .scanline {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 100%;
      background: linear-gradient(transparent, rgba(0, 255, 65, 0.03), transparent);
      pointer-events: none;
      animation: scan 6s linear infinite;
      z-index: 1;
    }
  </style>
</head>
<body>

  <canvas id="matrix-bg"></canvas>

  <!-- MASTERPIECE AUTH SECTION -->
  <div class="auth-container" id="authContainer">
    <div class="scanline"></div>

    <div class="auth-header">
      <h1 class="glitch">ROOTDONATE</h1>
      <p>LOST &amp; FOUND NODE NETWORK • EST 2026</p>
    </div>

    <!-- Tabs -->
    <div class="tab-switch">
      <div class="tab active" id="loginTab" onclick="switchTab(0)">LOGIN NODE</div>
      <div class="tab" id="signupTab" onclick="switchTab(1)">NEW NODE</div>
    </div>

    <!-- Login Form -->
    <div class="form-container" id="loginForm">
      <div class="input-group">
        <label>NODE ID / HANDLE</label>
        <div class="input-wrapper">
          <i class="fas fa-user-secret"></i>
          <input type="text" id="loginHandle" placeholder="@CWOA" value="@CWOA">
        </div>
      </div>

      <div class="input-group">
        <label>ENCRYPTED PASSPHRASE</label>
        <div class="input-wrapper">
          <i class="fas fa-key"></i>
          <input type="password" id="loginPass" placeholder="••••••••••">
          <span class="password-toggle" onclick="togglePassword(this)"><i class="fas fa-eye"></i></span>
        </div>
      </div>

      <button class="btn" onclick="performLogin()">
        <i class="fas fa-plug"></i> CONNECT TO MESH
      </button>

      <div class="divider"><span>OR</span></div>

      <button class="btn" onclick="quickLogin()" style="background:rgba(0,255,65,0.1); border-color:#00ff4188;">
        <i class="fas fa-bolt"></i> QUICK CONNECT (DEMO)
      </button>

      <div class="status" id="loginStatus"></div>
    </div>

    <!-- Signup Form -->
    <div class="form-container hidden" id="signupForm">
      <div class="input-group">
        <label>CHOOSE NODE HANDLE</label>
        <div class="input-wrapper">
          <i class="fas fa-user-secret"></i>
          <input type="text" id="signupHandle" placeholder="@YOURNAME">
        </div>
      </div>

      <div class="input-group">
        <label>EMAIL (FOR RECOVERY)</label>
        <div class="input-wrapper">
          <i class="fas fa-envelope"></i>
          <input type="email" id="signupEmail" placeholder="you@darknet.node">
        </div>
      </div>

      <div class="input-group">
        <label>CREATE PASSPHRASE</label>
        <div class="input-wrapper">
          <i class="fas fa-key"></i>
          <input type="password" id="signupPass" placeholder="Minimum 12 characters">
          <span class="password-toggle" onclick="togglePassword(this)"><i class="fas fa-eye"></i></span>
        </div>
      </div>

      <div class="input-group">
        <label>CONFIRM PASSPHRASE</label>
        <div class="input-wrapper">
          <i class="fas fa-key"></i>
          <input type="password" id="signupPassConfirm" placeholder="Repeat passphrase">
        </div>
      </div>

      <button class="btn" onclick="performSignup()">
        <i class="fas fa-plus-circle"></i> DEPLOY NEW NODE
      </button>

      <div class="status" id="signupStatus"></div>
    </div>

    <div class="footer-links">
      <a href="#">FORGOT PASSPHRASE?</a> • 
      <a href="#">TOR RELAY</a> • 
      <a href="#">MESH STATUS</a>
    </div>
  </div>

  <!-- MAIN APP (hidden initially) -->
  <div id="mainApp" class="hidden" style="width:100%; max-width:1100px; margin:20px auto; padding:25px; background:var(--card); border:2px solid var(--neon); border-radius:20px; box-shadow:0 0 40px rgba(0,255,65,0.4); position:relative;">
    <!-- Your existing main content here -->
    <div class="header">
      <h1>🔗 ROOTDONATE</h1>
      <p class="subtitle">LOST &amp; FOUND NODE NETWORK • LIVE INTERNET SCAN</p>
    </div>

    <div class="nav">
      <button onclick="setTab(0)" class="active"><i class="fas fa-network-wired"></i> ALL NODES</button>
      <button onclick="setTab(1)"><i class="fas fa-search"></i> SEARCH INTERNET</button>
      <button onclick="showReportForm()"><i class="fas fa-plus-circle"></i> NEW NODE</button>
      <button onclick="logout()"><i class="fas fa-power-off"></i> DISCONNECT</button>
    </div>

    <div id="searchPanel" class="hidden">
      <input type="text" id="searchInput" class="search-bar" placeholder="SEARCH INTERNET NODES (e.g. iphone, wallet, cat...)" onkeyup="debouncedSearch()">
      <div id="searchResults" style="min-height:400px;"></div>
    </div>

    <div id="nodesList"></div>

    <h2 style="margin:40px 0 15px 10px; font-size:1.4rem;">NETWORK ACTIVITY LOG</h2>
    <div id="log" class="log"></div>
  </div>

  <script>
    // Matrix Rain Background
    const canvas = document.getElementById('matrix-bg');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const chars = "01アイウエオカキクケコ0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ@#$%^&*()";
    const fontSize = 14;
    const columns = canvas.width / fontSize;
    const drops = Array(Math.floor(columns)).fill(1);

    function drawMatrix() {
      ctx.fillStyle = 'rgba(5, 5, 5, 0.08)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#00ff41';
      ctx.font = `${fontSize}px monospace`;

      for (let i = 0; i < drops.length; i++) {
        const text = chars[Math.floor(Math.random() * chars.length)];
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);

        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
          drops[i] = 0;
        }
        drops[i]++;
      }
    }
    setInterval(drawMatrix, 35);

    // Tab switching
    function switchTab(tab) {
      document.getElementById('loginTab').classList.toggle('active', tab === 0);
      document.getElementById('signupTab').classList.toggle('active', tab === 1);
      
      document.getElementById('loginForm').classList.toggle('hidden', tab !== 0);
      document.getElementById('signupForm').classList.toggle('hidden', tab !== 1);
    }

    // Password toggle
    function togglePassword(el) {
      const input = el.parentElement.querySelector('input');
      if (input.type === 'password') {
        input.type = 'text';
        el.innerHTML = '<i class="fas fa-eye-slash"></i>';
      } else {
        input.type = 'password';
        el.innerHTML = '<i class="fas fa-eye"></i>';
      }
    }

    // Demo Login
    function performLogin() {
      const status = document.getElementById('loginStatus');
      status.innerHTML = `<span style="color:#0f0;">ENCRYPTING CONNECTION...</span>`;
      
      setTimeout(() => {
        status.innerHTML = `<span style="color:#0f0;">✅ NODE AUTHENTICATED • TUNNEL ESTABLISHED</span>`;
        setTimeout(() => {
          document.getElementById('authContainer').classList.add('hidden');
          document.getElementById('mainApp').classList.remove('hidden');
          log(`✅ NODE @CWOA CONNECTED TO MESH`);
          loadSampleNodes();
        }, 800);
      }, 1200);
    }

    function quickLogin() {
      document.getElementById('loginStatus').innerHTML = `<span style="color:#0f0;">INSTANT TUNNEL OPENED...</span>`;
      setTimeout(() => {
        document.getElementById('authContainer').classList.add('hidden');
        document.getElementById('mainApp').classList.remove('hidden');
        log(`✅ QUICK CONNECT SUCCESSFUL • @CWOA`);
        loadSampleNodes();
      }, 600);
    }

    function performSignup() {
      const status = document.getElementById('signupStatus');
      const handle = document.getElementById('signupHandle').value || "@NEWNODE";
      
      status.innerHTML = `<span style="color:#0f0;">DEPLOYING NODE TO DARKNET...</span>`;
      
      setTimeout(() => {
        status.innerHTML = `<span style="color:#0f0;">✅ NODE ${handle} DEPLOYED • WELCOME TO THE MESH</span>`;
        setTimeout(() => {
          document.getElementById('authContainer').classList.add('hidden');
          document.getElementById('mainApp').classList.remove('hidden');
          log(`🆕 NEW NODE ${handle} JOINED THE NETWORK`);
          loadSampleNodes();
        }, 900);
      }, 1400);
    }

    // Placeholder functions (add your original ones here)
    function log(msg) {
      console.log(msg); // Replace with your real log
    }
    
    function loadSampleNodes() {
      console.log("Sample nodes loaded");
    }
    
    function setTab(n) { console.log("Tab", n); }
    function logout() {
      document.getElementById('mainApp').classList.add('hidden');
      document.getElementById('authContainer').classList.remove('hidden');
    }
    function showReportForm() { alert("New Node Report - Demo"); }
    function debouncedSearch() { /* your search */ }

    // Keyboard support
    document.addEventListener('keydown', (e) => {
      if (e.key === "Enter") {
        if (!document.getElementById('loginForm').classList.contains('hidden')) {
          performLogin();
        } else {
          performSignup();
        }
      }
    });
  </script>
</body>
</html>
