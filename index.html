<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RootDonate</title>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, doc, setDoc, getDocs, limit } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// ========== REPLACE WITH YOUR CONFIG ==========
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyBvcCBsPiMxS7G2evPjM7sANp-zSy_RkKM",
  authDomain: "rootdonate-61e61.firebaseapp.com",
  databaseURL: "https://rootdonate-61e61-default-rtdb.firebaseio.com",
  projectId: "rootdonate-61e61",
  storageBucket: "rootdonate-61e61.firebasestorage.app",
  messagingSenderId: "754240963907",
  appId: "1:754240963907:web:5417c2763d8f02108bdbf6",
  measurementId: "G-0SC5R5ELT1"
};
// =============================================

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;
let memory = []; // local cache of this user's memory
let unsubMessages = null;

function similarity(a, b) {
  a = a.toLowerCase().trim();
  b = b.toLowerCase().trim();
  if (a === b) return 1;
  if (!a || !b) return 0;
  const setA = new Set(a.split(/\s+/));
  const setB = new Set(b.split(/\s+/));
  let intersect = 0;
  for (const w of setA) if (setB.has(w)) intersect++;
  const union = setA.size + setB.size - intersect;
  const jaccard = union ? intersect / union : 0;
  const lenDiff = Math.abs(a.length - b.length) / Math.max(a.length, b.length);
  return jaccard * 0.7 + (1 - lenDiff) * 0.3;
}

function findBestResponse(input) {
  if (memory.length === 0) return null;
  let best = null;
  let bestScore = 0.28;
  for (const pair of memory) {
    const score = similarity(input, pair.input);
    if (score > bestScore) {
      bestScore = score;
      best = pair.response;
    }
  }
  return best;
}

async function loadMemory(uid) {
  const q = query(collection(db, "users", uid, "memory"), limit(500));
  const snap = await getDocs(q);
  memory = snap.docs.map(d => d.data());
}

async function savePair(uid, input, response) {
  await addDoc(collection(db, "users", uid, "memory"), {
    input: input.trim(),
    response: response.trim(),
    createdAt: Date.now()
  });
  memory.push({ input, response });
  if (memory.length > 500) memory.shift();
}

async function saveMessage(uid, role, content) {
  await addDoc(collection(db, "users", uid, "messages"), {
    role,
    content,
    createdAt: Date.now()
  });
}

function addMessageToUI(text, isUser) {
  const div = document.createElement("div");
  div.className = "msg " + (isUser ? "user" : "bot");
  div.textContent = text;
  document.getElementById("chat").appendChild(div);
  document.getElementById("chat").scrollTop = 99999;
}

async function reply(userText) {
  let response = findBestResponse(userText);
  if (!response) {
    const defaults = [
      "I don't know what to say yet. Tell me more.",
      "Interesting. What do you think?",
      "I'm still learning from you.",
      "Can you explain that differently?",
      "Why do you say that?",
      "That's new to me."
    ];
    response = defaults[Math.floor(Math.random() * defaults.length)];
  }

  addMessageToUI(response, false);
  if (currentUser) {
    await savePair(currentUser.uid, userText, response);
    await saveMessage(currentUser.uid, "assistant", response);
  }
}

// Auth
onAuthStateChanged(auth, async (user) => {
  if (user) {
    currentUser = user;
    document.getElementById("status").textContent = "Signed in (anonymous)";
    await loadMemory(user.uid);

    // Live chat history
    if (unsubMessages) unsubMessages();
    const q = query(collection(db, "users", user.uid, "messages"), orderBy("createdAt"));
    unsubMessages = onSnapshot(q, (snap) => {
      document.getElementById("chat").innerHTML = "";
      snap.forEach(doc => {
        const d = doc.data();
        addMessageToUI(d.content, d.role === "user");
      });
    });
  } else {
    currentUser = null;
    document.getElementById("status").textContent = "Not signed in";
  }
});

// UI
document.getElementById("signIn").onclick = () => signInAnonymously(auth);
document.getElementById("send").onclick = async () => {
  const text = document.getElementById("input").value.trim();
  if (!text || !currentUser) return;
  document.getElementById("input").value = "";
  addMessageToUI(text, true);
  await saveMessage(currentUser.uid, "user", text);
  setTimeout(() => reply(text), 500 + Math.random() * 700);
};
document.getElementById("input").onkeydown = e => {
  if (e.key === "Enter") document.getElementById("send").click();
};

document.getElementById("status").textContent = "Click Sign in to start";
</script>
<style>
:root { --bg:#0f172a; --surface:#1e293b; --accent:#10b981; --text:#f1f5f9; }
* { box-sizing:border-box; margin:0; padding:0; }
body { background:var(--bg); color:var(--text); font-family:system-ui,sans-serif; height:100dvh; display:flex; flex-direction:column; }
header { background:var(--surface); padding:0.8rem 1rem; display:flex; justify-content:space-between; align-items:center; gap:1rem; }
#chat { flex:1; overflow-y:auto; padding:1rem; display:flex; flex-direction:column; gap:0.6rem; }
.msg { max-width:80%; padding:0.7rem 1rem; border-radius:16px; line-height:1.4; }
.user { align-self:flex-end; background:var(--accent); color:black; border-bottom-right-radius:4px; }
.bot { align-self:flex-start; background:var(--surface); border-bottom-left-radius:4px; }
.input-bar { display:flex; gap:0.5rem; padding:0.6rem; background:var(--surface); }
#input { flex:1; padding:0.7rem; border:none; border-radius:20px; background:#334155; color:white; }
button { padding:0.6rem 1rem; border:none; border-radius:20px; background:var(--accent); color:black; font-weight:600; cursor:pointer; }
#status { font-size:0.8rem; color:#94a3b8; }
</style>
</head>
<body>
<header>
  <div>
    <strong>Cleverbot + Firebase</strong>
    <div id="status"></div>
  </div>
  <button id="signIn">Sign in (Anonymous)</button>
</header>
<div id="chat"></div>
<div class="input-bar">
  <input id="input" placeholder="Talk to me... I learn from you" disabled>
  <button id="send" disabled>Send</button>
</div>
<script>
// Enable input after sign-in
const observer = new MutationObserver(() => {
  const signed = document.getElementById("status").textContent.includes("Signed");
  document.getElementById("input").disabled = !signed;
  document.getElementById("send").disabled = !signed;
});
observer.observe(document.getElementById("status"), { childList: true, characterData: true, subtree: true });
</script>
</body>
</html>
