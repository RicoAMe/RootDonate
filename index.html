<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RootDonate.co.uk - Login / Sign Up</title>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a0f;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 420px;
            margin: 60px auto;
            background: #111118;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        input {
            width: 100%;
            padding: 14px;
            margin: 12px 0;
            background: #1c1c24;
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 1.1rem;
        }
        button {
            width: 100%;
            padding: 16px;
            margin: 12px 0;
            border: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 1.1rem;
            cursor: pointer;
        }
        .btn-primary { background: #00ff9d; color: #000; }
        .btn-secondary { background: #333; color: white; }
        .toggle { 
            color: #00ff9d; 
            cursor: pointer; 
            text-align: center; 
            margin-top: 20px; 
            text-decoration: underline;
        }
        .error { color: #ff6666; text-align: center; margin: 10px 0; }
    </style>
</head>
<body>
    <div class="container" id="authForm">
        <h1 style="text-align:center; margin-bottom:20px;">RootDonate.co.uk</h1>
        <h2 id="formTitle" style="text-align:center;">Sign Up</h2>

        <input type="email" id="email" placeholder="Email address" required>
        <input type="password" id="password" placeholder="Password (min 6 characters)" required>

        <div id="errorMsg" class="error"></div>

        <button class="btn-primary" onclick="handleAuth()">Sign Up</button>
        <button class="btn-secondary" onclick="toggleForm()">Already have an account? Login</button>

        <div class="toggle" onclick="toggleForm()" id="toggleText">Need an account? Sign Up</div>
    </div>

    <!-- Profile Page -->
    <div class="container" id="profilePage" style="display:none;">
        <h1>Welcome back!</h1>
        <p id="userEmail" style="color:#00ff9d; font-weight:500;"></p>
        
        <h2>Your Donations (Demo)</h2>
        <p>£50 • £25 • £100</p>
        
        <button class="btn-primary" onclick="makeDonation()">Make New Donation</button>
        <button class="btn-secondary" onclick="logout()">Logout</button>
    </div>

    <script>
        // Your Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyBvcCBsPiMxS7G2evPjM7sANp-zSy_RkKM",
            authDomain: "rootdonate-61e61.firebaseapp.com",
            projectId: "rootdonate-61e61",
            storageBucket: "rootdonate-61e61.firebasestorage.app",
            messagingSenderId: "754240963907",
            appId: "1:754240963907:web:5417c2763d8f02108bdbf6"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        let isLogin = false;

        function toggleForm() {
            isLogin = !isLogin;
            document.getElementById('formTitle').textContent = isLogin ? 'Login' : 'Sign Up';
            document.getElementById('toggleText').textContent = isLogin 
                ? 'Need an account? Sign Up' 
                : 'Already have an account? Login';
            document.getElementById('errorMsg').textContent = '';
        }

        function handleAuth() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorMsg = document.getElementById('errorMsg');

            errorMsg.textContent = '';

            if (!email || !password) {
                errorMsg.textContent = "Please fill in all fields";
                return;
            }

            if (isLogin) {
                auth.signInWithEmailAndPassword(email, password)
                    .then(userCredential => showProfile(userCredential.user.email))
                    .catch(err => errorMsg.textContent = err.message);
            } else {
                auth.createUserWithEmailAndPassword(email, password)
                    .then(userCredential => showProfile(userCredential.user.email))
                    .catch(err => errorMsg.textContent = err.message);
            }
        }

        function showProfile(email) {
            document.getElementById('authForm').style.display = 'none';
            document.getElementById('profilePage').style.display = 'block';
            document.getElementById('userEmail').textContent = email;
        }

        function logout() {
            auth.signOut().then(() => {
                document.getElementById('authForm').style.display = 'block';
                document.getElementById('profilePage').style.display = 'none';
            });
        }

        function makeDonation() {
            const amount = prompt("Enter donation amount (£):", "25");
            if (amount) {
                alert(`Thank you! £${amount} donation recorded (Demo)`);
            }
        }

        // Auto-login if user is already signed in
        auth.onAuthStateChanged(user => {
            if (user) {
                showProfile(user.email);
            }
        });
    </script>
</body>
</html>
