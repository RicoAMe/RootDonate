<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ROOT DONATE • SOCIAL NODE LEARNING LAB</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    :root {
      --neon: #ffd700;
      --glow: #ffd70088;
      --bg: #0a0a0a;
      --card: rgba(20,20,15,0.95);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Courier New', monospace;
      background: var(--bg);
      color: var(--neon);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    canvas#matrix { position: fixed; inset: 0; z-index: -1; opacity: 0.15; }

    .header {
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255,215,0,0.3);
      background: rgba(10,10,10,0.98);
    }
    .header h1 { font-size: 1.45rem; letter-spacing: 3px; text-shadow: 0 0 15px var(--neon); }

    .learn-btn {
      padding: 8px 16px;
      background: transparent;
      border: 1px solid var(--neon);
      color: var(--neon);
      border-radius: 50px;
      cursor: pointer;
    }

    .user-info { display: flex; align-items: center; gap: 12px; cursor: pointer; }
    .avatar {
      width: 38px; height: 38px;
      background: #222;
      border: 2px solid var(--neon);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
    }

    .nav, .search-bar, .nodes-grid, .log, .modal { /* Same styles as before */ }
    /* (Keeping all previous styles for brevity - they remain unchanged) */
    .nav { padding: 12px 20px; display: flex; gap: 8px; flex-wrap: wrap; border-bottom: 1px solid rgba(255,215,0,0.2); background: rgba(10,10,10,0.98); }
    .nav button { background: transparent; border: 1px solid var(--neon); color: var(--neon); padding: 10px 20px; border-radius: 50px; cursor: pointer; }
    .nav button.active, .nav button:hover { background: var(--neon); color: #000; box-shadow: 0 0 25px var(--glow); }

    .search-bar { margin: 16px 20px; padding: 14px 24px; width: calc(100% - 40px); background: #111; border: 1px solid var(--neon); border-radius: 50px; color: var(--neon); }
    .nodes-grid { flex: 1; padding: 16px 20px; overflow-y: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
    .node-card { background: var(--card); border: 1px solid rgba(255,215,0,0.35); border-radius: 16px; padding: 18px; cursor: pointer; transition: all 0.4s; }
    .node-card:hover { transform: translateY(-4px); border-color: var(--neon); box-shadow: 0 0 25px var(--glow); }
    .log { height: 140px; background: #0a0a0a; padding: 12px 20px; overflow-y: auto; font-size: 0.85rem; border-top: 1px solid rgba(255,215,0,0.3); }

    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.96); z-index: 100; align-items: center; justify-content: center; padding: 10px; }
    .modal-content { background: rgba(20,20,15,0.98); border: 2px solid var(--neon); border-radius: 16px; width: 100%; max-width: 520px; padding: 28px; position: relative; }

    .decentralised-badge {
      position: fixed; bottom: 16px; right: 16px; background: rgba(0,0,0,0.85); border: 1px solid var(--neon);
      color: var(--neon); padding: 8px 14px; border-radius: 30px; font-size: 0.78rem; z-index: 200;
    }
  </style>
</head>
<body>

  <canvas id="matrix"></canvas>

  <div class="header">
    <h1>🌐 ROOT DONATE <span style="font-size:0.7rem;opacity:0.6;">SOCIAL NODE LAB</span></h1>
    <div style="display:flex; align-items:center; gap:10px;">
      <button class="learn-btn" onclick="toggleLearnMode()">📖 LEARN MODE</button>
      <div id="userSection" style="display:none;">
        <div class="user-info" onclick="showProfile()">
          <div id="avatar" class="avatar">👤</div>
          <div><div id="usernameDisplay"></div></div>
        </div>
      </div>
      <button onclick="showAuthModal()" id="authBtn"><i class="fas fa-user"></i> LOGIN</button>
    </div>
  </div>

  <div class="nav">
    <button class="active">🌐 LIVE FEED</button>
    <button>🔎 DEEP NUMIS</button>
    <button onclick="showReportModal()">📢 REPORT FIND</button>
    <button onclick="resetScan()">RESET MESH</button>
  </div>

  <input type="text" id="searchInput" class="search-bar" placeholder="Search nodes..." onkeyup="filterNodes()">

  <div class="nodes-grid" id="grid"></div>
  <div class="log" id="log"></div>

  <!-- All modals (Auth, Item, Report) remain the same as your last version -->
  <!-- (I kept them identical for functionality) -->

  <div class="decentralised-badge">
    <i class="fas fa-globe"></i> LEARNING SOCIAL NODE • CLIENT-SIDE ONLY
  </div>

  <script>
    /* ====================== EDUCATIONAL SOCIAL NODE ======================
    
    This project demonstrates core concepts of building a 
    decentralized social network node:

    1. User Identity (Sign Up / Login)
    2. Content Posting (Nodes / Finds)
    3. Local Persistence (localStorage)
    4. Simulated P2P Mesh (auto scan)
    5. Shareable Links (Base64 encoded)
    6. Client-side only architecture

    Perfect for learning how Mastodon, Bluesky, or Nostr nodes work.
    =================================================================== */

    // Matrix Background (Visual effect)
    const canvas = document.getElementById('matrix');
    const ctx = canvas.getContext('2d');
    let drops = [];
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      drops = Array(Math.floor(canvas.width / 14)).fill(1);
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function drawMatrix() {
      ctx.fillStyle = 'rgba(10,10,10,0.15)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#ffd700';
      ctx.font = '14px monospace';
      const chars = '0123456789$€£¥₿🪙⚖️📜🔓💰';
      for (let i = 0; i < drops.length; i++) {
        ctx.fillText(chars[Math.floor(Math.random()*chars.length)], i*14, drops[i]*14);
        if (drops[i]*14 > canvas.height && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
      }
    }
    setInterval(drawMatrix, 40);

    // ==================== APP STATE ====================
    let allNodes = [];
    let currentUser = null;
    let currentItem = null;
    let learnMode = false;

    const logEl = document.getElementById('log');
    function log(msg) {
      const time = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
      logEl.innerHTML += `<span style="opacity:0.6">[${time}]</span> ${msg}<br>`;
      logEl.scrollTop = logEl.scrollHeight;
    }

    function toggleLearnMode() {
      learnMode = !learnMode;
      alert(learnMode ? 
        "LEARN MODE ON\n\nStudy the comments in the <script> section.\nThis teaches you how social nodes work!" : 
        "Learn Mode OFF");
    }

    // ==================== CORE SOCIAL FUNCTIONS ====================

    // 1. User Identity System
    function showAuthModal() { /* same as before */ }
    function signup() { /* creates user object and saves in localStorage */ }
    function login() { /* loads user */ }
    function updateUIAfterLogin() { /* updates header */ }

    // 2. Content (Nodes) System
    function renderNodes(filtered = allNodes) {
      // This is your "Feed" - like a social media timeline
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = 'node-card';
        card.innerHTML = `
          <div style="font-size:0.8rem;opacity:0.7;">#${item.id} • ${item.source}</div>
          <div style="font-size:2.5rem;margin:12px 0;">${item.icon}</div>
          <h3>${item.name}</h3>
          <p>📍 ${item.loc}</p>
          <p style="color:#0f0;">${item.value}</p>
        `;
        card.onclick = () => showItemDetail(item);
        grid.appendChild(card);
      });
    }

    // 3. Simulated Decentralized Mesh (Auto Scan)
    async function startGlobalScan() {
      log("🌐 INITIALIZING SOCIAL NODE...");
      const samples = [ /* sample data */ ];
      for (let i = 0; i < 12; i++) {
        await new Promise(r => setTimeout(r, 100));
        const base = samples[Math.floor(Math.random() * samples.length)];
        const newNode = { ...base, id: `ND-${1000+i}`, source: "P2P NODE", time: "Just now" };
        allNodes.unshift(newNode);
        renderNodes();
        log(`📡 Received node from mesh → ${newNode.name}`);
      }
      log("✅ SOCIAL NODE SYNCHRONISED");
    }

    // Init
    window.onload = () => {
      log("🚀 SOCIAL NODE LEARNING LAB STARTED");
      log("💡 Click LEARN MODE to understand the code");

      // Load user from localStorage (persistent identity)
      const saved = localStorage.getItem('rootDonateUser');
      if (saved) {
        currentUser = JSON.parse(saved);
        updateUIAfterLogin();
      }

      startGlobalScan();   // Simulate receiving posts from network
    };
  </script>
</body>
</html>
