<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Report New Node - RootDonate</title>
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #0a0a0a;
      color: #00ff00;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 620px;
      margin: 40px auto;
      background: #111111;
      padding: 40px;
      border-radius: 12px;
      border: 2px solid #00ff00;
      box-shadow: 0 0 20px rgba(0, 255, 0, 0.3);
    }
    h1 { text-align: center; font-size: 2.3em; }
    .subtitle { text-align: center; color: #0f0; margin-bottom: 30px; }
    input, select, textarea {
      width: 100%;
      padding: 14px;
      margin: 12px 0;
      background: #000;
      border: 1px solid #00ff00;
      border-radius: 8px;
      color: #00ff00;
      font-size: 16px;
    }
    button {
      background: #00ff00;
      color: black;
      padding: 14px;
      font-size: 17px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      width: 100%;
      margin: 15px 0;
    }
    .hidden { display: none; }
    .log {
      background: #000;
      padding: 15px;
      margin-top: 20px;
      border: 1px solid #00ff00;
      border-radius: 8px;
      font-family: monospace;
      max-height: 200px;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📋 REPORT NEW NODE</h1>
    <p class="subtitle">Lost & Found • rootdonate.co.uk</p>

    <!-- Login / Sign Up Section -->
    <div id="authSection">
      <h2 style="text-align:center;">Node Access Required</h2>
      
      <!-- Login -->
      <div id="loginForm">
        <input type="text" id="username" placeholder="Node ID or Username (@CWOA)">
        <input type="password" id="password" placeholder="Password">
        <button onclick="login()">🔓 LOGIN TO REPORT</button>
        <div style="text-align:center; margin:15px 0; color:#00ff88; cursor:pointer;" onclick="toggleForms()">
          Need a node? Sign Up
        </div>
      </div>

      <!-- Sign Up -->
      <div id="signupForm" class="hidden">
        <input type="text" id="newUsername" placeholder="Choose Node Name (@YourHandle)">
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="newPassword" placeholder="Create Password">
        <button onclick="signup()">🚀 CREATE NODE & REPORT</button>
        <div style="text-align:center; margin:15px 0; color:#00ff88; cursor:pointer;" onclick="toggleForms()">
          Already have a node? Login
        </div>
      </div>
    </div>

    <!-- Report Form (shown after login) -->
    <div id="reportForm" class="hidden">
      <h2 style="text-align:center;">New Lost / Found Item</h2>
      
      <select id="type">
        <option value="">-- Select Type --</option>
        <option value="lost">🚨 Lost Item</option>
        <option value="found">✅ Found Item</option>
      </select>
      
      <input type="text" id="itemName" placeholder="Item Name (e.g. Black Leather Wallet)">
      <input type="text" id="location" placeholder="Last Seen / Found Location">
      <input type="text" id="date" placeholder="Date & Time (e.g. Today 14:30)">
      <textarea id="description" rows="4" placeholder="Description, colour, brand, serial number..."></textarea>
      
      <button onclick="submitReport()">📤 SUBMIT REPORT</button>
      <button onclick="logout()">← Logout</button>
    </div>

    <div id="successLog" class="log hidden"></div>
  </div>

  <script>
    function toggleForms() {
      document.getElementById('loginForm').classList.toggle('hidden');
      document.getElementById('signupForm').classList.toggle('hidden');
    }

    function login() {
      const user = document.getElementById('username').value || "@User";
      alert(`✅ Logged in as ${user}`);
      document.getElementById('authSection').classList.add('hidden');
      document.getElementById('reportForm').classList.remove('hidden');
    }

    function signup() {
      const user = document.getElementById('newUsername').value || "@NewNode";
      alert(`🚀 Node created: ${user}\nYou can now report items.`);
      document.getElementById('authSection').classList.add('hidden');
      document.getElementById('reportForm').classList.remove('hidden');
    }

    function submitReport() {
      const type = document.getElementById('type').value;
      const name = document.getElementById('itemName').value || "Unnamed Item";
      
      if (!type) {
        alert("Please select Lost or Found");
        return;
      }

      const success = document.getElementById('successLog');
      success.innerHTML = `[${new Date().toLocaleTimeString()}] ✅ Report submitted successfully!<br>
        Node Type: ${type.toUpperCase()}<br>
        Item: ${name}<br>
        Your report is now live on the network.`;
      success.classList.remove('hidden');

      setTimeout(() => {
        alert("✅ Your new Lost & Found node has been created and shared across the network!");
      }, 800);
    }

    function logout() {
      location.reload();
    }
  </script>
</body>
</html>
