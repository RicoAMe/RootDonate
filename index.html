<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RootDonate • Support Creators</title>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #00ff9d;
            --bg: #0a0a0f;
            --card: #111118;
        }
        
        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 460px;
            margin: 40px auto;
            background: var(--card);
            border-radius: 24px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #00ff9d, #00cc7a);
            color: #000;
            padding: 40px 20px;
            text-align: center;
        }
        
        h1 { margin: 0; font-size: 2.4rem; font-weight: 700; }
        .content { padding: 30px; }
        
        input {
            width: 100%;
            padding: 16px;
            margin: 12px 0;
            background: #1c1c24;
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 1.05rem;
        }
        
        button {
            width: 100%;
            padding: 16px;
            margin: 12px 0;
            border: none;
            border-radius: 12px;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
        }
        
        .btn-primary { background: var(--primary); color: #000; }
        .btn-secondary { background: #333; color: white; }
        
        .apple-pay-btn {
            background: black;
            color: white;
            height: 52px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 15px 0;
        }
        
        .error { color: #ff6666; text-align: center; margin: 10px 0; }
        
        .share-link {
            background: #1c1c24;
            padding: 14px;
            border-radius: 12px;
            font-size: 0.95rem;
            word-break: break-all;
            margin: 15px 0;
            font-family: monospace;
        }
        
        .amount-btn {
            background: #1c1c24;
            padding: 14px;
            margin: 8px 4px;
            border-radius: 12px;
            display: inline-block;
            width: calc(33% - 8px);
            text-align: center;
            cursor: pointer;
            font-weight: 500;
        }
        .amount-btn:hover { background: #27272f; }
    </style>
</head>
<body>

    <!-- Auth Screen -->
    <div class="container" id="authScreen">
        <div class="header">
            <h1>RootDonate</h1>
            <p>Support creators you love</p>
        </div>
        <div class="content">
            <h2 id="formTitle" style="text-align:center; margin-bottom:24px;">Create Account</h2>
            
            <input type="email" id="email" placeholder="Email address" required>
            <input type="password" id="password" placeholder="Password (min 6 characters)" required>
            
            <div id="errorMsg" class="error"></div>
            
            <button class="btn-primary" onclick="handleAuth()">Continue</button>
            <button class="btn-secondary" onclick="toggleForm()">Already have an account? Login</button>
        </div>
    </div>

    <!-- Creator Profile Screen -->
    <div class="container" id="profileScreen" style="display:none;">
        <div class="header">
            <h1 id="creatorName">Creator Name</h1>
            <p id="creatorId">@username</p>
        </div>
        <div class="content">
            <p style="text-align:center; font-size:1.1rem; margin-bottom:25px;">
                Total raised: <strong id="totalRaised">£475</strong>
            </p>
            
            <h3 style="margin:10px 0 15px;">Quick Donate</h3>
            <div onclick="quickDonate(10)" class="amount-btn">£10</div>
            <div onclick="quickDonate(25)" class="amount-btn">£25</div>
            <div onclick="quickDonate(50)" class="amount-btn">£50</div>
            <div onclick="quickDonate(100)" class="amount-btn">£100</div>
            
            <button class="btn-primary" onclick="customDonate()">Custom Amount</button>
            
            <!-- Apple Pay Button -->
            <button class="apple-pay-btn" id="applePayBtn" onclick="startApplePay()" style="display:none;">
                Pay with Apple Pay
            </button>
            
            <div style="margin-top:35px;">
                <strong>Share this profile</strong>
                <div class="share-link" id="shareLink">Generating link...</div>
                <button class="btn-secondary" onclick="copyShareLink()">Copy Share Link</button>
            </div>
            
            <button class="btn-secondary" onclick="logout()" style="margin-top:20px;">Logout</button>
        </div>
    </div>

    <script>
        // ==================== FIREBASE CONFIG ====================
        const firebaseConfig = {
            apiKey: "AIzaSyBvcCBsPiMxS7G2evPjM7sANp-zSy_RkKM",
            authDomain: "rootdonate-61e61.firebaseapp.com",
            projectId: "rootdonate-61e61",
            storageBucket: "rootdonate-61e61.firebasestorage.app",
            messagingSenderId: "754240963907",
            appId: "1:754240963907:web:5417c2763d8f02108bdbf6"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        let currentProfile = null;
        let isLoginMode = false;

        function toggleForm() {
            isLoginMode = !isLoginMode;
            document.getElementById('formTitle').textContent = isLoginMode ? 'Login' : 'Create Account';
            document.getElementById('errorMsg').textContent = '';
        }

        function handleAuth() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorMsg = document.getElementById('errorMsg');

            errorMsg.textContent = '';

            if (!email || !password) {
                errorMsg.textContent = "Please fill in all fields";
                return;
            }

            const promise = isLoginMode 
                ? auth.signInWithEmailAndPassword(email, password)
                : auth.createUserWithEmailAndPassword(email, password);

            promise.then(() => showCreatorProfileDemo())
                   .catch(err => errorMsg.textContent = err.message);
        }

        function showCreatorProfileDemo() {
            currentProfile = { name: "Alex Rivers", id: "alexrivers", total: "475" };
            
            document.getElementById('authScreen').style.display = 'none';
            document.getElementById('profileScreen').style.display = 'block';
            
            document.getElementById('creatorName').textContent = currentProfile.name;
            document.getElementById('creatorId').textContent = `@${currentProfile.id}`;
            document.getElementById('totalRaised').textContent = `£${currentProfile.total}`;
            
            generateShareLink();
            
            // Show Apple Pay button on supported devices
            if (window.ApplePaySession && ApplePaySession.canMakePayments()) {
                document.getElementById('applePayBtn').style.display = 'block';
            }
        }

        // ==================== APPLE PAY ====================
        function startApplePay() {
            if (!currentProfile) return;

            const amount = prompt("Enter donation amount for Apple Pay (£):", "25");
            if (!amount || isNaN(amount)) return;

            const paymentRequest = {
                countryCode: 'GB',
                currencyCode: 'GBP',
                supportedNetworks: ['visa', 'masterCard', 'amex', 'discover'],
                merchantCapabilities: ['supports3DS'],
                lineItems: [{ label: `Donation to ${currentProfile.name}`, amount: parseFloat(amount).toFixed(2) }],
                total: { label: 'RootDonate', amount: parseFloat(amount).toFixed(2) }
            };

            const session = new ApplePaySession(3, paymentRequest);

            session.onvalidatemerchant = (event) => {
                // In real app, call your server to validate
                session.completeMerchantValidation({});
            };

            session.onpaymentauthorized = (event) => {
                // Here you would send payment token to your backend
                console.log("Apple Pay Token:", event.payment.token);
                session.completePayment(ApplePaySession.STATUS_SUCCESS);
                
                alert(`🎉 Thank you! £${parseFloat(amount).toFixed(2)} donated to ${currentProfile.name} via Apple Pay`);
            };

            session.begin();
        }

        // Share Link Functions
        function generateShareLink() {
            const data = btoa(JSON.stringify(currentProfile));
            const url = `${window.location.origin}${window.location.pathname}#data=${data}`;
            document.getElementById('shareLink').textContent = url;
        }

        function copyShareLink() {
            const link = document.getElementById('shareLink').textContent;
            navigator.clipboard.writeText(link)
                .then(() => alert("✅ Share link copied!"))
                .catch(() => alert("Failed to copy"));
        }

        function quickDonate(amount) {
            if (!currentProfile) return;
            alert(`🎉 Thank you! £${amount} donated to ${currentProfile.name}`);
        }

        function customDonate() {
            if (!currentProfile) return;
            const amount = prompt("Enter donation amount (£):", "25");
            if (amount && !isNaN(amount)) {
                alert(`🎉 Thank you! £${parseFloat(amount).toFixed(2)} donated to ${currentProfile.name}`);
            }
        }

        function logout() {
            auth.signOut().then(() => {
                document.getElementById('profileScreen').style.display = 'none';
                document.getElementById('authScreen').style.display = 'block';
            });
        }

        // Load shared profile
        window.onload = function() {
            const hash = window.location.hash;
            if (hash.startsWith('#data=')) {
                try {
                    const profile = JSON.parse(atob(hash.substring(6)));
                    currentProfile = profile;
                    document.getElementById('authScreen').style.display = 'none';
                    document.getElementById('profileScreen').style.display = 'block';
                    
                    document.getElementById('creatorName').textContent = profile.name;
                    document.getElementById('creatorId').textContent = `@${profile.id}`;
                    document.getElementById('totalRaised').textContent = `£${profile.total}`;
                    
                    generateShareLink();
                    
                    if (window.ApplePaySession && ApplePaySession.canMakePayments()) {
                        document.getElementById('applePayBtn').style.display = 'block';
                    }
                } catch(e) {}
            }
        };
    </script>
</body>
</html>
