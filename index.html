<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="ROOTDONATE - Decentralized Lost & Found Node Network">
  <meta name="theme-color" content="#00ff41">
  <title>ROOTDONATE • LOST & FOUND NODES</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    :root {
      --neon: #00ff41;
      --neon-glow: #00ff4188;
      --bg: #050505;
      --card: #0a0a0a;
      --accent: #00ff9d;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Courier New', monospace;
      background: var(--bg);
      color: var(--neon);
      overflow: hidden;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    canvas#matrix-bg {
      position: fixed;
      inset: 0;
      z-index: -1;
      opacity: 0.15;
      pointer-events: none;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: linear-gradient(transparent 50%, rgba(0,255,65,0.03) 50%),
                  radial-gradient(circle at center, transparent 60%, rgba(0,0,0,0.65) 100%);
      pointer-events: none;
      z-index: 1;
      animation: scanline-move 8s linear infinite;
    }

    @keyframes scanline-move {
      0% { background-position: 0 0; }
      100% { background-position: 0 200px; }
    }

    /* AUTH CONTAINER */
    .auth-container {
      width: 100%;
      max-width: 480px;
      background: var(--card);
      border: 3px solid var(--neon);
      border-radius: 24px;
      box-shadow: 0 0 80px var(--neon-glow), inset 0 0 60px rgba(0, 255, 65, 0.1);
      overflow: hidden;
      position: relative;
      z-index: 10;
    }

    .scanline {
      position: absolute;
      inset: 0;
      background: linear-gradient(transparent, rgba(0, 255, 65, 0.06), transparent);
      animation: scan 5s linear infinite;
      pointer-events: none;
      z-index: 2;
    }

    .auth-header {
      padding: 35px 40px 25px;
      text-align: center;
      border-bottom: 1px solid rgba(0, 255, 65, 0.25);
    }

    .auth-header h1 {
      font-size: 3.1rem;
      letter-spacing: 8px;
      text-shadow: 0 0 20px var(--neon), 0 0 40px var(--neon);
      animation: glitch 1.5s infinite;
    }

    .auth-header p {
      opacity: 0.8;
      font-size: 0.95rem;
      letter-spacing: 4px;
      margin-top: 8px;
    }

    .tab-switch {
      display: flex;
      background: #000;
      border-bottom: 3px solid var(--neon);
    }

    .tab {
      flex: 1;
      padding: 20px;
      text-align: center;
      font-size: 1.15rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .tab.active {
      background: rgba(0, 255, 65, 0.15);
      color: white;
      text-shadow: 0 0 20px var(--neon);
    }

    .form-container {
      padding: 40px;
    }

    .input-group {
      margin-bottom: 28px;
    }

    .input-group label {
      display: block;
      margin-bottom: 8px;
      font-size: 0.9rem;
      opacity: 0.75;
      letter-spacing: 1px;
    }

    .input-wrapper {
      position: relative;
    }

    .input-wrapper i {
      position: absolute;
      left: 20px;
      top: 50%;
      transform: translateY(-50%);
      opacity: 0.7;
    }

    input, textarea {
      width: 100%;
      background: #000;
      border: 2px solid rgba(0, 255, 65, 0.45);
      color: var(--neon);
      padding: 16px 20px 16px 52px;
      font-size: 1.1rem;
      border-radius: 50px;
      transition: all 0.4s;
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: var(--neon);
      box-shadow: 0 0 30px var(--neon-glow);
    }

    .password-toggle {
      position: absolute;
      right: 22px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      color: var(--neon);
    }

    .btn {
      width: 100%;
      padding: 18px;
      background: transparent;
      color: var(--neon);
      border: 3px solid var(--neon);
      font-size: 1.2rem;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      margin-top: 12px;
      transition: all 0.4s ease;
      text-transform: uppercase;
      letter-spacing: 3px;
      box-shadow: 0 0 25px rgba(0, 255, 65, 0.4);
    }

    .btn:hover {
      background: var(--neon);
      color: #000;
      transform: translateY(-4px) scale(1.02);
      box-shadow: 0 0 50px var(--neon);
    }

    /* MAIN APP */
    #mainApp {
      width: 100%;
      max-width: 1180px;
      height: 94vh;
      background: var(--card);
      border: 3px solid var(--neon);
      border-radius: 24px;
      box-shadow: 0 0 70px var(--neon-glow);
      display: none;
      flex-direction: column;
      overflow: hidden;
      z-index: 10;
    }

    .header {
      text-align: center;
      padding: 25px 30px;
      border-bottom: 1px solid rgba(0,255,65,0.2);
    }

    .header h1 {
      font-size: 2.6rem;
      letter-spacing: 6px;
    }

    .nav {
      display: flex;
      gap: 12px;
      padding: 20px 30px;
      background: rgba(0,0,0,0.6);
      flex-wrap: wrap;
    }

    .nav button {
      flex: 1;
      min-width: 160px;
      padding: 14px 20px;
      background: transparent;
      color: var(--neon);
      border: 2px solid var(--neon);
      border-radius: 50px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.3s;
    }

    .nav button.active,
    .nav button:hover {
      background: var(--neon);
      color: #000;
      box-shadow: 0 0 25px var(--neon);
    }

    .search-bar {
      width: 100%;
      margin: 0 30px 20px;
      padding: 18px 28px;
      background: #000;
      border: 2px solid var(--neon);
      color: var(--neon);
      font-size: 1.15rem;
      border-radius: 50px;
    }

    .nodes-grid {
      flex: 1;
      padding: 0 30px 20px;
      overflow-y: auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .node-card {
      background: rgba(0, 20, 10, 0.85);
      border: 1px solid rgba(0, 255, 65, 0.3);
      border-radius: 16px;
      padding: 20px;
      transition: all 0.3s;
      cursor: pointer;
    }

    .node-card:hover {
      transform: translateY(-8px);
      border-color: var(--neon);
      box-shadow: 0 0 30px var(--neon-glow);
    }

    .node-card h3 {
      color: var(--accent);
      margin-bottom: 10px;
    }

    .log {
      background: #000;
      border-top: 2px solid var(--neon);
      height: 220px;
      overflow-y: auto;
      padding: 18px;
      font-size: 0.95rem;
      line-height: 1.5;
    }

    /* MODALS */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.95);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }

    .modal-content {
      width: 100%;
      max-width: 620px;
      background: var(--card);
      border: 3px solid var(--neon);
      border-radius: 20px;
      box-shadow: 0 0 80px var(--neon-glow);
      padding: 30px;
      position: relative;
    }

    .close-btn {
      position: absolute;
      top: 15px;
      right: 20px;
      font-size: 2rem;
      cursor: pointer;
      color: var(--neon);
    }

    .share-url {
      background: #000;
      padding: 14px 18px;
      border-radius: 50px;
      font-size: 0.95rem;
      word-break: break-all;
      margin: 20px 0;
      border: 1px solid rgba(0,255,65,0.4);
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .copy-btn {
      background: transparent;
      border: 2px solid var(--neon);
      color: var(--neon);
      padding: 8px 18px;
      border-radius: 50px;
      cursor: pointer;
      font-size: 0.9rem;
      white-space: nowrap;
    }

    @keyframes glitch {
      0%, 100% { text-shadow: 3px 0 #00ff41, -3px 0 #ff00ff; }
      20% { text-shadow: -3px 0 #00ff41, 3px 0 #ff00ff; }
    }

    @keyframes scan {
      0% { transform: translateY(-150%); }
      100% { transform: translateY(400%); }
    }

    .hidden { display: none !important; }
  </style>
</head>
<body>

  <canvas id="matrix-bg"></canvas>
  <div class="overlay"></div>

  <!-- AUTH SECTION -->
  <div class="auth-container" id="authContainer">
    <div class="scanline"></div>

    <div class="auth-header">
      <h1>ROOTDONATE</h1>
      <p>LOST &amp; FOUND NODE NETWORK • EST 2026</p>
    </div>

    <div class="tab-switch">
      <div class="tab active" id="loginTab" onclick="switchTab(0)">LOGIN NODE</div>
      <div class="tab" id="signupTab" onclick="switchTab(1)">DEPLOY NODE</div>
    </div>

    <div class="form-container" id="loginForm">
      <div class="input-group">
        <label>NODE HANDLE</label>
        <div class="input-wrapper">
          <i class="fas fa-user-secret"></i>
          <input type="text" id="loginHandle" value="@CWOA" placeholder="@HANDLE">
        </div>
      </div>
      <div class="input-group">
        <label>PASSPHRASE</label>
        <div class="input-wrapper">
          <i class="fas fa-key"></i>
          <input type="password" id="loginPass" placeholder="••••••••••">
          <span class="password-toggle" onclick="togglePassword(this)"><i class="fas fa-eye"></i></span>
        </div>
      </div>
      <button class="btn" onclick="performLogin()">
        <i class="fas fa-plug"></i> ESTABLISH TUNNEL
      </button>
      <div class="divider"><span>OR</span></div>
      <button class="btn" onclick="quickLogin()" style="background:rgba(0,255,65,0.08);">
        <i class="fas fa-bolt"></i> QUICK MESH CONNECT
      </button>
      <div class="status" id="loginStatus"></div>
    </div>

    <div class="form-container hidden" id="signupForm">
      <div class="input-group">
        <label>NODE HANDLE</label>
        <div class="input-wrapper">
          <i class="fas fa-user-secret"></i>
          <input type="text" id="signupHandle" placeholder="@YOURNAME">
        </div>
      </div>
      <div class="input-group">
        <label>RECOVERY EMAIL</label>
        <div class="input-wrapper">
          <i class="fas fa-envelope"></i>
          <input type="email" id="signupEmail" placeholder="you@darknode.onion">
        </div>
      </div>
      <div class="input-group">
        <label>PASSPHRASE</label>
        <div class="input-wrapper">
          <i class="fas fa-key"></i>
          <input type="password" id="signupPass" placeholder="12+ characters">
          <span class="password-toggle" onclick="togglePassword(this)"><i class="fas fa-eye"></i></span>
        </div>
      </div>
      <button class="btn" onclick="performSignup()">
        <i class="fas fa-satellite-dish"></i> DEPLOY NODE
      </button>
      <div class="status" id="signupStatus"></div>
    </div>

    <div style="text-align:center; padding:20px; font-size:0.85rem; opacity:0.6;">
      <a href="#" style="color:var(--neon); text-decoration:none;">FORGOT PASSPHRASE</a> • 
      <a href="#" style="color:var(--neon); text-decoration:none;">TOR RELAY</a>
    </div>
  </div>

  <!-- MAIN APPLICATION -->
  <div id="mainApp">
    <div class="header">
      <h1>🔗 ROOTDONATE</h1>
      <p style="opacity:0.7; letter-spacing:3px;">LIVE NODE NETWORK • 2026</p>
    </div>

    <div class="nav">
      <button onclick="setTab(0)" class="active"><i class="fas fa-network-wired"></i> ALL NODES</button>
      <button onclick="setTab(1)"><i class="fas fa-search"></i> DEEP SCAN</button>
      <button onclick="showReportForm()"><i class="fas fa-plus-circle"></i> REPORT LOST</button>
      <button onclick="logout()"><i class="fas fa-power-off"></i> DISCONNECT</button>
    </div>

    <input type="text" id="searchInput" class="search-bar" 
           placeholder="SEARCH LOST ITEMS • iphone, passport, wallet..." 
           onkeyup="debouncedSearch()">

    <div class="nodes-grid" id="nodesGrid"></div>

    <h2 style="margin: 20px 30px 10px; font-size:1.4rem;">NETWORK LOG</h2>
    <div id="log" class="log"></div>
  </div>

  <!-- ITEM DETAIL MODAL -->
  <div class="modal" id="itemModal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal()">×</span>
      <div style="text-align:center; margin-bottom:25px;">
        <h2 id="modalItemName" style="color:var(--accent); font-size:2.2rem;"></h2>
        <p id="modalItemId" style="opacity:0.7;"></p>
      </div>

      <div class="share-url">
        <span id="modalUrl"></span>
        <button class="copy-btn" onclick="copyShareLink()">COPY LINK</button>
      </div>

      <p><strong>Location:</strong> <span id="modalLoc"></span></p>
      <p><strong>Found:</strong> <span id="modalTime"></span></p>
      <p><strong>Status:</strong> <span id="modalStatus" style="color:#0f0;"></span></p>

      <button class="btn" onclick="claimItem()" style="margin-top:25px;">
        <i class="fas fa-hand-holding-heart"></i> CLAIM THIS ITEM
      </button>
    </div>
  </div>

  <!-- REPORT LOST MODAL -->
  <div class="modal" id="reportModal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeReportModal()">×</span>
      <h2 style="text-align:center; margin-bottom:25px; color:var(--accent);">REPORT NEW LOST ITEM</h2>

      <input type="text" id="reportItem" placeholder="Item Name (e.g. iPhone 16 Pro)">
      <input type="text" id="reportLoc" placeholder="Last Known Location">
      <textarea id="reportNotes" placeholder="Description, color, serial number..."></textarea>

      <button class="btn" onclick="submitReport()">
        <i class="fas fa-paper-plane"></i> SUBMIT TO MESH
      </button>
    </div>
  </div>

  <script>
    // Matrix Rain
    const canvas = document.getElementById('matrix-bg');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const chars = "01アイウエオカキクケコ0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ$@#%&";
    const fontSize = 15;
    let drops = [];

    function initDrops() {
      drops = Array(Math.floor(canvas.width / fontSize)).fill(1);
    }

    function drawMatrix() {
      ctx.fillStyle = 'rgba(5,5,5,0.1)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#00ff41';
      ctx.font = `${fontSize}px monospace`;

      for (let i = 0; i < drops.length; i++) {
        const text = chars[Math.floor(Math.random() * chars.length)];
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);
        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
      }
    }

    setInterval(drawMatrix, 35);
    initDrops();

    // Core Functions
    function log(msg) {
      const logEl = document.getElementById('log');
      const time = new Date().toLocaleTimeString('en-GB');
      logEl.innerHTML += `<span style="color:#00ff8866">[${time}]</span> ${msg}<br>`;
      logEl.scrollTop = logEl.scrollHeight;
    }

    let sampleNodes = [
      { id: "N-7842", item: "iPhone 16 Pro", loc: "Shibuya Crossing", time: "2m ago", status: "RECOVERED" },
      { id: "N-7841", item: "Leather Passport", loc: "Haneda Airport", time: "17m ago", status: "ACTIVE" },
      { id: "N-7839", item: "Gucci Wallet", loc: "Shinjuku Station", time: "41m ago", status: "ACTIVE" },
      { id: "N-7838", item: "MacBook Air M3", loc: "Roppongi", time: "2h ago", status: "RECOVERED" },
      { id: "N-7837", item: "Rolex Submariner", loc: "Ginza", time: "5h ago", status: "ACTIVE" }
    ];

    function generateBase64Url(node) {
      const data = btoa(JSON.stringify(node));
      return `https://rootdonate.network/item/${data}`;
    }

    function loadSampleNodes() {
      const grid = document.getElementById('nodesGrid');
      grid.innerHTML = '';
      sampleNodes.forEach(node => {
        node.url = generateBase64Url(node);
        const card = document.createElement('div');
        card.className = 'node-card';
        card.innerHTML = `
          <h3>#${node.id}</h3>
          <p><strong>${node.item}</strong></p>
          <p style="opacity:0.8; font-size:0.9rem;">📍 ${node.loc}</p>
          <p style="margin-top:12px; opacity:0.7;">${node.time} • <span style="color:${node.status==='RECOVERED'?'#0f0':'#ff0'}">${node.status}</span></p>
        `;
        card.onclick = () => showItemDetail(node);
        grid.appendChild(card);
      });
    }

    let currentItem = null;

    function showItemDetail(node) {
      currentItem = node;
      document.getElementById('modalItemName').textContent = node.item;
      document.getElementById('modalItemId').textContent = `#${node.id}`;
      document.getElementById('modalUrl').textContent = node.url;
      document.getElementById('modalLoc').textContent = node.loc;
      document.getElementById('modalTime').textContent = node.time;
      document.getElementById('modalStatus').textContent = node.status;
      document.getElementById('itemModal').style.display = 'flex';
      log(`📡 VIEWING ITEM ${node.id}`);
    }

    function closeModal() {
      document.getElementById('itemModal').style.display = 'none';
    }

    function copyShareLink() {
      if (!currentItem) return;
      navigator.clipboard.writeText(currentItem.url).then(() => {
        const btn = document.querySelector('#itemModal .copy-btn');
        const orig = btn.textContent;
        btn.textContent = 'COPIED ✓';
        setTimeout(() => btn.textContent = orig, 2000);
        log(`🔗 BASE64 LINK COPIED`);
      });
    }

    function claimItem() {
      if (confirm("Start claim process?")) {
        log(`🛡️ CLAIM REQUEST SENT FOR ${currentItem.id}`);
        alert("Claim request submitted successfully.");
        closeModal();
      }
    }

    // Report Form
    function showReportForm() {
      document.getElementById('reportModal').style.display = 'flex';
    }

    function closeReportModal() {
      document.getElementById('reportModal').style.display = 'none';
    }

    function submitReport() {
      const itemName = document.getElementById('reportItem').value.trim();
      const location = document.getElementById('reportLoc').value.trim();

      if (!itemName || !location) {
        alert("Item name and location are required.");
        return;
      }

      const newItem = {
        id: "N-" + Math.floor(10000 + Math.random() * 90000),
        item: itemName,
        loc: location,
        time: "Just now",
        status: "ACTIVE"
      };

      sampleNodes.unshift(newItem);
      loadSampleNodes();

      log(`📤 NEW REPORT SUBMITTED: ${itemName}`);
      alert("✅ Report successfully submitted to the mesh network!");

      closeReportModal();
      document.getElementById('reportItem').value = '';
      document.getElementById('reportLoc').value = '';
    }

    // Auth & Navigation
    function switchTab(n) {
      document.getElementById('loginTab').classList.toggle('active', n === 0);
      document.getElementById('signupTab').classList.toggle('active', n === 1);
      document.getElementById('loginForm').classList.toggle('hidden', n !== 0);
      document.getElementById('signupForm').classList.toggle('hidden', n !== 1);
    }

    function togglePassword(el) {
      const input = el.parentElement.querySelector('input');
      const icon = el.querySelector('i');
      if (input.type === 'password') {
        input.type = 'text';
        icon.classList.replace('fa-eye', 'fa-eye-slash');
      } else {
        input.type = 'password';
        icon.classList.replace('fa-eye-slash', 'fa-eye');
      }
    }

    function performLogin() {
      const status = document.getElementById('loginStatus');
      status.innerHTML = `<span style="color:#0f0;">ENCRYPTING TUNNEL...</span>`;
      setTimeout(() => {
        status.innerHTML = `<span style="color:#0f0;">✅ TUNNEL ESTABLISHED • AUTH OK</span>`;
        setTimeout(enterMainApp, 900);
      }, 1200);
    }

    function quickLogin() {
      document.getElementById('loginStatus').innerHTML = `<span style="color:#0f0;">INSTANT MESH LINK...</span>`;
      setTimeout(enterMainApp, 700);
    }

    function performSignup() {
      const status = document.getElementById('signupStatus');
      status.innerHTML = `<span style="color:#0f0;">DEPLOYING NODE TO MESH...</span>`;
      setTimeout(enterMainApp, 1400);
    }

    function enterMainApp() {
      document.getElementById('authContainer').style.display = 'none';
      document.getElementById('mainApp').style.display = 'flex';
      log("✅ CONNECTED TO ROOTDONATE MESH");
      loadSampleNodes();
    }

    function setTab(n) {
      document.querySelectorAll('.nav button').forEach((b, i) => b.classList.toggle('active', i === n));
    }

    function logout() {
      document.getElementById('mainApp').style.display = 'none';
      document.getElementById('authContainer').style.display = 'block';
      log("🔌 DISCONNECTED FROM MESH");
    }

    let searchTimeout;
    function debouncedSearch() {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => {
        const q = document.getElementById('searchInput').value.trim();
        if (q.length > 1) log(`🔍 DEEP SCAN FOR: ${q}`);
      }, 450);
    }

    // Keyboard support
    document.addEventListener('keydown', e => {
      if (e.key === "Enter") {
        if (document.getElementById('authContainer').style.display !== 'none') {
          const isLogin = !document.getElementById('loginForm').classList.contains('hidden');
          isLogin ? performLogin() : performSignup();
        }
      }
    });

    // Initialize
    window.onload = () => {
      log("SYSTEM BOOT SEQUENCE COMPLETE");
    };
  </script>
</body>
</html>
