<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a1f2f">
  <title>EarthMesh • Global Discovery</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

  <style>
    :root {
      --primary: #00b894;
      --accent: #00d2a0;
      --dark: #0a1f2f;
      --card: #13293d;
      --text: #e0f2f1;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--dark);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    .header {
      padding: 16px 20px;
      background: rgba(10, 31, 47, 0.98);
      border-bottom: 1px solid #1e3a5f;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header h1 {
      font-size: 1.65rem;
      font-weight: 600;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .search-container {
      position: relative;
      margin: 16px 20px;
    }

    .search-bar {
      width: 100%;
      padding: 16px 20px 16px 52px;
      background: #1e3a5f;
      border: 1px solid #00b894;
      border-radius: 50px;
      color: white;
      font-size: 1.05rem;
      outline: none;
    }

    .search-bar::placeholder { color: #88a5b8; }

    .suggestions {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: #13293d;
      border: 1px solid #00b894;
      border-radius: 16px;
      margin-top: 8px;
      max-height: 420px;
      overflow-y: auto;
      z-index: 200;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      display: none;
    }

    .suggestion-item {
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
      border-bottom: 1px solid #1e3a5f;
    }

    .suggestion-item:hover {
      background: #1e3a5f;
    }

    .nodes-grid {
      padding: 0 20px 20px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px;
    }

    .place-card {
      background: var(--card);
      border: 1px solid #1e3a5f;
      border-radius: 16px;
      padding: 20px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .place-card:hover {
      transform: translateY(-6px);
      border-color: var(--primary);
      box-shadow: 0 10px 25px rgba(0, 184, 148, 0.2);
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(10, 31, 47, 0.97);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-content {
      background: #13293d;
      border-radius: 20px;
      width: 100%;
      max-width: 560px;
      max-height: 92vh;
      overflow-y: auto;
      padding: 24px;
      border: 1px solid #00b894;
    }

    button {
      padding: 12px 24px;
      border-radius: 50px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
    }

    .primary {
      background: var(--primary);
      color: #000;
      border: none;
      width: 100%;
      margin: 12px 0;
    }

    .log {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 140px;
      background: #0a1f2f;
      padding: 12px 20px;
      font-size: 0.9rem;
      overflow-y: auto;
      border-top: 1px solid #1e3a5f;
      z-index: 10;
    }

    @media (max-width: 480px) {
      .nodes-grid {
        grid-template-columns: 1fr;
        padding: 0 12px 20px;
      }
      .header h1 { font-size: 1.45rem; }
    }
  </style>
</head>
<body>

  <div class="header">
    <h1><i class="fas fa-globe"></i> EarthMesh</h1>
    <button onclick="showAuthModal()" id="authBtn" style="background:transparent; border:1px solid #00b894; color:#00b894;">
      <i class="fas fa-user"></i> Login
    </button>
  </div>

  <div class="search-container">
    <input 
      type="text" 
      id="searchInput" 
      class="search-bar" 
      placeholder="Search any place on Earth..." 
      onkeyup="handleSearch()"
      autocomplete="off">
    <div id="suggestions" class="suggestions"></div>
  </div>

  <div class="nodes-grid" id="grid"></div>

  <div class="log" id="log"></div>

  <!-- Place Detail Modal -->
  <div id="placeModal" class="modal">
    <div class="modal-content">
      <h2 id="modalName" style="margin-bottom:8px;"></h2>
      <p id="modalLoc" style="opacity:0.8; margin-bottom:20px;"></p>
      
      <button onclick="closePlaceModal()" style="background:transparent; border:1px solid #00b894; color:#00b894; width:100%; margin-top:20px;">
        Close
      </button>
    </div>
  </div>

  <script>
    let places = [];
    let currentUser = null;

    const logEl = document.getElementById('log');
    function log(msg) {
      const time = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
      logEl.innerHTML += `<span style="opacity:0.6">[${time}]</span> ${msg}<br>`;
      logEl.scrollTop = logEl.scrollHeight;
    }

    // Free Nominatim Search
    async function nominatimSearch(query) {
      if (query.length < 3) return [];
      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=10&addressdetails=1`, {
          headers: { 'User-Agent': 'EarthMesh-Demo' }
        });
        const data = await res.json();
        return data.map(item => ({
          name: item.name || item.display_name.split(',')[0],
          full: item.display_name,
          icon: "📍"
        }));
      } catch(e) {
        return [];
      }
    }

    async function handleSearch() {
      const q = document.getElementById('searchInput').value.trim();
      const container = document.getElementById('suggestions');

      if (q.length < 3) {
        container.style.display = 'none';
        return;
      }

      container.innerHTML = `<div style="padding:16px; color:#88a5b8;">Searching...</div>`;
      container.style.display = 'block';

      const results = await nominatimSearch(q);
      container.innerHTML = '';

      results.forEach(place => {
        const div = document.createElement('div');
        div.className = 'suggestion-item';
        div.innerHTML = `<span style="font-size:1.5rem;">${place.icon}</span><div><strong>${place.name}</strong><br><small>${place.full}</small></div>`;
        div.onclick = () => {
          document.getElementById('searchInput').value = place.full;
          container.style.display = 'none';

          const newPlace = {
            id: `EM-${Date.now().toString().slice(-6)}`,
            name: place.name,
            loc: place.full,
            icon: place.icon
          };
          places.unshift(newPlace);
          renderPlaces();
          log(`📍 Added: ${place.name}`);
        };
        container.appendChild(div);
      });
    }

    function renderPlaces() {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      places.forEach(place => {
        const card = document.createElement('div');
        card.className = 'place-card';
        card.innerHTML = `
          <div style="font-size:3.2rem; text-align:center; margin:12px 0;">${place.icon}</div>
          <h3>${place.name}</h3>
          <p style="opacity:0.8; font-size:0.95rem;">${place.loc}</p>
        `;
        card.onclick = () => showPlaceDetail(place);
        grid.appendChild(card);
      });
    }

    function showPlaceDetail(place) {
      document.getElementById('modalName').textContent = place.name;
      document.getElementById('modalLoc').textContent = place.loc;
      document.getElementById('placeModal').style.display = 'flex';
    }

    function closePlaceModal() {
      document.getElementById('placeModal').style.display = 'none';
    }

    function showAuthModal() {
      alert("Login system ready (demo)");
    }

    // Initial Load
    window.onload = () => {
      // Sample professional places
      places = [
        { id: "EM-1001", name: "Machu Picchu", loc: "Cusco Region, Peru", icon: "🏔️" },
        { id: "EM-1002", name: "Great Pyramid of Giza", loc: "Cairo, Egypt", icon: "🪦" },
        { id: "EM-1003", name: "Angkor Wat", loc: "Siem Reap, Cambodia", icon: "🛕" },
        { id: "EM-1004", name: "Colosseum", loc: "Rome, Italy", icon: "🏛️" },
        { id: "EM-1005", name: "Yosemite National Park", loc: "California, USA", icon: "🏞️" }
      ];
      renderPlaces();
      log("🌍 EarthMesh initialized — Professional Edition");
    };
  </script>
</body>
</html>
