<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RootDonate.co.uk - Simple Giving Platform</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            background: #0f0f12;
            color: #e0e0e0;
        }
        header {
            background: #1a1a1f;
            padding: 1.5rem 0;
            text-align: center;
        }
        .logo {
            font-size: 2.4rem;
            font-weight: 800;
            color: #00ff9d;
        }
        .hero {
            padding: 120px 20px;
            text-align: center;
            background: linear-gradient(rgba(0,0,0,0.8), rgba(0,0,0,0.8)), url('https://picsum.photos/id/1015/2000/800') center/cover;
        }
        .hero h1 {
            font-size: 3.5rem;
            margin-bottom: 20px;
        }
        .card {
            max-width: 900px;
            margin: -80px auto 60px;
            background: #1a1a1f;
            border-radius: 24px;
            padding: 60px 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
        }
        .amounts {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
            gap: 16px;
            margin: 40px 0;
        }
        .amount-btn {
            padding: 24px;
            background: #25252b;
            border: 3px solid #00ff9d;
            color: white;
            font-size: 1.4rem;
            font-weight: 700;
            border-radius: 16px;
            cursor: pointer;
        }
        .amount-btn:hover {
            background: #00ff9d;
            color: #000;
        }
        .donate-btn {
            width: 100%;
            padding: 28px;
            font-size: 1.8rem;
            font-weight: 700;
            background: #00ff9d;
            color: #000;
            border: none;
            border-radius: 16px;
            cursor: pointer;
            margin-top: 30px;
        }
        .disclaimer {
            margin-top: 60px;
            padding: 25px;
            background: #25252b;
            border-radius: 12px;
            font-size: 0.95rem;
            text-align: center;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">ROOTDONATE</div>
    </header>

    <div class="hero">
        <h1>RootDonate.co.uk</h1>
        <p style="font-size:1.6rem;">Simple, transparent donations for causes that matter.</p>
    </div>

    <div class="card">
        <h2 style="text-align:center;">Make a Donation</h2>

        <div class="amounts">
            <button class="amount-btn" onclick="setAmount(10)">£10</button>
            <button class="amount-btn" onclick="setAmount(25)">£25</button>
            <button class="amount-btn" onclick="setAmount(50)">£50</button>
            <button class="amount-btn" onclick="setAmount(100)">£100</button>
            <button class="amount-btn" onclick="setAmount(250)">£250</button>
        </div>

        <input type="text" id="custom" placeholder="Custom amount (£)" style="width:100%; padding:20px; font-size:1.5rem; text-align:center; background:#25252b; border:3px solid #444; border-radius:12px; color:white;">

        <button class="donate-btn" onclick="donate()">DONATE NOW</button>

        <div class="disclaimer">
            This is a <strong>demo website</strong> for rootdonate.co.uk.<br>
            No real payments are processed. For a production site with live donations, payment gateways (Stripe/PayPal) and legal setup are required.
        </div>
    </div>

    <script>
        function setAmount(val) {
            document.getElementById('custom').value = val;
        }
        function donate() {
            const amt = document.getElementById('custom').value || 25;
            alert(`Thank you! A simulated £${amt} donation has been recorded.\n\n(This is a demo only.)`);
        }
    </script>
</body>
</html>
