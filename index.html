<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ROOT • Donation RPG</title>
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
    
    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #00ff9d;
            --accent: #ff00aa;
            --bg: #0a0a0f;
            --card: #111118;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg);
            color: #e0e0e0;
            line-height: 1.6;
            padding: 12px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 520px;
            margin: 0 auto;
            background: var(--card);
            border-radius: 28px;
            box-shadow: 0 25px 80px rgba(0, 255, 157, 0.15);
            overflow: hidden;
            border: 1px solid #222;
        }
        
        .header {
            background: linear-gradient(135deg, #00ff9d, #ff00aa);
            color: #000;
            padding: 48px 20px 32px;
            text-align: center;
            position: relative;
        }
        
        .header h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2.9rem;
            font-weight: 700;
            letter-spacing: -2px;
        }
        
        .level-badge {
            position: absolute;
            top: 24px;
            right: 24px;
            background: #000;
            color: var(--primary);
            padding: 6px 16px;
            border-radius: 50px;
            font-weight: 800;
            font-size: 0.85rem;
        }
        
        .content { padding: 20px; }
        
        .rpg-card {
            background: #1a1a22;
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 16px;
            border: 1px solid #2a2a32;
        }
        
        .apple-pay-button {
            background: #000;
            color: white;
            border: none;
            border-radius: 16px;
            padding: 18px;
            font-size: 1.1rem;
            font-weight: 700;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.25s ease;
            height: 62px;
            margin: 8px 0;
        }
        
        .apple-pay-button:hover { 
            background: #111; 
            transform: translateY(-2px); 
        }
        .apple-pay-button::before { content: ""; font-size: 1.55rem; }
        
        .ally-card {
            background: #1f1f26;
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 12px;
        }
        
        #map { height: 300px; border-radius: 18px; margin: 12px 0; }
        
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #111;
            color: var(--primary);
            padding: 16px 28px;
            border-radius: 999px;
            font-weight: 600;
            box-shadow: 0 10px 40px rgba(0,0,0,0.7);
            z-index: 10000;
            display: none;
            max-width: 90%;
            text-align: center;
        }
        
        button { font-family: inherit; }
        
        @media (max-width: 480px) {
            body { padding: 8px; }
            .container { border-radius: 24px; }
            .header { padding: 40px 16px 28px; }
            .header h1 { font-size: 2.5rem; }
            #map { height: 260px; }
            .content { padding: 16px; }
        }
    </style>
</head>
<body>

    <!-- AUTH SCREEN -->
    <div class="container" id="authScreen">
        <div class="header">
            <h1>ROOT</h1>
            <p style="margin-top:8px; opacity:0.9; font-size:1.05rem;">Donation RPG</p>
        </div>
        <div class="content">
            <h2 id="formTitle" style="text-align:center; margin:24px 0 20px; font-size:1.4rem;">Welcome Back</h2>
            <input type="email" id="email" placeholder="Email" style="width:100%; padding:18px; margin:8px 0; background:#1c1c24; border:none; border-radius:16px; color:white; font-size:1rem;">
            <input type="password" id="password" placeholder="Password" style="width:100%; padding:18px; margin:8px 0; background:#1c1c24; border:none; border-radius:16px; color:white; font-size:1rem;">
            <div id="errorMsg" style="color:#ff6666; text-align:center; margin:12px 0; min-height:24px;"></div>
            <button onclick="handleAuth()" style="width:100%; padding:18px; background:var(--primary); color:#000; border:none; border-radius:16px; font-weight:700; font-size:1.1rem; margin-top:8px;">Continue</button>
        </div>
    </div>

    <!-- DASHBOARD -->
    <div class="container" id="dashboardScreen" style="display:none;">
        <div class="header">
            <h1>ROOT</h1>
            <div class="level-badge" id="levelBadge">LVL 1 • 0 XP</div>
            <div id="userGreeting" style="margin-top:12px; font-size:1.3rem; font-weight:700;">Guardian</div>
        </div>

        <div class="content">

            <!-- STATS -->
            <div class="rpg-card">
                <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
                    <div>
                        <div style="font-weight:700; font-size:1.1rem;">Your Stats</div>
                        <div id="totalDonated" style="color:#888;">Total Donated: $0</div>
                    </div>
                    <div style="text-align:right;">
                        <div id="streak" style="font-size:2rem; font-weight:900;">🔥 0</div>
                        <div style="font-size:0.8rem; color:#888;">Streak</div>
                    </div>
                </div>
                <div>
                    <div style="display:flex; justify-content:space-between; font-size:0.95rem; margin-bottom:6px;">
                        <span>XP Progress</span>
                        <span id="xpText">0 / 1000</span>
                    </div>
                    <div style="height:10px; background:#222; border-radius:999px; overflow:hidden;">
                        <div id="xpBar" style="height:100%; width:0%; background:linear-gradient(to right, #00ff9d, #00cc7a); transition:width 0.6s ease;"></div>
                    </div>
                </div>
            </div>

            <!-- ALLIES -->
            <div class="rpg-card">
                <div style="font-weight:700; margin-bottom:12px;">👥 Your Allies</div>
                <button onclick="showAddAllyModal()" style="width:100%; padding:16px; background:#222; color:white; border:none; border-radius:16px; font-weight:600; margin-bottom:12px;">
                    + Add New Ally / Creator
                </button>
                <input type="text" id="searchInput" placeholder="Search allies..." onkeyup="filterAllies()" style="width:100%; padding:14px; background:#1c1c24; border:none; border-radius:16px; margin-bottom:12px;">
                <div id="alliesContainer"></div>
            </div>

            <!-- QUICK DONATE -->
            <div class="rpg-card">
                <div style="font-weight:700; margin-bottom:12px;">🍎 Quick Apple Pay</div>
                <button onclick="startApplePay(5,'common')" class="apple-pay-button">Pay $5 • +50 XP</button>
                <button onclick="startApplePay(10,'rare')" class="apple-pay-button">Pay $10 • +120 XP</button>
                <button onclick="startApplePay(25,'epic')" class="apple-pay-button">Pay $25 • +300 XP</button>
            </div>

            <!-- MAP -->
            <div class="rpg-card">
                <div style="font-weight:700; margin-bottom:12px;">🗺️ Allies Map</div>
                <div id="map"></div>
            </div>

            <button onclick="logout()" style="width:100%; padding:18px; background:#222; color:white; border:none; border-radius:16px; font-weight:600; margin-top:8px;">Logout</button>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
    
    <script>
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyBvcCBsPiMxS7G2evPjM7sANp-zSy_RkKM",
            authDomain: "rootdonate-61e61.firebaseapp.com",
            projectId: "rootdonate-61e61",
            storageBucket: "rootdonate-61e61.firebasestorage.app",
            messagingSenderId: "754240963907",
            appId: "1:754240963907:web:5417c2763d8f02108bdbf6"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        let currentUser = null;
        let allies = [];
        let xp = 0, level = 1, totalDonated = 0;
        let mapInstance = null;

        function showToast(msg, color = '#00ff9d') {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.style.color = color;
            t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 2800);
        }

        function confettiBurst() {
            confetti({ particleCount: 160, spread: 90, origin: { y: 0.6 } });
        }

        // Apple Pay
        function startApplePay(amount, tier = 'common', recipient = 'ROOT Fund') {
            if (!window.ApplePaySession || !ApplePaySession.canMakePayments()) {
                showToast("Apple Pay not available on this device", "#ff6666");
                return;
            }

            const session = new ApplePaySession(4, {
                countryCode: "US",
                currencyCode: "USD",
                supportedNetworks: ["visa", "masterCard", "amex", "discover"],
                merchantCapabilities: ["supports3DS"],
                total: { label: `ROOT • ${recipient}`, amount: amount.toFixed(2) }
            });

            session.onvalidatemerchant = () => session.completeMerchantValidation({});
            
            session.onpaymentauthorized = () => {
                setTimeout(() => {
                    session.completePayment(ApplePaySession.STATUS_SUCCESS);
                    showToast(`✅ $${amount} sent to ${recipient}`);
                    confettiBurst();
                    recordDonation(recipient, amount, tier);
                }, 600);
            };

            session.begin();
        }

        function recordDonation(recipient, amount, tier) {
            totalDonated += amount;
            const multiplier = tier === 'epic' ? 12 : tier === 'rare' ? 8 : 5;
            xp += Math.floor(amount * multiplier);

            if (Math.floor(xp / 1000) + 1 > level) {
                level = Math.floor(xp / 1000) + 1;
                showToast(`🎉 LEVEL UP! Now Level ${level}`);
            }

            updateStats();
            renderAllies();
        }

        function updateStats() {
            document.getElementById('levelBadge').textContent = `LVL ${level} • ${xp} XP`;
            document.getElementById('xpText').textContent = `${xp % 1000} / 1000`;
            document.getElementById('xpBar').style.width = `${(xp % 1000) / 10}%`;
            document.getElementById('totalDonated').textContent = `Total Donated: $${totalDonated}`;
        }

        // Allies Management
        function showAddAllyModal() {
            const name = prompt("Creator / Ally Name:");
            if (!name) return;
            const username = prompt("Username / @handle:");
            if (!username) return;

            allies.push({
                name: name.trim(),
                username: username.trim().replace('@',''),
                lat: 35 + Math.random() * 25,
                lon: -80 + Math.random() * 60
            });

            renderAllies();
            refreshMap();
            showToast(`${name} added successfully!`);
        }

        function renderAllies() {
            const container = document.getElementById('alliesContainer');
            container.innerHTML = '';

            if (allies.length === 0) {
                container.innerHTML = `<p style="text-align:center; color:#666; padding:30px 10px;">No allies yet.<br>Tap above to add creators.</p>`;
                return;
            }

            allies.forEach((ally) => {
                const div = document.createElement('div');
                div.className = 'ally-card';
                div.innerHTML = `
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <div>
                            <strong>${ally.name}</strong><br>
                            <small style="color:#888">@${ally.username}</small>
                        </div>
                        <div style="display:flex; gap:8px;">
                            <button onclick="startApplePay(5,'common','@${ally.username}')" class="apple-pay-button" style="width:auto; padding:10px 16px; font-size:0.95rem;">$5</button>
                            <button onclick="startApplePay(10,'rare','@${ally.username}')" class="apple-pay-button" style="width:auto; padding:10px 16px; font-size:0.95rem;">$10</button>
                        </div>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function filterAllies() {
            renderAllies(); // Simple re-render (you can add real filtering later)
        }

        function refreshMap() {
            if (!mapInstance) {
                mapInstance = L.map('map').setView([40, -30], 2);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(mapInstance);
            }

            mapInstance.eachLayer(l => { if (l instanceof L.Marker) mapInstance.removeLayer(l); });

            allies.forEach(ally => {
                L.marker([ally.lat, ally.lon]).addTo(mapInstance)
                    .bindPopup(`<b>${ally.name}</b><br>@${ally.username}`);
            });
        }

        // Auth
        function handleAuth() {
            showToast("Demo login successful");
            document.getElementById('authScreen').style.display = 'none';
            document.getElementById('dashboardScreen').style.display = 'block';
            document.getElementById('userGreeting').textContent = "Guardian";
            updateStats();
            renderAllies();
            refreshMap();
        }

        function logout() {
            document.getElementById('dashboardScreen').style.display = 'none';
            document.getElementById('authScreen').style.display = 'block';
        }

        // Demo Data
        window.onload = () => {
            allies = [
                { name: "Alex Rivera", username: "arivera", lat: 40.7, lon: -74.0 },
                { name: "Luna Voss", username: "lunav", lat: 51.5, lon: -0.1 }
            ];
        };
    </script>
</body>
</html>
