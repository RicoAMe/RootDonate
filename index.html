<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROOT DONATE • RPG • Apple Pay</title>
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
    
    <!-- Leaflet Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&family=Space+Grotesk:wght@500;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #00ff9d;
            --accent: #ff00aa;
            --bg: #0a0a0f;
            --card: #111118;
        }
        
        * { box-sizing: border-box; }
        
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg);
            color: #e0e0e0;
            margin: 0;
            padding: 16px;
            line-height: 1.5;
        }
        
        .container {
            max-width: 520px;
            margin: 20px auto;
            background: var(--card);
            border-radius: 24px;
            box-shadow: 0 25px 80px rgba(0, 255, 157, 0.12);
            overflow: hidden;
            border: 1px solid #222;
        }
        
        .header {
            background: linear-gradient(135deg, #00ff9d, #ff00aa);
            color: #000;
            padding: 40px 20px;
            text-align: center;
            position: relative;
        }
        
        .header h1 {
            margin: 0;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2.8rem;
            font-weight: 900;
            letter-spacing: -2px;
        }
        
        .rpg-card {
            background: #1a1a22;
            border-radius: 18px;
            padding: 18px;
            margin: 14px;
            border: 1px solid #333;
        }
        
        .apple-pay-button {
            background: black;
            color: white;
            border: none;
            border-radius: 14px;
            padding: 16px 20px;
            font-size: 1.05rem;
            font-weight: 700;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin: 8px 0;
            cursor: pointer;
            transition: all 0.2s ease;
            height: 56px;
        }
        
        .apple-pay-button:hover {
            background: #111;
            transform: translateY(-1px);
        }
        
        .apple-pay-button::before {
            content: "";
            font-size: 1.4rem;
        }
        
        #map { height: 320px; border-radius: 16px; margin: 12px 0; }
        
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: #111;
            color: var(--primary);
            padding: 14px 24px;
            border-radius: 999px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            z-index: 9999;
            display: none;
            font-weight: 600;
        }
        
        .level-badge {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #000;
            color: var(--primary);
            padding: 6px 14px;
            border-radius: 999px;
            font-weight: 800;
            font-size: 0.85rem;
        }
        
        .ally-card {
            background: #1f1f26;
            border-radius: 16px;
            padding: 16px;
            margin: 10px 0;
            border: 1px solid #333;
        }
    </style>
</head>
<body>

    <!-- AUTH SCREEN -->
    <div class="container" id="authScreen">
        <div class="header">
            <h1>ROOT</h1>
            <p style="margin:8px 0 0; font-size:1.1rem; opacity:0.9;">Donation RPG • Apple Pay Allies</p>
        </div>
        <div style="padding:24px;">
            <h2 id="formTitle" style="text-align:center; margin-bottom:20px;">Create Account</h2>
            <input type="email" id="email" placeholder="Email" style="width:100%; padding:16px; margin:8px 0; background:#1c1c24; border:none; border-radius:14px; color:white;">
            <input type="password" id="password" placeholder="Password" style="width:100%; padding:16px; margin:8px 0; background:#1c1c24; border:none; border-radius:14px; color:white;">
            <div id="errorMsg" style="color:#ff6666; text-align:center; margin:10px 0; min-height:20px;"></div>
            <button onclick="handleAuth()" style="width:100%; padding:18px; background:var(--primary); color:#000; border:none; border-radius:14px; font-weight:700;">Continue</button>
        </div>
    </div>

    <!-- DASHBOARD -->
    <div class="container" id="dashboardScreen" style="display:none;">
        <div class="header">
            <h1>ROOT</h1>
            <div class="level-badge" id="levelBadge">LVL 1 • 0 XP</div>
            <div id="userGreeting" style="margin-top:12px; font-size:1.25rem; font-weight:700;">Guardian</div>
        </div>

        <div style="padding:8px 0;">
            
            <!-- STATS -->
            <div class="rpg-card">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <div>
                        <div style="font-size:1.1rem; font-weight:700;">Guardian Stats</div>
                        <div id="totalDonated" style="color:#888;">Total Donated: $0</div>
                    </div>
                    <div style="text-align:right;">
                        <div id="streak" style="font-size:1.8rem; font-weight:900;">🔥 0</div>
                        <div style="font-size:0.75rem; color:#888;">DAY STREAK</div>
                    </div>
                </div>
                <div style="margin-top:14px;">
                    <div style="display:flex; justify-content:space-between; font-size:0.9rem; margin-bottom:4px;">
                        <span>XP Progress</span><span id="xpText">0 / 1000</span>
                    </div>
                    <div class="stat-bar"><div id="xpBar" class="stat-fill" style="width:0%"></div></div>
                </div>
            </div>

            <!-- ADD ALLY -->
            <div class="rpg-card">
                <div style="font-weight:700; margin-bottom:10px;">👥 YOUR ALLIES</div>
                <button onclick="showAddAllyModal()" style="width:100%; padding:16px; background:#222; color:white; border:none; border-radius:14px; margin-bottom:12px;">
                    + Add New Ally / Creator
                </button>
                <input type="text" id="searchInput" placeholder="Search allies..." onkeyup="filterAllies()" style="width:100%; padding:12px; background:#1c1c24; border:none; border-radius:12px; margin-bottom:10px;">
                <div id="alliesContainer"></div>
            </div>

            <!-- GLOBAL DONATION -->
            <div class="rpg-card">
                <div style="font-weight:700; margin-bottom:10px;">🍎 GLOBAL APPLE PAY</div>
                <button onclick="startApplePay(5,'common')" class="apple-pay-button">Pay $5 • +50 XP</button>
                <button onclick="startApplePay(10,'rare')" class="apple-pay-button">Pay $10 • +120 XP</button>
                <button onclick="startApplePay(25,'epic')" class="apple-pay-button">Pay $25 • +300 XP</button>
            </div>

            <!-- MAP -->
            <div class="rpg-card">
                <div style="font-weight:700; margin-bottom:10px;">🗺️ ALLIES ON MAP</div>
                <div id="map" style="height:320px;"></div>
            </div>

            <button onclick="logout()" style="width:calc(100% - 28px); margin:16px 14px; padding:16px; background:#222; color:white; border:none; border-radius:14px;">Logout</button>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
    
    <script>
        // Firebase
        const firebaseConfig = { /* your config */ };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        let currentUser = null;
        let allies = [];
        let xp = 0, level = 1, totalDonated = 0;
        let mapInstance = null;

        function showToast(msg, color = '#00ff9d') {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.style.color = color;
            t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 2800);
        }

        function confettiBurst() {
            confetti({ particleCount: 180, spread: 100, origin: { y: 0.6 } });
        }

        // ==================== REAL APPLE PAY ====================
        function canMakeApplePay() {
            return window.ApplePaySession && ApplePaySession.canMakePayments();
        }

        function startApplePay(amount, tier = 'common', recipient = 'ROOT Fund') {
            if (!canMakeApplePay()) {
                showToast("Apple Pay not available on this device", "#ff6666");
                return;
            }

            const session = new ApplePaySession(4, {
                countryCode: 'US',
                currencyCode: 'USD',
                supportedNetworks: ['visa', 'masterCard', 'amex', 'discover'],
                merchantCapabilities: ['supports3DS'],
                total: { label: `ROOT DONATE - ${recipient}`, amount: amount.toFixed(2) }
            });

            session.onvalidatemerchant = (event) => {
                // Replace with real backend validation in production
                session.completeMerchantValidation({});
            };

            session.onpaymentauthorized = (event) => {
                setTimeout(() => {
                    session.completePayment(ApplePaySession.STATUS_SUCCESS);
                    showToast(`✅ $${amount} sent to ${recipient} via Apple Pay!`, '#00ff9d');
                    confettiBurst();
                    recordDonation(recipient, amount, tier);
                }, 700);
            };

            session.begin();
        }

        function recordDonation(recipient, amount, tier) {
            totalDonated += amount;
            const xpGain = Math.floor(amount * (tier === 'epic' ? 12 : tier === 'rare' ? 8 : 5));
            xp += xpGain;

            const newLevel = Math.floor(xp / 1000) + 1;
            if (newLevel > level) {
                level = newLevel;
                showToast(`🎉 LEVEL UP! Now Level ${level}`);
            }

            updateStats();
            renderAllies();
        }

        function updateStats() {
            document.getElementById('levelBadge').textContent = `LVL ${level} • ${xp} XP`;
            document.getElementById('xpText').textContent = `${xp % 1000} / 1000`;
            document.getElementById('xpBar').style.width = `${(xp % 1000) / 10}%`;
            document.getElementById('totalDonated').innerHTML = `Total Donated: $${totalDonated}`;
        }

        // ==================== ALLIES ====================
        function showAddAllyModal() {
            const name = prompt("Ally / Creator Name:");
            if (!name) return;
            
            const username = prompt("Username / @handle:");
            if (!username) return;

            const location = prompt("Location for map (optional):", "New York");
            
            let lat = 40.7128, lon = -74.0060;
            if (location) {
                // Simple demo coords (in production use real geocoding)
                lat += (Math.random() - 0.5) * 20;
                lon += (Math.random() - 0.5) * 30;
            }

            allies.push({
                name: name.trim(),
                username: username.trim().replace('@',''),
                lat: lat,
                lon: lon
            });

            renderAllies();
            refreshMap();
            showToast(`✅ ${name} added as ally!`);
        }

        function renderAllies(filtered = allies) {
            const container = document.getElementById('alliesContainer');
            container.innerHTML = '';

            if (filtered.length === 0) {
                container.innerHTML = `<p style="text-align:center; color:#666; padding:20px;">No allies yet. Add some creators!</p>`;
                return;
            }

            filtered.forEach((ally, index) => {
                const div = document.createElement('div');
                div.className = 'ally-card';
                div.innerHTML = `
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <div>
                            <strong>${ally.name}</strong><br>
                            <small style="color:#888">@${ally.username}</small>
                        </div>
                        <div style="text-align:right;">
                            <button onclick="startApplePay(5,'common','@${ally.username}')" class="apple-pay-button" style="width:auto; padding:10px 18px; font-size:0.95rem;">$5</button>
                            <button onclick="startApplePay(10,'rare','@${ally.username}')" class="apple-pay-button" style="width:auto; padding:10px 18px; font-size:0.95rem;">$10</button>
                            <button onclick="startApplePay(25,'epic','@${ally.username}')" class="apple-pay-button" style="width:auto; padding:10px 18px; font-size:0.95rem;">$25</button>
                        </div>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function filterAllies() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allies.filter(a => 
                a.name.toLowerCase().includes(query) || 
                a.username.toLowerCase().includes(query)
            );
            renderAllies(filtered);
        }

        function refreshMap() {
            if (!mapInstance) {
                mapInstance = L.map('map').setView([30, 0], 2);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(mapInstance);
            }

            mapInstance.eachLayer(layer => {
                if (layer instanceof L.Marker) mapInstance.removeLayer(layer);
            });

            allies.forEach(ally => {
                const marker = L.marker([ally.lat, ally.lon]).addTo(mapInstance);
                marker.bindPopup(`
                    <b>${ally.name}</b><br>
                    @${ally.username}<br><br>
                    <button onclick="startApplePay(5,'common','@${ally.username}');mapInstance.closePopup();" style="padding:8px 12px; background:black; color:white; border:none; border-radius:8px;">Apple Pay $5</button>
                `);
            });
        }

        // Auth
        function handleAuth() {
            showToast("Demo login successful");
            document.getElementById('authScreen').style.display = 'none';
            document.getElementById('dashboardScreen').style.display = 'block';
            document.getElementById('userGreeting').textContent = "Guardian";
            updateStats();
            renderAllies();
            refreshMap();
        }

        function logout() {
            document.getElementById('dashboardScreen').style.display = 'none';
            document.getElementById('authScreen').style.display = 'block';
        }

        // Init
        window.onload = () => {
            // Demo ally
            allies = [
                { name: "Demo Creator", username: "demo", lat: 40.7128, lon: -74.0060 }
            ];
        };
    </script>
</body>
</html>
