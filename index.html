<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <title>RootDonate • The Ether Fund</title>
  <style>
    :root {
      --bg: #0b1220; --surface: #151e2e; --surface-2: #1e293b; --surface-3: #253044;
      --accent: #22c55e; --accent-hover: #16a34a; --eth: #627eea; --text: #f1f5f9; --muted: #94a3b8;
      --user: #22c55e; --bot: #1e293b; --radius: 18px; --shadow: 0 4px 24px rgba(0,0,0,.25);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; font-size:16px; line-height:1.45; }
    body { display:flex; flex-direction:column; height:100dvh; padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
    header { background:var(--surface); padding:12px 16px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #334155; flex-shrink:0; backdrop-filter:blur(12px); }
    header strong { font-size:1.15rem; color:var(--accent); letter-spacing:-.02em; }
    header small { color:var(--muted); font-size:.8rem; }
    .header-actions { display:flex; gap:6px; }
    button { background:var(--accent); color:#000; border:none; padding:8px 14px; border-radius:12px; font-weight:600; cursor:pointer; min-height:40px; font-size:.9rem; transition:all .15s; }
    button:hover { background:var(--accent-hover); transform:translateY(-1px); }
    button:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
    #clearBtn, #newChatBtn { background:#475569; color:#fff; }
    #clearBtn:hover, #newChatBtn:hover { background:#64748b; }
    button:active { transform:scale(.98); }
    #chat { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:12px; scroll-behavior:smooth; background:linear-gradient(180deg,transparent,rgba(15,23,42,.4)); }
    .msg-wrap { max-width:85%; display:flex; flex-direction:column; animation:fadeIn .25s ease; }
    @keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
    .user{align-self:flex-end} .bot{align-self:flex-start}
    .msg { padding:12px 16px; border-radius:var(--radius); white-space:pre-wrap; word-break:break-word; line-height:1.45; position:relative; box-shadow:var(--shadow); }
    .user .msg { background:var(--user); color:#000; border-bottom-right-radius:6px; }
    .bot .msg { background:var(--bot); border-bottom-left-radius:6px; border:1px solid #334155; }
    .timestamp { font-size:.7rem; color:var(--muted); margin-top:4px; padding:0 4px; opacity:.8; }
    .user .timestamp { text-align:right; }
    .unlocked-now { margin-top:10px; padding:8px 10px; background:rgba(34,197,94,.12); border:1px solid var(--accent); border-radius:10px; font-size:.8rem; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
    .unlocked-now button { margin-left:8px; padding:2px 8px; font-size:.75rem; min-height:0; background:var(--accent); color:#000; }
    .msg-actions { position:absolute; top:6px; right:8px; opacity:0; transition:opacity .15s; }
    .msg-wrap:hover .msg-actions, .msg-wrap:focus-within .msg-actions { opacity:1; }
    .msg-actions button { background:rgba(0,0,0,.35); color:#fff; padding:4px 8px; font-size:.75rem; min-height:0; border-radius:8px; }
    .typing { align-self:flex-start; display:flex; gap:4px; padding:12px 16px; background:var(--bot); border-radius:var(--radius); border:1px solid #334155; width:fit-content; }
    .typing span { width:8px; height:8px; background:var(--muted); border-radius:50%; animation:bounce 1.4s infinite; }
    .typing span:nth-child(2){animation-delay:.2s} .typing span:nth-child(3){animation-delay:.4s}
    @keyframes bounce { 0%,80%,100%{transform:scale(0)} 40%{transform:scale(1)} }
    .suggestions { display:flex; flex-wrap:wrap; gap:8px; padding:8px 16px 0; flex-shrink:0; }
    .suggestions button { background:var(--surface-2); color:var(--text); border:1px solid #334155; padding:6px 12px; font-size:.85rem; border-radius:20px; }
    .suggestions button:hover { background:var(--surface-3); border-color:var(--accent); }
    .input-bar { display:flex; gap:8px; padding:12px; background:var(--surface); border-top:1px solid #334155; flex-shrink:0; align-items:flex-end; }
    #input { flex:1; padding:12px 16px; border:none; border-radius:22px; background:var(--surface-2); color:var(--text); font:inherit; resize:none; min-height:48px; max-height:140px; outline:none; transition:background .2s; }
    #input:focus { background:var(--surface-3); }
    #send { background:var(--accent); color:#000; border:none; width:48px; height:48px; border-radius:50%; font-size:1.3rem; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    #send:disabled, #input:disabled { opacity:.5; cursor:not-allowed; }
    .badge { display:inline-block; background:var(--eth); color:white; font-size:.7rem; padding:2px 8px; border-radius:999px; margin-left:6px; vertical-align:middle; }
    @media (min-width:600px){ .msg-wrap{max-width:72%} }
    @media (max-width:480px){ header{padding:10px 12px} .header-actions button{padding:6px 10px;font-size:.8rem} }
  </style>
</head>
<body>
  <header>
    <div>
      <strong>RootDonate <span class="badge">ETH</span></strong><br>
      <small id="status">Connecting…</small><br>
      <small id="nowTime" style="font-size:0.75rem;opacity:0.7;"></small>
    </div>
    <div class="header-actions">
      <button id="newChatBtn">New</button>
      <button id="clearBtn">Clear</button>
      <button id="signBtn">Sign in</button>
    </div>
  </header>

  <div id="chat"></div>

  <div class="input-bar">
    <textarea id="input" placeholder="Ask about The Ether Fund…" rows="1"></textarea>
    <button id="send">↑</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, signInAnonymously, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, getDocs, limit, where, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBvcCBsPiMxS7G2evPjM7sANp-zSy_RkKM",
      authDomain: "rootdonate-61e61.firebaseapp.com",
      projectId: "rootdonate-61e61",
      storageBucket: "rootdonate-61e61.firebasestorage.app",
      messagingSenderId: "754240963907",
      appId: "1:754240963907:web:5417c2763d8f02108bdbf6"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null, memory = [], unsubShared = null, isReplying = false;
    let awaitingTeach = false, pendingInput = null, chatId = null, typingEl = null;

    const CHAT_KEY = "qeth_expert_chat";
    const BASE42 = "0123456789abcdefghijklmnopqrstuvwxyzABCDEF";
    const SIGNIN_TIME_KEY = "qeth_signin_time";
    const ONE_DAY_MS = 24 * 60 * 60 * 1000;

    function toBase42(num){if(num===0)return BASE42[0];let s="";while(num>0){s=BASE42[num%42]+s;num=Math.floor(num/42);}return s;}
    function getChatIdFromUrl(){return new URLSearchParams(window.location.search).get("chat");}
    function setChatIdInUrl(id){const u=new URL(window.location);u.searchParams.set("chat",id);history.replaceState(null,"",u);}
    function generateChatId(){return toBase42(Math.floor(Math.random()*1e15)).slice(0,8)+toBase42(Date.now()).slice(-5);}
    function normalize(t){return(t||"").trim().toLowerCase().replace(/[^\w\s]/g,"").replace(/\s+/g," ");}

    function recordSignInTime() { localStorage.setItem(SIGNIN_TIME_KEY, Date.now().toString()); }
    function shouldAutoSignOut() {
      const t = localStorage.getItem(SIGNIN_TIME_KEY);
      if (!t) return false;
      return Date.now() - Number(t) > ONE_DAY_MS;
    }
    function clearSignInTime() { localStorage.removeItem(SIGNIN_TIME_KEY); }

    function findBestResponse(input){
      const clean=normalize(input);if(!clean)return null;
      for(const p of [...memory,...builtInKnowledge])if(normalize(p.input)===clean)return p.response;
      let best=null,bestScore=0;const words=clean.split(" ").filter(w=>w.length>2);
      for(const p of [...memory,...builtInKnowledge]){
        const target=normalize(p.input);let score=0;
        if(clean.includes(target)||target.includes(clean))score+=5;
        words.forEach(w=>{if(target.includes(w))score+=1;});
        if(score>bestScore&&score>=2){bestScore=score;best=p.response;}
      }
      return best;
    }

    async function getInternetAIResponse(userText){
      const unlockedNow=Date.now(),nowStr=new Date(unlockedNow).toLocaleString();
      const prompt=`You are a helpful expert on The Ether Fund (QETH-U.TO / QETH-UN.TO) from 3iQ. Current unlocked Date.now() is ${unlockedNow} (${nowStr}). Reference latest data from https://stocks.apple.com/symbol/QETH-U.TO and public sources (TSX / 3iQ / Yahoo). Answer clearly. Not financial advice.\n\nQuestion: ${userText}`;
      try{
        const res=await fetch(`https://text.pollinations.ai/${encodeURIComponent(prompt)}`);
        if(!res.ok)throw new Error();
        let text=(await res.text()).trim()||"Sorry, the AI service returned an empty response.";
        return{text,unlockedNow,fromAI:true};
      }catch(e){
        return{text:"I don’t have a strong match for that yet and the internet AI is unavailable right now.\n\nTeach me the best reply and I’ll remember it for everyone going forward.",unlockedNow:Date.now(),fromAI:false};
      }
    }

    function saveLocalChat(){
      const msgs=Array.from(document.getElementById("chat").querySelectorAll(".msg-wrap:not(.typing)")).map(w=>({
        text:w.querySelector(".msg").textContent,isUser:w.classList.contains("user"),ts:w.dataset.ts||Date.now(),unlocked:w.dataset.unlocked||null
      }));
      localStorage.setItem(CHAT_KEY+"_"+(chatId||"local"),JSON.stringify(msgs));
    }
    function loadLocalChat(){
      const saved=localStorage.getItem(CHAT_KEY+"_"+(chatId||"local"));if(!saved)return;
      try{const msgs=JSON.parse(saved);document.getElementById("chat").innerHTML="";msgs.forEach(m=>addMessage(m.text,m.isUser,false,m.ts,m.unlocked));}catch(e){}
    }
    function clearLocalView(){document.getElementById("chat").innerHTML="";localStorage.removeItem(CHAT_KEY+"_"+(chatId||"local"));awaitingTeach=false;pendingInput=null;hideTyping();}

    async function saveMessageToCloud(text,isUser){if(!currentUser||!chatId)return;try{await addDoc(collection(db,"chats",chatId,"messages"),{text,isUser,uid:currentUser.uid,createdAt:serverTimestamp()});}catch(e){}}
    async function loadChatFromCloud(){
      if(!chatId)return;
      try{
        const snap=await getDocs(query(collection(db,"chats",chatId,"messages"),orderBy("createdAt","asc"),limit(500)));
        document.getElementById("chat").innerHTML="";
        snap.forEach(d=>{const data=d.data();addMessage(data.text,data.isUser,false,data.createdAt?.toMillis?.()||Date.now());});
      }catch(e){}
    }
    function listenSharedMemory(){
      if(unsubShared)unsubShared();
      unsubShared=onSnapshot(query(collection(db,"shared_memory"),orderBy("createdAt","desc"),limit(1000)),snap=>{memory=snap.docs.map(d=>d.data()).reverse();});
    }
    async function saveSharedPair(input,response){
      if(!currentUser)return;const trimmed=input.trim();
      try{
        const snap=await getDocs(query(collection(db,"shared_memory"),where("input","==",trimmed),limit(1)));
        if(!snap.empty)return;
        await addDoc(collection(db,"shared_memory"),{input:trimmed,response:response.trim(),uid:currentUser.uid,createdAt:serverTimestamp()});
      }catch(e){}
    }

    function showTyping(){hideTyping();typingEl=document.createElement("div");typingEl.className="msg-wrap bot typing";typingEl.innerHTML=`<div class="typing"><span></span><span></span><span></span></div>`;document.getElementById("chat").appendChild(typingEl);document.getElementById("chat").scrollTop=document.getElementById("chat").scrollHeight;}
    function hideTyping(){if(typingEl){typingEl.remove();typingEl=null;}}
    function formatTime(ts){return new Date(ts||Date.now()).toLocaleString(undefined,{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"});}

    function addMessage(text,isUser,save=true,ts=Date.now(),unlockedNow=null){
      const wrap=document.createElement("div");wrap.className="msg-wrap "+(isUser?"user":"bot");wrap.dataset.ts=ts;if(unlockedNow)wrap.dataset.unlocked=unlockedNow;
      const div=document.createElement("div");div.className="msg";div.textContent=text;
      const actions=document.createElement("div");actions.className="msg-actions";
      const copyBtn=document.createElement("button");copyBtn.textContent="Copy";copyBtn.onclick=()=>navigator.clipboard.writeText(text).then(()=>{copyBtn.textContent="Copied";setTimeout(()=>copyBtn.textContent="Copy",1500);});
      actions.appendChild(copyBtn);div.appendChild(actions);
      const timeEl=document.createElement("div");timeEl.className="timestamp";timeEl.textContent=formatTime(ts);
      wrap.appendChild(div);
      if(unlockedNow){
        const unlockEl=document.createElement("div");unlockEl.className="unlocked-now";
        unlockEl.innerHTML=`Unlocked Date.now(): <strong>${unlockedNow}</strong> <button>Copy</button>`;
        unlockEl.querySelector("button").onclick=()=>navigator.clipboard.writeText(String(unlockedNow)).then(()=>{unlockEl.querySelector("button").textContent="Copied!";setTimeout(()=>unlockEl.querySelector("button").textContent="Copy",1200);});
        wrap.appendChild(unlockEl);
      }
      wrap.appendChild(timeEl);
      const chat=document.getElementById("chat");chat.appendChild(wrap);chat.scrollTop=chat.scrollHeight;
      if(save){saveLocalChat();saveMessageToCloud(text,isUser);}
      return wrap;
    }

    async function reply(userText){
      if(isReplying)return;isReplying=true;showTyping();await new Promise(r=>setTimeout(r,400+Math.random()*600));
      const response=findBestResponse(userText);hideTyping();
      if(response){addMessage(response,false);}
      else{
        showTyping();const ai=await getInternetAIResponse(userText);hideTyping();
        addMessage(ai.text,false,true,Date.now(),ai.unlockedNow);
        if(ai.fromAI&&currentUser){await saveSharedPair(userText,ai.text);addMessage("Known by heart — I’ll remember this for everyone next time.",false);}
        if(ai.text.includes("Teach me the best reply")){awaitingTeach=true;pendingInput=userText;}
      }
      isReplying=false;
    }

    function updateNowTime(){const el=document.getElementById("nowTime");if(el)el.textContent="Now: "+new Date().toLocaleString()+" · "+Date.now();}

    function setupUI(){
      const input=document.getElementById("input"),sendBtn=document.getElementById("send"),signBtn=document.getElementById("signBtn");
      const clearBtn=document.getElementById("clearBtn"),newChatBtn=document.getElementById("newChatBtn");
      const status=document.getElementById("status"),suggestions=document.getElementById("suggestions");

      chatId=getChatIdFromUrl()||generateChatId();setChatIdInUrl(chatId);
      updateNowTime();setInterval(updateNowTime,60000);

      suggestions.querySelectorAll("button").forEach(btn=>btn.onclick=()=>{input.value=btn.dataset.q;sendBtn.click();});

      onAuthStateChanged(auth,async user=>{
        currentUser=user;
        if(user){
          if(!localStorage.getItem(SIGNIN_TIME_KEY)) recordSignInTime();
          if(shouldAutoSignOut()){
            await signOut(auth);
            clearSignInTime();
            status.textContent="Signed out automatically after 1 day";
            return;
          }
          signBtn.textContent="Sign out";
          status.textContent="Signed in · Shared memory active";
          listenSharedMemory();
          await loadChatFromCloud();
        }else{
          signBtn.textContent="Sign in";
          clearSignInTime();
          status.textContent="Ready • Sign in for shared memory";
          // Auto sign-in for continuous cloud sync
          signInAnonymously(auth).catch(()=>{status.textContent="Auto sign-in failed – please refresh";});
        }
        loadLocalChat();
      });

      signBtn.onclick=()=>{
        if(currentUser){
          signOut(auth).then(()=>clearSignInTime());
        }else{
          status.textContent="Signing in…";
          signInAnonymously(auth).catch(()=>{status.textContent="Sign-in failed – please refresh";});
        }
      };

      clearBtn.onclick=()=>{if(confirm("Clear local view only?"))clearLocalView();};
      newChatBtn.onclick=()=>{
        if(confirm("Start a new chat?")){
          chatId=generateChatId();setChatIdInUrl(chatId);clearLocalView();
        }
      };

      async function send(){
        const text=input.value.trim();if(!text)return;
        input.value="";input.style.height="auto";
        if(awaitingTeach&&pendingInput){
          addMessage(text,true);await saveSharedPair(pendingInput,text);
          addMessage("Got it — I’ll remember that for everyone.",false);
          awaitingTeach=false;pendingInput=null;return;
        }
        addMessage(text,true);await reply(text);
      }
      sendBtn.onclick=send;
      input.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();}};
      input.oninput=()=>{input.style.height="auto";input.style.height=Math.min(input.scrollHeight,140)+"px";};

      // Auto sign-out check while page is open
      setInterval(()=>{
        if(currentUser && shouldAutoSignOut()){
          signOut(auth).then(()=>{
            clearSignInTime();
            status.textContent="Signed out automatically after 1 day";
          });
        }
      },60*60*1000);

      setTimeout(()=>{
        if(document.getElementById("chat").children.length===0){
          addMessage("Hello! Ask me anything about The Ether Fund (QETH).\n\nCloud sync active when signed in.\nNot financial advice.",false,false);
        }
      },500);
    }

    setupUI();
  </script>
</body>
</html>
