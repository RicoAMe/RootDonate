<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ROOT DONATE • SOCIAL NODE</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    :root {
      --neon: #ffd700;
      --glow: #ffd70088;
      --bg: #0a0a0a;
      --card: rgba(20,20,15,0.95);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Courier New', monospace;
      background: var(--bg);
      color: var(--neon);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    canvas#matrix { position: fixed; inset: 0; z-index: -1; opacity: 0.15; }

    .header {
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255,215,0,0.3);
      background: rgba(10,10,10,0.98);
    }
    .header h1 { font-size: 1.55rem; letter-spacing: 3px; text-shadow: 0 0 15px var(--neon); }

    .wallet {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(0,0,0,0.6);
      padding: 6px 14px;
      border-radius: 50px;
      border: 1px solid var(--neon);
    }

    .learn-btn, .apple-pay-btn {
      padding: 8px 16px;
      background: transparent;
      border: 1px solid var(--neon);
      color: var(--neon);
      border-radius: 50px;
      cursor: pointer;
    }

    .apple-pay-btn {
      border-color: #000;
      background: #000;
      color: white;
      font-weight: bold;
    }

    .user-info { display: flex; align-items: center; gap: 12px; cursor: pointer; }
    .avatar { width: 38px; height: 38px; background: #222; border: 2px solid var(--neon); border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; }

    .nav { padding: 12px 20px; display: flex; gap: 8px; flex-wrap: wrap; border-bottom: 1px solid rgba(255,215,0,0.2); background: rgba(10,10,10,0.98); }
    .nav button { background: transparent; border: 1px solid var(--neon); color: var(--neon); padding: 10px 20px; border-radius: 50px; cursor: pointer; }
    .nav button.active, .nav button:hover { background: var(--neon); color: #000; box-shadow: 0 0 25px var(--glow); }

    .search-bar { margin: 16px 20px; padding: 14px 24px; width: calc(100% - 40px); background: #111; border: 1px solid var(--neon); border-radius: 50px; color: var(--neon); }

    .nodes-grid {
      flex: 1;
      padding: 16px 20px;
      overflow-y: auto;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }

    .node-card { background: var(--card); border: 1px solid rgba(255,215,0,0.35); border-radius: 16px; padding: 18px; cursor: pointer; transition: all 0.4s; }
    .node-card:hover { transform: translateY(-4px); border-color: var(--neon); box-shadow: 0 0 25px var(--glow); }

    .log { height: 160px; background: #0a0a0a; padding: 12px 20px; overflow-y: auto; font-size: 0.85rem; border-top: 1px solid rgba(255,215,0,0.3); }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.96);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 10px;
    }
    .modal-content {
      background: rgba(20,20,15,0.98);
      border: 2px solid var(--neon);
      border-radius: 16px;
      width: 100%;
      max-width: 520px;
      padding: 28px;
      position: relative;
    }

    .history-list {
      max-height: 400px;
      overflow-y: auto;
      margin-top: 15px;
    }
    .history-item {
      padding: 10px;
      background: #111;
      margin-bottom: 8px;
      border-left: 3px solid #0f0;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <canvas id="matrix"></canvas>

  <div class="header">
    <h1>🌐 ROOT DONATE</h1>
    <div style="display:flex; align-items:center; gap:12px;">
      <button class="learn-btn" onclick="toggleLearnMode()">📖 LEARN MODE</button>
      
      <div id="userSection" style="display:none;">
        <div class="user-info" onclick="showProfile()">
          <div id="avatar" class="avatar">👤</div>
          <div>
            <div id="usernameDisplay" style="font-size:1rem;"></div>
            <div id="balanceDisplay" style="font-size:0.8rem;color:#0f0;">0 ROOT</div>
          </div>
        </div>
      </div>
      
      <button onclick="showAuthModal()" id="authBtn" style="padding:8px 20px; border:1px solid var(--neon); background:transparent; color:var(--neon); border-radius:50px;">
        <i class="fas fa-user"></i> LOGIN
      </button>
    </div>
  </div>

  <!-- NAV, SEARCH, GRID, LOG same as before -->

  <!-- ITEM MODAL -->
  <div class="modal" id="itemModal">
    <div class="modal-content">
      <span onclick="closeItemModal()" style="position:absolute;top:12px;right:20px;font-size:2.5rem;cursor:pointer;color:var(--neon);">×</span>
      <div id="modalIcon" style="font-size:2.8rem;margin-bottom:12px;">🪙</div>
      <h2 id="modalName" style="color:#ffd700;margin-bottom:12px;"></h2>
      <p id="modalLoc"></p>
      <p id="modalTime"></p>
      <div style="margin:20px 0;padding:14px;background:#111;border:1px solid var(--neon);">
        <strong>EST. VALUE:</strong> <span id="modalValue" style="color:#0f0;"></span><br>
        <strong>MINT:</strong> <span id="modalMint"></span>
      </div>
      <div id="shareUrl" style="background:#111;padding:14px;margin:20px 0;border:1px solid var(--neon);word-break:break-all;font-size:0.9rem;"></div>
      
      <button onclick="copyShareLink()" style="width:100%;padding:12px;margin-bottom:10px;border:2px solid var(--neon);background:transparent;color:var(--neon);border-radius:50px;">
        📋 COPY LINK
      </button>
      <button onclick="showDonateModal()" style="width:100%;padding:16px;border:2px solid #0f0;background:transparent;color:#0f0;border-radius:50px;">
        💰 DONATE ROOT
      </button>
    </div>
  </div>

  <!-- DONATE MODAL -->
  <div class="modal" id="donateModal">
    <div class="modal-content">
      <span onclick="closeDonateModal()" style="position:absolute;top:12px;right:20px;font-size:2.5rem;cursor:pointer;color:var(--neon);">×</span>
      <h2 style="color:#0f0;">💸 SEND DONATION</h2>
      <p id="donateTo" style="margin:15px 0;"></p>
      
      <div style="margin:15px 0;">
        <strong>Your Balance:</strong> <span id="donorBalance" style="color:#0f0;"></span> ROOT
      </div>

      <input id="donateAmount" type="number" value="50" style="width:100%;padding:14px;background:#111;border:1px solid #0f0;color:var(--neon);font-size:1.3rem;">

      <div style="margin:20px 0;display:flex;gap:10px;">
        <button onclick="quickAmount(25)" class="amount-btn">25</button>
        <button onclick="quickAmount(50)" class="amount-btn">50</button>
        <button onclick="quickAmount(100)" class="amount-btn">100</button>
        <button onclick="quickAmount(250)" class="amount-btn">250</button>
      </div>

      <button onclick="confirmDonation()" style="width:100%;padding:14px;margin:10px 0;border:2px solid #0f0;background:transparent;color:#0f0;border-radius:50px;">
        SEND WITH ROOT WALLET
      </button>
      
      <!-- Apple Pay -->
      <button onclick="startApplePay()" class="apple-pay-btn" style="width:100%;padding:16px;margin-top:8px;display:flex;align-items:center;justify-content:center;gap:8px;">
        <i class="fab fa-apple"></i> PAY WITH APPLE PAY
      </button>
    </div>
  </div>

  <!-- PROFILE MODAL (New) -->
  <div class="modal" id="profileModal">
    <div class="modal-content">
      <span onclick="closeProfileModal()" style="position:absolute;top:12px;right:20px;font-size:2.5rem;cursor:pointer;color:var(--neon);">×</span>
      <h2 style="text-align:center;color:#ffd700;">🪙 PROFILE & HISTORY</h2>
      <div id="profileInfo" style="text-align:center;margin:20px 0;"></div>
      
      <h3 style="margin:20px 0 10px;">📜 DONATION HISTORY</h3>
      <div id="historyList" class="history-list"></div>
    </div>
  </div>

  <script>
    // Matrix Rain (same as before) ...

    let allNodes = [];
    let currentUser = null;
    let currentItem = null;
    let donationHistory = []; // {type:"sent"|"received", amount, to/from, item, time}

    function log(msg) { /* same */ }

    function saveUserData() {
      if (currentUser) localStorage.setItem('rootDonateUser', JSON.stringify(currentUser));
      localStorage.setItem('rootDonateHistory', JSON.stringify(donationHistory));
    }

    function loadHistory() {
      const saved = localStorage.getItem('rootDonateHistory');
      if (saved) donationHistory = JSON.parse(saved);
    }

    function addToHistory(type, amount, target, itemName) {
      donationHistory.unshift({
        type,
        amount,
        target,
        item: itemName,
        time: new Date().toLocaleString()
      });
      if (donationHistory.length > 50) donationHistory.pop();
      saveUserData();
    }

    function showProfile() {
      if (!currentUser) return;
      document.getElementById('profileInfo').innerHTML = `
        <div class="avatar" style="margin:0 auto 15px;width:80px;height:80px;font-size:2.5rem;">${currentUser.avatar}</div>
        <h2>${currentUser.handle}</h2>
        <p>Joined: ${currentUser.joined} • Balance: <strong style="color:#0f0;">${currentUser.balance} ROOT</strong></p>
      `;
      
      let html = '';
      donationHistory.forEach(h => {
        const color = h.type === 'sent' ? '#ff0' : '#0f0';
        html += `<div class="history-item" style="border-left-color:${color}">
          <strong>${h.type.toUpperCase()} ${h.amount} ROOT</strong><br>
          ${h.type === 'sent' ? 'to' : 'from'} <strong>${h.target}</strong><br>
          <small>${h.item} • ${h.time}</small>
        </div>`;
      });
      document.getElementById('historyList').innerHTML = html || '<p style="opacity:0.6;text-align:center;">No transactions yet.</p>';
      document.getElementById('profileModal').style.display = 'flex';
    }

    function closeProfileModal() {
      document.getElementById('profileModal').style.display = 'none';
    }

    function showDonateModal() {
      if (!currentUser) return alert("Login first");
      currentDonationTarget = currentItem;
      document.getElementById('donateTo').innerHTML = `To: <strong>${currentItem.name}</strong><br>by ${currentItem.source}`;
      document.getElementById('donorBalance').textContent = currentUser.balance;
      document.getElementById('donateModal').style.display = 'flex';
    }

    function closeDonateModal() {
      document.getElementById('donateModal').style.display = 'none';
    }

    function quickAmount(amt) {
      document.getElementById('donateAmount').value = amt;
    }

    function confirmDonation() {
      const amount = parseInt(document.getElementById('donateAmount').value);
      if (!amount || amount > currentUser.balance) return alert("Invalid amount or insufficient balance");

      currentUser.balance -= amount;
      updateBalanceDisplay();
      addToHistory("sent", amount, currentItem.source || "Node Owner", currentItem.name);
      
      log(`💸 Sent ${amount} ROOT to ${currentItem.name}`);
      closeDonateModal();
      closeItemModal();
      alert(`✅ ${amount} ROOT sent successfully!`);
    }

    function startApplePay() {
      const amount = parseInt(document.getElementById('donateAmount').value);
      if (!amount || amount > currentUser.balance) return alert("Invalid amount");

      alert(" Apple Pay\n\nSimulated Payment Flow\n\n✅ Payment Authorized!\nAmount: " + amount + " ROOT");
      
      currentUser.balance -= amount;
      updateBalanceDisplay();
      addToHistory("sent", amount, currentItem.source || "Node Owner", currentItem.name);
      
      log(` Apple Pay: Sent ${amount} ROOT`);
      closeDonateModal();
      closeItemModal();
    }

    function updateBalanceDisplay() {
      if (currentUser) document.getElementById('balanceDisplay').textContent = `${currentUser.balance} ROOT`;
    }

    // Login / Signup with balance
    function signup() { /* same but give 1200 ROOT */ 
      // ... set currentUser.balance = 1200; ...
    }

    // Init
    window.onload = () => {
      loadHistory();
      // ... rest of init ...
    };
  </script>
</body>
</html>
