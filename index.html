<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Root Donate</title>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root { --primary: #00ff9d; --bg: #0a0a0f; --card: #111118; }
        * { box-sizing: border-box; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: #e0e0e0; margin:0; padding:20px; min-height:100vh; }
        .container { max-width:480px; margin:40px auto; background:var(--card); border-radius:24px; box-shadow:0 25px 60px rgba(0,0,0,0.6); overflow:hidden; }
        .header { background:linear-gradient(135deg,#00ff9d,#00cc7a); color:#000; padding:40px 20px; text-align:center; }
        h1 { margin:0; font-size:2.4rem; font-weight:700; }
        .content { padding:30px; }

        input { width:100%; padding:16px; margin:12px 0; background:#1c1c24; border:none; border-radius:12px; color:white; font-size:1.05rem; }
        button { width:100%; padding:16px; margin:12px 0; border:none; border-radius:12px; font-size:1.05rem; font-weight:600; cursor:pointer; }
        .btn-primary { background:var(--primary); color:#000; }
        .btn-secondary { background:#333; color:white; }
        .btn-danger { background:#ff4444; color:white; }

        .donation-node, .history-item, .lookup-result { background:#1c1c24; border-radius:16px; padding:18px; margin:15px 0; }
        .avatar { width:52px; height:52px; background:#00ff9d; color:#000; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:1.4rem; font-weight:700; }

        .amount-btns { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
        .amount-btn { background:#27272f; padding:8px 16px; border-radius:9999px; font-size:0.9rem; cursor:pointer; }
        .amount-btn:hover { background:var(--primary); color:#000; }

        .monzo-link { background:#27272f; padding:12px; border-radius:12px; font-size:0.9rem; word-break:break-all; margin:10px 0; font-family:monospace; }

        #map { height:260px; border-radius:12px; margin-top:12px; }

        .autocomplete-list { position:absolute; width:calc(100% - 60px); background:#1c1c24; border-radius:12px; max-height:280px; overflow-y:auto; z-index:100; box-shadow:0 10px 30px rgba(0,0,0,0.6); }
        .autocomplete-item { padding:14px 16px; cursor:pointer; border-bottom:1px solid #27272f; }
        .autocomplete-item:hover { background:#27272f; }
        .autocomplete-item .type { font-size:0.8rem; color:#888; }

        .lookup-title { margin:30px 0 15px; font-size:1.1rem; }
        .error { color:#ff6666; text-align:center; margin:10px 0; }
        .success { color:var(--primary); }
    </style>
</head>
<body>

    <!-- Auth Screen -->
    <div class="container" id="authScreen">
        <div class="header"><h1>Root Donate</h1><p>Support creators instantly</p></div>
        <div class="content">
            <h2 id="formTitle" style="text-align:center;margin-bottom:24px;">Create Account</h2>
            <input type="email" id="email" placeholder="Email address" required>
            <input type="password" id="password" placeholder="Password" required>
            <div id="errorMsg" class="error"></div>
            <button class="btn-primary" onclick="handleAuth()">Continue</button>
            <button class="btn-secondary" onclick="toggleForm()">Already have account? Login</button>
        </div>
    </div>

    <!-- Dashboard -->
    <div class="container" id="dashboardScreen" style="display:none;">
        <div class="header"><h1 id="userGreeting">Root Donate</h1></div>
        <div class="content">

            <!-- Donation Nodes -->
            <input type="text" id="searchInput" placeholder="Search creators or @usernames..." onkeyup="filterNodes()">
            <h3>Your Donation Nodes</h3>
            <div id="nodesContainer"></div>

            <h3 style="margin:25px 0 15px;">Add New Node</h3>
            <input type="text" id="creatorName" placeholder="Creator / Cause name">
            <input type="text" id="monzoUsername" placeholder="Monzo.me username">
            <button class="btn-primary" onclick="addDonationNode()">Add Node</button>

            <!-- Unified Apple Maps-style Search + Domain/IP Lookup -->
            <h3 class="lookup-title">Unified Search • Domain • Location</h3>
            <div style="position:relative;">
                <input type="text" id="unifiedInput" placeholder="Search place, domain (google.com), or @username..." 
                       onkeyup="handleUnifiedInput()" autocomplete="off">
                <div id="unifiedAutocompleteList" class="autocomplete-list" style="display:none;"></div>
            </div>
            <button class="btn-primary" onclick="performUnifiedLookup()">Search / Show on Map</button>
            
            <div id="unifiedResult" class="lookup-result"></div>
            <div id="map"></div>

            <h3 class="history-title">Recent Donations</h3>
            <div id="historyContainer"></div>

            <button class="btn-secondary" onclick="logout()" style="margin-top:30px;">Logout</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBvcCBsPiMxS7G2evPjM7sANp-zSy_RkKM",
            authDomain: "rootdonate-61e61.firebaseapp.com",
            projectId: "rootdonate-61e61",
            storageBucket: "rootdonate-61e61.firebasestorage.app",
            messagingSenderId: "754240963907",
            appId: "1:754240963907:web:5417c2763d8f02108bdbf6"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        let currentUserNodes = [], donationHistory = [], mapInstance, selectedResult = null;

        function toggleForm() {
            const title = document.getElementById('formTitle');
            title.textContent = title.textContent === 'Create Account' ? 'Login' : 'Create Account';
        }

        function handleAuth() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorMsg = document.getElementById('errorMsg');
            if (!email || !password) return errorMsg.textContent = "Please fill all fields";

            const isLogin = document.getElementById('formTitle').textContent === 'Login';
            const promise = isLogin 
                ? auth.signInWithEmailAndPassword(email, password)
                : auth.createUserWithEmailAndPassword(email, password);
            promise.then(() => showDashboard()).catch(err => errorMsg.textContent = err.message);
        }

        function showDashboard() {
            document.getElementById('authScreen').style.display = 'none';
            document.getElementById('dashboardScreen').style.display = 'block';
            const user = auth.currentUser;
            document.getElementById('userGreeting').textContent = user ? `Hi, ${user.email.split('@')[0]}` : 'Root Donate';
            loadData();
        }

        function loadData() {
            const user = auth.currentUser;
            if (!user) return;
            currentUserNodes = JSON.parse(localStorage.getItem(`monzoNodes_${user.uid}`)) || [];
            donationHistory = JSON.parse(localStorage.getItem(`donationHistory_${user.uid}`)) || [];
            renderNodes();
            renderHistory();
        }

        function saveNodes() { const user = auth.currentUser; if(user) localStorage.setItem(`monzoNodes_${user.uid}`, JSON.stringify(currentUserNodes)); }
        function saveHistory() { const user = auth.currentUser; if(user) localStorage.setItem(`donationHistory_${user.uid}`, JSON.stringify(donationHistory)); }

        function renderNodes(filtered = currentUserNodes) {
            const container = document.getElementById('nodesContainer');
            container.innerHTML = '';
            if (!filtered.length) {
                container.innerHTML = `<p style="text-align:center;color:#666;padding:20px;">No nodes found.</p>`;
                return;
            }
            filtered.forEach((node, i) => {
                const idx = currentUserNodes.indexOf(node);
                container.innerHTML += `
                    <div class="donation-node">
                        <div style="display:flex;gap:15px;align-items:center;">
                            <div class="avatar">${node.name[0]}</div>
                            <div style="flex:1">
                                <div class="node-name">${node.name}</div>
                                <div class="node-username">@${node.username}</div>
                                <div class="monzo-link">https://monzo.me/${node.username}</div>
                                <div class="amount-btns">
                                    <div class="amount-btn" onclick="quickDonate('${node.username}',5,${idx})">£5</div>
                                    <div class="amount-btn" onclick="quickDonate('${node.username}',10,${idx})">£10</div>
                                    <div class="amount-btn" onclick="quickDonate('${node.username}',20,${idx})">£20</div>
                                    <div class="amount-btn" onclick="quickDonate('${node.username}',50,${idx})">£50</div>
                                </div>
                            </div>
                            <button class="btn-danger" onclick="removeNode(${idx})">Remove</button>
                        </div>
                    </div>`;
            });
        }

        function filterNodes() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            const filtered = query ? currentUserNodes.filter(n => n.name.toLowerCase().includes(query) || n.username.toLowerCase().includes(query)) : currentUserNodes;
            renderNodes(filtered);
        }

        function addDonationNode() {
            const name = document.getElementById('creatorName').value.trim();
            const username = document.getElementById('monzoUsername').value.trim().toLowerCase().replace('@','');
            if (!name || !username) return alert("Please enter name and username");
            currentUserNodes.push({name, username});
            saveNodes();
            renderNodes();
            document.getElementById('creatorName').value = '';
            document.getElementById('monzoUsername').value = '';
        }

        function removeNode(idx) {
            if (confirm("Remove this node?")) {
                currentUserNodes.splice(idx, 1);
                saveNodes();
                renderNodes();
            }
        }

        function quickDonate(username, amount, idx) {
            window.open(`https://monzo.me/${username}?amount=${amount}`, '_blank');
            donationHistory.unshift({username, amount, timestamp: new Date().toISOString()});
            if (donationHistory.length > 10) donationHistory.pop();
            saveHistory();
            renderHistory();
        }

        function renderHistory() {
            const container = document.getElementById('historyContainer');
            container.innerHTML = donationHistory.length ? '' : `<p style="text-align:center;color:#666;padding:20px;">No donations yet.</p>`;
            donationHistory.forEach(item => {
                const date = new Date(item.timestamp).toLocaleString('en-GB', {month:'short', day:'numeric', hour:'2-digit', minute:'2-digit'});
                container.innerHTML += `<div class="history-item"><div style="display:flex;justify-content:space-between;align-items:center;"><div><strong>@${item.username}</strong><br><small style="color:#888;">${date}</small></div><div style="font-size:1.3rem;font-weight:700;color:var(--primary);">£${item.amount}</div></div></div>`;
            });
        }

        // === UNIFIED APPLE MAPS-STYLE AUTOCOMPLETE + DOMAIN/IP LOOKUP ===
        let debounceTimer;
        async function handleUnifiedInput() {
            clearTimeout(debounceTimer);
            const input = document.getElementById('unifiedInput');
            const list = document.getElementById('unifiedAutocompleteList');
            list.style.display = 'none';
            list.innerHTML = '';

            const q = input.value.trim();
            if (q.length < 2) return;

            debounceTimer = setTimeout(async () => {
                try {
                    // 1. Try place autocomplete (Apple Maps style)
                    const placeRes = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(q)}&limit=6`);
                    const places = await placeRes.json();

                    // 2. Also check if it looks like a domain
                    const isDomain = /^[a-zA-Z0-9-]+\.[a-zA-Z]{2,}/.test(q);

                    places.forEach(p => {
                        const div = document.createElement('div');
                        div.className = 'autocomplete-item';
                        div.innerHTML = `${p.display_name}<div class="type">📍 Place • ${p.type || 'location'}</div>`;
                        div.onclick = () => {
                            input.value = p.display_name;
                            selectedResult = {type: 'place', data: p};
                            list.style.display = 'none';
                        };
                        list.appendChild(div);
                    });

                    if (isDomain) {
                        const div = document.createElement('div');
                        div.className = 'autocomplete-item';
                        div.innerHTML = `${q}<div class="type">🌐 Domain / IP Lookup</div>`;
                        div.onclick = () => {
                            input.value = q;
                            selectedResult = {type: 'domain', data: q};
                            list.style.display = 'none';
                        };
                        list.appendChild(div);
                    }

                    if (places.length || isDomain) list.style.display = 'block';
                } catch(e) {}
            }, 350);
        }

        async function performUnifiedLookup() {
            const inputVal = document.getElementById('unifiedInput').value.trim();
            const resultDiv = document.getElementById('unifiedResult');
            if (!inputVal) return resultDiv.innerHTML = `<span class="error">Enter a place or domain</span>`;

            resultDiv.innerHTML = 'Searching...';
            selectedResult = selectedResult || {};

            try {
                // If place was selected from autocomplete
                if (selectedResult.type === 'place' && selectedResult.data.display_name === inputVal) {
                    const p = selectedResult.data;
                    const lat = parseFloat(p.lat), lon = parseFloat(p.lon);

                    resultDiv.innerHTML = `
                        <strong>${inputVal}</strong><br>
                        ${p.display_name}<br>
                        <span class="success">📍 Located via OpenStreetMap</span><br><br>
                        <a href="https://maps.apple.com/?ll=${lat},${lon}&q=${encodeURIComponent(inputVal)}" target="_blank" style="color:var(--primary)">→ Open in Apple Maps</a>
                    `;
                    updateMap(lat, lon, inputVal);
                    return;
                }

                // Domain / IP lookup
                const dnsRes = await fetch(`https://dns.google/resolve?name=${encodeURIComponent(inputVal)}&type=A`);
                const dnsData = await dnsRes.json();
                const ip = dnsData.Answer?.find(a => a.type === 1)?.data;

                if (ip) {
                    const geoRes = await fetch(`https://ipapi.co/${ip}/json/`);
                    const geo = await geoRes.json();

                    const lat = parseFloat(geo.latitude), lon = parseFloat(geo.longitude);

                    resultDiv.innerHTML = `
                        <strong>${inputVal}</strong><br>
                        IP: <span style="color:var(--primary)">${ip}</span><br>
                        ${geo.city || ''}, ${geo.region || ''}, ${geo.country_name || ''}<br><br>
                        <a href="https://maps.apple.com/?ll=${lat},${lon}" target="_blank" style="color:var(--primary)">→ Open in Apple Maps</a>
                    `;
                    updateMap(lat, lon, inputVal);
                } else {
                    // Fallback to place search if no IP
                    const placeRes = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(inputVal)}&limit=1`);
                    const places = await placeRes.json();
                    if (places.length) {
                        const p = places[0];
                        const lat = parseFloat(p.lat), lon = parseFloat(p.lon);
                        resultDiv.innerHTML = `
                            <strong>${inputVal}</strong><br>
                            ${p.display_name}<br>
                            <span class="success">📍 Place found</span><br><br>
                            <a href="https://maps.apple.com/?ll=${lat},${lon}" target="_blank" style="color:var(--primary)">→ Open in Apple Maps</a>
                        `;
                        updateMap(lat, lon, inputVal);
                    } else {
                        throw new Error("Nothing found");
                    }
                }
            } catch (e) {
                resultDiv.innerHTML = `<span class="error">Could not resolve domain or location.</span>`;
            }
        }

        function updateMap(lat, lon, title = '') {
            if (!mapInstance) {
                mapInstance = L.map('map').setView([lat, lon], 12);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    attribution: '© OpenStreetMap'
                }).addTo(mapInstance);
            } else {
                mapInstance.setView([lat, lon], 12);
            }
            // Remove old markers
            mapInstance.eachLayer(layer => {
                if (layer instanceof L.Marker) mapInstance.removeLayer(layer);
            });
            L.marker([lat, lon]).bindPopup(title || 'Location').addTo(mapInstance);
        }

        // Close autocomplete on outside click
        document.addEventListener('click', e => {
            if (!e.target.closest('#unifiedInput')) {
                document.getElementById('unifiedAutocompleteList').style.display = 'none';
            }
        });

        function logout() {
            auth.signOut().then(() => {
                document.getElementById('dashboardScreen').style.display = 'none';
                document.getElementById('authScreen').style.display = 'block';
            });
        }

        auth.onAuthStateChanged(user => { if (user) showDashboard(); });
    </script>
</body>
</html>
