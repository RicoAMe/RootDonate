<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a1f2f">
  <title>ROOT DONATE • Global Discovery</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

  <style>
    :root {
      --primary: #00b894;
      --accent: #00d2a0;
      --dark: #0a1f2f;
      --card: #13293d;
      --text: #e0f2f1;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--dark);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    .header {
      padding: 16px 20px;
      background: rgba(10, 31, 47, 0.98);
      border-bottom: 1px solid #1e3a5f;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header h1 {
      font-size: 1.65rem;
      font-weight: 600;
      letter-spacing: 1px;
    }

    .user-info {
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
    }

    .search-container {
      position: relative;
      margin: 16px 20px;
    }

    .search-bar {
      width: 100%;
      padding: 16px 20px 16px 52px;
      background: #1e3a5f;
      border: 1px solid #00b894;
      border-radius: 50px;
      color: white;
      font-size: 1.05rem;
      outline: none;
    }

    .search-bar::placeholder { color: #88a5b8; }

    .suggestions {
      position: absolute;
      top: 100%;
      left: 0; right: 0;
      background: #13293d;
      border: 1px solid #00b894;
      border-radius: 16px;
      margin-top: 8px;
      max-height: 420px;
      overflow-y: auto;
      z-index: 200;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      display: none;
    }

    .suggestion-item {
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
      border-bottom: 1px solid #1e3a5f;
    }
    .suggestion-item:hover { background: #1e3a5f; }

    .nodes-grid {
      padding: 0 20px 20px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px;
    }

    .place-card {
      background: var(--card);
      border: 1px solid #1e3a5f;
      border-radius: 16px;
      padding: 20px;
      cursor: pointer;
      transition: all 0.3s ease;
      position: relative;
    }
    .place-card:hover {
      transform: translateY(-6px);
      border-color: var(--primary);
      box-shadow: 0 10px 25px rgba(0,184,148,0.2);
    }

    .impact-bar {
      height: 6px;
      background: #1e3a5f;
      border-radius: 10px;
      margin-top: 8px;
      overflow: hidden;
    }
    .impact-fill {
      height: 100%;
      background: linear-gradient(90deg, #00b894, #00d2a0);
      transition: width 0.4s ease;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(10,31,47,0.97);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-content {
      background: #13293d;
      border-radius: 20px;
      width: 100%;
      max-width: 560px;
      max-height: 92vh;
      overflow-y: auto;
      padding: 24px;
      border: 1px solid #00b894;
    }

    .history-item {
      background: #1e3a5f;
      padding: 12px;
      border-radius: 10px;
      margin-bottom: 10px;
    }

    button.primary {
      background: var(--primary);
      color: #000;
      border: none;
      padding: 14px;
      border-radius: 50px;
      font-weight: 600;
      width: 100%;
      margin: 12px 0;
      font-size: 1.1rem;
    }

    .apple-pay-btn {
      background: #000;
      color: white;
      border: 1px solid white;
      padding: 14px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 1.1rem;
      width: 100%;
    }

    .log {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 140px;
      background: #0a1f2f;
      padding: 12px 20px;
      font-size: 0.9rem;
      overflow-y: auto;
      border-top: 1px solid #1e3a5f;
    }

    .stats {
      display: flex;
      justify-content: space-around;
      background: #1e3a5f;
      padding: 12px;
      border-radius: 12px;
      margin: 15px 0;
    }

    @media (max-width: 480px) {
      .nodes-grid { grid-template-columns: 1fr; padding: 0 12px 20px; }
    }
  </style>
</head>
<body>

  <div class="header">
    <h1><i class="fas fa-globe"></i> ROOT DONATE</h1>
    <div class="user-info" onclick="showProfile()">
      <div style="text-align:right;">
        <div id="usernameDisplay" style="font-weight:600;">@explorer</div>
        <div id="balanceDisplay" style="font-size:0.9rem;color:#00d2a0;">12450 ROOT</div>
      </div>
      <i class="fas fa-user-circle" style="font-size:2rem;color:#00b894;"></i>
    </div>
  </div>

  <div class="search-container">
    <input type="text" id="searchInput" class="search-bar" 
           placeholder="Search any place on Earth..." 
           onkeyup="handleSearch()" autocomplete="off">
    <div id="suggestions" class="suggestions"></div>
  </div>

  <div style="padding:0 20px 10px;">
    <div class="stats">
      <div><strong id="totalDonated">0</strong><br><small>TOTAL ROOT</small></div>
      <div><strong id="placesCount">0</strong><br><small>PLACES</small></div>
      <div><strong id="playerLevel">1</strong><br><small>LEVEL</small></div>
    </div>
  </div>

  <div class="nodes-grid" id="grid"></div>
  <div class="log" id="log"></div>

  <!-- PLACE DETAIL MODAL -->
  <div id="placeModal" class="modal">
    <div class="modal-content">
      <div style="font-size:4.5rem;text-align:center;margin:10px 0;" id="modalIcon"></div>
      <h2 id="modalName"></h2>
      <p id="modalLoc" style="opacity:0.8;margin-bottom:20px;"></p>

      <div class="stats" style="font-size:0.95rem;">
        <div><strong id="placeImpact">0</strong><br>IMPACT</div>
        <div><strong id="placeDonors">0</strong><br>DONORS</div>
      </div>

      <button onclick="copyShareLink()" style="background:transparent;border:1px solid #00b894;color:#00b894;width:100%;margin:10px 0;">
        🔗 Share with Full History
      </button>
      <button onclick="showDonateModal()" class="primary">💰 Donate ROOT Tokens</button>
      <button onclick="applePayDonate()" class="apple-pay-btn">
        <i class="fab fa-apple-pay"></i> Apple Pay
      </button>

      <h3 style="margin:25px 0 12px 0;">Donation History</h3>
      <div id="donationHistory" style="max-height:260px;overflow-y:auto;"></div>

      <button onclick="closePlaceModal()" style="background:transparent;border:1px solid #555;color:#aaa;width:100%;margin-top:20px;">
        Close
      </button>
    </div>
  </div>

  <!-- DONATE MODAL -->
  <div id="donateModal" class="modal">
    <div class="modal-content">
      <h2>Support <span id="donateTo"></span></h2>
      <p>Balance: <strong id="donorBalance"></strong> ROOT</p>
      <input type="number" id="donateAmount" value="150" style="width:100%;padding:14px;font-size:1.2rem;text-align:center;margin:15px 0;border-radius:12px;border:1px solid #00b894;background:#1e3a5f;color:white;">
      <button onclick="confirmDonation()" class="primary">Confirm Donation</button>
      <button onclick="closeDonateModal()" style="background:transparent;border:1px solid #00b894;color:#00b894;width:100%;">Cancel</button>
    </div>
  </div>

  <!-- PROFILE MODAL -->
  <div id="profileModal" class="modal">
    <div class="modal-content">
      <h2>Explorer Profile</h2>
      <p id="profileHandle" style="font-size:1.4rem;"></p>
      <p>Balance: <strong id="profileBalance"></strong> ROOT</p>
      <p>Total Donated: <strong id="profileTotalDonated"></strong> ROOT</p>
      <p>Level: <strong id="profileLevel"></strong></p>
      
      <input type="number" id="topupAmount" placeholder="Top-up amount (demo)" style="width:100%;padding:12px;margin:15px 0;border-radius:12px;">
      <button onclick="topUpBalance()" class="primary">Top Up Balance</button>
      
      <button onclick="resetGame()" style="background:transparent;border:1px solid #f66;color:#f66;width:100%;margin-top:10px;">Reset (Keep Share Links)</button>
      <button onclick="closeProfileModal()" style="background:transparent;border:1px solid #555;color:#aaa;width:100%;margin-top:10px;">Close</button>
    </div>
  </div>

  <script>
    let places = [];
    let currentUser = { 
      handle: "@explorer", 
      balance: 12450,
      totalDonated: 0,
      level: 1
    };
    let currentPlace = null;
    let totalRootDonated = 0;

    const logEl = document.getElementById('log');
    function log(msg) {
      const time = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
      logEl.innerHTML += `<span style="opacity:0.6">[${time}]</span> ${msg}<br>`;
      logEl.scrollTop = logEl.scrollHeight;
    }

    async function nominatimSearch(query) {
      if (query.length < 3) return [];
      try {
        const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=8`, {
          headers: { 'User-Agent': 'ROOTDonateGame' }
        });
        const data = await res.json();
        return data.map(item => ({
          name: item.name || item.display_name.split(',')[0],
          full: item.display_name,
          icon: "📍"
        }));
      } catch(e) { return []; }
    }

    async function handleSearch() {
      const q = document.getElementById('searchInput').value.trim();
      const container = document.getElementById('suggestions');
      if (q.length < 3) { container.style.display = 'none'; return; }

      container.innerHTML = `<div style="padding:16px;color:#88a5b8;">Searching global map...</div>`;
      container.style.display = 'block';

      const results = await nominatimSearch(q);
      container.innerHTML = '';

      results.forEach(place => {
        const div = document.createElement('div');
        div.className = 'suggestion-item';
        div.innerHTML = `<span style="font-size:1.6rem;">${place.icon}</span><div><strong>${place.name}</strong><br><small>${place.full}</small></div>`;
        div.onclick = () => {
          document.getElementById('searchInput').value = '';
          container.style.display = 'none';

          const newPlace = { 
            id: `EM-${Date.now().toString().slice(-8)}`, 
            name: place.name, 
            loc: place.full, 
            icon: place.icon, 
            donations: [],
            impact: 0
          };
          places.unshift(newPlace);
          saveGame();
          renderPlaces();
          log(`🌍 Discovered: ${place.name}`);
        };
        container.appendChild(div);
      });
    }

    function calculateLevel() {
      return Math.floor(Math.sqrt(currentUser.totalDonated / 500)) + 1;
    }

    function updateStats() {
      document.getElementById('totalDonated').textContent = totalRootDonated.toLocaleString();
      document.getElementById('placesCount').textContent = places.length;
      currentUser.level = calculateLevel();
      document.getElementById('playerLevel').textContent = currentUser.level;
    }

    function renderPlaces() {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      places.forEach(place => {
        const totalImpact = place.donations.reduce((sum, d) => sum + d.amount, 0);
        const card = document.createElement('div');
        card.className = 'place-card';
        card.innerHTML = `
          <div style="font-size:3.5rem;text-align:center;margin:12px 0;">${place.icon}</div>
          <h3>${place.name}</h3>
          <p style="opacity:0.8;">${place.loc}</p>
          <div class="impact-bar"><div class="impact-fill" style="width:${Math.min(totalImpact/10, 100)}%"></div></div>
          <small style="opacity:0.7;">${totalImpact} ROOT donated</small>
        `;
        card.onclick = () => showPlaceDetail(place);
        grid.appendChild(card);
      });
      updateStats();
    }

    function showPlaceDetail(place) {
      currentPlace = place;
      if (!place.donations) place.donations = [];
      if (!place.impact) place.impact = 0;

      document.getElementById('modalIcon').textContent = place.icon;
      document.getElementById('modalName').textContent = place.name;
      document.getElementById('modalLoc').textContent = place.loc;

      const totalImpact = place.donations.reduce((sum, d) => sum + d.amount, 0);
      document.getElementById('placeImpact').textContent = totalImpact;
      document.getElementById('placeDonors').textContent = place.donations.length;

      const histContainer = document.getElementById('donationHistory');
      histContainer.innerHTML = place.donations.length === 0 
        ? `<p style="opacity:0.6;text-align:center;padding:30px;">No donations yet — be the first explorer!</p>`
        : place.donations.map(d => `
            <div class="history-item">
              <strong>💰 ${d.amount} ROOT</strong> from ${d.from}<br>
              <small>${d.time}</small>
            </div>
          `).join('');
      
      document.getElementById('placeModal').style.display = 'flex';
    }

    function closePlaceModal() { 
      document.getElementById('placeModal').style.display = 'none'; 
    }

    function copyShareLink() {
      if (!currentPlace) return;
      const data = {
        id: currentPlace.id,
        name: currentPlace.name,
        loc: currentPlace.loc,
        icon: currentPlace.icon,
        donations: currentPlace.donations || []
      };
      const encoded = btoa(encodeURIComponent(JSON.stringify(data)));
      const shareUrl = `${window.location.origin}${window.location.pathname}#${encoded}`;
      navigator.clipboard.writeText(shareUrl);
      alert("✅ Share link with full donation history copied!\n\nAnyone can open it to continue the story.");
    }

    function loadFromHash() {
      const hash = window.location.hash.substring(1);
      if (!hash) return;
      try {
        const decoded = decodeURIComponent(atob(hash));
        const data = JSON.parse(decoded);
        let place = places.find(p => p.id === data.id);
        if (!place) {
          place = { 
            id: data.id, 
            name: data.name, 
            loc: data.loc || "Shared Location", 
            icon: data.icon || "📍", 
            donations: [] 
          };
          places.unshift(place);
        }
        place.donations = data.donations || [];
        saveGame();
        renderPlaces();
        showPlaceDetail(place);
        log("📥 Loaded shared legacy place");
      } catch(e) {
        console.error("Invalid share link");
      }
    }

    function showDonateModal() {
      document.getElementById('donateTo').textContent = currentPlace.name;
      document.getElementById('donorBalance').textContent = currentUser.balance;
      document.getElementById('donateAmount').value = "150";
      document.getElementById('donateModal').style.display = 'flex';
    }

    function confirmDonation() {
      const amount = parseInt(document.getElementById('donateAmount').value) || 0;
      if (amount <= 0 || amount > currentUser.balance) {
        alert("Invalid amount or insufficient balance");
        return;
      }
      
      currentUser.balance -= amount;
      currentUser.totalDonated += amount;
      totalRootDonated += amount;

      currentPlace.donations.unshift({
        from: currentUser.handle,
        amount: amount,
        time: new Date().toLocaleString()
      });

      document.getElementById('balanceDisplay').textContent = currentUser.balance + " ROOT";
      log(`💰 Donated ${amount} ROOT to ${currentPlace.name} — Impact increased!`);
      
      closeDonateModal();
      showPlaceDetail(currentPlace);
      saveGame();
      renderPlaces();
    }

    function applePayDonate() {
      const amount = prompt("Enter amount for Apple Pay donation:", "200");
      if (amount) {
        document.getElementById('donateAmount').value = amount;
        confirmDonation();
      }
    }

    function closeDonateModal() { 
      document.getElementById('donateModal').style.display = 'none'; 
    }

    function showProfile() {
      document.getElementById('profileHandle').textContent = currentUser.handle;
      document.getElementById('profileBalance').textContent = currentUser.balance;
      document.getElementById('profileTotalDonated').textContent = currentUser.totalDonated;
      document.getElementById('profileLevel').textContent = currentUser.level;
      document.getElementById('profileModal').style.display = 'flex';
    }

    function topUpBalance() {
      const amount = parseInt(document.getElementById('topupAmount').value) || 0;
      if (amount > 0) {
        currentUser.balance += amount;
        document.getElementById('balanceDisplay').textContent = currentUser.balance + " ROOT";
        document.getElementById('profileBalance').textContent = currentUser.balance;
        log(`💵 Topped up ${amount} ROOT (demo)`);
        saveGame();
      }
    }

    function closeProfileModal() { 
      document.getElementById('profileModal').style.display = 'none'; 
    }

    function saveGame() {
      localStorage.setItem('rootDonateGame', JSON.stringify({
        places: places,
        user: currentUser,
        totalRootDonated: totalRootDonated
      }));
    }

    function loadGame() {
      const saved = localStorage.getItem('rootDonateGame');
      if (saved) {
        const data = JSON.parse(saved);
        places = data.places || [];
        currentUser = data.user || currentUser;
        totalRootDonated = data.totalRootDonated || 0;
      }
    }

    function resetGame() {
      if (confirm("Reset all progress? Share links will still work.")) {
        localStorage.removeItem('rootDonateGame');
        location.reload();
      }
    }

    window.onload = () => {
      loadGame();

      // Add starter places if none exist
      if (places.length === 0) {
        places = [
          { id: "EM-1001", name: "Machu Picchu", loc: "Cusco Region, Peru", icon: "🏔️", donations: [], impact: 2450 },
          { id: "EM-1002", name: "Great Pyramid of Giza", loc: "Giza, Egypt", icon: "🪦", donations: [], impact: 1890 },
          { id: "EM-1003", name: "Great Barrier Reef", loc: "Queensland, Australia", icon: "🐠", donations: [], impact: 3200 }
        ];
      }

      renderPlaces();
      document.getElementById('usernameDisplay').textContent = currentUser.handle;
      document.getElementById('balanceDisplay').textContent = currentUser.balance + " ROOT";
      
      log("🌍 Welcome back to ROOT DONATE — Global Discovery Edition");
      log("Permanent save enabled • Share links carry full history");

      loadFromHash();

      // Auto-save every 30 seconds
      setInterval(saveGame, 30000);
    };
  </script>
</body>
</html>
