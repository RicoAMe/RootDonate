<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Root Donate</title>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #00ff9d;
      --accent: #ff00aa;
      --bg: #0a0a0f;
      --card: #111118;
      --border: #222226;
      --text: #e8e8e8;
      --muted: #999;
      --danger: #ff5c7a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      padding: 12px;
      padding-bottom: max(20px, env(safe-area-inset-bottom));
      display: flex;
      justify-content: center;
      line-height: 1.5;
    }

    .container {
      max-width: 440px;
      width: 100%;
      background: var(--card);
      border-radius: 28px;
      border: 1px solid var(--border);
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0, 255, 157, 0.07);
      margin-top: 8px;
    }

    .header {
      background: linear-gradient(135deg, #00ff9d 0%, #ff00aa 100%);
      color: #000;
      padding: 26px 20px 22px;
      text-align: center;
      position: relative;
    }

    .header h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.7rem;
      font-weight: 700;
      letter-spacing: -0.7px;
    }

    .profile-name {
      font-size: 1.1rem;
      font-weight: 700;
      margin-top: 4px;
      word-break: break-word;
    }

    .header-actions {
      position: absolute;
      top: 12px;
      right: 12px;
      display: flex;
      gap: 6px;
    }

    .header-btn {
      background: rgba(0, 0, 0, 0.18);
      border: none;
      color: #000;
      font-size: 12px;
      font-weight: 600;
      padding: 7px 12px;
      border-radius: 999px;
      cursor: pointer;
      min-height: 32px;
      transition: background 0.2s;
    }

    .header-btn:active {
      background: rgba(0, 0, 0, 0.28);
    }

    .content {
      padding: 20px 16px 28px;
    }

    .auth-form {
      display: none;
      flex-direction: column;
      gap: 12px;
    }

    .auth-form.active {
      display: flex;
    }

    input,
    textarea {
      width: 100%;
      padding: 15px 16px;
      border-radius: 14px;
      border: 1px solid #333;
      background: #1a1a22;
      color: white;
      font-size: 16px;
      outline: none;
      font-family: inherit;
      transition: border-color 0.2s;
    }

    input:focus,
    textarea:focus {
      border-color: var(--primary);
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    .auth-toggle {
      text-align: center;
      margin-top: 6px;
      font-size: 0.9rem;
      color: var(--muted);
    }

    .auth-toggle span {
      color: var(--primary);
      cursor: pointer;
      font-weight: 600;
    }

    .btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 14px;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s, opacity 0.2s;
      min-height: 52px;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .primary-btn {
      background: var(--primary);
      color: #000;
    }

    .secondary-btn {
      background: #1f1f26;
      color: white;
      border: 1px solid #333;
      margin-top: 10px;
    }

    .danger-btn {
      background: transparent;
      color: var(--danger);
      border: 1px solid var(--danger);
      padding: 9px 16px;
      font-size: 0.85rem;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      min-height: 38px;
    }

    .section-title {
      font-size: 1.05rem;
      font-weight: 600;
      margin: 4px 0 14px;
      color: #ccc;
    }

    .item-card, .user-card, .chat-card {
      background: #1a1a22;
      border: 1px solid #2a2a32;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
      transition: border-color 0.2s;
    }

    .item-card:hover, .user-card:hover, .chat-card:hover {
      border-color: #3a3a45;
    }

    .item-title, .user-name {
      font-weight: 700;
      font-size: 1.05rem;
      margin-bottom: 4px;
      word-break: break-word;
    }

    .item-price {
      font-size: 1rem;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 6px;
    }

    .item-desc, .user-handle {
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 14px;
      line-height: 1.45;
    }

    .item-actions {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .offers-list {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid #2a2a32;
      font-size: 0.85rem;
    }

    .offer-item {
      background: #15151c;
      padding: 12px 14px;
      border-radius: 12px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .offer-email {
      color: var(--primary);
      font-weight: 600;
      word-break: break-all;
      flex: 1;
    }

    .empty-state {
      text-align: center;
      padding: 40px 16px;
      color: #666;
      font-size: 0.95rem;
      line-height: 1.5;
    }

    .add-item-form {
      display: none;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
      padding: 16px;
      background: #1a1a22;
      border-radius: 16px;
      border: 1px solid #2a2a32;
    }

    .add-item-form.active {
      display: flex;
    }

    .own-badge {
      display: none;
      text-align: center;
      font-size: 0.85rem;
      color: var(--primary);
      margin-bottom: 18px;
      font-weight: 600;
    }

    .chat-panel {
      display: none;
      flex-direction: column;
      height: 420px;
      background: #15151c;
      border-radius: 16px;
      border: 1px solid #2a2a32;
      margin-top: 16px;
      overflow: hidden;
    }

    .chat-panel.active {
      display: flex;
    }

    .chat-header {
      padding: 12px 16px;
      background: #1a1a22;
      border-bottom: 1px solid #2a2a32;
      font-weight: 600;
      font-size: 0.95rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .msg {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 0.9rem;
      line-height: 1.4;
      word-break: break-word;
    }

    .msg.me {
      align-self: flex-end;
      background: var(--primary);
      color: #000;
      border-bottom-right-radius: 4px;
    }

    .msg.them {
      align-self: flex-start;
      background: #2a2a35;
      border-bottom-left-radius: 4px;
    }

    .chat-input-area {
      display: flex;
      gap: 8px;
      padding: 12px;
      border-top: 1px solid #2a2a32;
      background: #1a1a22;
    }

    .chat-input-area input {
      flex: 1;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 15px;
    }

    .chat-send {
      background: var(--primary);
      color: #000;
      border: none;
      width: 46px;
      border-radius: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    .toast {
      position: fixed;
      bottom: max(28px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      background: #111;
      color: var(--primary);
      padding: 14px 26px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.95rem;
      display: none;
      z-index: 9999;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.55);
      max-width: 90%;
      text-align: center;
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      padding: 20px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal {
      background: #15151c;
      border: 1px solid #2a2a32;
      border-radius: 20px;
      padding: 24px 20px;
      width: 100%;
      max-width: 360px;
      animation: slideUp 0.25s ease;
    }

    @keyframes slideUp {
      from {
        transform: translateY(30px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    .modal h3 {
      font-family: 'Space Grotesk', sans-serif;
      margin-bottom: 16px;
      font-size: 1.2rem;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 18px;
    }

    .modal-actions .btn {
      flex: 1;
      margin: 0;
    }

    .main-ui {
      display: none;
    }

    .main-ui.active {
      display: block;
    }

    .loading-text {
      text-align: center;
      padding: 60px 20px;
      color: #888;
      font-size: 1rem;
    }

    .chat-btn {
      background: transparent;
      border: 1px solid var(--primary);
      color: var(--primary);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }

    /* ===== Search + Nav ===== */
    .nav-tabs {
      display: none;
      gap: 8px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    .nav-tabs.visible {
      display: flex;
    }

    .nav-btn {
      flex: 1;
      min-width: 90px;
      padding: 10px 8px;
      border-radius: 12px;
      border: 1px solid #333;
      background: #1a1a22;
      color: #ccc;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      text-align: center;
    }

    .nav-btn.active {
      background: var(--primary);
      color: #000;
      border-color: var(--primary);
    }

    .search-wrap {
      display: none;
      margin-bottom: 16px;
    }

    .search-wrap.visible {
      display: block;
    }

    .search-wrap input {
      padding: 13px 16px;
      border-radius: 14px;
    }

    .view-section {
      display: none;
    }

    .view-section.active {
      display: block;
    }

    .chat-meta {
      font-size: 0.85rem;
      color: var(--muted);
      margin-top: 4px;
    }

    .chat-actions {
      margin-top: 12px;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    @media (max-width: 380px) {
      .header {
        padding: 22px 16px 18px;
      }
      .content {
        padding: 16px 12px 22px;
      }
      .header h1 {
        font-size: 1.5rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Root Donate</h1>
      <div class="profile-name" id="profileName">Loading...</div>
      <div class="header-actions">
        <button class="header-btn" id="myProfileBtn" style="display:none;">My Profile</button>
        <button class="header-btn" id="logoutBtn" style="display:none;">Logout</button>
        <button class="header-btn" id="loginHeaderBtn" style="display:none;">Login</button>
      </div>
    </div>

    <div class="content">
      <!-- Auth Forms -->
      <div class="auth-form" id="loginForm">
        <input type="email" id="loginEmail" placeholder="Email" autocomplete="email">
        <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password">
        <button class="btn primary-btn" id="loginBtn">Log In</button>
        <div class="auth-toggle">
          Don't have an account? <span id="showSignup">Sign Up</span>
        </div>
      </div>

      <div class="auth-form" id="signupForm">
        <input type="text" id="signupName" placeholder="Display Name" autocomplete="name">
        <input type="text" id="signupHandle" placeholder="Handle (e.g. john)" autocomplete="username">
        <input type="email" id="signupEmail" placeholder="Email" autocomplete="email">
        <input type="password" id="signupPassword" placeholder="Password (min 6 characters)" autocomplete="new-password">
        <button class="btn primary-btn" id="signupBtn">Create Account</button>
        <div class="auth-toggle">
          Already have an account? <span id="showLogin">Log In</span>
        </div>
      </div>

      <!-- Main UI -->
      <div class="main-ui" id="mainUI">
        <div class="own-badge" id="ownBadge">This is your profile – add items you want to sell</div>

        <!-- Navigation Tabs -->
        <div class="nav-tabs" id="navTabs">
          <button class="nav-btn active" data-view="items">Items</button>
          <button class="nav-btn" data-view="users">Find People</button>
          <button class="nav-btn" data-view="chats">My Chats</button>
        </div>

        <!-- Search Bar -->
        <div class="search-wrap" id="searchWrap">
          <input type="text" id="searchInput" placeholder="Search..." autocomplete="off">
        </div>

        <!-- ITEMS VIEW -->
        <div class="view-section active" id="itemsView">
          <div class="section-title" id="itemsSectionTitle">Items for Sale</div>

          <div class="add-item-form" id="addItemForm">
            <input type="text" id="itemTitle" placeholder="Item name (e.g. iPhone 13)">
            <input type="text" id="itemPrice" placeholder="Price (e.g. $250 or Make Offer)">
            <textarea id="itemDesc" rows="2" placeholder="Description (condition, size, etc.)"></textarea>
            <button class="btn primary-btn" id="saveItemBtn">Add Item</button>
            <button class="btn secondary-btn" id="cancelItemBtn">Cancel</button>
          </div>

          <button class="btn primary-btn" id="showAddBtn" style="display:none; margin-bottom:20px;">
            + Add Item for Sale
          </button>

          <div id="itemsList"></div>
        </div>

        <!-- USERS SEARCH VIEW -->
        <div class="view-section" id="usersView">
          <div class="section-title">Find People</div>
          <div id="usersList"></div>
        </div>

        <!-- CHATS VIEW -->
        <div class="view-section" id="chatsView">
          <div class="section-title">My Chats</div>
          <div id="chatsList"></div>
        </div>

        <!-- Chat Panel -->
        <div class="chat-panel" id="chatPanel">
          <div class="chat-header">
            <span id="chatTitle">Chat</span>
            <button class="header-btn" id="closeChatBtn" style="background:rgba(255,255,255,0.1);color:#fff;">Close</button>
          </div>
          <div class="chat-messages" id="chatMessages"></div>
          <div class="chat-input-area">
            <input type="text" id="chatInput" placeholder="Type a message..." maxlength="500">
            <button class="chat-send" id="chatSendBtn">→</button>
          </div>
        </div>

        <button class="btn secondary-btn" id="shareBtn" style="display:none; margin-top:16px;">
          🔗 Share My Shop Link
        </button>
      </div>

      <div class="loading-text" id="loadingText">Loading...</div>
    </div>
  </div>

  <!-- Offer Modal -->
  <div class="modal-overlay" id="claimModal">
    <div class="modal">
      <h3>Make an Offer</h3>
      <p style="color:#aaa;font-size:0.9rem;margin-bottom:14px;" id="claimItemName"></p>
      <input type="email" id="claimEmail" placeholder="Your email">
      <textarea id="claimMessage" rows="2" placeholder="Your offer (price, questions, pickup…)" style="margin-top:10px;"></textarea>
      <div class="modal-actions">
        <button class="btn secondary-btn" id="cancelClaimBtn">Cancel</button>
        <button class="btn primary-btn" id="confirmClaimBtn">Send Offer</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // ========== FIREBASE ==========
    const firebaseConfig = {
      apiKey: "AIzaSyBvcCBsPiMxS7G2evPjM7sANp-zSy_RkKM",
      authDomain: "rootdonate-61e61.firebaseapp.com",
      databaseURL: "https://rootdonate-61e61-default-rtdb.firebaseio.com",
      projectId: "rootdonate-61e61",
      storageBucket: "rootdonate-61e61.firebasestorage.app",
      messagingSenderId: "754240963907",
      appId: "1:754240963907:web:5417c2763d8f02108bdbf6",
      measurementId: "G-0SC5R5ELT1"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // ========== STATE ==========
    let currentUser = null;
    let viewingUserId = null;
    let profile = {};
    let isOwnProfile = false;
    let items = [];
    let currentChatId = null;
    let itemsUnsub = null;
    let chatUnsub = null;
    let currentView = "items";
    let allChats = [];
    let searchTimeout = null;

    // ========== HELPERS ==========
    function showToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.style.display = "block";
      clearTimeout(t._timeout);
      t._timeout = setTimeout(() => {
        t.style.display = "none";
      }, 4000);
    }

    function escapeHtml(text) {
      if (!text) return "";
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    function showAuth(mode = "login") {
      document.getElementById("loadingText").style.display = "none";
      document.getElementById("mainUI").classList.remove("active");
      document.getElementById("loginForm").classList.toggle("active", mode === "login");
      document.getElementById("signupForm").classList.toggle("active", mode === "signup");
      document.getElementById("profileName").textContent = mode === "login" ? "Welcome back" : "Create Account";
      updateHeaderButtons(false);
      closeChat();
    }

    function showMainUI() {
      document.getElementById("loadingText").style.display = "none";
      document.getElementById("loginForm").classList.remove("active");
      document.getElementById("signupForm").classList.remove("active");
      document.getElementById("mainUI").classList.add("active");
    }

    function updateHeaderButtons(loggedIn) {
      document.getElementById("logoutBtn").style.display = loggedIn ? "block" : "none";
      document.getElementById("loginHeaderBtn").style.display = loggedIn ? "none" : "block";
      document.getElementById("myProfileBtn").style.display = (loggedIn && !isOwnProfile) ? "block" : "none";
    }

    // ========== VIEW SWITCHING ==========
    function switchView(view) {
      currentView = view;
      document.querySelectorAll(".nav-btn").forEach(b => {
        b.classList.toggle("active", b.dataset.view === view);
      });
      document.querySelectorAll(".view-section").forEach(s => s.classList.remove("active"));
      document.getElementById(view + "View").classList.add("active");

      const searchInput = document.getElementById("searchInput");
      if (view === "items") {
        searchInput.placeholder = "Search items...";
        renderItems();
      } else if (view === "users") {
        searchInput.placeholder = "Search by handle (e.g. john or @john)";
        document.getElementById("usersList").innerHTML = `<div class="empty-state">Type a handle to search for people</div>`;
      } else if (view === "chats") {
        searchInput.placeholder = "Search chats...";
        loadMyChats();
      }
      searchInput.value = "";
    }

    // ========== CHAT ==========
    function appendMessage(m) {
      const box = document.getElementById("chatMessages");
      const isMe = m.senderId === currentUser?.uid;
      const div = document.createElement("div");
      div.className = `msg ${isMe ? "me" : "them"}`;
      div.textContent = m.text;
      box.appendChild(div);
      box.scrollTop = box.scrollHeight;
    }

    async function openChat(chatId, email) {
      if (!currentUser) {
        showToast("Please log in to chat");
        return;
      }

      if (chatUnsub) {
        chatUnsub();
        chatUnsub = null;
      }

      currentChatId = chatId;
      document.getElementById("chatTitle").textContent = `Chat with ${email}`;
      document.getElementById("chatPanel").classList.add("active");
      document.getElementById("chatMessages").innerHTML = "";
      document.getElementById("chatInput").value = "";
      document.getElementById("chatInput").focus();

      document.getElementById("chatPanel").scrollIntoView({ behavior: "smooth", block: "nearest" });

      chatUnsub = db.collection("chats").doc(chatId).collection("messages")
        .orderBy("createdAt", "asc")
        .onSnapshot((snap) => {
          const box = document.getElementById("chatMessages");
          box.innerHTML = "";
          snap.forEach(doc => {
            const m = doc.data();
            appendMessage(m);
          });
          box.scrollTop = box.scrollHeight;
        }, (err) => {
          console.error("Chat listener error:", err);
          showToast("Could not load chat messages");
        });
    }

    async function sendChatMessage() {
      const text = document.getElementById("chatInput").value.trim();
      if (!text || !currentChatId || !currentUser) return;

      document.getElementById("chatInput").value = "";

      try {
        await db.collection("chats").doc(currentChatId).collection("messages").add({
          text,
          senderId: currentUser.uid,
          senderEmail: currentUser.email || "",
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
      } catch (err) {
        console.error(err);
        showToast("Failed to send message");
      }
    }

    function closeChat() {
      if (chatUnsub) {
        chatUnsub();
        chatUnsub = null;
      }
      document.getElementById("chatPanel").classList.remove("active");
      currentChatId = null;
    }

    // ========== DELETE CHAT ==========
    async function deleteChat(chatId) {
      if (!confirm("Delete this chat permanently?\nAll messages will be removed.")) return;

      try {
        // 1. Delete all messages
        const messagesSnap = await db.collection("chats").doc(chatId).collection("messages").get();
        
        // Use batches (max 500 operations per batch)
        const docs = messagesSnap.docs;
        for (let i = 0; i < docs.length; i += 450) {
          const batch = db.batch();
          docs.slice(i, i + 450).forEach(doc => batch.delete(doc.ref));
          await batch.commit();
        }

        // 2. Delete the chat document
        await db.collection("chats").doc(chatId).delete();

        showToast("✅ Chat deleted");

        // Close if currently open
        if (currentChatId === chatId) {
          closeChat();
        }

        // Refresh list
        const currentSearch = document.getElementById("searchInput").value;
        loadMyChats(currentSearch);

      } catch (err) {
        console.error(err);
        showToast("Failed to delete chat");
      }
    }

    // ========== LOAD PROFILE + ITEMS ==========
    async function loadProfile(uid) {
      if (!uid) return;

      viewingUserId = uid;
      closeChat();
      switchView("items");

      const loading = document.getElementById("loadingText");
      loading.style.display = "block";
      loading.textContent = "Loading profile...";
      document.getElementById("mainUI").classList.remove("active");

      if (itemsUnsub) {
        itemsUnsub();
        itemsUnsub = null;
      }

      try {
        const doc = await db.collection("users").doc(uid).get();
        if (!doc.exists) {
          showToast("Profile not found");
          loading.textContent = "Profile not found";
          return;
        }

        profile = doc.data();
        isOwnProfile = !!(currentUser && currentUser.uid === uid);

        document.getElementById("profileName").textContent = profile.name || profile.handle || "User";
        document.getElementById("ownBadge").style.display = isOwnProfile ? "block" : "none";
        document.getElementById("showAddBtn").style.display = isOwnProfile ? "block" : "none";
        document.getElementById("shareBtn").style.display = isOwnProfile ? "block" : "none";
        document.getElementById("addItemForm").classList.remove("active");

        const showNav = !!currentUser;
        document.getElementById("navTabs").classList.toggle("visible", showNav);
        document.getElementById("searchWrap").classList.toggle("visible", showNav);

        itemsUnsub = db.collection("users").doc(uid).collection("items")
          .orderBy("createdAt", "desc")
          .onSnapshot(async (snap) => {
            const promises = snap.docs.map(async (itemDoc) => {
              const itemData = { id: itemDoc.id, ...itemDoc.data(), offers: [] };

              if (isOwnProfile) {
                try {
                  const offersSnap = await db.collection("users").doc(uid)
                    .collection("items").doc(itemDoc.id)
                    .collection("offers")
                    .orderBy("createdAt", "desc")
                    .get();
                  offersSnap.forEach(o => itemData.offers.push({ id: o.id, ...o.data() }));
                } catch (e) {
                  console.warn("Failed to load offers for item", itemDoc.id, e);
                }
              }
              return itemData;
            });

            items = await Promise.all(promises);
            renderItems();
            showMainUI();
            updateHeaderButtons(!!currentUser);
          }, (err) => {
            console.error(err);
            showToast("Failed to load items");
          });

      } catch (err) {
        console.error(err);
        showToast("Failed to load profile");
        loading.textContent = "Error loading profile";
      }
    }

    function renderItems(filterText = "") {
      const list = document.getElementById("itemsList");
      list.innerHTML = "";

      const q = filterText.trim().toLowerCase();
      const filtered = q
        ? items.filter(item =>
            (item.title || "").toLowerCase().includes(q) ||
            (item.price || "").toLowerCase().includes(q) ||
            (item.description || "").toLowerCase().includes(q)
          )
        : items;

      if (filtered.length === 0) {
        list.innerHTML = `<div class="empty-state">${
          items.length === 0
            ? (isOwnProfile
                ? "No items yet.<br>Add something you want to sell!"
                : "This person hasn't listed any items for sale yet.")
            : "No items match your search."
        }</div>`;
        return;
      }

      filtered.forEach((item) => {
        const card = document.createElement("div");
        card.className = "item-card";

        let offersHtml = "";
        if (isOwnProfile && item.offers?.length > 0) {
          offersHtml = `
            <div class="offers-list">
              <strong style="color:#ccc;">Offers (${item.offers.length}):</strong>
              ${item.offers.map(o => `
                <div class="offer-item">
                  <div>
                    <div class="offer-email">${escapeHtml(o.email)}</div>
                    ${o.message ? `<div style="color:#aaa;margin-top:4px;font-size:0.85rem;">${escapeHtml(o.message)}</div>` : ""}
                  </div>
                  <button class="chat-btn open-chat" data-chat="${o.chatId || ""}" data-email="${escapeHtml(o.email)}">Chat</button>
                </div>
              `).join("")}
            </div>
          `;
        }

        const actionsHtml = isOwnProfile
          ? `<button class="danger-btn delete-btn" data-id="${item.id}">Delete</button>`
          : `<button class="btn primary-btn claim-btn" style="padding:11px 18px;font-size:0.9rem;width:auto;min-height:42px;"
               data-id="${item.id}" data-title="${escapeHtml(item.title)}">
               Make Offer
             </button>`;

        card.innerHTML = `
          <div class="item-title">${escapeHtml(item.title)}</div>
          ${item.price ? `<div class="item-price">${escapeHtml(item.price)}</div>` : ""}
          ${item.description ? `<div class="item-desc">${escapeHtml(item.description)}</div>` : ""}
          <div class="item-actions">${actionsHtml}</div>
          ${offersHtml}
        `;
        list.appendChild(card);
      });

      list.querySelectorAll(".delete-btn").forEach(btn => {
        btn.addEventListener("click", () => deleteItem(btn.dataset.id));
      });
      list.querySelectorAll(".claim-btn").forEach(btn => {
        btn.addEventListener("click", () => openClaimModal(btn.dataset.id, btn.dataset.title));
      });
      list.querySelectorAll(".open-chat").forEach(btn => {
        btn.addEventListener("click", () => {
          if (btn.dataset.chat) {
            openChat(btn.dataset.chat, btn.dataset.email);
          } else {
            showToast("Chat not ready yet");
          }
        });
      });
    }

    // ========== SEARCH USERS ==========
    async function searchUsers(query) {
      const list = document.getElementById("usersList");
      const q = query.trim().toLowerCase();

      if (!q) {
        list.innerHTML = `<div class="empty-state">Type a handle to search for people</div>`;
        return;
      }

      let handleQuery = q.startsWith("@") ? q : "@" + q;
      handleQuery = handleQuery.replace(/[^a-z0-9@_]/g, "");

      list.innerHTML = `<div class="empty-state">Searching...</div>`;

      try {
        const snap = await db.collection("users")
          .where("handle", ">=", handleQuery)
          .where("handle", "<=", handleQuery + "\uf8ff")
          .limit(20)
          .get();

        if (snap.empty) {
          list.innerHTML = `<div class="empty-state">No users found for "${escapeHtml(query)}"</div>`;
          return;
        }

        list.innerHTML = "";
        snap.forEach(doc => {
          const u = doc.data();
          const card = document.createElement("div");
          card.className = "user-card";
          card.innerHTML = `
            <div class="user-name">${escapeHtml(u.name || "User")}</div>
            <div class="user-handle">${escapeHtml(u.handle || "")}</div>
            <button class="btn primary-btn view-profile-btn" style="padding:11px 18px;font-size:0.9rem;width:auto;min-height:42px;"
              data-uid="${doc.id}">
              View Shop
            </button>
          `;
          list.appendChild(card);
        });

        list.querySelectorAll(".view-profile-btn").forEach(btn => {
          btn.addEventListener("click", () => {
            window.history.replaceState({}, "", `?u=${btn.dataset.uid}`);
            loadProfile(btn.dataset.uid);
          });
        });
      } catch (err) {
        console.error(err);
        list.innerHTML = `<div class="empty-state">Search failed. Try again.</div>`;
      }
    }

    // ========== MY CHATS ==========
    async function loadMyChats(filterText = "") {
      if (!currentUser) {
        document.getElementById("chatsList").innerHTML = `<div class="empty-state">Please log in to see your chats</div>`;
        return;
      }

      const list = document.getElementById("chatsList");
      list.innerHTML = `<div class="empty-state">Loading chats...</div>`;

      try {
        const snap = await db.collection("chats")
          .where("participants", "array-contains", currentUser.uid)
          .orderBy("createdAt", "desc")
          .limit(50)
          .get();

        allChats = [];
        snap.forEach(doc => {
          allChats.push({ id: doc.id, ...doc.data() });
        });

        renderChats(filterText);
      } catch (err) {
        console.error(err);
        try {
          const snap = await db.collection("chats")
            .where("participants", "array-contains", currentUser.uid)
            .limit(50)
            .get();
          allChats = [];
          snap.forEach(doc => {
            allChats.push({ id: doc.id, ...doc.data() });
          });
          allChats.sort((a, b) => {
            const ta = a.createdAt?.toMillis?.() || 0;
            const tb = b.createdAt?.toMillis?.() || 0;
            return tb - ta;
          });
          renderChats(filterText);
        } catch (e2) {
          console.error(e2);
          list.innerHTML = `<div class="empty-state">Could not load chats</div>`;
        }
      }
    }

    function renderChats(filterText = "") {
      const list = document.getElementById("chatsList");
      list.innerHTML = "";

      const q = filterText.trim().toLowerCase();
      const filtered = q
        ? allChats.filter(c =>
            (c.itemTitle || "").toLowerCase().includes(q) ||
            (c.buyerEmail || "").toLowerCase().includes(q)
          )
        : allChats;

      if (filtered.length === 0) {
        list.innerHTML = `<div class="empty-state">${
          allChats.length === 0
            ? "No chats yet.<br>Make or receive an offer to start chatting!"
            : "No chats match your search."
        }</div>`;
        return;
      }

      filtered.forEach(chat => {
        const card = document.createElement("div");
        card.className = "chat-card";
        const title = chat.itemTitle || "Item";
        const email = chat.buyerEmail || "User";
        card.innerHTML = `
          <div class="item-title">${escapeHtml(title)}</div>
          <div class="chat-meta">with ${escapeHtml(email)}</div>
          <div class="chat-actions">
            <button class="chat-btn open-chat-from-list" data-chat="${chat.id}" data-email="${escapeHtml(email)}">
              Open Chat
            </button>
            <button class="danger-btn delete-chat-btn" data-chat="${chat.id}">
              Delete
            </button>
          </div>
        `;
        list.appendChild(card);
      });

      list.querySelectorAll(".open-chat-from-list").forEach(btn => {
        btn.addEventListener("click", () => {
          openChat(btn.dataset.chat, btn.dataset.email);
        });
      });

      list.querySelectorAll(".delete-chat-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          deleteChat(btn.dataset.chat);
        });
      });
    }

    // ========== ADD / DELETE ITEM ==========
    async function saveItem() {
      const title = document.getElementById("itemTitle").value.trim();
      const price = document.getElementById("itemPrice").value.trim();
      const description = document.getElementById("itemDesc").value.trim();
      if (!title) return showToast("Please enter an item name");

      const btn = document.getElementById("saveItemBtn");
      btn.disabled = true;
      btn.textContent = "Saving...";

      try {
        await db.collection("users").doc(currentUser.uid).collection("items").add({
          title,
          price: price || "",
          description,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        document.getElementById("itemTitle").value = "";
        document.getElementById("itemPrice").value = "";
        document.getElementById("itemDesc").value = "";
        document.getElementById("addItemForm").classList.remove("active");
        document.getElementById("showAddBtn").style.display = "block";
        showToast("✅ Item listed for sale!");
      } catch (err) {
        console.error(err);
        showToast("Failed to add item");
      } finally {
        btn.disabled = false;
        btn.textContent = "Add Item";
      }
    }

    async function deleteItem(itemId) {
      if (!confirm("Delete this item?")) return;
      try {
        await db.collection("users").doc(currentUser.uid).collection("items").doc(itemId).delete();
        showToast("Item deleted");
      } catch (err) {
        showToast("Failed to delete item");
      }
    }

    // ========== OFFER ==========
    let pendingClaim = { itemId: null, title: "" };

    function openClaimModal(itemId, title) {
      if (!currentUser) {
        showToast("Please log in first to send an offer");
        showAuth("login");
        return;
      }

      pendingClaim = { itemId, title };
      document.getElementById("claimItemName").textContent = `Offering on: ${title}`;
      document.getElementById("claimEmail").value = currentUser.email || "";
      document.getElementById("claimMessage").value = "";
      document.getElementById("claimModal").classList.add("active");
    }

    async function confirmClaim() {
      const email = document.getElementById("claimEmail").value.trim();
      const message = document.getElementById("claimMessage").value.trim();

      if (!email || !email.includes("@")) {
        showToast("Please enter a valid email");
        return;
      }
      if (!currentUser) {
        showToast("You must be logged in");
        return;
      }

      const btn = document.getElementById("confirmClaimBtn");
      btn.disabled = true;
      btn.textContent = "Sending...";

      try {
        const chatRef = await db.collection("chats").add({
          participants: [viewingUserId, currentUser.uid],
          itemId: pendingClaim.itemId,
          itemTitle: pendingClaim.title,
          buyerEmail: email,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        await db.collection("users").doc(viewingUserId)
          .collection("items").doc(pendingClaim.itemId)
          .collection("offers").add({
            email,
            message,
            buyerUid: currentUser.uid,
            chatId: chatRef.id,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });

        if (message) {
          await db.collection("chats").doc(chatRef.id).collection("messages").add({
            text: message,
            senderId: currentUser.uid,
            senderEmail: email,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
        }

        document.getElementById("claimModal").classList.remove("active");
        showToast("✅ Offer sent!");
        openChat(chatRef.id, email);

      } catch (err) {
        console.error(err);
        showToast("Failed to send offer");
      } finally {
        btn.disabled = false;
        btn.textContent = "Send Offer";
      }
    }

    // ========== AUTH ==========
    async function handleLogin() {
      const email = document.getElementById("loginEmail").value.trim();
      const password = document.getElementById("loginPassword").value;
      if (!email || !password) return showToast("Enter email and password");

      const btn = document.getElementById("loginBtn");
      btn.disabled = true;
      btn.textContent = "Logging in...";

      try {
        await auth.signInWithEmailAndPassword(email, password);
        showToast("✅ Logged in!");
      } catch (err) {
        showToast(err.message || "Login failed");
      } finally {
        btn.disabled = false;
        btn.textContent = "Log In";
      }
    }

    async function handleSignup() {
      const name = document.getElementById("signupName").value.trim();
      let handle = document.getElementById("signupHandle").value.trim();
      const email = document.getElementById("signupEmail").value.trim();
      const password = document.getElementById("signupPassword").value;

      if (!name || !handle || !email || !password) return showToast("Please fill all fields");
      if (password.length < 6) return showToast("Password must be at least 6 characters");

      if (!handle.startsWith("@")) handle = "@" + handle;
      handle = handle.toLowerCase().replace(/[^a-z0-9@_]/g, "");

      const btn = document.getElementById("signupBtn");
      btn.disabled = true;
      btn.textContent = "Creating...";

      try {
        const handleSnap = await db.collection("users").where("handle", "==", handle).get();
        if (!handleSnap.empty) {
          showToast("Handle already taken");
          return;
        }

        const cred = await auth.createUserWithEmailAndPassword(email, password);
        await db.collection("users").doc(cred.user.uid).set({
          name,
          handle,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        showToast("✅ Account created!");
      } catch (err) {
        showToast(err.message || "Sign up failed");
      } finally {
        btn.disabled = false;
        btn.textContent = "Create Account";
      }
    }

    async function handleLogout() {
      closeChat();
      await auth.signOut();
      showToast("Logged out");
    }

    function shareProfile() {
      if (!currentUser) return;
      const link = `${window.location.origin}${window.location.pathname}?u=${currentUser.uid}`;
      if (navigator.clipboard?.writeText) {
        navigator.clipboard.writeText(link).then(() => showToast("✅ Shop link copied!"));
      } else {
        prompt("Copy this link:", link);
      }
    }

    // ========== EVENTS ==========
    document.getElementById("loginBtn").addEventListener("click", handleLogin);
    document.getElementById("signupBtn").addEventListener("click", handleSignup);
    document.getElementById("logoutBtn").addEventListener("click", handleLogout);
    document.getElementById("loginHeaderBtn").addEventListener("click", () => showAuth("login"));
    document.getElementById("myProfileBtn").addEventListener("click", () => {
      if (currentUser) {
        window.history.replaceState({}, "", `?u=${currentUser.uid}`);
        loadProfile(currentUser.uid);
      }
    });
    document.getElementById("showSignup").addEventListener("click", () => showAuth("signup"));
    document.getElementById("showLogin").addEventListener("click", () => showAuth("login"));

    document.getElementById("showAddBtn").addEventListener("click", () => {
      document.getElementById("addItemForm").classList.add("active");
      document.getElementById("showAddBtn").style.display = "none";
      document.getElementById("itemTitle").focus();
    });
    document.getElementById("cancelItemBtn").addEventListener("click", () => {
      document.getElementById("addItemForm").classList.remove("active");
      document.getElementById("showAddBtn").style.display = "block";
    });
    document.getElementById("saveItemBtn").addEventListener("click", saveItem);
    document.getElementById("shareBtn").addEventListener("click", shareProfile);

    document.getElementById("confirmClaimBtn").addEventListener("click", confirmClaim);
    document.getElementById("cancelClaimBtn").addEventListener("click", () => {
      document.getElementById("claimModal").classList.remove("active");
    });

    document.getElementById("closeChatBtn").addEventListener("click", closeChat);
    document.getElementById("chatSendBtn").addEventListener("click", sendChatMessage);
    document.getElementById("chatInput").addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendChatMessage();
    });

    document.getElementById("loginPassword").addEventListener("keydown", (e) => {
      if (e.key === "Enter") handleLogin();
    });
    document.getElementById("signupPassword").addEventListener("keydown", (e) => {
      if (e.key === "Enter") handleSignup();
    });

    // Nav tabs
    document.querySelectorAll(".nav-btn").forEach(btn => {
      btn.addEventListener("click", () => switchView(btn.dataset.view));
    });

    // Live search
    document.getElementById("searchInput").addEventListener("input", (e) => {
      const val = e.target.value;
      clearTimeout(searchTimeout);

      if (currentView === "items") {
        renderItems(val);
      } else if (currentView === "chats") {
        renderChats(val);
      } else if (currentView === "users") {
        searchTimeout = setTimeout(() => searchUsers(val), 350);
      }
    });

    // ========== INIT ==========
    auth.onAuthStateChanged(async (user) => {
      currentUser = user;

      const urlUserId = new URLSearchParams(window.location.search).get("u");

      if (urlUserId) {
        await loadProfile(urlUserId);
      } else if (user) {
        window.history.replaceState({}, "", `?u=${user.uid}`);
        await loadProfile(user.uid);
      } else {
        showAuth("login");
      }
    });
  </script>
</body>
</html>
