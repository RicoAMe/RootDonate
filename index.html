<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ROOT DONATE • DECENTRALISED MONETARY MESH</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    :root {
      --neon: #ffd700;
      --glow: #ffd70088;
      --bg: #0a0a0a;
      --card: rgba(20,20,15,0.95);
    }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Courier New', monospace;
      background: var(--bg);
      color: var(--neon);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    canvas#matrix { position: fixed; inset: 0; z-index: -1; opacity: 0.15; }

    .header {
      padding: 16px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255,215,0,0.3);
      background: rgba(10,10,10,0.98);
    }
    .header h1 { font-size: 1.55rem; letter-spacing: 3px; text-shadow: 0 0 15px var(--neon); }

    .user-info {
      display: flex;
      align-items: center;
      gap: 12px;
      cursor: pointer;
    }
    .avatar {
      width: 38px; height: 38px;
      background: #222;
      border: 2px solid var(--neon);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.2rem;
    }

    .nav { /* same as before */ 
      padding: 12px 20px; display: flex; gap: 8px; flex-wrap: wrap;
      border-bottom: 1px solid rgba(255,215,0,0.2);
      background: rgba(10,10,10,0.98);
    }
    .nav button {
      background: transparent; border: 1px solid var(--neon); color: var(--neon);
      padding: 10px 20px; border-radius: 50px; cursor: pointer; transition: all 0.3s;
    }
    .nav button.active, .nav button:hover {
      background: var(--neon); color: #000; box-shadow: 0 0 25px var(--glow);
    }

    .search-bar { /* same */ margin: 16px 20px; padding: 14px 24px; width: calc(100% - 40px);
      background: #111; border: 1px solid var(--neon); border-radius: 50px; color: var(--neon);
    }

    .nodes-grid { flex: 1; padding: 16px 20px; overflow-y: auto;
      display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px;
    }

    .node-card { /* same as before */ }

    .log { height: 140px; background: #0a0a0a; padding: 12px 20px; overflow-y: auto;
      font-size: 0.85rem; border-top: 1px solid rgba(255,215,0,0.3);
    }

    .modal {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.96);
      z-index: 100; align-items: center; justify-content: center; padding: 10px;
    }
    .modal-content {
      background: rgba(20,20,15,0.98); border: 2px solid var(--neon);
      border-radius: 16px; width: 100%; max-width: 480px; padding: 28px;
    }

    .auth-tabs {
      display: flex; margin-bottom: 20px; border-bottom: 1px solid #333;
    }
    .auth-tabs button {
      flex: 1; padding: 12px; background: transparent; color: var(--neon);
      border: none; border-bottom: 3px solid transparent; cursor: pointer;
    }
    .auth-tabs button.active {
      border-bottom: 3px solid var(--neon); font-weight: bold;
    }

    .decentralised-badge { /* same */ }
  </style>
</head>
<body>

  <canvas id="matrix"></canvas>

  <div class="header">
    <h1>🌐 ROOT DONATE</h1>
    <div style="display:flex; align-items:center; gap:15px;">
      <div id="userSection" style="display:none;">
        <div class="user-info" onclick="showProfile()">
          <div id="avatar" class="avatar">👤</div>
          <div>
            <div id="usernameDisplay" style="font-size:1rem;"></div>
            <div style="font-size:0.75rem; opacity:0.7;">Mesh Node</div>
          </div>
        </div>
      </div>
      <button onclick="showAuthModal()" id="authBtn"
              style="padding:8px 20px; border:1px solid var(--neon); background:transparent; color:var(--neon); border-radius:50px;">
        <i class="fas fa-user"></i> LOGIN
      </button>
    </div>
  </div>

  <!-- Rest of your nav, search, grid, log stay the same -->
  <div class="nav">
    <button class="active" onclick="setTab(0)">🌐 LIVE FEED</button>
    <button onclick="setTab(1)">🔎 DEEP NUMIS</button>
    <button onclick="showReportModal()">📢 REPORT FIND</button>
    <button onclick="resetScan()">RESET MESH</button>
  </div>

  <input type="text" id="searchInput" class="search-bar" placeholder="Search coins, notes, mints..." onkeyup="filterNodes()">

  <div class="nodes-grid" id="grid"></div>
  <div class="log" id="log"></div>

  <!-- AUTH MODAL -->
  <div class="modal" id="authModal">
    <div class="modal-content">
      <span onclick="closeAuthModal()" style="position:absolute;top:12px;right:20px;font-size:2.5rem;cursor:pointer;color:var(--neon);">×</span>
      
      <div class="auth-tabs">
        <button onclick="switchAuthTab(0)" id="tabLogin" class="active">LOGIN</button>
        <button onclick="switchAuthTab(1)" id="tabSignup">SIGN UP</button>
      </div>

      <!-- LOGIN -->
      <div id="loginForm">
        <input id="loginUser" placeholder="Username or Handle" style="width:100%;padding:14px;margin:10px 0;background:#111;border:1px solid var(--neon);color:var(--neon);">
        <input id="loginPass" type="password" placeholder="Passphrase" style="width:100%;padding:14px;margin:10px 0;background:#111;border:1px solid var(--neon);color:var(--neon);">
        <button onclick="login()" style="width:100%;padding:16px;margin-top:15px;border:2px solid var(--neon);background:transparent;color:var(--neon);border-radius:50px;">
          ENTER THE MESH
        </button>
      </div>

      <!-- SIGNUP -->
      <div id="signupForm" style="display:none;">
        <input id="signupUser" placeholder="Choose handle (e.g. @cybermidas)" style="width:100%;padding:14px;margin:10px 0;background:#111;border:1px solid var(--neon);color:var(--neon);">
        <input id="signupEmail" placeholder="Email (optional)" style="width:100%;padding:14px;margin:10px 0;background:#111;border:1px solid var(--neon);color:var(--neon);">
        <input id="signupPass" type="password" placeholder="Create passphrase" style="width:100%;padding:14px;margin:10px 0;background:#111;border:1px solid var(--neon);color:var(--neon);">
        <button onclick="signup()" style="width:100%;padding:16px;margin-top:15px;border:2px solid var(--neon);background:transparent;color:var(--neon);border-radius:50px;">
          JOIN THE DECENTRALISED MESH
        </button>
      </div>
    </div>
  </div>

  <!-- Your existing modals (itemModal, reportModal) remain the same -->

  <div class="decentralised-badge">
    <i class="fas fa-globe"></i> OPEN SOURCE • NO SERVERS • P2P READY
  </div>

  <script>
    // === MATRIX RAIN (unchanged) ===
    const canvas = document.getElementById('matrix');
    const ctx = canvas.getContext('2d');
    let drops = [];
    function resize() { /* ... same as before */ }
    window.addEventListener('resize', resize); resize();
    function drawMatrix() { /* ... same */ }
    setInterval(drawMatrix, 40);

    // === APP STATE ===
    let allNodes = [];
    let currentUser = null;
    let currentItem = null;

    const logEl = document.getElementById('log');
    function log(msg) {
      const time = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', second:'2-digit'});
      logEl.innerHTML += `<span style="opacity:0.5">[${time}]</span> ${msg}<br>`;
      logEl.scrollTop = logEl.scrollHeight;
    }

    // === AUTH FUNCTIONS ===
    function showAuthModal() {
      document.getElementById('authModal').style.display = 'flex';
      switchAuthTab(0);
    }
    function closeAuthModal() {
      document.getElementById('authModal').style.display = 'none';
    }

    function switchAuthTab(n) {
      document.getElementById('loginForm').style.display = n === 0 ? 'block' : 'none';
      document.getElementById('signupForm').style.display = n === 1 ? 'block' : 'none';
      document.getElementById('tabLogin').classList.toggle('active', n===0);
      document.getElementById('tabSignup').classList.toggle('active', n===1);
    }

    function signup() {
      const handle = document.getElementById('signupUser').value.trim();
      if (!handle) return alert("Handle required");
      
      currentUser = {
        handle: handle.startsWith('@') ? handle : '@' + handle,
        avatar: '🪙',
        joined: new Date().toLocaleDateString()
      };
      
      localStorage.setItem('rootDonateUser', JSON.stringify(currentUser));
      updateUIAfterLogin();
      closeAuthModal();
      log(`✅ ${currentUser.handle} joined the mesh`);
    }

    function login() {
      const handle = document.getElementById('loginUser').value.trim();
      if (!handle) return alert("Enter handle");

      // Simulate login (in real P2P you would verify signature)
      currentUser = {
        handle: handle.startsWith('@') ? handle : '@' + handle,
        avatar: '🪙',
        joined: "2025"
      };
      
      localStorage.setItem('rootDonateUser', JSON.stringify(currentUser));
      updateUIAfterLogin();
      closeAuthModal();
      log(`🔓 ${currentUser.handle} connected to mesh`);
    }

    function updateUIAfterLogin() {
      document.getElementById('authBtn').style.display = 'none';
      document.getElementById('userSection').style.display = 'block';
      document.getElementById('usernameDisplay').textContent = currentUser.handle;
      document.getElementById('avatar').textContent = currentUser.avatar;
    }

    function logout() {
      if (confirm("Disconnect from mesh?")) {
        localStorage.removeItem('rootDonateUser');
        location.reload();
      }
    }

    function showProfile() {
      alert(`🪙 ${currentUser.handle}\nJoined: ${currentUser.joined}\n\nMesh Reputation: LEGEND`);
    }

    // === REPORT (now tied to user) ===
    function submitReport() {
      if (!currentUser) {
        alert("You must be logged in to broadcast finds");
        showAuthModal();
        return;
      }

      const name = document.getElementById('rName').value.trim();
      const loc = document.getElementById('rLoc').value.trim();
      if (!name || !loc) return alert("Name and location required");

      const newItem = {
        id: `NR-${1000 + Math.floor(Math.random()*9000)}`,
        icon: "🪙",
        name, loc,
        value: document.getElementById('rValue').value.trim() || "Pending Valuation",
        time: "Just now",
        status: "BROADCAST",
        source: currentUser.handle,
        mint: "Community"
      };
      allNodes.unshift(newItem);
      renderNodes();
      closeReportModal();
      log(`🚨 ${currentUser.handle} broadcasted a new find`);
    }

    // === Rest of your original script (renderNodes, showItemDetail, etc.) ===
    // ... paste all your original functions here (startGlobalScan, etc.) ...

    // Init
    window.onload = () => {
      // Load saved user
      const saved = localStorage.getItem('rootDonateUser');
      if (saved) {
        currentUser = JSON.parse(saved);
        updateUIAfterLogin();
      }

      startGlobalScan();
      setTimeout(() => {
        const hash = location.hash.slice(1);
        if (hash) {
          const node = fromBase64Url(hash);
          if (node) showItemDetail(node);
        }
      }, 800);
      log("🔓 ROOT DONATE — FULLY OPEN SOURCE & DECENTRALISED");
    };
  </script>
</body>
</html>
