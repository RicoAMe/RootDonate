<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Local AI</title>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-2: #334155;
      --accent: #22c55e;
      --accent-soft: rgba(34, 197, 94, 0.15);
      --text: #f8fafc;
      --text-secondary: #cbd5e1;
      --text-muted: #94a3b8;
      --user: #166534;
      --bot: #1e293b;
      --border: #334155;
      --radius: 20px;
      --radius-sm: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;
    }
    body {
      display: flex;
      flex-direction: column;
      min-height: 100dvh;
      padding-top: env(safe-area-inset-top);
    }
    header {
      background: rgba(30, 41, 59, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 0.75rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      position: sticky;
      top: 0;
      z-index: 20;
    }
    .logo {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, #22c55e, #3b82f6);
      border-radius: 10px;
      display: grid; place-items: center;
      font-weight: 700; font-size: 1rem;
      flex-shrink: 0;
    }
    header h1 {
      font-size: 1.15rem;
      font-weight: 600;
      letter-spacing: -0.02em;
    }
    .header-actions { display: flex; gap: 0.5rem; }
    button, select {
      background: var(--surface-2);
      border: none;
      color: var(--text);
      border-radius: var(--radius-sm);
      font-size: 0.9rem;
      font-weight: 500;
    }
    button {
      padding: 0.55rem 0.9rem;
      cursor: pointer;
      transition: opacity 0.15s;
    }
    button:active { opacity: 0.7; }
    button.primary { background: var(--accent); color: #052e16; }
    button:disabled { opacity: 0.45; }
    #modelSelect {
      padding: 0.55rem 0.75rem;
      max-width: 160px;
      font-size: 0.85rem;
    }
    #progress {
      height: 3px;
      background: var(--surface-2);
      display: none;
    }
    #progress > div {
      height: 100%;
      background: var(--accent);
      width: 0%;
      transition: width 0.25s ease;
    }
    #status {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-align: center;
      padding: 0.4rem 1rem;
      background: var(--surface);
    }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 1rem 1rem 0.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
      -webkit-overflow-scrolling: touch;
    }
    .msg {
      max-width: 85%;
      padding: 0.75rem 1rem;
      border-radius: var(--radius);
      line-height: 1.45;
      font-size: 0.95rem;
      word-wrap: break-word;
    }
    .msg.user {
      align-self: flex-end;
      background: var(--user);
      color: white;
      border-bottom-right-radius: 6px;
    }
    .msg.bot {
      align-self: flex-start;
      background: var(--bot);
      border: 1px solid var(--border);
      border-bottom-left-radius: 6px;
    }
    .empty {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem 1.5rem;
      color: var(--text-secondary);
    }
    .empty h2 {
      color: var(--text);
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
      letter-spacing: -0.02em;
    }
    .empty p { font-size: 0.9rem; line-height: 1.5; }
    .input-bar {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 0.75rem 1rem;
      padding-bottom: calc(0.75rem + env(safe-area-inset-bottom));
      display: flex;
      gap: 0.5rem;
      align-items: flex-end;
    }
    #input {
      flex: 1;
      resize: none;
      min-height: 48px;
      max-height: 140px;
      padding: 0.75rem 1rem;
      font-family: inherit;
      font-size: 1rem;
      background: var(--surface-2);
      border: 1px solid transparent;
      color: var(--text);
      border-radius: var(--radius);
      line-height: 1.4;
    }
    #input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }
    #send {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      font-size: 1.2rem;
    }
  </style>
</head>
<body>
  <header>
    <div style="display:flex;align-items:center;gap:0.6rem">
      <div class="logo">∞</div>
      <h1>Local AI</h1>
    </div>
    <div class="header-actions">
      <select id="modelSelect"></select>
      <button id="loadBtn" class="primary">Load</button>
    </div>
  </header>

  <div id="progress"><div></div></div>
  <div id="status">Checking models…</div>

  <div id="chat">
    <div class="empty" id="empty">
      <div>
        <h2>Private local chat</h2>
        <p>Models marked ✅ load instantly from cache.<br>Unlimited · Offline · No rate limits</p>
      </div>
    </div>
  </div>

  <div class="input-bar">
    <textarea id="input" placeholder="Message" rows="1" disabled></textarea>
    <button id="send" class="primary" disabled>↑</button>
  </div>

  <script type="module">
    import { CreateMLCEngine, hasModelInCache, prebuiltAppConfig } from "https://esm.run/@mlc-ai/web-llm";

    const MODELS = [
      { id: "Llama-3.2-1B-Instruct-q4f32_1-MLC", name: "Llama 3.2 1B" },
      { id: "Llama-3.2-3B-Instruct-q4f32_1-MLC", name: "Llama 3.2 3B" },
      { id: "Phi-3.5-mini-instruct-q4f16_1-MLC", name: "Phi-3.5 Mini" },
      { id: "gemma-2-2b-it-q4f16_1-MLC", name: "Gemma 2 2B" },
      { id: "Qwen2.5-1.5B-Instruct-q4f16_1-MLC", name: "Qwen 1.5B" },
      { id: "Qwen2.5-3B-Instruct-q4f16_1-MLC", name: "Qwen 3B" },
      { id: "SmolLM2-360M-Instruct-q4f16_1-MLC", name: "SmolLM2 360M" }
    ];

    const chat = document.getElementById('chat');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    const loadBtn = document.getElementById('loadBtn');
    const modelSelect = document.getElementById('modelSelect');
    const statusEl = document.getElementById('status');
    const progressBar = document.getElementById('progress');
    const progressFill = progressBar.querySelector('div');
    let empty = document.getElementById('empty');

    let engine = null;
    let messages = [];
    let isGenerating = false;

    const setStatus = t => statusEl.textContent = t;
    const setProgress = p => {
      progressBar.style.display = 'block';
      progressFill.style.width = p + '%';
      if (p >= 100) setTimeout(() => progressBar.style.display = 'none', 500);
    };

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    }

    function addMessage(text, role) {
      if (empty) { empty.remove(); empty = null; }
      const div = document.createElement('div');
      div.className = `msg ${role}`;
      div.innerHTML = escapeHtml(text);
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    function updateBubble(div, text) {
      div.textContent = text;
      chat.scrollTop = chat.scrollHeight;
    }

    function showEmpty() {
      chat.innerHTML = '';
      const d = document.createElement('div');
      d.className = 'empty';
      d.id = 'empty';
      d.innerHTML = `<div><h2>Private local chat</h2><p>Models marked ✅ load instantly from cache.<br>Unlimited · Offline · No rate limits</p></div>`;
      chat.appendChild(d);
      empty = d;
    }

    async function refreshModels() {
      modelSelect.innerHTML = '';
      setStatus('Checking cache…');
      for (const m of MODELS) {
        let cached = false;
        try { cached = await hasModelInCache(m.id, prebuiltAppConfig); } catch {}
        const opt = document.createElement('option');
        opt.value = m.id;
        opt.textContent = (cached ? '✅ ' : '⬇️ ') + m.name;
        modelSelect.appendChild(opt);
      }
      setStatus(modelSelect.options.length ? 'Ready' : 'No models');
    }

    async function loadModel() {
      if (engine) { try { await engine.unload(); } catch {} engine = null; }
      const modelId = modelSelect.value;
      const cached = modelSelect.selectedOptions[0]?.textContent.startsWith('✅');

      loadBtn.disabled = true;
      input.disabled = true;
      sendBtn.disabled = true;
      setStatus(cached ? 'Loading from cache…' : 'Downloading…');
      setProgress(cached ? 40 : 0);

      try {
        engine = await CreateMLCEngine(modelId, {
          initProgressCallback: info => {
            const p = Math.round((info.progress || 0) * 100);
            setProgress(p);
            setStatus(info.text || (cached ? 'Loading…' : `Downloading ${p}%`));
          }
        });
        setStatus('Ready · ' + (cached ? 'cached' : 'downloaded'));
        setProgress(100);
        input.disabled = false;
        sendBtn.disabled = false;
        input.focus();
        setTimeout(refreshModels, 400);
      } catch (err) {
        setStatus('Failed: ' + (err.message || err));
        setProgress(0);
      } finally {
        loadBtn.disabled = false;
      }
    }

    async function send() {
      if (!engine || isGenerating) return;
      const text = input.value.trim();
      if (!text) return;

      isGenerating = true;
      sendBtn.disabled = true;
      input.disabled = true;

      addMessage(text, 'user');
      messages.push({ role: 'user', content: text });
      input.value = '';
      input.style.height = 'auto';

      const botDiv = addMessage('…', 'bot');
      let full = '';

      try {
        const stream = await engine.chat.completions.create({
          messages,
          stream: true,
          temperature: 0.7,
          max_tokens: 2048
        });
        for await (const chunk of stream) {
          const delta = chunk.choices?.[0]?.delta?.content || '';
          if (delta) {
            full += delta;
            updateBubble(botDiv, full);
          }
        }
        if (!full) full = '(no response)';
        messages.push({ role: 'assistant', content: full });
        updateBubble(botDiv, full);
        setStatus('Ready');
      } catch (err) {
        updateBubble(botDiv, 'Error: ' + (err.message || err));
        setStatus('Error');
      } finally {
        isGenerating = false;
        sendBtn.disabled = false;
        input.disabled = false;
        input.focus();
      }
    }

    loadBtn.addEventListener('click', loadModel);
    sendBtn.addEventListener('click', send);

    input.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    });

    input.addEventListener('input', () => {
      input.style.height = 'auto';
      input.style.height = Math.min(input.scrollHeight, 140) + 'px';
    });

    if (!navigator.gpu) {
      setStatus('WebGPU required (use Chrome or Edge)');
      loadBtn.disabled = true;
    } else {
      refreshModels();
    }
  </script>
</body>
</html>
