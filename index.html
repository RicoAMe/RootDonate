<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1419">
  <title>RootDonate — Public AI</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f1419;
      --panel: #161e2b;
      --accent: #3b82f6;
      --text: #e2e8f0;
      --dim: #94a3b8;
      --border: #334155;
      --user: #1e3a5f;
      --bot: #1e293b;
      --success: #86efac;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; flex-direction: column; min-height: 100vh;
      background: var(--bg); color: var(--text);
      font: 16px/1.45 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    button, input { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    header, footer {
      display: flex; align-items: center; gap: 0.75rem;
      padding: 0.85rem 1rem; background: var(--panel);
    }
    header {
      justify-content: space-between;
      padding-top: calc(0.85rem + env(safe-area-inset-top));
      border-bottom: 1px solid var(--border);
    }
    header h1 { margin: 0; font-size: 1.2rem; font-weight: 650; }
    .subtitle { color: var(--dim); font-size: 0.75rem; }
    .notice {
      margin: 0; padding: 0.6rem 1rem; background: #111827; color: var(--dim);
      font-size: 0.75rem; text-align: center; border-bottom: 1px solid var(--border);
    }
    #chat {
      flex: 1; display: flex; flex-direction: column; gap: 0.75rem;
      overflow-y: auto; padding: 1rem; scroll-behavior: smooth;
    }
    .msg {
      max-width: 85%; padding: 0.75rem 0.95rem; border-radius: 1rem;
      white-space: pre-wrap; overflow-wrap: anywhere;
    }
    .msg.user { align-self: flex-end; background: var(--user); border-bottom-right-radius: 0.35rem; }
    .msg.bot  { align-self: flex-start; background: var(--bot);  border-bottom-left-radius: 0.35rem; }
    .sender {
      font-size: 0.65rem; font-weight: 650; opacity: 0.7;
      text-transform: uppercase; margin-bottom: 0.2rem; letter-spacing: 0.03em;
    }
    .status { padding: 0.4rem 0.75rem; text-align: center; font-size: 0.75rem; color: var(--dim); }
    .status.online { color: var(--success); }
    .status.error  { color: #fca5a5; }
    footer { padding-bottom: calc(0.75rem + env(safe-area-inset-bottom)); border-top: 1px solid var(--border); }
    #input {
      flex: 1; padding: 0.8rem 0.9rem; border: 1px solid var(--border);
      border-radius: 0.8rem; background: #0f172a; color: var(--text); font-size: 16px;
    }
    #send {
      height: 46px; padding: 0 1.1rem; border: 0; border-radius: 0.8rem;
      background: var(--accent); color: white; font-weight: 600;
    }
    #send:disabled { opacity: 0.6; cursor: not-allowed; }
    .visually-hidden {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0,0,0,0); border: 0;
    }
    @media (max-width: 480px) { .msg { max-width: 92%; } }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>RootDonate</h1>
      <div class="subtitle">Public Internet AI</div>
    </div>
  </header>

  <p class="notice">
    Direct connection to LLM7 · No Firebase or API key · Provider availability and rate limits apply
  </p>

  <main id="chat" aria-label="Conversation" aria-live="polite"></main>
  <div class="status" id="status">Ready — no setup needed</div>

  <footer>
    <label class="visually-hidden" for="input">Message</label>
    <input id="input" type="text" maxlength="4000" placeholder="Ask anything…" autocomplete="off" autofocus>
    <button id="send" type="button">Send</button>
  </footer>

  <script>
    const chatEl = document.getElementById("chat");
    const inputEl = document.getElementById("input");
    const statusEl = document.getElementById("status");
    const sendBtn = document.getElementById("send");

    const AI_ENDPOINT = "https://api.llm7.io/v1/chat/completions";
    const STORAGE_KEY = "rootdonate_public_ai_v2";
    let history = [];
    let busy = false;

    function loadHistory() {
      try {
        const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
        history = Array.isArray(data) ? data.filter(m =>
          m && (m.role === "user" || m.role === "assistant") && typeof m.content === "string"
        ).slice(-40) : [];
      } catch { history = []; }
    }

    function saveHistory() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(history)); } catch {}
    }

    function setStatus(text, kind = "") {
      statusEl.textContent = text;
      statusEl.className = `status ${kind}`.trim();
    }

    function addMessage(text, who) {
      const div = document.createElement("div");
      div.className = `msg ${who}`;
      const sender = document.createElement("div");
      sender.className = "sender";
      sender.textContent = who === "user" ? "You" : "AI";
      const body = document.createElement("div");
      body.textContent = text;
      div.append(sender, body);
      chatEl.append(div);
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    function renderHistory() {
      chatEl.innerHTML = "";
      if (history.length === 0) {
        addMessage("Hello! I'm a public online AI assistant. No API key or account setup is needed—ask a question to get started.", "bot");
      } else {
        history.forEach(m => addMessage(m.content, m.role === "user" ? "user" : "bot"));
      }
    }

    async function sendMessage() {
      const text = inputEl.value.trim();
      if (!text || busy) return;

      busy = true;
      sendBtn.disabled = true;
      inputEl.value = "";
      history.push({ role: "user", content: text });
      if (history.length > 40) history = history.slice(-40);
      addMessage(text, "user");
      saveHistory();
      setStatus("Connecting to online AI…");

      try {
        const messages = [
          { role: "system", content: "You are a helpful, concise assistant for RootDonate." },
          ...history.slice(-12)
        ];
        const res = await fetch(AI_ENDPOINT, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            model: "gpt-oss",
            messages,
            temperature: 0.7,
            max_tokens: 1024
          })
        });

        let data;
        try {
          data = await res.json();
        } catch {
          throw new Error(`The AI provider returned an unreadable response (HTTP ${res.status}).`);
        }
        if (!res.ok) {
          const detail = data?.error?.message || data?.message;
          throw new Error(detail || `The AI provider returned HTTP ${res.status}.`);
        }

        const reply = data.choices?.[0]?.message?.content;
        if (typeof reply !== "string" || !reply.trim()) {
          throw new Error("The AI provider returned an empty response.");
        }

        history.push({ role: "assistant", content: reply.trim() });
        if (history.length > 40) history = history.slice(-40);
        addMessage(reply.trim(), "bot");
        saveHistory();
        setStatus("Online AI ready", "online");
      } catch (err) {
        console.error("RootDonate public AI request failed", err);
        const message = err instanceof TypeError
          ? "Could not reach the public AI provider. Check your connection; the provider may also block browser requests or be unavailable."
          : (err.message || "Online AI is temporarily unavailable. Please try again.");
        addMessage(message, "bot");
        setStatus("Online AI unavailable — try again later", "error");
      } finally {
        busy = false;
        sendBtn.disabled = false;
        inputEl.focus();
      }
    }

    sendBtn.addEventListener("click", sendMessage);
    inputEl.addEventListener("keydown", e => {
      if (e.key === "Enter") sendMessage();
    });

    loadHistory();
    renderHistory();
    inputEl.focus();
  </script>
</body>
</html>
