<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b1020">
  <title>Internet AI</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1020;
      --bg-2: #111827;
      --panel: rgba(17, 24, 39, 0.9);
      --panel-2: rgba(15, 23, 42, 0.9);
      --line: rgba(148, 163, 184, 0.2);
      --primary: #60a5fa;
      --primary-2: #8b5cf6;
      --text: #ecf3ff;
      --muted: #9fb3cf;
      --user: #17314f;
      --bot: #1a2337;
      --success: #7ef0a2;
      --danger: #fca5a5;
      --shadow: 0 18px 50px rgba(14, 20, 35, 0.45);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background:
        radial-gradient(circle at top left, rgba(96, 165, 250, 0.18), transparent 30%),
        radial-gradient(circle at bottom right, rgba(139, 92, 246, 0.18), transparent 30%),
        linear-gradient(180deg, var(--bg), var(--bg-2));
      color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    button, input { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: calc(0.85rem + env(safe-area-inset-top)) 1rem 0.85rem;
      border-bottom: 1px solid var(--line);
      background: rgba(10, 15, 28, 0.7);
      backdrop-filter: blur(12px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      min-width: 0;
    }

    .logo {
      display: grid;
      place-items: center;
      width: 2.25rem;
      height: 2.25rem;
      border-radius: 0.8rem;
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      color: #06101d;
      font-weight: 800;
      box-shadow: var(--shadow);
    }

    .brand-title {
      font-size: 1.12rem;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    .brand-sub { color: var(--muted); font-size: 0.72rem; }

    .pill {
      border: 1px solid rgba(96, 165, 250, 0.25);
      background: rgba(96, 165, 250, 0.08);
      color: #bfe0ff;
      padding: 0.45rem 0.7rem;
      border-radius: 999px;
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-weight: 700;
    }

    .notice {
      margin: 0;
      border-bottom: 1px solid var(--line);
      background: rgba(15, 23, 42, 0.75);
      color: var(--muted);
      text-align: center;
      padding: 0.7rem 1rem;
      font-size: 0.76rem;
    }

    #chat {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 0.8rem;
      overflow-y: auto;
      padding: 1rem;
      scroll-behavior: smooth;
    }

    .msg {
      max-width: min(85%, 720px);
      padding: 0.8rem 0.95rem;
      border-radius: 1rem;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
      box-shadow: 0 8px 20px rgba(2, 6, 23, 0.12);
    }

    .msg.user {
      align-self: flex-end;
      background: var(--user);
      border-bottom-right-radius: 0.35rem;
    }

    .msg.bot {
      align-self: flex-start;
      background: var(--bot);
      border-bottom-left-radius: 0.35rem;
    }

    .sender {
      margin-bottom: 0.2rem;
      font-size: 0.66rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      opacity: 0.75;
    }

    .status {
      padding: 0.45rem 0.9rem 0.75rem;
      text-align: center;
      font-size: 0.75rem;
      color: var(--muted);
      border-top: 1px solid rgba(148, 163, 184, 0.12);
    }

    .status.online { color: var(--success); }
    .status.error { color: var(--danger); }

    footer {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.75rem 1rem calc(0.9rem + env(safe-area-inset-bottom));
      border-top: 1px solid var(--line);
      background: rgba(10, 15, 28, 0.9);
    }

    #input {
      flex: 1;
      min-width: 0;
      border: 1px solid var(--line);
      border-radius: 0.85rem;
      background: rgba(15, 23, 42, 0.9);
      color: var(--text);
      padding: 0.8rem 0.9rem;
      font-size: 1rem;
    }

    #send {
      border: none;
      border-radius: 0.85rem;
      background: linear-gradient(135deg, var(--primary), var(--primary-2));
      color: #07111b;
      font-weight: 800;
      padding: 0.8rem 1.1rem;
      min-width: 5.5rem;
      box-shadow: 0 10px 24px rgba(96, 165, 250, 0.2);
    }

    #send:disabled {
      opacity: 0.62;
      cursor: not-allowed;
    }

    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      border: 0;
    }

    @media (max-width: 520px) {
      .msg { max-width: 92%; }
      .brand-sub { display: none; }
      .pill { display: none; }
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="logo">AI</div>
      <div>
        <div class="brand-title">Internet AI</div>
        <div class="brand-sub">Public online assistant</div>
      </div>
    </div>
    <div class="pill">Online</div>
  </header>

  <p class="notice">Direct connection to LLM7 · No API key required · Availability and rate limits may apply</p>

  <main id="chat" aria-label="Conversation" aria-live="polite"></main>
  <div class="status" id="status">Ready — no setup needed</div>

  <footer>
    <label class="visually-hidden" for="input">Message</label>
    <input id="input" type="text" maxlength="4000" autocomplete="off" placeholder="Ask anything…" autofocus>
    <button id="send" type="button">Send</button>
  </footer>

  <script>
    const chatEl = document.getElementById("chat");
    const inputEl = document.getElementById("input");
    const statusEl = document.getElementById("status");
    const sendBtn = document.getElementById("send");

    const AI_ENDPOINT = "https://api.llm7.io/v1/chat/completions";
    const STORAGE_KEY = "internet_ai_public_chat_v1";
    let history = [];
    let busy = false;

    function loadHistory() {
      try {
        const data = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
        history = Array.isArray(data)
          ? data.filter(m => m && (m.role === "user" || m.role === "assistant") && typeof m.content === "string").slice(-40)
          : [];
      } catch {
        history = [];
      }
    }

    function saveHistory() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(history)); } catch {}
    }

    function setStatus(text, kind = "") {
      statusEl.textContent = text;
      statusEl.className = `status ${kind}`.trim();
    }

    function addMessage(text, who) {
      const div = document.createElement("div");
      div.className = `msg ${who}`;

      const sender = document.createElement("div");
      sender.className = "sender";
      sender.textContent = who === "user" ? "You" : "AI";

      const body = document.createElement("div");
      body.textContent = text;

      div.append(sender, body);
      chatEl.append(div);
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    function renderHistory() {
      chatEl.innerHTML = "";
      if (history.length === 0) {
        addMessage("Hello! I’m an Internet AI assistant. Ask a question and I’ll respond right away.", "bot");
      } else {
        history.forEach(m => addMessage(m.content, m.role === "user" ? "user" : "bot"));
      }
    }

    async function sendMessage() {
      const text = inputEl.value.trim();
      if (!text || busy) return;

      busy = true;
      sendBtn.disabled = true;
      inputEl.value = "";

      history.push({ role: "user", content: text });
      if (history.length > 40) history = history.slice(-40);
      addMessage(text, "user");
      saveHistory();
      setStatus("Connecting to Internet AI…");

      try {
        const messages = [
          { role: "system", content: "You are a helpful, concise AI assistant." },
          ...history.slice(-12)
        ];

        const res = await fetch(AI_ENDPOINT, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            model: "gpt-oss",
            messages,
            temperature: 0.7,
            max_tokens: 1024
          })
        });

        let data;
        try {
          data = await res.json();
        } catch {
          throw new Error(`The AI provider returned an unreadable response (HTTP ${res.status}).`);
        }

        if (!res.ok) {
          const detail = data?.error?.message || data?.message;
          throw new Error(detail || `The AI provider returned HTTP ${res.status}.`);
        }

        const reply = data.choices?.[0]?.message?.content;
        if (typeof reply !== "string" || !reply.trim()) {
          throw new Error("The AI provider returned an empty response.");
        }

        history.push({ role: "assistant", content: reply.trim() });
        if (history.length > 40) history = history.slice(-40);
        addMessage(reply.trim(), "bot");
        saveHistory();
        setStatus("Internet AI ready", "online");
      } catch (err) {
        console.error("Internet AI request failed", err);
        const message = err instanceof TypeError
          ? "Could not reach the Internet AI provider. Check your connection or try again in a moment."
          : (err.message || "The AI is temporarily unavailable. Please try again.");
        addMessage(message, "bot");
        setStatus("Internet AI unavailable — try again later", "error");
      } finally {
        busy = false;
        sendBtn.disabled = false;
        inputEl.focus();
      }
    }

    sendBtn.addEventListener("click", sendMessage);
    inputEl.addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendMessage();
    });

    loadHistory();
    renderHistory();
    inputEl.focus();
  </script>
</body>
</html>
