<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Root Donate • Support Creators</title>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #00ff9d;
            --bg: #0a0a0f;
            --card: #111118;
        }
        
        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 480px;
            margin: 40px auto;
            background: var(--card);
            border-radius: 24px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #00ff9d, #00cc7a);
            color: #000;
            padding: 40px 20px;
            text-align: center;
        }
        
        h1 { margin: 0; font-size: 2.4rem; font-weight: 700; }
        .content { padding: 30px; }

        input {
            width: 100%;
            padding: 16px;
            margin: 12px 0;
            background: #1c1c24;
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 1.05rem;
        }

        button {
            width: 100%;
            padding: 16px;
            margin: 12px 0;
            border: none;
            border-radius: 12px;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
        }
        
        .btn-primary { background: var(--primary); color: #000; }
        .btn-secondary { background: #333; color: white; }
        .btn-danger { background: #ff4444; color: white; }

        .donation-node, .history-item {
            background: #1c1c24;
            border-radius: 16px;
            padding: 18px;
            margin: 15px 0;
        }

        .avatar {
            width: 52px;
            height: 52px;
            background: #00ff9d;
            color: #000;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            font-weight: 700;
        }

        .node-info, .history-info { flex: 1; }
        .node-name { font-weight: 600; font-size: 1.1rem; }
        .node-username { color: #00ff9d; font-family: monospace; }

        .amount-btns {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 12px;
        }
        .amount-btn {
            background: #27272f;
            padding: 8px 16px;
            border-radius: 9999px;
            font-size: 0.9rem;
            cursor: pointer;
        }
        .amount-btn:hover { background: var(--primary); color: #000; }

        .monzo-link {
            background: #27272f;
            padding: 12px;
            border-radius: 12px;
            font-size: 0.9rem;
            word-break: break-all;
            margin: 10px 0;
            font-family: monospace;
        }

        .search-container {
            position: relative;
            margin-bottom: 20px;
        }

        .history-title {
            margin: 30px 0 15px;
            font-size: 1.1rem;
        }

        .error { color: #ff6666; text-align: center; margin: 10px 0; }
        .success { color: #00ff9d; text-align: center; margin: 15px 0; }
    </style>
</head>
<body>

    <!-- Auth Screen -->
    <div class="container" id="authScreen">
        <div class="header">
            <h1>Root Donate</h1>
            <p>Support creators instantly</p>
        </div>
        <div class="content">
            <h2 id="formTitle" style="text-align:center; margin-bottom:24px;">Create Account</h2>
            
            <input type="email" id="email" placeholder="Email address" required>
            <input type="password" id="password" placeholder="Password (min 6 characters)" required>
            
            <div id="errorMsg" class="error"></div>
            
            <button class="btn-primary" onclick="handleAuth()">Continue</button>
            <button class="btn-secondary" onclick="toggleForm()">Already have an account? Login</button>
        </div>
    </div>

    <!-- Dashboard Screen -->
    <div class="container" id="dashboardScreen" style="display:none;">
        <div class="header">
            <h1 id="userGreeting">Root Donate</h1>
        </div>
        <div class="content">

            <!-- Search with Autocomplete -->
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="Search creators or @usernames..." onkeyup="filterNodes()">
            </div>

            <h3>Your Donation Nodes</h3>
            <div id="nodesContainer"></div>

            <!-- Add New Node -->
            <h3 style="margin:25px 0 15px;">Add New Node</h3>
            <input type="text" id="creatorName" placeholder="Creator / Cause name">
            <input type="text" id="monzoUsername" placeholder="Monzo.me username (e.g. alexrivers)">
            
            <button class="btn-primary" onclick="addDonationNode()">Add Node</button>

            <!-- Donation History -->
            <h3 class="history-title">Recent Donations</h3>
            <div id="historyContainer"></div>

            <button class="btn-secondary" onclick="logout()" style="margin-top:30px;">Logout</button>
        </div>
    </div>

    <script>
        // ==================== FIREBASE CONFIG ====================
        const firebaseConfig = {
            apiKey: "AIzaSyBvcCBsPiMxS7G2evPjM7sANp-zSy_RkKM",
            authDomain: "rootdonate-61e61.firebaseapp.com",
            projectId: "rootdonate-61e61",
            storageBucket: "rootdonate-61e61.firebasestorage.app",
            messagingSenderId: "754240963907",
            appId: "1:754240963907:web:5417c2763d8f02108bdbf6"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        let currentUserNodes = [];
        let donationHistory = [];

        // Toggle Login / Signup
        function toggleForm() {
            const title = document.getElementById('formTitle');
            title.textContent = title.textContent === 'Create Account' ? 'Login' : 'Create Account';
            document.getElementById('errorMsg').textContent = '';
        }

        function handleAuth() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorMsg = document.getElementById('errorMsg');

            if (!email || !password) {
                errorMsg.textContent = "Please fill in all fields";
                return;
            }

            const isLogin = document.getElementById('formTitle').textContent === 'Login';
            const promise = isLogin 
                ? auth.signInWithEmailAndPassword(email, password)
                : auth.createUserWithEmailAndPassword(email, password);

            promise.then(() => showDashboard())
                   .catch(err => errorMsg.textContent = err.message);
        }

        function showDashboard() {
            document.getElementById('authScreen').style.display = 'none';
            document.getElementById('dashboardScreen').style.display = 'block';
            
            const user = auth.currentUser;
            document.getElementById('userGreeting').textContent = user ? `Hi, ${user.email.split('@')[0]}` : 'Root Donate';
            
            loadData();
        }

        function loadData() {
            const user = auth.currentUser;
            if (!user) return;

            const nodeKey = `monzoNodes_${user.uid}`;
            const historyKey = `donationHistory_${user.uid}`;

            currentUserNodes = JSON.parse(localStorage.getItem(nodeKey)) || [];
            donationHistory = JSON.parse(localStorage.getItem(historyKey)) || [];

            renderNodes();
            renderHistory();
        }

        function saveNodes() {
            const user = auth.currentUser;
            if (!user) return;
            localStorage.setItem(`monzoNodes_${user.uid}`, JSON.stringify(currentUserNodes));
        }

        function saveHistory() {
            const user = auth.currentUser;
            if (!user) return;
            localStorage.setItem(`donationHistory_${user.uid}`, JSON.stringify(donationHistory));
        }

        function renderNodes(filteredNodes = currentUserNodes) {
            const container = document.getElementById('nodesContainer');
            container.innerHTML = '';

            if (filteredNodes.length === 0) {
                container.innerHTML = `<p style="text-align:center; color:#666; padding:20px;">No matching nodes found.</p>`;
                return;
            }

            filteredNodes.forEach((node, index) => {
                const originalIndex = currentUserNodes.indexOf(node);
                const monzoUrl = `https://monzo.me/${node.username}`;
                
                const div = document.createElement('div');
                div.className = 'donation-node';
                div.innerHTML = `
                    <div style="display:flex; gap:15px; align-items:center;">
                        <div class="avatar">${node.name[0]}</div>
                        <div class="node-info">
                            <div class="node-name">${node.name}</div>
                            <div class="node-username">@${node.username}</div>
                            <div class="monzo-link">${monzoUrl}</div>
                            
                            <div class="amount-btns">
                                <div class="amount-btn" onclick="quickDonate('${node.username}', 5, ${originalIndex})">£5</div>
                                <div class="amount-btn" onclick="quickDonate('${node.username}', 10, ${originalIndex})">£10</div>
                                <div class="amount-btn" onclick="quickDonate('${node.username}', 20, ${originalIndex})">£20</div>
                                <div class="amount-btn" onclick="quickDonate('${node.username}', 50, ${originalIndex})">£50</div>
                            </div>
                        </div>
                        <button class="btn-danger" style="width:auto; padding:8px 14px; font-size:0.85rem;" onclick="removeNode(${originalIndex})">Remove</button>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function filterNodes() {
            const query = document.getElementById('searchInput').value.toLowerCase().trim();
            if (!query) {
                renderNodes();
                return;
            }

            const filtered = currentUserNodes.filter(node => 
                node.name.toLowerCase().includes(query) || 
                node.username.toLowerCase().includes(query)
            );
            renderNodes(filtered);
        }

        function addDonationNode() {
            const name = document.getElementById('creatorName').value.trim();
            const username = document.getElementById('monzoUsername').value.trim().toLowerCase().replace('@', '');

            if (!name || !username) {
                alert("Please enter both name and Monzo username");
                return;
            }

            currentUserNodes.push({ name, username });
            saveNodes();
            renderNodes();

            document.getElementById('creatorName').value = '';
            document.getElementById('monzoUsername').value = '';
        }

        function removeNode(index) {
            if (confirm("Remove this donation node?")) {
                currentUserNodes.splice(index, 1);
                saveNodes();
                renderNodes();
            }
        }

        function quickDonate(username, amount, nodeIndex) {
            const url = `https://monzo.me/${username}?amount=${amount}`;
            window.open(url, '_blank');

            // Add to history
            donationHistory.unshift({
                username,
                amount,
                timestamp: new Date().toISOString()
            });

            // Keep only last 10 donations
            if (donationHistory.length > 10) donationHistory.pop();

            saveHistory();
            renderHistory();
        }

        function renderHistory() {
            const container = document.getElementById('historyContainer');
            container.innerHTML = '';

            if (donationHistory.length === 0) {
                container.innerHTML = `<p style="text-align:center; color:#666; padding:20px;">No donations yet.</p>`;
                return;
            }

            donationHistory.forEach(item => {
                const date = new Date(item.timestamp).toLocaleString('en-GB', { 
                    month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' 
                });

                const div = document.createElement('div');
                div.className = 'history-item';
                div.innerHTML = `
                    <div style="display:flex; justify-content:space-between; align-items:center;">
                        <div>
                            <strong>@${item.username}</strong><br>
                            <small style="color:#888;">${date}</small>
                        </div>
                        <div style="font-size:1.3rem; font-weight:700; color:var(--primary);">£${item.amount}</div>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function logout() {
            auth.signOut().then(() => {
                document.getElementById('dashboardScreen').style.display = 'none';
                document.getElementById('authScreen').style.display = 'block';
            });
        }

        // Auto-login
        auth.onAuthStateChanged(user => {
            if (user) showDashboard();
        });
    </script>
</body>
</html>
