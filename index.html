<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a0a0a">
  <title>ROOT DONATE • SOCIAL NODE</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

  <style>
    :root { --neon: #ffd700; --glow: #ffd70088; --bg: #0a0a0a; --card: rgba(20,20,15,0.95); }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family: 'Courier New', monospace;
      background: var(--bg);
      color: var(--neon);
      height: 100vh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    canvas#matrix { position: fixed; inset: 0; z-index: -1; opacity: 0.15; }

    .header { padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,215,0,0.3); background: rgba(10,10,10,0.98); }
    .header h1 { font-size: 1.55rem; letter-spacing: 3px; text-shadow: 0 0 15px var(--neon); }

    .nav { padding: 12px 20px; display: flex; gap: 8px; flex-wrap: wrap; border-bottom: 1px solid rgba(255,215,0,0.2); background: rgba(10,10,10,0.98); }
    .nav button { background: transparent; border: 1px solid var(--neon); color: var(--neon); padding: 10px 20px; border-radius: 50px; cursor: pointer; transition: all 0.3s; font-size: 0.95rem; }
    .nav button.active, .nav button:hover { background: var(--neon); color: #000; box-shadow: 0 0 25px var(--glow); }

    .search-container { position: relative; margin: 16px 20px; }
    .search-bar { 
      padding: 14px 24px; width: 100%; background: #111; border: 1px solid var(--neon); 
      border-radius: 50px; color: var(--neon); font-family: inherit; font-size: 1rem;
    }
    .suggestions {
      position: absolute; top: 100%; left: 0; right: 0; background: #111; border: 1px solid var(--neon);
      border-radius: 12px; margin-top: 4px; max-height: 280px; overflow-y: auto; z-index: 30; display: none;
    }
    .suggestion-item {
      padding: 12px 20px; cursor: pointer; border-bottom: 1px solid #222;
    }
    .suggestion-item:hover { background: #1a1a1a; color: #fff; }

    .nodes-grid {
      flex: 1; padding: 16px 20px; overflow-y: auto;
      display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px;
    }

    .place-card {
      background: var(--card); border: 1px solid rgba(255,215,0,0.35);
      border-radius: 16px; padding: 18px; cursor: pointer; transition: all 0.4s;
    }
    .place-card:hover { transform: translateY(-4px); border-color: var(--neon); box-shadow: 0 0 25px var(--glow); }

    .scan-bar { height: 4px; background: linear-gradient(90deg, #0f0, #ffd700); margin: 12px 0; border-radius: 2px; animation: scanPulse 2s infinite; }
    @keyframes scanPulse { 0%,100% { opacity: 0.6; } 50% { opacity: 1; } }

    .log { height: 160px; background: #0a0a0a; padding: 12px 20px; overflow-y: auto; font-size: 0.85rem; border-top: 1px solid rgba(255,215,0,0.3); }
    .scan-status { text-align: center; padding: 10px; background: #111; border: 1px solid #0f0; margin: 10px 20px; border-radius: 8px; }

    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.96); z-index: 100; align-items: center; justify-content: center; padding: 10px; }
    .modal-content {
      background: rgba(20,20,15,0.98); border: 2px solid var(--neon); border-radius: 16px;
      width: 100%; max-width: 520px; padding: 28px; max-height: 92vh; overflow-y: auto;
    }
    .history-item { padding: 12px; background: #111; margin-bottom: 8px; border-left: 4px solid #0f0; }

    input, textarea, select { background:#111; border:1px solid var(--neon); color:var(--neon); padding:10px; border-radius:8px; width:100%; margin:8px 0; font-family:inherit; }
    button.primary { background:var(--neon); color:#000; border:none; padding:12px 24px; border-radius:50px; font-weight:bold; cursor:pointer; width:100%; }
  </style>
</head>
<body>

  <canvas id="matrix"></canvas>

  <div class="header">
    <h1>🌐 ROOT DONATE</h1>
    <div style="display:flex; align-items:center; gap:12px;">
      <button onclick="toggleLearnMode()" style="padding:8px 16px; background:transparent; border:1px solid var(--neon); color:var(--neon); border-radius:50px;">📖 LEARN</button>
      <div id="userSection" style="display:none;" onclick="showProfile()">
        <div style="display:flex; align-items:center; gap:8px; cursor:pointer;">
          <div style="font-size:1.8rem;">👤</div>
          <div>
            <div id="usernameDisplay" style="font-weight:bold;"></div>
            <div id="balanceDisplay" style="font-size:0.8rem;color:#0f0;">0 ROOT</div>
          </div>
        </div>
      </div>
      <button onclick="showAuthModal()" id="authBtn" style="padding:8px 20px; border:1px solid var(--neon); background:transparent; color:var(--neon); border-radius:50px;">
        <i class="fas fa-user"></i> LOGIN
      </button>
    </div>
  </div>

  <div class="nav">
    <button class="active" onclick="setTab(0)">🌐 LIVE PLACES</button>
    <button onclick="setTab(1)">🔎 DEEP NUMIS</button>
    <button onclick="startAutoAddressSearch()">📍 AUTO ADDRESS</button>
    <button onclick="showReportModal()">📢 REPORT FIND</button>
    <button onclick="resetScan()">RESET MESH</button>
  </div>

  <div id="scanStatus" class="scan-status" style="display:none;">
    <i class="fas fa-satellite-dish"></i> <span id="scanText">DETECTING ADDRESS...</span>
  </div>

  <div class="search-container">
    <input type="text" id="searchInput" class="search-bar" placeholder="Search address or place..." onkeyup="autoCompleteSearch()" autocomplete="off">
    <div id="suggestions" class="suggestions"></div>
  </div>

  <div class="nodes-grid" id="grid"></div>
  <div class="log" id="log"></div>

  <!-- REPORT MODAL -->
  <div id="reportModal" class="modal">
    <div class="modal-content">
      <h2>📢 REPORT NEW FIND</h2>
      <input type="text" id="reportTitle" placeholder="Title (e.g. 1887 Morgan Dollar)">
      <input type="text" id="reportLocation" placeholder="Location / Address">
      <textarea id="reportDesc" rows="4" placeholder="Description, depth, conditions..."></textarea>
      <select id="reportType">
        <option value="Coin">Coin</option>
        <option value="Relic">Relic</option>
        <option value="Jewelry">Jewelry</option>
        <option value="Other">Other</option>
      </select>
      <button onclick="simulatePhotoUpload()" style="margin:12px 0;">📸 Upload Photo (simulated)</button>
      <div id="photoPreview" style="margin:8px 0; color:#0f0; font-size:0.9rem;"></div>
      <div style="display:flex; gap:10px;">
        <button onclick="submitReport()" class="primary">SUBMIT REPORT</button>
        <button onclick="closeReportModal()" style="background:transparent; border:1px solid var(--neon); color:var(--neon);">CANCEL</button>
      </div>
    </div>
  </div>

  <!-- PLACE MODAL -->
  <div id="placeModal" class="modal">
    <div class="modal-content">
      <div id="modalIcon" style="text-align:center; font-size:4.5rem; margin:10px 0;"></div>
      <h2 id="modalName"></h2>
      <p id="modalLoc" style="opacity:0.8;"></p>
      <p><strong>Probability:</strong> <span id="modalProb" style="color:#0f0;"></span></p>
      <p><strong>Expected:</strong> <span id="modalExpected"></span></p>

      <button onclick="copyShareLink()" style="margin:12px 0;">🔗 Copy Base64 Share Link</button>
      <button onclick="showDonateModal()" class="primary">💰 DONATE ROOT</button>

      <h3 style="margin:20px 0 10px 0;">Donation History</h3>
      <div id="placeDonationHistory" style="max-height:200px; overflow-y:auto;"></div>

      <button onclick="closePlaceModal()" style="margin-top:15px; background:transparent; border:1px solid var(--neon); color:var(--neon);">CLOSE</button>
    </div>
  </div>

  <!-- DONATE MODAL -->
  <div id="donateModal" class="modal">
    <div class="modal-content">
      <h2>Donate to <span id="donateTo"></span></h2>
      <p>Balance: <strong id="donorBalance"></strong> ROOT</p>
      <input type="number" id="donateAmount" placeholder="Enter amount" style="font-size:1.3rem; text-align:center;">
      <button onclick="confirmDonation()" class="primary" style="margin-top:15px;">CONFIRM DONATION</button>
      <button onclick="closeDonateModal()" style="margin-top:8px; background:transparent; border:1px solid var(--neon); color:var(--neon);">CANCEL</button>
    </div>
  </div>

  <!-- AUTH MODAL -->
  <div id="authModal" class="modal">
    <div class="modal-content">
      <h2>ROOT ACCOUNT</h2>
      <button onclick="login()" style="width:100%; margin:10px 0;">Login as @hunter</button>
      <button onclick="signup()" style="width:100%; margin:10px 0;">Create New Account</button>
      <button onclick="closeAuthModal()" style="background:transparent; border:1px solid var(--neon); color:var(--neon); width:100%;">Close</button>
    </div>
  </div>

  <script>
    // Matrix Rain
    const canvas = document.getElementById('matrix');
    const ctx = canvas.getContext('2d');
    let drops = [];
    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      drops = Array(Math.floor(canvas.width / 14)).fill(1);
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();
    function drawMatrix() {
      ctx.fillStyle = 'rgba(10,10,10,0.15)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#ffd700';
      ctx.font = '14px monospace';
      const chars = '0123456789$€£¥₿🪙⚡';
      for (let i = 0; i < drops.length; i++) {
        ctx.fillText(chars[Math.floor(Math.random() * chars.length)], i * 14, drops[i] * 14);
        if (drops[i] * 14 > canvas.height && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
      }
    }
    setInterval(drawMatrix, 40);

    // State
    let places = [];
    let currentUser = null;
    let currentPlace = null;

    const logEl = document.getElementById('log');
    function log(msg) {
      const time = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
      logEl.innerHTML += `<span style="opacity:0.5">[${time}]</span> ${msg}<br>`;
      logEl.scrollTop = logEl.scrollHeight;
    }

    const realPlacePool = [
      { name: "Old Gold Mine Tailings", loc: "California Mother Lode", prob: "HIGH", exp: "Gold coins & nuggets", icon: "⛏️", dist: "8 km" },
      { name: "Civil War Campsite", loc: "Gettysburg Area, PA", prob: "VERY HIGH", exp: "Buttons, coins, relics", icon: "⚔️", dist: "35 km" },
      { name: "Abandoned 1920s Boardwalk", loc: "Atlantic City, NJ", prob: "MED", exp: "Silver dollars, tokens", icon: "🎡", dist: "22 km" },
      { name: "Ghost Town Saloon", loc: "Bodie, California", prob: "HIGH", exp: "Gold Rush era coins", icon: "🏚️", dist: "91 km" }
    ];

    const addressSuggestions = [
      "California Mother Lode", "Gettysburg, PA", "Atlantic City, NJ", "Bodie, California",
      "St. Augustine, FL", "Virginia City, NV", "Upstate New York", "Tombstone, AZ", "Leadville, CO"
    ];

    function toBase64Url(obj) {
      const str = btoa(unescape(encodeURIComponent(JSON.stringify(obj))));
      return str.replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    }

    function generateShareUrl(place) {
      const minimal = { id: place.id, name: place.name, loc: place.loc, icon: place.icon };
      return `${location.origin}${location.pathname}#${toBase64Url(minimal)}`;
    }

    function startAutoAddressSearch() {
      document.getElementById('scanStatus').style.display = 'block';
      document.getElementById('scanText').textContent = 'DETECTING ADDRESS...';
      log("📡 AUTO ADDRESS SEARCH STARTED...");

      setTimeout(() => {
        places = [];
        const shuffled = [...realPlacePool].sort(() => 0.5 - Math.random());
        for (let i = 0; i < 5; i++) {
          const base = shuffled[i % shuffled.length];
          places.push({ ...base, id: `SP-${1000 + Math.floor(Math.random()*9000)}`, donations: [] });
        }
        renderPlaces();
        document.getElementById('scanStatus').style.display = 'none';
        log(`🌍 FOUND ${places.length} REAL PLACES`);
      }, 1100);
    }

    function renderPlaces(filtered = places) {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      filtered.forEach(place => {
        const card = document.createElement('div');
        card.className = 'place-card';
        card.innerHTML = `
          <div style="display:flex;justify-content:space-between;font-size:0.8rem;opacity:0.7;">
            <span>${place.id}</span><span style="color:#0f0;">${place.dist}</span>
          </div>
          <div style="font-size:3rem;margin:12px 0;text-align:center;">${place.icon}</div>
          <h3>${place.name}</h3>
          <p>📍 ${place.loc}</p>
          <div class="scan-bar"></div>
          <p><strong>PROB:</strong> <span style="color:#0f0;">${place.prob}</span></p>
        `;
        card.onclick = () => showPlaceDetail(place);
        grid.appendChild(card);
      });
    }

    // PERFECT AUTO-COMPLETE
    function autoCompleteSearch() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      const container = document.getElementById('suggestions');

      if (q.length < 2) {
        container.style.display = 'none';
        renderPlaces();
        return;
      }

      // Filter places
      const filtered = places.filter(p => 
        p.name.toLowerCase().includes(q) || p.loc.toLowerCase().includes(q)
      );

      // Build suggestions
      container.innerHTML = '';
      let hasSuggestions = false;

      addressSuggestions.filter(addr => addr.toLowerCase().includes(q)).forEach(addr => {
        const div = document.createElement('div');
        div.className = 'suggestion-item';
        div.textContent = addr;
        div.onclick = () => {
          document.getElementById('searchInput').value = addr;
          container.style.display = 'none';
          log(`🔍 Searching near ${addr}...`);
          startAutoAddressSearch();
        };
        container.appendChild(div);
        hasSuggestions = true;
      });

      container.style.display = hasSuggestions ? 'block' : 'none';
      renderPlaces(filtered);
    }

    function showPlaceDetail(place) {
      currentPlace = place;
      if (!place.donations) place.donations = [];

      document.getElementById('modalIcon').textContent = place.icon;
      document.getElementById('modalName').textContent = place.name;
      document.getElementById('modalLoc').textContent = `📍 ${place.loc}`;
      document.getElementById('modalProb').textContent = place.prob;
      document.getElementById('modalExpected').textContent = place.exp;

      let histHTML = '';
      place.donations.forEach(d => {
        histHTML += `<div class="history-item"><strong>💰 ${d.amount} ROOT</strong> from ${d.from}<br><small>${d.time}</small></div>`;
      });
      document.getElementById('placeDonationHistory').innerHTML = histHTML || '<p style="opacity:0.6;padding:10px;">No donations yet. Be the first!</p>';

      document.getElementById('placeModal').style.display = 'flex';
    }

    function copyShareLink() {
      if (!currentPlace) return;
      const url = generateShareUrl(currentPlace);
      navigator.clipboard.writeText(url).then(() => alert("✅ Base64 Share Link Copied!"));
    }

    function showDonateModal() {
      if (!currentUser) return alert("Please login first");
      document.getElementById('donateTo').textContent = currentPlace.name;
      document.getElementById('donorBalance').textContent = currentUser.balance;
      document.getElementById('donateAmount').value = "";
      document.getElementById('donateModal').style.display = 'flex';
    }

    function confirmDonation() {
      const amount = parseInt(document.getElementById('donateAmount').value);
      if (!amount || amount > currentUser.balance) return alert("Invalid amount or insufficient balance");

      currentUser.balance -= amount;
      currentPlace.donations.unshift({
        from: currentUser.handle,
        amount: amount,
        time: new Date().toLocaleString()
      });

      document.getElementById('balanceDisplay').textContent = currentUser.balance + " ROOT";
      log(`💸 Donated ${amount} ROOT to ${currentPlace.name}`);
      alert("✅ Donation Successful via Apple Pay");
      closeDonateModal();
      closePlaceModal();
      showPlaceDetail(currentPlace);
    }

    function showProfile() {
      if (!currentUser) return;
      const topup = prompt("Enter ROOT amount to top-up:", "500");
      if (topup && !isNaN(topup)) {
        currentUser.balance += parseInt(topup);
        document.getElementById('balanceDisplay').textContent = currentUser.balance + " ROOT";
        log(`💰 Top-up successful: +${topup} ROOT`);
      }
    }

    function login() {
      currentUser = { handle: "@hunter", balance: 2450 };
      document.getElementById('authBtn').style.display = 'none';
      document.getElementById('userSection').style.display = 'block';
      document.getElementById('usernameDisplay').textContent = currentUser.handle;
      document.getElementById('balanceDisplay').textContent = currentUser.balance + " ROOT";
      closeAuthModal();
      log(`🔓 Logged in as ${currentUser.handle}`);
    }

    function signup() {
      currentUser = { handle: "@newexplorer", balance: 980 };
      document.getElementById('authBtn').style.display = 'none';
      document.getElementById('userSection').style.display = 'block';
      document.getElementById('usernameDisplay').textContent = currentUser.handle;
      document.getElementById('balanceDisplay').textContent = currentUser.balance + " ROOT";
      closeAuthModal();
      log("✅ New account created");
    }

    // Modal controls
    function closePlaceModal() { document.getElementById('placeModal').style.display = 'none'; }
    function closeDonateModal() { document.getElementById('donateModal').style.display = 'none'; }
    function showAuthModal() { document.getElementById('authModal').style.display = 'flex'; }
    function closeAuthModal() { document.getElementById('authModal').style.display = 'none'; }
    function showReportModal() { document.getElementById('reportModal').style.display = 'flex'; }
    function closeReportModal() { document.getElementById('reportModal').style.display = 'none'; }
    function simulatePhotoUpload() { document.getElementById('photoPreview').innerHTML = '✅ Photo attached (simulated)'; }
    function submitReport() {
      const title = document.getElementById('reportTitle').value.trim();
      if (!title) return alert("Title is required");
      alert("✅ Report submitted successfully!");
      closeReportModal();
      log(`🚨 REPORT: ${title}`);
    }
    function setTab(n) { document.querySelectorAll('.nav button').forEach((b,i) => b.classList.toggle('active', i===n)); }
    function resetScan() { if(confirm("Reset mesh?")) startAutoAddressSearch(); }
    function toggleLearnMode() { alert("ROOT DONATE v2.2 – Perfect & Clean"); }

    window.onload = () => {
      startAutoAddressSearch();
      log("🔓 ROOT DONATE v2.2 – Fully Cleaned & Auto-Complete Perfected");
    };
  </script>
</body>
</html>
