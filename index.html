<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Local AI</title>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-2: #334155;
      --accent: #22c55e;
      --text: #f8fafc;
      --muted: #94a3b8;
      --user: #14532d;
      --bot: #1e293b;
      --border: #334155;
      --radius: 20px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;
    }
    body {
      display: flex;
      flex-direction: column;
      min-height: 100dvh;
      padding-top: env(safe-area-inset-top);
    }
    header {
      background: rgba(30, 41, 59, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 0.75rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .logo {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, #22c55e, #3b82f6);
      border-radius: 8px;
      display: grid; place-items: center;
      font-weight: 700;
    }
    h1 { font-size: 1.1rem; font-weight: 600; }
    select, button {
      background: var(--surface-2);
      border: none;
      color: var(--text);
      border-radius: 10px;
      padding: 0.45rem 0.75rem;
      font-size: 0.85rem;
    }
    button.primary { background: var(--accent); color: #052e16; }
    button:disabled { opacity: 0.4; }
    #status {
      font-size: 0.75rem;
      color: var(--muted);
      text-align: center;
      padding: 0.3rem;
      background: var(--surface);
    }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      -webkit-overflow-scrolling: touch;
    }
    .msg {
      max-width: 85%;
      padding: 0.7rem 0.9rem;
      border-radius: var(--radius);
      line-height: 1.45;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .user {
      align-self: flex-end;
      background: var(--user);
      color: white;
      border-bottom-right-radius: 6px;
    }
    .bot {
      align-self: flex-start;
      background: var(--bot);
      border: 1px solid var(--border);
      border-bottom-left-radius: 6px;
    }
    .empty {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: var(--muted);
      padding: 2rem;
    }
    .empty h2 { color: var(--text); font-size: 1.4rem; margin-bottom: 0.4rem; }
    .input-bar {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 0.7rem 1rem;
      padding-bottom: calc(0.7rem + env(safe-area-inset-bottom));
      display: flex;
      gap: 0.5rem;
      align-items: flex-end;
    }
    #input {
      flex: 1;
      resize: none;
      min-height: 48px;
      max-height: 120px;
      padding: 0.7rem 0.9rem;
      font-family: inherit;
      font-size: 1rem;
      background: var(--surface-2);
      border: 1px solid transparent;
      color: var(--text);
      border-radius: var(--radius);
    }
    #input:focus { outline: none; border-color: var(--accent); }
    #send {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--accent);
      color: #052e16;
      font-size: 1.3rem;
      display: grid;
      place-items: center;
    }
  </style>
</head>
<body>
  <header>
    <div style="display:flex;align-items:center;gap:0.6rem">
      <div class="logo">∞</div>
      <h1>Local AI</h1>
    </div>
    <select id="model">
      <option value="Llama-3.2-1B-Instruct-q4f32_1-MLC">Llama 1B</option>
      <option value="Llama-3.2-3B-Instruct-q4f32_1-MLC" selected>Llama 3B</option>
      <option value="Phi-3.5-mini-instruct-q4f16_1-MLC">Phi-3.5</option>
      <option value="Qwen2.5-1.5B-Instruct-q4f16_1-MLC">Qwen 1.5B</option>
    </select>
  </header>

  <div id="status">Select model and send a message</div>

  <div id="chat">
    <div class="empty" id="empty">
      <div>
        <h2>Local AI</h2>
        <p>Runs in your browser<br>No Puter · No rate limits after download</p>
      </div>
    </div>
  </div>

  <div class="input-bar">
    <textarea id="input" placeholder="Message" rows="1"></textarea>
    <button id="send">↑</button>
  </div>

  <script type="module">
    import { CreateMLCEngine } from "https://esm.run/@mlc-ai/web-llm";

    const chat = document.getElementById("chat");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const modelSelect = document.getElementById("model");
    const statusEl = document.getElementById("status");
    let empty = document.getElementById("empty");

    let engine = null;
    let messages = [];
    let isGenerating = false;

    const setStatus = t => statusEl.textContent = t;

    function addMessage(text, role) {
      if (empty) { empty.remove(); empty = null; }
      const div = document.createElement("div");
      div.className = "msg " + role;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    function updateBubble(div, text) {
      div.textContent = text;
      chat.scrollTop = chat.scrollHeight;
    }

    async function ensureEngine() {
      if (engine) return;
      const modelId = modelSelect.value;
      setStatus("Loading model… (first time downloads)");
      engine = await CreateMLCEngine(modelId, {
        initProgressCallback: info => {
          const p = Math.round((info.progress || 0) * 100);
          setStatus(info.text || `Loading ${p}%`);
        }
      });
      setStatus("Ready");
    }

    async function send() {
      if (isGenerating) return;
      const text = input.value.trim();
      if (!text) return;

      isGenerating = true;
      sendBtn.disabled = true;

      addMessage(text, "user");
      messages.push({ role: "user", content: text });
      input.value = "";
      input.style.height = "auto";

      const botDiv = addMessage("…", "bot");
      let full = "";

      try {
        await ensureEngine();
        const stream = await engine.chat.completions.create({
          messages,
          stream: true,
          temperature: 0.7,
          max_tokens: 2048
        });
        for await (const chunk of stream) {
          const delta = chunk.choices?.[0]?.delta?.content || "";
          if (delta) {
            full += delta;
            updateBubble(botDiv, full);
          }
        }
        if (!full) full = "(no response)";
        messages.push({ role: "assistant", content: full });
        updateBubble(botDiv, full);
        setStatus("Ready");
      } catch (err) {
        updateBubble(botDiv, "Error: " + (err.message || err));
        setStatus("Error");
      } finally {
        isGenerating = false;
        sendBtn.disabled = false;
        input.focus();
      }
    }

    sendBtn.addEventListener("click", send);
    input.addEventListener("keydown", e => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    });
    input.addEventListener("input", () => {
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 120) + "px";
    });

    modelSelect.addEventListener("change", () => {
      if (engine) {
        engine.unload?.();
        engine = null;
        setStatus("Model changed — send a message to load");
      }
    });

    if (!navigator.gpu) setStatus("WebGPU required (use Chrome/Edge)");
  </script>
</body>
</html>
