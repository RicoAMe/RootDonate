<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <title>RootDonate • The Ether Fund</title>
  <style>
    :root {
      --bg: #0b1220;
      --surface: rgba(21, 30, 46, 0.72);
      --surface-2: #1e293b;
      --surface-3: #253044;
      --accent: #22c55e;
      --accent-hover: #16a34a;
      --eth: #627eea;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --user: #22c55e;
      --bot: rgba(30, 41, 59, 0.85);
      --border: rgba(51, 65, 85, 0.6);
      --radius: 20px;
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.32);
      --glow: 0 0 24px rgba(34, 197, 94, 0.18);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 16px;
      line-height: 1.5;
    }
    body {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
      position: relative;
      overflow: hidden;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 50% at 15% 20%, rgba(34, 197, 94, 0.14), transparent 50%),
        radial-gradient(ellipse 60% 70% at 85% 75%, rgba(98, 126, 234, 0.12), transparent 50%),
        radial-gradient(ellipse 50% 40% at 50% 90%, rgba(34, 197, 94, 0.08), transparent 40%);
      pointer-events: none;
      z-index: -1;
      animation: drift 28s ease-in-out infinite alternate;
    }
    @keyframes drift {
      from { transform: scale(1) translate(0, 0); }
      to { transform: scale(1.05) translate(-2%, 2%); }
    }
    header {
      background: var(--surface);
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      backdrop-filter: blur(16px) saturate(1.4);
      -webkit-backdrop-filter: blur(16px) saturate(1.4);
      position: relative;
      z-index: 2;
    }
    header strong {
      font-size: 1.2rem;
      color: var(--accent);
      letter-spacing: -0.03em;
      text-shadow: 0 0 12px rgba(34, 197, 94, 0.4);
    }
    header small { color: var(--muted); font-size: 0.78rem; display: block; margin-top: 1px; }
    .header-actions { display: flex; gap: 6px; }
    button {
      background: rgba(71, 85, 105, 0.7);
      color: #fff;
      border: 1px solid transparent;
      padding: 8px 14px;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      min-height: 40px;
      font-size: 0.9rem;
      transition: all 0.18s ease;
      backdrop-filter: blur(8px);
    }
    button:hover { background: rgba(100, 116, 139, 0.85); transform: translateY(-1px); }
    button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    button:active { transform: scale(0.98); }
    button:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 18px 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      scroll-behavior: smooth;
      position: relative;
      z-index: 1;
    }
    .msg-wrap { max-width: 85%; display: flex; flex-direction: column; animation: fadeIn 0.28s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
    .user { align-self: flex-end; }
    .bot { align-self: flex-start; }
    .msg {
      padding: 13px 16px;
      border-radius: var(--radius);
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.45;
      position: relative;
      box-shadow: var(--shadow);
      backdrop-filter: blur(12px);
    }
    .user .msg {
      background: linear-gradient(135deg, var(--user), #16a34a);
      color: #000;
      border-bottom-right-radius: 6px;
      box-shadow: var(--shadow), var(--glow);
    }
    .bot .msg {
      background: var(--bot);
      border-bottom-left-radius: 6px;
      border: 1px solid var(--border);
    }
    .timestamp { font-size: 0.68rem; color: var(--muted); margin-top: 5px; padding: 0 4px; opacity: 0.75; }
    .user .timestamp { text-align: right; }
    .unlocked-now {
      margin-top: 10px;
      padding: 8px 10px;
      background: rgba(34, 197, 94, 0.12);
      border: 1px solid var(--accent);
      border-radius: 10px;
      font-size: 0.78rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    .unlocked-now button {
      margin-left: 8px;
      padding: 2px 8px;
      font-size: 0.75rem;
      min-height: 0;
      background: var(--accent);
      color: #000;
    }
    .msg-actions { position: absolute; top: 6px; right: 8px; opacity: 0; transition: opacity 0.15s; }
    .msg-wrap:hover .msg-actions,
    .msg-wrap:focus-within .msg-actions { opacity: 1; }
    .msg-actions button {
      background: rgba(0, 0, 0, 0.4);
      color: #fff;
      padding: 4px 8px;
      font-size: 0.75rem;
      min-height: 0;
      border-radius: 8px;
    }
    .typing {
      align-self: flex-start;
      display: flex;
      gap: 5px;
      padding: 14px 16px;
      background: var(--bot);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      width: fit-content;
    }
    .typing span {
      width: 8px;
      height: 8px;
      background: var(--muted);
      border-radius: 50%;
      animation: bounce 1.4s infinite;
    }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce { 0%, 80%, 100% { transform: scale(0); } 40% { transform: scale(1); } }
    .input-bar {
      display: flex;
      gap: 10px;
      padding: 12px 14px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
      align-items: flex-end;
      backdrop-filter: blur(16px) saturate(1.3);
      -webkit-backdrop-filter: blur(16px) saturate(1.3);
      position: relative;
      z-index: 2;
    }
    #input {
      flex: 1;
      padding: 13px 18px;
      border: 1px solid transparent;
      border-radius: 24px;
      background: var(--surface-2);
      color: var(--text);
      font: inherit;
      resize: none;
      min-height: 50px;
      max-height: 140px;
      outline: none;
      transition: all 0.2s;
    }
    #input:focus {
      background: var(--surface-3);
      border-color: rgba(34, 197, 94, 0.4);
      box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.15);
    }
    #input:disabled { opacity: 0.6; }
    #send {
      background: var(--accent);
      color: #000;
      border: none;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      font-size: 1.35rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      box-shadow: var(--glow);
      transition: all 0.18s;
    }
    #send:hover { transform: scale(1.05); background: var(--accent-hover); }
    #send:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .badge {
      display: inline-block;
      background: var(--eth);
      color: white;
      font-size: 0.68rem;
      padding: 2px 8px;
      border-radius: 999px;
      margin-left: 6px;
      vertical-align: middle;
      font-weight: 600;
    }
    .teach-banner {
      background: rgba(98, 126, 234, 0.18);
      border: 1px solid var(--eth);
      color: #c7d2fe;
      padding: 10px 14px;
      border-radius: 12px;
      font-size: 0.85rem;
      margin: 0 16px 8px;
      text-align: center;
      backdrop-filter: blur(10px);
    }
    .teach-actions { display: flex; gap: 8px; justify-content: center; margin-top: 10px; flex-wrap: wrap; }
    .teach-actions button { padding: 6px 12px; font-size: 0.8rem; min-height: 0; }
    @media (min-width: 600px) { .msg-wrap { max-width: 72%; } }
    @media (max-width: 480px) {
      header { padding: 12px 14px; }
      .header-actions button { padding: 6px 10px; font-size: 0.8rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, body::before { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <strong>RootDonate <span class="badge">ETH</span></strong>
      <small id="status">Connecting…</small>
      <small id="nowTime"></small>
    </div>
    <div class="header-actions">
      <button id="shareBtn" title="Copy chat link">Share</button>
      <button id="newChatBtn">New</button>
      <button id="clearBtn">Clear</button>
    </div>
  </header>

  <div id="teachBanner" class="teach-banner" hidden>
    <div id="teachText"></div>
    <div class="teach-actions">
      <button id="savePersonal">Save Personal</button>
      <button id="saveBoth">Save Personal + Global</button>
      <button id="cancelTeach">Cancel</button>
    </div>
  </div>
  <div id="chat" role="log" aria-live="polite" aria-relevant="additions"></div>

  <div class="input-bar">
    <textarea id="input" placeholder="Ask about The Ether Fund…" rows="1" aria-label="Message"></textarea>
    <button id="send" aria-label="Send">↑</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, getDocs, limit, where, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBvcCBsPiMxS7G2evPjM7sANp-zSy_RkKM",
      authDomain: "rootdonate-61e61.firebaseapp.com",
      projectId: "rootdonate-61e61",
      storageBucket: "rootdonate-61e61.firebasestorage.app",
      messagingSenderId: "754240963907",
      appId: "1:754240963907:web:5417c2763d8f02108bdbf6"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null;
    let personalMemory = [];
    let globalMemory = [];
    let unsubPersonal = null;
    let unsubGlobal = null;
    let isReplying = false;
    let awaitingTeach = false;
    let pendingInput = null;
    let chatId = null;
    let typingEl = null;
    let lastAiCall = parseInt(localStorage.getItem("qeth_last_ai_call") || "0", 10);
    let nowInterval = null;
    let cooldownInterval = null;

    const CHAT_KEY = "qeth_expert_chat";
    const BASE42 = "0123456789abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ".slice(0, 42);
    const AI_COOLDOWN_MS = 48000;

    function toBase42(num) {
      if (!Number.isFinite(num) || num < 0) num = 0;
      if (num === 0) return BASE42[0];
      let s = "";
      while (num > 0) {
        s = BASE42[num % 42] + s;
        num = Math.floor(num / 42);
      }
      return s;
    }

    function generateChatId() {
      const rand = Math.floor(Math.random() * Number.MAX_SAFE_INTEGER);
      const timePart = toBase42(Date.now());
      const randPart = toBase42(rand);
      return (randPart + timePart).slice(0, 13);
    }

    function getChatIdFromUrl() {
      return new URLSearchParams(window.location.search).get("chat") || null;
    }

    function setChatIdInUrl(id, replace = true) {
      const u = new URL(window.location);
      if (id) u.searchParams.set("chat", id);
      else u.searchParams.delete("chat");
      if (replace) history.replaceState({ chatId: id }, "", u);
      else history.pushState({ chatId: id }, "", u);
    }

    function normalize(t) {
      return (t || "").trim().toLowerCase().replace(/[^\w\s]/g, "").replace(/\s+/g, " ");
    }

    function findBestResponse(input) {
      const clean = normalize(input);
      if (!clean) return null;

      for (const p of personalMemory) {
        if (normalize(p.input) === clean) return p.response;
      }
      for (const p of globalMemory) {
        if (normalize(p.input) === clean) return p.response;
      }

      let best = null;
      let bestScore = 0;
      const words = clean.split(" ").filter(w => w.length > 2);

      const check = (list) => {
        for (const p of list) {
          const target = normalize(p.input);
          let score = 0;
          if (clean.includes(target) || target.includes(clean)) score += 8;
          words.forEach(w => { if (target.includes(w)) score += 2; });
          if (score > bestScore && score >= 4) {
            bestScore = score;
            best = p.response;
          }
        }
      };

      check(personalMemory);
      if (!best) check(globalMemory);
      return best;
    }

    function getRemainingCooldown() {
      const remaining = AI_COOLDOWN_MS - (Date.now() - lastAiCall);
      return Math.max(0, remaining);
    }

    function updateCooldownStatus() {
      const status = document.getElementById("status");
      if (!status) return;
      const remaining = getRemainingCooldown();
      if (remaining > 0) {
        const secs = Math.ceil(remaining / 1000);
        status.textContent = `AI cooling down · ${secs}s`;
      } else if (currentUser) {
        status.textContent = "Cloud sync · Personal + Global · AI ready";
      } else {
        status.textContent = "Connecting…";
      }
    }

    async function getInternetAIResponse(userText) {
      const unlockedNow = Date.now();
      const nowStr = new Date(unlockedNow).toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" });

      const system = `You are a precise expert on The Ether Fund (TSX: QETH.UN / QETH.U), a closed-end fund managed by 3iQ Corp. 
It is Canada's first regulated Ether fund, provides ~100% ETH exposure (with small cash balance possible), holds ETH in cold storage, and stakes for yield. 
Eligible for TFSA/RRSP etc. Management fee ~1.95%. Benchmark is CME CF Ether-Dollar Reference Rate (NY variant). 
Always prefer the most recent public information from 3iQ.io, TSX filings, SEDAR+, fund fact sheets, or equivalent. 
Current unlocked timestamp: ${unlockedNow} (${nowStr}). 
Be clear, structured, and factual. Explicitly note when data may be delayed or approximate. 
Never give financial advice. Keep answers concise but complete.`;

      const prompt = `${system}\n\nUser question: ${userText}`;

      const url = `https://text.pollinations.ai/${encodeURIComponent(prompt)}?system=${encodeURIComponent("You are an expert on The Ether Fund (3iQ). Use latest public data. Not financial advice.")}&temperature=0.4`;

      try {
        const res = await fetch(url);
        if (res.status === 402) {
          const retryAfter = parseInt(res.headers.get("Retry-After") || "45", 10);
          lastAiCall = Date.now();
          localStorage.setItem("qeth_last_ai_call", String(lastAiCall));
          return {
            text: `Internet AI is rate-limited on the free tier (next free slot in ~${retryAfter}s). You can teach me the best answer instead, or try again shortly.`,
            unlockedNow,
            fromAI: false,
            rateLimited: true
          };
        }
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        let text = (await res.text()).trim();
        if (!text || text.length < 5) throw new Error("Empty response");
        lastAiCall = Date.now();
        localStorage.setItem("qeth_last_ai_call", String(lastAiCall));
        return { text, unlockedNow, fromAI: true };
      } catch (e) {
        return {
          text: "I don't have a strong match yet and the internet AI is unavailable right now.\n\nTeach me the best reply and I'll remember it.",
          unlockedNow,
          fromAI: false
        };
      }
    }

    function saveLocalChat() {
      if (!chatId) return;
      const msgs = Array.from(document.getElementById("chat").querySelectorAll(".msg-wrap:not(.typing)")).map(w => ({
        text: w.querySelector(".msg").textContent,
        isUser: w.classList.contains("user"),
        ts: w.dataset.ts || Date.now(),
        unlocked: w.dataset.unlocked || null
      }));
      localStorage.setItem(CHAT_KEY + "_" + chatId, JSON.stringify(msgs));
    }

    function loadLocalChat() {
      if (!chatId) return false;
      const saved = localStorage.getItem(CHAT_KEY + "_" + chatId);
      if (!saved) return false;
      try {
        const msgs = JSON.parse(saved);
        document.getElementById("chat").innerHTML = "";
        msgs.forEach(m => addMessage(m.text, m.isUser, false, m.ts, m.unlocked));
        return true;
      } catch {
        return false;
      }
    }

    function clearLocalView() {
      document.getElementById("chat").innerHTML = "";
      if (chatId) localStorage.removeItem(CHAT_KEY + "_" + chatId);
      awaitingTeach = false;
      pendingInput = null;
      updateTeachBanner();
      hideTyping();
    }

    async function saveMessageToCloud(text, isUser) {
      if (!currentUser || !chatId) return;
      try {
        await addDoc(collection(db, "chats", chatId, "messages"), {
          text,
          isUser,
          uid: currentUser.uid,
          createdAt: serverTimestamp()
        });
      } catch (e) {
        console.warn("Cloud save failed", e);
      }
    }

    async function loadChatFromCloud() {
      if (!chatId) return false;
      try {
        const snap = await getDocs(query(
          collection(db, "chats", chatId, "messages"),
          orderBy("createdAt", "asc"),
          limit(500)
        ));
        if (snap.empty) return false;
        document.getElementById("chat").innerHTML = "";
        snap.forEach(d => {
          const data = d.data();
          addMessage(data.text, data.isUser, false, data.createdAt?.toMillis?.() || Date.now());
        });
        return true;
      } catch (e) {
        console.warn("Cloud load failed", e);
        return false;
      }
    }

    function listenMemories() {
      if (unsubPersonal) unsubPersonal();
      if (unsubGlobal) unsubGlobal();
      if (!currentUser) return;

      unsubPersonal = onSnapshot(
        query(collection(db, "users", currentUser.uid, "memory"), orderBy("createdAt", "desc"), limit(500)),
        snap => { personalMemory = snap.docs.map(d => d.data()).reverse(); },
        err => console.warn("Personal memory error", err)
      );

      unsubGlobal = onSnapshot(
        query(collection(db, "shared_memory"), orderBy("createdAt", "desc"), limit(1000)),
        snap => { globalMemory = snap.docs.map(d => d.data()).reverse(); },
        err => console.warn("Global memory error", err)
      );
    }

    async function saveMemoryPair(input, response, toGlobal = false) {
      if (!currentUser) return;
      const trimmed = input.trim();
      if (!trimmed || !response.trim()) return;

      try {
        const personalRef = collection(db, "users", currentUser.uid, "memory");
        const existing = await getDocs(query(personalRef, where("input", "==", trimmed), limit(1)));
        if (existing.empty) {
          await addDoc(personalRef, {
            input: trimmed,
            response: response.trim(),
            createdAt: serverTimestamp()
          });
        }

        if (toGlobal) {
          const globalSnap = await getDocs(query(
            collection(db, "shared_memory"),
            where("input", "==", trimmed),
            limit(1)
          ));
          if (globalSnap.empty) {
            await addDoc(collection(db, "shared_memory"), {
              input: trimmed,
              response: response.trim(),
              uid: currentUser.uid,
              createdAt: serverTimestamp()
            });
          }
        }
      } catch (e) {
        console.warn("Memory save failed", e);
      }
    }

    function showTyping() {
      hideTyping();
      typingEl = document.createElement("div");
      typingEl.className = "msg-wrap bot typing";
      typingEl.innerHTML = `<div class="typing"><span></span><span></span><span></span></div>`;
      document.getElementById("chat").appendChild(typingEl);
      document.getElementById("chat").scrollTop = document.getElementById("chat").scrollHeight;
    }

    function hideTyping() {
      if (typingEl) {
        typingEl.remove();
        typingEl = null;
      }
    }

    function formatTime(ts) {
      return new Date(ts || Date.now()).toLocaleString(undefined, {
        month: "short",
        day: "numeric",
        hour: "2-digit",
        minute: "2-digit"
      });
    }

    function setInputEnabled(enabled) {
      const input = document.getElementById("input");
      const sendBtn = document.getElementById("send");
      input.disabled = !enabled;
      sendBtn.disabled = !enabled;
    }

    function updateTeachBanner() {
      const banner = document.getElementById("teachBanner");
      const textEl = document.getElementById("teachText");
      if (awaitingTeach && pendingInput) {
        banner.hidden = false;
        textEl.textContent = `Teach mode: Best answer for “${pendingInput.slice(0, 80)}${pendingInput.length > 80 ? "…" : ""}”`;
      } else {
        banner.hidden = true;
      }
    }

    function addMessage(text, isUser, save = true, ts = Date.now(), unlockedNow = null) {
      const wrap = document.createElement("div");
      wrap.className = "msg-wrap " + (isUser ? "user" : "bot");
      wrap.dataset.ts = ts;
      if (unlockedNow) wrap.dataset.unlocked = unlockedNow;

      const div = document.createElement("div");
      div.className = "msg";
      div.textContent = text;

      const actions = document.createElement("div");
      actions.className = "msg-actions";
      const copyBtn = document.createElement("button");
      copyBtn.textContent = "Copy";
      copyBtn.setAttribute("aria-label", "Copy message");
      copyBtn.onclick = () => navigator.clipboard.writeText(text).then(() => {
        copyBtn.textContent = "Copied";
        setTimeout(() => copyBtn.textContent = "Copy", 1500);
      });
      actions.appendChild(copyBtn);
      div.appendChild(actions);

      const timeEl = document.createElement("div");
      timeEl.className = "timestamp";
      timeEl.textContent = formatTime(ts);

      wrap.appendChild(div);

      if (unlockedNow) {
        const unlockEl = document.createElement("div");
        unlockEl.className = "unlocked-now";
        unlockEl.innerHTML = `Unlocked Date.now(): <strong>${unlockedNow}</strong> <button>Copy</button>`;
        unlockEl.querySelector("button").onclick = () => navigator.clipboard.writeText(String(unlockedNow)).then(() => {
          unlockEl.querySelector("button").textContent = "Copied!";
          setTimeout(() => unlockEl.querySelector("button").textContent = "Copy", 1200);
        });
        wrap.appendChild(unlockEl);
      }

      wrap.appendChild(timeEl);

      const chat = document.getElementById("chat");
      chat.appendChild(wrap);
      chat.scrollTop = chat.scrollHeight;

      if (save) {
        saveLocalChat();
        saveMessageToCloud(text, isUser);
      }
      return wrap;
    }

    async function reply(userText) {
      if (isReplying) return;
      isReplying = true;
      setInputEnabled(false);
      showTyping();
      await new Promise(r => setTimeout(r, 350 + Math.random() * 500));

      const response = findBestResponse(userText);
      hideTyping();

      if (response) {
        addMessage(response, false);
      } else {
        const remaining = getRemainingCooldown();
        if (remaining > 0) {
          const wait = Math.ceil(remaining / 1000);
          addMessage(`Internet AI is cooling down (free tier). Try again in ~${wait}s, or teach me the best answer.`, false);
          isReplying = false;
          setInputEnabled(true);
          return;
        }

        showTyping();
        const ai = await getInternetAIResponse(userText);
        hideTyping();
        addMessage(ai.text, false, true, Date.now(), ai.unlockedNow);

        if (ai.fromAI && currentUser) {
          await saveMemoryPair(userText, ai.text, true);
          addMessage("Saved to personal + global memory.", false);
        }

        if (!ai.fromAI && (ai.text.includes("Teach me") || ai.rateLimited)) {
          awaitingTeach = true;
          pendingInput = userText;
          updateTeachBanner();
        }
      }
      isReplying = false;
      setInputEnabled(true);
      updateCooldownStatus();
    }

    function updateNowTime() {
      const el = document.getElementById("nowTime");
      if (el) el.textContent = "Now: " + new Date().toLocaleString() + " · " + Date.now();
    }

    async function loadChatForCurrentId() {
      clearLocalView();
      if (!chatId) return;
      const loadedCloud = await loadChatFromCloud();
      if (!loadedCloud) loadLocalChat();
      if (document.getElementById("chat").children.length === 0) {
        addMessage("Hello! Ask me anything about The Ether Fund (TSX: QETH.UN / QETH.U).\n\nCanada's first regulated Ether fund by 3iQ. ~100% ETH exposure, cold storage, staking yield, TFSA/RRSP eligible.\n\nI remember personal answers and shared community knowledge.\nNot financial advice.", false, false);
      }
    }

    function setupUI() {
      const input = document.getElementById("input");
      const sendBtn = document.getElementById("send");
      const clearBtn = document.getElementById("clearBtn");
      const newChatBtn = document.getElementById("newChatBtn");
      const shareBtn = document.getElementById("shareBtn");
      const savePersonalBtn = document.getElementById("savePersonal");
      const saveBothBtn = document.getElementById("saveBoth");
      const cancelTeachBtn = document.getElementById("cancelTeach");

      chatId = getChatIdFromUrl() || generateChatId();
      setChatIdInUrl(chatId, true);

      updateNowTime();
      nowInterval = setInterval(updateNowTime, 30000);
      cooldownInterval = setInterval(updateCooldownStatus, 1000);
      updateCooldownStatus();

      window.addEventListener("popstate", async (e) => {
        const newId = getChatIdFromUrl();
        if (newId && newId !== chatId) {
          chatId = newId;
          await loadChatForCurrentId();
        } else if (!newId) {
          chatId = generateChatId();
          setChatIdInUrl(chatId, true);
          await loadChatForCurrentId();
        }
      });

      onAuthStateChanged(auth, async user => {
        currentUser = user;
        if (user) {
          listenMemories();
          await loadChatForCurrentId();
          updateCooldownStatus();
        } else {
          document.getElementById("status").textContent = "Connecting to cloud…";
          signInAnonymously(auth).catch(() => {
            document.getElementById("status").textContent = "Cloud connection failed – local only";
            loadChatForCurrentId();
          });
        }
      });

      clearBtn.onclick = () => {
        if (confirm("Clear local view only?")) clearLocalView();
      };

      newChatBtn.onclick = async () => {
        if (confirm("Start a new chat?")) {
          chatId = generateChatId();
          setChatIdInUrl(chatId, false);
          await loadChatForCurrentId();
        }
      };

      shareBtn.onclick = () => {
        navigator.clipboard.writeText(window.location.href).then(() => {
          shareBtn.textContent = "Copied!";
          setTimeout(() => shareBtn.textContent = "Share", 1500);
        });
      };

      savePersonalBtn.onclick = async () => {
        const text = input.value.trim();
        if (!text || !pendingInput) return;
        addMessage(text, true);
        await saveMemoryPair(pendingInput, text, false);
        addMessage("Saved to your personal memory only.", false);
        input.value = "";
        awaitingTeach = false;
        pendingInput = null;
        updateTeachBanner();
      };

      saveBothBtn.onclick = async () => {
        const text = input.value.trim();
        if (!text || !pendingInput) return;
        addMessage(text, true);
        await saveMemoryPair(pendingInput, text, true);
        addMessage("Saved to personal + global memory.", false);
        input.value = "";
        awaitingTeach = false;
        pendingInput = null;
        updateTeachBanner();
      };

      cancelTeachBtn.onclick = () => {
        awaitingTeach = false;
        pendingInput = null;
        updateTeachBanner();
      };

      async function send() {
        const text = input.value.trim();
        if (!text || isReplying) return;
        if (text.length > 2000) {
          alert("Message too long (max 2000 characters).");
          return;
        }
        input.value = "";
        input.style.height = "auto";

        if (awaitingTeach && pendingInput) {
          addMessage(text, true);
          await saveMemoryPair(pendingInput, text, false);
          addMessage("Saved to your personal memory.", false);
          awaitingTeach = false;
          pendingInput = null;
          updateTeachBanner();
          return;
        }

        addMessage(text, true);
        await reply(text);
      }

      sendBtn.onclick = send;
      input.onkeydown = e => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          send();
        }
      };
      input.oninput = () => {
        input.style.height = "auto";
        input.style.height = Math.min(input.scrollHeight, 140) + "px";
      };
    }

    setupUI();
  </script>
</body>
</html>
