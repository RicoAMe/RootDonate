<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ROOTDONATE • LOST &amp; FOUND NODES</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    :root {
      --neon: #00ff41;
      --neon-dark: #00cc33;
      --neon-glow: #00ff4188;
      --bg: #050505;
      --card: #0a0a0a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Courier New', monospace;
      background: var(--bg);
      color: var(--neon);
      overflow: hidden;
      line-height: 1.6;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* MATRIX BACKGROUND */
    canvas#matrix-bg {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: -1;
      opacity: 0.12;
      pointer-events: none;
    }

    /* AUTH CONTAINER */
    .auth-container {
      width: 100%;
      max-width: 460px;
      background: var(--card);
      border: 3px solid var(--neon);
      border-radius: 20px;
      box-shadow: 0 0 60px var(--neon-glow),
                  inset 0 0 40px rgba(0, 255, 65, 0.08);
      overflow: hidden;
      position: relative;
    }

    .scanline {
      position: absolute;
      inset: 0;
      background: linear-gradient(transparent, rgba(0, 255, 65, 0.04), transparent);
      pointer-events: none;
      animation: scan 6s linear infinite;
      z-index: 1;
    }

    .auth-header {
      padding: 30px 40px 20px;
      text-align: center;
      border-bottom: 1px solid rgba(0, 255, 65, 0.2);
      position: relative;
    }

    .auth-header h1 {
      font-size: 2.6rem;
      text-shadow: 0 0 20px var(--neon);
      letter-spacing: 6px;
      animation: glitch 2s infinite;
    }

    .auth-header p {
      opacity: 0.75;
      font-size: 0.95rem;
      letter-spacing: 3px;
    }

    .tab-switch {
      display: flex;
      background: #000;
      border-bottom: 2px solid var(--neon);
    }

    .tab {
      flex: 1;
      padding: 18px;
      text-align: center;
      font-size: 1.1rem;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.3s;
    }

    .tab.active {
      background: rgba(0, 255, 65, 0.12);
      color: white;
      text-shadow: 0 0 15px var(--neon);
      border-bottom: 3px solid var(--neon);
    }

    .form-container {
      padding: 40px;
    }

    .input-group {
      margin-bottom: 24px;
    }

    .input-group label {
      display: block;
      margin-bottom: 8px;
      font-size: 0.9rem;
      opacity: 0.8;
    }

    .input-wrapper {
      position: relative;
    }

    .input-wrapper i {
      position: absolute;
      left: 18px;
      top: 50%;
      transform: translateY(-50%);
      opacity: 0.6;
      z-index: 2;
    }

    input {
      width: 100%;
      background: #000;
      border: 2px solid rgba(0, 255, 65, 0.4);
      color: var(--neon);
      padding: 16px 20px 16px 52px;
      font-size: 1.05rem;
      border-radius: 50px;
      transition: all 0.3s;
    }

    input:focus {
      outline: none;
      border-color: var(--neon);
      box-shadow: 0 0 25px var(--neon-glow);
    }

    .password-toggle {
      position: absolute;
      right: 20px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      opacity: 0.7;
      z-index: 2;
    }

    .btn {
      width: 100%;
      padding: 18px;
      background: transparent;
      color: var(--neon);
      border: 3px solid var(--neon);
      font-size: 1.15rem;
      font-weight: bold;
      border-radius: 50px;
      cursor: pointer;
      margin-top: 10px;
      transition: all 0.4s;
      text-transform: uppercase;
      letter-spacing: 2px;
      box-shadow: 0 0 20px rgba(0, 255, 65, 0.3);
    }

    .btn:hover {
      background: var(--neon);
      color: #000;
      box-shadow: 0 0 40px var(--neon);
      transform: translateY(-3px);
    }

    .divider {
      text-align: center;
      margin: 30px 0;
      color: #555;
      position: relative;
    }

    .divider::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 1px;
      background: rgba(0, 255, 65, 0.2);
    }

    .divider span {
      background: var(--card);
      padding: 0 25px;
    }

    .status {
      text-align: center;
      margin-top: 20px;
      font-size: 0.95rem;
      min-height: 24px;
    }

    .footer-links {
      text-align: center;
      padding: 20px;
      font-size: 0.85rem;
      opacity: 0.6;
    }

    .footer-links a {
      color: var(--neon);
      text-decoration: none;
      margin: 0 8px;
    }

    /* MAIN APP */
    #mainApp {
      width: 100%;
      max-width: 1100px;
      margin: 20px;
      padding: 25px;
      background: var(--card);
      border: 2px solid var(--neon);
      border-radius: 20px;
      box-shadow: 0 0 40px rgba(0, 255, 65, 0.4);
      display: none;
      flex-direction: column;
      height: 92vh;
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    .header h1 {
      font-size: 2.2rem;
      letter-spacing: 4px;
    }

    .subtitle {
      opacity: 0.7;
      font-size: 0.95rem;
      letter-spacing: 2px;
    }

    .nav {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
      flex-wrap: wrap;
    }

    .nav button {
      flex: 1;
      padding: 14px;
      background: transparent;
      color: var(--neon);
      border: 2px solid var(--neon);
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.3s;
      font-weight: bold;
    }

    .nav button.active,
    .nav button:hover {
      background: var(--neon);
      color: #000;
      box-shadow: 0 0 20px var(--neon);
    }

    .search-bar {
      width: 100%;
      padding: 16px 24px;
      background: #000;
      border: 2px solid var(--neon);
      color: var(--neon);
      font-size: 1.1rem;
      border-radius: 50px;
      margin-bottom: 20px;
    }

    .search-bar:focus {
      outline: none;
      box-shadow: 0 0 25px var(--neon);
    }

    .log {
      background: #000;
      border: 1px solid rgba(0, 255, 65, 0.3);
      height: 220px;
      overflow-y: auto;
      padding: 15px;
      font-size: 0.95rem;
      border-radius: 8px;
    }

    /* Animations */
    @keyframes glitch {
      0%, 100% { text-shadow: 2px 0 #00ff41, -2px 0 #ff00ff; }
      20% { text-shadow: -2px 0 #00ff41, 2px 0 #ff00ff; }
    }

    @keyframes scan {
      0% { transform: translateY(-100%); }
      100% { transform: translateY(300%); }
    }
  </style>
</head>
<body>

  <canvas id="matrix-bg"></canvas>

  <!-- AUTH SECTION -->
  <div class="auth-container" id="authContainer">
    <div class="scanline"></div>

    <div class="auth-header">
      <h1>ROOTDONATE</h1>
      <p>LOST &amp; FOUND NODE NETWORK • EST 2026</p>
    </div>

    <div class="tab-switch">
      <div class="tab active" id="loginTab" onclick="switchTab(0)">LOGIN NODE</div>
      <div class="tab" id="signupTab" onclick="switchTab(1)">NEW NODE</div>
    </div>

    <!-- Login Form -->
    <div class="form-container" id="loginForm">
      <div class="input-group">
        <label>NODE ID / HANDLE</label>
        <div class="input-wrapper">
          <i class="fas fa-user-secret"></i>
          <input type="text" id="loginHandle" value="@CWOA" placeholder="@CWOA">
        </div>
      </div>

      <div class="input-group">
        <label>ENCRYPTED PASSPHRASE</label>
        <div class="input-wrapper">
          <i class="fas fa-key"></i>
          <input type="password" id="loginPass" placeholder="••••••••••">
          <span class="password-toggle" onclick="togglePassword(this)"><i class="fas fa-eye"></i></span>
        </div>
      </div>

      <button class="btn" onclick="performLogin()">
        <i class="fas fa-plug"></i> CONNECT TO MESH
      </button>

      <div class="divider"><span>OR</span></div>

      <button class="btn" onclick="quickLogin()" style="background:rgba(0,255,65,0.1); border-color:#00ff4188;">
        <i class="fas fa-bolt"></i> QUICK CONNECT (DEMO)
      </button>

      <div class="status" id="loginStatus"></div>
    </div>

    <!-- Signup Form -->
    <div class="form-container hidden" id="signupForm">
      <div class="input-group">
        <label>CHOOSE NODE HANDLE</label>
        <div class="input-wrapper">
          <i class="fas fa-user-secret"></i>
          <input type="text" id="signupHandle" placeholder="@YOURNAME">
        </div>
      </div>

      <div class="input-group">
        <label>RECOVERY EMAIL</label>
        <div class="input-wrapper">
          <i class="fas fa-envelope"></i>
          <input type="email" id="signupEmail" placeholder="you@darknet.node">
        </div>
      </div>

      <div class="input-group">
        <label>CREATE PASSPHRASE</label>
        <div class="input-wrapper">
          <i class="fas fa-key"></i>
          <input type="password" id="signupPass" placeholder="Minimum 12 characters">
          <span class="password-toggle" onclick="togglePassword(this)"><i class="fas fa-eye"></i></span>
        </div>
      </div>

      <div class="input-group">
        <label>CONFIRM PASSPHRASE</label>
        <div class="input-wrapper">
          <i class="fas fa-key"></i>
          <input type="password" id="signupPassConfirm" placeholder="Repeat passphrase">
        </div>
      </div>

      <button class="btn" onclick="performSignup()">
        <i class="fas fa-plus-circle"></i> DEPLOY NEW NODE
      </button>

      <div class="status" id="signupStatus"></div>
    </div>

    <div class="footer-links">
      <a href="#">FORGOT PASSPHRASE?</a> • 
      <a href="#">TOR RELAY</a> • 
      <a href="#">MESH STATUS</a>
    </div>
  </div>

  <!-- MAIN APPLICATION -->
  <div id="mainApp">
    <div class="header">
      <h1>🔗 ROOTDONATE</h1>
      <p class="subtitle">LOST &amp; FOUND NODE NETWORK • LIVE INTERNET SCAN</p>
    </div>

    <div class="nav">
      <button onclick="setTab(0)" class="active"><i class="fas fa-network-wired"></i> ALL NODES</button>
      <button onclick="setTab(1)"><i class="fas fa-search"></i> SEARCH INTERNET</button>
      <button onclick="showReportForm()"><i class="fas fa-plus-circle"></i> REPORT NODE</button>
      <button onclick="logout()"><i class="fas fa-power-off"></i> DISCONNECT</button>
    </div>

    <div id="searchPanel" class="hidden">
      <input type="text" id="searchInput" class="search-bar" 
             placeholder="SEARCH NODES (iphone, wallet, passport...)" 
             onkeyup="debouncedSearch()">
      <div id="searchResults" style="min-height: 400px;"></div>
    </div>

    <div id="nodesList"></div>

    <h2 style="margin: 30px 0 12px 10px; font-size: 1.4rem;">NETWORK ACTIVITY LOG</h2>
    <div id="log" class="log"></div>
  </div>

  <script>
    // ==================== MATRIX BACKGROUND ====================
    const canvas = document.getElementById('matrix-bg');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const chars = "01アイウエオカキクケコ0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ@#$%^&*";
    const fontSize = 14;
    let drops = [];

    function initDrops() {
      const columns = Math.floor(canvas.width / fontSize);
      drops = Array(columns).fill(1);
    }

    function drawMatrix() {
      ctx.fillStyle = 'rgba(5, 5, 5, 0.085)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#00ff41';
      ctx.font = `${fontSize}px monospace`;

      for (let i = 0; i < drops.length; i++) {
        const text = chars[Math.floor(Math.random() * chars.length)];
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);

        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
          drops[i] = 0;
        }
        drops[i]++;
      }
    }

    setInterval(drawMatrix, 35);
    initDrops();

    // ==================== AUTH FUNCTIONS ====================
    function switchTab(tab) {
      document.getElementById('loginTab').classList.toggle('active', tab === 0);
      document.getElementById('signupTab').classList.toggle('active', tab === 1);
      document.getElementById('loginForm').classList.toggle('hidden', tab !== 0);
      document.getElementById('signupForm').classList.toggle('hidden', tab !== 1);
    }

    function togglePassword(el) {
      const input = el.parentElement.querySelector('input');
      const icon = el.querySelector('i');
      if (input.type === 'password') {
        input.type = 'text';
        icon.classList.replace('fa-eye', 'fa-eye-slash');
      } else {
        input.type = 'password';
        icon.classList.replace('fa-eye-slash', 'fa-eye');
      }
    }

    function performLogin() {
      const status = document.getElementById('loginStatus');
      status.innerHTML = `<span style="color:#0f0;">ENCRYPTING TUNNEL...</span>`;
      
      setTimeout(() => {
        status.innerHTML = `<span style="color:#0f0;">✅ AUTHENTICATED • TUNNEL ESTABLISHED</span>`;
        setTimeout(enterMainApp, 800);
      }, 1100);
    }

    function quickLogin() {
      document.getElementById('loginStatus').innerHTML = `<span style="color:#0f0;">INSTANT MESH CONNECTION...</span>`;
      setTimeout(enterMainApp, 600);
    }

    function performSignup() {
      const status = document.getElementById('signupStatus');
      const handle = document.getElementById('signupHandle').value.trim() || "@NEWNODE";
      
      status.innerHTML = `<span style="color:#0f0;">DEPLOYING NODE...</span>`;
      
      setTimeout(() => {
        status.innerHTML = `<span style="color:#0f0;">✅ NODE ${handle} DEPLOYED</span>`;
        setTimeout(enterMainApp, 900);
      }, 1300);
    }

    function enterMainApp() {
      document.getElementById('authContainer').style.display = 'none';
      const main = document.getElementById('mainApp');
      main.style.display = 'flex';
      log(`✅ NODE CONNECTED TO ROOTDONATE MESH`);
      loadSampleNodes();
    }

    // ==================== MAIN APP FUNCTIONS ====================
    let logEl;

    function log(msg) {
      if (!logEl) logEl = document.getElementById('log');
      const time = new Date().toLocaleTimeString('en-GB', { hour12: false });
      logEl.innerHTML += `<span style="color:#00ff8866">[${time}]</span> ${msg}<br>`;
      logEl.scrollTop = logEl.scrollHeight;
    }

    function loadSampleNodes() {
      // Placeholder - you can expand this
      log("📡 LOADING NEARBY NODES...");
    }

    function setTab(n) {
      document.querySelectorAll('.nav button').forEach((btn, i) => {
        btn.classList.toggle('active', i === n);
      });
      document.getElementById('searchPanel').classList.toggle('hidden', n !== 1);
      if (n === 1) document.getElementById('searchInput').focus();
    }

    function logout() {
      document.getElementById('mainApp').style.display = 'none';
      document.getElementById('authContainer').style.display = 'block';
      log("🔌 DISCONNECTED FROM MESH");
    }

    function showReportForm() {
      alert("🛠️ NEW NODE REPORT FORM (Demo)");
    }

    let searchTimeout;
    function debouncedSearch() {
      clearTimeout(searchTimeout);
      searchTimeout = setTimeout(() => {
        const query = document.getElementById('searchInput').value.trim();
        if (query.length > 2) {
          log(`🔍 SCANNING FOR: ${query}`);
          // Add your search logic here
        }
      }, 500);
    }

    // Keyboard support
    document.addEventListener('keydown', e => {
      if (e.key === "Enter") {
        const loginVisible = !document.getElementById('loginForm').classList.contains('hidden');
        if (loginVisible) performLogin();
        else performSignup();
      }
    });

    // Initialize
    window.onload = () => {
      logEl = document.getElementById('log');
    };
  </script>
</body>
</html>
