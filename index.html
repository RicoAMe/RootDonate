<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f172a">
  <title>RootDonate • The Ether Fund</title>
  <style>
    :root {
      --bg: #0b1220;
      --surface: #151e2e;
      --surface-2: #1e293b;
      --accent: #22c55e;
      --accent-hover: #16a34a;
      --eth: #627eea;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --user: #22c55e;
      --bot: #1e293b;
      --radius: 18px;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; height: 100%; background: var(--bg); color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 16px; line-height: 1.45;
    }
    body { display: flex; flex-direction: column; height: 100dvh; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
    header { background: var(--surface); padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; flex-shrink: 0; }
    header strong { font-size: 1.15rem; color: var(--accent); }
    header small { color: var(--muted); }
    .header-actions { display: flex; gap: 8px; }
    button { background: var(--accent); color: #000; border: none; padding: 8px 14px; border-radius: 12px; font-weight: 600; cursor: pointer; min-height: 40px; }
    #clearBtn, #newChatBtn { background: #475569; color: #fff; }
    button:active { opacity: 0.85; }
    #chat { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 10px; scroll-behavior: smooth; }
    .msg-wrap { max-width: 85%; display: flex; }
    .user { align-self: flex-end; }
    .bot { align-self: flex-start; }
    .msg { padding: 12px 16px; border-radius: var(--radius); white-space: pre-wrap; word-break: break-word; line-height: 1.4; }
    .user .msg { background: var(--user); color: #000; border-bottom-right-radius: 6px; }
    .bot .msg { background: var(--bot); border-bottom-left-radius: 6px; border: 1px solid #334155; }
    .input-bar { display: flex; gap: 8px; padding: 12px; background: var(--surface); border-top: 1px solid #334155; flex-shrink: 0; }
    #input { flex: 1; padding: 12px 16px; border: none; border-radius: 22px; background: var(--surface-2); color: var(--text); font: inherit; resize: none; min-height: 48px; max-height: 120px; outline: none; }
    #send { background: var(--accent); color: #000; border: none; width: 48px; height: 48px; border-radius: 50%; font-size: 1.2rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    #send:disabled, #input:disabled { opacity: 0.5; cursor: not-allowed; }
    .badge { display: inline-block; background: var(--eth); color: white; font-size: 0.7rem; padding: 2px 8px; border-radius: 999px; margin-left: 6px; }
    @media (min-width: 600px) { .msg-wrap { max-width: 70%; } }
  </style>
</head>
<body>
  <header>
    <div>
      <strong>RootDonate <span class="badge">ETH</span></strong><br>
      <small id="status">Not signed in · Shared memory ready</small>
    </div>
    <div class="header-actions">
      <button id="newChatBtn">New Chat</button>
      <button id="clearBtn">Clear Local</button>
      <button id="signBtn">Sign in</button>
    </div>
  </header>

  <div id="chat"></div>

  <div class="input-bar">
    <textarea id="input" placeholder="Ask about QETH-U.TO / The Ether Fund…" rows="1" disabled></textarea>
    <button id="send" disabled>↑</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, signInAnonymously, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, getDocs, limit, where, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBvcCBsPiMxS7G2evPjM7sANp-zSy_RkKM",
      authDomain: "rootdonate-61e61.firebaseapp.com",
      projectId: "rootdonate-61e61",
      storageBucket: "rootdonate-61e61.firebasestorage.app",
      messagingSenderId: "754240963907",
      appId: "1:754240963907:web:5417c2763d8f02108bdbf6"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null;
    let memory = [];
    let unsubShared = null;
    let isReplying = false;
    let awaitingTeach = false;
    let pendingInput = null;
    let chatId = null;

    const CHAT_KEY = "qeth_expert_chat";
    const BASE42 = "0123456789abcdefghijklmnopqrstuvwxyzABCDEF";

    // Fluent built-in knowledge base
    const builtInKnowledge = [
      {
        input: "what is qeth",
        response: "QETH-U.TO (and its CAD version QETH-UN.TO) is The Ether Fund from 3iQ. It’s Canada’s first regulated closed-end fund that gives you roughly 100% exposure to Ethereum. It’s listed on the Toronto Stock Exchange and is eligible for TFSAs and RRSPs."
      },
      {
        input: "what is the ether fund",
        response: "The Ether Fund is a closed-end fund managed by 3iQ that holds Ethereum. It tracks the price of ETH while also earning staking rewards. The management fee is 1.95% per year."
      },
      {
        input: "management fee",
        response: "The management fee is 1.95% annually."
      },
      {
        input: "staking yield",
        response: "As of mid-November 2026, the staking yield was around 2.52% (based on the trailing 30-day gross figure). The fund stakes part of its Ethereum holdings, and those rewards flow into the NAV over time."
      },
      {
        input: "is it eligible for tfsa",
        response: "Yes — The Ether Fund is fully eligible for TFSAs, RRSPs, RRIFs, RESPs, RDSPs, and DPSPs."
      },
      {
        input: "how much eth per unit",
        response: "As of November 19, 2026, each unit represented roughly 0.01624 ETH. The exact amount drifts slightly over time as staking rewards come in and the cash balance changes."
      },
      {
        input: "custody",
        response: "The Ethereum is held in segregated cold storage. Custody is handled by Tetra Trust Company with Coinbase Custody Trust Company as sub-custodian."
      },
      {
        input: "inception date",
        response: "The USD class (QETH.U) launched on December 10, 2020."
      },
      {
        input: "symbols",
        response: "You’ll see it listed as QETH.U for the USD version and QETH.UN for the CAD version, both on the TSX."
      },
      {
        input: "risk",
        response: "Because it tracks Ethereum, the fund is highly volatile. Past performance doesn’t guarantee future results, so it’s worth reading the prospectus carefully before investing."
      },
      {
        input: "price",
        response: "Prices move with Ethereum. Around November 19, 2026, QETH.U was trading near US$28.23 and QETH.UN near C$39.28, with NAV per unit a bit higher than the market prices."
      },
      {
        input: "who manages it",
        response: "It’s managed by 3iQ Corp., the Canadian firm that pioneered regulated crypto funds in the country."
      }
    ];

    function toBase42(num) {
      if (num === 0) return BASE42[0];
      let str = "";
      while (num > 0) {
        str = BASE42[num % 42] + str;
        num = Math.floor(num / 42);
      }
      return str;
    }

    function getChatIdFromUrl() {
      const params = new URLSearchParams(window.location.search);
      return params.get("chat");
    }

    function setChatIdInUrl(id) {
      const url = new URL(window.location);
      url.searchParams.set("chat", id);
      history.replaceState(null, "", url);
    }

    function generateChatId() {
      const rand = Math.floor(Math.random() * 1e15);
      const time = Date.now();
      return toBase42(rand).slice(0, 8) + toBase42(time).slice(-5);
    }

    function normalize(text) {
      return (text || "").trim().toLowerCase().replace(/[^\w\s]/g, "");
    }

    function findExactResponse(input) {
      const clean = normalize(input);
      for (const pair of memory) {
        if (normalize(pair.input) === clean) return pair.response;
      }
      for (const pair of builtInKnowledge) {
        if (normalize(pair.input) === clean || clean.includes(normalize(pair.input))) return pair.response;
      }
      return null;
    }

    function saveLocalChat() {
      const chat = document.getElementById("chat");
      const messages = Array.from(chat.querySelectorAll(".msg-wrap")).map(wrap => ({
        text: wrap.querySelector(".msg").textContent,
        isUser: wrap.classList.contains("user")
      }));
      localStorage.setItem(CHAT_KEY + "_" + (chatId || "local"), JSON.stringify(messages));
    }

    function loadLocalChat() {
      const key = CHAT_KEY + "_" + (chatId || "local");
      const saved = localStorage.getItem(key);
      if (!saved) return;
      try {
        const messages = JSON.parse(saved);
        document.getElementById("chat").innerHTML = "";
        messages.forEach(m => addMessage(m.text, m.isUser, false));
      } catch (e) { console.warn("Local load failed", e); }
    }

    function clearLocalView() {
      document.getElementById("chat").innerHTML = "";
      localStorage.removeItem(CHAT_KEY + "_" + (chatId || "local"));
      awaitingTeach = false;
      pendingInput = null;
    }

    async function saveMessageToCloud(text, isUser) {
      if (!currentUser || !chatId) return;
      try {
        await addDoc(collection(db, "chats", chatId, "messages"), {
          text, isUser, uid: currentUser.uid, createdAt: serverTimestamp()
        });
      } catch (e) { console.warn("Cloud save failed", e); }
    }

    async function loadChatFromCloud() {
      if (!chatId) return;
      const q = query(collection(db, "chats", chatId, "messages"), orderBy("createdAt", "asc"), limit(500));
      const snap = await getDocs(q);
      document.getElementById("chat").innerHTML = "";
      snap.forEach(doc => {
        const d = doc.data();
        addMessage(d.text, d.isUser, false);
      });
    }

    function listenSharedMemory() {
      if (unsubShared) unsubShared();
      const q = query(collection(db, "shared_memory"), orderBy("createdAt", "desc"), limit(1000));
      unsubShared = onSnapshot(q, snap => {
        memory = snap.docs.map(d => d.data()).reverse();
      });
    }

    async function saveSharedPair(input, response) {
      if (!currentUser) return;
      const trimmedInput = input.trim();
      const q = query(collection(db, "shared_memory"), where("input", "==", trimmedInput), limit(1));
      const snap = await getDocs(q);
      if (!snap.empty) return;
      await addDoc(collection(db, "shared_memory"), {
        input: trimmedInput,
        response: response.trim(),
        uid: currentUser.uid,
        createdAt: serverTimestamp()
      });
    }

    function addMessage(text, isUser, save = true) {
      const wrap = document.createElement("div");
      wrap.className = "msg-wrap " + (isUser ? "user" : "bot");
      const div = document.createElement("div");
      div.className = "msg";
      div.textContent = text;
      wrap.appendChild(div);
      const chat = document.getElementById("chat");
      chat.appendChild(wrap);
      chat.scrollTop = chat.scrollHeight;
      if (save) {
        saveLocalChat();
        saveMessageToCloud(text, isUser);
      }
    }

    async function reply(userText) {
      if (isReplying) return;
      isReplying = true;
      const response = findExactResponse(userText);
      if (response) {
        addMessage(response, false);
      } else {
        addMessage("I don’t have that exact answer stored yet.\nTeach me the best reply next and I’ll remember it for everyone.", false);
        awaitingTeach = true;
        pendingInput = userText;
      }
      isReplying = false;
    }

    function setupUI() {
      const input = document.getElementById("input");
      const sendBtn = document.getElementById("send");
      const signBtn = document.getElementById("signBtn");
      const clearBtn = document.getElementById("clearBtn");
      const newChatBtn = document.getElementById("newChatBtn");
      const status = document.getElementById("status");

      chatId = getChatIdFromUrl() || generateChatId();
      setChatIdInUrl(chatId);
      loadLocalChat();

      onAuthStateChanged(auth, async user => {
        if (user) {
          currentUser = user;
          status.textContent = "Signed in · Shared memory active";
          input.disabled = false;
          sendBtn.disabled = false;
          signBtn.textContent = "Sign out";
          listenSharedMemory();
          await loadChatFromCloud();
        } else {
          currentUser = null;
          status.textContent = "Not signed in";
          input.disabled = true;
          sendBtn.disabled = true;
          signBtn.textContent = "Sign in";
          if (unsubShared) unsubShared();
          memory = [];
        }
      });

      signBtn.onclick = () => currentUser ? signOut(auth) : signInAnonymously(auth);
      clearBtn.onclick = () => { if (confirm("Clear local view only?")) clearLocalView(); };
      newChatBtn.onclick = () => {
        if (confirm("Start a new chat?")) {
          chatId = generateChatId();
          setChatIdInUrl(chatId);
          clearLocalView();
        }
      };

      sendBtn.onclick = async () => {
        const text = input.value.trim();
        if (!text || !currentUser) return;
        input.value = "";
        input.style.height = "auto";

        if (awaitingTeach && pendingInput) {
          addMessage(text, true);
          await saveSharedPair(pendingInput, text);
          addMessage("Got it — I’ll remember that for everyone.", false);
          awaitingTeach = false;
          pendingInput = null;
          return;
        }

        addMessage(text, true);
        await reply(text);
      };

      input.onkeydown = e => {
        if (e.key === "Enter" && !e.shiftKey) {
          e.preventDefault();
          sendBtn.click();
        }
      };
      input.oninput = () => {
        input.style.height = "auto";
        input.style.height = Math.min(input.scrollHeight, 120) + "px";
      };

      setTimeout(() => {
        if (document.getElementById("chat").children.length === 0) {
          addMessage("Hello! I’m your QETH Expert.\nAsk me anything about The Ether Fund (QETH-U.TO / QETH-UN.TO) — fees, staking, eligibility, custody, and more.\nI already know the core facts and keep learning from you.", false, false);
        }
      }, 600);
    }

    setupUI();
  </script>
</body>
</html>
