<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#070b14">
  <title>RootDonate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
  <style>
    :root {
      --bg: #070b14;
      --bg-accent: radial-gradient(circle at 20% 80%, rgba(34, 197, 94, 0.08), transparent 40%),
                   radial-gradient(circle at 80% 20%, rgba(98, 126, 234, 0.12), transparent 40%);
      --surface: rgba(15, 23, 42, 0.65);
      --surface-2: rgba(30, 41, 59, 0.5);
      --accent: #22c55e;
      --text: #f8fafc;
      --muted: #94a3b8;
      --border: rgba(148, 163, 184, 0.12);
      --radius: 18px;
      --red: #ef4444;
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: "Inter", system-ui, -apple-system, sans-serif; }
    body { display: flex; flex-direction: column; height: 100dvh; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); background-image: var(--bg-accent); background-attachment: fixed; }
    header { background: var(--surface); backdrop-filter: blur(20px); padding: 14px 18px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); flex-shrink: 0; }
    header strong { font-size: 1.15rem; font-weight: 600; letter-spacing: -0.02em; }
    .badge { font-size: 0.65rem; background: linear-gradient(135deg, #627eea, #4f46e5); padding: 2px 8px; border-radius: 999px; margin-left: 8px; font-weight: 600; }
    .header-actions { display: flex; gap: 10px; align-items: center; }
    #userInfo { font-size: 0.85rem; color: var(--accent); font-weight: 500; }
    button { background: rgba(71, 85, 105, 0.4); color: #fff; border: 1px solid var(--border); padding: 8px 14px; border-radius: 12px; font-weight: 500; font-size: 0.9rem; cursor: pointer; min-height: 40px; transition: all 0.2s ease; }
    button:hover { background: rgba(71, 85, 105, 0.6); transform: translateY(-1px); }
    button:active { transform: translateY(0); }
    button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    #log { flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 10px; scroll-behavior: smooth; }
    .entry { padding: 14px 16px; border-radius: var(--radius); background: var(--surface); border: 1px solid var(--border); white-space: pre-wrap; font-size: 0.92rem; line-height: 1.5; backdrop-filter: blur(12px); box-shadow: var(--shadow); }
    .entry.scanner { border-left: 3px solid var(--accent); font-family: ui-monospace, Menlo, monospace; font-size: 0.88rem; }
    .entry.user { align-self: flex-end; background: linear-gradient(135deg, var(--accent), #16a34a); color: #020617; max-width: 82%; font-weight: 500; border: none; }
    .entry.ai { border-left: 3px solid #627eea; }
    .entry.priority { border-left: 3px solid var(--red); background: rgba(239, 68, 68, 0.08); }
    .controls, .input-bar, .status-bar { padding: 12px 16px; background: var(--surface); backdrop-filter: blur(20px); border-top: 1px solid var(--border); flex-shrink: 0; }
    .controls { display: flex; gap: 8px; flex-wrap: wrap; }
    .controls button { flex: 1; min-width: 88px; }
    #plate { flex: 2; padding: 10px 14px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); font-size: 0.9rem; }
    .input-bar { display: flex; gap: 10px; align-items: flex-end; }
    #input { flex: 1; padding: 12px 16px; border-radius: 24px; background: var(--surface-2); color: var(--text); border: 1px solid transparent; resize: none; min-height: 48px; max-height: 120px; font-family: inherit; font-size: 0.95rem; transition: border-color 0.2s; }
    #input:focus { outline: none; border-color: var(--accent); }
    #send { background: var(--accent); color: #020617; width: 48px; height: 48px; border-radius: 50%; font-size: 1.3rem; font-weight: 600; border: none; flex-shrink: 0; }
    .status-bar { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--muted); }
    .wanted { color: var(--red); font-weight: 600; }
    #app { display: none; flex-direction: column; height: 100%; }
    #authScreen { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 18px; padding: 24px; text-align: center; }
    #authScreen h2 { font-size: 1.8rem; margin: 0; font-weight: 700; letter-spacing: -0.03em; }
    #authScreen button { min-width: 240px; background: var(--surface-2); }
    #authError { color: var(--red); min-height: 1.2em; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div id="authScreen">
    <h2>RootDonate</h2>
    <p>Sign in to access the scanner</p>
    <div id="authError"></div>
    <button id="googleBtn">Continue with Google</button>
  </div>

  <div id="app">
    <header>
      <div>
        <strong>RootDonate<span class="badge">v3.3</span></strong>
        <small id="status" style="display:block; color:var(--muted); font-size:0.75rem; margin-top:2px;">Channel 1 • Leonida Metro • Cloud Sync</small>
      </div>
      <div class="header-actions">
        <span id="userInfo"></span>
        <button id="signOutBtn">Sign out</button>
      </div>
    </header>

    <div id="log"></div>

    <div class="status-bar">
      <span>Wanted: <span id="wanted" class="wanted">0</span></span>
      <span id="units">Units: 12</span>
      <span id="aiStatus">AI Ready</span>
    </div>

    <div class="controls">
      <button id="scanBtn">Scan</button>
      <button id="priorityBtn">Priority</button>
      <input type="text" id="plate" placeholder="Plate lookup…" maxlength="8" autocomplete="off" autocapitalize="characters">
      <button id="lookupBtn">Lookup</button>
      <button id="clearBtn" style="background:#ef4444;">Clear Log</button>
    </div>

    <div class="input-bar">
      <textarea id="input" placeholder="Ask the AI anything..." rows="1"></textarea>
      <button id="send">↑</button>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBvcCBsPiMxS7G2evPjM7sANp-zSy_RkKM",
      authDomain: "rootdonate-61e61.firebaseapp.com",
      databaseURL: "https://rootdonate-61e61-default-rtdb.firebaseio.com",
      projectId: "rootdonate-61e61",
      storageBucket: "rootdonate-61e61.firebasestorage.app",
      messagingSenderId: "754240963907",
      appId: "1:754240963907:web:5417c2763d8f02108bdbf6",
      measurementId: "G-0SC5R5ELT1"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.database();
    auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);

    const authScreen = document.getElementById("authScreen");
    const app = document.getElementById("app");
    const authError = document.getElementById("authError");
    const googleBtn = document.getElementById("googleBtn");
    const signOutBtn = document.getElementById("signOutBtn");
    const userInfo = document.getElementById("userInfo");
    const log = document.getElementById("log");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const statusEl = document.getElementById("status");
    const aiStatus = document.getElementById("aiStatus");
    const wantedEl = document.getElementById("wanted");
    const unitsEl = document.getElementById("units");
    const plateInput = document.getElementById("plate");
    const clearBtn = document.getElementById("clearBtn");

    let wanted = 0;
    let isAI = false;
    let currentUser = null;
    let logEntries = [];
    let chatHistory = [];

    function showError(msg) { authError.textContent = msg || ""; }

    googleBtn.onclick = async () => {
      showError("");
      const provider = new firebase.auth.GoogleAuthProvider();
      try { await auth.signInWithPopup(provider); }
      catch (err) { showError(err.message || "Google sign-in failed"); }
    };

    signOutBtn.onclick = () => auth.signOut();

    async function loadFromCloud(uid) {
      try {
        const snap = await db.ref(`users/${uid}/data`).once("value");
        const data = snap.val();
        if (data) {
          wanted = data.wanted || 0;
          wantedEl.textContent = wanted;
          if (Array.isArray(data.log)) {
            logEntries = data.log;
            log.innerHTML = "";
            data.log.forEach(e => addEntry(e.text, e.type, false));
          }
          if (Array.isArray(data.chatHistory)) chatHistory = data.chatHistory.slice(-8);
        }
      } catch (e) { console.warn("Cloud load failed", e); }
    }

    async function saveToCloud() {
      if (!currentUser) return;
      try {
        await db.ref(`users/${currentUser.uid}/data`).set({
          wanted,
          log: logEntries.slice(-100),
          chatHistory: chatHistory.slice(-10),
          updated: Date.now()
        });
      } catch (e) { console.warn("Cloud save failed", e); }
    }

    auth.onAuthStateChanged(async user => {
      if (user) {
        currentUser = user;
        authScreen.style.display = "none";
        app.style.display = "flex";
        userInfo.textContent = `👤 ${user.displayName || user.email || "User"}`;
        await loadFromCloud(user.uid);
        if (log.children.length === 0) {
          addEntry("RootDonate Scanner online. Cloud storage active.", "scanner");
          addEntry("Signed in. AI ready — ask me anything about Leonida or the streets.", "ai");
        }
      } else {
        currentUser = null;
        authScreen.style.display = "flex";
        app.style.display = "none";
        userInfo.textContent = "";
        log.innerHTML = "";
        logEntries = [];
        chatHistory = [];
        wanted = 0;
        wantedEl.textContent = "0";
        showError("");
      }
    });

    const chatter = [
      { type: "scanner", text: "Dispatch: Unit 4-Adam-12, respond to disturbance at Ocean Drive, Vice City Beach." },
      { type: "scanner", text: "Air Support: Suspicious black Blista Compact heading north on Port Gellhorn Highway." },
      { type: "priority", text: "Code 3: Shots fired near Ambrosia. Multiple suspects fleeing. All units respond." },
      { type: "scanner", text: "Traffic: Speed enforcement active on the bridge into Leonida City." },
      { type: "scanner", text: "BOLO: Stolen yellow Sanchez last seen near the docks. Occupant armed." },
      { type: "priority", text: "Officer down! 10-99 at Grass Rivers. Backup needed immediately!" },
      { type: "scanner", text: "Unit 7-Boy-3: Suspect in custody, requesting transport." },
      { type: "scanner", text: "High-speed pursuit on the freeway. Black Dominator, plates unknown." },
      { type: "priority", text: "Armed robbery in progress at the 24/7 on Main Street. Units en route." }
    ];

    const plates = {
      "VC1234": "Stolen — Black Dominator, linked to recent heist",
      "LEON01": "Registered to local resident — no flags",
      "GTA666": "Wanted — multiple felonies, approach with caution",
      "VCPD1": "Police vehicle — do not stop",
      "AMBRO": "Rental — last seen near Ambrosia resort"
    };

    function addEntry(text, type = "scanner", shouldSave = true) {
      const div = document.createElement("div");
      div.className = `entry ${type}`;
      div.textContent = text;
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
      logEntries.push({ text, type, ts: Date.now() });
      if (logEntries.length > 120) logEntries.shift();
      if (shouldSave) saveToCloud();
    }

    function randomChatter() {
      if (!currentUser) return;
      const entry = chatter[Math.floor(Math.random() * chatter.length)];
      addEntry(entry.text, entry.type === "priority" ? "priority" : "scanner");
      if (entry.type === "priority") {
        wanted = Math.min(5, wanted + 1);
        wantedEl.textContent = wanted;
      }
    }

    async function askAI(question) {
      if (isAI || !currentUser) return;
      isAI = true;
      sendBtn.disabled = true;
      aiStatus.textContent = "AI thinking…";
      addEntry(question, "user");

      const historyText = chatHistory.slice(-6).map(m => `${m.role}: ${m.content}`).join("\n");
      const system = `You are a sharp, slightly cynical VCPD dispatcher AI integrated into the RootDonate scanner.
You know GTA VI / Leonida / Vice City lore, radio codes, vehicle models, and street life.
Be concise, useful, and stay in character when it fits. Never give real-world illegal advice.
Current time: ${new Date().toLocaleString()}`;

      const fullPrompt = `${system}\n\nRecent context:\n${historyText}\n\nUser: ${question}`;

      // Free Pollinations classic text endpoint (no key required)
      const url = `https://text.pollinations.ai/${encodeURIComponent(fullPrompt)}?temperature=0.75&seed=${Date.now()}`;

      let attempt = 0;
      const maxAttempts = 3;
      let success = false;

      while (attempt < maxAttempts && !success) {
        attempt++;
        try {
          const res = await fetch(url);
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          let text = (await res.text()).trim();
          if (!text || text.length < 4) throw new Error("Empty or short response");

          text = text.replace(/^Assistant:\s*/i, "").replace(/^AI:\s*/i, "").trim();

          addEntry(text, "ai");
          chatHistory.push({ role: "user", content: question }, { role: "assistant", content: text });
          if (chatHistory.length > 12) chatHistory = chatHistory.slice(-12);
          aiStatus.textContent = "AI Ready";
          success = true;
        } catch (e) {
          console.warn(`AI attempt ${attempt} failed:`, e);
          if (attempt === maxAttempts) {
            addEntry("AI radio is down right now. Try again in a minute.", "ai");
            aiStatus.textContent = "AI Offline";
          } else {
            aiStatus.textContent = `AI retry ${attempt}…`;
            await new Promise(r => setTimeout(r, 1200 * attempt));
          }
        }
      }

      isAI = false;
      sendBtn.disabled = false;
      input.focus();
      saveToCloud();
    }

    function send() {
      const text = input.value.trim();
      if (!text || isAI || !currentUser) return;
      input.value = "";
      input.style.height = "auto";
      askAI(text);
    }

    sendBtn.onclick = send;
    input.onkeydown = e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); } };
    input.oninput = () => { input.style.height = "auto"; input.style.height = Math.min(input.scrollHeight, 120) + "px"; };

    document.getElementById("scanBtn").onclick = () => {
      if (!currentUser) return;
      statusEl.textContent = "Scanning…";
      setTimeout(() => {
        statusEl.textContent = "Channel 1 • Leonida Metro • Cloud Sync";
        randomChatter();
      }, 600);
    };

    document.getElementById("priorityBtn").onclick = () => {
      if (!currentUser) return;
      const pri = chatter.filter(c => c.type === "priority");
      const entry = pri[Math.floor(Math.random() * pri.length)];
      addEntry(entry.text, "priority");
      wanted = Math.min(5, wanted + 1);
      wantedEl.textContent = wanted;
    };

    document.getElementById("lookupBtn").onclick = () => {
      if (!currentUser) return;
      const p = plateInput.value.trim().toUpperCase();
      if (!p) return;
      const result = plates[p] || "No records found";
      addEntry(`Plate ${p}: ${result}`, "scanner");
      plateInput.value = "";
    };

    clearBtn.onclick = () => {
      if (!currentUser || !confirm("Clear the log from this device only? (Cloud data will be kept)")) return;
      log.innerHTML = "";
      logEntries = [];
      chatHistory = [];
      wanted = 0;
      wantedEl.textContent = "0";
      addEntry("Log cleared locally. Cloud data remains intact.", "ai", false);
    };

    setInterval(() => {
      if (currentUser && Math.random() > 0.72) randomChatter();
      if (currentUser) unitsEl.textContent = `Units: ${8 + Math.floor(Math.random() * 10)}`;
    }, 5000);
  </script>
</body>
</html>
