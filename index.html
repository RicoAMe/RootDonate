<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RootDonate • Lost & Found Nodes</title>
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #0a0a0a;
      color: #00ff00;
      margin: 0;
      padding: 20px;
    }
    .container {
      max-width: 900px;
      margin: auto;
      background: #111111;
      padding: 30px;
      border-radius: 12px;
      border: 2px solid #00ff00;
      box-shadow: 0 0 20px rgba(0, 255, 0, 0.2);
    }
    h1 { text-align: center; font-size: 2.4em; margin-bottom: 5px; }
    .subtitle { text-align: center; color: #0f0; margin-bottom: 30px; }
    input, select, textarea {
      width: 100%;
      padding: 14px;
      margin: 10px 0;
      background: #000;
      border: 1px solid #00ff00;
      border-radius: 8px;
      color: #00ff00;
      font-size: 16px;
    }
    button {
      background: #00ff00;
      color: black;
      padding: 14px 28px;
      font-size: 17px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      margin: 10px 5px;
    }
    .node {
      background: #1a1a1a;
      padding: 20px;
      margin: 15px 0;
      border-radius: 10px;
      border: 1px solid #00ff00;
    }
    .hidden { display: none; }
    .log {
      background: #000;
      padding: 15px;
      height: 180px;
      overflow-y: auto;
      font-family: monospace;
      border: 1px solid #00ff00;
      border-radius: 8px;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔍 LOST & FOUND NODES</h1>
    <p class="subtitle">rootdonate.co.uk</p>

    <!-- AUTH SECTION -->
    <div id="authSection">
      <h2 style="text-align:center;">Access Required</h2>
      <div id="loginForm">
        <input type="text" id="username" placeholder="Username or Node ID (@CWOA)">
        <input type="password" id="password" placeholder="Password">
        <button onclick="login()">🔓 LOGIN</button>
        <div style="text-align:center; color:#00ff88; cursor:pointer;" onclick="toggleAuth()">Create New Node → Sign Up</div>
      </div>

      <div id="signupForm" class="hidden">
        <input type="text" id="newUser" placeholder="New Node Name (@YourHandle)">
        <input type="email" id="email" placeholder="Email">
        <input type="password" id="newPass" placeholder="Password">
        <button onclick="signup()">🚀 CREATE NODE</button>
        <div style="text-align:center; color:#00ff88; cursor:pointer;" onclick="toggleAuth()">← Back to Login</div>
      </div>
    </div>

    <!-- MAIN APP (after login) -->
    <div id="mainApp" class="hidden">
      <button onclick="showReportForm()">📋 Report New Lost / Found Item</button>
      <button onclick="logout()">Logout</button>

      <h2 style="margin-top:30px;">Your Active Nodes</h2>
      <div id="nodesList"></div>

      <h2 style="text-align:center; margin-top:40px;">Live Activity Log</h2>
      <div id="log" class="log"></div>
    </div>
  </div>

  <!-- Report Modal -->
  <div id="reportModal" class="hidden" style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); display:flex; align-items:center; justify-content:center;">
    <div style="background:#111; padding:30px; border:2px solid #00ff00; border-radius:12px; width:90%; max-width:600px;">
      <h2>Report New Node</h2>
      <select id="itemType"><option value="lost">🚨 Lost</option><option value="found">✅ Found</option></select>
      <input type="text" id="itemName" placeholder="Item Name">
      <input type="text" id="location" placeholder="Location">
      <textarea id="desc" rows="3" placeholder="Description"></textarea>
      <button onclick="submitNewNode()">Submit Node</button>
      <button onclick="closeModal()">Cancel</button>
    </div>
  </div>

  <script>
    let currentUser = "";

    function toggleAuth() {
      document.getElementById('loginForm').classList.toggle('hidden');
      document.getElementById('signupForm').classList.toggle('hidden');
    }

    function login() {
      currentUser = document.getElementById('username').value || "@UserNode";
      document.getElementById('authSection').classList.add('hidden');
      document.getElementById('mainApp').classList.remove('hidden');
      log("✅ Logged in as " + currentUser);
      addSampleNodes();
    }

    function signup() {
      currentUser = document.getElementById('newUser').value || "@NewNode";
      document.getElementById('authSection').classList.add('hidden');
      document.getElementById('mainApp').classList.remove('hidden');
      log("🚀 New node created: " + currentUser);
      addSampleNodes();
    }

    function log(msg) {
      const time = new Date().toLocaleTimeString();
      document.getElementById("log").innerHTML += `[${time}] ${msg}<br>`;
      document.getElementById("log").scrollTop = 9999;
    }

    function showReportForm() {
      document.getElementById('reportModal').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('reportModal').classList.add('hidden');
    }

    function submitNewNode() {
      const name = document.getElementById('itemName').value || "Unnamed Item";
      const type = document.getElementById('itemType').value;
      
      const nodeHTML = `
        <div class="node">
          <div>
            <strong>Node: ${name}</strong><br>
            <span style="color:${type==='lost'?'#ff6666':'lime'}">${type.toUpperCase()}</span> • ${document.getElementById('location').value}
          </div>
          <button onclick="shareThisNode('${name}')">🔗 Share</button>
        </div>`;
      
      document.getElementById('nodesList').innerHTML += nodeHTML;
      closeModal();
      log(`📌 New ${type} node added: ${name}`);
      alert(`✅ Node created!\nShare link ready for ${name}`);
    }

    function shareThisNode(name) {
      const shareURL = `https://rootdonate.co.uk/lostfound/node-${name.toLowerCase().replace(/ /g,'')}.html`;
      navigator.clipboard.writeText(shareURL);
      alert(`✅ Share Link Copied!\n${shareURL}\n\n(Open this link to view the individual node page)`);
      log(`🔗 Share link generated for ${name}`);
    }

    function addSampleNodes() {
      document.getElementById('nodesList').innerHTML = `
        <div class="node">
          <div><strong>Node 1: @LostWallet</strong><br><span style="color:#ff6666">LOST</span> • Manchester</div>
          <button onclick="shareThisNode('@LostWallet')">🔗 Share</button>
        </div>
        <div class="node">
          <div><strong>Node 3: @FoundKeys</strong><br><span style="color:lime">FOUND</span> • London Euston</div>
          <button onclick="shareThisNode('@FoundKeys')">🔗 Share</button>
        </div>`;
    }

    function logout() {
      location.reload();
    }
  </script>
</body>
</html>
