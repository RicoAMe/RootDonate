<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a1f2f">
  <title>ROOT DONATE • Global Discovery</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --primary: #00b894;
      --accent: #00d2a0;
      --dark: #0a1f2f;
      --card: #13293d;
      --text: #e0f2f1;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--dark);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
      line-height: 1.5;
    }

    .header {
      padding: 16px 20px;
      background: rgba(10,31,47,0.98);
      border-bottom: 1px solid #1e3a5f;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .header h1 {
      font-size: 1.65rem;
      font-weight: 600;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .user-info { display: flex; align-items: center; gap: 10px; cursor: pointer; }

    .search-container { position: relative; margin: 16px 20px; }

    .search-bar {
      width: 100%;
      padding: 16px 20px 16px 52px;
      background: #1e3a5f;
      border: 1px solid #00b894;
      border-radius: 50px;
      color: white;
      font-size: 1.05rem;
      outline: none;
    }

    .search-bar:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(0,210,160,0.2);
    }

    .search-bar::placeholder { color: #88a5b8; }

    .suggestions {
      position: absolute;
      top: 100%;
      left: 0;
      right: 0;
      background: #13293d;
      border: 1px solid #00b894;
      border-radius: 16px;
      margin-top: 8px;
      max-height: 420px;
      overflow-y: auto;
      z-index: 200;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      display: none;
    }

    .suggestion-item {
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
      border-bottom: 1px solid #1e3a5f;
    }

    .suggestion-item:hover { background: #1e3a5f; }

    .nodes-grid {
      padding: 0 20px 20px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 16px;
    }

    .place-card {
      background: var(--card);
      border: 1px solid #1e3a5f;
      border-radius: 16px;
      padding: 20px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .place-card:hover {
      transform: translateY(-6px);
      border-color: var(--primary);
      box-shadow: 0 10px 25px rgba(0,184,148,0.2);
    }

    .place-icon { font-size: 2.4rem; margin-bottom: 12px; }

    .impact-bar {
      height: 6px;
      background: #1e3a5f;
      border-radius: 10px;
      margin-top: 8px;
      overflow: hidden;
    }

    .impact-fill {
      height: 100%;
      background: linear-gradient(90deg, #00b894, #00d2a0);
      transition: width 0.4s ease;
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(10,31,47,0.97);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .modal-content {
      background: #13293d;
      border-radius: 20px;
      width: 100%;
      max-width: 560px;
      max-height: 92vh;
      overflow-y: auto;
      padding: 24px;
      border: 1px solid #00b894;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid #1e3a5f;
    }

    .history-item {
      background: #1e3a5f;
      padding: 12px 16px;
      border-radius: 10px;
      margin-bottom: 10px;
      font-size: 0.95rem;
    }

    button.primary {
      background: var(--primary);
      color: #000;
      border: none;
      padding: 14px 24px;
      border-radius: 50px;
      font-weight: 600;
      width: 100%;
      margin: 12px 0;
      font-size: 1.1rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    button.primary:hover { background: var(--accent); transform: translateY(-2px); }

    .apple-pay-btn {
      background: #000;
      color: white;
      border: 1px solid white;
      padding: 14px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 1.1rem;
      width: 100%;
      margin-top: 8px;
      cursor: pointer;
    }

    .log {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 140px;
      background: #0a1f2f;
      padding: 12px 20px;
      font-size: 0.9rem;
      overflow-y: auto;
      border-top: 1px solid #1e3a5f;
      z-index: 50;
    }

    .stats {
      display: flex;
      justify-content: space-around;
      background: #1e3a5f;
      padding: 14px 12px;
      border-radius: 12px;
      margin: 15px 20px;
      text-align: center;
    }

    .auth-btn {
      padding: 8px 20px;
      background: #1e3a5f;
      border: 1px solid #00b894;
      color: white;
      border-radius: 50px;
      font-size: 0.95rem;
      cursor: pointer;
    }

    .close-btn {
      background: none;
      border: none;
      font-size: 1.6rem;
      color: #88a5b8;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1><i class="fas fa-globe"></i> ROOT DONATE</h1>
    <div style="display:flex; align-items:center; gap:12px;">
      <button onclick="showAuthModal()" id="authButton" class="auth-btn">Sign In</button>
      <div class="user-info" onclick="showProfile()" id="userInfo" style="display:none;">
        <div style="text-align:right;">
          <div id="usernameDisplay" style="font-weight:600;"></div>
          <div id="balanceDisplay" style="font-size:0.9rem;color:#00d2a0;"></div>
        </div>
        <i class="fas fa-user-circle" style="font-size:2rem;color:#00b894;"></i>
      </div>
    </div>
  </div>

  <div class="search-container">
    <input type="text" id="searchInput" class="search-bar" placeholder="Search places with Apple Maps..." onkeyup="handleSearch(event)" autocomplete="off">
    <div id="suggestions" class="suggestions"></div>
  </div>

  <div style="padding:0 20px 10px;">
    <div class="stats">
      <div><strong id="totalDonated">0</strong><br><small>TOTAL ROOT</small></div>
      <div><strong id="placesCount">0</strong><br><small>PLACES</small></div>
      <div><strong id="playerLevel">1</strong><br><small>LEVEL</small></div>
    </div>
  </div>

  <div class="nodes-grid" id="grid"></div>
  <div class="log" id="log"></div>

  <!-- Modals -->
  <div id="placeModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modalPlaceName"></h2>
        <button class="close-btn" onclick="closeModals()">✕</button>
      </div>
      <p id="modalPlaceLoc" style="color:#88a5b8; margin-bottom:16px;"></p>
      <div id="modalPlaceIcon" style="font-size:4.5rem; text-align:center; margin:20px 0;"></div>

      <div style="background:#1e3a5f; padding:16px; border-radius:12px; margin:20px 0;">
        <strong>Community Impact</strong>
        <div class="impact-bar"><div id="modalImpactFill" class="impact-fill" style="width:0%"></div></div>
        <div id="modalImpactText" style="text-align:right; margin-top:6px;"></div>
      </div>

      <button onclick="showDonateModal()" class="primary">Donate ROOT</button>
      <button onclick="copyShareLink()" style="background:transparent; border:1px solid #00b894; color:white; width:100%;">Share Location</button>
    </div>
  </div>

  <div id="donateModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Donate to <span id="donatePlaceName"></span></h2>
        <button class="close-btn" onclick="closeModals()">✕</button>
      </div>
      <div style="text-align:center; margin:24px 0;">
        <input type="number" id="donateAmount" value="100" style="width:140px; font-size:2.2rem; background:#1e3a5f; border:none; border-radius:12px; padding:12px; color:white; text-align:center;">
        <span style="font-size:1.3rem; color:var(--primary);">ROOT</span>
      </div>
      <button onclick="confirmDonation()" class="primary">Confirm Donation</button>
      <button onclick="applePayDonate()" class="apple-pay-btn">
        <i class="fab fa-apple-pay" style="font-size:1.8rem;"></i> Pay with Apple Pay
      </button>
    </div>
  </div>

  <div id="profileModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Your Profile</h2>
        <button class="close-btn" onclick="closeModals()">✕</button>
      </div>
      
      <div style="text-align:center; margin:20px 0;">
        <i class="fas fa-user-circle" style="font-size:5rem; color:#00b894;"></i>
        <h3 id="profileUsername"></h3>
        <p id="profileEmail" style="color:#88a5b8;"></p>
      </div>

      <div class="stats" style="margin:20px 0;">
        <div><strong id="profileBalance">0</strong><br><small>BALANCE</small></div>
        <div><strong id="profileTotalDonated">0</strong><br><small>DONATED</small></div>
      </div>

      <button onclick="topUpApplePay()" class="primary">Top Up with Apple Pay</button>

      <h3 style="margin:25px 0 12px;">Donation History</h3>
      <div id="donationHistory" style="max-height:320px; overflow-y:auto;"></div>

      <button onclick="logout()" style="background:#e74c3c; color:white; margin-top:20px;">Sign Out</button>
    </div>
  </div>

  <div id="authModal" class="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="authTitle">Create Account</h2>
        <button class="close-btn" onclick="closeAuthModal()">✕</button>
      </div>
      <input type="email" id="emailInput" placeholder="Email" style="width:100%; padding:14px; margin:10px 0; background:#1e3a5f; border:1px solid #00b894; border-radius:12px; color:white;">
      <input type="password" id="passwordInput" placeholder="Password" style="width:100%; padding:14px; margin:10px 0; background:#1e3a5f; border:1px solid #00b894; border-radius:12px; color:white;">
      <button onclick="handleAuth()" id="authSubmitBtn" class="primary">Sign Up</button>
      <button onclick="toggleAuthMode()" id="toggleBtn" style="background:transparent; border:none; color:var(--accent); width:100%; margin-top:10px;">Already have an account? Sign In</button>
    </div>
  </div>

  <script>
    // ==================== FIREBASE CONFIG ====================
    const firebaseConfig = {
      apiKey: "AIzaSyBvcCBsPiMxS7G2evPjM7sANp-zSy_RkKM",
      authDomain: "rootdonate-61e61.firebaseapp.com",
      projectId: "rootdonate-61e61",
      storageBucket: "rootdonate-61e61.firebasestorage.app",
      messagingSenderId: "754240963907",
      appId: "1:754240963907:web:5417c2763d8f02108bdbf6"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let currentUser = null;
    let places = [];
    let currentPlace = null;
    let isLoginMode = false;

    const logEl = document.getElementById('log');

    function log(msg) {
      const time = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
      logEl.innerHTML += `<span style="opacity:0.6">[${time}]</span> ${msg}<br>`;
      logEl.scrollTop = logEl.scrollHeight;
    }

    // ==================== AUTH ====================
    function showAuthModal() { document.getElementById('authModal').style.display = 'flex'; isLoginMode = false; updateAuthUI(); }
    function closeAuthModal() { document.getElementById('authModal').style.display = 'none'; }
    function updateAuthUI() {
      document.getElementById('authTitle').textContent = isLoginMode ? "Sign In" : "Create Account";
      document.getElementById('authSubmitBtn').textContent = isLoginMode ? "Sign In" : "Sign Up";
      document.getElementById('toggleBtn').textContent = isLoginMode ? "Need an account? Sign Up" : "Already have an account? Sign In";
    }
    function toggleAuthMode() { isLoginMode = !isLoginMode; updateAuthUI(); }

    async function handleAuth() {
      const email = document.getElementById('emailInput').value.trim();
      const password = document.getElementById('passwordInput').value;
      if (!email || !password) return alert("Please fill all fields");

      try {
        const userCredential = isLoginMode 
          ? await auth.signInWithEmailAndPassword(email, password)
          : await auth.createUserWithEmailAndPassword(email, password);
        
        currentUser = userCredential.user;
        await createUserProfileIfNotExists();
        closeAuthModal();
        initUser();
      } catch (e) { alert("Error: " + e.message); }
    }

    async function createUserProfileIfNotExists() {
      const userRef = db.collection("users").doc(currentUser.uid);
      if (!(await userRef.get()).exists) {
        await userRef.set({
          handle: "@" + currentUser.email.split('@')[0],
          balance: 12450,
          totalDonated: 0,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
      }
    }

    function logout() { auth.signOut().then(() => location.reload()); }

    // ==================== INIT ====================
    async function initUser() {
      document.getElementById('authButton').style.display = 'none';
      document.getElementById('userInfo').style.display = 'flex';
      document.getElementById('usernameDisplay').textContent = currentUser.email.split('@')[0];

      const userDoc = await db.collection("users").doc(currentUser.uid).get();
      const data = userDoc.data() || {};
      document.getElementById('balanceDisplay').textContent = `${data.balance || 0} ROOT`;

      loadPlaces();
      log("✅ Signed in successfully • Welcome back!");
    }

    // ==================== STARTER PLACES ====================
    const sevenWonders = [
      { name: "Great Pyramid of Giza", loc: "Giza, Egypt", icon: "🪦" },
      { name: "Hanging Gardens of Babylon", loc: "Al Hillah, Iraq", icon: "🌳" },
      { name: "Statue of Zeus at Olympia", loc: "Olympia, Greece", icon: "🗿" },
      { name: "Temple of Artemis at Ephesus", loc: "Selçuk, Turkey", icon: "🏛️" },
      { name: "Mausoleum at Halicarnassus", loc: "Bodrum, Turkey", icon: "🏛️" },
      { name: "Colossus of Rhodes", loc: "Rhodes, Greece", icon: "🗿" },
      { name: "Lighthouse of Alexandria", loc: "Alexandria, Egypt", icon: "🏮" }
    ];

    async function loadPlaces() {
      const snap = await db.collection("places").get();
      places = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));

      if (places.length === 0) {
        for (const w of sevenWonders) {
          const newPlace = {
            name: w.name,
            loc: w.loc,
            icon: w.icon,
            donations: [],
            impact: Math.floor(Math.random() * 70) + 25,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          };
          const ref = await db.collection("places").add(newPlace);
          newPlace.id = ref.id;
          places.push(newPlace);
        }
        log("🌟 Seven Wonders added as starter places");
      }

      renderPlaces();
      updateStats();
    }

    function savePlace(place) {
      if (place.id) db.collection("places").doc(place.id).set(place, { merge: true });
    }

    function renderPlaces(filtered = places) {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      filtered.forEach(place => {
        const card = document.createElement('div');
        card.className = 'place-card';
        card.innerHTML = `
          <div class="place-icon">${place.icon}</div>
          <h3>${place.name}</h3>
          <p style="color:#88a5b8;">${place.loc}</p>
          <div class="impact-bar"><div class="impact-fill" style="width:${place.impact||0}%"></div></div>
          <div style="text-align:right; margin-top:6px; font-size:0.9rem;">${place.impact||0}% impact</div>
        `;
        card.onclick = () => showPlaceDetail(place);
        grid.appendChild(card);
      });
    }

    function updateStats() {
      const total = places.reduce((sum, p) => sum + (p.impact || 0), 0);
      document.getElementById('totalDonated').textContent = Math.floor(total * 120);
      document.getElementById('placesCount').textContent = places.length;
    }

    // ==================== SEARCH (Apple Maps Style) ====================
    function handleSearch(e) {
      const query = e.target.value.toLowerCase().trim();
      const suggestions = document.getElementById('suggestions');

      if (query.length < 2) {
        suggestions.style.display = 'none';
        return;
      }

      const filtered = places.filter(p => 
        p.name.toLowerCase().includes(query) || p.loc.toLowerCase().includes(query)
      );

      suggestions.innerHTML = '';
      filtered.forEach(place => {
        const div = document.createElement('div');
        div.className = 'suggestion-item';
        div.innerHTML = `<span style="font-size:1.8rem;">${place.icon}</span>
                         <div><b>${place.name}</b><br><small>${place.loc}</small></div>`;
        div.onclick = () => {
          showPlaceDetail(place);
          suggestions.style.display = 'none';
          document.getElementById('searchInput').value = '';
        };
        suggestions.appendChild(div);
      });

      suggestions.style.display = filtered.length ? 'block' : 'none';
    }

    // ==================== MODALS ====================
    function showPlaceDetail(place) {
      currentPlace = place;
      document.getElementById('modalPlaceName').textContent = place.name;
      document.getElementById('modalPlaceLoc').textContent = place.loc;
      document.getElementById('modalPlaceIcon').textContent = place.icon;
      document.getElementById('modalImpactFill').style.width = `${place.impact || 0}%`;
      document.getElementById('modalImpactText').textContent = `${place.impact || 0}% community impact`;
      document.getElementById('placeModal').style.display = 'flex';
    }

    function showDonateModal() {
      if (!currentPlace) return;
      document.getElementById('donatePlaceName').textContent = currentPlace.name;
      document.getElementById('donateModal').style.display = 'flex';
      document.getElementById('placeModal').style.display = 'none';
    }

    async function confirmDonation() {
      const amount = parseInt(document.getElementById('donateAmount').value) || 100;
      if (!currentUser || !currentPlace) return alert("Error: Please sign in");

      const userRef = db.collection("users").doc(currentUser.uid);
      const userDoc = await userRef.get();
      let balance = userDoc.data().balance || 0;

      if (balance < amount) return alert("Insufficient ROOT balance!");

      await userRef.update({
        balance: balance - amount,
        totalDonated: firebase.firestore.FieldValue.increment(amount)
      });

      currentPlace.impact = Math.min(100, (currentPlace.impact || 0) + Math.floor(amount / 40));
      currentPlace.donations = currentPlace.donations || [];
      currentPlace.donations.push({
        user: currentUser.email,
        amount: amount,
        timestamp: Date.now()
      });

      await savePlace(currentPlace);

      closeModals();
      log(`💰 Donated ${amount} ROOT to ${currentPlace.name}`);
      loadPlaces();
      initUser();
    }

    function applePayDonate() {
      alert("✅ Apple Pay • Donation processed successfully!");
      confirmDonation();
    }

    function showProfile() {
      if (!currentUser) return;
      document.getElementById('profileModal').style.display = 'flex';

      db.collection("users").doc(currentUser.uid).get().then(doc => {
        const data = doc.data() || {};
        document.getElementById('profileUsername').textContent = data.handle || currentUser.email.split('@')[0];
        document.getElementById('profileEmail').textContent = currentUser.email;
        document.getElementById('profileBalance').textContent = data.balance || 0;
        document.getElementById('profileTotalDonated').textContent = data.totalDonated || 0;
      });

      // Show donation history
      const historyDiv = document.getElementById('donationHistory');
      historyDiv.innerHTML = '<p style="color:#88a5b8;">Loading your donations...</p>';

      // Simple demo history
      setTimeout(() => {
        historyDiv.innerHTML = `<div class="history-item">No donations yet.<br>Start donating to places!</div>`;
      }, 600);
    }

    function topUpApplePay() {
      const amount = prompt("Enter amount to top up with Apple Pay:", "2500");
      if (!amount || isNaN(amount)) return;

      db.collection("users").doc(currentUser.uid).update({
        balance: firebase.firestore.FieldValue.increment(parseInt(amount))
      }).then(() => {
        alert(`✅ Apple Pay • ${amount} ROOT added to your balance!`);
        initUser();
        showProfile();
      });
    }

    function copyShareLink() {
      if (!currentPlace) return;
      const data = { p: currentPlace.id };
      const encoded = btoa(JSON.stringify(data));
      const url = `${window.location.origin}?share=${encoded}`;
      navigator.clipboard.writeText(url).then(() => alert("✅ Base64 share link copied!"));
    }

    function closeModals() {
      document.querySelectorAll('.modal').forEach(m => m.style.display = 'none');
    }

    // ==================== INIT ====================
    auth.onAuthStateChanged(user => {
      if (user) {
        currentUser = user;
        initUser();
      } else {
        document.getElementById('authButton').style.display = 'block';
        document.getElementById('userInfo').style.display = 'none';
      }
    });

    window.onload = () => {
      log("🌍 ROOT DONATE ready • Search & Donate");
    };
  </script>
</body>
</html>
