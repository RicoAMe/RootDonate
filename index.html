<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ROOT DONATE • Quick Apple Pay Profile</title>
    
    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #00ff9d;
            --accent: #ff00aa;
            --bg: #0a0a0f;
            --card: #111118;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; }
        
        body {
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg);
            color: #e0e0e0;
            line-height: 1.6;
            padding: 12px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 520px;
            margin: 0 auto;
            background: var(--card);
            border-radius: 28px;
            box-shadow: 0 25px 80px rgba(0, 255, 157, 0.15);
            overflow: hidden;
            border: 1px solid #222;
        }
        
        .header {
            background: linear-gradient(135deg, #00ff9d, #ff00aa);
            color: #000;
            padding: 48px 20px 32px;
            text-align: center;
        }
        .header h1 {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 2.9rem;
            font-weight: 700;
            letter-spacing: -2px;
        }
        
        .content { padding: 24px; }
        
        .avatar {
            width: 96px; height: 96px;
            background: linear-gradient(135deg, #00ff9d, #ff00aa);
            border-radius: 50%;
            margin: 0 auto 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            color: #000;
            font-weight: 700;
            border: 6px solid #1a1a22;
        }
        
        .rpg-card {
            background: #1a1a22;
            border-radius: 20px;
            padding: 24px;
            margin-bottom: 20px;
            border: 1px solid #2a2a32;
        }
        
        .balance { font-size: 2.4rem; font-weight: 800; color: var(--primary); }
        
        .share-btn {
            background: #00ff9d;
            color: #000;
            border: none;
            border-radius: 16px;
            padding: 16px;
            font-weight: 700;
            width: 100%;
            margin: 16px 0;
            cursor: pointer;
            font-size: 1.05rem;
        }
        
        .apple-pay-button, .withdraw-button {
            border: none; border-radius: 16px; padding: 18px 24px;
            font-size: 1.15rem; font-weight: 700; width: 100%;
            display: flex; align-items: center; justify-content: center; gap: 12px;
            cursor: pointer; transition: all 0.25s ease; height: 68px; margin: 12px 0;
        }
        .apple-pay-button { background: #000; color: white; }
        .apple-pay-button:hover { background: #111; transform: translateY(-3px); }
        .apple-pay-button::before { content: ""; font-size: 1.7rem; }
        
        .withdraw-button { background: #ff00aa; color: #000; }
        .withdraw-button:hover { background: #ff33bb; transform: translateY(-3px); }
        
        .quick-amounts {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 16px;
        }
        .quick-amounts button {
            background: #1f1f26; border: 1px solid #333; color: white;
            border-radius: 16px; padding: 16px 8px; font-weight: 700; transition: all 0.2s;
        }
        .quick-amounts button.active,
        .quick-amounts button:hover {
            background: var(--primary); color: #000; transform: scale(1.05);
        }
        
        .toast {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            background: #111; color: var(--primary); padding: 16px 32px;
            border-radius: 999px; font-weight: 700;
            box-shadow: 0 10px 40px rgba(0,0,0,0.7);
            z-index: 10000; display: none; max-width: 90%; text-align: center;
        }
    </style>
</head>
<body>

    <!-- SIGN UP -->
    <div class="container" id="signupScreen">
        <div class="header">
            <h1>ROOT DONATE</h1>
            <p style="margin-top:12px; font-size:1.1rem;">Quick Apple Pay Profile</p>
        </div>
        <div class="content">
            <div style="text-align:center; margin-bottom:32px;">
                <div class="avatar">🌱</div>
                <h2 style="font-size:1.6rem; margin-bottom:8px;">Create your profile</h2>
                <p style="color:#888;">One tap donations with Apple Pay</p>
            </div>

            <input type="text" id="displayName" placeholder="Display Name (e.g. Guardian)" 
                   style="width:100%; padding:18px; margin:12px 0; background:#1c1c24; border:none; border-radius:16px; color:white; font-size:1.05rem;">
            <input type="email" id="email" placeholder="Email" 
                   style="width:100%; padding:18px; margin:12px 0; background:#1c1c24; border:none; border-radius:16px; color:white; font-size:1.05rem;">
            
            <div id="errorMsg" style="color:#ff6666; text-align:center; margin:16px 0; min-height:24px;"></div>
            
            <button id="createBtn" onclick="completeSignup()" 
                    style="width:100%; padding:18px; background:var(--primary); color:#000; border:none; border-radius:16px; font-weight:700; font-size:1.15rem;">
                Create Profile & Enable Apple Pay
            </button>
        </div>
    </div>

    <!-- DASHBOARD -->
    <div class="container" id="profileScreen" style="display:none;">
        <div class="header">
            <h1>ROOT DONATE</h1>
            <div id="userGreeting" style="font-size:1.4rem; font-weight:700; margin-top:12px;">Guardian</div>
            <div style="font-size:0.9rem; opacity:0.8;">Apple Pay Ready ✓</div>
        </div>

        <div class="content">
            <!-- Share Link -->
            <div class="rpg-card">
                <button onclick="shareProfile()" class="share-btn">
                    🔗 Share My Profile Link
                </button>
            </div>

            <!-- Balance -->
            <div class="rpg-card">
                <div style="color:#888; font-size:0.9rem;">YOUR DONATED BALANCE</div>
                <div id="balanceAmount" class="balance">$0</div>
                <button onclick="requestWithdraw()" class="withdraw-button" style="margin-top:16px;">
                    💸 Withdraw Funds
                </button>
            </div>

            <!-- Stats -->
            <div class="rpg-card">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <div>
                        <div style="color:#888; font-size:0.9rem;">TOTAL DONATED</div>
                        <div id="totalDonated" style="font-size:2.2rem; font-weight:800; color:var(--primary);">$0</div>
                    </div>
                    <div style="text-align:right;">
                        <div id="streak" style="font-size:2rem; font-weight:900;">🔥 0</div>
                        <div style="font-size:0.85rem; color:#888;">day streak</div>
                    </div>
                </div>
            </div>

            <!-- Quick Donate -->
            <div class="rpg-card">
                <div style="font-weight:700; margin-bottom:16px; font-size:1.2rem;">🍎 Quick Apple Pay</div>
                <p style="color:#888; margin-bottom:16px;">Tap any amount to donate instantly</p>
                
                <div class="quick-amounts" id="amountGrid">
                    <button onclick="quickDonate(5)" class="active">$5</button>
                    <button onclick="quickDonate(10)">$10</button>
                    <button onclick="quickDonate(25)">$25</button>
                </div>

                <button onclick="startApplePay(5)" class="apple-pay-button" style="margin-top:24px;">
                    Pay with  Apple Pay
                </button>
            </div>

            <button onclick="logout()" style="width:100%; padding:18px; background:#222; color:white; border:none; border-radius:16px; font-weight:600;">
                Sign Out
            </button>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>
    
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBvcCBsPiMxS7G2evPjM7sANp-zSy_RkKM",
            authDomain: "rootdonate-61e61.firebaseapp.com",
            projectId: "rootdonate-61e61",
            storageBucket: "rootdonate-61e61.firebasestorage.app",
            messagingSenderId: "754240963907",
            appId: "1:754240963907:web:5417c2763d8f02108bdbf6"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        let currentUser = null;
        let userDocRef = null;

        function showToast(msg, color = '#00ff9d') {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.style.color = color;
            t.style.display = 'block';
            setTimeout(() => t.style.display = 'none', 2800);
        }

        function confettiBurst() {
            confetti({ particleCount: 180, spread: 100, origin: { y: 0.6 } });
        }

        async function loadUserData() {
            if (!userDocRef) return;
            const doc = await userDocRef.get();
            const data = doc.data() || {};
            const total = data.totalDonated || 0;
            document.getElementById('totalDonated').textContent = '$' + total;
            document.getElementById('balanceAmount').textContent = '$' + total;
        }

        async function updateDonatedAmount(amount) {
            if (!userDocRef) return;
            await userDocRef.update({
                totalDonated: firebase.firestore.FieldValue.increment(amount),
                lastDonation: firebase.firestore.FieldValue.serverTimestamp()
            });
            await loadUserData();
        }

        function startApplePay(amount = 5, recipient = "General Fund") {
            if (!window.ApplePaySession || !ApplePaySession.canMakePayments()) {
                showToast("Apple Pay not available", "#ff6666");
                return;
            }
            const request = {
                countryCode: "US",
                currencyCode: "USD",
                supportedNetworks: ["visa", "masterCard", "amex", "discover"],
                merchantCapabilities: ["supports3DS"],
                total: { label: `ROOT • ${recipient}`, amount: amount.toFixed(2) }
            };
            const session = new ApplePaySession(4, request);
            session.onvalidatemerchant = () => session.completeMerchantValidation({});
            session.onpaymentauthorized = () => {
                setTimeout(async () => {
                    session.completePayment(ApplePaySession.STATUS_SUCCESS);
                    await updateDonatedAmount(amount);
                    showToast(`✅ $${amount} sent to ${recipient}!`, '#00ff9d');
                    confettiBurst();
                }, 800);
            };
            session.begin();
        }

        function quickDonate(amount) {
            document.querySelectorAll('#amountGrid button').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            startApplePay(amount);
        }

        function requestWithdraw() {
            const balance = parseFloat(document.getElementById('balanceAmount').textContent.replace('$','')) || 0;
            if (balance <= 0) return showToast("No balance available", "#ff6666");
            const amount = prompt(`How much to withdraw? (Max $${balance})`, balance);
            if (amount && parseFloat(amount) > 0) {
                showToast(`💸 Withdrawal request submitted!`, '#00ff9d');
            }
        }

        // Share Profile Link using Base64
        function shareProfile() {
            if (!currentUser) return showToast("Please create profile first", "#ff6666");
            
            const profileData = {
                uid: currentUser.uid,
                name: document.getElementById('userGreeting').textContent
            };
            
            const encoded = btoa(JSON.stringify(profileData));
            const shareLink = `${window.location.origin}${window.location.pathname}?p=${encoded}`;
            
            navigator.clipboard.writeText(shareLink).then(() => {
                showToast("✅ Profile link copied to clipboard!", '#00ff9d');
            }).catch(() => {
                showToast("Link: " + shareLink, '#00ff9d');
            });
        }

        async function completeSignup() {
            const btn = document.getElementById('createBtn');
            const errorEl = document.getElementById('errorMsg');
            const name = document.getElementById('displayName').value.trim() || "Guardian";
            const email = document.getElementById('email').value.trim();

            if (!email) {
                errorEl.textContent = "Please enter an email";
                return;
            }

            btn.disabled = true;
            btn.textContent = "Creating Profile...";
            errorEl.textContent = "";

            try {
                const userCredential = await auth.signInAnonymously();
                currentUser = userCredential.user;
                userDocRef = db.collection('users').doc(currentUser.uid);

                await userDocRef.set({
                    displayName: name,
                    email: email,
                    totalDonated: 0,
                    createdAt: firebase.firestore.FieldValue.serverTimestamp()
                }, { merge: true });

                showToast("Profile created successfully!", '#00ff9d');

                document.getElementById('signupScreen').style.display = 'none';
                document.getElementById('profileScreen').style.display = 'block';
                document.getElementById('userGreeting').textContent = name;

                await loadUserData();
            } catch (e) {
                console.error(e);
                let msg = "";
                if (e.code === 'auth/operation-not-allowed') msg = "Enable Anonymous Auth in Firebase Console";
                errorEl.textContent = msg;
                showToast(msg, "#ff6666");
            } finally {
                btn.disabled = false;
                btn.textContent = "Create Profile & Enable Apple Pay";
            }
        }

        function logout() {
            auth.signOut().then(() => location.reload());
        }

        auth.onAuthStateChanged(async (user) => {
            if (user) {
                currentUser = user;
                userDocRef = db.collection('users').doc(user.uid);
                document.getElementById('signupScreen').style.display = 'none';
                document.getElementById('profileScreen').style.display = 'block';
                document.getElementById('userGreeting').textContent = user.displayName || "Guardian";
                await loadUserData();
            }
        });

        window.onload = () => setTimeout(() => document.getElementById('displayName').focus(), 600);
    </script>
</body>
</html>
