<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0f172a">
<title>Shared RootDonate</title>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, collection, addDoc, query, orderBy, onSnapshot,
  getDocs, limit, where, deleteDoc, doc, writeBatch
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBvcCBsPiMxS7G2evPjM7sANp-zSy_RkKM",
  authDomain: "rootdonate-61e61.firebaseapp.com",
  databaseURL: "https://rootdonate-61e61-default-rtdb.firebaseio.com",
  projectId: "rootdonate-61e61",
  storageBucket: "rootdonate-61e61.firebasestorage.app",
  messagingSenderId: "754240963907",
  appId: "1:754240963907:web:5417c2763d8f02108bdbf6",
  measurementId: "G-0SC5R5ELT1"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;
let memory = [];
let unsubMessages = null;
let unsubShared = null;
let isReplying = false;

// ========== HARDCODED DICTIONARY (self + internet AI knowledge) ==========
const baseDictionary = [
  { input: "who are you", response: "I am RootDonate AI — a shared learning chatbot. I learn from everyone and use Wikipedia (internet) when I don't know something yet." },
  { input: "what are you", response: "I am a single HTML file chatbot using Firebase Auth + Firestore shared memory, plus Wikipedia as the internet AI fallback." },
  { input: "how do you learn", response: "Every conversation is saved to shared_memory. I also automatically hardcode Wikipedia answers into shared memory so the internet knowledge stays forever." },
  { input: "how does shared memory work", response: "Shared memory lives in Firestore. I load the latest pairs and match with Jaccard similarity. Hardcoded dictionary + user pairs + Wikipedia results all live together." },
  { input: "what is your source code", response: "One HTML file. Vanilla JS + CSS. Firebase for auth and data. Jaccard similarity for matching. Wikipedia for internet knowledge. Base dictionary is hardcoded in the source." },
  { input: "do you use wikipedia", response: "Yes. When nothing in the dictionary or shared memory matches well, I fetch a Wikipedia summary and then hardcode that answer into shared memory for everyone." },
  { input: "internet ai", response: "Wikipedia is my internet AI. Answers from it get automatically saved into shared learning so they become permanent knowledge." },
  { input: "how do i delete my data", response: "Use Clear data or Sign out. Both delete your personal messages and your shared contributions. The base hardcoded dictionary stays." },
  { input: "what is jaccard", response: "Jaccard similarity measures word overlap. I use it on the hardcoded dictionary + shared memory to find the best reply." },
  { input: "hello", response: "Hi! I'm RootDonate AI. I know a base dictionary by heart and I learn from Wikipedia + everyone else." },
  { input: "hi", response: "Hello! Ask me anything. I use hardcoded knowledge, shared learning, and Wikipedia." },
  { input: "what can you do", response: "Chat, remember via shared memory, use hardcoded dictionary, and fetch + hardcode Wikipedia answers when needed." },
  { input: "privacy", response: "Anonymous auth only. You can delete all your data anytime. Shared pairs (including Wikipedia ones you trigger) help everyone." }
];

const SEED_MARKER = "__ROOTDONATE_SEED_V1__";

function similarity(a, b) {
  a = a.toLowerCase().trim();
  b = b.toLowerCase().trim();
  if (a === b) return 1;
  if (!a || !b) return 0;
  const setA = new Set(a.split(/\s+/).filter(w => w.length > 2));
  const setB = new Set(b.split(/\s+/).filter(w => w.length > 2));
  let intersect = 0;
  for (const w of setA) if (setB.has(w)) intersect++;
  const union = setA.size + setB.size - intersect;
  const jaccard = union ? intersect / union : 0;
  const lenDiff = Math.abs(a.length - b.length) / Math.max(a.length, b.length, 1);
  return jaccard * 0.75 + (1 - lenDiff) * 0.25;
}

function findBestResponse(input) {
  if (memory.length === 0) return null;
  let best = null;
  let bestScore = 0.32;
  for (const pair of memory) {
    const score = similarity(input, pair.input);
    if (score > bestScore) {
      bestScore = score;
      best = pair.response;
    }
  }
  return best;
}

async function fetchWikipediaSummary(queryText) {
  try {
    const searchUrl = `https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(queryText)}&format=json&origin=*&srlimit=1`;
    const searchRes = await fetch(searchUrl);
    const searchData = await searchRes.json();
    const title = searchData?.query?.search?.[0]?.title;
    if (!title) return null;

    const summaryUrl = `https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(title)}`;
    const summaryRes = await fetch(summaryUrl);
    const summaryData = await summaryRes.json();
    if (summaryData.extract) {
      return `${summaryData.extract}\n\n(Source: Wikipedia – ${title})`;
    }
  } catch (err) {
    console.error("Wikipedia fetch failed:", err);
  }
  return null;
}

async function seedSharedMemoryIfNeeded() {
  try {
    const markerQuery = query(collection(db, "shared_memory"), where("input", "==", SEED_MARKER), limit(1));
    const markerSnap = await getDocs(markerQuery);
    if (!markerSnap.empty) return;

    console.log("Seeding base dictionary...");
    const batch = writeBatch(db);

    const markerRef = doc(collection(db, "shared_memory"));
    batch.set(markerRef, {
      input: SEED_MARKER,
      response: "seed",
      uid: "system",
      isSeed: true,
      createdAt: Date.now()
    });

    for (const pair of baseDictionary) {
      const ref = doc(collection(db, "shared_memory"));
      batch.set(ref, {
        input: pair.input,
        response: pair.response,
        uid: "system",
        isSeed: true,
        createdAt: Date.now()
      });
    }

    await batch.commit();
    console.log("Dictionary seeded.");
  } catch (err) {
    console.error("Seed failed:", err);
  }
}

async function loadSharedMemory() {
  try {
    const q = query(collection(db, "shared_memory"), orderBy("createdAt", "desc"), limit(800));
    const snap = await getDocs(q);
    const shared = snap.docs.map(d => d.data()).reverse().filter(p => p.input !== SEED_MARKER);
    memory = [...baseDictionary, ...shared];
  } catch (err) {
    console.error("Failed to load shared memory:", err);
    memory = [...baseDictionary];
  }
}

function listenSharedMemory() {
  if (unsubShared) unsubShared();
  const q = query(collection(db, "shared_memory"), orderBy("createdAt", "desc"), limit(800));
  unsubShared = onSnapshot(q, (snap) => {
    const shared = snap.docs.map(d => d.data()).reverse().filter(p => p.input !== SEED_MARKER);
    memory = [...baseDictionary, ...shared];
  });
}

async function saveSharedPair(input, response) {
  if (!currentUser) return;
  try {
    await addDoc(collection(db, "shared_memory"), {
      input: input.trim(),
      response: response.trim(),
      uid: currentUser.uid,
      createdAt: Date.now()
    });
    memory.push({ input, response, createdAt: Date.now() });
    if (memory.length > 1500) memory.shift();
  } catch (err) {
    console.error("Failed to save shared pair:", err);
  }
}

async function saveMessage(role, content) {
  if (!currentUser) return;
  try {
    await addDoc(collection(db, "users", currentUser.uid, "messages"), {
      role, content, createdAt: Date.now()
    });
  } catch (err) {
    console.error("Failed to save message:", err);
  }
}

function addMessageToUI(text, isUser, time) {
  const wrap = document.createElement("div");
  wrap.className = "msg-wrap " + (isUser ? "user" : "bot");
  const div = document.createElement("div");
  div.className = "msg";
  div.textContent = text;
  wrap.appendChild(div);
  if (time) {
    const t = document.createElement("div");
    t.className = "time";
    t.textContent = new Date(time).toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
    wrap.appendChild(t);
  }
  const chat = document.getElementById("chat");
  chat.appendChild(wrap);
  chat.scrollTop = chat.scrollHeight;
}

function showTyping(show) {
  let el = document.getElementById("typing");
  if (show && !el) {
    el = document.createElement("div");
    el.id = "typing";
    el.className = "msg-wrap bot";
    el.innerHTML = '<div class="msg typing"><span></span><span></span><span></span></div>';
    document.getElementById("chat").appendChild(el);
    document.getElementById("chat").scrollTop = 99999;
  } else if (!show && el) {
    el.remove();
  }
}

async function reply(userText) {
  if (isReplying) return;
  isReplying = true;
  showTyping(true);
  await new Promise(r => setTimeout(r, 500 + Math.random() * 700));

  let response = findBestResponse(userText);
  let fromInternet = false;

  if (!response) {
    response = await fetchWikipediaSummary(userText);
    fromInternet = !!response;
  }

  showTyping(false);

  if (!response) {
    const defaults = [
      "I'm still learning from everyone and Wikipedia. Tell me more.",
      "Interesting! What do you think about that?",
      "I don't have a good answer yet. Can you explain?",
      "That's new. Why do you say that?",
      "Keep talking — I learn from all of us and the internet.",
      "Hmm, not sure. Tell me more details."
    ];
    response = defaults[Math.floor(Math.random() * defaults.length)];
  }

  const now = Date.now();
  addMessageToUI(response, false, now);
  await saveMessage("assistant", response);

  // Always hardcode into shared (including Wikipedia / internet AI answers)
  await saveSharedPair(userText, response);

  isReplying = false;
}

async function deleteAllUserData() {
  if (!currentUser) return;
  const uid = currentUser.uid;

  try {
    const msgQuery = query(collection(db, "users", uid, "messages"));
    const msgSnap = await getDocs(msgQuery);
    const batch = writeBatch(db);
    msgSnap.docs.forEach(d => batch.delete(d.ref));
    if (!msgSnap.empty) await batch.commit();
  } catch (err) {
    console.error("Failed to delete messages:", err);
  }

  try {
    const sharedQuery = query(collection(db, "shared_memory"), where("uid", "==", uid));
    const sharedSnap = await getDocs(sharedQuery);
    const batch = writeBatch(db);
    sharedSnap.docs.forEach(d => batch.delete(d.ref));
    if (!sharedSnap.empty) await batch.commit();
    await loadSharedMemory();
  } catch (err) {
    console.error("Failed to delete shared contributions:", err);
  }
}

onAuthStateChanged(auth, async (user) => {
  if (user) {
    currentUser = user;
    document.getElementById("status").textContent = "Signed in";
    document.getElementById("signBtn").textContent = "Sign out";
    document.getElementById("input").disabled = false;
    document.getElementById("send").disabled = false;

    await seedSharedMemoryIfNeeded();
    await loadSharedMemory();
    listenSharedMemory();

    if (unsubMessages) unsubMessages();
    const q = query(collection(db, "users", user.uid, "messages"), orderBy("createdAt"));
    unsubMessages = onSnapshot(q, (snap) => {
      document.getElementById("chat").innerHTML = "";
      snap.forEach(d => {
        const data = d.data();
        addMessageToUI(data.content, data.role === "user", data.createdAt);
      });
    });
  } else {
    currentUser = null;
    document.getElementById("status").textContent = "Not signed in";
    document.getElementById("signBtn").textContent = "Sign in";
    document.getElementById("input").disabled = true;
    document.getElementById("send").disabled = true;
    document.getElementById("chat").innerHTML = "";
    if (unsubMessages) { unsubMessages(); unsubMessages = null; }
    if (unsubShared) { unsubShared(); unsubShared = null; }
    memory = [...baseDictionary];
  }
});

document.getElementById("signBtn").onclick = async () => {
  if (currentUser) {
    if (confirm("Sign out and permanently delete your contributions to shared memory?")) {
      await deleteAllUserData();
      await signOut(auth);
    }
  } else {
    await signInAnonymously(auth);
  }
};

document.getElementById("send").onclick = async () => {
  const inputEl = document.getElementById("input");
  const text = inputEl.value.trim();
  if (!text || !currentUser || isReplying) return;
  inputEl.value = "";
  inputEl.style.height = "auto";
  const now = Date.now();
  addMessageToUI(text, true, now);
  await saveMessage("user", text);
  reply(text);
};

document.getElementById("input").onkeydown = e => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    document.getElementById("send").click();
  }
};

document.getElementById("input").oninput = () => {
  const el = document.getElementById("input");
  el.style.height = "auto";
  el.style.height = Math.min(el.scrollHeight, 120) + "px";
};

document.getElementById("clearBtn").onclick = async () => {
  if (!currentUser) return;
  if (confirm("Permanently delete all your personal chat history and your contributions to shared memory?\n\nThis cannot be undone.")) {
    if (unsubMessages) unsubMessages();
    await deleteAllUserData();
    document.getElementById("chat").innerHTML = "";
    alert("Your data has been deleted.");
  }
};

document.getElementById("privacyBtn").onclick = () => {
  alert(
    "Privacy notice (GDPR)\n\n" +
    "• Messages stored under anonymous UID.\n" +
    "• Pairs (including Wikipedia/internet answers) go into shared memory.\n" +
    "• You can delete all your data anytime.\n" +
    "• No real name or email collected.\n" +
    "• Wikipedia is only queried for public knowledge."
  );
};
</script>
<style>

  --bg: #0b1120;

}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--bg); color: var(--text); font-family: system-ui, -apple-system, sans-serif; }
body { display: flex; flex-direction: column; min-height: 100dvh; padding-bottom: env(safe-area-inset-bottom); }
header {
  background: rgba(30,41,59,.85);
  backdrop-filter: blur(12px);

}

}

  display: grid;

  flex-shrink: 0;
}
#signBtn, #clearBtn, #privacyBtn { border-radius: 12px; width: auto; padding: 0 0.9rem; font-size: 0.85rem; font-weight: 600; }
#signBtn { background: #3b82f6; color: white; }
#privacyBtn { background: #64748b; color: white; }
@media (max-width: 480px) {
  .msg-wrap { max-width: 90%; }
  header { padding: 0.6rem 0.8rem; }
}
footer {
  background: var(--surface);
  border-top: 1px solid #334155;
  padding: 0.6rem 1rem calc(0.6rem + env(safe-area-inset-bottom));
  text-align: center;
  font-size: 0.7rem;
  color: var(--muted);
  line-height: 1.4;
}
</style>
</head>
<body>
<header>
  <div>
    <div class="logo">RootDonate <span>AI</span></div>
    <div id="status">Not signed in</div>
  </div>
  <div style="display:flex;gap:0.4rem;align-items:center">
    <button id="clearBtn">Clear data</button>
    <button id="signBtn">Sign in</button>
  </div>
</header>
<div id="chat"></div>
<div class="input-bar">
  <textarea id="input" placeholder="Talk... learns from dictionary + Wikipedia!" rows="1" disabled></textarea>
  <button id="send" disabled>↑</button>
</div>
<footer>
  By chatting you agree messages are stored and may be used for shared learning (including Wikipedia answers). You can delete all your data anytime.
</footer>
</body>
</html>
