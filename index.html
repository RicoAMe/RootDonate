<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ROOTDONATE • GLOBAL INTERNET MESH</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    :root { --neon:#00ff41; --glow:#00ff4188; --bg:#050505; }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family:'Courier New',monospace;
      background:var(--bg); color:var(--neon);
      height:100vh; overflow:hidden;
    }
    canvas#matrix { position:fixed; inset:0; z-index:-1; opacity:0.16; }

    /* Auth Screen */
    .auth-container {
      position:fixed; inset:0; display:flex; align-items:center; justify-content:center; z-index:50;
      background:rgba(5,5,5,0.98);
    }
    .auth-box {
      background:rgba(10,10,10,0.96); border:2px solid var(--neon);
      border-radius:16px; padding:40px 32px; width:100%; max-width:420px; text-align:center;
      box-shadow:0 0 60px var(--glow);
    }
    .auth-box h1 { font-size:3rem; letter-spacing:4px; text-shadow:0 0 25px var(--neon); animation:glitch 1.5s infinite alternate; }
    .tab-switch { display:flex; margin:25px 0; border:1px solid var(--neon); border-radius:50px; overflow:hidden; }
    .tab { flex:1; padding:14px; cursor:pointer; }
    .tab.active { background:var(--neon); color:#000; }

    /* Main App */
    .main-app { display:none; height:100vh; flex-direction:column; }
    .header { padding:16px 30px; display:flex; justify-content:space-between; border-bottom:1px solid rgba(0,255,65,0.3); background:rgba(5,5,5,0.95); }
    .nav { padding:12px 30px; display:flex; gap:12px; flex-wrap:wrap; border-bottom:1px solid rgba(0,255,65,0.2); background:rgba(5,5,5,0.95); }
    .nav button { background:transparent; border:1px solid var(--neon); color:var(--neon); padding:10px 24px; border-radius:50px; cursor:pointer; }
    .nav button.active, .nav button:hover { background:var(--neon); color:#000; box-shadow:0 0 25px var(--glow); }

    .search-bar {
      margin:18px 30px; padding:18px 28px; width:calc(100% - 60px);
      background:#000; border:1px solid var(--neon); border-radius:50px; color:var(--neon);
    }

    .nodes-grid {
      flex:1; padding:0 30px 20px; overflow-y:auto;
      display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:24px;
    }

    .node-card {
      background:rgba(10,25,15,0.95); border:1px solid rgba(0,255,65,0.35);
      border-radius:16px; padding:20px; cursor:pointer; transition:0.4s;
    }
    .node-card:hover {
      transform:translateY(-12px); border-color:var(--neon); box-shadow:0 0 40px var(--glow);
    }

    .log { height:150px; background:#000; padding:12px 30px; overflow-y:auto; font-size:0.9rem; border-top:1px solid rgba(0,255,65,0.3); }

    .modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.96); z-index:100; align-items:center; justify-content:center; }
    .modal-content { background:rgba(10,10,10,0.98); border:2px solid var(--neon); border-radius:16px; width:90%; max-width:540px; padding:35px; position:relative; }

    @keyframes glitch {
      0%,100% { text-shadow:2px 0 #00ff41, -2px 0 #ff00ff; }
      50% { text-shadow:-3px 0 #00ff41, 3px 0 #00ffff; }
    }
  </style>
</head>
<body>

  <canvas id="matrix"></canvas>

  <!-- AUTH SCREEN -->
  <div class="auth-container" id="authScreen">
    <div class="auth-box">
      <h1>ROOTDONATE</h1>
      <p style="opacity:0.7;">GLOBAL INTERNET LOST & FOUND • 2026</p>

      <div class="tab-switch">
        <div class="tab active" onclick="switchTab(0)">LOGIN NODE</div>
        <div class="tab" onclick="switchTab(1)">DEPLOY NODE</div>
      </div>

      <div id="loginForm">
        <input type="text" id="nodeId" placeholder="NODE ID" value="RD-7842" style="width:100%;padding:14px;margin:10px 0;background:#000;border:1px solid var(--neon);color:var(--neon);">
        <input type="password" id="pass" placeholder="PASSPHRASE" value="demo123" style="width:100%;padding:14px;margin:10px 0;background:#000;border:1px solid var(--neon);color:var(--neon);">
        <button onclick="login()" style="width:100%;padding:16px;margin-top:15px;border:2px solid var(--neon);background:transparent;color:var(--neon);border-radius:50px;">CONNECT TO MESH</button>
      </div>

      <div id="signupForm" style="display:none;">
        <input type="text" id="opName" placeholder="OPERATOR NAME" style="width:100%;padding:14px;margin:10px 0;background:#000;border:1px solid var(--neon);color:var(--neon);">
        <input type="text" id="region" placeholder="CITY / REGION" style="width:100%;padding:14px;margin:10px 0;background:#000;border:1px solid var(--neon);color:var(--neon);">
        <button onclick="deployNode()" style="width:100%;padding:16px;margin-top:15px;border:2px solid var(--neon);background:transparent;color:var(--neon);border-radius:50px;">DEPLOY NEW NODE</button>
      </div>
    </div>
  </div>

  <!-- MAIN APP -->
  <div class="main-app" id="mainApp">
    <div class="header">
      <h1>🔗 ROOTDONATE</h1>
      <div id="stats">SCANNING INTERNET • 8,247 NODES</div>
    </div>

    <div class="nav">
      <button class="active" onclick="setTab(0)">🌐 LIVE INTERNET FEED</button>
      <button onclick="setTab(1)">🔎 DEEP SCAN</button>
      <button onclick="showReportModal()">📢 REPORT TO INTERNET</button>
      <button onclick="logout()">DISCONNECT</button>
    </div>

    <input type="text" id="searchInput" class="search-bar" placeholder="Search entire internet sources..." onkeyup="filterNodes()">

    <div class="nodes-grid" id="grid"></div>
    <div class="log" id="log"></div>
  </div>

  <!-- Item Detail Modal -->
  <div class="modal" id="itemModal">
    <div class="modal-content">
      <span onclick="closeItemModal()" style="position:absolute;top:15px;right:25px;font-size:2.5rem;cursor:pointer;color:var(--neon);">×</span>
      <h2 id="modalName" style="color:#0f0;"></h2>
      <p id="modalLoc"></p>
      <p id="modalTime"></p>
      <div class="share-url" id="shareUrl" style="background:#000;padding:12px;margin:15px 0;border:1px solid var(--neon);word-break:break-all;"></div>
      <button onclick="copyShareLink()" style="width:100%;padding:12px;border:2px solid var(--neon);background:transparent;color:var(--neon);">COPY SHARE LINK</button>
    </div>
  </div>

  <!-- Report Modal -->
  <div class="modal" id="reportModal">
    <div class="modal-content">
      <span onclick="closeReportModal()" style="position:absolute;top:15px;right:25px;font-size:2.5rem;cursor:pointer;">×</span>
      <h2 style="text-align:center;color:#0f0;">BROADCAST TO INTERNET</h2>
      <input id="rName" placeholder="Item name" style="width:100%;padding:14px;margin:10px 0;background:#000;border:1px solid var(--neon);color:var(--neon);">
      <input id="rLoc" placeholder="Last seen location" style="width:100%;padding:14px;margin:10px 0;background:#000;border:1px solid var(--neon);color:var(--neon);">
      <textarea id="rDesc" rows="3" placeholder="Details..." style="width:100%;padding:14px;margin:10px 0;background:#000;border:1px solid var(--neon);color:var(--neon);"></textarea>
      <button onclick="submitReport()" style="width:100%;padding:16px;margin-top:10px;border:2px solid var(--neon);background:transparent;color:var(--neon);border-radius:50px;">SEND TO GLOBAL MESH</button>
    </div>
  </div>

  <script>
    // Matrix Rain
    const canvas = document.getElementById('matrix');
    const ctx = canvas.getContext('2d');
    let drops = [];
    function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; drops = Array(Math.floor(canvas.width/14)).fill(1); }
    window.addEventListener('resize', resize); resize();
    function rain() {
      ctx.fillStyle = 'rgba(5,5,5,0.08)';
      ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle = '#00ff41';
      ctx.font = '14px monospace';
      for(let i=0; i<drops.length; i++) {
        ctx.fillText('01アイウエオ0123456789$@#'.charAt(Math.random()*25|0), i*14, drops[i]*14);
        if(drops[i]*14 > canvas.height && Math.random()>0.975) drops[i]=0;
        drops[i]++;
      }
    }
    setInterval(rain, 35);

    let allNodes = JSON.parse(localStorage.getItem('rd_nodes')) || [];
    let currentItem = null;

    function log(msg) {
      const el = document.getElementById('log');
      const time = new Date().toLocaleTimeString([], {hour12:false}).slice(0,8);
      el.innerHTML += `<span style="opacity:0.5">[${time}]</span> ${msg}<br>`;
      el.scrollTop = el.scrollHeight;
    }

    function generateShareUrl(node) {
      const data = btoa(JSON.stringify(node)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
      return window.location.href.split('#')[0] + '#node=' + data;
    }

    function renderNodes(filtered = allNodes) {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = 'node-card';
        card.innerHTML = `
          <div style="font-size:0.8rem;opacity:0.7;">#${item.id} • ${item.source}</div>
          <h3 style="margin:8px 0;">${item.name}</h3>
          <p>📍 ${item.loc}</p>
          <p>${item.time} • <span style="color:#0f0">${item.status}</span></p>
        `;
        card.onclick = () => showItemDetail(item);
        grid.appendChild(card);
      });
    }

    function showItemDetail(item) {
      currentItem = item;
      document.getElementById('modalName').textContent = item.name;
      document.getElementById('modalLoc').innerHTML = `📍 ${item.loc}`;
      document.getElementById('modalTime').textContent = item.time;
      const url = generateShareUrl(item);
      document.getElementById('shareUrl').innerHTML = `<strong>SHARE LINK:</strong><br><a href="${url}" target="_blank" style="color:var(--neon);word-break:break-all;">${url}</a>`;
      document.getElementById('itemModal').style.display = 'flex';
    }

    function copyShareLink() {
      if(!currentItem) return;
      navigator.clipboard.writeText(generateShareUrl(currentItem));
      alert("✅ Share link copied!");
    }

    function closeItemModal() { document.getElementById('itemModal').style.display = 'none'; }

    async function fetchInternetSources() {
      log("🌐 SCANNING PUBLIC INTERNET SOURCES...");
      // Add seed data + public API
      const seed = [ /* same as before */ ];
      // ... (you can copy the seed from previous version)
      renderNodes();
    }

    function login() {
      document.getElementById('authScreen').style.display = 'none';
      document.getElementById('mainApp').style.display = 'flex';
      log("🔓 NODE CONNECTED TO GLOBAL MESH");
      fetchInternetSources();
    }

    function deployNode() {
      alert("🛰️ New node deployed successfully!");
      login();
    }

    function logout() {
      if(confirm("Disconnect from mesh?")) {
        document.getElementById('mainApp').style.display = 'none';
        document.getElementById('authScreen').style.display = 'flex';
      }
    }

    function switchTab(n) {
      document.querySelectorAll('.tab').forEach((t,i) => t.classList.toggle('active', i===n));
      document.getElementById('loginForm').style.display = n===0 ? 'block' : 'none';
      document.getElementById('signupForm').style.display = n===1 ? 'block' : 'none';
    }

    function showReportModal() { document.getElementById('reportModal').style.display = 'flex'; }
    function closeReportModal() { document.getElementById('reportModal').style.display = 'none'; }

    function submitReport() {
      const name = document.getElementById('rName').value.trim();
      const loc = document.getElementById('rLoc').value.trim();
      if(!name || !loc) return alert("Please fill item and location");

      const newItem = {
        id: `RD-${1000 + Math.floor(Math.random()*9000)}`,
        name: name,
        loc: loc,
        time: "Just now",
        status: "ACTIVE",
        source: "YOUR REPORT"
      };
      allNodes.unshift(newItem);
      localStorage.setItem('rd_nodes', JSON.stringify(allNodes));
      renderNodes();
      closeReportModal();
      log("🚨 REPORT BROADCAST TO INTERNET");
    }

    function filterNodes() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      const filtered = allNodes.filter(n => n.name.toLowerCase().includes(q) || n.loc.toLowerCase().includes(q));
      renderNodes(filtered);
    }

    function setTab(n) {
      document.querySelectorAll('.nav button').forEach((b,i)=>b.classList.toggle('active',i===n));
    }

    // Deep link support
    function handleDeepLink() {
      const hash = window.location.hash;
      if(hash.includes('#node=')) {
        try {
          const data = hash.split('#node=')[1];
          let b64 = data.replace(/-/g,'+').replace(/_/g,'/');
          while(b64.length % 4) b64 += '=';
          const item = JSON.parse(atob(b64));
          login();
          setTimeout(() => showItemDetail(item), 600);
        } catch(e) {}
      }
    }

    window.onload = () => {
      handleDeepLink();
    };
  </script>
</body>
</html>
