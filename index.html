<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ROOTDONATE • GLOBAL INTERNET MESH</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
  <style>
    :root { --neon:#00ff41; --glow:#00ff4188; --bg:#0a0a0a; --card:rgba(15,25,20,0.95); }
    * { margin:0; padding:0; box-sizing:border-box; }
    body {
      font-family:'Courier New',monospace; background:var(--bg); color:var(--neon);
      height:100vh; overflow:hidden; touch-action:manipulation;
    }
    canvas#matrix { position:fixed; inset:0; z-index:-1; opacity:0.12; }

    .header { padding:16px 20px; display:flex; justify-content:space-between; align-items:center;
      border-bottom:1px solid rgba(0,255,65,0.25); background:rgba(10,10,10,0.98); }
    .header h1 { font-size:1.6rem; letter-spacing:2px; text-shadow:0 0 15px var(--neon); }

    .nav { padding:12px 20px; display:flex; gap:8px; flex-wrap:wrap; border-bottom:1px solid rgba(0,255,65,0.2);
      background:rgba(10,10,10,0.98); }
    .nav button { background:transparent; border:1px solid var(--neon); color:var(--neon);
      padding:10px 20px; border-radius:50px; cursor:pointer; transition:all 0.3s; font-size:0.95rem; }
    .nav button.active, .nav button:hover { background:var(--neon); color:#000; box-shadow:0 0 25px var(--glow); }

    .search-bar { margin:16px 20px; padding:14px 24px; width:calc(100% - 40px); background:#111;
      border:1px solid var(--neon); border-radius:50px; color:var(--neon); font-size:1rem; }

    .nodes-grid { flex:1; padding:16px 20px; overflow-y:auto; 
      display:grid; grid-template-columns:repeat(auto-fill,minmax(280px,1fr)); gap:16px; }

    .node-card { background:var(--card); border:1px solid rgba(0,255,65,0.3); border-radius:16px;
      padding:18px; cursor:pointer; transition:all 0.4s; }
    .node-card:active { transform:translateY(-6px); border-color:var(--neon); box-shadow:0 0 30px var(--glow); }

    .log { height:140px; background:#0a0a0a; padding:12px 20px; overflow-y:auto; font-size:0.85rem;
      border-top:1px solid rgba(0,255,65,0.25); }

    .modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.96); z-index:100;
      align-items:center; justify-content:center; padding:10px; }
    .modal-content { background:rgba(15,15,15,0.98); border:2px solid var(--neon);
      border-radius:16px; width:100%; max-width:520px; padding:28px; position:relative; }

    @media (max-width: 480px) {
      .nodes-grid { grid-template-columns:1fr; }
      .header h1 { font-size:1.4rem; }
    }
  </style>
</head>
<body>

  <canvas id="matrix"></canvas>

  <div style="display:flex; flex-direction:column; height:100vh;">
    <div class="header">
      <h1>🔗 ROOTDONATE</h1>
      <div id="stats">SCANNING INTERNET • <span id="nodeCount">0</span> NODES ONLINE</div>
    </div>

    <div class="nav">
      <button class="active" onclick="setTab(0)">🌐 LIVE FEED</button>
      <button onclick="setTab(1)">🔎 DEEP SCAN</button>
      <button onclick="showReportModal()">📢 REPORT</button>
      <button onclick="location.reload()">RESET</button>
    </div>

    <input type="text" id="searchInput" class="search-bar" placeholder="Search nodes..." onkeyup="filterNodes()">

    <div class="nodes-grid" id="grid"></div>
    <div class="log" id="log"></div>
  </div>

  <!-- Detail Modal -->
  <div class="modal" id="itemModal">
    <div class="modal-content">
      <span onclick="closeItemModal()" style="position:absolute;top:12px;right:20px;font-size:2.5rem;cursor:pointer;color:var(--neon);">×</span>
      <h2 id="modalName" style="color:#0f0;margin-bottom:12px;"></h2>
      <p id="modalLoc" style="margin:8px 0;"></p>
      <p id="modalTime"></p>
      <div id="shareUrl" style="background:#111;padding:14px;margin:20px 0;border:1px solid var(--neon);word-break:break-all;"></div>
      <button onclick="copyShareLink()" style="width:100%;padding:14px;border:2px solid var(--neon);background:transparent;color:var(--neon);border-radius:50px;">
        COPY INDIVIDUAL PAGE LINK
      </button>
    </div>
  </div>

  <!-- Report Modal -->
  <div class="modal" id="reportModal">
    <div class="modal-content">
      <span onclick="closeReportModal()" style="position:absolute;top:12px;right:20px;font-size:2.5rem;cursor:pointer;color:var(--neon);">×</span>
      <h2 style="text-align:center;color:#0f0;margin-bottom:20px;">BROADCAST TO GLOBAL INTERNET</h2>
      <input id="rName" placeholder="Item / Node name" style="width:100%;padding:14px;margin:10px 0;background:#111;border:1px solid var(--neon);color:var(--neon);">
      <input id="rLoc" placeholder="Location / URL / IP" style="width:100%;padding:14px;margin:10px 0;background:#111;border:1px solid var(--neon);color:var(--neon);">
      <textarea id="rDesc" rows="4" placeholder="Description..." style="width:100%;padding:14px;margin:10px 0;background:#111;border:1px solid var(--neon);color:var(--neon);"></textarea>
      <button onclick="submitReport()" style="width:100%;padding:16px;margin-top:15px;border:2px solid var(--neon);background:transparent;color:var(--neon);border-radius:50px;">
        SEND TO GLOBAL MESH
      </button>
    </div>
  </div>

  <script>
    // Matrix Rain
    const canvas = document.getElementById('matrix');
    const ctx = canvas.getContext('2d');
    let drops = [];
    function resize() { canvas.width = innerWidth; canvas.height = innerHeight; drops = Array(Math.floor(canvas.width/14)).fill(1); }
    window.addEventListener('resize', resize); resize();

    function rain() {
      ctx.fillStyle = 'rgba(10,10,10,0.12)';
      ctx.fillRect(0,0,canvas.width,canvas.height);
      ctx.fillStyle = '#00ff41';
      ctx.font = '14px monospace';
      for (let i = 0; i < drops.length; i++) {
        ctx.fillText('01アイウエオ0123456789$@#%&*'[Math.random()*25|0], i*14, drops[i]*14);
        if (drops[i]*14 > canvas.height && Math.random()>0.975) drops[i]=0;
        drops[i]++;
      }
    }
    setInterval(rain, 35);

    let allNodes = [];
    let currentItem = null;

    function log(msg) {
      const el = document.getElementById('log');
      const time = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit', second:'2-digit'});
      el.innerHTML += `<span style="opacity:0.5">[${time}]</span> ${msg}<br>`;
      el.scrollTop = el.scrollHeight;
    }

    function generateShareUrl(node) {
      return `${location.origin}${location.pathname}#${node.id}`;
    }

    function renderNodes(filtered = allNodes) {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      document.getElementById('nodeCount').textContent = filtered.length;

      filtered.forEach(item => {
        const card = document.createElement('div');
        card.className = 'node-card';
        card.innerHTML = `
          <div style="font-size:0.8rem;opacity:0.7;">#${item.id} • ${item.source}</div>
          <h3 style="margin:10px 0 8px;">${item.name}</h3>
          <p>📍 ${item.loc}</p>
          <p style="margin-top:8px;">${item.time} • <span style="color:#0f0">${item.status}</span></p>
        `;
        card.onclick = () => showItemDetail(item);
        grid.appendChild(card);
      });
    }

    function showItemDetail(item) {
      currentItem = item;
      document.getElementById('modalName').textContent = item.name;
      document.getElementById('modalLoc').innerHTML = `📍 ${item.loc}`;
      document.getElementById('modalTime').textContent = item.time;
      const url = generateShareUrl(item);
      document.getElementById('shareUrl').innerHTML = `<strong>INDIVIDUAL PAGE:</strong><br><a href="${url}" target="_blank" style="color:var(--neon);">${url}</a>`;
      document.getElementById('itemModal').style.display = 'flex';
    }

    function copyShareLink() {
      if (!currentItem) return;
      navigator.clipboard.writeText(generateShareUrl(currentItem));
      alert("✅ Short individual link copied!");
    }

    function closeItemModal() { document.getElementById('itemModal').style.display = 'none'; }

    async function startGlobalScan() {
      log("🌐 INITIALIZING GLOBAL INTERNET SCAN...");
      const sources = ["Tor Exit Node • DE","Public Webcam • Tokyo","Lost Phone • NYC","Open IoT • Brazil","GitHub Leak • RU","Dark Mirror • Unknown","Satellite Feed • Pacific","5G Mesh • Berlin"];

      for (let i = 0; i < 18; i++) {
        await new Promise(r => setTimeout(r, 160));
        const newNode = {
          id: `RD-${1000 + Math.floor(Math.random()*8999)}`,
          name: ["Lost Drone","Found Wallet","Exposed Server","Abandoned Laptop","Mysterious Package","Open Security Cam"][Math.floor(Math.random()*6)],
          loc: sources[Math.floor(Math.random()*sources.length)],
          time: new Date(Date.now() - Math.random()*86400000*3).toLocaleString(),
          status: Math.random() > 0.7 ? "ACTIVE" : "PINGING",
          source: "PUBLIC MESH"
        };
        allNodes.unshift(newNode);
        renderNodes();
        log(`📡 NEW NODE → ${newNode.name}`);
      }
      log("✅ GLOBAL SCAN COMPLETE");
    }

    function showReportModal() { document.getElementById('reportModal').style.display = 'flex'; }
    function closeReportModal() { document.getElementById('reportModal').style.display = 'none'; }

    function submitReport() {
      const name = document.getElementById('rName').value.trim();
      const loc = document.getElementById('rLoc').value.trim();
      if (!name || !loc) return alert("Name and location required");
      const newItem = { id:`RD-${1000+Math.floor(Math.random()*9000)}`, name, loc, time:"Just now", status:"BROADCAST", source:"USER REPORT" };
      allNodes.unshift(newItem);
      renderNodes();
      closeReportModal();
      log("🚨 REPORT BROADCAST SUCCESSFULLY");
    }

    function filterNodes() {
      const q = document.getElementById('searchInput').value.toLowerCase();
      renderNodes(allNodes.filter(n => n.name.toLowerCase().includes(q) || n.loc.toLowerCase().includes(q)));
    }

    function setTab(n) {
      document.querySelectorAll('.nav button').forEach((b,i) => b.classList.toggle('active', i===n));
    }

    // Direct Link Handler (always works for individual page)
    function handleDirectLink() {
      const hash = location.hash.slice(1);
      if (!hash) return;

      const interval = setInterval(() => {
        const item = allNodes.find(n => n.id === hash);
        if (item) {
          showItemDetail(item);
          clearInterval(interval);
        }
      }, 200);
    }

    window.onload = () => {
      startGlobalScan();
      setTimeout(handleDirectLink, 600);
    };
  </script>
</body>
</html>
