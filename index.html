<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>AI Chat · OpenAI</title>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-2: #334155;
      --accent: #3b82f6;
      --text: #f8fafc;
      --muted: #94a3b8;
      --user: #1d4ed8;
      --bot: #1e293b;
      --border: #334155;
      --radius: 20px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;
    }
    body {
      display: flex;
      flex-direction: column;
      min-height: 100dvh;
      padding-top: env(safe-area-inset-top);
    }
    header {
      background: rgba(30, 41, 59, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 0.75rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .logo {
      width: 32px; height: 32px;
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      border-radius: 8px;
      display: grid; place-items: center;
      font-weight: 700;
    }
    h1 { font-size: 1.1rem; font-weight: 600; }
    button {
      background: var(--surface-2);
      border: none;
      color: var(--text);
      border-radius: 10px;
      padding: 0.45rem 0.75rem;
      font-size: 0.85rem;
    }
    button.primary { background: var(--accent); color: white; }
    button:disabled { opacity: 0.4; }
    #status {
      font-size: 0.75rem;
      color: var(--muted);
      text-align: center;
      padding: 0.3rem;
      background: var(--surface);
    }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      -webkit-overflow-scrolling: touch;
    }
    .msg {
      max-width: 85%;
      padding: 0.7rem 0.9rem;
      border-radius: var(--radius);
      line-height: 1.45;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .user {
      align-self: flex-end;
      background: var(--user);
      color: white;
      border-bottom-right-radius: 6px;
    }
    .bot {
      align-self: flex-start;
      background: var(--bot);
      border: 1px solid var(--border);
      border-bottom-left-radius: 6px;
    }
    .empty {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: var(--muted);
      padding: 2rem;
    }
    .empty h2 { color: var(--text); font-size: 1.4rem; margin-bottom: 0.4rem; }
    .input-bar {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 0.7rem 1rem;
      padding-bottom: calc(0.7rem + env(safe-area-inset-bottom));
      display: flex;
      gap: 0.5rem;
      align-items: flex-end;
    }
    #input {
      flex: 1;
      resize: none;
      min-height: 48px;
      max-height: 120px;
      padding: 0.7rem 0.9rem;
      font-family: inherit;
      font-size: 1rem;
      background: var(--surface-2);
      border: 1px solid transparent;
      color: var(--text);
      border-radius: var(--radius);
    }
    #input:focus { outline: none; border-color: var(--accent); }
    #send {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: var(--accent);
      color: white;
      font-size: 1.3rem;
      display: grid;
      place-items: center;
    }
  </style>
</head>
<body>
  <header>
    <div style="display:flex;align-items:center;gap:0.6rem">
      <div class="logo">AI</div>
      <h1>AI Chat</h1>
    </div>
    <button id="authBtn">Sign in</button>
  </header>

  <div id="status">Connecting…</div>

  <div id="chat">
    <div class="empty" id="empty">
      <div>
        <h2>OpenAI Chat</h2>
        <p>History saved in Firestore<br>Calls OpenAI API directly</p>
      </div>
    </div>
  </div>

  <div class="input-bar">
    <textarea id="input" placeholder="Message" rows="1"></textarea>
    <button id="send">↑</button>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import { getFirestore, collection, addDoc, query, orderBy, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    // ===== REPLACE THIS =====
    const OPENAI_API_KEY = "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";
    const OPENAI_MODEL = "gpt-4o-mini";   // or "gpt-4o", "gpt-3.5-turbo", etc.
    // ========================

    // Your existing Firebase config
    const firebaseConfig = {
      apiKey: "AIzaSyBvcCBsPiMxS7G2evPjM7sANp-zSy_RkKM",
      authDomain: "rootdonate-61e61.firebaseapp.com",
      databaseURL: "https://rootdonate-61e61-default-rtdb.firebaseio.com",
      projectId: "rootdonate-61e61",
      storageBucket: "rootdonate-61e61.firebasestorage.app",
      messagingSenderId: "754240963907",
      appId: "1:754240963907:web:5417c2763d8f02108bdbf6",
      measurementId: "G-0SC5R5ELT1"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const chat = document.getElementById("chat");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const authBtn = document.getElementById("authBtn");
    const statusEl = document.getElementById("status");
    let empty = document.getElementById("empty");

    let currentUser = null;
    let unsubscribe = null;

    const setStatus = t => statusEl.textContent = t;

    function addMessage(text, role) {
      if (empty) { empty.remove(); empty = null; }
      const div = document.createElement("div");
      div.className = "msg " + role;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    function clearChat() {
      chat.innerHTML = "";
      const d = document.createElement("div");
      d.className = "empty";
      d.id = "empty";
      d.innerHTML = `<div><h2>OpenAI Chat</h2><p>History saved in Firestore<br>Calls OpenAI API directly</p></div>`;
      chat.appendChild(d);
      empty = d;
    }

    function listenToMessages(uid) {
      if (unsubscribe) unsubscribe();
      const q = query(collection(db, "chats", uid, "messages"), orderBy("createdAt"));
      unsubscribe = onSnapshot(q, snap => {
        chat.innerHTML = "";
        empty = null;
        if (snap.empty) {
          clearChat();
          return;
        }
        snap.forEach(doc => {
          const data = doc.data();
          addMessage(data.text, data.role);
        });
      });
    }

    onAuthStateChanged(auth, user => {
      currentUser = user;
      if (user) {
        authBtn.textContent = "Signed in";
        setStatus("Ready");
        listenToMessages(user.uid);
      } else {
        authBtn.textContent = "Sign in";
        setStatus("Sign in to save history");
        clearChat();
      }
    });

    authBtn.addEventListener("click", async () => {
      if (!currentUser) {
        try {
          await signInAnonymously(auth);
        } catch (err) {
          setStatus("Auth error: " + err.message);
        }
      }
    });

    async function callOpenAI(userMessage) {
      const response = await fetch("https://api.openai.com/v1/chat/completions", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${OPENAI_API_KEY}`
        },
        body: JSON.stringify({
          model: OPENAI_MODEL,
          messages: [
            { role: "system", content: "You are a helpful assistant." },
            { role: "user", content: userMessage }
          ],
          temperature: 0.7
        })
      });

      if (!response.ok) {
        const errText = await response.text();
        throw new Error(`OpenAI error ${response.status}: ${errText}`);
      }

      const data = await response.json();
      return data.choices?.[0]?.message?.content || "(no response)";
    }

    async function send() {
      if (!currentUser) {
        setStatus("Sign in first");
        return;
      }
      const text = input.value.trim();
      if (!text) return;

      if (!OPENAI_API_KEY || OPENAI_API_KEY.includes("YOUR_OPENAI")) {
        setStatus("Set your OpenAI API key in the code");
        return;
      }

      sendBtn.disabled = true;
      input.value = "";
      input.style.height = "auto";
      setStatus("Thinking…");

      // Save user message
      await addDoc(collection(db, "chats", currentUser.uid, "messages"), {
        text,
        role: "user",
        createdAt: serverTimestamp()
      });

      try {
        const reply = await callOpenAI(text);

        // Save assistant message
        await addDoc(collection(db, "chats", currentUser.uid, "messages"), {
          text: reply,
          role: "bot",
          createdAt: serverTimestamp()
        });
        setStatus("Ready");
      } catch (err) {
        console.error(err);
        setStatus("Error: " + (err.message || err));
        await addDoc(collection(db, "chats", currentUser.uid, "messages"), {
          text: "Error: " + (err.message || err),
          role: "bot",
          createdAt: serverTimestamp()
        });
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    }

    sendBtn.addEventListener("click", send);
    input.addEventListener("keydown", e => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    });
    input.addEventListener("input", () => {
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 120) + "px";
    });
  </script>
</body>
</html>
