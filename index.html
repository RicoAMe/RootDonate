<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Root Donate</title>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>

  <!-- Stripe.js (optional – only needed if you switch to client-side Elements) -->
  <script src="https://js.stripe.com/v3/"></script>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #00ff9d;
      --accent: #ff00aa;
      --bg: #0a0a0f;
      --card: #111118;
      --border: #222226;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: #e0e0e0;
      min-height: 100dvh;
      padding: 20px 12px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .container {
      max-width: 420px;
      width: 100%;
      background: var(--card);
      border-radius: 28px;
      border: 1px solid var(--border);
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0, 255, 157, 0.1);
      margin-top: 20px;
    }

    .header {
      background: linear-gradient(135deg, #00ff9d 0%, #ff00aa 100%);
      color: #000;
      padding: 28px 24px 24px;
      text-align: center;
    }

    .header h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.9rem;
      font-weight: 700;
      letter-spacing: -1px;
    }

    .profile-name {
      font-size: 1.3rem;
      font-weight: 700;
      margin-top: 10px;
    }

    .content {
      padding: 24px;
    }

    .debit-card {
      width: 100%;
      height: 210px;
      background: linear-gradient(145deg, #1c1c1c, #0d0d0d);
      border-radius: 16px;
      position: relative;
      color: white;
      margin-bottom: 24px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.5);
      overflow: hidden;
    }

    .debit-card::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(105deg, transparent 40%, rgba(255, 255, 255, 0.04) 50%, transparent 60%);
    }

    .chip {
      position: absolute;
      top: 24px;
      left: 24px;
      width: 44px;
      height: 34px;
      background: linear-gradient(135deg, #c9a227, #e8d48b);
      border-radius: 5px;
    }

    .card-logo {
      position: absolute;
      top: 22px;
      right: 24px;
      font-size: 20px;
      font-weight: 700;
    }

    .card-number {
      position: absolute;
      top: 95px;
      left: 24px;
      font-size: 19px;
      letter-spacing: 3px;
    }

    .card-handle {
      position: absolute;
      bottom: 52px;
      left: 24px;
      font-size: 15px;
      font-weight: 600;
    }

    .card-bottom {
      position: absolute;
      bottom: 20px;
      left: 24px;
      right: 24px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      font-size: 12px;
      opacity: 0.85;
    }

    .visa {
      font-size: 24px;
      font-weight: 800;
      font-style: italic;
    }

    .amount-btns {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin: 16px 0 24px;
    }

    .amount-btns button {
      background: #1f1f26;
      border: 1px solid #333;
      color: white;
      border-radius: 12px;
      padding: 14px;
      font-weight: 700;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
    }

    .amount-btns button.active {
      background: var(--primary);
      color: #000;
    }

    .btn {
      width: 100%;
      padding: 17px;
      border: none;
      border-radius: 14px;
      font-size: 1.1rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 10px;
      transition: transform 0.2s, opacity 0.2s;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .donate-btn {
      background: var(--primary);
      color: #000;
    }

    .share-btn {
      background: #1f1f26;
      color: white;
      border: 1px solid #333;
      margin-top: 16px;
    }

    .toast {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      background: #111;
      color: var(--primary);
      padding: 14px 28px;
      border-radius: 999px;
      font-weight: 700;
      display: none;
      z-index: 999;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
    }

    .total {
      text-align: center;
      margin-bottom: 16px;
      font-size: 1.1rem;
      color: #aaa;
    }

    .total span {
      color: var(--primary);
      font-weight: 700;
      font-size: 1.4rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Root Donate</h1>
      <div class="profile-name" id="profileName">Loading...</div>
    </div>

    <div class="content">
      <!-- Visual card only – decoration -->
      <div class="debit-card">
        <div class="chip"></div>
        <div class="card-logo">𝕏 Money</div>
        <div class="card-number" id="cardNumber">•••• •••• •••• ----</div>
        <div class="card-handle" id="cardHandle">@handle</div>
        <div class="card-bottom">
          <div>
            <div style="font-size: 10px; opacity: 0.7;">VALID THRU</div>
            <div>09/29</div>
          </div>
          <div class="visa">VISA</div>
        </div>
      </div>

      <div class="total">
        Total Raised: <span id="totalRaised">$0</span>
      </div>

      <div class="amount-btns" id="amountGrid">
        <button type="button" data-amount="5" class="active">$5</button>
        <button type="button" data-amount="10">$10</button>
        <button type="button" data-amount="25">$25</button>
      </div>

      <button class="btn donate-btn" id="donateBtn" type="button">
        Donate $<span id="amountDisplay">5</span>
      </button>

      <button class="btn share-btn" id="shareBtn" type="button">
        🔗 Share My Profile Link
      </button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // ========== REPLACE WITH YOUR FIREBASE CONFIG ==========
    const firebaseConfig = {
      apiKey: "AIzaSyBvcCBsPiMxS7G2evPjM7sANp-zSy_RkKM",
      authDomain: "rootdonate-61e61.firebaseapp.com",
      databaseURL: "https://rootdonate-61e61-default-rtdb.firebaseio.com",
      projectId: "rootdonate-61e61",
      storageBucket: "rootdonate-61e61.firebasestorage.app",
      messagingSenderId: "754240963907",
      appId: "1:754240963907:web:5417c2763d8f02108bdbf6",
      measurementId: "G-0SC5R5ELT1"
    };
    // =======================================================

    // ========== REPLACE WITH YOUR STRIPE PUBLISHABLE KEY (optional) ==========
    // const stripe = Stripe("pk_test_your_key_here"); // or pk_live_...
    // Currently unused – checkout is handled by Cloud Function redirect.
    // ========================================================================

    // ========== REPLACE WITH YOUR CLOUD FUNCTION URL ==========
    // Example: "https://us-central1-your-project.cloudfunctions.net/createCheckoutSession"
    const CREATE_CHECKOUT_URL = "https://YOUR_CLOUD_FUNCTION_URL_HERE";
    // ==========================================================

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let currentAmount = 5;
    let currentUser = null;
    let userDocRef = null;
    let profile = {};
    let isViewingShared = false;

    function showToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.style.display = "block";
      setTimeout(() => {
        t.style.display = "none";
      }, 3500);
    }

    function setAmount(amount, button) {
      currentAmount = amount;
      document.getElementById("amountDisplay").textContent = amount;

      document.querySelectorAll("#amountGrid button").forEach((btn) => {
        btn.classList.remove("active");
      });

      if (button) {
        button.classList.add("active");
      }
    }

    function updateCardUI() {
      document.getElementById("profileName").textContent =
        profile.name || profile.handle || "User";
      document.getElementById("cardHandle").textContent =
        profile.handle || "@user";
      document.getElementById("cardNumber").textContent =
        `•••• •••• •••• ${profile.last4 || "0000"}`;
      document.getElementById("totalRaised").textContent =
        "$" + (profile.totalRaised || 0);
    }

    async function initUser() {
      auth.onAuthStateChanged(async (user) => {
        if (user) {
          currentUser = user;
          userDocRef = db.collection("users").doc(user.uid);

          const doc = await userDocRef.get();

          if (doc.exists) {
            profile = doc.data();
          } else {
            const last4 = Math.floor(1000 + Math.random() * 9000).toString();
            profile = {
              name: "User" + user.uid.slice(0, 5),
              handle: "@user" + user.uid.slice(0, 5),
              last4: last4,
              totalRaised: 0,
              createdAt: firebase.firestore.FieldValue.serverTimestamp()
            };
            await userDocRef.set(profile);
          }

          // Only overwrite UI with own profile if not viewing a shared link
          if (!isViewingShared) {
            updateCardUI();
          }

          // Check if returning from successful payment
          const params = new URLSearchParams(window.location.search);
          if (params.get("success") === "true") {
            showToast("✅ Payment successful! Thank you for your donation.");

            // Refresh total from Firestore (webhook should already have updated it)
            const fresh = await userDocRef.get();
            if (fresh.exists) {
              profile = fresh.data();
              updateCardUI();
            }

            // Clean URL
            window.history.replaceState({}, document.title, window.location.pathname);
          }
        } else {
          try {
            await auth.signInAnonymously();
          } catch (err) {
            console.error("Anonymous sign-in failed:", err);
            showToast("Authentication error. Please refresh.");
          }
        }
      });
    }

    async function startDonation() {
      if (!currentUser || !userDocRef) {
        showToast("Please wait a moment...");
        return;
      }

      if (isViewingShared) {
        showToast("This is a shared view. Open your own profile to donate.");
        return;
      }

      const btn = document.getElementById("donateBtn");
      btn.disabled = true;
      btn.textContent = "Redirecting to secure payment...";

      try {
        const response = await fetch(CREATE_CHECKOUT_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            amount: currentAmount * 100, // cents
            userId: currentUser.uid,
            handle: profile.handle || "donor"
          })
        });

        const data = await response.json();

        if (data.url) {
          window.location.href = data.url; // Redirect to Stripe Checkout
        } else {
          throw new Error(data.error || "Failed to create checkout session");
        }
      } catch (err) {
        console.error(err);
        showToast("Something went wrong. Please try again.");
        btn.disabled = false;
        btn.innerHTML = `Donate $<span id="amountDisplay">${currentAmount}</span>`;
      }
    }

    function shareProfile() {
      if (!profile.handle) {
        showToast("Profile not ready yet.");
        return;
      }

      const data = {
        name: profile.name,
        handle: profile.handle,
        last4: profile.last4,
        totalRaised: profile.totalRaised || 0
      };

      const encoded = btoa(JSON.stringify(data));
      const shareLink = `${window.location.origin}${window.location.pathname}?p=${encoded}`;

      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(shareLink)
          .then(() => showToast("✅ Profile link copied!"))
          .catch(() => prompt("Copy this link:", shareLink));
      } else {
        prompt("Copy this link:", shareLink);
      }
    }

    // Load shared profile from URL (view-only mode)
    function loadFromURL() {
      const params = new URLSearchParams(window.location.search);
      const encoded = params.get("p");

      if (!encoded) return;

      try {
        const decoded = JSON.parse(atob(encoded));
        isViewingShared = true;

        document.getElementById("profileName").textContent =
          decoded.name || decoded.handle || "User";
        document.getElementById("cardHandle").textContent =
          decoded.handle || "@user";
        document.getElementById("cardNumber").textContent =
          `•••• •••• •••• ${decoded.last4 || "0000"}`;
        document.getElementById("totalRaised").textContent =
          "$" + (decoded.totalRaised || 0);

        // Disable donation on shared views (no userId available)
        const donateBtn = document.getElementById("donateBtn");
        donateBtn.disabled = true;
        donateBtn.textContent = "Viewing shared profile";
      } catch (e) {
        console.warn("Invalid shared profile data");
      }
    }

    // Event listeners
    document.getElementById("amountGrid").addEventListener("click", (e) => {
      const btn = e.target.closest("button[data-amount]");
      if (btn) {
        setAmount(Number(btn.dataset.amount), btn);
      }
    });

    document.getElementById("donateBtn").addEventListener("click", startDonation);
    document.getElementById("shareBtn").addEventListener("click", shareProfile);

    // Initialize
    loadFromURL();
    initUser();
  </script>
</body>
</html>
