<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a1f2f">
  <title>ROOT DONATE • Global Discovery</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

  <style>
    :root {
      --primary: #00b894;
      --accent: #00d2a0;
      --dark: #0a1f2f;
      --card: #13293d;
      --text: #e0f2f1;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--dark);
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }
    .header { padding: 16px 20px; background: rgba(10,31,47,0.98); border-bottom: 1px solid #1e3a5f; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
    .header h1 { font-size: 1.65rem; font-weight: 600; letter-spacing: 1px; }
    .user-info { display: flex; align-items: center; gap: 10px; cursor: pointer; }
    .search-container { position: relative; margin: 16px 20px; }
    .search-bar { width: 100%; padding: 16px 20px 16px 52px; background: #1e3a5f; border: 1px solid #00b894; border-radius: 50px; color: white; font-size: 1.05rem; outline: none; }
    .search-bar::placeholder { color: #88a5b8; }
    .suggestions { position: absolute; top: 100%; left: 0; right: 0; background: #13293d; border: 1px solid #00b894; border-radius: 16px; margin-top: 8px; max-height: 420px; overflow-y: auto; z-index: 200; box-shadow: 0 10px 30px rgba(0,0,0,0.4); display: none; }
    .suggestion-item { padding: 14px 20px; display: flex; align-items: center; gap: 14px; cursor: pointer; border-bottom: 1px solid #1e3a5f; }
    .suggestion-item:hover { background: #1e3a5f; }
    .nodes-grid { padding: 0 20px 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 16px; }
    .place-card { background: var(--card); border: 1px solid #1e3a5f; border-radius: 16px; padding: 20px; cursor: pointer; transition: all 0.3s ease; }
    .place-card:hover { transform: translateY(-6px); border-color: var(--primary); box-shadow: 0 10px 25px rgba(0,184,148,0.2); }
    .impact-bar { height: 6px; background: #1e3a5f; border-radius: 10px; margin-top: 8px; overflow: hidden; }
    .impact-fill { height: 100%; background: linear-gradient(90deg, #00b894, #00d2a0); transition: width 0.4s ease; }
    .modal { display: none; position: fixed; inset: 0; background: rgba(10,31,47,0.97); z-index: 1000; align-items: center; justify-content: center; padding: 16px; }
    .modal-content { background: #13293d; border-radius: 20px; width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto; padding: 24px; border: 1px solid #00b894; }
    .history-item { background: #1e3a5f; padding: 12px; border-radius: 10px; margin-bottom: 10px; }
    button.primary { background: var(--primary); color: #000; border: none; padding: 14px; border-radius: 50px; font-weight: 600; width: 100%; margin: 12px 0; font-size: 1.1rem; }
    .apple-pay-btn { background: #000; color: white; border: 1px solid white; padding: 14px; border-radius: 12px; display: flex; align-items: center; justify-content: center; gap: 10px; font-size: 1.1rem; width: 100%; }
    .log { position: fixed; bottom: 0; left: 0; right: 0; height: 140px; background: #0a1f2f; padding: 12px 20px; font-size: 0.9rem; overflow-y: auto; border-top: 1px solid #1e3a5f; }
    .stats { display: flex; justify-content: space-around; background: #1e3a5f; padding: 12px; border-radius: 12px; margin: 15px 0; }
    .auth-btn { padding: 8px 16px; background: #1e3a5f; border: 1px solid #00b894; color: white; border-radius: 50px; font-size: 0.95rem; }
  </style>
</head>
<body>

  <div class="header">
    <h1><i class="fas fa-globe"></i> ROOT DONATE</h1>
    <div style="display:flex; align-items:center; gap:12px;">
      <button onclick="showAuthModal()" id="authButton" class="auth-btn">Sign In</button>
      <div class="user-info" onclick="showProfile()" id="userInfo" style="display:none;">
        <div style="text-align:right;">
          <div id="usernameDisplay" style="font-weight:600;"></div>
          <div id="balanceDisplay" style="font-size:0.9rem;color:#00d2a0;"></div>
        </div>
        <i class="fas fa-user-circle" style="font-size:2rem;color:#00b894;"></i>
      </div>
    </div>
  </div>

  <div class="search-container">
    <input type="text" id="searchInput" class="search-bar" placeholder="Search any place on Earth..." onkeyup="handleSearch()" autocomplete="off">
    <div id="suggestions" class="suggestions"></div>
  </div>

  <div style="padding:0 20px 10px;">
    <div class="stats">
      <div><strong id="totalDonated">0</strong><br><small>TOTAL ROOT</small></div>
      <div><strong id="placesCount">0</strong><br><small>PLACES</small></div>
      <div><strong id="playerLevel">1</strong><br><small>LEVEL</small></div>
    </div>
  </div>

  <div class="nodes-grid" id="grid"></div>
  <div class="log" id="log"></div>

  <!-- Modals (unchanged) -->
  <div id="placeModal" class="modal"> ... </div>
  <div id="donateModal" class="modal"> ... </div>
  <div id="profileModal" class="modal"> ... </div>
  <div id="authModal" class="modal"> ... </div>

  <script>
    // ==================== FIREBASE CONFIG ====================
    const firebaseConfig = { /* your config */ };
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let currentUser = null;
    let places = [];
    let currentPlace = null;

    const logEl = document.getElementById('log');
    function log(msg) {
      const time = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
      logEl.innerHTML += `<span style="opacity:0.6">[${time}]</span> ${msg}<br>`;
      logEl.scrollTop = logEl.scrollHeight;
    }

    // ==================== AUTH & USER CREATION ====================
    let isLoginMode = false;

    function showAuthModal() { document.getElementById('authModal').style.display = 'flex'; isLoginMode = false; updateAuthUI(); }
    function closeAuthModal() { document.getElementById('authModal').style.display = 'none'; }
    function updateAuthUI() {
      document.getElementById('authSubmitBtn').textContent = isLoginMode ? "Sign In" : "Sign Up";
      document.getElementById('toggleBtn').textContent = isLoginMode ? "Need an account? Sign Up" : "Already have an account? Sign In";
    }
    function toggleAuthMode() { isLoginMode = !isLoginMode; updateAuthUI(); }

    async function handleAuth() {
      const email = document.getElementById('emailInput').value.trim();
      const password = document.getElementById('passwordInput').value;
      if (!email || !password) return alert("Please fill all fields");

      try {
        const userCredential = isLoginMode 
          ? await auth.signInWithEmailAndPassword(email, password)
          : await auth.createUserWithEmailAndPassword(email, password);
        
        currentUser = userCredential.user;
        await createUserProfileIfNotExists();
        closeAuthModal();
        initUser();
      } catch (e) { alert("Error: " + e.message); }
    }

    async function createUserProfileIfNotExists() {
      const userRef = db.collection("users").doc(currentUser.uid);
      const doc = await userRef.get();
      if (!doc.exists) {
        await userRef.set({
          handle: "@" + currentUser.email.split('@')[0],
          balance: 12450,
          totalDonated: 0
        });
      }
    }

    function logout() { auth.signOut().then(() => location.reload()); }

    // ==================== INIT USER ====================
    async function initUser() {
      document.getElementById('authButton').style.display = 'none';
      document.getElementById('userInfo').style.display = 'flex';
      document.getElementById('usernameDisplay').textContent = currentUser.email.split('@')[0];

      loadPlaces();
      log("✅ Signed in successfully • Welcome back, Explorer!");
    }

    // ==================== SEVEN WONDERS STARTER PLACES ====================
    const sevenWonders = [
      { name: "Great Pyramid of Giza", loc: "Giza, Egypt", icon: "🪦" },
      { name: "Hanging Gardens of Babylon", loc: "Al Hillah, Iraq", icon: "🌳" },
      { name: "Statue of Zeus at Olympia", loc: "Olympia, Greece", icon: "🗿" },
      { name: "Temple of Artemis at Ephesus", loc: "Selçuk, Turkey", icon: "🏛️" },
      { name: "Mausoleum at Halicarnassus", loc: "Bodrum, Turkey", icon: "🏛️" },
      { name: "Colossus of Rhodes", loc: "Rhodes, Greece", icon: "🗿" },
      { name: "Lighthouse of Alexandria", loc: "Alexandria, Egypt", icon: "🏮" }
    ];

    async function loadPlaces() {
      const snap = await db.collection("places").get();
      places = snap.docs.map(doc => ({ id: doc.id, ...doc.data() }));

      // Add Seven Wonders if no places exist
      if (places.length === 0) {
        for (const w of sevenWonders) {
          const newPlace = {
            id: `wonder_${Date.now()}_${Math.random().toString(36).slice(2)}`,
            name: w.name,
            loc: w.loc,
            icon: w.icon,
            donations: [],
            impact: 0
          };
          await savePlace(newPlace);
          places.push(newPlace);
        }
        log("🌟 Seven Wonders of the World added as starters");
      }

      renderPlaces();
    }

    async function savePlace(place) {
      await db.collection("places").doc(place.id).set({
        ...place,
        updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      }, { merge: true });
    }

    // ==================== REST OF YOUR FUNCTIONS (Search, Donate, Profile, etc.) ====================
    // ... (keep all your existing functions: handleSearch, renderPlaces, showPlaceDetail, confirmDonation, applePayDonate, showProfile, topUpBalance, copyShareLink, loadFromHash, etc.)

    // Make sure topUpBalance and showProfile are exactly as in the previous version

    // INIT
    auth.onAuthStateChanged(user => {
      if (user) {
        currentUser = user;
        initUser();
      } else {
        document.getElementById('authButton').style.display = 'block';
        document.getElementById('userInfo').style.display = 'none';
      }
    });

    window.onload = () => { loadFromHash(); };
  </script>
</body>
</html>
