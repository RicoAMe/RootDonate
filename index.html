<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
  <meta name="theme-color" content="#0f172a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Local AI</title>
  <style>
    :root {
      --bg: #0f172a;
      --surface: #1e293b;
      --surface-2: #334155;
      --accent: #22c55e;
      --accent-soft: rgba(34, 197, 94, 0.18);
      --text: #f8fafc;
      --text-secondary: #cbd5e1;
      --text-muted: #94a3b8;
      --user: #14532d;
      --bot: #1e293b;
      --border: #334155;
      --radius: 18px;
      --radius-sm: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      overscroll-behavior: none;
    }
    body {
      display: flex;
      flex-direction: column;
      min-height: 100dvh;
      padding-top: env(safe-area-inset-top);
    }
    header {
      background: rgba(30, 41, 59, 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--border);
      padding: 0.7rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.75rem;
      position: sticky;
      top: 0;
      z-index: 20;
    }
    .brand { display: flex; align-items: center; gap: 0.65rem; }
    .logo {
      width: 34px; height: 34px;
      background: linear-gradient(135deg, #22c55e, #3b82f6);
      border-radius: 9px;
      display: grid; place-items: center;
      font-weight: 700; font-size: 0.95rem; flex-shrink: 0;
    }
    header h1 { font-size: 1.12rem; font-weight: 600; letter-spacing: -0.02em; }
    .header-actions { display: flex; gap: 0.5rem; align-items: center; }
    select, button {
      background: var(--surface-2);
      border: none;
      color: var(--text);
      border-radius: var(--radius-sm);
      font-size: 0.88rem;
      font-weight: 500;
    }
    select { padding: 0.5rem 0.7rem; max-width: 160px; }
    button { padding: 0.52rem 0.85rem; cursor: pointer; }
    button.primary { background: var(--accent); color: #052e16; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    #progress { height: 3px; background: var(--surface-2); display: none; }
    #progress > div { height: 100%; background: var(--accent); width: 0%; transition: width 0.2s ease; }
    #status {
      font-size: 0.78rem;
      color: var(--text-muted);
      text-align: center;
      padding: 0.35rem 1rem;
      background: var(--surface);
    }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 1rem 1rem 0.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.7rem;
      -webkit-overflow-scrolling: touch;
    }
    .msg {
      max-width: 86%;
      padding: 0.72rem 0.95rem;
      border-radius: var(--radius);
      line-height: 1.45;
      font-size: 0.96rem;
      word-wrap: break-word;
      white-space: pre-wrap;
    }
    .msg.user {
      align-self: flex-end;
      background: var(--user);
      color: white;
      border-bottom-right-radius: 6px;
    }
    .msg.bot {
      align-self: flex-start;
      background: var(--bot);
      border: 1px solid var(--border);
      border-bottom-left-radius: 6px;
    }
    .empty {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem 1.25rem;
      color: var(--text-secondary);
    }
    .empty h2 {
      color: var(--text);
      font-size: 1.45rem;
      font-weight: 600;
      margin-bottom: 0.45rem;
      letter-spacing: -0.02em;
    }
    .empty p { font-size: 0.88rem; line-height: 1.5; }
    .input-bar {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 0.7rem 1rem;
      padding-bottom: calc(0.7rem + env(safe-area-inset-bottom));
      display: flex;
      gap: 0.5rem;
      align-items: flex-end;
    }
    #input {
      flex: 1;
      resize: none;
      min-height: 48px;
      max-height: 140px;
      padding: 0.72rem 0.95rem;
      font-family: inherit;
      font-size: 1rem;
      background: var(--surface-2);
      border: 1px solid transparent;
      color: var(--text);
      border-radius: var(--radius);
      line-height: 1.4;
    }
    #input:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }
    #send {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      flex-shrink: 0;
      font-size: 1.25rem;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <div class="logo">∞</div>
      <h1>Local AI</h1>
    </div>
    <div class="header-actions">
      <select id="modelSelect"></select>
      <button id="loadBtn" class="primary">Load</button>
    </div>
  </header>

  <div id="progress"><div></div></div>
  <div id="status">Scanning cache…</div>

  <div id="chat">
    <div class="empty" id="empty">
      <div>
        <h2>Use cached models</h2>
        <p>Models marked ✅ are already downloaded<br>and load instantly with no network.</p>
      </div>
    </div>
  </div>

  <div class="input-bar">
    <textarea id="input" placeholder="Message" rows="1" disabled></textarea>
    <button id="send" class="primary" disabled>↑</button>
  </div>

  <script type="module">
    import { CreateMLCEngine, hasModelInCache, prebuiltAppConfig } from "https://esm.run/@mlc-ai/web-llm";

    const MODELS = [
      { id: "Llama-3.2-1B-Instruct-q4f32_1-MLC", name: "Llama 3.2 1B" },
      { id: "Llama-3.2-3B-Instruct-q4f32_1-MLC", name: "Llama 3.2 3B" },
      { id: "Phi-3.5-mini-instruct-q4f16_1-MLC", name: "Phi-3.5 Mini" },
      { id: "gemma-2-2b-it-q4f16_1-MLC", name: "Gemma 2 2B" },
      { id: "Qwen2.5-1.5B-Instruct-q4f16_1-MLC", name: "Qwen 1.5B" },
      { id: "Qwen2.5-3B-Instruct-q4f16_1-MLC", name: "Qwen 3B" },
      { id: "SmolLM2-360M-Instruct-q4f16_1-MLC", name: "SmolLM2 360M" }
    ];

    const chat = document.getElementById("chat");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const loadBtn = document.getElementById("loadBtn");
    const modelSelect = document.getElementById("modelSelect");
    const statusEl = document.getElementById("status");
    const progressBar = document.getElementById("progress");
    const progressFill = progressBar.querySelector("div");
    let empty = document.getElementById("empty");

    let engine = null;
    let messages = [];
    let isGenerating = false;

    function setStatus(text) {
      statusEl.textContent = text;
    }

    function setProgress(percent) {
      progressBar.style.display = "block";
      progressFill.style.width = percent + "%";
      if (percent >= 100) {
        setTimeout(() => { progressBar.style.display = "none"; }, 400);
      }
    }

    function addMessage(text, role) {
      if (empty) {
        empty.remove();
        empty = null;
      }
      const div = document.createElement("div");
      div.className = `msg ${role}`;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    function updateBubble(div, text) {
      div.textContent = text;
      chat.scrollTop = chat.scrollHeight;
    }

    async function scanCache() {
      modelSelect.innerHTML = "";
      setStatus("Scanning cache…");

      // Parallel cache checks for speed
      const results = await Promise.all(
        MODELS.map(async (model) => {
          try {
            const cached = await hasModelInCache(model.id, prebuiltAppConfig);
            return { ...model, cached };
          } catch {
            return { ...model, cached: false };
          }
        })
      );

      // Sort cached models first
      results.sort((a, b) => (b.cached - a.cached));

      let cachedCount = 0;
      for (const model of results) {
        if (model.cached) cachedCount++;
        const option = document.createElement("option");
        option.value = model.id;
        option.textContent = (model.cached ? "✅ " : "⬇️ ") + model.name;
        modelSelect.appendChild(option);
      }

      setStatus(cachedCount
        ? `${cachedCount} model${cachedCount > 1 ? "s" : ""} ready in cache`
        : "No cached models — first load will download");
    }

    async function loadModel() {
      if (engine) {
        try { await engine.unload(); } catch {}
        engine = null;
      }
      const modelId = modelSelect.value;
      const isCached = modelSelect.selectedOptions[0]?.textContent.startsWith("✅");

      loadBtn.disabled = true;
      input.disabled = true;
      sendBtn.disabled = true;
      setStatus(isCached ? "Loading from cache…" : "Downloading…");
      setProgress(isCached ? 50 : 0);

      try {
        engine = await CreateMLCEngine(modelId, {
          initProgressCallback: (info) => {
            const percent = Math.round((info.progress || 0) * 100);
            setProgress(percent);
            setStatus(info.text || (isCached ? "Loading…" : `Downloading ${percent}%`));
          }
        });
        setStatus("Ready · " + (isCached ? "from cache" : "downloaded"));
        setProgress(100);
        input.disabled = false;
        sendBtn.disabled = false;
        input.focus();
        setTimeout(scanCache, 300);
      } catch (err) {
        setStatus("Load failed: " + (err.message || String(err)));
        setProgress(0);
      } finally {
        loadBtn.disabled = false;
      }
    }

    async function send() {
      if (!engine || isGenerating) return;
      const text = input.value.trim();
      if (!text) return;

      isGenerating = true;
      sendBtn.disabled = true;
      input.disabled = true;

      addMessage(text, "user");
      messages.push({ role: "user", content: text });
      input.value = "";
      input.style.height = "auto";

      const botDiv = addMessage("…", "bot");
      let fullReply = "";

      try {
        const stream = await engine.chat.completions.create({
          messages,
          stream: true,
          temperature: 0.7,
          max_tokens: 2048
        });

        for await (const chunk of stream) {
          const delta = chunk.choices?.[0]?.delta?.content || "";
          if (delta) {
            fullReply += delta;
            updateBubble(botDiv, fullReply);
          }
        }

        if (!fullReply) fullReply = "(no response)";
        messages.push({ role: "assistant", content: fullReply });
        updateBubble(botDiv, fullReply);
        setStatus("Ready");
      } catch (err) {
        updateBubble(botDiv, "Error: " + (err.message || String(err)));
        setStatus("Generation error");
      } finally {
        isGenerating = false;
        sendBtn.disabled = false;
        input.disabled = false;
        input.focus();
      }
    }

    loadBtn.addEventListener("click", loadModel);
    sendBtn.addEventListener("click", send);

    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    });

    input.addEventListener("input", () => {
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 140) + "px";
    });

    if (!navigator.gpu) {
      setStatus("WebGPU required — open in Chrome or Edge");
      loadBtn.disabled = true;
    } else {
      scanCache();
    }
  </script>
</body>
</html>
