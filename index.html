<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b1220">
  <title>RootDonate</title>
  <script src="https://appleid.cdn-apple.com/appleauth/static/jsapi/appleid/1/en_US/appleid.auth.js"></script>
  <style>
    :root {
      --bg: #0b1220;
      --surface: rgba(21, 30, 46, 0.72);
      --surface-2: #1e293b;
      --accent: #22c55e;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --bot: rgba(30, 41, 59, 0.85);
      --border: rgba(51, 65, 85, 0.6);
      --radius: 20px;
      --red: #ef4444;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    }

    header {
      background: var(--surface);
      padding: 14px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(16px);
      flex-shrink: 0;
    }

    header strong {
      font-size: 1.15rem;
      color: var(--accent);
    }

    .header-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    #appleid-signin {
      width: 140px;
      height: 40px;
    }

    button {
      background: rgba(71, 85, 105, 0.7);
      color: #fff;
      border: none;
      padding: 8px 14px;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      min-height: 40px;
    }

    #log {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .entry {
      padding: 12px 16px;
      border-radius: var(--radius);
      background: var(--bot);
      border: 1px solid var(--border);
      white-space: pre-wrap;
    }

    .entry.scanner {
      border-left: 4px solid var(--accent);
      font-family: ui-monospace, Menlo, monospace;
    }

    .entry.user {
      align-self: flex-end;
      background: linear-gradient(135deg, var(--accent), #16a34a);
      color: #000;
      max-width: 80%;
    }

    .entry.ai { border-left: 4px solid #627eea; }
    .entry.priority { border-left: 4px solid var(--red); }

    .controls,
    .input-bar,
    .status-bar {
      padding: 10px 14px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }

    .controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .controls button { flex: 1; min-width: 90px; }

    #plate {
      flex: 2;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
    }

    .input-bar {
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    #input {
      flex: 1;
      padding: 12px 16px;
      border-radius: 24px;
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid transparent;
      resize: none;
      min-height: 48px;
      max-height: 120px;
    }

    #send {
      background: var(--accent);
      color: #000;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      font-size: 1.3rem;
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: var(--muted);
    }

    .wanted { color: var(--red); font-weight: bold; }
    #userInfo { font-size: 0.85rem; color: var(--accent); }
  </style>
</head>
<body>
  <header>
    <div>
      <strong>RootDonate<span style="font-size:0.65rem; background:#627eea; padding:2px 7px; border-radius:999px; margin-left:6px;">v3.1.9</span></strong>
      <small id="status">Channel 1 • Leonida Metro • AI Online</small>
    </div>
    <div class="header-actions">
      <span id="userInfo"></span>
      <div id="appleid-signin" data-color="black" data-border="true" data-type="sign in" data-border-radius="12"></div>
    </div>
  </header>

  <div id="log"></div>

  <div class="status-bar">
    <span>Wanted: <span id="wanted" class="wanted">0</span></span>
    <span id="units">Units: 12</span>
    <span id="aiStatus">AI Ready</span>
  </div>

  <div class="controls">
    <button id="scanBtn">Scan</button>
    <button id="priorityBtn">Priority</button>
    <input type="text" id="plate" placeholder="Plate lookup…" maxlength="8" autocomplete="off" autocapitalize="characters">
    <button id="lookupBtn">Lookup</button>
  </div>

  <div class="input-bar">
    <textarea id="input" placeholder="Ask the AI anything..." rows="1"></textarea>
    <button id="send">↑</button>
  </div>

  <script>
    const log = document.getElementById("log");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("send");
    const statusEl = document.getElementById("status");
    const aiStatus = document.getElementById("aiStatus");
    const wantedEl = document.getElementById("wanted");
    const unitsEl = document.getElementById("units");
    const plateInput = document.getElementById("plate");
    const userInfo = document.getElementById("userInfo");

    let muted = false;
    let wanted = 0;
    let isAI = false;
    let currentUser = null;

    // Apple Sign In (popup mode)
    AppleID.auth.init({
      clientId: "uk.co.donateroot.www",
      scope: "name email",
      redirectURI: window.location.origin,
      state: "vcpd-state-" + Date.now(),
      nonce: String(Date.now()),
      usePopup: true
    });

    document.addEventListener("AppleIDSignInOnSuccess", (event) => {
      const data = event.detail.data || event.detail;
      currentUser = {
        name: data.user?.name?.firstName || "Apple User",
        email: data.user?.email || "private relay"
      };
      updateUserUI();
      addEntry(`Signed in with Apple as ${currentUser.name}`, "scanner");
    });

    document.addEventListener("AppleIDSignInOnFailure", (event) => {
      const detail = event.detail || {};
      const err = detail.error || "Unknown error";
      addEntry(`Apple Sign-In failed: ${err}`, "priority");
      console.error("Apple Sign-In error:", detail);
    });

    function updateUserUI() {
      if (currentUser) {
        userInfo.textContent = `👤 ${currentUser.name}`;
        document.getElementById("appleid-signin").style.display = "none";
      }
    }

    const chatter = [
      { type: "scanner", text: "Dispatch: Unit 4-Adam-12, respond to disturbance at Ocean Drive, Vice City Beach." },
      { type: "scanner", text: "Air Support: Suspicious black Blista Compact heading north on Port Gellhorn Highway." },
      { type: "priority", text: "Code 3: Shots fired near Ambrosia. Multiple suspects fleeing. All units respond." },
      { type: "scanner", text: "Traffic: Speed enforcement active on the bridge into Leonida City." },
      { type: "scanner", text: "BOLO: Stolen yellow Sanchez last seen near the docks. Occupant armed." },
      { type: "priority", text: "Officer down! 10-99 at Grass Rivers. Backup needed immediately!" },
      { type: "scanner", text: "Unit 7-Boy-3: Suspect in custody, requesting transport." },
      { type: "scanner", text: "High-speed pursuit on the freeway. Black Dominator, plates unknown." },
      { type: "priority", text: "Armed robbery in progress at the 24/7 on Main Street. Units en route." }
    ];

    const plates = {
      "VC1234": "Stolen — Black Dominator, linked to recent heist",
      "LEON01": "Registered to local resident — no flags",
      "GTA666": "Wanted — multiple felonies, approach with caution",
      "VCPD1": "Police vehicle — do not stop",
      "AMBRO": "Rental — last seen near Ambrosia resort"
    };

    function addEntry(text, type = "scanner") {
      const div = document.createElement("div");
      div.className = `entry ${type}`;
      div.textContent = text;
      log.appendChild(div);
      log.scrollTop = log.scrollHeight;
    }

    function randomChatter() {
      if (muted) return;
      const entry = chatter[Math.floor(Math.random() * chatter.length)];
      addEntry(entry.text, entry.type === "priority" ? "priority" : "scanner");
      if (entry.type === "priority") {
        wanted = Math.min(5, wanted + 1);
        wantedEl.textContent = wanted;
      }
    }

    async function askAI(question) {
      if (isAI) return;
      isAI = true;
      sendBtn.disabled = true;
      aiStatus.textContent = "AI thinking…";
      addEntry(question, "user");

      const userContext = currentUser ? `The user is signed in as ${currentUser.name}. ` : "";
      const now = Date.now();
      const system = `You are a helpful AI assistant integrated into a GTA VI Vice City Police Department (VCPD) scanner system.
${userContext}You can answer questions about GTA VI lore, Leonida/Vice City locations, police procedures, vehicle info, or any general topic.
Keep answers clear, useful, and in character when relevant.
Current timestamp (ms): ${now}
Never give real-world illegal advice.`;

      const url = `https://text.pollinations.ai/${encodeURIComponent(system + "\n\nUser: " + question)}?temperature=0.7&seed=${now}`;

      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error("HTTP " + res.status);
        let text = (await res.text()).trim();
        if (!text || text.length < 3) throw new Error("Empty");
        addEntry(text, "ai");
        aiStatus.textContent = "AI Ready";
      } catch (e) {
        addEntry("AI is currently unavailable. Try again in a moment.", "ai");
        aiStatus.textContent = "AI Offline";
      }

      isAI = false;
      sendBtn.disabled = false;
      input.focus();
    }

    function send() {
      const text = input.value.trim();
      if (!text || isAI) return;
      input.value = "";
      input.style.height = "auto";
      askAI(text);
    }

    sendBtn.onclick = send;
    input.onkeydown = e => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    };
    input.oninput = () => {
      input.style.height = "auto";
      input.style.height = Math.min(input.scrollHeight, 120) + "px";
    };

    document.getElementById("scanBtn").onclick = () => {
      statusEl.textContent = "Scanning…";
      setTimeout(() => {
        statusEl.textContent = "Channel 1 • Leonida Metro • AI Online";
        randomChatter();
      }, 600);
    };

    document.getElementById("priorityBtn").onclick = () => {
      const pri = chatter.filter(c => c.type === "priority");
      const entry = pri[Math.floor(Math.random() * pri.length)];
      addEntry(entry.text, "priority");
      wanted = Math.min(5, wanted + 1);
      wantedEl.textContent = wanted;
    };

    document.getElementById("lookupBtn").onclick = () => {
      const p = plateInput.value.trim().toUpperCase();
      if (!p) return;
      const result = plates[p] || "No records found";
      addEntry(`Plate ${p}: ${result}`, "scanner");
      plateInput.value = "";
    };

    setInterval(() => {
      if (!muted && Math.random() > 0.7) randomChatter();
      unitsEl.textContent = `Units: ${8 + Math.floor(Math.random() * 10)}`;
    }, 5000);

    addEntry("RootDonate Scanner + Internet AI online.", "scanner");
    addEntry("Sign in with Apple to personalize the AI.", "ai");
  </script>
</body>
</html>
