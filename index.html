<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a0a0f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Root Donate – Items</title>

  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --primary: #00ff9d;
      --accent: #ff00aa;
      --bg: #0a0a0f;
      --card: #111118;
      --border: #222226;
      --text: #e0e0e0;
      --muted: #aaa;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100dvh;
      padding: 16px 12px;
      padding-bottom: max(16px, env(safe-area-inset-bottom));
      display: flex;
      justify-content: center;
      align-items: flex-start;
      line-height: 1.5;
    }

    .container {
      max-width: 420px;
      width: 100%;
      background: var(--card);
      border-radius: 28px;
      border: 1px solid var(--border);
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0, 255, 157, 0.08);
      margin-top: 12px;
    }

    .header {
      background: linear-gradient(135deg, #00ff9d 0%, #ff00aa 100%);
      color: #000;
      padding: 28px 20px 24px;
      text-align: center;
      position: relative;
    }

    .header h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: -0.8px;
    }

    .profile-name {
      font-size: 1.15rem;
      font-weight: 700;
      margin-top: 6px;
      word-break: break-word;
    }

    .header-actions {
      position: absolute;
      top: 12px;
      right: 12px;
      display: flex;
      gap: 6px;
    }

    .header-btn {
      background: rgba(0, 0, 0, 0.18);
      border: none;
      color: #000;
      font-size: 12px;
      font-weight: 600;
      padding: 7px 12px;
      border-radius: 999px;
      cursor: pointer;
      min-height: 32px;
    }

    .content {
      padding: 22px 18px 28px;
    }

    /* Auth */
    .auth-form {
      display: none;
      flex-direction: column;
      gap: 12px;
    }
    .auth-form.active {
      display: flex;
    }

    input, textarea {
      width: 100%;
      padding: 15px 16px;
      border-radius: 14px;
      border: 1px solid #333;
      background: #1a1a22;
      color: white;
      font-size: 16px;
      outline: none;
      font-family: inherit;
      transition: border-color 0.2s;
    }

    input:focus, textarea:focus {
      border-color: var(--primary);
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    .auth-toggle {
      text-align: center;
      margin-top: 8px;
      font-size: 0.9rem;
      color: var(--muted);
    }
    .auth-toggle span {
      color: var(--primary);
      cursor: pointer;
      font-weight: 600;
    }

    .btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 14px;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.15s, opacity 0.2s;
      min-height: 52px;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }

    .primary-btn {
      background: var(--primary);
      color: #000;
    }

    .secondary-btn {
      background: #1f1f26;
      color: white;
      border: 1px solid #333;
      margin-top: 10px;
    }

    .danger-btn {
      background: transparent;
      color: #ff6b6b;
      border: 1px solid #ff6b6b;
      padding: 9px 16px;
      font-size: 0.85rem;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
      min-height: 38px;
    }

    /* Items */
    .section-title {
      font-size: 1.05rem;
      font-weight: 600;
      margin: 4px 0 14px;
      color: #ccc;
    }

    .item-card {
      background: #1a1a22;
      border: 1px solid #2a2a32;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
    }

    .item-title {
      font-weight: 700;
      font-size: 1.05rem;
      margin-bottom: 4px;
      word-break: break-word;
    }

    .item-desc {
      font-size: 0.9rem;
      color: var(--muted);
      margin-bottom: 14px;
      line-height: 1.45;
    }

    .item-actions {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    .offers-list {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid #2a2a32;
      font-size: 0.85rem;
    }

    .offer-item {
      background: #15151c;
      padding: 12px 14px;
      border-radius: 12px;
      margin-bottom: 8px;
    }

    .offer-email {
      color: var(--primary);
      font-weight: 600;
      word-break: break-all;
    }

    .empty-state {
      text-align: center;
      padding: 36px 12px;
      color: #666;
      font-size: 0.95rem;
      line-height: 1.5;
    }

    .add-item-form {
      display: none;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
      padding: 16px;
      background: #1a1a22;
      border-radius: 16px;
      border: 1px solid #2a2a32;
    }
    .add-item-form.active {
      display: flex;
    }

    .own-badge {
      display: none;
      text-align: center;
      font-size: 0.85rem;
      color: var(--primary);
      margin-bottom: 18px;
      font-weight: 600;
    }

    .toast {
      position: fixed;
      bottom: max(28px, env(safe-area-inset-bottom));
      left: 50%;
      transform: translateX(-50%);
      background: #111;
      color: var(--primary);
      padding: 14px 26px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.95rem;
      display: none;
      z-index: 9999;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.55);
      max-width: 90%;
      text-align: center;
    }

    .main-ui {
      display: none;
    }
    .main-ui.active {
      display: block;
    }

    .loading-text {
      text-align: center;
      padding: 60px 20px;
      color: #888;
      font-size: 1rem;
    }

    @media (max-width: 380px) {
      .header {
        padding: 24px 16px 20px;
      }
      .content {
        padding: 18px 14px 24px;
      }
      .header h1 {
        font-size: 1.55rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Root Donate</h1>
      <div class="profile-name" id="profileName">Loading...</div>
      <div class="header-actions">
        <button class="header-btn" id="myProfileBtn" style="display:none;">My Profile</button>
        <button class="header-btn" id="logoutBtn" style="display:none;">Logout</button>
        <button class="header-btn" id="loginHeaderBtn" style="display:none;">Login</button>
      </div>
    </div>

    <div class="content">
      <!-- AUTH -->
      <div class="auth-form" id="loginForm">
        <input type="email" id="loginEmail" placeholder="Email" autocomplete="email">
        <input type="password" id="loginPassword" placeholder="Password" autocomplete="current-password">
        <button class="btn primary-btn" id="loginBtn">Log In</button>
        <div class="auth-toggle">
          Don't have an account? <span id="showSignup">Sign Up</span>
        </div>
      </div>

      <div class="auth-form" id="signupForm">
        <input type="text" id="signupName" placeholder="Display Name" autocomplete="name">
        <input type="text" id="signupHandle" placeholder="Handle (e.g. john)" autocomplete="username">
        <input type="email" id="signupEmail" placeholder="Email" autocomplete="email">
        <input type="password" id="signupPassword" placeholder="Password (min 6 characters)" autocomplete="new-password">
        <button class="btn primary-btn" id="signupBtn">Create Account</button>
        <div class="auth-toggle">
          Already have an account? <span id="showLogin">Log In</span>
        </div>
      </div>

      <!-- MAIN UI -->
      <div class="main-ui" id="mainUI">
        <div class="own-badge" id="ownBadge">This is your profile – add items you need</div>

        <div class="section-title" id="itemsTitle">Items Needed</div>

        <div class="add-item-form" id="addItemForm">
          <input type="text" id="itemTitle" placeholder="Item name (e.g. Winter Jacket)">
          <textarea id="itemDesc" rows="2" placeholder="Short description (optional)"></textarea>
          <button class="btn primary-btn" id="saveItemBtn">Add Item</button>
          <button class="btn secondary-btn" id="cancelItemBtn">Cancel</button>
        </div>

        <button class="btn primary-btn" id="showAddBtn" style="display:none; margin-bottom:20px;">
          + Add Item
        </button>

        <div id="itemsList"></div>

        <button class="btn secondary-btn" id="shareBtn" style="display:none;">
          🔗 Share My Profile Link
        </button>
      </div>

      <div class="loading-text" id="loadingText">Loading...</div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // ========== FIREBASE ==========
    const firebaseConfig = {
      apiKey: "AIzaSyBvcCBsPiMxS7G2evPjM7sANp-zSy_RkKM",
      authDomain: "rootdonate-61e61.firebaseapp.com",
      databaseURL: "https://rootdonate-61e61-default-rtdb.firebaseio.com",
      projectId: "rootdonate-61e61",
      storageBucket: "rootdonate-61e61.firebasestorage.app",
      messagingSenderId: "754240963907",
      appId: "1:754240963907:web:5417c2763d8f02108bdbf6",
      measurementId: "G-0SC5R5ELT1"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    let currentUser = null;
    let viewingUserId = null;
    let profile = {};
    let isOwnProfile = false;
    let items = [];

    // ========== HELPERS ==========
    function showToast(msg) {
      const t = document.getElementById("toast");
      t.textContent = msg;
      t.style.display = "block";
      clearTimeout(t._timeout);
      t._timeout = setTimeout(() => {
        t.style.display = "none";
      }, 3400);
    }

    function escapeHtml(text) {
      if (!text) return "";
      const div = document.createElement("div");
      div.textContent = text;
      return div.innerHTML;
    }

    function showAuth(mode = "login") {
      document.getElementById("loadingText").style.display = "none";
      document.getElementById("mainUI").classList.remove("active");
      document.getElementById("loginForm").classList.toggle("active", mode === "login");
      document.getElementById("signupForm").classList.toggle("active", mode === "signup");
      document.getElementById("profileName").textContent = mode === "login" ? "Welcome back" : "Create Account";
      updateHeaderButtons(false);
    }

    function showMainUI() {
      document.getElementById("loadingText").style.display = "none";
      document.getElementById("loginForm").classList.remove("active");
      document.getElementById("signupForm").classList.remove("active");
      document.getElementById("mainUI").classList.add("active");
    }

    function updateHeaderButtons(loggedIn) {
      document.getElementById("logoutBtn").style.display = loggedIn ? "block" : "none";
      document.getElementById("loginHeaderBtn").style.display = loggedIn ? "none" : "block";
      document.getElementById("myProfileBtn").style.display = loggedIn && !isOwnProfile ? "block" : "none";
    }

    // ========== LOAD PROFILE + ITEMS ==========
    async function loadProfile(uid) {
      if (!uid) return;

      viewingUserId = uid;
      const loading = document.getElementById("loadingText");
      loading.style.display = "block";
      loading.textContent = "Loading profile...";
      document.getElementById("mainUI").classList.remove("active");

      try {
        const doc = await db.collection("users").doc(uid).get();
        if (!doc.exists) {
          showToast("Profile not found");
          loading.textContent = "Profile not found";
          return;
        }

        profile = doc.data();
        isOwnProfile = !!(currentUser && currentUser.uid === uid);

        document.getElementById("profileName").textContent = profile.name || profile.handle || "User";
        document.getElementById("ownBadge").style.display = isOwnProfile ? "block" : "none";
        document.getElementById("showAddBtn").style.display = isOwnProfile ? "block" : "none";
        document.getElementById("shareBtn").style.display = isOwnProfile ? "block" : "none";
        document.getElementById("addItemForm").classList.remove("active");

        // Load items
        const itemsSnap = await db.collection("users").doc(uid).collection("items")
          .orderBy("createdAt", "desc")
          .get();

        items = [];
        for (const itemDoc of itemsSnap.docs) {
          const itemData = { id: itemDoc.id, ...itemDoc.data(), offers: [] };

          if (isOwnProfile) {
            const offersSnap = await db.collection("users").doc(uid)
              .collection("items").doc(itemDoc.id)
              .collection("offers")
              .orderBy("createdAt", "desc")
              .get();

            offersSnap.forEach(o => {
              itemData.offers.push({ id: o.id, ...o.data() });
            });
          }

          items.push(itemData);
        }

        renderItems();
        showMainUI();
        updateHeaderButtons(!!currentUser);
      } catch (err) {
        console.error(err);
        showToast("Failed to load profile");
        loading.textContent = "Error loading profile";
      }
    }

    function renderItems() {
      const list = document.getElementById("itemsList");
      list.innerHTML = "";

      if (items.length === 0) {
        list.innerHTML = `<div class="empty-state">${
          isOwnProfile
            ? "No items yet.<br>Add something you need!"
            : "This person hasn’t added any items yet."
        }</div>`;
        return;
      }

      items.forEach(item => {
        const card = document.createElement("div");
        card.className = "item-card";

        let offersHtml = "";
        if (isOwnProfile && item.offers && item.offers.length > 0) {
          offersHtml = `
            <div class="offers-list">
              <strong style="color:#ccc;">Donation offers (${item.offers.length}):</strong>
              ${item.offers.map(o => `
                <div class="offer-item">
                  <div class="offer-email">${escapeHtml(o.email)}</div>
                  ${o.message ? `<div style="color:#aaa; margin-top:5px;">${escapeHtml(o.message)}</div>` : ""}
                </div>
              `).join("")}
            </div>
          `;
        }

        const actionsHtml = isOwnProfile
          ? `<button class="danger-btn delete-btn" data-id="${item.id}">Delete</button>`
          : `<button class="btn primary-btn claim-btn" style="padding:11px 18px; font-size:0.9rem; width:auto; min-height:42px;" 
               data-id="${item.id}" data-title="${escapeHtml(item.title)}">
               I'll donate this
             </button>`;

        card.innerHTML = `
          <div class="item-title">${escapeHtml(item.title)}</div>
          ${item.description ? `<div class="item-desc">${escapeHtml(item.description)}</div>` : ""}
          <div class="item-actions">${actionsHtml}</div>
          ${offersHtml}
        `;

        list.appendChild(card);
      });

      list.querySelectorAll(".delete-btn").forEach(btn => {
        btn.addEventListener("click", () => deleteItem(btn.dataset.id));
      });

      list.querySelectorAll(".claim-btn").forEach(btn => {
        btn.addEventListener("click", () => {
          claimItem(btn.dataset.id, btn.dataset.title);
        });
      });
    }

    // ========== ADD / DELETE ITEM ==========
    async function saveItem() {
      const title = document.getElementById("itemTitle").value.trim();
      const description = document.getElementById("itemDesc").value.trim();

      if (!title) {
        showToast("Please enter an item name");
        return;
      }

      const btn = document.getElementById("saveItemBtn");
      btn.disabled = true;
      btn.textContent = "Saving...";

      try {
        await db.collection("users").doc(currentUser.uid).collection("items").add({
          title,
          description,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });

        document.getElementById("itemTitle").value = "";
        document.getElementById("itemDesc").value = "";
        document.getElementById("addItemForm").classList.remove("active");
        document.getElementById("showAddBtn").style.display = "block";

        showToast("✅ Item added!");
        await loadProfile(currentUser.uid);
      } catch (err) {
        console.error(err);
        showToast("Failed to add item");
      } finally {
        btn.disabled = false;
        btn.textContent = "Add Item";
      }
    }

    async function deleteItem(itemId) {
      if (!confirm("Delete this item?")) return;

      try {
        await db.collection("users").doc(currentUser.uid).collection("items").doc(itemId).delete();
        showToast("Item deleted");
        await loadProfile(currentUser.uid);
      } catch (err) {
        console.error(err);
        showToast("Failed to delete");
      }
    }

    // ========== CLAIM / DONATE ==========
    async function claimItem(itemId, title) {
      const email = prompt(`Enter your email so ${profile.name || profile.handle || "they"} can contact you about donating "${title}":`);

      if (email === null) return;
      if (!email.trim() || !email.includes("@")) {
        showToast("Please enter a valid email");
        return;
      }

      const message = prompt("Optional short message (size, condition, pickup time…):") || "";

      try {
        await db.collection("users").doc(viewingUserId)
          .collection("items").doc(itemId)
          .collection("offers")
          .add({
            email: email.trim(),
            message: message.trim(),
            donorUid: currentUser ? currentUser.uid : null,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });

        showToast("✅ Offer sent! They will see your email.");
      } catch (err) {
        console.error(err);
        showToast("Failed to send offer. Please try again.");
      }
    }

    // ========== AUTH ==========
    async function handleLogin() {
      const email = document.getElementById("loginEmail").value.trim();
      const password = document.getElementById("loginPassword").value;

      if (!email || !password) {
        showToast("Enter email and password");
        return;
      }

      const btn = document.getElementById("loginBtn");
      btn.disabled = true;
      btn.textContent = "Logging in...";

      try {
        await auth.signInWithEmailAndPassword(email, password);
        showToast("✅ Logged in!");
      } catch (err) {
        showToast(err.message || "Login failed");
        btn.disabled = false;
        btn.textContent = "Log In";
      }
    }

    async function handleSignup() {
      const name = document.getElementById("signupName").value.trim();
      let handle = document.getElementById("signupHandle").value.trim();
      const email = document.getElementById("signupEmail").value.trim();
      const password = document.getElementById("signupPassword").value;

      if (!name || !handle || !email || !password) {
        showToast("Please fill all fields");
        return;
      }
      if (password.length < 6) {
        showToast("Password must be at least 6 characters");
        return;
      }

      if (!handle.startsWith("@")) handle = "@" + handle;
      handle = handle.toLowerCase().replace(/[^a-z0-9@_]/g, "");

      const btn = document.getElementById("signupBtn");
      btn.disabled = true;
      btn.textContent = "Creating...";

      try {
        const cred = await auth.createUserWithEmailAndPassword(email, password);
        await db.collection("users").doc(cred.user.uid).set({
          name,
          handle,
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        });
        showToast("✅ Account created!");
      } catch (err) {
        showToast(err.message || "Sign up failed");
        btn.disabled = false;
        btn.textContent = "Create Account";
      }
    }

    async function handleLogout() {
      await auth.signOut();
      showToast("Logged out");
    }

    function shareProfile() {
      if (!currentUser) return;
      const link = `${window.location.origin}${window.location.pathname}?u=${currentUser.uid}`;
      
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(link)
          .then(() => showToast("✅ Link copied!"))
          .catch(() => prompt("Copy this link:", link));
      } else {
        prompt("Copy this link:", link);
      }
    }

    // ========== EVENTS ==========
    document.getElementById("loginBtn").addEventListener("click", handleLogin);
    document.getElementById("signupBtn").addEventListener("click", handleSignup);
    document.getElementById("logoutBtn").addEventListener("click", handleLogout);
    document.getElementById("loginHeaderBtn").addEventListener("click", () => showAuth("login"));
    document.getElementById("myProfileBtn").addEventListener("click", () => {
      if (currentUser) {
        window.history.replaceState({}, "", `?u=${currentUser.uid}`);
        loadProfile(currentUser.uid);
      }
    });
    document.getElementById("showSignup").addEventListener("click", () => showAuth("signup"));
    document.getElementById("showLogin").addEventListener("click", () => showAuth("login"));

    document.getElementById("showAddBtn").addEventListener("click", () => {
      document.getElementById("addItemForm").classList.add("active");
      document.getElementById("showAddBtn").style.display = "none";
      document.getElementById("itemTitle").focus();
    });

    document.getElementById("cancelItemBtn").addEventListener("click", () => {
      document.getElementById("addItemForm").classList.remove("active");
      document.getElementById("showAddBtn").style.display = "block";
    });

    document.getElementById("saveItemBtn").addEventListener("click", saveItem);
    document.getElementById("shareBtn").addEventListener("click", shareProfile);

    document.getElementById("loginPassword").addEventListener("keydown", e => {
      if (e.key === "Enter") handleLogin();
    });
    document.getElementById("signupPassword").addEventListener("keydown", e => {
      if (e.key === "Enter") handleSignup();
    });

    // ========== INIT ==========
    auth.onAuthStateChanged(async (user) => {
      currentUser = user;
      const urlUserId = new URLSearchParams(window.location.search).get("u");

      if (urlUserId) {
        await loadProfile(urlUserId);
      } else if (user) {
        window.history.replaceState({}, "", `?u=${user.uid}`);
        await loadProfile(user.uid);
      } else {
        showAuth("login");
      }
    });
  </script>
</body>
</html>
