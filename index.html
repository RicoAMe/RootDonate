<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Root Donate</title>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root { --primary: #00ff9d; --bg: #0a0a0f; --card: #111118; }
        * { box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: #e0e0e0;
            margin: 0; padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 480px;
            margin: 40px auto;
            background: var(--card);
            border-radius: 24px;
            box-shadow: 0 25px 60px rgba(0,0,0,0.6);
            overflow: hidden;
        }
        .header {
            background: linear-gradient(135deg, #00ff9d, #00cc7a);
            color: #000;
            padding: 40px 20px;
            text-align: center;
        }
        h1 { margin:0; font-size:2.4rem; font-weight:700; }
        .content { padding:30px; }

        input {
            width:100%; padding:16px; margin:12px 0;
            background:#1c1c24; border:none; border-radius:12px;
            color:white; font-size:1.05rem;
        }
        button {
            width:100%; padding:16px; margin:12px 0;
            border:none; border-radius:12px;
            font-size:1.05rem; font-weight:600; cursor:pointer;
        }
        .btn-primary { background:var(--primary); color:#000; }
        .btn-secondary { background:#333; color:white; }
        .btn-danger { background:#ff4444; color:white; }

        .donation-node, .history-item, .lookup-result {
            background:#1c1c24; border-radius:16px; padding:18px; margin:15px 0;
        }
        .avatar {
            width:52px; height:52px; background:#00ff9d; color:#000;
            border-radius:50%; display:flex; align-items:center; justify-content:center;
            font-size:1.4rem; font-weight:700;
        }

        .amount-btns { display:flex; gap:8px; flex-wrap:wrap; margin-top:12px; }
        .amount-btn { background:#27272f; padding:8px 16px; border-radius:9999px; font-size:0.9rem; cursor:pointer; }
        .amount-btn:hover { background:var(--primary); color:#000; }

        .monzo-link { background:#27272f; padding:12px; border-radius:12px; font-size:0.9rem; word-break:break-all; margin:10px 0; font-family:monospace; }

        #map { height:220px; border-radius:12px; margin-top:12px; }

        .autocomplete-list {
            position:absolute; width:calc(100% - 60px); background:#1c1c24;
            border-radius:12px; max-height:260px; overflow-y:auto; z-index:100;
            box-shadow:0 10px 30px rgba(0,0,0,0.6);
        }
        .autocomplete-item { padding:14px 16px; cursor:pointer; }
        .autocomplete-item:hover { background:#27272f; }

        .lookup-title { margin:30px 0 15px; font-size:1.1rem; }
        .error { color:#ff6666; text-align:center; margin:10px 0; }
    </style>
</head>
<body>

    <!-- Auth Screen -->
    <div class="container" id="authScreen">
        <div class="header"><h1>Root Donate</h1><p>Support creators instantly</p></div>
        <div class="content">
            <h2 id="formTitle" style="text-align:center;margin-bottom:24px;">Create Account</h2>
            <input type="email" id="email" placeholder="Email address" required>
            <input type="password" id="password" placeholder="Password" required>
            <div id="errorMsg" class="error"></div>
            <button class="btn-primary" onclick="handleAuth()">Continue</button>
            <button class="btn-secondary" onclick="toggleForm()">Already have account? Login</button>
        </div>
    </div>

    <!-- Main Dashboard -->
    <div class="container" id="dashboardScreen" style="display:none;">
        <div class="header"><h1 id="userGreeting">Root Donate</h1></div>
        <div class="content">

            <!-- Donation Nodes -->
            <input type="text" id="searchInput" placeholder="Search creators or @usernames..." onkeyup="filterNodes()">
            <h3>Your Donation Nodes</h3>
            <div id="nodesContainer"></div>

            <h3 style="margin:25px 0 15px;">Add New Node</h3>
            <input type="text" id="creatorName" placeholder="Creator / Cause name">
            <input type="text" id="monzoUsername" placeholder="Monzo.me username">
            <button class="btn-primary" onclick="addDonationNode()">Add Node</button>

            <!-- IP Lookup (Domain) -->
            <h3 class="lookup-title">IP Lookup (Domain)</h3>
            <input type="text" id="domainInput" placeholder="google.com or example.com">
            <button class="btn-primary" onclick="lookupIP()">Get IP</button>
            <div id="ipResult" class="lookup-result"></div>

            <!-- Apple Maps Autocomplete Integrated Lookup -->
            <h3 class="lookup-title">Address / Location Lookup (Apple Maps Style)</h3>
            <div style="position:relative;">
                <input type="text" id="addressInput" placeholder="Type address or place name..." onkeyup="handleAddressInput()" autocomplete="off">
                <div id="autocompleteList" class="autocomplete-list" style="display:none;"></div>
            </div>
            <button class="btn-primary" onclick="confirmAddress()">Lookup Location + Apple Maps</button>
            <div id="addressResult" class="lookup-result"></div>
            <div id="map"></div>

            <!-- History -->
            <h3 class="history-title">Recent Donations</h3>
            <div id="historyContainer"></div>

            <button class="btn-secondary" onclick="logout()" style="margin-top:30px;">Logout</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBvcCBsPiMxS7G2evPjM7sANp-zSy_RkKM",
            authDomain: "rootdonate-61e61.firebaseapp.com",
            projectId: "rootdonate-61e61",
            storageBucket: "rootdonate-61e61.firebasestorage.app",
            messagingSenderId: "754240963907",
            appId: "1:754240963907:web:5417c2763d8f02108bdbf6"
        };
        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();

        let currentUserNodes = [], donationHistory = [], mapInstance, selectedPlace = null;

        // Auth
        function toggleForm() {
            const title = document.getElementById('formTitle');
            title.textContent = title.textContent === 'Create Account' ? 'Login' : 'Create Account';
        }
        function handleAuth() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const errorMsg = document.getElementById('errorMsg');
            if (!email || !password) return errorMsg.textContent = "Please fill all fields";

            const isLogin = document.getElementById('formTitle').textContent === 'Login';
            const promise = isLogin 
                ? auth.signInWithEmailAndPassword(email, password)
                : auth.createUserWithEmailAndPassword(email, password);
            promise.then(() => showDashboard()).catch(err => errorMsg.textContent = err.message);
        }
        function showDashboard() {
            document.getElementById('authScreen').style.display = 'none';
            document.getElementById('dashboardScreen').style.display = 'block';
            const user = auth.currentUser;
            document.getElementById('userGreeting').textContent = user ? `Hi, ${user.email.split('@')[0]}` : 'Root Donate';
            loadData();
        }

        function loadData() {
            const user = auth.currentUser;
            if (!user) return;
            currentUserNodes = JSON.parse(localStorage.getItem(`monzoNodes_${user.uid}`)) || [];
            donationHistory = JSON.parse(localStorage.getItem(`donationHistory_${user.uid}`)) || [];
            renderNodes();
            renderHistory();
        }
        function saveNodes() { const user = auth.currentUser; if(user) localStorage.setItem(`monzoNodes_${user.uid}`, JSON.stringify(currentUserNodes)); }
        function saveHistory() { const user = auth.currentUser; if(user) localStorage.setItem(`donationHistory_${user.uid}`, JSON.stringify(donationHistory)); }

        // Donation functions (shortened for brevity - full logic is the same as previous)
        function renderNodes(filtered = currentUserNodes) { /* ... full render code from earlier responses ... */ }
        function filterNodes() { /* ... */ }
        function addDonationNode() { /* ... */ }
        function removeNode(idx) { /* ... */ }
        function quickDonate(username, amount, idx) { /* ... */ }
        function renderHistory() { /* ... */ }
        function logout() { auth.signOut().then(() => { document.getElementById('dashboardScreen').style.display = 'none'; document.getElementById('authScreen').style.display = 'block'; }); }

        // Domain IP Lookup
        async function lookupIP() {
            const domain = document.getElementById('domainInput').value.trim();
            const result = document.getElementById('ipResult');
            if (!domain) return result.innerHTML = `<span class="error">Enter a domain</span>`;
            result.innerHTML = 'Resolving IP...';
            try {
                const res = await fetch(`https://dns.google/resolve?name=${encodeURIComponent(domain)}&type=A`);
                const data = await res.json();
                result.innerHTML = data.Answer ? `<strong>${domain}</strong><br><span style="color:var(--primary)">IP:</span> ${data.Answer.filter(a => a.type === 1).map(a => a.data).join(', ')}` : `<span class="error">No IP found</span>`;
            } catch { result.innerHTML = `<span class="error">Lookup failed</span>`; }
        }

        // Apple Maps Style Autocomplete
        let debounceTimer;
        async function handleAddressInput() {
            clearTimeout(debounceTimer);
            const input = document.getElementById('addressInput');
            const list = document.getElementById('autocompleteList');
            list.style.display = 'none';
            list.innerHTML = '';

            const query = input.value.trim();
            if (query.length < 3) return;

            debounceTimer = setTimeout(async () => {
                try {
                    const res = await fetch(`https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query)}&limit=8`);
                    const places = await res.json();
                    places.forEach(place => {
                        const div = document.createElement('div');
                        div.className = 'autocomplete-item';
                        div.textContent = place.display_name;
                        div.onclick = () => {
                            input.value = place.display_name;
                            selectedPlace = place;
                            list.style.display = 'none';
                        };
                        list.appendChild(div);
                    });
                    if (places.length) list.style.display = 'block';
                } catch (e) {}
            }, 400);
        }

        function confirmAddress() {
            const resultDiv = document.getElementById('addressResult');
            if (!selectedPlace) return resultDiv.innerHTML = `<span class="error">Please select from suggestions first</span>`;

            const lat = parseFloat(selectedPlace.lat);
            const lon = parseFloat(selectedPlace.lon);

            resultDiv.innerHTML = `
                <strong>${selectedPlace.display_name}</strong><br>
                <span style="color:var(--primary)">Lat:</span> ${lat.toFixed(6)} <span style="color:var(--primary)">Lon:</span> ${lon.toFixed(6)}<br><br>
                <a href="https://maps.apple.com/?ll=${lat},${lon}" target="_blank" style="color:var(--primary); text-decoration:underline;">→ Open in Apple Maps</a>
            `;

            if (!mapInstance) {
                mapInstance = L.map('map').setView([lat, lon], 15);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(mapInstance);
            } else {
                mapInstance.setView([lat, lon], 15);
            }
            L.marker([lat, lon]).addTo(mapInstance);
        }

        // Close autocomplete on outside click
        document.addEventListener('click', e => {
            if (!e.target.closest('#addressInput')) document.getElementById('autocompleteList').style.display = 'none';
        });

        auth.onAuthStateChanged(user => { if (user) showDashboard(); });
    </script>
</body>
</html>
