<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#0f172a">
<title>Shared RootDonate</title>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, collection, addDoc, query, orderBy, onSnapshot,
  getDocs, limit, where, doc, writeBatch
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBvcCBsPiMxS7G2evPjM7sANp-zSy_RkKM",
  authDomain: "rootdonate-61e61.firebaseapp.com",
  databaseURL: "https://rootdonate-61e61-default-rtdb.firebaseio.com",
  projectId: "rootdonate-61e61",
  storageBucket: "rootdonate-61e61.firebasestorage.app",
  messagingSenderId: "754240963907",
  appId: "1:754240963907:web:5417c2763d8f02108bdbf6",
  measurementId: "G-0SC5R5ELT1"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;
let memory = [];
let unsubMessages = null;
let unsubShared = null;
let isReplying = false;

const baseDictionary = [
  { input: "who are you", response: "I am a shared-memory Internet AI. I answer from shared memory first, then Wikipedia + Oxford Dictionary, and I auto-save everything." },
  { input: "how do you learn", response: "Every answer I give is automatically saved into shared memory. Next time anyone asks the exact same thing, I reply from the saved memory." },
  { input: "hello", response: "Hi! Ask me anything. I check shared memory first, then Wikipedia + Oxford, and always auto-save the result." }
];

function buildOxfordDictionaryLink(queryText) {
  const cleaned = (queryText || "").trim().toLowerCase()
    .replace(/[^a-z0-9\s-]/g, "")
    .replace(/\s+/g, "-")
    .replace(/-+/g, "-");
  return cleaned
    ? `https://www.oxfordlearnersdictionaries.com/definition/english/${encodeURIComponent(cleaned)}`
    : "https://www.oxfordlearnersdictionaries.com/";
}

async function fetchWikipediaSummary(queryText) {
  try {
    const searchUrl = `https://en.wikipedia.org/w/api.php?action=query&list=search&srsearch=${encodeURIComponent(queryText)}&format=json&origin=*&srlimit=1`;
    const searchRes = await fetch(searchUrl);
    const searchData = await searchRes.json();
    const title = searchData?.query?.search?.[0]?.title;
    if (!title) return null;

    const summaryUrl = `https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(title)}`;
    const summaryRes = await fetch(summaryUrl);
    const data = await summaryRes.json();
    if (data.extract) {
      const wikiUrl = `https://en.wikipedia.org/wiki/${encodeURIComponent(title.replace(/ /g, "_"))}`;
      const oxfordUrl = buildOxfordDictionaryLink(queryText);
      return `${data.extract}\n\nSources:\nWikipedia — ${wikiUrl}\nOxford University Dictionary — ${oxfordUrl}`;
    }
  } catch (e) {
    console.error(e);
  }
  return null;
}

function findExactResponse(input) {
  const clean = (input || "").trim().toLowerCase();
  for (const pair of memory) {
    if ((pair.input || "").trim().toLowerCase() === clean) {
      return pair.response;
    }
  }
  return null;
}

async function loadSharedMemory() {
  try {
    const q = query(collection(db, "shared_memory"), orderBy("createdAt", "desc"), limit(1000));
    const snap = await getDocs(q);
    const shared = snap.docs.map(d => d.data()).reverse();
    memory = [...baseDictionary, ...shared];
  } catch (e) {
    console.error(e);
    memory = [...baseDictionary];
  }
}

function listenSharedMemory() {
  if (unsubShared) unsubShared();
  const q = query(collection(db, "shared_memory"), orderBy("createdAt", "desc"), limit(1000));
  unsubShared = onSnapshot(q, snap => {
    const shared = snap.docs.map(d => d.data()).reverse();
    memory = [...baseDictionary, ...shared];
  });
}

async function saveSharedPair(input, response) {
  if (!currentUser) return;
  try {
    await addDoc(collection(db, "shared_memory"), {
      input: input.trim(),
      response: response.trim(),
      uid: currentUser.uid,
      createdAt: Date.now()
    });
  } catch (e) {
    console.error("Save shared failed:", e);
  }
}

async function saveMessage(role, content) {
  if (!currentUser) return;
  try {
    await addDoc(collection(db, "users", currentUser.uid, "messages"), {
      role, content, createdAt: Date.now()
    });
  } catch (e) {}
}

function addMessageToUI(text, isUser, time) {
  const wrap = document.createElement("div");
  wrap.className = "msg-wrap " + (isUser ? "user" : "bot");
  const div = document.createElement("div");
  div.className = "msg";
  div.textContent = text;
  wrap.appendChild(div);
  if (time) {
    const t = document.createElement("div");
    t.className = "time";
    t.textContent = new Date(time).toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"});
    wrap.appendChild(t);
  }
  const chat = document.getElementById("chat");
  chat.appendChild(wrap);
  chat.scrollTop = chat.scrollHeight;
}

function showTyping(show) {
  let el = document.getElementById("typing");
  if (show && !el) {
    el = document.createElement("div");
    el.id = "typing";
    el.className = "msg-wrap bot";
    el.innerHTML = '<div class="msg typing"><span></span><span></span><span></span></div>';
    document.getElementById("chat").appendChild(el);
  } else if (!show && el) el.remove();
}

async function reply(userText) {
  if (isReplying) return;
  isReplying = true;
  showTyping(true);
  await new Promise(r => setTimeout(r, 450 + Math.random() * 500));

  // 1. Exact match from shared memory
  let response = findExactResponse(userText);

  // 2. If no exact match → Wikipedia + Oxford, then auto-save
  if (!response) {
    response = await fetchWikipediaSummary(userText);
  }

  showTyping(false);

  if (!response) {
    const oxford = buildOxfordDictionaryLink(userText);
    response = `I don't know that yet.\n\nOxford University Dictionary — ${oxford}`;
  }

  addMessageToUI(response, false, Date.now());
  await saveMessage("assistant", response);

  // Always auto-learn into shared memory (includes Oxford)
  await saveSharedPair(userText, response);

  isReplying = false;
}

async function deleteAllUserData() {
  if (!currentUser) return;
  const uid = currentUser.uid;
  try {
    const msgSnap = await getDocs(query(collection(db, "users", uid, "messages")));
    const batch = writeBatch(db);
    msgSnap.docs.forEach(d => batch.delete(d.ref));
    if (!msgSnap.empty) await batch.commit();
  } catch {}
  try {
    const sharedSnap = await getDocs(query(collection(db, "shared_memory"), where("uid", "==", uid)));
    const batch = writeBatch(db);
    sharedSnap.docs.forEach(d => batch.delete(d.ref));
    if (!sharedSnap.empty) await batch.commit();
    await loadSharedMemory();
  } catch {}
}

onAuthStateChanged(auth, async user => {
  if (user) {
    currentUser = user;
    document.getElementById("status").textContent = "Signed in · Shared memory active";
    document.getElementById("signBtn").textContent = "Sign out";
    document.getElementById("input").disabled = false;
    document.getElementById("send").disabled = false;

    await loadSharedMemory();
    listenSharedMemory();

    if (unsubMessages) unsubMessages();
    const q = query(collection(db, "users", user.uid, "messages"), orderBy("createdAt"));
    unsubMessages = onSnapshot(q, snap => {
      document.getElementById("chat").innerHTML = "";
      snap.forEach(d => {
        const data = d.data();
        addMessageToUI(data.content, data.role === "user", data.createdAt);
      });
    });
  } else {
    currentUser = null;
    document.getElementById("status").textContent = "Not signed in";
    document.getElementById("signBtn").textContent = "Sign in";
    document.getElementById("input").disabled = true;
    document.getElementById("send").disabled = true;
    document.getElementById("chat").innerHTML = "";
    if (unsubMessages) unsubMessages();
    if (unsubShared) unsubShared();
    memory = [...baseDictionary];
  }
});

document.getElementById("signBtn").onclick = async () => {
  if (currentUser) {
    if (confirm("Sign out and delete your contributions to shared memory?")) {
      await deleteAllUserData();
      await signOut(auth);
    }
  } else {
    await signInAnonymously(auth);
  }
};

document.getElementById("send").onclick = async () => {
  const input = document.getElementById("input");
  const text = input.value.trim();
  if (!text || !currentUser || isReplying) return;
  input.value = "";
  addMessageToUI(text, true, Date.now());
  await saveMessage("user", text);
  reply(text);
};

document.getElementById("input").onkeydown = e => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    document.getElementById("send").click();
  }
};

document.getElementById("clearBtn").onclick = async () => {
  if (!currentUser) return;
  if (confirm("Delete all your personal messages and shared memory contributions?")) {
    await deleteAllUserData();
    document.getElementById("chat").innerHTML = "";
  }
};
</script>
<style>
:root { --bg:#0b1120; --surface:#1e293b; --accent:#22c55e; --text:#f1f5f9; --muted:#94a3b8; }
* { box-sizing:border-box; margin:0; padding:0; }
body { background:var(--bg); color:var(--text); font-family:system-ui,sans-serif; height:100dvh; display:flex; flex-direction:column; }
header { background:#1e293b; padding:0.8rem 1rem; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #334155; }
.logo { font-weight:700; }
#status { font-size:0.75rem; color:var(--muted); }
#chat { flex:1; overflow-y:auto; padding:1rem; display:flex; flex-direction:column; gap:0.75rem; }
.msg-wrap { max-width:82%; display:flex; flex-direction:column; }
.msg-wrap.user { align-self:flex-end; }
.msg-wrap.bot { align-self:flex-start; }
.msg { padding:0.75rem 1rem; border-radius:16px; white-space:pre-wrap; line-height:1.45; }
.user .msg { background:var(--accent); color:#000; }
.bot .msg { background:var(--surface); border:1px solid #334155; }
.time { font-size:0.65rem; color:var(--muted); margin-top:0.25rem; }
.typing span { display:inline-block; width:6px; height:6px; background:var(--muted); border-radius:50%; margin:0 2px; animation:bounce 1.2s infinite; }
.typing span:nth-child(2){animation-delay:.2s} .typing span:nth-child(3){animation-delay:.4s}
@keyframes bounce { 0%,80%,100%{transform:scale(.6);opacity:.5} 40%{transform:scale(1);opacity:1} }
.input-bar { display:flex; gap:0.5rem; padding:0.7rem; background:#1e293b; border-top:1px solid #334155; }
#input { flex:1; min-height:44px; padding:0.7rem 1rem; border:none; border-radius:22px; background:#334155; color:var(--text); font-size:1rem; resize:none; }
#send, #signBtn, #clearBtn { border:none; cursor:pointer; font-weight:600; }
#send { width:44px; height:44px; border-radius:50%; background:var(--accent); color:#000; font-size:1.2rem; }
#signBtn, #clearBtn { padding:0 0.9rem; height:36px; border-radius:10px; font-size:0.85rem; }
#signBtn { background:#3b82f6; color:white; }
#clearBtn { background:#64748b; color:white; }
</style>
</head>
<body>
<header>
  <div>
    <div class="logo">Shared RootDonate</div>
    <div id="status">Not signed in</div>
  </div>
  <div style="display:flex;gap:0.4rem">
    <button id="clearBtn">Clear data</button>
    <button id="signBtn">Sign in</button>
  </div>
</header>
<div id="chat"></div>
<div class="input-bar">
  <textarea id="input" placeholder="Ask anything…" rows="1" disabled></textarea>
  <button id="send" disabled>↑</button>
</div>
</body>
</html>
