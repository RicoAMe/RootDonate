<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI NPCs Gain Money · Date.now()</title>
<style>
  :root { --bg:#070a0e; --card:#1a2230; --text:#f0f4f8; --muted:#8b9bb0; --accent:#5eb0ff; --good:#4ade80; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,sans-serif; background:var(--bg); color:var(--text); display:flex; flex-direction:column; min-height:100vh; }
  header { padding:12px 16px; background:#0f141c; border-bottom:1px solid #2c3a4d; display:flex; justify-content:space-between; align-items:center; }
  h1 { margin:0; font-size:17px; }
  .stats { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; padding:12px 16px; }
  .stat { background:var(--card); border:1px solid #2c3a4d; border-radius:12px; padding:8px; text-align:center; }
  .stat .label { font-size:11px; color:var(--muted); }
  .stat .value { font-size:16px; font-weight:650; }
  .npcs { display:flex; gap:8px; padding:0 16px 10px; overflow-x:auto; }
  .npc { min-width:130px; background:var(--card); border:1px solid #2c3a4d; border-radius:12px; padding:8px 10px; cursor:pointer; font-size:13px; }
  .npc.active { border-color:var(--accent); background:#1c2a40; }
  .log { flex:1; overflow-y:auto; padding:10px 16px; font-size:14px; line-height:1.4; }
  .msg { margin:6px 0; padding:8px 12px; border-radius:10px; background:#161e2a; border:1px solid #2c3a4d; }
  .msg.system { color:var(--muted); font-size:13px; }
  .actions { display:grid; grid-template-columns:1fr 1fr; gap:8px; padding:0 16px 16px; }
  button { background:var(--card); color:var(--text); border:1px solid #2c3a4d; border-radius:12px; padding:12px; font-size:14px; cursor:pointer; }
  button:active { transform:scale(0.97); }
  .time { text-align:center; color:var(--muted); font-size:13px; padding:4px; }
  .stage { text-align:center; color:var(--accent); font-weight:600; padding:4px 16px 0; }
  .gdpr { background:#1a2a20; border-bottom:1px solid #4ade80; padding:8px 16px; font-size:12px; color:#a0d8b0; text-align:center; }
  .guest-badge { color:var(--good); font-size:12px; margin-left:8px; }
</style>
</head>
<body>
<div id="gdpr-banner" class="gdpr" style="display:none;">
  Guest mode (GDPR): This is a temporary shared snapshot. No data is stored on your device. Close the tab to discard. No cookies or tracking.
</div>
<header>
  <h1>AI NPCs · Money Gain <span id="guest-badge" class="guest-badge" style="display:none;">· GUEST</span></h1>
  <div id="online-time">0m</div>
</header>

<div class="stage" id="stage">Outpost</div>
<div class="stats">
  <div class="stat"><div class="label">Money</div><div class="value" id="money">1000</div></div>
  <div class="stat"><div class="label">People</div><div class="value" id="pop">12</div></div>
  <div class="stat"><div class="label">Happy</div><div class="value" id="happy">62</div></div>
  <div class="stat"><div class="label">Influence</div><div class="value" id="inf">5</div></div>
</div>
<div class="time">Next reward in <span id="next-reward">5m</span> · Auto actions via Date.now()</div>

<div class="npcs" id="npcs"></div>
<div class="log" id="log"></div>
<div class="actions">
  <button onclick="doAction('tax')">Raise Taxes (+160)</button>
  <button onclick="doAction('build')">Build Housing (200)</button>
  <button onclick="doAction('festival')">Festival (120)</button>
  <button onclick="forceSpend()">Force Population Spend</button>
  <button onclick="forceTrade()">Force Trade</button>
  <button onclick="forcePrize()">Force Money Prize</button>
  <button onclick="toggleAuto()">Toggle Auto AI</button>
  <button onclick="generateGuestURL()">Generate Guest URL</button>
</div>

<script>
const state = {
  money: 1000, pop: 12, happy: 62, influence: 5, stage: 0,
  stages: ["Outpost","Settlement","Town","City"],
  selected: 0,
  npcs: [
    { name: "Aria", role: "Advisor", loyalty: 70, personality: "pragmatic" },
    { name: "Borin", role: "Merchant", loyalty: 55, personality: "greedy" },
    { name: "Cora", role: "Citizen Lead", loyalty: 80, personality: "idealistic" },
    { name: "Dax", role: "Worker", loyalty: 45, personality: "blunt" }
  ],
  auto: true,
  lastSpend: 0,
  lastTrade: 0,
  lastPrize: 0,
  sessionStart: Date.now(),
  lastReward: Date.now(),
  isGuest: false
};

const SPEND_MS = 45_000;
const TRADE_MS = 60_000;
const REWARD_MS = 5 * 60_000;
const PRIZE_MS = 3.5 * 60_000;
const REWARD_AMT = 40;

function isGuestMode() {
  return location.hash.startsWith("#g=");
}

function save() {
  if (state.isGuest) return; // GDPR: never write localStorage in guest mode
  const toSave = {...state};
  toSave.sessionOffset = Date.now() - state.sessionStart;
  toSave.rewardOffset = Date.now() - state.lastReward;
  delete toSave.isGuest;
  localStorage.setItem("npcMoneyGame", JSON.stringify(toSave));
}

function load() {
  if (isGuestMode()) {
    state.isGuest = true;
    document.getElementById("gdpr-banner").style.display = "block";
    document.getElementById("guest-badge").style.display = "inline";
    try {
      const encoded = location.hash.slice(3);
      const data = JSON.parse(decodeURIComponent(escape(atob(encoded))));
      Object.assign(state, data);
      state.isGuest = true;
      state.sessionStart = Date.now();
      state.lastReward = Date.now();
      state.lastSpend = Date.now();
      state.lastTrade = Date.now();
      state.lastPrize = Date.now();
      addMsg("Loaded guest snapshot (GDPR: nothing saved locally).", true);
    } catch (e) {
      addMsg("Invalid guest URL. Starting fresh (guest).", true);
    }
    return;
  }

  const saved = localStorage.getItem("npcMoneyGame");
  if (saved) {
    const data = JSON.parse(saved);
    Object.assign(state, data);
    state.sessionStart = Date.now() - (data.sessionOffset || 0);
    state.lastReward = Date.now() - (data.rewardOffset || 0);
    state.lastPrize = state.lastPrize || Date.now();
  }
}

function addMsg(text, system = false) {
  const div = document.createElement("div");
  div.className = "msg" + (system ? " system" : "");
  div.textContent = text;
  const log = document.getElementById("log");
  log.prepend(div);
  while (log.children.length > 30) log.removeChild(log.lastChild);
}

function render() {
  document.getElementById("money").textContent = state.money;
  document.getElementById("pop").textContent = state.pop;
  document.getElementById("happy").textContent = state.happy;
  document.getElementById("inf").textContent = state.influence;
  document.getElementById("stage").textContent = state.stages[state.stage] || "Outpost";

  const now = Date.now();
  document.getElementById("online-time").textContent = Math.floor((now - state.sessionStart) / 60000) + "m";
  document.getElementById("next-reward").textContent = Math.max(0, Math.floor((REWARD_MS - (now - state.lastReward)) / 60000)) + "m";

  const el = document.getElementById("npcs");
  el.innerHTML = "";
  state.npcs.forEach((n, i) => {
    const d = document.createElement("div");
    d.className = "npc" + (i === state.selected ? " active" : "");
    d.innerHTML = `<strong>${n.name}</strong><br><span style="font-size:11px;color:var(--muted)">${n.role}</span><br>Loy: ${n.loyalty}`;
    d.onclick = () => { state.selected = i; render(); addMsg(`Talking to ${n.name} (${n.personality})`); };
    el.appendChild(d);
  });
  save();
}

function populationSpend() {
  if (!state.auto || state.money < 60) return;
  const npc = state.npcs[Math.floor(Math.random() * state.npcs.length)];
  let action = null, cost = 0, msg = "";

  if (state.pop < 60 && state.money >= 180 && (npc.personality === "pragmatic" || npc.personality === "blunt" || Math.random() < 0.45)) {
    action = "build"; cost = 180; msg = `${npc.name} pushed for efficient housing.`;
  } else if (state.happy < 55 && state.money >= 100) {
    action = "festival"; cost = 100; msg = `${npc.name} organized a cheap festival.`;
  } else if (npc.personality === "greedy" && state.influence < 25 && state.money >= 70) {
    action = "promote"; cost = 70; msg = `${npc.name} invested in influence.`;
  } else if (state.money >= 250 && Math.random() < 0.55) {
    action = "build"; cost = 200; msg = "Population demand forced new housing.";
  }
  if (!action) return;

  state.money -= cost;
  if (action === "build") {
    state.pop += 6 + Math.floor(state.stage * 1.5);
    state.happy = Math.max(20, state.happy - 2);
  } else if (action === "festival") {
    state.happy = Math.min(100, state.happy + 15);
  } else if (action === "promote") {
    state.influence += 2;
    state.npcs.forEach(n => n.loyalty = Math.min(100, n.loyalty + 3));
  }
  const passive = Math.floor(state.pop * 0.4 + state.stage * 8);
  state.money += passive;
  msg += ` Passive +${passive}.`;

  checkStage();
  render();
  addMsg(msg + ` Money: ${state.money}`, true);
}

function populationTrade() {
  if (!state.auto) return;
  const npc = state.npcs.find(n => n.personality === "greedy") || state.npcs[0];
  const loyaltyBonus = Math.floor((npc.loyalty || 50) / 20);
  const myPower = state.influence + Math.floor(state.pop / 12) + state.stage * 4 + loyaltyBonus + Math.floor(Math.random() * 5);
  const theirPower = 8 + Math.floor(Math.random() * 15);

  let profit = 0, result = "";
  if (myPower > theirPower + 2) {
    profit = 50 + Math.floor(Math.random() * 90) + state.influence * 3 + state.stage * 15 + loyaltyBonus * 10;
    result = `${npc.name} closed a strong trade. +${profit}`;
    state.influence = Math.min(60, state.influence + 1);
  } else if (myPower >= theirPower - 3) {
    profit = 20 + Math.floor(Math.random() * 40) + state.stage * 5;
    result = `${npc.name} made a solid trade. +${profit}`;
  } else {
    profit = -(8 + Math.floor(Math.random() * 20));
    result = `${npc.name} took a bad trade. ${profit}`;
    state.happy = Math.max(10, state.happy - 1);
  }
  state.money = Math.max(0, state.money + profit);
  render();
  addMsg(result + ` · Money: ${state.money}`, true);
}

function moneyPrize() {
  const prizes = [
    { amt: 60 + Math.floor(Math.random()*80), msg: "Lucky merchant caravan! ", side: () => { state.happy = Math.min(100, state.happy + 4); } },
    { amt: 40 + Math.floor(Math.random()*50), msg: "Tax surplus discovered. ", side: null },
    { amt: 90 + state.stage * 20, msg: "Influence deal paid out. ", side: () => { state.influence += 1; } },
    { amt: 30 + Math.floor(state.pop * 0.8), msg: "Population productivity bonus. ", side: null },
    { amt: 120 + Math.floor(Math.random()*100), msg: "Rare treasure found by workers! ", side: () => { state.npcs.forEach(n => n.loyalty = Math.min(100, n.loyalty + 2)); } }
  ];
  const p = prizes[Math.floor(Math.random() * prizes.length)];
  state.money += p.amt;
  if (p.side) p.side();
  addMsg(p.msg + `+${p.amt} money prize!`, true);
  checkStage();
  render();
}

function checkStage() {
  if (state.pop >= 40 && state.stage < 1) { state.stage = 1; addMsg("Stage up: Settlement!", true); }
  else if (state.pop >= 80 && state.stage < 2) { state.stage = 2; addMsg("Stage up: Town!", true); }
  else if (state.pop >= 140 && state.stage < 3) { state.stage = 3; addMsg("Stage up: City!", true); }
}

function doAction(action) {
  if (action === "tax") {
    state.money += 160;
    state.happy = Math.max(15, state.happy - 8);
  } else if (action === "build" && state.money >= 200) {
    state.money -= 200;
    state.pop += 5;
  } else if (action === "festival" && state.money >= 120) {
    state.money -= 120;
    state.happy = Math.min(100, state.happy + 14);
  } else {
    addMsg("Not enough money.", true);
    return;
  }
  checkStage();
  render();
  addMsg(`You performed ${action}.`, true);
}

function forceSpend() { populationSpend(); }
function forceTrade() { populationTrade(); }
function forcePrize() { moneyPrize(); }
function toggleAuto() {
  state.auto = !state.auto;
  addMsg(`Auto AI ${state.auto ? "ON" : "OFF"}`, true);
  render();
}

function generateGuestURL() {
  const snapshot = {...state};
  delete snapshot.isGuest;
  delete snapshot.sessionStart;
  delete snapshot.lastReward;
  delete snapshot.lastSpend;
  delete snapshot.lastTrade;
  delete snapshot.lastPrize;
  const encoded = btoa(unescape(encodeURIComponent(JSON.stringify(snapshot))));
  const url = location.origin + location.pathname + "#g=" + encoded;
  prompt("GDPR Guest URL (share this — no local storage on their side):", url);
  addMsg("Guest URL generated. Recipients load snapshot only.", true);
}

// Main loop driven by Date.now()
setInterval(() => {
  const now = Date.now();
  if (now - state.lastSpend >= SPEND_MS) {
    populationSpend();
    state.lastSpend = now;
  }
  if (now - state.lastTrade >= TRADE_MS) {
    populationTrade();
    state.lastTrade = now;
  }
  if (now - state.lastReward >= REWARD_MS) {
    state.money += REWARD_AMT;
    state.lastReward = now;
    addMsg(`Online reward +${REWARD_AMT}`, true);
    render();
  }
  if (now - state.lastPrize >= PRIZE_MS) {
    if (state.auto && Math.random() < 0.75) moneyPrize();
    state.lastPrize = now;
  }
  render();
}, 10_000);

load();
render();
addMsg("AI NPCs active. Timers use Date.now(). Spend ~45s, Trade ~60s, Reward every 5 min, Prize ~3.5 min. " + (state.isGuest ? "GUEST MODE (GDPR)." : "Progress saved."), true);
</script>
</body>
</html>
